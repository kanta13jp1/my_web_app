<!doctype html>
<html lang="ja"><head><base href="/"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; form-action 'none'; base-uri 'self'">
<title>PR #5125 架空データプレビュー</title>
<style>body{margin:0;font-family:sans-serif}nav{box-sizing:border-box;position:fixed;top:0;left:0;width:100%;z-index:10000;background:#edf8f5;padding:8px;display:flex;align-items:center;gap:10px;height:62px}label{font-size:12px}select{max-width:65vw;padding:8px}flutter-view{top:62px!important;height:calc(100% - 62px)!important}</style>
</head><body>
<nav aria-label="プレビュー画面選択"><label for="screen">#5125<br>架空データ・DB接続なし</label><select id="screen" aria-label="確認する画面">
<option value="note-list">ノート一覧・検索</option><option value="note-editor">ノート編集・Markdown</option><option value="import">インポート</option><option value="note-collections">ノートブック・スタック・Space</option><option value="note-tags">階層タグ</option><option value="note-navigation">保存済み検索・ショートカット</option><option value="note-tasks">Tasks・通知</option><option value="space-sharing">Space共有</option></select></nav>
<script>
// Defense in depth, installed before the Flutter bootstrap. Deny off-origin I/O
// and file selection, even if a normal production widget tries to invoke them.
window.previewBlocked=[];
function checkURL(raw){const u=new URL(raw instanceof Request?raw.url:raw,location.href);if(u.origin!==location.origin){window.previewBlocked.push(u.origin);throw new Error('Offline preview blocks external requests');}return u;}
const realFetch=window.fetch.bind(window);window.fetch=(url,options)=>{checkURL(url);return realFetch(url,options);};
const realOpen=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url,...args){checkURL(url);return realOpen.call(this,method,url,...args);};
window.WebSocket=class{constructor(){throw new Error('Realtime is disabled in the offline preview');}};
window.EventSource=class{constructor(){throw new Error('External events are disabled in the offline preview');}};
navigator.sendBeacon=()=>false;
window.open=(url)=>{checkURL(url);throw new Error('Popups are disabled in the offline preview');};
if('showOpenFilePicker' in window) window.showOpenFilePicker=async()=>{throw new Error('Personal files are disabled in the offline preview');};
document.addEventListener('submit',e=>e.preventDefault(),true);
document.addEventListener('click',e=>{const a=e.target instanceof Element?e.target.closest('a[href]'):null;if(a){try{checkURL(a.href);}catch(_){e.preventDefault();}}},true);
document.addEventListener('click',e=>{if(e.target instanceof HTMLInputElement && e.target.type==='file'){e.preventDefault();alert('架空データ版ではファイルを選択できません。');}},true);
const select=document.getElementById('screen');select.value=new URL(location.href).searchParams.get('screen')||'note-list';select.onchange=()=>{location.href='/?screen='+encodeURIComponent(select.value);};
</script>
<script src="flutter_bootstrap.js" async></script>
</body></html>
