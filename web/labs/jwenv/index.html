<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev WebGPU Demo</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e1dc;
    --accent: #2f6fdb; --accent-soft: #dbe6fa; --bar: #9db8e8; --error: #b3261e; --ok: #2e7d32;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --border: #34332f;
      --accent: #7aa7f5; --accent-soft: #24324b; --bar: #3d5f99; --error: #f28b82; --ok: #81c995; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], textarea, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input[type=text] { flex: 1; min-width: 200px; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .checks { display: flex; gap: 18px; margin: 12px 0; flex-wrap: wrap; font-size: 14px; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; margin: 0; color: var(--text); }
  #status { font-size: 13px; margin-top: 10px; color: var(--muted); word-break: break-all; }
  #status[data-kind=error] { color: var(--error); }
  #status[data-kind=ok] { color: var(--ok); }
  progress { width: 100%; margin-top: 8px; }
  .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .examples button { padding: 3px 10px; font-size: 13px; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow-x: auto; margin: 12px 0 0; }
  .note { font-size: 13px; color: var(--muted); }
  .steps { margin: 0 0 12px; padding-left: 1.4em; font-size: 14px; }
  .steps li { margin: 4px 0; }
  .steps a { color: var(--accent); }
  code { font-family: var(--mono); font-size: 13px; }
  .note a { color: var(--accent); }
  #api-note { margin: 10px 0 0; }
  .page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lang { display: inline-flex; }
  .lang button { padding: 3px 10px; font-size: 13px; border-radius: 0; }
  .lang button:first-child { border-radius: 6px 0 0 6px; }
  .lang button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .lang button[aria-pressed=true] { background: var(--accent); color: #fff; }
  /* モデル読み込み（折りたたみ） */
  details.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
  details.panel > summary { cursor: pointer; padding: 12px 18px; list-style: none; display: flex; gap: 10px; align-items: baseline; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.panel[open] > summary::before { transform: rotate(90deg); }
  details.panel > summary h2 { margin: 0; }
  #model-name, #server-model-name { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #model-name[data-state=none] { color: var(--muted); font-family: inherit; }
  .panel-body { padding: 0 18px 18px; }
  .server-model { display: flex; gap: 10px; align-items: baseline; }
  .server-model h2 { margin: 0; }
  /* 入力 : 結果グラフ = 3 : 1 */
  .io { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .io > section { margin-bottom: 0; }
  .io + section { margin-top: 16px; }
  #run-status { font-size: 13px; margin-left: 10px; color: var(--muted); }
  #run-status[data-kind=error] { color: var(--error); }
  /* 質問カード */
  .qhead { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 6px; }
  .qhead h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0; }
  .qcard { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 12px; margin-bottom: 10px; }
  .qcard .qtop { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 8px; align-items: center; }
  .qcard .qtop input { font-family: var(--mono); font-size: 13px; }
  .qcard .qtop select { padding: 7px 8px; }
  .qcard label { margin-top: 8px; }
  .qcard textarea { font-size: 14px; }
  button.icon { padding: 4px 10px; background: transparent; color: var(--muted); border-color: var(--border); }
  button.add { padding: 5px 12px; font-size: 13px; }
  /* 結果 */
  .ans { margin-bottom: 16px; }
  .ans-head { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; margin-bottom: 4px; }
  .ans-id { font-family: var(--mono); font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ans-type { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .ans-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-family: var(--mono); }
  .bar-row { margin: 0 0 6px; }
  .bar-label { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-line { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; }
  .bar-track { height: 12px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--bar); }
  .bar-row.top .bar-fill { background: var(--accent); }
  .bar-row.top .bar-label { font-weight: 600; }
  .bar-value { text-align: right; font-family: var(--mono); font-size: 12px; }
  .tabs { display: flex; gap: 4px; align-items: flex-end; border-bottom: 1px solid var(--border); }
  .tab { background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 12px; font-size: 14px; }
  .tab[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-note { margin-left: auto; padding: 6px 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) { .io { grid-template-columns: 1fr; } .qcard .qtop { grid-template-columns: 1fr 110px auto; } }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <h1>Jev WebGPU Demo</h1>
    <div class="lang" role="group" aria-label="Language">
      <button class="secondary" data-lang="ja">日本語</button><button class="secondary" data-lang="en">English</button>
    </div>
  </div>
  <p class="lead" id="lead" data-i18n="lead.serverless"></p>

  <details class="panel" id="model-panel" open>
    <summary><h2 data-i18n="model.title"></h2><span id="model-name" data-state="none"></span></summary>
    <div class="panel-body">
      <ol class="steps">
        <li data-i18n-html="model.step1"></li>
        <li data-i18n="model.step2"></li>
      </ol>
      <input id="model-file" type="file" accept=".gguf" aria-label="GGUF">
      <progress id="progress" max="1" value="0" hidden></progress>
      <div id="status"></div>
    </div>
  </details>
  <section class="server-model" id="server-model" hidden>
    <h2 data-i18n="model.title"></h2><span id="server-model-name"></span>
  </section>

  <div class="io">
  <section>
    <h2 data-i18n="input.title"></h2>
    <div class="examples" id="examples"></div>
    <label for="state" data-i18n="state.label"></label>
    <textarea id="state" rows="4"></textarea>
    <div class="qhead"><h3 data-i18n="questions.title"></h3><button class="secondary add" id="add-question" data-i18n="questions.add"></button></div>
    <div id="questions"></div>
    <div class="checks">
      <label><input id="calibrated" type="checkbox" checked> <span data-i18n="opt.calibrated"></span></label>
      <label><input id="debias" type="checkbox"> <span data-i18n="opt.debias"></span></label>
    </div>
    <button id="run" disabled data-i18n="run"></button><span id="run-status"></span>
  </section>

  <section>
    <h2 data-i18n="result.title"></h2>
    <div id="result"><p class="note" data-i18n="result.empty"></p></div>
  </section>
  </div>

  <section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-request" aria-controls="json-req" aria-selected="false" data-i18n="tab.request"></button>
      <button class="tab" role="tab" id="tab-response" aria-controls="json" aria-selected="true" data-i18n="tab.response"></button>
      <span class="tab-note" id="endpoint">POST /v1/systemone</span>
    </div>
    <pre id="json-req" role="tabpanel" aria-labelledby="tab-request" hidden></pre>
    <pre id="json" role="tabpanel" aria-labelledby="tab-response"></pre>
    <p class="note" id="api-note" data-i18n-html="apiNote" hidden></p>
  </section>
</main>
<script type="module" src="dist/web/src/app.js"></script>
</body>
</html>
