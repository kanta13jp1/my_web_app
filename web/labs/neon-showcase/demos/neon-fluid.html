<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #04060D; }
  #gl { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; }
  #hud { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; pointer-events: none; }
</style>
</head>
<body data-stage="1280x720" data-sound="cinema">
<canvas id="gl" width="1280" height="720"></canvas>
<canvas id="hud" width="1280" height="720"></canvas>
<script>
const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const hudCanvas = document.getElementById('hud');
const hctx = hudCanvas.getContext('2d');

gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

const W = 1280, H = 720;
const SIM_W = 256, SIM_H = 144;
const DYE_W = 1024, DYE_H = 576;

const baseVS = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const splatFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTarget;
uniform float uAspect;
uniform vec2 uPoint;
uniform vec3 uValue;
uniform float uRadius;
out vec4 fragColor;
void main() {
  vec2 p = vUv - uPoint;
  p.x *= uAspect;
  vec3 splat = exp(-dot(p, p) / uRadius) * uValue;
  vec3 base = texture(uTarget, vUv).xyz;
  fragColor = vec4(base + splat, 1.0);
}`;

const advectFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uVel;
uniform sampler2D uSource;
uniform vec2 uTexelSize;
uniform float uDt;
uniform float uDissipation;
out vec4 fragColor;
void main() {
  vec2 coord = vUv - uDt * texture(uVel, vUv).xy * uTexelSize;
  fragColor = uDissipation * texture(uSource, coord);
}`;

const curlFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uVel;
uniform vec2 uTexelSize;
out vec4 fragColor;
void main() {
  float L = texture(uVel, vUv - vec2(uTexelSize.x, 0.0)).y;
  float R = texture(uVel, vUv + vec2(uTexelSize.x, 0.0)).y;
  float T = texture(uVel, vUv + vec2(0.0, uTexelSize.y)).x;
  float B = texture(uVel, vUv - vec2(0.0, uTexelSize.y)).x;
  float vorticity = R - L - T + B;
  fragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
}`;

const vorticityFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uVel;
uniform sampler2D uCurl;
uniform vec2 uTexelSize;
uniform float uCurlStrength;
uniform float uDt;
out vec4 fragColor;
void main() {
  float L = texture(uCurl, vUv - vec2(uTexelSize.x, 0.0)).x;
  float R = texture(uCurl, vUv + vec2(uTexelSize.x, 0.0)).x;
  float T = texture(uCurl, vUv + vec2(0.0, uTexelSize.y)).x;
  float B = texture(uCurl, vUv - vec2(0.0, uTexelSize.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 1e-4;
  force *= uCurlStrength * C;
  vec2 vel = texture(uVel, vUv).xy + force * uDt;
  fragColor = vec4(vel, 0.0, 1.0);
}`;

const divFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uVel;
uniform vec2 uTexelSize;
out vec4 fragColor;
void main() {
  float L = texture(uVel, vUv - vec2(uTexelSize.x, 0.0)).x;
  float R = texture(uVel, vUv + vec2(uTexelSize.x, 0.0)).x;
  float T = texture(uVel, vUv + vec2(0.0, uTexelSize.y)).y;
  float B = texture(uVel, vUv - vec2(0.0, uTexelSize.y)).y;
  float div = 0.5 * (R - L + T - B);
  fragColor = vec4(div, 0.0, 0.0, 1.0);
}`;

const pressureFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uPressure;
uniform sampler2D uDiv;
uniform vec2 uTexelSize;
out vec4 fragColor;
void main() {
  float L = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
  float T = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x;
  float B = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
  float div = texture(uDiv, vUv).x;
  float p = (L + R + B + T - div) * 0.25;
  fragColor = vec4(p, 0.0, 0.0, 1.0);
}`;

const gradSubFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uPressure;
uniform sampler2D uVel;
uniform vec2 uTexelSize;
out vec4 fragColor;
void main() {
  float L = texture(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
  float T = texture(uPressure, vUv + vec2(0.0, uTexelSize.y)).x;
  float B = texture(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
  vec2 vel = texture(uVel, vUv).xy - vec2(R - L, T - B) * 0.5;
  fragColor = vec4(vel, 0.0, 1.0);
}`;

const displayFS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uDye;
uniform vec2 uTexelSize;
out vec4 fragColor;
void main() {
  vec3 c = texture(uDye, vUv).rgb;
  // Liquid sheen / pseudo-3D specular from dye gradient
  vec3 cR = texture(uDye, vUv + vec2(uTexelSize.x * 2.0, 0.0)).rgb;
  vec3 cL = texture(uDye, vUv - vec2(uTexelSize.x * 2.0, 0.0)).rgb;
  vec3 cT = texture(uDye, vUv + vec2(0.0, uTexelSize.y * 2.0)).rgb;
  vec3 cB = texture(uDye, vUv - vec2(0.0, uTexelSize.y * 2.0)).rgb;
  float dx = length(cR) - length(cL);
  float dy = length(cT) - length(cB);
  vec3 n = normalize(vec3(-dx * 2.2, -dy * 2.2, 0.25));
  vec3 ld = normalize(vec3(0.4, 0.7, 0.8));
  float spec = pow(max(dot(n, ld), 0.0), 22.0) * min(1.0, length(c) * 1.6);

  vec3 bg = vec3(0.012, 0.016, 0.032);
  vec3 col = bg + c + vec3(0.85, 0.94, 1.0) * spec * 0.42;
  // Tone map
  col = col / (1.0 + col * 0.35);
  col = pow(max(col, 0.0), vec3(0.92));
  fragColor = vec4(col, 1.0);
}`;

function createProg(fs) {
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, baseVS); gl.compileShader(vs);
  const fsh = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fsh, fs); gl.compileShader(fsh);
  if (!gl.getShaderParameter(fsh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(fsh));
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fsh); gl.linkProgram(p);
  return p;
}

const pSplat = createProg(splatFS);
const pAdvect = createProg(advectFS);
const pCurl = createProg(curlFS);
const pVort = createProg(vorticityFS);
const pDiv = createProg(divFS);
const pPress = createProg(pressureFS);
const pGrad = createProg(gradSubFS);
const pDisplay = createProg(displayFS);

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function blit(target) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, target ? target.w : W, target ? target.h : H);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function createFBO(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fbo, w, h };
}

function createDoubleFBO(w, h) {
  let f1 = createFBO(w, h), f2 = createFBO(w, h);
  return {
    get read() { return f1; },
    get write() { return f2; },
    swap() { const t = f1; f1 = f2; f2 = t; },
    w, h
  };
}

const velocity = createDoubleFBO(SIM_W, SIM_H);
const dye = createDoubleFBO(DYE_W, DYE_H);
const divergence = createFBO(SIM_W, SIM_H);
const curl = createFBO(SIM_W, SIM_H);
const pressure = createDoubleFBO(SIM_W, SIM_H);

function splat(x, y, vx, vy, color, radius) {
  gl.useProgram(pSplat);
  gl.uniform1f(gl.getUniformLocation(pSplat, 'uAspect'), W / H);
  gl.uniform2f(gl.getUniformLocation(pSplat, 'uPoint'), x, y);
  gl.uniform1f(gl.getUniformLocation(pSplat, 'uRadius'), radius);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.tex);
  gl.uniform1i(gl.getUniformLocation(pSplat, 'uTarget'), 0);
  gl.uniform3f(gl.getUniformLocation(pSplat, 'uValue'), vx, vy, 0.0);
  blit(velocity.write);
  velocity.swap();

  gl.bindTexture(gl.TEXTURE_2D, dye.read.tex);
  gl.uniform3f(gl.getUniformLocation(pSplat, 'uValue'), color[0], color[1], color[2]);
  blit(dye.write);
  dye.swap();
}

let simT = 0.0;
function stepFluid(dt) {
  simT += dt;

  // Choreographed multi-jet emitters synced to BPM 120 (beat = 0.5s)
  const beatFrac = (simT / 0.5) % 1.0;
  const beatPulse = Math.exp(-beatFrac * 5.0);

  if (simT < 8.0) {
    // Phase 1: Opposing Neon Jets Colliding in Center (Cyan vs Magenta)
    const yOff = Math.sin(simT * 1.4) * 0.14;
    splat(0.18, 0.5 + yOff, 32.0 + 18.0 * beatPulse, Math.cos(simT * 2.1) * 6.0, [0.0, 0.85, 1.0].map(c => c * 0.28), 0.0028);
    splat(0.82, 0.5 - yOff, -32.0 - 18.0 * beatPulse, -Math.cos(simT * 2.1) * 6.0, [1.0, 0.12, 0.55].map(c => c * 0.28), 0.0028);
  } else if (simT < 16.0) {
    // Phase 2: 3-Emitter Orbital Vortex (Cyan, Amber Gold, Violet)
    const cols = [[0.0, 0.9, 1.0], [1.0, 0.65, 0.08], [0.65, 0.22, 1.0]];
    for (let k = 0; k < 3; k++) {
      const a = simT * 1.35 + k * (Math.PI * 2 / 3);
      const px = 0.5 + Math.cos(a) * 0.22;
      const py = 0.5 + Math.sin(a) * 0.26;
      const vx = -Math.sin(a) * 28.0 + Math.cos(a) * 14.0 * beatPulse;
      const vy = Math.cos(a) * 28.0 + Math.sin(a) * 14.0 * beatPulse;
      splat(px, py, vx, vy, cols[k].map(c => c * 0.25), 0.0025);
    }
  } else {
    // Phase 3: Harmonic Lissajous Ribbon Swirl (4 colors)
    const cols = [[0.0, 0.95, 0.85], [1.0, 0.72, 0.10], [1.0, 0.15, 0.60], [0.35, 0.55, 1.0]];
    for (let k = 0; k < 4; k++) {
      const ph = simT * 1.1 + k * Math.PI * 0.5;
      const px = 0.5 + Math.sin(ph * 1.5) * 0.30;
      const py = 0.5 + Math.cos(ph * 1.0) * 0.28;
      const vx = Math.cos(ph * 1.5) * 30.0 * (1.0 + 0.5 * beatPulse);
      const vy = -Math.sin(ph * 1.0) * 30.0 * (1.0 + 0.5 * beatPulse);
      splat(px, py, vx, vy, cols[k].map(c => c * 0.22), 0.0024);
    }
  }

  // Curl
  gl.useProgram(pCurl);
  gl.uniform2f(gl.getUniformLocation(pCurl, 'uTexelSize'), 1 / SIM_W, 1 / SIM_H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.tex);
  gl.uniform1i(gl.getUniformLocation(pCurl, 'uVel'), 0);
  blit(curl);

  // Vorticity confinement
  gl.useProgram(pVort);
  gl.uniform2f(gl.getUniformLocation(pVort, 'uTexelSize'), 1 / SIM_W, 1 / SIM_H);
  gl.uniform1f(gl.getUniformLocation(pVort, 'uCurlStrength'), 28.0);
  gl.uniform1f(gl.getUniformLocation(pVort, 'uDt'), dt);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.tex);
  gl.uniform1i(gl.getUniformLocation(pVort, 'uVel'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, curl.tex);
  gl.uniform1i(gl.getUniformLocation(pVort, 'uCurl'), 1);
  blit(velocity.write); velocity.swap();

  // Divergence
  gl.useProgram(pDiv);
  gl.uniform2f(gl.getUniformLocation(pDiv, 'uTexelSize'), 1 / SIM_W, 1 / SIM_H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.tex);
  gl.uniform1i(gl.getUniformLocation(pDiv, 'uVel'), 0);
  blit(divergence);

  // Pressure Jacobi iterations (20x)
  gl.useProgram(pPress);
  gl.uniform2f(gl.getUniformLocation(pPress, 'uTexelSize'), 1 / SIM_W, 1 / SIM_H);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, divergence.tex);
  gl.uniform1i(gl.getUniformLocation(pPress, 'uDiv'), 1);
  for (let i = 0; i < 20; i++) {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pressure.read.tex);
    gl.uniform1i(gl.getUniformLocation(pPress, 'uPressure'), 0);
    blit(pressure.write); pressure.swap();
  }

  // Gradient Subtract
  gl.useProgram(pGrad);
  gl.uniform2f(gl.getUniformLocation(pGrad, 'uTexelSize'), 1 / SIM_W, 1 / SIM_H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pressure.read.tex);
  gl.uniform1i(gl.getUniformLocation(pGrad, 'uPressure'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, velocity.read.tex);
  gl.uniform1i(gl.getUniformLocation(pGrad, 'uVel'), 1);
  blit(velocity.write); velocity.swap();

  // Advect Velocity
  gl.useProgram(pAdvect);
  gl.uniform2f(gl.getUniformLocation(pAdvect, 'uTexelSize'), 1 / SIM_W, 1 / SIM_H);
  gl.uniform1f(gl.getUniformLocation(pAdvect, 'uDt'), dt);
  gl.uniform1f(gl.getUniformLocation(pAdvect, 'uDissipation'), 0.988);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.tex);
  gl.uniform1i(gl.getUniformLocation(pAdvect, 'uVel'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, velocity.read.tex);
  gl.uniform1i(gl.getUniformLocation(pAdvect, 'uSource'), 1);
  blit(velocity.write); velocity.swap();

  // Advect Dye
  gl.uniform2f(gl.getUniformLocation(pAdvect, 'uTexelSize'), 1 / DYE_W, 1 / DYE_H);
  gl.uniform1f(gl.getUniformLocation(pAdvect, 'uDissipation'), 0.985);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, dye.read.tex);
  gl.uniform1i(gl.getUniformLocation(pAdvect, 'uSource'), 1);
  blit(dye.write); dye.swap();

  // Display to Screen
  gl.useProgram(pDisplay);
  gl.uniform2f(gl.getUniformLocation(pDisplay, 'uTexelSize'), 1 / DYE_W, 1 / DYE_H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dye.read.tex);
  gl.uniform1i(gl.getUniformLocation(pDisplay, 'uDye'), 0);
  blit(null);

  // HUD
  hctx.clearRect(0, 0, W, H);
  hctx.save();
  hctx.fillStyle = 'rgba(4, 8, 18, 0.58)';
  hctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
  hctx.lineWidth = 1.2;
  hctx.beginPath(); hctx.roundRect(24, 22, 465, 56, 10); hctx.fill(); hctx.stroke();

  const phase = simT < 8.0 ? '01 OPPOSING JETS' : simT < 16.0 ? '02 ORBITAL VORTEX' : '03 HARMONIC SWIRL';
  hctx.fillStyle = '#00E5FF';
  hctx.font = '700 13px "Consolas", monospace';
  hctx.fillText('NAVIER-STOKES FLUID SOLVER  |  20 JACOBI  |  ASSETS: 0', 40, 44);
  hctx.fillStyle = '#F8FAFC';
  hctx.fillText(`MODE: ${phase}  |  ${simT.toFixed(2)}s / 24.00s`, 40, 65);
  hctx.restore();
}

const _stepFluid = stepFluid;
window.stepFluid = (dt) => {
  _stepFluid(dt * 0.5);
  _stepFluid(dt * 0.5);
};

// Interactive pointer splat + continuous simulation loop when opened in browser
let lastX = null, lastY = null;
let colorIdx = 0;
const PALETTE = [
  [0.0, 0.92, 1.0],
  [1.0, 0.25, 0.65],
  [0.98, 0.78, 0.15],
  [0.32, 1.0, 0.62],
];
function handlePointer(e) {
  if (window.__RECORDING__) return;
  const r = glCanvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / Math.max(1, r.width);
  const y = 1.0 - (e.clientY - r.top) / Math.max(1, r.height);
  if (lastX !== null) {
    const dx = (x - lastX) * 750;
    const dy = (y - lastY) * 750;
    splat(x, y, dx, dy, PALETTE[colorIdx % PALETTE.length], 0.0038);
  }
  lastX = x; lastY = y;
}
glCanvas.addEventListener('pointerdown', (e) => { colorIdx += 1; lastX = null; lastY = null; handlePointer(e); });
glCanvas.addEventListener('pointermove', handlePointer);
glCanvas.addEventListener('pointerleave', () => { lastX = null; lastY = null; });

if (!window.__RECORDING__) {
  let paused = false;
  window.addEventListener('DOMContentLoaded', () => {
    if (!window.NeonShell) return;
    window.NeonShell.setHint('マウスを動かす／ドラッグして発光流体をかき混ぜられます（クリックで色変更）');
    window.NeonShell.addControl('⏸ 一時停止', (btn) => {
      paused = !paused;
      btn.textContent = paused ? '▶ 再開' : '⏸ 一時停止';
      btn.classList.toggle('active', paused);
    });
    window.NeonShell.addControl('↻ リセット', () => window.location.reload());
  });
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) window.stepFluid(dt);
    requestAnimationFrame(loop);
  }
  window.stepFluid(0.016);
  requestAnimationFrame(loop);
}
</script>
<script src="../demo-shell.js"></script>
</body>
</html>
