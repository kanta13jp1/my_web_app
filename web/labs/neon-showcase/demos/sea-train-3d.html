<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1.0" />
<title>SHIOKAZE EXPRESS // 3D Sea Railway (Single HTML · Pure WebGL2)</title>
<style>
  :root {
    --glass: rgba(9, 14, 26, 0.52);
    --glass-hi: rgba(15, 24, 44, 0.72);
    --border: rgba(255, 224, 178, 0.24);
    --gold: #fcd34d;
    --amber: #f59e0b;
    --cream: #fff7ed;
    --muted: rgba(241, 245, 249, 0.72);
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --serif: Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", "Inter", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 1280px; height: 720px; overflow: hidden;
    background: #080c18; color: var(--cream); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  #stage { width: 1280px; height: 720px; position: relative; overflow: hidden; }
  #glCanvas { width: 1280px; height: 720px; display: block; cursor: grab; }
  #glCanvas:active { cursor: grabbing; }

  /* Whisper-quiet minimal cinematic overlays (~96% full-screen 3D viewport!) */
  .top-left {
    position: absolute; top: 14px; left: 16px; pointer-events: none; z-index: 5;
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 10px; padding: 7px 13px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.32);
  }
  .title-main {
    font-family: var(--serif); font-size: 15px; font-weight: 700;
    letter-spacing: 1.4px; color: #fff8ec; line-height: 1.15;
    text-shadow: 0 1px 10px rgba(251, 191, 36, 0.35);
  }
  .title-sub {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.9px;
    color: rgba(253, 224, 155, 0.84); margin-top: 2px; white-space: nowrap;
  }

  .top-right {
    position: absolute; top: 14px; right: 16px; pointer-events: none; z-index: 5;
    display: flex; align-items: center; gap: 11px;
    background: var(--glass); border: 1px solid var(--border);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 10px; padding: 7px 13px;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    box-shadow: 0 8px 28px rgba(0,0,0,0.32);
  }
  .stat { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
  .stat .k { font-size: 7.4px; color: rgba(226, 232, 240, 0.62); letter-spacing: 0.7px; }
  .stat .v { font-size: 11px; font-weight: 700; color: #fff7ed; }
  .stat .v.warm { color: #fde68a; }
  .stat .v.moon { color: #93c5fd; }
  .div-v { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.16); }

  /* Subtle floating bottom camera bar (AnikaCodes / HMS Meridian style) */
  .bot-bar {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 6; display: flex; align-items: center; gap: 5px;
    background: rgba(8, 12, 24, 0.56); border: 1px solid rgba(255, 230, 185, 0.22);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 999px; padding: 5px 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
  }
  .cbtn {
    font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.4px;
    color: rgba(241, 245, 249, 0.78); background: transparent;
    border: 1px solid transparent; border-radius: 999px;
    padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .cbtn:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .cbtn.active {
    color: #1c1004;
    background: linear-gradient(90deg, #fde68a, #f59e0b);
    border-color: rgba(255, 247, 237, 0.7);
    box-shadow: 0 0 14px rgba(251, 191, 36, 0.52);
  }
  .cbtn.active.night-act {
    color: #041024;
    background: linear-gradient(90deg, #bae6fd, #fde68a);
    border-color: rgba(224, 242, 254, 0.8);
    box-shadow: 0 0 16px rgba(147, 197, 253, 0.55);
  }
  .cbtn.pressed { transform: scale(0.94); filter: brightness(1.25); }
  .bar-sep { width: 1px; height: 16px; background: rgba(255, 255, 255, 0.18); margin: 0 2px; }
  .t-pill {
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    color: #fde68a; background: rgba(251, 191, 36, 0.14);
    border: 1px solid rgba(251, 191, 36, 0.36); border-radius: 999px;
    padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .t-pill.night {
    color: #bfdbfe; background: rgba(59, 130, 246, 0.18);
    border-color: rgba(147, 197, 253, 0.45);
  }
  .t-pill.pressed { transform: scale(0.94); filter: brightness(1.3); }

  /* Virtual subtle cursor for choreography clicks */
  .vcursor { position: absolute; width: 17px; height: 17px; pointer-events: none; z-index: 40; transform: translate(-2px,-2px); opacity: 0; }
  .cring { position: absolute; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fde68a; pointer-events: none; z-index: 39; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="glCanvas"></canvas>

  <div class="top-left">
    <div class="title-main">SHIOKAZE EXPRESS</div>
    <div class="title-sub">3D SEA RAILWAY · SINGLE HTML · PURE WEBGL2</div>
  </div>

  <div class="top-right">
    <div class="stat"><span class="k">LOCAL TIME</span><span class="v warm" id="sTime">17:42 SUNSET</span></div>
    <div class="div-v"></div>
    <div class="stat"><span class="k">SPEED</span><span class="v" id="sSpeed">68 km/h</span></div>
    <div class="div-v"></div>
    <div class="stat"><span class="k">VIEW</span><span class="v" id="sCam">01 PARALLEL</span></div>
  </div>

  <div class="bot-bar">
    <button class="cbtn active" id="cam0">1 PARALLEL</button>
    <button class="cbtn" id="cam1">2 WATER SKIM</button>

  <div class="cring" id="cRing"></div>
  <svg class="vcursor" id="vCursor" viewBox="0 0 24 24" fill="none">
    <path d="M4 3L19 11.5L12.2 13.4L9.8 20L4 3Z" fill="#fffbeb" stroke="#090d1a" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</div>

<script>
(() => {
  'use strict';

  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(202611199);
  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

  // ===== WEBGL2 INIT =====
  const canvas = document.getElementById('glCanvas');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, preserveDrawingBuffer: true });
  if (!gl) { console.error('WebGL2 unavailable'); return; }
  const hasFloatFBO = Boolean(gl.getExtension('EXT_color_buffer_float'));

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('Shader:', gl.getShaderInfoLog(s));
    return s;
  }
  function link(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('Link:', gl.getProgramInfoLog(p));
    return p;
  }

  function mat4Persp(fovy, asp, near, far) {
    const f = 1 / Math.tan(fovy * 0.5), nf = 1 / (near - far);
    return new Float32Array([f/asp,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
  }
  function mat4Look(eye, ctr, up) {
    let zx=eye[0]-ctr[0], zy=eye[1]-ctr[1], zz=eye[2]-ctr[2];
    let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
    let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
    l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    return new Float32Array([
      xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
      -(xx*eye[0]+xy*eye[1]+xz*eye[2]),
      -(yx*eye[0]+yy*eye[1]+yz*eye[2]),
      -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1
    ]);
  }
  function mat4Mul(a, b) {
    const o = new Float32Array(16);
    for (let c=0;c<4;c++) for (let r=0;r<4;r++)
      o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
    return o;
  }
  function mat4Inv(m) {
    // General 4x4 inverse for ray-reconstructing sky dome!
    const inv = new Float32Array(16);
    const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
          a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
    const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
          b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
          b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
          b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
    let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    if (!det) return inv;
    det = 1.0 / det;
    inv[0]=(a11*b11-a12*b10+a13*b09)*det; inv[1]=(a02*b10-a01*b11-a03*b09)*det;
    inv[2]=(a31*b05-a32*b04+a33*b03)*det; inv[3]=(a22*b04-a21*b05-a23*b03)*det;
    inv[4]=(a12*b08-a10*b11-a13*b07)*det; inv[5]=(a00*b11-a02*b08+a03*b07)*det;
    inv[6]=(a32*b02-a30*b05-a33*b01)*det; inv[7]=(a20*b05-a22*b02+a23*b01)*det;
    inv[8]=(a10*b10-a11*b08+a13*b06)*det; inv[9]=(a01*b08-a00*b10-a03*b06)*det;
    inv[10]=(a30*b04-a31*b02+a33*b00)*det; inv[11]=(a21*b02-a20*b04-a23*b00)*det;
    inv[12]=(a11*b07-a10*b09-a12*b06)*det; inv[13]=(a00*b09-a01*b07+a02*b06)*det;
    inv[14]=(a31*b01-a30*b03-a32*b00)*det; inv[15]=(a20*b03-a21*b01+a22*b00)*det;
    return inv;
  }

  // ===== SHADERS =====
  const FULL_VS = `#version 300 es
    precision highp float;
    const vec2 P[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
    out vec2 vUv;
    void main() {
      vec2 p = P[gl_VertexID];
      vUv = p * 0.5 + 0.5;
      gl_Position = vec4(p, 0.9999, 1.0);
    }
  `;

  // 1) Procedural Ghibli / Shinkai Sky Dome + Volumetric Clouds + Setting Sun + Rising Full Moon + Stars!
  const skyProg = link(FULL_VS, `#version 300 es
    precision highp float;
    in vec2 vUv;
    uniform mat4 uInvVP;
    uniform vec3 uCamPos;
    uniform vec3 uSunDir;
    uniform vec3 uMoonDir;
    uniform float uNight;   // 0 = Golden Sunset, 0.5 = Violet Twilight, 1.0 = Moonlit Night
    uniform float uTime;
    out vec4 fragColor;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += a * noise(p);
        p = p * 2.04 + vec2(17.1, 31.7);
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec4 ndc = vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
      vec4 wp = uInvVP * ndc;
      vec3 rd = normalize(wp.xyz / wp.w - uCamPos);
      float h = clamp(rd.y, 0.0, 1.0);

      // Three-stage linear-HDR Makoto Shinkai / Studio Ghibli sky palette: Deep Sunset -> Rich Rose-Violet Twilight -> Velvet Starry Midnight!
      vec3 sunTop = vec3(0.025, 0.075, 0.28);
      vec3 sunMid = vec3(0.68, 0.20, 0.18);
      vec3 sunHor = vec3(1.55, 0.58, 0.16);

      vec3 twiTop = vec3(0.012, 0.022, 0.11);
      vec3 twiMid = vec3(0.28, 0.065, 0.26);
      vec3 twiHor = vec3(0.92, 0.24, 0.22);

      vec3 nitTop = vec3(0.003, 0.007, 0.026);
      vec3 nitMid = vec3(0.009, 0.022, 0.068);
      vec3 nitHor = vec3(0.025, 0.052, 0.125);

      float t1 = smoothstep(0.0, 0.52, uNight);
      float t2 = smoothstep(0.45, 1.0, uNight);
      vec3 topC = mix(mix(sunTop, twiTop, t1), nitTop, t2);
      vec3 midC = mix(mix(sunMid, twiMid, t1), nitMid, t2);
      vec3 horC = mix(mix(sunHor, twiHor, t1), nitHor, t2);

      vec3 col = mix(horC, midC, smoothstep(0.0, 0.24, h));
      col = mix(col, topC, smoothstep(0.16, 0.68, h));

      // Radiant Setting Golden Sun + Blazing Warm Mie Halo + Crepuscular God-Rays
      float sunDot = max(dot(rd, normalize(uSunDir)), 0.0);
      float sunVis = (1.0 - smoothstep(0.55, 0.85, uNight)) * smoothstep(-0.04, 0.015, rd.y);
      col += vec3(1.45, 0.45, 0.12) * pow(sunDot, 5.5) * 0.72 * sunVis;
      col += vec3(2.10, 1.05, 0.36) * pow(sunDot, 32.0) * 1.15 * sunVis;
      float sunDisc = smoothstep(0.9968, 0.9982, sunDot);
      col += vec3(3.6, 2.5, 1.25) * sunDisc * sunVis;
      // Volumetric crepuscular sun god-ray shafts fanning into the clouds!
      float rayAng = atan(rd.y - uSunDir.y, rd.x - uSunDir.x);
      float rays = pow(0.5 + 0.5 * sin(rayAng * 12.0 + uTime * 0.14), 3.0) * pow(sunDot, 4.5) * sunVis;
      col += vec3(1.35, 0.68, 0.28) * rays * 0.32;

      // Giant Luminous Silvery-Gold Full Moon with crisp lunar maria detail (framed cleanly inside sky!)
      float moonVis = smoothstep(0.28, 0.72, uNight) * smoothstep(-0.02, 0.025, rd.y);
      float moonDot = max(dot(rd, normalize(uMoonDir)), 0.0);
      col += vec3(0.14, 0.30, 0.68) * pow(moonDot, 8.0) * 0.52 * moonVis;
      col += vec3(0.55, 0.72, 1.12) * pow(moonDot, 72.0) * 0.72 * moonVis;
      float moonDisc = smoothstep(0.9974, 0.9983, moonDot);
      float maria = 0.72 + 0.28 * fbm(rd.xy * 42.0 + 3.0);
      col = mix(col, vec3(1.55, 1.62, 1.85) * maria, moonDisc * moonVis);

      // Crisp Twinkling Starfield & Subtle Milky Way Shimmer at Night!
      if (uNight > 0.22 && rd.y > 0.02) {
        vec2 suv = rd.xz / (rd.y + 0.30);
        vec2 grid = floor(suv * 64.0);
        vec2 f = fract(suv * 64.0) - 0.5;
        float hStar = hash(grid);
        if (hStar > 0.962) {
          float d = length(f);
          float tw = 0.60 + 0.40 * sin(uTime * (2.6 + fract(hStar * 91.3) * 4.5) + hStar * 80.0);
          float s = smoothstep(0.22, 0.02, d) * tw;
          vec3 sCol = mix(vec3(0.75, 0.88, 1.0), vec3(1.0, 0.90, 0.68), fract(hStar * 37.1));
          col += sCol * s * 1.95 * smoothstep(0.25, 0.80, uNight) * smoothstep(0.03, 0.25, rd.y);
        }
      }

      // Dramatic Shinkai Painted Volumetric Clouds (deep plum shadows + blazing coral-gold rims!)
      if (rd.y > 0.015) {
        vec2 cuv = rd.xz / (rd.y + 0.16) * 0.52 + vec2(uTime * 0.008, -uTime * 0.004);
        float c1 = fbm(cuv * 2.1);
        float c2 = fbm(cuv * 4.4 + vec2(3.4, 1.8));
        float cloud = smoothstep(0.45, 0.78, c1 * 0.70 + c2 * 0.36);
        float cFade = smoothstep(0.015, 0.14, rd.y) * (1.0 - smoothstep(0.55, 0.92, rd.y));
        float cloudMask = cloud * cFade * 0.88;

        vec3 cDarkDay = vec3(0.14, 0.06, 0.18);
        vec3 cLitDay  = vec3(1.65, 0.68, 0.28);
        vec3 cDarkNit = vec3(0.012, 0.022, 0.065);
        vec3 cLitNit  = vec3(0.20, 0.36, 0.68);

        float edgeLit = clamp(pow(sunDot, 2.6) * (1.0 - t2) * 1.2 + pow(moonDot, 3.5) * moonVis * 1.1 + (1.0 - c1) * 0.42, 0.0, 1.0);
        vec3 cDark = mix(cDarkDay, cDarkNit, smoothstep(0.15, 0.88, uNight));
        vec3 cLit  = mix(cLitDay,  cLitNit,  smoothstep(0.15, 0.88, uNight));
        vec3 cCol = mix(cDark, cLit, edgeLit);
        col = mix(col, cCol, cloudMask);
      }

      // Warm golden / cool midnight horizon glow
      float haze = exp(-abs(rd.y) * 15.0);
      col += mix(vec3(0.42, 0.15, 0.05), vec3(0.015, 0.035, 0.085), uNight) * haze * 0.55;

      fragColor = vec4(col, 1.0);
    }
  `);

  // 2) Hardware-Instanced Glossy PBR Scene Shader (for BOTH Boxes AND Smooth Cylinders/Wheels/Boiler!)
  const meshProg = link(`#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNorm;
    layout(location=2) in vec4 aCenterYaw; // xyz = world center, w = yaw
    layout(location=3) in vec4 aScaleE;    // xyz = scale, w = emissive intensity
    layout(location=4) in vec4 aColR;      // rgb = albedo, w = glossiness (0..1)

    uniform mat4 uVP;
    out vec3 vWorldPos;
    out vec3 vNorm;
    out vec3 vCol;
    out float vEmissive;
    out float vGloss;

    void main() {
      float cy = cos(aCenterYaw.w), sy = sin(aCenterYaw.w);
      vec3 lp = aPos * aScaleE.xyz;
      vec3 rp = vec3(lp.x * cy + lp.z * sy, lp.y, -lp.x * sy + lp.z * cy);
      vec3 rn = vec3(aNorm.x * cy + aNorm.z * sy, aNorm.y, -aNorm.x * sy + aNorm.z * cy);
      vec3 wp = aCenterYaw.xyz + rp;
      vWorldPos = wp;
      vNorm = normalize(rn);
      vCol = aColR.rgb;
      vEmissive = aScaleE.w;
      vGloss = aColR.w;
      gl_Position = uVP * vec4(wp, 1.0);
    }
  `, `#version 300 es
    precision highp float;
    in vec3 vWorldPos;
    in vec3 vNorm;
    in vec3 vCol;
    in float vEmissive;
    in float vGloss;

    uniform vec3 uCamPos;
    uniform vec3 uKeyDir;
    uniform vec3 uKeyCol;
    uniform vec3 uAmbSky;
    uniform vec3 uAmbSea;
    uniform vec3 uFogCol;
    uniform float uNight;
    uniform float uClipSign; // +1 for reflection pass (discard y < -0.02), 0 for main pass
    out vec4 fragColor;

    void main() {
      if (uClipSign > 0.5 && vWorldPos.y < -0.02) discard;

      // True sRGB->Linear albedo conversion so dark lacquer, brass, & crimson have rich cinema HDR contrast!
      vec3 albedo = pow(max(vec3(0.0), vCol), vec3(2.2));
      vec3 N = normalize(vNorm);
      vec3 V = normalize(uCamPos - vWorldPos);
      vec3 L = normalize(uKeyDir);

      float ndl = max(dot(N, L), 0.0);
      vec3 H = normalize(L + V);
      float shin = mix(16.0, 96.0, vGloss);
      float spec = pow(max(dot(N, H), 0.0), shin) * (0.14 + vGloss * 1.15);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.2);

      // Hemisphere ambient: sky above + warm/cool ocean bounce light from below!
      vec3 amb = mix(uAmbSea, uAmbSky, N.y * 0.5 + 0.5);

      // Warm lantern bounce glow on train flanks at night!
      float trainGlow = exp(-length(vWorldPos.xz - vec2(0.0, 2.0)) * 0.09) * uNight * 0.22;

        eye: [lerp(10.2, 8.8, u), lerp(0.95, 1.25, u), lerp(-11.2, -3.8, u)],
        ctr: [0.0, 1.55, lerp(-1.2, 3.4, u)]
      };
    } else if (m === 2) {
      // 3 SEA STATION (11.5s - 17.5s — THE "DO NOT MISS 0:15" SUNSET -> FULL MOON & LANTERN IGNITION!)
      const u = clamp((t - 11.5) / 6.0, 0, 1);
      return {
        eye: [lerp(16.8, 15.6, u), lerp(3.4, 4.2, u), lerp(-8.8, -2.5, u)],
        ctr: [0.0, 2.15, lerp(2.2, 4.4, u)]
      };
    } else if (m === 3) {
      // 4 HEADLAMP HERO: Dramatic front-right 3/4 bow shot showing silky golden headlamp cone & glowing coaches!
      const u = clamp((t - 17.5) / 5.5, 0, 1);
      return {
        eye: [lerp(8.2, 4.6, u), lerp(2.4, 2.9, u), lerp(-16.2, -14.8, u)],
        ctr: [0.0, 1.95, lerp(-0.5, 2.2, u)]
      };
    } else {
      // 5 MOONLIT ORBIT: Sweeping aerial postcard orbit framing the glowing full moon, train & lighthouse!
      const u = clamp((t - 23.0) / 7.0, 0, 1);
      const ang = lerp(0.35, 1.25, u);
      const rad = lerp(17.8, 22.0, u);
      return {
        eye: [Math.sin(ang) * rad, lerp(3.8, 6.2, u), -Math.cos(ang) * rad + 2.5],
        ctr: [0.0, 2.1, 3.0]
      };
    }
  }

  function runChoreography(t, dt) {
    pressedId = null;
    cPulse = Math.max(0, cPulse - dt * 3.0);

    // Subtle bottom-bar button click beats for camera & twilight transition
    const clickEvents = [
      { t0: 5.2, tc: 5.95, id: 'cam1', key: 'c1', fn: () => setCamMode(1) },
      { t0: 10.7, tc: 11.45, id: 'cam2', key: 'c2', fn: () => setCamMode(2) },
      { t0: 13.0, tc: 13.75, id: 'btnSky', key: 'sky', fn: () => { manualNight = null; } },
      { t0: 16.8, tc: 17.45, id: 'cam3', key: 'c3', fn: () => setCamMode(3) },
      { t0: 22.3, tc: 22.95, id: 'cam4', key: 'c4', fn: () => setCamMode(4) },
    ];
    let activeEv = null;
    for (const ev of clickEvents) {
      if (t >= ev.t0 && t < ev.tc + 0.35) { activeEv = ev; break; }
    }
    if (activeEv) {
      const p = btnCenter(activeEv.id);
      if (t < activeEv.tc) {
        curOp = smoothstep(activeEv.t0, activeEv.t0 + 0.35, t);
        const u = smoothstep(activeEv.t0, activeEv.tc, t);
        curX = lerp(p.x - 42, p.x, u);
        curY = lerp(p.y - 36, p.y, u);
      } else {
        curOp = 1.0; curX = p.x; curY = p.y; pressedId = activeEv.id;
        if (!trig[activeEv.key]) { trig[activeEv.key] = true; cPulse = 1.0; activeEv.fn(); }
      }
    } else {
      curOp = Math.max(0, curOp - dt * 2.4);
    }

    // Automatic breathtaking Sunset -> Twilight -> Moonlit Night transformation peaking right at 0:15!
    if (manualNight !== null) {
      nightMix += (manualNight - nightMix) * Math.min(1, dt * 2.2);
    } else {
      // Smoothly holds golden hour 0-12.5s, sweeps dramatically across 12.8s-16.2s (peak magic at 15.0s!), holds lush moonlit night 16.2-30s!
      nightMix = smoothstep(12.6, 16.4, t);
    }

    // Smooth camera interpolation (snap gently on camera cuts for crisp cinematography)
    if (!userOrbit) {
      const tgt = targetCamFor(camMode, t);
      const speed = (t < 0.05) ? 1.0 : Math.min(1.0, dt * 5.2);
      for (let i = 0; i < 3; i++) {
        curEye[i] = lerp(curEye[i], tgt.eye[i], speed);
        curCtr[i] = lerp(curCtr[i], tgt.ctr[i], speed);
      }
    } else {
      curEye = [
        Math.sin(userAz) * Math.cos(userEl) * userDist,
        Math.max(0.65, Math.sin(userEl) * userDist + 1.8),
        Math.cos(userAz) * Math.cos(userEl) * userDist + 2.0
      ];
      curCtr = [0.0, 1.9, 2.0];
    }
  }

  function stepSim(dt) {
    simTime += dt;
    railScroll += 18.8 * dt; // 68 km/h = 18.8 m/s!
    runChoreography(simTime, dt);

    // Update billowing steam puffs from locomotive smokestack (-z is forward!)
    for (const s of steamPuffs) {
      s.age += dt;
      if (s.age > 3.6) {
        s.age -= 3.6;
        s.x = (rng() - 0.5) * 0.14;
        s.y = 3.85;
        s.z = -5.85;
      }
    }
  }

  // ===== SCENE POPULATION =====
  function addInst(mesh, cx, cy, cz, yaw, sx, sy, sz, col, gloss = 0.35, em = 0.0) {
    if (mesh.count >= mesh.maxInst) return;
    let o = mesh.count * 12;
    const b = mesh.buf;
    b[o++]=cx; b[o++]=cy; b[o++]=cz; b[o++]=yaw;
    b[o++]=sx; b[o++]=sy; b[o++]=sz; b[o++]=em;
    b[o++]=col[0]; b[o++]=col[1]; b[o++]=col[2]; b[o++]=gloss;
    mesh.count++;
  }

  function populateScene() {
    boxMesh.count = 0; cylZMesh.count = 0; cylYMesh.count = 0; cylXMesh.count = 0;
    let pCnt = 0, bCnt = 0;

    function addPart(x, y, z, sz, c, a) {
      if (pCnt >= MAX_PARTS) return;
      let o = pCnt * 8;
      partBuf[o++]=x; partBuf[o++]=y; partBuf[o++]=z; partBuf[o++]=sz;
      partBuf[o++]=c[0]; partBuf[o++]=c[1]; partBuf[o++]=c[2]; partBuf[o++]=a;
      pCnt++;
    }
    function addBeamTri3(p0, a0, p1, a1, p2, a2, c) {
      if (bCnt + 3 >= MAX_BEAM) return;
      const pts = [[p0, a0], [p1, a1], [p2, a2]];
      for (const [p, a] of pts) {
        let o = bCnt * 7;
        beamBuf[o++]=p[0]; beamBuf[o++]=p[1]; beamBuf[o++]=p[2];

      const colL = [1.0, lerp(0.56, 0.82, ln.warmth), lerp(0.18, 0.36, ln.warmth)];
      addInst(boxMesh, lx, 0.05 + bob, lz, ln.ph, 0.38, 0.06, 0.38, [0.24, 0.14, 0.09], 0.15, 0.0);
      addInst(boxMesh, lx, 0.24 + bob, lz, ln.ph, 0.25, 0.34, 0.25, colL, 0.35, lerp(0.10, 1.55, lampGlow));
      if (lampGlow > 0.08) {
        addPart(lx, 0.30 + bob, lz, 0.62, colL, lampGlow * 0.58);
      }
    }

    // 6. LUSH BILLOWING STUDIO-GHIBLI STEAM CLOUDS, SEA SPRAY & MAGICAL GOLDEN FIREFLIES!
    for (const s of steamPuffs) {
      const u = s.age / 3.6;
      const sx = s.x + s.driftX * u * 4.5 + Math.sin(u * 4.2 + simTime * 1.4) * 0.24;
      const sy = s.y + s.driftY * u * 3.4;
      const sz = s.z + u * 24.0;
      const size = lerp(0.58, 3.45, Math.pow(u, 0.68));
      const alpha = Math.sin(clamp(u, 0, 1) * Math.PI) * lerp(0.32, 0.20, nightMix);
      const sColDay = [1.35, 0.78, 0.52];
      const sColNit = u < 0.20 ? [0.92, 0.56, 0.28] : [0.22, 0.34, 0.62];
      const sc = [
        lerp(sColDay[0], sColNit[0], nightMix),
        lerp(sColDay[1], sColNit[1], nightMix),
        lerp(sColDay[2], sColNit[2], nightMix),
      ];
      addPart(sx, sy, sz, size, sc, alpha);
    }

    // Glittering wheel sea-spray droplets along the flooded track
    for (let i = 0; i < 42; i++) {
      const side = (i % 2 === 0) ? -1.18 : 1.18;
      const u = ((i / 42) + simTime * 1.1) % 1.0;
      const px = side + side * u * 1.15;
      const py = 0.16 + Math.sin(u * Math.PI) * 0.62;
      const pz = -6.2 + (i % 21) * 1.55 + u * 2.4;
      const spCol = [lerp(1.05, 0.24, nightMix), lerp(0.92, 0.95, nightMix), lerp(0.76, 1.15, nightMix)];
      addPart(px, py, pz, 0.18 + u * 0.22, spCol, (1.0 - u) * lerp(0.38, 0.55, nightMix));
    }

    // Magical Golden Fireflies drifting over the ocean after twilight ignites!
    if (lampGlow > 0.05) {
      for (const ff of fireflies) {
        const fz = ((ff.z + railScroll * 0.35 + 22.0) % 44.0) - 22.0;
        const fx = ff.x + Math.sin(simTime * ff.sp + ff.ph) * 0.9;
        const fy = ff.y + Math.cos(simTime * ff.sp * 1.2 + ff.ph) * 0.45;
        const tw = 0.4 + 0.6 * Math.pow(0.5 + 0.5 * Math.sin(simTime * 3.8 + ff.ph), 2.0);
        addPart(fx, fy, fz, 0.16 + tw * 0.14, [1.0, 0.86, 0.42], lampGlow * tw * 0.92);
      }
    }

    return { pCnt, bCnt };
  }

  function getLighting() {
    // Low blazing golden sun framed RIGHT behind the train & Torii gate (-X, +Z), dipping into the sea at 0:13-0:16!
    const sunElev = lerp(0.115, -0.095, smoothstep(0.0, 0.78, nightMix));
    const sunDir = [-0.82, sunElev, 0.48];
    // Giant luminous silvery-gold full moon framed cleanly inside upper sky behind the sea railway!
    const moonElev = lerp(-0.04, 0.165, smoothstep(0.22, 0.96, nightMix));
    const moonDir = [-0.78, moonElev, 0.56];

    // Linear-space high-contrast key & hemisphere lighting!
    const keyDir = nightMix < 0.55 ? sunDir : moonDir;
    const keyCol = [
      lerp(2.15, 0.34, smoothstep(0.22, 0.85, nightMix)),
      lerp(0.95, 0.52, smoothstep(0.22, 0.85, nightMix)),
      lerp(0.36, 0.98, smoothstep(0.22, 0.85, nightMix)),
    ];
    const ambSky = [
      lerp(0.26, 0.035, nightMix),
      lerp(0.18, 0.065, nightMix),
      lerp(0.34, 0.185, nightMix),
    ];
    const ambSea = [
      lerp(0.32, 0.022, nightMix),
      lerp(0.15, 0.042, nightMix),
      lerp(0.10, 0.095, nightMix),
    ];
    const fogCol = [
      lerp(0.98, 0.020, smoothstep(0.08, 0.90, nightMix)),
      lerp(0.42, 0.045, smoothstep(0.08, 0.90, nightMix)),
      lerp(0.18, 0.110, smoothstep(0.08, 0.90, nightMix)),
    ];
    return { sunDir, moonDir, keyDir, keyCol, ambSky, ambSea, fogCol };
  }

  function drawWorldPass(vp, invVP, eye, light, pCnt, bCnt, clipSign) {
    // 1. Atmospheric Sky Dome (depth write off!)
    gl.depthMask(false);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(skyProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(skyProg, 'uInvVP'), false, invVP);
    gl.uniform3fv(gl.getUniformLocation(skyProg, 'uCamPos'), eye);
    gl.uniform3fv(gl.getUniformLocation(skyProg, 'uSunDir'), light.sunDir);
    gl.uniform3fv(gl.getUniformLocation(skyProg, 'uMoonDir'), light.moonDir);
    gl.uniform1f(gl.getUniformLocation(skyProg, 'uNight'), nightMix);
    gl.uniform1f(gl.getUniformLocation(skyProg, 'uTime'), simTime);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // 2. Solid PBR Instanced Geometry (Train, Boiler, Wheels, Torii, Station, Lighthouse, Lanterns)
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.useProgram(meshProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(meshProg, 'uVP'), false, vp);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uCamPos'), eye);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uKeyDir'), light.keyDir);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uKeyCol'), light.keyCol);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uAmbSky'), light.ambSky);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uAmbSea'), light.ambSea);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uFogCol'), light.fogCol);
    gl.uniform1f(gl.getUniformLocation(meshProg, 'uNight'), nightMix);
    gl.uniform1f(gl.getUniformLocation(meshProg, 'uClipSign'), clipSign);

    for (const m of [boxMesh, cylZMesh, cylYMesh, cylXMesh]) {
      if (m.count === 0) continue;
      gl.bindVertexArray(m.vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, m.ivbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, m.buf.subarray(0, m.count * 12));
      gl.drawArraysInstanced(gl.TRIANGLES, 0, m.vCount, m.count);
    }

    // 3. Volumetric Headlamp & Lighthouse Beams (Additive!)
    if (bCnt > 0) {
      gl.enable(gl.BLEND);
      gl.depthMask(false);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.useProgram(beamProg);
      gl.uniformMatrix4fv(gl.getUniformLocation(beamProg, 'uVP'), false, vp);
      gl.uniform1f(gl.getUniformLocation(beamProg, 'uClipSign'), clipSign);
      gl.bindVertexArray(beamVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, beamVbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, beamBuf.subarray(0, bCnt * 7));
      gl.drawArrays(gl.TRIANGLES, 0, bCnt);
      gl.depthMask(true);
    }

    // 4. Soft Volumetric Steam Clouds, Sea Spray & Fireflies!
    if (pCnt > 0) {
      gl.enable(gl.BLEND);
      gl.depthMask(false);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(partProg);
      gl.uniformMatrix4fv(gl.getUniformLocation(partProg, 'uVP'), false, vp);
      gl.uniform1f(gl.getUniformLocation(partProg, 'uClipSign'), clipSign);
      gl.bindVertexArray(partVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, partVbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, partBuf.subarray(0, pCnt * 8));
      gl.drawArrays(gl.POINTS, 0, pCnt);
      gl.depthMask(true);
    }
  }

  function renderWebGL() {
    const light = getLighting();
    const { pCnt, bCnt } = populateScene();
    const proj = mat4Persp(0.76, W / H, 0.2, 320.0);

    // === PASS 1: TRUE PLANAR WATER REFLECTION FBO (Mirrored Camera eye.y -> -eye.y!) ===
    const reflEye = [curEye[0], -curEye[1], curEye[2]];
    const reflCtr = [curCtr[0], -curCtr[1], curCtr[2]];
    const reflView = mat4Look(reflEye, reflCtr, [0, 1, 0]);
    const reflVP = mat4Mul(proj, reflView);
    const reflInvVP = mat4Inv(reflVP);

    gl.bindFramebuffer(gl.FRAMEBUFFER, reflFBO.fbo);
    gl.viewport(0, 0, reflFBO.w, reflFBO.h);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawWorldPass(reflVP, reflInvVP, reflEye, light, pCnt, bCnt, 1.0);

    // === PASS 2: MAIN HDR 3D SCENE FBO (Sky + Train + Landmarks + True Rippling Reflective Ocean!) ===
    const view = mat4Look(curEye, curCtr, [0, 1, 0]);
    const vp = mat4Mul(proj, view);
    const invVP = mat4Inv(vp);

    gl.bindFramebuffer(gl.FRAMEBUFFER, mainFBO.fbo);
    gl.viewport(0, 0, W, H);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // Draw sky + solid world first
    gl.depthMask(false);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(skyProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(skyProg, 'uInvVP'), false, invVP);
    gl.uniform3fv(gl.getUniformLocation(skyProg, 'uCamPos'), curEye);
    gl.uniform3fv(gl.getUniformLocation(skyProg, 'uSunDir'), light.sunDir);
    gl.uniform3fv(gl.getUniformLocation(skyProg, 'uMoonDir'), light.moonDir);
    gl.uniform1f(gl.getUniformLocation(skyProg, 'uNight'), nightMix);
    gl.uniform1f(gl.getUniformLocation(skyProg, 'uTime'), simTime);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Draw Rippling Reflective Ocean Plane at y = 0.0 (depth-tested cleanly against piers & causeway!)
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.useProgram(waterProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(waterProg, 'uVP'), false, vp);
    gl.uniform3fv(gl.getUniformLocation(waterProg, 'uCamPos'), curEye);
    gl.uniform3fv(gl.getUniformLocation(waterProg, 'uSunDir'), light.sunDir);
    gl.uniform3fv(gl.getUniformLocation(waterProg, 'uMoonDir'), light.moonDir);
    gl.uniform3fv(gl.getUniformLocation(waterProg, 'uFogCol'), light.fogCol);
    gl.uniform1f(gl.getUniformLocation(waterProg, 'uTime'), simTime);
    gl.uniform1f(gl.getUniformLocation(waterProg, 'uScroll'), railScroll);
    gl.uniform1f(gl.getUniformLocation(waterProg, 'uNight'), nightMix);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, reflFBO.tex);
    gl.uniform1i(gl.getUniformLocation(waterProg, 'uReflTex'), 0);
    gl.bindVertexArray(waterVao);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // Draw Solid Train, Causeway, Piers, Landmarks, Volumetric Beams & Steam Clouds above the Ocean!
    gl.useProgram(meshProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(meshProg, 'uVP'), false, vp);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uCamPos'), curEye);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uKeyDir'), light.keyDir);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uKeyCol'), light.keyCol);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uAmbSky'), light.ambSky);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uAmbSea'), light.ambSea);
    gl.uniform3fv(gl.getUniformLocation(meshProg, 'uFogCol'), light.fogCol);
    gl.uniform1f(gl.getUniformLocation(meshProg, 'uNight'), nightMix);
    gl.uniform1f(gl.getUniformLocation(meshProg, 'uClipSign'), 0.0);
    for (const m of [boxMesh, cylZMesh, cylYMesh, cylXMesh]) {
      if (m.count === 0) continue;
      gl.bindVertexArray(m.vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, m.ivbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, m.buf.subarray(0, m.count * 12));
      gl.drawArraysInstanced(gl.TRIANGLES, 0, m.vCount, m.count);
    }
    if (bCnt > 0) {
      gl.enable(gl.BLEND);
      gl.depthMask(false);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.useProgram(beamProg);
      gl.uniformMatrix4fv(gl.getUniformLocation(beamProg, 'uVP'), false, vp);
      gl.uniform1f(gl.getUniformLocation(beamProg, 'uClipSign'), 0.0);
      gl.bindVertexArray(beamVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, beamVbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, beamBuf.subarray(0, bCnt * 7));
      gl.drawArrays(gl.TRIANGLES, 0, bCnt);
      gl.depthMask(true);
    }
    if (pCnt > 0) {
      gl.enable(gl.BLEND);
      gl.depthMask(false);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(partProg);
      gl.uniformMatrix4fv(gl.getUniformLocation(partProg, 'uVP'), false, vp);
      gl.uniform1f(gl.getUniformLocation(partProg, 'uClipSign'), 0.0);
      gl.bindVertexArray(partVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, partVbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, partBuf.subarray(0, pCnt * 8));
      gl.drawArrays(gl.POINTS, 0, pCnt);
      gl.depthMask(true);
    }

    // === PASS 3: 2-PASS SEPARABLE HDR GAUSSIAN BLOOM + ACES FILMIC TONE MAPPING ===
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(emptyVao);

    // Extract bright HDR glow (sun, moon, glowing amber windows, sea lanterns, headlamp)
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fbo);
    gl.viewport(0, 0, bloomA.w, bloomA.h);
    gl.useProgram(bloomExtractProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, mainFBO.tex);
    gl.uniform1i(gl.getUniformLocation(bloomExtractProg, 'uTex'), 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Horizontal & Vertical Gaussian Blur passes (2 iterations for plush cinema halation!)
    gl.useProgram(blurProg);
    gl.uniform1i(gl.getUniformLocation(blurProg, 'uTex'), 0);
    for (let it = 0; it < 2; it++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.fbo);
      gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
      gl.uniform2f(gl.getUniformLocation(blurProg, 'uDir'), (1.4 + it * 1.2) / bloomA.w, 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fbo);
      gl.bindTexture(gl.TEXTURE_2D, bloomB.tex);
      gl.uniform2f(gl.getUniformLocation(blurProg, 'uDir'), 0.0, (1.4 + it * 1.2) / bloomA.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // Final Screen Composite + ACES Filmic Grading!
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(composeProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, mainFBO.tex);
    gl.uniform1i(gl.getUniformLocation(composeProg, 'uScene'), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
    gl.uniform1i(gl.getUniformLocation(composeProg, 'uBloom'), 1);
    gl.uniform1f(gl.getUniformLocation(composeProg, 'uNight'), nightMix);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  function renderDOM() {
    const mins = Math.round(lerp(17 * 60 + 42, 21 * 60 + 18, nightMix));
    const hh = String(Math.floor(mins / 60)).padStart(2, '0');
    const mm = String(mins % 60).padStart(2, '0');
    const lbl = nightMix < 0.28 ? 'SUNSET' : (nightMix < 0.72 ? 'TWILIGHT' : 'MOONLIT');
    const st = document.getElementById('sTime');
    st.textContent = `${hh}:${mm} ${lbl}`;
    st.className = nightMix > 0.65 ? 'v moon' : 'v warm';

    const camNames = ['01 PARALLEL', '02 WATER SKIM', '03 SEA STATION', '04 HEADLAMP', '05 MOON ORBIT'];
    document.getElementById('sCam').textContent = camNames[camMode];

    const isNight = nightMix > 0.55;
    for (let i = 0; i < 5; i++) {
      const el = document.getElementById(`cam${i}`);
      const act = i === camMode;
      el.className = act ? (isNight ? 'cbtn active night-act' : 'cbtn active') : 'cbtn';
      el.classList.toggle('pressed', pressedId === `cam${i}`);
    }
    const skyBtn = document.getElementById('btnSky');
    skyBtn.className = isNight ? 't-pill night' : 't-pill';
    skyBtn.textContent = isNight ? '☾ MOONLIT NIGHT' : '☀ GOLDEN SUNSET';
    skyBtn.classList.toggle('pressed', pressedId === 'btnSky');

    const vc = document.getElementById('vCursor'), cr = document.getElementById('cRing');
    vc.style.left = `${curX.toFixed(1)}px`; vc.style.top = `${curY.toFixed(1)}px`; vc.style.opacity = curOp.toFixed(2);
    if (cPulse > 0.02) {
      cr.style.left = `${curX.toFixed(1)}px`; cr.style.top = `${curY.toFixed(1)}px`;
      cr.style.opacity = (cPulse * 0.9).toFixed(2);
      cr.style.transform = `translate(-50%,-50%) scale(${(0.55 + (1 - cPulse) * 1.15).toFixed(2)})`;
    } else cr.style.opacity = '0';
  }

  // Interactive Controls
  for (let i = 0; i < 5; i++) {
    document.getElementById(`cam${i}`).addEventListener('click', () => setCamMode(i));
  }
  document.getElementById('btnSky').addEventListener('click', () => {
    manualNight = nightMix > 0.5 ? 0.0 : 1.0;
  });
  canvas.addEventListener('mousedown', (e) => { dragging = true; userOrbit = true; lastMX = e.clientX; lastMY = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    userAz -= (e.clientX - lastMX) * 0.008;
    userEl = clamp(userEl + (e.clientY - lastMY) * 0.006, 0.05, 0.95);
    lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener('wheel', (e) => {
    userOrbit = true;
    userDist = clamp(userDist + e.deltaY * 0.01, 7.5, 34.0);
  }, { passive: true });

  // Initial Draw
  const initCam = targetCamFor(0, 0);
  curEye = initCam.eye.slice();
  curCtr = initCam.ctr.slice();
  renderWebGL();
  renderDOM();

  window.stepSeaTrain = function(dt, drawAll = true) {
    stepSim(dt);
    if (drawAll) {
      renderWebGL();
      renderDOM();
    }
  };

  if (!isRecording) {
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (simTime >= 30.0) { simTime = 0; for (const k in trig) trig[k] = false; manualNight = null; setCamMode(0); }
      window.stepSeaTrain(dt, true);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
