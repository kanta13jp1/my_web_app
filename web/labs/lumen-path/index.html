<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN PATH — 光の行き先を変える</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="/" aria-label="ホームへ">L / P</a><span>LUMEN PATH <small>INTERACTIVE ATELIER · 04</small></span><span class="edition">光を、解く。</span></header>
<main><section class="intro"><p class="eyebrow">A SMALL CHANGE. A DIFFERENT DESTINATION.</p><h1>その一手が、<br><em>光の未来を変える。</em></h1><p>鏡を回す。道筋が変わる。すべての灯台に、光を届けよう。</p></section>
<div class="workspace"><section class="stage" aria-label="光のパズル"><div class="stage-head"><span id="chapter"></span><span id="lit"></span></div><div id="board"><svg id="rays" viewBox="-1 -1 9 9" aria-hidden="true"></svg><div id="pieces"></div></div><div class="legend"><span>鏡を押すと90°回転</span><span>色＋記号で光源と受光器を対応</span></div></section>
<aside><p class="eyebrow">YOUR NEXT MOVE</p><h2 id="title"></h2><p id="brief"></p><p id="status" role="status" aria-live="polite"></p><div class="stat"><span>操作回数</span><strong id="moves">0</strong></div><div class="controls"><button id="undo">一手戻す</button><button id="reset">最初から</button><button id="hint">ヒント</button><button id="next" class="primary">次の部屋へ</button></div><label class="select">部屋を選ぶ<select id="level"><option value="0">01 最初の反射</option><option value="1">02 折り返す光</option><option value="2">03 三つの灯台</option></select></label><p class="note">タップ、またはTabで鏡を選んでEnter。ヒントは正解への一手を強調します。自動では操作しません。</p></aside></div>
<footer>独自配置の抽象パズル。実際の光の波動・屈折・エネルギーは再現していません。<span>操作 → 観察 → やり直す</span></footer></main><script type="module" src="app.mjs"></script></body></html>
