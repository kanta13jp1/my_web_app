min_version: 2.1.0
skip_lfs: true

pre-commit:
  parallel: false
  jobs:
    - name: fast quality gate
      run: python scripts/pre_commit_quality_gate.py

prepare-commit-msg:
  parallel: false
  jobs:
    - name: block no-verify bypass
      run: python scripts/no_verify_sentinel.py assert-pre-commit --message-file "{1}" --source "{2}"

commit-msg:
  parallel: false
  jobs:
    - name: reject hook bypass markers
      run: python scripts/check_no_verify_bypass.py --message-file "{1}"

# The path-scoped pre-commit gate protects the exact committed tree. GitHub
# Actions is the single full validation authority; repeating it during push
# added 10-18 minutes locally and then ran the same checks again on the PR.
