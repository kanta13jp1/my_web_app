# Used only in a new RUNNER_TEMP directory. Never use repository supabase/config.toml.
project_id = "hexciv-auth-template"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "1MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:7357"
additional_redirect_urls = ["http://127.0.0.1:7357/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
# In CLI 2.84.2 this also enables the email LOGIN provider. New account
# registration remains disabled by auth.enable_signup above.
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false
