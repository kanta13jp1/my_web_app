<!doctype html><html lang="ja"><meta charset="utf-8"><title>TEST FIXTURE — simulated Jev bridge</title>
<style>body{margin:0}iframe{border:0;width:100%;height:100vh}</style>
<iframe title="Jev lab test fixture" src="/web/jev-mario-lab/index.html"></iframe>
<script>
// Test only. Not copied into web/ or production artifacts. No API credentials.
let calls = 0;
window.addEventListener('message', e => {
  const frame = document.querySelector('iframe');
  if (e.source !== frame.contentWindow || e.origin !== location.origin) return;
  if (e.data?.type === 'jev-mario-hello') frame.contentWindow.postMessage({ type:'jev-mario-ready' },location.origin);
  if (e.data?.type === 'jev-mario-request') {
    calls++;
    const error = new URL(location.href).searchParams.has('error') && calls === 1;
    const delay = new URL(location.href).searchParams.has('slow') ? 1000 : 10;
    setTimeout(() => frame.contentWindow.postMessage({type:'jev-mario-response',id:e.data.id,
      ...(error ? {error:'API利用上限に達しました。時間をおいて再試行してください。'} :
        {result:{choice:'right',confidence:.9,probabilities:{right:1},upstream_http_ms:5,model:'test-fixture'}})
    }, location.origin),delay);
  }
});
</script></html>
