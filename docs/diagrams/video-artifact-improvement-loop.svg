<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">動画素材保存・レビュー・次回改善ループ</title>
  <desc id="desc">成功動画を非公開原本として保存し、レビューを次回の明示的な有償生成へ引き継ぎ、販売前に権利とプライバシーを確認する構成図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#60a5fa"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#34d399"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb923c"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c084fc"/></marker>
    <style>
      text{font-family:"Noto Sans JP","Yu Gothic UI",sans-serif;fill:#f8fafc}
      .title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#cbd5e1}
      .lane{font-size:18px;font-weight:700}.boxTitle{font-size:20px;font-weight:800}.body{font-size:15px;fill:#dbeafe}.small{font-size:13px;fill:#cbd5e1}.number{font-size:16px;font-weight:800}
      .card{filter:url(#shadow);stroke-width:2}.edge{fill:none;stroke-width:3}.dash{stroke-dasharray:9 8}
    </style>
  </defs>
  <rect width="1600" height="1020" rx="28" fill="url(#bg)"/>
  <rect x="42" y="34" width="1516" height="108" rx="22" fill="url(#hero)" stroke="#6366f1" stroke-width="2"/>
  <text x="76" y="82" class="title">生成動画を「資産」に変える保存・レビュー・改善ループ</text>
  <text x="76" y="116" class="subtitle">原本は非公開で保存 ／ レビューは追記 ／ 改善は次回の明示的な有償生成へ ／ 販売公開は別承認</text>

  <text x="55" y="184" class="lane" fill="#93c5fd">A. 生成と保存</text>
  <text x="55" y="548" class="lane" fill="#fdba74">B. レビューと次回改善</text>
  <text x="55" y="824" class="lane" fill="#86efac">C. 販売準備の安全ゲート</text>

  <g class="card">
    <rect x="60" y="214" width="260" height="188" rx="20" fill="#0f2a4d" stroke="#60a5fa"/>
    <circle cx="94" cy="250" r="18" fill="#2563eb"/><text x="89" y="256" class="number">1</text>
    <text x="124" y="257" class="boxTitle">動画Studio</text>
    <text x="84" y="298" class="body">プロンプト・権利同意</text>
    <text x="84" y="325" class="body">5秒・720p・縦横比</text>
    <rect x="84" y="350" width="210" height="32" rx="10" fill="#2563eb"/><text x="128" y="372" class="small" fill="#fff">動画を生成（明示操作）</text>
  </g>

  <g class="card">
    <rect x="382" y="214" width="275" height="188" rx="20" fill="#132541" stroke="#60a5fa"/>
    <circle cx="416" cy="250" r="18" fill="#2563eb"/><text x="411" y="256" class="number">2</text>
    <text x="446" y="257" class="boxTitle">生成受付API</text>
    <text x="406" y="298" class="body">クレジット予約・冪等性</text>
    <text x="406" y="325" class="body">ジョブ作成・GPU起動</text>
    <text x="406" y="359" class="small">改善時：親素材ID＋レビューID</text>
    <text x="406" y="382" class="small">をジョブへ固定してから起動</text>
  </g>

  <g class="card">
    <rect x="719" y="214" width="265" height="188" rx="20" fill="#193044" stroke="#22d3ee"/>
    <circle cx="753" cy="250" r="18" fill="#0891b2"/><text x="748" y="256" class="number">3</text>
    <text x="783" y="257" class="boxTitle">GCP専用GPU</text>
    <text x="743" y="298" class="body">自社Workerで動画生成</text>
    <text x="743" y="325" class="body">MP4検証・サイズ取得</text>
    <text x="743" y="352" class="body">SHA-256を計算</text>
    <text x="743" y="382" class="small">Hedra / fal APIは不使用</text>
  </g>

  <g class="card">
    <rect x="1046" y="214" width="270" height="188" rx="20" fill="#10382f" stroke="#34d399"/>
    <circle cx="1080" cy="250" r="18" fill="#059669"/><text x="1075" y="256" class="number">4</text>
    <text x="1110" y="257" class="boxTitle">非公開Storage</text>
    <text x="1070" y="298" class="body">固定パスにMP4原本</text>
    <text x="1070" y="325" class="body">閲覧は短期署名URLのみ</text>
    <text x="1070" y="359" class="small">成功時だけ素材台帳へ登録</text>
    <text x="1070" y="382" class="small">失敗時は返金・素材なし</text>
  </g>

  <g class="card">
    <rect x="1372" y="214" width="170" height="188" rx="20" fill="#173d2f" stroke="#34d399"/>
    <circle cx="1406" cy="250" r="18" fill="#059669"/><text x="1401" y="256" class="number">5</text>
    <text x="1436" y="257" class="boxTitle">素材台帳</text>
    <text x="1396" y="298" class="body">原本・来歴</text>
    <text x="1396" y="325" class="body">販売候補</text>
    <text x="1396" y="352" class="body">確認待ち</text>
    <text x="1396" y="382" class="small">既存成功分も移行</text>
  </g>

  <path d="M320 308H382" class="edge" stroke="#60a5fa" marker-end="url(#arrowBlue)"/>
  <path d="M657 308H719" class="edge" stroke="#60a5fa" marker-end="url(#arrowBlue)"/>
  <path d="M984 308H1046" class="edge" stroke="#34d399" marker-end="url(#arrowGreen)"/>
  <path d="M1316 308H1372" class="edge" stroke="#34d399" marker-end="url(#arrowGreen)"/>
  <path d="M852 402V456H520V402" class="edge dash" stroke="#ef4444" marker-end="url(#arrowOrange)"/>
  <rect x="635" y="437" width="128" height="34" rx="10" fill="#3f1d25" stroke="#ef4444"/><text x="653" y="459" class="small" fill="#fecaca">失敗：自動返金</text>

  <g class="card">
    <rect x="120" y="582" width="350" height="184" rx="20" fill="#482817" stroke="#fb923c"/>
    <circle cx="154" cy="618" r="18" fill="#ea580c"/><text x="149" y="624" class="number">6</text>
    <text x="184" y="625" class="boxTitle">所有者レビュー</text>
    <text x="144" y="666" class="body">品質・指示一致・動き・販売価値</text>
    <text x="144" y="693" class="body">良い点・改善点・次回プロンプト</text>
    <text x="144" y="726" class="small">keep ／ improve ／ reject を追記保存</text>
  </g>

  <g class="card">
    <rect x="618" y="582" width="360" height="184" rx="20" fill="#35224d" stroke="#c084fc"/>
    <circle cx="652" cy="618" r="18" fill="#9333ea"/><text x="647" y="624" class="number">7</text>
    <text x="682" y="625" class="boxTitle">改善案を入力欄へ反映</text>
    <text x="642" y="666" class="body">改善版プロンプトを見える形で表示</text>
    <text x="642" y="693" class="body">元動画・採用レビューも表示</text>
    <text x="642" y="726" class="small">この時点では課金・自動生成しない</text>
  </g>

  <g class="card">
    <rect x="1126" y="582" width="350" height="184" rx="20" fill="#182d55" stroke="#60a5fa"/>
    <circle cx="1160" cy="618" r="18" fill="#2563eb"/><text x="1155" y="624" class="number">8</text>
    <text x="1190" y="625" class="boxTitle">次回の有償生成</text>
    <text x="1150" y="666" class="body">利用者が生成ボタンを押す</text>
    <text x="1150" y="693" class="body">通常どおり300 creditsを予約</text>
    <text x="1150" y="726" class="small">子動画から親素材・レビューを追跡可能</text>
  </g>

  <path d="M1457 402V520H295V582" class="edge" stroke="#fb923c" marker-end="url(#arrowOrange)"/>
  <path d="M470 674H618" class="edge" stroke="#c084fc" marker-end="url(#arrowPurple)"/>
  <path d="M978 674H1126" class="edge" stroke="#c084fc" marker-end="url(#arrowPurple)"/>
  <path d="M1301 582V510H520V402" class="edge dash" stroke="#60a5fa" marker-end="url(#arrowBlue)"/>
  <text x="878" y="500" class="small" fill="#93c5fd">親素材ID＋採用レビューIDを固定して戻る</text>

  <g class="card">
    <rect x="120" y="850" width="350" height="118" rx="20" fill="#263224" stroke="#a3e635"/>
    <text x="148" y="892" class="boxTitle">権利・許諾の確認</text>
    <text x="148" y="925" class="body">素材・人物・商用利用条件</text>
    <text x="148" y="950" class="small">未確認／NGなら公開へ進めない</text>
  </g>
  <g class="card">
    <rect x="625" y="850" width="350" height="118" rx="20" fill="#183a31" stroke="#34d399"/>
    <text x="653" y="892" class="boxTitle">商品化準備</text>
    <text x="653" y="925" class="body">説明・価格・パッケージを別工程で作成</text>
    <text x="653" y="950" class="small">ショップ商品は非公開ドラフトから開始</text>
  </g>
  <g class="card">
    <rect x="1130" y="850" width="350" height="118" rx="20" fill="#3b231b" stroke="#f59e0b"/>
    <text x="1158" y="892" class="boxTitle">明示承認後のみ販売公開</text>
    <text x="1158" y="925" class="body">Stripe・ショップ・外部投稿</text>
    <text x="1158" y="950" class="small">この改善ループは自動公開しない</text>
  </g>
  <path d="M470 909H625" class="edge" stroke="#34d399" marker-end="url(#arrowGreen)"/>
  <path d="M975 909H1130" class="edge dash" stroke="#f59e0b" marker-end="url(#arrowOrange)"/>
</svg>
