name: 障害報告（データベース）
description: クエリエラー・RLS 拒否・マイグレーション・性能劣化などデータベースの不具合や障害を報告する
title: "[Incident][Database] "
labels: ["bug", "supabase"]
body:
  - type: markdown
    attributes:
      value: |
        データベースまわりの不具合・障害の報告フォームです。手順は [`docs/INCIDENT_ESCALATION_RUNBOOK.md`](https://github.com/kanta13jp1/my_web_app/blob/main/docs/INCIDENT_ESCALATION_RUNBOOK.md) を参照してください。

        **接続文字列・service_role 鍵・実データの内容は貼らないでください。**
        調査中に `DELETE` / `DROP` / `TRUNCATE` などの破壊的操作を行わないでください（SOP §4 Step 3）。
  - type: dropdown
    id: severity
    attributes:
      label: 重大度の目安（docs/ONCALL_INCIDENT_SOP.md §1）
      description: データ毀損の恐れがある場合は SEV1 を選んでください。
      options:
        - SEV1（広範に利用不能・データ毀損や秘密情報露出の恐れ）
        - SEV2（主要機能の一部が劣化・回避が難しい）
        - SEV3（軽微・回避策あり）
    validations:
      required: true
  - type: input
    id: occurred_at
    attributes:
      label: 発生時刻（タイムゾーン付き）
      placeholder: 例 2026-11-26 03:30 JST
    validations:
      required: true
  - type: dropdown
    id: db_symptom
    attributes:
      label: 症状の種類
      multiple: true
      options:
        - クエリのエラー・タイムアウト
        - RLS による拒否（想定外の許可を含む）
        - マイグレーションの失敗・不整合
        - 接続エラー・接続数の枯渇
        - 性能劣化
        - データの欠損・不整合の疑い
        - その他
    validations:
      required: true
  - type: dropdown
    id: status_check
    attributes:
      label: 公式 Status ページの確認結果
      description: https://status.supabase.com/ を確認してください。
      options:
        - 未確認
        - 該当するインシデントの掲載なし
        - 該当するインシデントが掲載されている（URLを下の欄に記載）
    validations:
      required: true
  - type: input
    id: objects
    attributes:
      label: 対象のテーブル・関数・マイグレーション名（データ内容は書かない）
      placeholder: 例 hub_data / 20261101000000_example.sql
  - type: input
    id: error_code
    attributes:
      label: エラーコード（例 SQLSTATE）
  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: 影響を受ける機能・ユーザー・件数の目安（個人を特定する情報は書かない）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 期待する動作 / 実際の動作
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 秘匿情報を除いたログ・実行計画
      render: text
  - type: textarea
    id: tried
    attributes:
      label: 試した対処と結果（調査の段階）
      description: 自前確認 → 公式ドキュメント → コミュニティ → AI 支援 → 外部サポート のどこまで進めたか
  - type: checkboxes
    id: checklist
    attributes:
      label: 確認事項
      options:
        - label: 既存の Issue と docs/incident-reports を検索し、重複していないことを確認しました
          required: true
        - label: 秘匿情報・個人情報・実データを含めていません
          required: true
        - label: 破壊的な操作は行っていません（行った場合は本文に記載しました）
          required: true
