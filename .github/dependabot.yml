version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" は .github/workflows のみ対象。composite action は明示列挙が必要
    # (actions/cache@v4 が Node 20 deprecation まで放置された根本原因)
    directories:
      - "/"
      - "/.github/actions/setup-flutter-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:10"
      timezone: "Asia/Tokyo"
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    rebase-strategy: "auto"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:20"
      timezone: "Asia/Tokyo"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    rebase-strategy: "auto"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    groups:
      flutter-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # flutter_native_splash >=2.4.8 は meta ^1.18.0 を要求するが、CI の
      # Flutter stable (3.38.x) は flutter_test が meta 1.17.0 を pin しており
      # group 全体の `flutter pub get` が version solving fail になる
      # (Issue #3209 / #3211 / 2026-06-02 #3057 から週次再発)。
      #
      # 2026-07-14: `versions: [">=2.4.8"]` 修飾付き ignore (2026-06-11 #3214) は
      # 効いておらず、pubspec 側の上限 pin `">=2.4.7 <2.4.8"` (2026-06-22
      # 7108258f4) も dependabot が pin ごと `^2.4.8` へ広げる提案を出すため
      # 素通り。結果 #3606 / #3827 が赤で close、#3986 も同じ経路を辿った。
      # → versions 修飾を外し「この依存の更新提案自体を出さない」形にする。
      # 解除条件: CI の Flutter stable が meta >=1.18.0 を同梱したらこの entry を
      # 削除し、pubspec の上限 pin も `^2.4.8` 以降へ戻す。
      - dependency-name: "flutter_native_splash"
    rebase-strategy: "auto"
