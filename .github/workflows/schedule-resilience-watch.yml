name: Schedule Resilience Watch

on:
  schedule:
    - cron: "22 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect workflows without retrying runs or writing issues"
        required: false
        default: "false"

permissions: {}

concurrency:
  group: schedule-resilience-watch
  cancel-in-progress: true  # 2026-07-16 ci-audit: 4h毎モニタリングのキュー積み防止

jobs:
  watch:
    permissions:
      actions: write
      contents: read
      issues: write
    name: Watch production workflow resilience
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Watch production workflows
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          mkdir -p tmp/schedule-resilience
          DRY_RUN_ARG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python scripts/schedule_resilience_watch.py \
            --repo "$GITHUB_REPOSITORY" \
            --max-attempts 2 \
            --output tmp/schedule-resilience/report.json \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            $DRY_RUN_ARG

      - name: Upload resilience report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schedule-resilience-report
          path: tmp/schedule-resilience/
          if-no-files-found: warn
