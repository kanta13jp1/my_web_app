name: Edge Function UI Audit (UI導線チェック)

# 毎時47分 + 手動実行
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: edge-function-audit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    name: Check Edge Function UI Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Edge Functions vs UI references
        id: audit
        run: |
          echo "## Edge Function UI導線チェック" > /tmp/audit_report.txt
          echo "" >> /tmp/audit_report.txt
          echo "| Function | UIから呼び出し | 参照ファイル |" >> /tmp/audit_report.txt
          echo "|----------|---------------|-------------|" >> /tmp/audit_report.txt

          MISSING=""
          TOTAL=0
          COVERED=0
          # Supabase upsert 用JSON配列
          UPSERT_PAYLOAD="["

          for DIR in supabase/functions/*/; do
            FUNC=$(basename "$DIR")
            # _shared, deno.json等を除外
            if [ "$FUNC" = "_shared" ] || [ ! -f "$DIR/index.ts" ]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))

            # lib/ 内で関数名が参照されているか
            REF=$(grep -rl "$FUNC" lib/ 2>/dev/null | head -1 || true)

            if [ -n "$REF" ]; then
              COVERED=$((COVERED + 1))
              echo "| $FUNC | ✅ | $REF |" >> /tmp/audit_report.txt
              UPSERT_PAYLOAD="${UPSERT_PAYLOAD}{\"function_name\":\"${FUNC}\",\"has_ui_caller\":true,\"caller_file\":\"${REF}\",\"last_checked\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"},"
            else
              MISSING="${MISSING}${FUNC}\n"
              echo "| $FUNC | ❌ 未接続 | - |" >> /tmp/audit_report.txt
              UPSERT_PAYLOAD="${UPSERT_PAYLOAD}{\"function_name\":\"${FUNC}\",\"has_ui_caller\":false,\"caller_file\":null,\"last_checked\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"},"
            fi
          done

          # 末尾のカンマを除去して配列を閉じる
          UPSERT_PAYLOAD="${UPSERT_PAYLOAD%,}]"

          echo "" >> /tmp/audit_report.txt
          echo "**カバレッジ: ${COVERED}/${TOTAL}**" >> /tmp/audit_report.txt

          MISSING_COUNT=$((TOTAL - COVERED))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "covered=$COVERED" >> $GITHUB_OUTPUT
          echo "missing_count=$MISSING_COUNT" >> $GITHUB_OUTPUT

          if [ $MISSING_COUNT -gt 0 ]; then
            echo "has_missing=true" >> $GITHUB_OUTPUT
            echo "missing<<EOF" >> $GITHUB_OUTPUT
            echo -e "$MISSING" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_missing=false" >> $GITHUB_OUTPUT
          fi

          # upsert payload をファイルに保存
          echo "$UPSERT_PAYLOAD" > /tmp/upsert_payload.json

          cat /tmp/audit_report.txt

      - name: Upsert results to Supabase (admin dashboardで表示用)
        env:
          SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "⚠️ SUPABASE_SERVICE_ROLE_KEY が未設定 - Supabase upsert をスキップ"
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /tmp/upsert_result.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            "$SUPABASE_URL/rest/v1/edge_function_ui_status" \
            -d @/tmp/upsert_payload.json \
            --max-time 15)

          echo "Supabase upsert HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase upsert 成功"
          else
            echo "⚠️ Supabase upsert 失敗 (HTTP $HTTP_CODE)"
            cat /tmp/upsert_result.json 2>/dev/null || true
          fi

      - name: Create/Update Issue if missing functions
        if: steps.audit.outputs.has_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TITLE="[自動] Edge Function UI導線チェック: ${{ steps.audit.outputs.missing_count }}件未接続 ($DATE)"

          BODY="## Edge Function UI導線チェック結果

          **日時**: $DATE
          **カバレッジ**: ${{ steps.audit.outputs.covered }}/${{ steps.audit.outputs.total }}
          **未接続**: ${{ steps.audit.outputs.missing_count }}件

          ### 未接続の Edge Functions
          \`\`\`
          ${{ steps.audit.outputs.missing }}
          \`\`\`

          ### 対応方法
          各 Edge Function に対して \`lib/\` 内にUIからの呼び出しを追加してください。

          ---
          *自動生成: edge-function-audit.yml*"

          # 既存の同種Issueを全て閉じる (タイトルプレフィックスで検索)
          gh issue list --state open --json number,title \
            --jq '.[] | select(.title | startswith("[自動] Edge Function UI導線チェック")) | .number' \
            2>/dev/null | while read NUM; do
            gh issue close "$NUM" --comment "新しい監査結果で更新" 2>/dev/null || true
          done

          # 新しいIssueを作成
          gh issue create \
            --title "$TITLE" \
            --body "$BODY" 2>/dev/null || \
          echo "⚠️ Issue作成失敗"

      - name: Close issue when fully covered
        if: steps.audit.outputs.has_missing == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state open --json number,title \
            --jq '.[] | select(.title | startswith("[自動] Edge Function UI導線チェック")) | .number' \
            2>/dev/null | while read NUM; do
            gh issue close "$NUM" --comment "✅ カバレッジ100%達成。未接続のEdge Functionはありません。" 2>/dev/null || true
          done

      - name: Record to schedule_task_runs
        if: always()
        run: |
          COVERED="${{ steps.audit.outputs.covered }}"
          TOTAL="${{ steps.audit.outputs.total }}"
          MISSING="${{ steps.audit.outputs.missing_count }}"
          STATUS="success"
          [ "$MISSING" != "0" ] && STATUS="partial"
          SUMMARY="Edge Function UI Audit: ${COVERED}/${TOTAL} covered, ${MISSING} missing"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"edge-function-ui-sync\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Summary
        run: |
          echo "✅ Edge Function UI導線チェック完了"
          echo "  カバレッジ: ${{ steps.audit.outputs.covered }}/${{ steps.audit.outputs.total }}"
          echo "  未接続: ${{ steps.audit.outputs.missing_count }}件"
