name: Isolated Auth Restore Compatibility
on:
  pull_request:
    paths:
      - .github/workflows/supabase-backup-restore.yml
      - .github/workflows/auth-restore-compat.yml
      - scripts/sql/supabase_auth_recovery_codes_20260824.sql
      - scripts/sql/supabase_storage_v1_71_0_0062.sql
      - scripts/sql/supabase_storage_lifecycle_0068_0069.sql
permissions: {}
concurrency:
  group: auth-restore-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.115.0
      - name: Validate official compatibility SQL without production credentials
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          trap 'supabase stop --workdir "$target" --no-backup >/dev/null 2>&1 || true' EXIT
          supabase init --workdir "$target"
          sed -i 's/major_version = [0-9][0-9]*/major_version = 17/' "$target/supabase/config.toml"
          supabase start --workdir "$target" --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}')"
          test -n "$container"
          test "$(echo "$container" | wc -l)" -eq 1
          echo "1ae2cae8d87ab6df4eb00e211a9e0b966b8254da5c4a8d689641770c234fa571  scripts/sql/supabase_auth_recovery_codes_20260824.sql" | sha256sum --check
          docker cp scripts/sql/supabase_auth_recovery_codes_20260824.sql "$container:/tmp/compat.sql"
          for pass in 1 2; do
            docker exec "$container" sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql --host 127.0.0.1 --username supabase_auth_admin --dbname postgres --variable ON_ERROR_STOP=1 --file /tmp/compat.sql'
          done
          echo "45969060b55102f56af317b0d7981434be58927de1ff76e1e1789139a3f2defc  scripts/sql/supabase_storage_v1_71_0_0062.sql" | sha256sum --check
          echo "139969ce1a32e6385979f5d86fea78f2ba14a23342ece274122bbbd9a863be78  scripts/sql/supabase_storage_lifecycle_0068_0069.sql" | sha256sum --check
          docker cp scripts/sql/supabase_storage_v1_71_0_0062.sql "$container:/tmp/storage-core.sql"
          docker cp scripts/sql/supabase_storage_lifecycle_0068_0069.sql "$container:/tmp/storage-lifecycle.sql"
          docker exec "$container" sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql --host 127.0.0.1 --username supabase_storage_admin --dbname postgres --variable ON_ERROR_STOP=1 --file /tmp/storage-core.sql'
          for pass in 1 2; do
            docker exec "$container" sh -c 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql --host 127.0.0.1 --username supabase_storage_admin --dbname postgres --variable ON_ERROR_STOP=1 --file /tmp/storage-lifecycle.sql'
          done
          docker exec -i "$container" psql --username postgres --dbname postgres --variable ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF to_regclass('auth.mfa_recovery_code_sets') IS NULL OR to_regclass('auth.mfa_recovery_codes') IS NULL THEN
              RAISE EXCEPTION 'Recovery tables missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_enum WHERE enumtypid = 'auth.factor_type'::regtype AND enumlabel = 'recovery_code') THEN
              RAISE EXCEPTION 'Recovery factor type missing';
            END IF;
            IF (SELECT count(*) FROM pg_constraint WHERE conrelid IN ('auth.mfa_recovery_code_sets'::regclass, 'auth.mfa_recovery_codes'::regclass) AND contype = 'f') <> 3 THEN
              RAISE EXCEPTION 'Expected three recovery foreign keys';
            END IF;
            IF to_regclass('auth.mfa_recovery_codes_set_id_idx') IS NULL THEN
              RAISE EXCEPTION 'Recovery lookup index missing';
            END IF;
            IF to_regclass('auth.scim_users') IS NULL OR to_regclass('auth.scim_tokens') IS NULL THEN
              RAISE EXCEPTION 'SCIM tables missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'auth' AND table_name = 'one_time_tokens' AND column_name = 'expires_at' AND data_type = 'timestamp with time zone') THEN
              RAISE EXCEPTION 'one_time_tokens.expires_at missing or incorrect type';
            END IF;
            IF (SELECT count(*) FROM information_schema.columns WHERE table_schema = 'storage' AND table_name = 'buckets' AND column_name IN ('lifecycle_configuration', 'lifecycle_configuration_generation')) <> 2 THEN
              RAISE EXCEPTION 'Storage lifecycle columns missing';
            END IF;
            IF (SELECT count(*) FROM pg_constraint WHERE conrelid = 'storage.buckets'::regclass AND conname LIKE 'buckets_lifecycle_configuration_%_check' AND convalidated) <> 3 THEN
              RAISE EXCEPTION 'Storage lifecycle constraints missing or unvalidated';
            END IF;
          END $$;
          SQL
