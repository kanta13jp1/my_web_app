name: Two-Instance Routing Audit

on:
  pull_request:
    paths:
      - ".github/COMPRESSED_PROMPT_V3.md"
      - ".github/workflows/**"
      - "docs/**"
      - "scripts/two_instance_audit.py"
  workflow_dispatch:

concurrency:
  group: two-instance-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check canonical 2-instance routing markers
        run: python scripts/two_instance_audit.py --fail-on-active
