name: Agent Skill Contract

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "scripts/validate_agent_skills.py"
      - "scripts/ai_tool_watch.py"
      - "scripts/artifact_intake.py"
      - "scripts/check_minimal_e2e_gate.py"
      - "scripts/cloud_first_route.py"
      - "scripts/check_migration_timestamps.py"
      - "scripts/codex_session_check.py"
      - "scripts/knowledge_vault_lint.py"
      - "scripts/memory_ingest.py"
      - "scripts/sync_inject_rules.py"
      - "scripts/wiki_*.py"
      - "test/scripts/test_validate_agent_skills.py"
      - "test/scripts/test_agent_skill_cli_contract.py"
      - "test/scripts/test_design_ssot_contract.py"
      - "test/scripts/test_musubi_skill_scripts.py"
      - "test/scripts/test_youtube_skill_scripts.py"
      - "docs/DESIGN.md"
      - "docs/DESIGN_TOOLING_SETUP.md"
      - ".claude/commands/*design*.md"
      - ".claude/agents/design-skills.md"
      - ".claude/skills/ui-design/**"
      - ".github/workflows/agent-skill-contract.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "scripts/validate_agent_skills.py"
      - "scripts/ai_tool_watch.py"
      - "scripts/artifact_intake.py"
      - "scripts/check_minimal_e2e_gate.py"
      - "scripts/cloud_first_route.py"
      - "scripts/check_migration_timestamps.py"
      - "scripts/codex_session_check.py"
      - "scripts/knowledge_vault_lint.py"
      - "scripts/memory_ingest.py"
      - "scripts/sync_inject_rules.py"
      - "scripts/wiki_*.py"
      - "test/scripts/test_validate_agent_skills.py"
      - "test/scripts/test_agent_skill_cli_contract.py"
      - "test/scripts/test_design_ssot_contract.py"
      - "test/scripts/test_musubi_skill_scripts.py"
      - "test/scripts/test_youtube_skill_scripts.py"
      - "docs/DESIGN.md"
      - "docs/DESIGN_TOOLING_SETUP.md"
      - ".claude/commands/*design*.md"
      - ".claude/agents/design-skills.md"
      - ".claude/skills/ui-design/**"
      - ".github/workflows/agent-skill-contract.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-skill-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate A/B skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet notebooklm-py PyYAML==6.0.3

      - name: Test validator
        run: python test/scripts/test_validate_agent_skills.py

      - name: Test skill behavior and documentation contracts
        run: |
          python test/scripts/test_agent_skill_cli_contract.py
          python test/scripts/test_design_ssot_contract.py
          python test/scripts/test_musubi_skill_scripts.py
          python test/scripts/test_youtube_skill_scripts.py
          python .agents/skills/github-backlog-worktree-drain/scripts/test_worktree_state.py

      - name: Validate A/B skill contracts
        run: python scripts/validate_agent_skills.py
