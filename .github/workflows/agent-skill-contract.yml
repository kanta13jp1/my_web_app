name: Agent Skill Contract

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "scripts/validate_agent_skills.py"
      - "scripts/ai_tool_watch.py"
      - "scripts/check_migration_timestamps.py"
      - "scripts/codex_session_check.py"
      - "scripts/knowledge_vault_lint.py"
      - "scripts/memory_ingest.py"
      - "scripts/sync_inject_rules.py"
      - "scripts/wiki_*.py"
      - "test/scripts/test_validate_agent_skills.py"
      - "test/scripts/test_agent_skill_cli_contract.py"
      - ".github/workflows/agent-skill-contract.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "scripts/validate_agent_skills.py"
      - "scripts/ai_tool_watch.py"
      - "scripts/check_migration_timestamps.py"
      - "scripts/codex_session_check.py"
      - "scripts/knowledge_vault_lint.py"
      - "scripts/memory_ingest.py"
      - "scripts/sync_inject_rules.py"
      - "scripts/wiki_*.py"
      - "test/scripts/test_validate_agent_skills.py"
      - "test/scripts/test_agent_skill_cli_contract.py"
      - ".github/workflows/agent-skill-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-skill-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate A/B skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install external smoke dependency
        run: python -m pip install --quiet notebooklm-py

      - name: Test validator
        run: python test/scripts/test_validate_agent_skills.py

      - name: Validate A/B skill contracts
        run: python scripts/validate_agent_skills.py
