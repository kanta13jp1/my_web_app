name: WBS User Task Notify

on:
  schedule:
    - cron: "27 0 * * *" # 09:27 JST (2026-07-17 ci-audit: 00:00 UTC 8本集中を分散)
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum user tasks to notify"
        required: false
        default: "20"

concurrency:
  group: wbs-user-notify
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    environment:
      name: wbs-automation-production
      deployment: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TOOLS_HUB_URL: ${{ secrets.SUPABASE_TOOLS_HUB_URL }}
      SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIMIT: ${{ github.event.inputs.limit || '20' }}

    steps:
      - name: Notify Slack
        run: |
          if [ -z "$TOOLS_HUB_URL" ]; then
            TOOLS_HUB_URL="https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/tools-hub"
          fi

          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is missing; skip WBS user task notify"
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /tmp/notify_resp.json -w "%{http_code}" \
            -X POST "$TOOLS_HUB_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -d "{\"action\":\"wbs.notify_user_tasks\",\"send_slack\":true,\"limit\":${LIMIT}}" \
            --max-time 30)

          echo "HTTP_CODE=$HTTP_CODE"
          cat /tmp/notify_resp.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::tools-hub returned HTTP $HTTP_CODE"
            exit 0
          fi

          COUNT=$(jq -r '.user_tasks_count // .count // 0' /tmp/notify_resp.json)
          URGENT=$(jq -r '.urgent_count // 0' /tmp/notify_resp.json)
          echo "WBS user tasks notified: count=${COUNT}, urgent=${URGENT}"
