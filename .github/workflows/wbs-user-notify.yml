name: WBS User Task Notify

on:
  schedule:
    - cron: "27 0 * * *" # 09:27 JST (2026-07-17 ci-audit: 00:00 UTC 8本集中を分散)
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum user tasks to notify"
        required: false
        default: "20"

concurrency:
  group: wbs-user-notify
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    environment:
      name: wbs-automation-production
      deployment: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TOOLS_HUB_URL: ${{ secrets.SUPABASE_TOOLS_HUB_URL }}
      SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIMIT: ${{ github.event.inputs.limit || '20' }}

    steps:
      - name: Step 1 - Secret presence check
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOOLS_HUB_URL" ]; then
            echo "::error::SUPABASE_TOOLS_HUB_URL is not configured; notification was not sent."
            exit 1
          fi
          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::SERVICE_ROLE_KEY is not configured; notification was not sent."
            exit 1
          fi

      - name: Step 2 - Call wbs.notify_user_tasks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$LIMIT" =~ ^[0-9]+$ ]] || [ "${#LIMIT}" -gt 3 ] || (( 10#$LIMIT < 1 || 10#$LIMIT > 100 )); then
            echo "::error::limit must be an integer from 1 to 100."
            exit 1
          fi
          LIMIT=$((10#$LIMIT))
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          if ! HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            "$TOOLS_HUB_URL" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"wbs.notify_user_tasks\",\"send_slack\":true,\"limit\":${LIMIT}}" \
            --max-time 30); then
            echo "::error::Notification transport failed; response omitted."
            exit 1
          fi
          if [[ ! "$HTTP_CODE" =~ ^[0-9]{3}$ ]]; then
            echo "::error::Invalid HTTP status; response omitted."
            exit 1
          fi
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Notification failed; response omitted."
            exit 1
          fi
          python3 - "$RESPONSE_FILE" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as response:
                  raw = response.read(1048577)
              if len(raw) > 1048576:
                  raise ValueError("oversized")
              payload = json.loads(raw)
              count = payload.get("user_tasks_count") if isinstance(payload, dict) else None
              if type(count) is not int or not 0 <= count <= 100:
                  raise ValueError("invalid count")
          except (OSError, ValueError):
              print("::error::Invalid notification response; content omitted.")
              sys.exit(1)
          print(f"Notified {count} user task(s) to Slack")
          PY
