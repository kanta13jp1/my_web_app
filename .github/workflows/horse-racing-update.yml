name: Horse Racing Auto Update

on:
  schedule:
    # 毎時00分 (UTC) = 毎時09分 JST — 出走表+AI予想+結果を1時間毎に更新
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード (entries / results / predict / history / evaluate / backfill / stats / dqs_recalc / all)"
        required: false
        default: "all"
      date:
        description: "対象日付 YYYY-MM-DD (省略時は今日)"
        required: false
        default: ""
      days:
        description: "backfill/stats モード時に遡る日数 (backfill デフォルト: 21 / stats デフォルト: 7)"
        required: false
        default: "21"

concurrency:
  group: horse-racing-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  horse-racing-update:
    name: 競馬情報更新 (出走表+AI予想+結果)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 対象日付を設定
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "TARGET_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "TARGET_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_ENV"
          fi

      - name: 競馬情報更新 (all mode)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOOLS_HUB_URL: ${{ secrets.SUPABASE_URL_PROD }}/functions/v1/tools-hub
        run: |
          MODE="${{ inputs.mode }}"
          python scripts/fetch_horse_racing.py --mode "${MODE:-all}" --date "$TARGET_DATE"

      - name: 前走情報取得 (JST 9時台 or history/all モード時のみ)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$HOUR" = "09" ] || [ "$MODE" = "history" ] || [ "$MODE" = "all" ]; then
            echo "前走情報取得を実行 (時刻: ${HOUR}時, モード: ${MODE:-all})"
            python scripts/fetch_horse_racing.py --mode history --date "$TARGET_DATE"
          else
            echo "前走情報取得はスキップ (時刻: ${HOUR}時)"
          fi

      - name: 精度再評価バッチ (JST 23時台 or evaluate/all モード時のみ)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOOLS_HUB_URL: ${{ secrets.SUPABASE_URL_PROD }}/functions/v1/tools-hub
        run: |
          MODE="${{ inputs.mode }}"
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$HOUR" = "23" ] || [ "$MODE" = "evaluate" ] || [ "$MODE" = "all" ]; then
            echo "精度再評価バッチを実行 (時刻: ${HOUR}時, モード: ${MODE:-all})"
            python scripts/fetch_horse_racing.py --mode evaluate --limit 100
          else
            echo "精度再評価はスキップ (時刻: ${HOUR}時)"
          fi

      - name: 過去学習データbackfill (日曜JST 23時台 or backfill モード時のみ)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOOLS_HUB_URL: ${{ secrets.SUPABASE_URL_PROD }}/functions/v1/tools-hub
        run: |
          MODE="${{ inputs.mode }}"
          HOUR=$(TZ=Asia/Tokyo date +%H)
          DOW=$(TZ=Asia/Tokyo date +%u)
          DAYS="${{ inputs.days || '21' }}"
          if [ "$MODE" = "backfill" ] || ([ "$DOW" = "7" ] && [ "$HOUR" = "23" ]); then
            echo "過去学習データbackfillを実行 (DOW=${DOW}, 時刻=${HOUR}時, days=${DAYS})"
            python scripts/fetch_horse_racing.py --mode backfill --date "$TARGET_DATE" --days "$DAYS"
          else
            echo "backfillはスキップ (DOW=${DOW}, 時刻=${HOUR}時)"
          fi

      - name: 学習統計レポート (JST 0時台 or stats/all モード時のみ)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          HOUR=$(TZ=Asia/Tokyo date +%H)
          STAT_DAYS="${{ inputs.days || '7' }}"
          if [ "$MODE" = "stats" ] || [ "$MODE" = "all" ] || [ "${MODE}" = "" ] && [ "$HOUR" = "00" ]; then
            echo "学習統計レポートを出力 (時刻: ${HOUR}時, モード: ${MODE:-all}, days=${STAT_DAYS})"
            python scripts/fetch_horse_racing.py --mode stats --days "$STAT_DAYS"
          else
            echo "統計レポートはスキップ (時刻: ${HOUR}時)"
          fi

      - name: 完了サマリー
        run: |
          echo "### 競馬情報更新完了" >> "$GITHUB_STEP_SUMMARY"
          echo "- 対象日: $TARGET_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "- モード: ${{ inputs.mode || 'all' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 実行時刻: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" >> "$GITHUB_STEP_SUMMARY"
