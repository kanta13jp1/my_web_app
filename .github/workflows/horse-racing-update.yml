name: Horse Racing Auto Update

on:
  schedule:
    # 4時間ごと00分 (UTC) — 2026-06-11 ci-audit: 毎時→2時間 / 2026-06-21 ci-audit: 2時間→4時間, 追加180runs/月削減
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード (entries / results / predict / history / evaluate / backfill / stats / dqs_recalc / all)"
        required: false
        default: "all"
      date:
        description: "対象日付 YYYY-MM-DD (省略時は今日)"
        required: false
        default: ""
      days:
        description: "backfill/stats モード時に遡る日数 (backfill デフォルト: 21 / stats デフォルト: 7)"
        required: false
        default: "21"
      force:
        description: "backfill モード: 既存ベースライン予想を上書き再生成 (ランキング算法変更後に true)"
        required: false
        default: "false"

concurrency:
  group: horse-racing-update
  cancel-in-progress: false

permissions: {}

jobs:
  horse-racing-update:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      contents: read
    name: 競馬情報更新 (出走表+AI予想+結果)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: 対象日付を設定
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "TARGET_DATE=$INPUT_DATE" >> "$GITHUB_ENV"
          else
            echo "TARGET_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_ENV"
          fi

      - name: 競馬情報更新 (all mode)
        env:
          MODE: ${{ inputs.mode || 'all' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOOLS_HUB_URL: ${{ secrets.SUPABASE_URL_PROD }}/functions/v1/tools-hub
        run: |
          # 専用ステップがある mode は skip (二重実行 + 504 timeout 防止)
          # history/evaluate/backfill/stats/dqs_recalc は各専用ステップで処理
          SKIP_MODES="history evaluate backfill stats dqs_recalc"
          for skip in $SKIP_MODES; do
            if [ "$MODE" = "$skip" ]; then
              echo "モード=${MODE} は専用ステップで処理するため all mode スキップ"
              exit 0
            fi
          done
          python scripts/fetch_horse_racing.py --mode "${MODE:-all}" --date "$TARGET_DATE"

      - name: 前走情報取得 (JST 9時台 or history/all モード時のみ)
        env:
          MODE: ${{ inputs.mode || 'all' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$HOUR" = "09" ] || [ "$MODE" = "history" ] || [ "$MODE" = "all" ]; then
            echo "前走情報取得を実行 (時刻: ${HOUR}時, モード: ${MODE:-all})"
            python scripts/fetch_horse_racing.py --mode history --date "$TARGET_DATE"
          else
            echo "前走情報取得はスキップ (時刻: ${HOUR}時)"
          fi

      - name: 精度再評価バッチ (JST 17〜23時台 or evaluate/all モード時のみ)
        env:
          MODE: ${{ inputs.mode || 'all' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOOLS_HUB_URL: ${{ secrets.SUPABASE_URL_PROD }}/functions/v1/tools-hub
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%H)
          # JST 17:00〜23:00 に実行 — 結果は通常17時以降に確定するため即時評価
          # evaluate は冪等なので同一レースの二重実行はスキップされる
          if [ "$HOUR" -ge 17 ] || [ "$MODE" = "evaluate" ] || [ "$MODE" = "all" ]; then
            echo "精度再評価バッチを実行 (時刻: ${HOUR}時, モード: ${MODE:-all})"
            python scripts/fetch_horse_racing.py --mode evaluate --limit 100
          else
            echo "精度再評価はスキップ (時刻: ${HOUR}時)"
          fi

      - name: 過去学習データbackfill (日曜JST 23時台 or backfill モード時のみ)
        env:
          MODE: ${{ inputs.mode || 'all' }}
          DAYS: ${{ inputs.days || '21' }}
          FORCE: ${{ inputs.force || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOOLS_HUB_URL: ${{ secrets.SUPABASE_URL_PROD }}/functions/v1/tools-hub
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%H)
          DOW=$(TZ=Asia/Tokyo date +%u)
          if [ "$MODE" = "backfill" ] || ([ "$DOW" = "7" ] && [ "$HOUR" = "23" ]); then
            echo "過去学習データbackfillを実行 (DOW=${DOW}, 時刻=${HOUR}時, days=${DAYS}, force=${FORCE})"
            FORCE_FLAG=""
            if [ "$FORCE" = "true" ]; then FORCE_FLAG="--force"; fi
            python scripts/fetch_horse_racing.py --mode backfill --date "$TARGET_DATE" --days "$DAYS" $FORCE_FLAG
          else
            echo "backfillはスキップ (DOW=${DOW}, 時刻=${HOUR}時)"
          fi

      - name: 学習統計レポート (JST 0時台 or stats/all モード時のみ)
        env:
          MODE: ${{ inputs.mode || 'all' }}
          STAT_DAYS: ${{ inputs.days || '7' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$MODE" = "stats" ] || [ "$MODE" = "all" ] || [ "${MODE}" = "" ] && [ "$HOUR" = "00" ]; then
            echo "学習統計レポートを出力 (時刻: ${HOUR}時, モード: ${MODE:-all}, days=${STAT_DAYS})"
            python scripts/fetch_horse_racing.py --mode stats --days "$STAT_DAYS"
          else
            echo "統計レポートはスキップ (時刻: ${HOUR}時)"
          fi

      - name: データ品質スコア再計算 (日曜JST 1時台 or dqs_recalc モード時のみ)
        env:
          MODE: ${{ inputs.mode || 'all' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%H)
          DOW=$(TZ=Asia/Tokyo date +%u)
          if [ "$MODE" = "dqs_recalc" ] || ([ "$DOW" = "7" ] && [ "$HOUR" = "01" ]); then
            echo "データ品質スコア再計算を実行 (DOW=${DOW}, 時刻=${HOUR}時)"
            python scripts/fetch_horse_racing.py --mode dqs_recalc
          else
            echo "dqs_recalcはスキップ (DOW=${DOW}, 時刻=${HOUR}時)"
          fi

      - name: 完了サマリー
        env:
          SUMMARY_MODE: ${{ inputs.mode || 'all' }}
        run: |
          echo "### 競馬情報更新完了" >> "$GITHUB_STEP_SUMMARY"
          echo "- 対象日: $TARGET_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "- モード: $SUMMARY_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- 実行時刻: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" >> "$GITHUB_STEP_SUMMARY"
