name: Daily Report (日次レポート + X投稿 + 競合モニタリング)

on:
  schedule:
    - cron: "30 22 * * *"  # 毎日 07:30 JST (UTC 22:30) — Claude Schedule (09:00 JST) より1.5時間前に実行
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions: {}

jobs:
  daily-report:
    environment:
      name: analytics-production
      deployment: false
    permissions:
      contents: write
      issues: read
      pull-requests: write
    name: Generate Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 200
          token: ${{ secrets.BYPASS_RULES || github.token }}

      - name: Quota Guard — Anthropic circuit breaker check
        id: quota_check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_circuit_breaker?provider=eq.anthropic&select=state,expires_at" \
            --max-time 5 2>/dev/null || echo "[]")
          STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "closed"' 2>/dev/null || echo "closed")
          EXPIRES=$(echo "$RESPONSE" | jq -r '.[0].expires_at // ""' 2>/dev/null || echo "")
          if [ "$STATE" = "open" ] && [ -n "$EXPIRES" ]; then
            NOW=$(date -u +%s)
            EXP=$(date -u -d "$EXPIRES" +%s 2>/dev/null || echo "9999999999")
            [ "$EXP" -lt "$NOW" ] && STATE="closed" && echo "⏰ CB expired → closed"
          fi
          if [ "$STATE" = "open" ]; then
            echo "⚠️ Anthropic quota exceeded — AI steps skipped"
            echo "anthropic_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Anthropic available"
            echo "anthropic_available=true" >> $GITHUB_OUTPUT
          fi

      # ── Step 1: 日次メトリクス取得 ──────────────────────────────────────────
      - name: Step 1 - Supabase daily-digest 取得 (schedule-hub:digest.run)
        id: digest
        run: |
          HTTP_CODE=$(curl -s -o /tmp/digest.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"digest.run"}' \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub" \
            --max-time 20)

          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" = "200" ]; then
            TOTAL_USERS=$(jq -r '.digest.users.total // 0'                      /tmp/digest.json)
            NEW_TODAY=$(  jq -r '.digest.featureRequests.newToday // 0'         /tmp/digest.json)
            OPEN_COUNT=$( jq -r '.digest.featureRequests.openCount // 0'        /tmp/digest.json)
            PAID_CUSTOMERS=$(jq -r '.digest.paid.total // 0'                    /tmp/digest.json)
            MRR_YEN=$(       jq -r '.digest.revenue.mrrYen // 0'                /tmp/digest.json)
            # リスト系はファイル経由で渡す（改行対応）
            jq -r '.digest.featureRequests.newTodayList // [] | .[] | "- " + .title' \
              /tmp/digest.json > /tmp/new_today_list.txt 2>/dev/null || echo "(なし)" > /tmp/new_today_list.txt
            jq -r '.digest.featureRequests.topOpen // [] | .[] | "- \(.votes)票 \(.title)"' \
              /tmp/digest.json > /tmp/top_open.txt 2>/dev/null || echo "(なし)" > /tmp/top_open.txt
            jq -r '.digest.recentAchievements // [] | .[] | "- " + .title' \
              /tmp/digest.json > /tmp/achievements.txt 2>/dev/null || echo "(なし)" > /tmp/achievements.txt
            echo "api_ok=true" >> $GITHUB_OUTPUT

            # WEB版 Claude Schedule 用: メトリクスJSONをリポジトリに保存
            # (WebFetchはAuthヘッダー不可のため、GitHub MCP経由でこのファイルを読む)
            mkdir -p docs/metrics
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            jq --arg date "$DATE" --arg ts "$(TZ=Asia/Tokyo date -Iseconds)" \
              '. + {fetched_at: $ts, report_date: $date}' \
              /tmp/digest.json > docs/metrics/daily-metrics.json
          else
            TOTAL_USERS="取得失敗(HTTP $HTTP_CODE)"
            NEW_TODAY="0"
            OPEN_COUNT="0"
            PAID_CUSTOMERS="0"
            MRR_YEN="0"
            echo "(API接続失敗)" > /tmp/new_today_list.txt
            echo "(API接続失敗)" > /tmp/top_open.txt
            echo "(API接続失敗)" > /tmp/achievements.txt
            echo "api_ok=false" >> $GITHUB_OUTPUT
          fi

          echo "total_users=$TOTAL_USERS" >> $GITHUB_OUTPUT
          echo "new_today=$NEW_TODAY"     >> $GITHUB_OUTPUT
          echo "open_count=$OPEN_COUNT"   >> $GITHUB_OUTPUT
          echo "paid_customers=$PAID_CUSTOMERS" >> $GITHUB_OUTPUT
          echo "mrr_yen=$MRR_YEN"               >> $GITHUB_OUTPUT
          echo "📊 ユーザー: $TOTAL_USERS / 新規要望: $NEW_TODAY / 未対応: $OPEN_COUNT / 課金: $PAID_CUSTOMERS / MRR: ¥$MRR_YEN"

      # ── Step 2: git log 直近24時間 ──────────────────────────────────────────
      - name: Step 2 - 直近24時間の開発実績
        id: gitlog
        run: |
          git log --oneline --since='24 hours ago' > /tmp/recent_commits.txt 2>/dev/null || true
          COMMIT_COUNT=$(wc -l < /tmp/recent_commits.txt | tr -d ' ')
          echo "count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "📝 直近24時間のコミット: $COMMIT_COUNT 件"
          cat /tmp/recent_commits.txt

      # ── Step 3: 競合モニタリング ────────────────────────────────────────────
      - name: Step 3 - 競合モニタリング (21社中7社の主要競合)
        id: competitor
        run: |
          > /tmp/competitor_notes.txt
          DOWN_COUNT=0

          check_site() {
            local NAME="$1" URL="$2"
            local HTTP TITLE
            HTTP=$(curl -s -o /tmp/comp_body.html -w "%{http_code}" \
              -L --max-time 15 -A "Mozilla/5.0" "$URL" 2>/dev/null || echo "000")
            TITLE=$(grep -oP '(?<=<title>)[^<]+' /tmp/comp_body.html 2>/dev/null | head -1 || echo "")
            echo "🔍 $NAME: HTTP $HTTP / title: $TITLE"
            if [ "$HTTP" = "200" ]; then
              echo "- **$NAME** ($URL): HTTP $HTTP ✅" >> /tmp/competitor_notes.txt
            else
              echo "- **$NAME** ($URL): HTTP $HTTP ⚠️" >> /tmp/competitor_notes.txt
              DOWN_COUNT=$((DOWN_COUNT + 1))
            fi
          }

          # 脅威レベル高 (Supabase AI分析で🔴判定の競合を優先)
          check_site "Slack"    "https://slack.com/intl/ja-jp/"
          check_site "GitHub"   "https://github.com/"
          check_site "Notion"   "https://www.notion.so/"
          check_site "Evernote" "https://evernote.com/"
          check_site "Discord"  "https://discord.com/"
          check_site "LINE"     "https://line.me/ja/"
          check_site "X"        "https://x.com/"

          echo "has_notes=true"    >> $GITHUB_OUTPUT
          echo "down_count=$DOWN_COUNT" >> $GITHUB_OUTPUT
          echo "📊 ダウン検知: $DOWN_COUNT / 7社"

      # ── Step 4: 日次レポート生成 ────────────────────────────────────────────
      - name: Step 4 - 日次レポート生成
        id: report
        if: steps.quota_check.outputs.anthropic_available == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          DATETIME=$(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M JST")
          FILEPATH="docs/daily-reports/${DATE}.md"
          mkdir -p docs/daily-reports

          {
            echo "# 自分株式会社 日次レポート ${DATE}"
            echo ""
            echo "<!-- generated-by: github-actions -->"
            echo ""
            echo "## 概要"
            echo "- **総ユーザー数**: ${{ steps.digest.outputs.total_users }}人"
            echo "- **本日の新規機能リクエスト**: ${{ steps.digest.outputs.new_today }}件"
            echo "- **未対応機能リクエスト**: ${{ steps.digest.outputs.open_count }}件"
            echo "- **課金ユーザー数**: ${{ steps.digest.outputs.paid_customers }}人"
            echo "- **MRR**: ¥${{ steps.digest.outputs.mrr_yen }} (active Pro/Teamの定価換算)"
            echo "- **Supabase API応答**: HTTP ${{ steps.digest.outputs.http_code }}"
            echo ""
            echo "## 本日の新規機能リクエスト"
            if [ -s /tmp/new_today_list.txt ]; then
              cat /tmp/new_today_list.txt
            else
              echo "なし"
            fi
            echo ""
            echo "## 注目の未対応リクエスト (投票数上位)"
            if [ -s /tmp/top_open.txt ]; then
              cat /tmp/top_open.txt
            else
              echo "なし"
            fi
            echo ""
            echo "## 直近の開発実績 (Supabase)"
            if [ -s /tmp/achievements.txt ]; then
              cat /tmp/achievements.txt
            else
              echo "なし"
            fi
            echo ""
            echo "## 直近24時間の開発コミット (${{ steps.gitlog.outputs.count }}件)"
            echo '```'
            cat /tmp/recent_commits.txt
            echo '```'
            echo ""
            echo "## 競合動向"
            cat /tmp/competitor_notes.txt
            echo ""
            echo "## 次のアクション提案"
            echo "1. 投票数の多い機能リクエストを優先実装し、既存ユーザーの満足度を向上させる"
            echo "2. 直近コミットの新機能をZenn/Qiita記事として公開し、新規ユーザー獲得に繋げる"
            echo "3. 競合21社との差別化ポイント (見栄ガード・浪費トラッキング等) をLPに追記する"
            echo ""
            echo "---"
            echo "*生成: GitHub Actions (daily-report.yml) / ${DATETIME}*"
          } > "$FILEPATH"

          echo "filepath=$FILEPATH" >> $GITHUB_OUTPUT
          echo "date=$DATE"         >> $GITHUB_OUTPUT
          echo "📄 レポート生成: $FILEPATH"

      # ── Step 5: X投稿ナッジ (report-only) ─────────────────────────────────────
      # 旧実装は viral-growth-engine → post-x-update の自動投稿だったが、両
      # edge 関数ともリポジトリから削除済みで恒常 404 の死路だった(2026-07-07
      # R8 監査)。固定テンプレの自動投稿は近似重複でスパム降格リスクもあるため
      # 復活させない。代わりに「当日 JST の投稿有無」を照会し、未投稿なら
      # warning でワンボタン投稿を促す report-only ナッジに置換。
      - name: Step 5 - X投稿ナッジ (report-only)
        if: steps.gitlog.outputs.count != '0'
        id: xpost
        run: |
          PAID_CUSTOMERS="${{ steps.digest.outputs.paid_customers }}"
          MRR_YEN="${{ steps.digest.outputs.mrr_yen }}"
          X_DRAFT=$(printf '今日の自分株式会社\n24hで%s件改善。課金ユーザー%s人、MRR ¥%s（active Pro/Teamの定価換算）。\n%s' \
            "${{ steps.gitlog.outputs.count }}" "${PAID_CUSTOMERS:-0}" "${MRR_YEN:-0}" \
            'https://my-web-app-b67f4.web.app/ #buildinpublic #FlutterWeb #Supabase')
          # JST の今日 0 時を UTC で表現 (repo 規約: 複数行 python3 -c 禁止)。
          TODAY_UTC=$(python3 -c "from datetime import datetime, timedelta, timezone; now_jst = datetime.now(timezone.utc) + timedelta(hours=9); start_jst = now_jst.replace(hour=0, minute=0, second=0, microsecond=0); print((start_jst - timedelta(hours=9)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          set +e
          COUNT=$(curl -s --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/hub_data?source=eq.x_post_log&created_at=gte.${TODAY_UTC}&select=id&limit=5" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null)
          set -e
          COUNT="${COUNT:-0}"
          echo "本日(JST)の X 投稿ログ: ${COUNT} 件 (>= ${TODAY_UTC})"
          echo "" >> "${{ steps.report.outputs.filepath }}"
          echo "## X投稿" >> "${{ steps.report.outputs.filepath }}"
          {
            echo "### 収益進捗入り投稿草案 (確認後に投稿)"
            echo '```text'
            printf '%s\n' "$X_DRAFT"
            echo '```'
          } >> "${{ steps.report.outputs.filepath }}"
          if [ "$COUNT" = "0" ]; then
            echo "x_posted=false" >> $GITHUB_OUTPUT
            echo "::warning::本日まだ X 未投稿です — アプリの「AI生成して投稿」ワンボタンを実行してください (推奨: JST 07-09 / 20-22)。"
            echo "- ステータス: ⚠️ 本日未投稿 — ワンボタン投稿を推奨 (JST 07-09 / 20-22)" >> "${{ steps.report.outputs.filepath }}"
          else
            echo "x_posted=true" >> $GITHUB_OUTPUT
            echo "- ステータス: ✅ 本日 ${COUNT} 件投稿済み (手動ワンボタン運用)" >> "${{ steps.report.outputs.filepath }}"
          fi

      # ── Step 5.5: AI大学 学習リマインダー送信 ──────────────────────────────────
      - name: Step 5.5 - AI大学 学習リマインダー (3日以上未学習ユーザー)
        id: reminder
        run: |
          HTTP_CODE=$(curl -s -o /tmp/reminder_resp.json -w "%{http_code}" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d '{"action":"reminders.study","min_idle_days":3,"max_idle_days":30}' \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            SENT=$(cat /tmp/reminder_resp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sent',0))" 2>/dev/null || echo "?")
            ELIGIBLE=$(cat /tmp/reminder_resp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('eligible',0))" 2>/dev/null || echo "?")
            echo "reminder_ok=true" >> $GITHUB_OUTPUT
            echo "reminder_sent=$SENT" >> $GITHUB_OUTPUT
            echo "reminder_eligible=$ELIGIBLE" >> $GITHUB_OUTPUT
            echo "✅ リマインダー送信: ${SENT}件送信 / ${ELIGIBLE}件対象"
          else
            echo "reminder_ok=false" >> $GITHUB_OUTPUT
            echo "reminder_sent=0" >> $GITHUB_OUTPUT
            echo "⚠️ リマインダー送信失敗 (HTTP $HTTP_CODE)"
          fi

      # ── Step 6: schedule_task_runs 記録 ────────────────────────────────────
      - name: Step 6 - schedule_task_runs 記録
        run: |
          STARTED=$(TZ=Asia/Tokyo date -Iseconds)
          FINISHED=$(TZ=Asia/Tokyo date -Iseconds)
          API_STATUS="${{ steps.digest.outputs.api_ok }}"
          X_STATUS="${{ steps.xpost.outputs.x_posted }}"
          COMMITS="${{ steps.gitlog.outputs.count }}"

          SUMMARY="GitHub Actions: API=$API_STATUS, X投稿=$X_STATUS, コミット=${COMMITS}件"
          SUMMARY="$SUMMARY, 課金=${{ steps.digest.outputs.paid_customers }}人, MRR=¥${{ steps.digest.outputs.mrr_yen }}"

          TASK_STATUS="success"
          if [ "$API_STATUS" = "false" ]; then
            TASK_STATUS="partial"
          fi

          curl -s -o /dev/null -w "schedule_task_runs POST: %{http_code}\n" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"daily-report\",\"status\":\"$TASK_STATUS\",\"started_at\":\"$STARTED\",\"finished_at\":\"$FINISHED\",\"summary\":\"$SUMMARY\"}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      # ── Step 7: コミット → PR作成・マージ ──────────────────────────────────
      - name: Step 7 - コミット & main直接push
        env:
          GH_TOKEN: ${{ secrets.BYPASS_RULES }}
          BYPASS_TOKEN: ${{ secrets.BYPASS_RULES }}
        run: |
          DATE="${{ steps.report.outputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi
          REPORT_FILE="${{ steps.report.outputs.filepath }}"
          METRICS_DIR="docs/metrics"
          ARTIFACT_STAGING="$(mktemp -d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if gh issue list \
              --label workflow-failure \
              --state all \
              --limit 200 \
              --json number,state,createdAt,closedAt,title,labels,body \
              > /tmp/workflow_failure_issues.json; then
            mkdir -p docs/metrics
            python scripts/ci_failure_digest.py workflow-failure-metrics \
              --issues-json /tmp/workflow_failure_issues.json \
              --markdown /tmp/workflow_failure_metrics.md \
              --json docs/metrics/workflow-failure-metrics.json
            if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
              {
                echo ""
                cat /tmp/workflow_failure_metrics.md
              } >> "$REPORT_FILE"
            fi
          else
            echo "::warning::Workflow failure metrics were not generated"
          fi

          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            mkdir -p "$(dirname "$ARTIFACT_STAGING/$REPORT_FILE")"
            cp "$REPORT_FILE" "$ARTIFACT_STAGING/$REPORT_FILE"
          else
            echo "::warning::Daily report file was not generated before commit step: ${REPORT_FILE:-unset}"
          fi

          if [ -d "$METRICS_DIR" ]; then
            mkdir -p "$ARTIFACT_STAGING/docs"
            cp -R "$METRICS_DIR" "$ARTIFACT_STAGING/docs/"
          else
            echo "::warning::Daily metrics directory was not generated before commit step"
          fi

          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -d "$ARTIFACT_STAGING/docs" ]; then
            cp -R "$ARTIFACT_STAGING/docs/." docs/
          fi
          git add docs/daily-reports/ docs/metrics/
          if git diff --cached --quiet; then
            echo "📝 変更なし — スキップ"
            exit 0
          fi

          git commit -m "自動: 日次レポート ${DATE} (GitHub Actions)"
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${BYPASS_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin main
          echo "✅ main直接push完了"

      - name: Job Summary
        if: always()
        run: |
          USERS="${{ steps.digest.outputs.total_users }}"
          NEW_TODAY="${{ steps.digest.outputs.new_today }}"
          PAID_CUSTOMERS="${{ steps.digest.outputs.paid_customers }}"
          MRR_YEN="${{ steps.digest.outputs.mrr_yen }}"
          COMMITS="${{ steps.gitlog.outputs.count }}"
          API_OK="${{ steps.digest.outputs.api_ok }}"
          X_POSTED="${{ steps.xpost.outputs.x_posted }}"
          DOWN="${{ steps.competitor.outputs.down_count }}"
          WF_OPEN=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/metrics/workflow-failure-metrics.json")
          if path.exists():
              print(json.loads(path.read_text(encoding="utf-8")).get("open_count", "unknown"))
          else:
              print("unknown")
          PY
          )
          API_ICON=$([ "$API_OK" = "true" ] && echo "✅" || echo "⚠️")
          X_ICON=$([ "$X_POSTED" = "true" ] && echo "✅" || echo "—")
          COMP_ICON=$([ "${DOWN:-0}" = "0" ] && echo "✅ 全7社正常" || echo "⚠️ ${DOWN}社ダウン")
          {
            echo "## 日次レポート $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| 指標 | 値 |"
            echo "|-----|---|"
            echo "| Supabase API | $API_ICON HTTP ${{ steps.digest.outputs.http_code }} |"
            echo "| 総ユーザー | ${USERS}人 |"
            echo "| 新規リクエスト | ${NEW_TODAY}件 |"
            echo "| 課金ユーザー | ${PAID_CUSTOMERS}人 |"
            echo "| MRR (active定価換算) | ¥${MRR_YEN} |"
            echo "| 24h コミット | ${COMMITS}件 |"
            echo "| X投稿 | $X_ICON |"
            echo "| 競合監視 (7社) | $COMP_ICON |"
            echo "| メトリクスJSON | $([ -f docs/metrics/daily-metrics.json ] && echo "✅ 保存済" || echo "— API失敗のためスキップ") |"
            echo "| workflow-failure open | ${WF_OPEN} |"
          } >> $GITHUB_STEP_SUMMARY
