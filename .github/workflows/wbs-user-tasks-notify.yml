name: WBS User Tasks Notify (毎朝 + manual)

# Win版#132 part 18: instance='user' の pending タスクを Slack 通知
# 設計: 毎朝 09:00 JST にユーザー手動操作タスクをまとめて通知
# 関連 EF: tools-hub:wbs.notify_user_tasks (本 commit 同時)

on:
  schedule:
    - cron: "3 0 * * *"  # 毎日 09:03 JST (2026-07-17 ci-audit: 00:00 UTC 8本集中を分散)
  workflow_dispatch:
    inputs:
      limit:
        description: '通知する最大 task 数 (default 10)'
        required: false
        default: '10'

concurrency:
  group: wbs-user-tasks-notify
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    permissions:
      contents: read
    name: Notify user tasks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
      # Require the configured key; never silently use a fixed fallback.
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      LIMIT: ${{ github.event.inputs.limit || '10' }}

    steps:
      - name: Step 1 - Secret presence check
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY is not configured; notification was not sent."
            exit 1
          fi

      - name: Step 2 - Call wbs.notify_user_tasks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$LIMIT" =~ ^[0-9]+$ ]] || [ "${#LIMIT}" -gt 3 ] || (( 10#$LIMIT < 1 || 10#$LIMIT > 100 )); then
            echo "::error::limit must be an integer from 1 to 100."
            exit 1
          fi
          LIMIT=$((10#$LIMIT))
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          if ! HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/functions/v1/tools-hub" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"wbs.notify_user_tasks\",\"send_slack\":true,\"limit\":${LIMIT}}" \
            --max-time 30); then
            echo "::error::Notification transport failed; response omitted."
            exit 1
          fi
          if [[ ! "$HTTP_CODE" =~ ^[0-9]{3}$ ]]; then
            echo "::error::Invalid HTTP status; response omitted."
            exit 1
          fi
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Notification failed; response omitted."
            exit 1
          fi
          python3 - "$RESPONSE_FILE" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as response:
                  raw = response.read(1048577)
              if len(raw) > 1048576:
                  raise ValueError("oversized")
              payload = json.loads(raw)
              count = payload.get("user_tasks_count") if isinstance(payload, dict) else None
              if type(count) is not int or not 0 <= count <= 100:
                  raise ValueError("invalid count")
          except (OSError, ValueError):
              print("::error::Invalid notification response; content omitted.")
              sys.exit(1)
          print(f"Notified {count} user task(s) to Slack")
          PY
