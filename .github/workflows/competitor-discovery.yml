name: Competitor Discovery (週次自動候補発掘)

# PS版#4 担当: Gemini Flash + Web検索で trending 競合を自動発掘
# competitor_candidates テーブルに staging → PS#4 review → competitors に promote
# COMPETITOR_EXPANSION_PLAN.md Phase 3-1
# Scripts: .github/scripts/competitor_discover.py / competitor_stage.py / competitor_report_gen.py

on:
  schedule:
    - cron: "0 23 * * 0"  # 毎週月曜 08:00 JST (日曜 23:00 UTC)
  workflow_dispatch:
    inputs:
      categories:
        description: '調査カテゴリ (カンマ区切り、省略時は全カテゴリ)'
        required: false
        default: ''
      max_per_category:
        description: '1カテゴリあたり最大候補数'
        required: false
        default: '5'

concurrency:
  group: competitor-discovery
  cancel-in-progress: false

permissions: {}

jobs:
  discover:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      contents: write
    name: Discover Trending Competitors
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.BYPASS_RULES || github.token }}

      # ── Step 1: 既存 competitors ID 取得 ─────────────────────────────────
      - name: Step 1 - 既存競合 ID 取得
        id: existing
        run: |
          EXISTING_IDS=$(curl -sf \
            "$SUPABASE_URL/rest/v1/competitors?select=id,display_name&is_active=eq.true" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" 2>/dev/null || echo "[]")
          echo "$EXISTING_IDS" > /tmp/existing_competitors.json
          COUNT=$(echo "$EXISTING_IDS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          echo "existing_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Existing competitors: $COUNT"

      # ── Step 2: カテゴリ別 Gemini 調査 ───────────────────────────────────
      - name: Step 2 - カテゴリ別 trending 競合発掘 (Gemini Flash)
        id: discover
        env:
          CATEGORIES_INPUT: ${{ github.event.inputs.categories || 'productivity,ai-coding,fintech,ai-platform,e-commerce,health,collaboration,hr-tech,legal-tech,data' }}
          MAX_PER_CATEGORY_INPUT: ${{ github.event.inputs.max_per_category || '5' }}
        run: |
          WEEK=$(date +'%Y-%V')
          echo "discovery_week=$WEEK" >> $GITHUB_OUTPUT
          CATEGORIES="$CATEGORIES_INPUT"
          MAX_PER_CAT="$MAX_PER_CATEGORY_INPUT"
          python3 .github/scripts/competitor_discover.py \
            --categories="$CATEGORIES" \
            --max-per-cat="$MAX_PER_CAT" \
            --existing=/tmp/existing_competitors.json \
            --output=/tmp/all_candidates.json \
            --output-count="$GITHUB_OUTPUT"

      # ── Step 3: 既存競合と重複除去 + Supabase staging ────────────────────
      - name: Step 3 - 重複除去 + competitor_candidates に INSERT
        id: stage
        env:
          # competitor_candidates はservice-role write限定。read-only discovery
          # stepには渡さず、この書込みstepだけへ限定する。
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 .github/scripts/competitor_stage.py

      # ── Step 4: サマリーレポート生成 ──────────────────────────────────────
      - name: Step 4 - サマリーレポート生成
        id: summary
        run: |
          TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d')
          mkdir -p docs/competitor-reports
          REPORT_PATH="docs/competitor-reports/discovery-${TODAY}.md"
          python3 .github/scripts/competitor_report_gen.py \
            "$TODAY" \
            "${{ steps.discover.outputs.discovery_week }}" \
            "${{ steps.discover.outputs.total_candidates || '0' }}" \
            "${{ steps.stage.outputs.staged_count || '0' }}" \
            "${{ steps.stage.outputs.skip_count || '0' }}" \
            "${{ steps.existing.outputs.existing_count || '0' }}" \
            "$REPORT_PATH"
          echo "report_path=$REPORT_PATH" >> $GITHUB_OUTPUT

      # ── Step 5: git commit ────────────────────────────────────────────────
      - name: Step 5 - Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REPORT_PATH="${{ steps.summary.outputs.report_path }}"
          STAGED="${{ steps.stage.outputs.staged_count || '0' }}"
          WEEK="${{ steps.discover.outputs.discovery_week }}"
          git add "$REPORT_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(competitor-discovery): Week ${WEEK} — ${STAGED} new candidates staged"
            git push origin HEAD:main
            echo "Committed and pushed"
          fi
