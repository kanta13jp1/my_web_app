name: AI Bench Source Recheck

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 1"

concurrency:
  group: ai-bench-source-recheck-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  source-recheck:
    permissions:
      contents: read
    name: Official model source recheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Recheck official sources
        run: |
          python scripts/internal_ai_bench_source_recheck.py \
            --input docs/ai-bench/results/template.json \
            --output-json ai-bench-source-recheck.json \
            --output-md ai-bench-source-recheck.md
          cat ai-bench-source-recheck.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source recheck artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ai-bench-source-recheck
          path: |
            ai-bench-source-recheck.json
            ai-bench-source-recheck.md
