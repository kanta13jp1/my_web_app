name: AI Bench Source Recheck

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 1"

concurrency:
  group: ai-bench-source-recheck-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  source-recheck:
    permissions:
      contents: read
    name: Official model source recheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Recheck official sources
        run: |
          python scripts/internal_ai_bench_source_recheck.py \
            --input docs/ai-bench/results/template.json \
            --output-json ai-bench-source-recheck.json \
            --output-md ai-bench-source-recheck.md
          cat ai-bench-source-recheck.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source recheck artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ai-bench-source-recheck
          path: |
            ai-bench-source-recheck.json
            ai-bench-source-recheck.md
