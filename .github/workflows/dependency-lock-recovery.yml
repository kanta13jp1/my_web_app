name: Dependency Lock Recovery
on:
  pull_request:
    paths: [pubspec.yaml, .github/workflows/dependency-lock-recovery.yml]
permissions: {}
concurrency:
  group: dependency-lock-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event.pull_request.number == 5920
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.10'
      - name: Resolve on the supported SDK
        run: flutter pub get
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-lock-${{ github.run_id }}
          path: pubspec.lock
          retention-days: 3
          if-no-files-found: error
