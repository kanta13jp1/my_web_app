name: Calendar reflection data contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261015170000_asset_calendar_reflections.sql'
      - 'supabase/tests/asset_calendar_reflection*'
      - '.github/workflows/asset-calendar-reflection-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exercise ownership, dedup, unknown amounts, and unchanged totals
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d contract -v ON_ERROR_STOP=1 -f supabase/tests/asset_calendar_reflection_bootstrap.sql
          psql -h localhost -U postgres -d contract -v ON_ERROR_STOP=1 -f supabase/migrations/20261015170000_asset_calendar_reflections.sql
          psql -h localhost -U postgres -d contract -v ON_ERROR_STOP=1 -f supabase/tests/asset_calendar_reflection_contract.sql

  flutter-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Produce scoped style corrections
        run: |
          dart format lib/models/asset_calendar_reflection.dart lib/services/asset_calendar_reflection_repository.dart lib/widgets/asset_calendar_reflection_panel.dart lib/pages/asset_management_page.dart test/models/asset_calendar_reflection_test.dart lib/widgets/asset_reflection_day_badge.dart test/widgets/asset_calendar_reflection_panel_test.dart
          dart fix --apply --code=require_trailing_commas --code=curly_braces_in_flow_control_structures --code=prefer_const_declarations
          dart format lib/models/asset_calendar_reflection.dart lib/services/asset_calendar_reflection_repository.dart lib/widgets/asset_calendar_reflection_panel.dart lib/pages/asset_management_page.dart test/models/asset_calendar_reflection_test.dart lib/widgets/asset_reflection_day_badge.dart test/widgets/asset_calendar_reflection_panel_test.dart
      - name: Preserve scoped corrections for reviewed commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reflection-formatted-source
          retention-days: 1
          path: |
            lib/models/asset_calendar_reflection.dart
            lib/services/asset_calendar_reflection_repository.dart
            lib/widgets/asset_calendar_reflection_panel.dart
            lib/pages/asset_management_page.dart
            test/models/asset_calendar_reflection_test.dart
            lib/widgets/asset_reflection_day_badge.dart
            test/widgets/asset_calendar_reflection_panel_test.dart
      - run: flutter analyze lib/models/asset_calendar_reflection.dart lib/services/asset_calendar_reflection_repository.dart lib/widgets/asset_calendar_reflection_panel.dart lib/pages/asset_management_page.dart test/models/asset_calendar_reflection_test.dart lib/widgets/asset_reflection_day_badge.dart test/widgets/asset_calendar_reflection_panel_test.dart
      - run: flutter test test/models/asset_calendar_reflection_test.dart test/widgets/asset_calendar_refresh_control_test.dart test/widgets/asset_calendar_reflection_panel_test.dart --concurrency=2
