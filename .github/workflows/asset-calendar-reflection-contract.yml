name: Calendar reflection data contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261015170000_asset_calendar_reflections.sql'
      - 'supabase/tests/asset_calendar_reflection*'
      - '.github/workflows/asset-calendar-reflection-contract.yml'
      - 'lib/models/asset_calendar_reflection.dart'
      - 'lib/pages/asset_management_page.dart'
      - 'lib/services/asset_calendar_reflection_repository.dart'
      - 'lib/widgets/asset_calendar_reflection_panel.dart'
      - 'test/models/asset_calendar_reflection_test.dart'
      - 'lib/widgets/asset_reflection_day_badge.dart'
      - 'test/widgets/asset_calendar_reflection_panel_test.dart'
      - 'lib/widgets/asset_month_end_snapshot_card.dart'
      - 'test/services/asset_month_end_snapshot_service_test.dart'
  workflow_dispatch:
concurrency:
  group: calendar-reflection-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  ownership-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exercise ownership, dedup, unknown amounts, and unchanged totals
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d contract -v ON_ERROR_STOP=1 -f supabase/tests/asset_calendar_reflection_bootstrap.sql
          psql -h localhost -U postgres -d contract -v ON_ERROR_STOP=1 -f supabase/migrations/20261015170000_asset_calendar_reflections.sql
          psql -h localhost -U postgres -d contract -v ON_ERROR_STOP=1 -f supabase/tests/asset_calendar_reflection_contract.sql

  flutter-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Verify committed Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/models/asset_calendar_reflection.dart lib/services/asset_calendar_reflection_repository.dart lib/widgets/asset_calendar_reflection_panel.dart lib/pages/asset_management_page.dart test/models/asset_calendar_reflection_test.dart lib/widgets/asset_reflection_day_badge.dart test/widgets/asset_calendar_reflection_panel_test.dart lib/widgets/asset_month_end_snapshot_card.dart test/services/asset_month_end_snapshot_service_test.dart
      - name: Preserve exact tested source for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reflection-formatted-source
          retention-days: 1
          path: |
            lib/models/asset_calendar_reflection.dart
            lib/services/asset_calendar_reflection_repository.dart
            lib/widgets/asset_calendar_reflection_panel.dart
            lib/pages/asset_management_page.dart
            test/models/asset_calendar_reflection_test.dart
            lib/widgets/asset_reflection_day_badge.dart
            test/widgets/asset_calendar_reflection_panel_test.dart
            lib/widgets/asset_month_end_snapshot_card.dart
            test/services/asset_month_end_snapshot_service_test.dart
      - run: flutter analyze lib/models/asset_calendar_reflection.dart lib/services/asset_calendar_reflection_repository.dart lib/widgets/asset_calendar_reflection_panel.dart lib/pages/asset_management_page.dart test/models/asset_calendar_reflection_test.dart lib/widgets/asset_reflection_day_badge.dart test/widgets/asset_calendar_reflection_panel_test.dart lib/widgets/asset_month_end_snapshot_card.dart test/services/asset_month_end_snapshot_service_test.dart
      - run: timeout 300s flutter test --no-pub --timeout 60s test/models/asset_calendar_reflection_test.dart test/widgets/asset_calendar_refresh_control_test.dart test/widgets/asset_calendar_reflection_panel_test.dart test/services/asset_month_end_snapshot_service_test.dart --concurrency=2
