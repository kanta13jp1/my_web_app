name: Lab API Reference
on:
  pull_request:
    paths:
      - web/labs/shared/**
      - scripts/api-docs/**
      - docs/LAB_API_REFERENCE.md
      - .github/workflows/lab-api-reference.yml
  workflow_dispatch:
    inputs:
      generate:
        description: Produce reviewed lockfile and HTML candidates (never pushes)
        type: boolean
        default: false
        required: true
permissions: {}
concurrency:
  group: lab-api-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.generate && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Resolve lockfile candidate only on manual generation
        if: env.GENERATE == 'true'
        run: npm install --package-lock-only --ignore-scripts --prefix scripts/api-docs
      - name: Install locked documentation tooling
        run: npm ci --ignore-scripts --prefix scripts/api-docs
      - name: Generate candidate
        if: env.GENERATE == 'true'
        run: node scripts/api-docs/generate.mjs --write
      - name: Test documentation and runtime contract
        run: node --test scripts/api-docs/reference.test.mjs
      - name: Reject stale generated reference
        run: node scripts/api-docs/generate.mjs --check
      - name: Save reviewed candidates and exact revision
        if: always()
        run: git rev-parse HEAD > scripts/api-docs/tested-sha.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lab-api-reference-${{ github.run_id }}
          path: |
            scripts/api-docs/package-lock.json
            scripts/api-docs/tested-sha.txt
            web/labs/shared/reference.html
          retention-days: 14
