name: Blog Engagement (毎日・分析同期 read-only)

# 毎日 10:00 JST に dev.to の engagement を収集する (read-only):
# 1. 記事一覧取得 → 重複検出 (報告のみ)
# 2. コメント取得 → Supabase に記録 (返信しない)
# 3. 結果を Supabase に保存 → アプリ画面で閲覧可能に
#
# ⚠️ 2026-07-12: Qiita アカウント利用停止 (ToS 違反) につき Qiita への接触を
# 全停止。QIITA_ACCESS_TOKEN を env に渡さない = blog_engagement.py が Qiita を
# スキップする。停止解除まで再有効化しないこと。
#
# ⚠️ 2026-07-13: 対他者自動アクション (auto-reply / auto-follow) を script から
# 恒久除去 (停止原因の是正)。AI 返信生成も廃止 → ANTHROPIC/GEMINI key 不要。
# 再実装禁止。

# 必要な GitHub Secrets:
#   DEVTO_API_KEY           — dev.to設定 > Extensions > DEV Community API Keys
#   SUPABASE_SERVICE_ROLE_KEY — Supabase > Project Settings > API > service_role

on:
  schedule:
    # 10:00 JST = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true=確認のみ・false=実際に処理'
        required: false
        default: 'true'

permissions: {}

concurrency:
  group: blog-engagement
  cancel-in-progress: false

jobs:
  engagement:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      contents: read
    name: Blog Engagement Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run engagement analytics script (read-only)
        env:
          # QIITA_ACCESS_TOKEN は渡さない (2026-07-12 アカウント利用停止 →
          # script 側の「not set → skipping Qiita」ガードで接触ゼロにする)
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/blog_engagement.py

      - name: Sync dev.to engagement to Supabase
        env:
          SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/functions/v1/schedule-hub" \
            -d '{"action":"blog.devto_sync_engagement"}' | jq -r '"\(.synced // "?") dev.to articles synced"'

      - name: Summary
        if: always()
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
          DEVTO_KEY_STATUS: ${{ secrets.DEVTO_API_KEY != '' && 'set' || '⚠️ not set' }}
        run: |
          echo "## Blog Engagement $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| mode | read-only analytics (auto-reply/follow 恒久廃止 2026-07-13) |" >> $GITHUB_STEP_SUMMARY
          echo "| dry_run | $DRY_RUN_INPUT |" >> $GITHUB_STEP_SUMMARY
          echo "| Qiita | ⛔ 停止中 (2026-07-12 アカウント利用停止 → 接触停止) |" >> $GITHUB_STEP_SUMMARY
          echo "| dev.to key | $DEVTO_KEY_STATUS |" >> $GITHUB_STEP_SUMMARY
