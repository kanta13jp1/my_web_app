name: Spending attention calendar checks
on:
  pull_request:
    paths:
      - 'lib/services/asset_spending_attention_calendar.dart'
      - 'lib/widgets/asset_attention_day_label.dart'
      - 'lib/pages/asset_management_page.dart'
      - 'test/services/asset_spending_attention_calendar_test.dart'
      - 'test/widgets/asset_attention_day_label_test.dart'
      - '.github/workflows/calendar-attention-checks.yml'
  workflow_dispatch:
concurrency:
  group: calendar-attention-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Verify committed scoped formatting
        run: dart format --output=none --set-exit-if-changed lib/services/asset_spending_attention_calendar.dart lib/widgets/asset_attention_day_label.dart lib/pages/asset_management_page.dart test/services/asset_spending_attention_calendar_test.dart test/widgets/asset_attention_day_label_test.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attention-formatted-source
          retention-days: 1
          path: |
            lib/services/asset_spending_attention_calendar.dart
            lib/widgets/asset_attention_day_label.dart
            lib/pages/asset_management_page.dart
            test/services/asset_spending_attention_calendar_test.dart
            test/widgets/asset_attention_day_label_test.dart
      - run: flutter analyze lib/services/asset_spending_attention_calendar.dart lib/widgets/asset_attention_day_label.dart lib/pages/asset_management_page.dart test/services/asset_spending_attention_calendar_test.dart test/widgets/asset_attention_day_label_test.dart
      - run: timeout 300s flutter test --no-pub --timeout 60s test/services/asset_spending_attention_calendar_test.dart test/widgets/asset_attention_day_label_test.dart --concurrency=2
