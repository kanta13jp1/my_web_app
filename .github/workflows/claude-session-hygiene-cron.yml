name: Claude Session Hygiene Cron

on:
  schedule:
    # Every 360 minutes (6h) from 06:00 JST through 00:00 JST next day.
    # (2026-06-12 ci-audit: 30分→60分 / 2026-06-18 ci-audit: 60分→120分, 21→11runs/日 / 2026-06-21 ci-audit: 120分→180分, 11→8runs/日 / 2026-07-14 ci-audit: 180分→360分, 8→4runs/日, windows-latest コスト削減)
    - cron: "0 21,3,9,15 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Allow auto cleanup when thresholds are crossed"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions: {}

concurrency:
  group: claude-session-hygiene-cron
  cancel-in-progress: true  # 2026-06-13 ci-audit: Windows 42runs/日キュー積み上がり防止

jobs:
  hygiene:
    permissions:
      contents: read
      issues: write
    name: Session PRE-check + threshold cleanup
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      ISSUE_NUMBER: "2506"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 5

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run session hygiene check
        id: hygiene
        shell: pwsh
        env:
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          New-Item -ItemType Directory -Force -Path memory | Out-Null
          $applyArg = @()
          if ($env:GITHUB_EVENT_NAME -eq "schedule" -or $env:APPLY_INPUT -eq "true") {
            $applyArg = @("--apply")
          }

          python scripts/session_hygiene_check.py `
            --root "$PWD" `
            --mode gha-cron `
            --log-path memory/session_hygiene_log.csv `
            --json-out session-hygiene-report.json `
            --max-runtime-sec 120 `
            @applyArg

          $report = Get-Content -Raw -LiteralPath session-hygiene-report.json | ConvertFrom-Json
          "severity=$($report.severity)" >> $env:GITHUB_OUTPUT
          "applied=$($report.applied)" >> $env:GITHUB_OUTPUT
          "reclaim_mb=$($report.actual_reclaim_mb)" >> $env:GITHUB_OUTPUT

      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-session-hygiene-report
          path: |
            session-hygiene-report.json
            session-hygiene-report.dev-cache.json
            memory/session_hygiene_log.csv
          if-no-files-found: ignore

      - name: Write run summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path session-hygiene-report.json) {
            $report = Get-Content -Raw -LiteralPath session-hygiene-report.json | ConvertFrom-Json
            @"
          ## Claude Session Hygiene Cron

          | metric | value |
          | --- | --- |
          | severity | $($report.severity) |
          | C free GB | $($report.c_free_gb) |
          | RAM percent | $($report.ram_pct) |
          | should auto apply | $($report.should_auto_apply) |
          | applied | $($report.applied) |
          | reclaim MB | $($report.actual_reclaim_mb) |
          | SmartCleanup | $($report.smartcleanup.status) |
          | git gc | $($report.git_gc.status) |
          | cache cleanup | $($report.cache_cleanup.status) |
          | reasons | $($report.reasons -join '; ') |
          "@ >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Comment warning report to Issue
        if: always() && (github.event_name == 'workflow_dispatch' || steps.hygiene.outputs.severity != 'ok')
        shell: pwsh
        run: |
          if (-not (Test-Path session-hygiene-report.json)) {
            exit 0
          }
          $report = Get-Content -Raw -LiteralPath session-hygiene-report.json | ConvertFrom-Json
          $body = @"
          ## Claude Session Hygiene Cron

          | metric | value |
          | --- | --- |
          | severity | $($report.severity) |
          | C free GB | $($report.c_free_gb) |
          | RAM percent | $($report.ram_pct) |
          | should auto apply | $($report.should_auto_apply) |
          | applied | $($report.applied) |
          | reclaim MB | $($report.actual_reclaim_mb) |
          | SmartCleanup | $($report.smartcleanup.status) |
          | git gc | $($report.git_gc.status) |
          | cache cleanup | $($report.cache_cleanup.status) |
          | reasons | $($report.reasons -join '; ') |
          | run | $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID |

          The workflow validates the repo-managed SessionStart hygiene entrypoint. It can reclaim the hosted Windows runner only; local Windows C: cleanup still runs from Claude/Codex hooks or scheduled tasks using the same script.
          "@
          Set-Content -LiteralPath session-hygiene-comment.md -Value $body -Encoding utf8
          gh issue comment $env:ISSUE_NUMBER --repo $env:GITHUB_REPOSITORY --body-file session-hygiene-comment.md
