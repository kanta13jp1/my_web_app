name: Issue↔WBS Maintenance (sync + dedup)

# Win版#132 part 23 (2026-04-25)
# 既存 issue-to-wbs.yml は opened event でしか動かないため、過去 Issue や
# transient failure の取りこぼしが累積していた。本 workflow は cron で
# 以下 3 件を冪等に reconcile する:
#
#   (A) Issue → WBS backfill: open Issue で `[Issue #N]` 接頭の WBS task が無い場合は追加
#   (B) WBS → Issue close:    Issue 由来の WBS が completed なのに Issue が open → close
#   (C) Issue 重複 close:     同タイトルの open Issue を最古の 1 件に集約
#   (D) WBS 重複 close:       同タイトルの WBS Issue 由来 task を最古の 1 件に集約
#
# 標準 cron: 毎時 15 分。手動実行 (workflow_dispatch) でいつでも reconcile 可。

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
  TOOLS_HUB: https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/tools-hub
  REST_BASE: https://smmkxxavexumewbfaqpy.supabase.co/rest/v1

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Reconcile Issue ↔ WBS
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os, re, subprocess, sys, time
          from collections import defaultdict
          from urllib.parse import quote

          import requests

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          REST_BASE    = os.environ["REST_BASE"]
          TOOLS_HUB    = os.environ["TOOLS_HUB"]
          SERVICE_KEY  = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          REPO         = os.environ["REPO"]

          AUTH_HEADERS = {
              "apikey": SERVICE_KEY,
              "Authorization": f"Bearer {SERVICE_KEY}",
              "Content-Type": "application/json",
          }

          ISSUE_PREFIX_RE = re.compile(r"^\[Issue #(\d+)\]\s*(.*)")

          def gh(*args, capture=True):
              r = subprocess.run(
                  ["gh"] + list(args),
                  capture_output=capture, text=True, check=False,
              )
              if r.returncode != 0:
                  print(f"::warning::gh {' '.join(args)} -> rc={r.returncode}: {r.stderr[:200]}")
                  return None
              return r.stdout

          def list_open_issues():
              out = gh("issue", "list", "--repo", REPO, "--state", "open",
                       "--limit", "200",
                       "--json", "number,title,labels,createdAt,user",
                       "-q", ".")
              return json.loads(out) if out else []

          def list_closed_issues_recent(days=7):
              out = gh("issue", "list", "--repo", REPO, "--state", "closed",
                       "--limit", "200",
                       "--search", f"updated:>{time.strftime('%Y-%m-%d', time.gmtime(time.time() - days*86400))}",
                       "--json", "number,title,closedAt", "-q", ".")
              return json.loads(out) if out else []

          def list_wbs_issue_tasks():
              # Direct REST: title LIKE '[Issue #*'
              # PostgREST 'like' uses URL-encoded pattern (* not %)
              url = f"{REST_BASE}/wbs_tasks?title=like.%5BIssue%20%23*&select=id,title,status,instance,owner_instance,created_at&order=created_at.asc&limit=1000"
              r = requests.get(url, headers=AUTH_HEADERS, timeout=30)
              r.raise_for_status()
              return r.json()

          def wbs_add_task(payload):
              r = requests.post(
                  TOOLS_HUB,
                  headers=AUTH_HEADERS,
                  json={"action": "wbs.add_task", **payload},
                  timeout=30,
              )
              try:
                  return r.json()
              except Exception:
                  return {"success": False, "error": r.text[:200]}

          def wbs_update(task_id, **fields):
              r = requests.post(
                  TOOLS_HUB,
                  headers=AUTH_HEADERS,
                  json={"action": "wbs.update_progress", "id": task_id, **fields},
                  timeout=30,
              )
              try:
                  return r.json()
              except Exception:
                  return {"success": False, "error": r.text[:200]}

          def label_to_priority_owner(labels):
              names = [l.get("name", "").lower() for l in labels]
              joined = " ".join(names)
              if re.search(r"critical|p0", joined):
                  prio = "high"
              elif re.search(r"bug|high|p1|workflow-failure", joined):
                  prio = "high"
              elif re.search(r"feature|enhancement|p2", joined):
                  prio = "medium"
              else:
                  prio = "low"
              owner = "ps5"  # default = on-call
              return prio, owner

          # ============================================================
          # Step 1: load state
          # ============================================================
          open_issues   = list_open_issues()
          closed_recent = list_closed_issues_recent(days=14)
          wbs_tasks     = list_wbs_issue_tasks()

          print(f"Open issues: {len(open_issues)} / Closed recent: {len(closed_recent)} / WBS Issue-derived: {len(wbs_tasks)}")

          # build maps
          wbs_by_issue_num = {}
          for t in wbs_tasks:
              m = ISSUE_PREFIX_RE.match(t.get("title", ""))
              if m:
                  num = int(m.group(1))
                  wbs_by_issue_num.setdefault(num, []).append(t)

          # ============================================================
          # Step A: Issue → WBS backfill (open Issue without WBS task)
          # ============================================================
          added = 0
          for issue in open_issues:
              num = issue["number"]
              if num in wbs_by_issue_num:
                  continue
              labels = issue.get("labels", [])
              prio, owner = label_to_priority_owner(labels)
              title = f"[Issue #{num}] {issue['title']}"[:200]
              today = time.strftime("%Y-%m-%d", time.gmtime())
              days_ahead = 1 if prio == "high" else 3
              end_date = time.strftime("%Y-%m-%d", time.gmtime(time.time() + days_ahead * 86400))
              payload = {
                  "title": title,
                  "description": f"GitHub Issue: https://github.com/{REPO}/issues/{num} / labels: {','.join(l.get('name','') for l in labels)}",
                  "instance": owner,
                  "owner_instance": owner,
                  "category": "🐛 Bug Fix",
                  "category_icon": "🐛",
                  "category_order": 99,
                  "status": "pending",
                  "progress": 0,
                  "start_date": today,
                  "end_date": end_date,
                  "priority": prio,
              }
              res = wbs_add_task(payload)
              if res.get("success"):
                  added += 1
                  print(f"  [+] WBS added: Issue #{num}")
              else:
                  print(f"  [!] WBS add failed Issue #{num}: {str(res)[:200]}")
          print(f"Step A done: {added} WBS tasks added")

          # ============================================================
          # Step B: Completed WBS task (Issue-derived) → close GH Issue
          # ============================================================
          # Reload WBS state since A added rows
          wbs_tasks = list_wbs_issue_tasks()
          wbs_by_issue_num = {}
          for t in wbs_tasks:
              m = ISSUE_PREFIX_RE.match(t.get("title", ""))
              if m:
                  num = int(m.group(1))
                  wbs_by_issue_num.setdefault(num, []).append(t)

          open_issue_nums = {i["number"] for i in open_issues}
          closed_count = 0
          for num, tasks in wbs_by_issue_num.items():
              if num not in open_issue_nums:
                  continue
              # If ANY of the WBS tasks for this issue is completed, close the issue
              if any(t.get("status") == "completed" for t in tasks):
                  # close
                  body = "🤖 WBS で完了確認のため自動クローズしました (issue-wbs-maintenance.yml)。再開が必要な場合は reopen してください。"
                  ok = gh("issue", "close", str(num), "--repo", REPO, "-c", body)
                  if ok is not None:
                      closed_count += 1
                      print(f"  [-] Closed Issue #{num} (WBS completed)")
          print(f"Step B done: {closed_count} GH issues closed")

          # ============================================================
          # Step C: Dedup open Issues by exact title
          # ============================================================
          # Refresh open issues since B closed some
          open_issues  = list_open_issues()
          by_title = defaultdict(list)
          for i in open_issues:
              by_title[i["title"].strip()].append(i)
          dedup_issues = 0
          for title, group in by_title.items():
              if len(group) <= 1:
                  continue
              # Keep oldest (smallest createdAt)
              group_sorted = sorted(group, key=lambda x: x["createdAt"])
              keeper = group_sorted[0]
              for d in group_sorted[1:]:
                  body = f"🤖 重複検出のため自動クローズしました。\n\n**Original**: #{keeper['number']} (created {keeper['createdAt']})\n\nDetected by: issue-wbs-maintenance.yml"
                  ok = gh("issue", "close", str(d["number"]), "--repo", REPO, "-c", body)
                  if ok is not None:
                      gh("issue", "edit", str(d["number"]), "--repo", REPO, "--add-label", "duplicate")
                      dedup_issues += 1
                      print(f"  [-] Closed dup Issue #{d['number']} (dup of #{keeper['number']})")
          print(f"Step C done: {dedup_issues} duplicate issues closed")

          # ============================================================
          # Step D: Dedup WBS Issue-derived tasks by [Issue #N] number
          # ============================================================
          # Refresh WBS state
          wbs_tasks = list_wbs_issue_tasks()
          by_num = defaultdict(list)
          for t in wbs_tasks:
              m = ISSUE_PREFIX_RE.match(t.get("title", ""))
              if m:
                  by_num[int(m.group(1))].append(t)
          dedup_wbs = 0
          for num, group in by_num.items():
              if len(group) <= 1:
                  continue
              group_sorted = sorted(group, key=lambda x: x.get("created_at", ""))
              keeper = group_sorted[0]
              for d in group_sorted[1:]:
                  res = wbs_update(d["id"], progress=100, status="completed",
                                   description=f"DUPLICATE of WBS task {keeper['id']} (Issue #{num}). Auto-closed by issue-wbs-maintenance.yml.")
                  if res.get("success"):
                      dedup_wbs += 1
                      print(f"  [-] Marked dup WBS {d['id'][:8]} completed (dup of {keeper['id'][:8]} for Issue #{num})")
          print(f"Step D done: {dedup_wbs} duplicate WBS tasks resolved")

          print(f"\nSummary: A={added} B={closed_count} C={dedup_issues} D={dedup_wbs}")
          PY
