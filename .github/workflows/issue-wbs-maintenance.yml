name: Issue WBS Maintenance (manual wrapper)

# Legacy entry point kept for humans who remember the old workflow name.
# Scheduled reconciliation now lives in issue-to-wbs.yml so GitHub Issue,
# WBS, duplicate cleanup, and Notion mirror sync share one source of truth.

on:
  workflow_dispatch:

concurrency:
  group: issue-wbs-maintenance-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dispatch-canonical-sync:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical GitHub Issues WBS Sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run issue-to-wbs.yml --repo "$REPO"
          echo "Dispatched issue-to-wbs.yml"
