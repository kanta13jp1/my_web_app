name: Kokumin Election Intelligence Update

# Refreshes the party's official local-election endorsement PDF into a
# deterministic repository asset.  The local-election snapshot workflow reads
# that asset, validates official goal sources, and records meaningful diffs.
on:
  schedule:
    # Check every six hours at :17 and hand off changed aggregates for PR review.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: Allow a reviewed cycle reset lowering the total by over 25%
        required: false
        type: boolean
        default: false

concurrency:
  group: kokumin-election-intelligence-update
  cancel-in-progress: false

permissions: {}

jobs:
  refresh-official-endorsements:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-election-intelligence.txt

      - name: Install PDF parser
        run: pip install -r scripts/requirements-election-intelligence.txt

      - name: Test parser safety gates
        run: python test/scripts/update_kokumin_local_endorsements_test.py

      - name: Refresh official snapshot
        shell: bash
        env:
          ALLOW_LARGE_DROP_INPUT: ${{ inputs.allow_large_drop || false }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$ALLOW_LARGE_DROP_INPUT" == "true" ]]; then
            args+=(--allow-large-drop)
          fi
          python scripts/update_kokumin_local_endorsements.py "${args[@]}"

      - name: Prepare official aggregates for review
        id: review
        shell: bash
        run: |
          set -euo pipefail
          files=(
            assets/data/kokumin_local_endorsements.json
            lib/data/dpj_official_endorsements.dart
          )
          review_dir="$RUNNER_TEMP/kokumin-official-review"
          mkdir -p "$review_dir"
          git diff --no-ext-diff --no-textconv --binary --full-index HEAD -- "${files[@]}" > "$review_dir/official-aggregates.patch"
          if [[ ! -s "$review_dir/official-aggregates.patch" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "公式集計に差分はありません。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp --parents -- "${files[@]}" "$review_dir/"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload official aggregates and review patch
        if: steps.review.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kokumin-official-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kokumin-official-review/assets/data/kokumin_local_endorsements.json
            ${{ runner.temp }}/kokumin-official-review/lib/data/dpj_official_endorsements.dart
            ${{ runner.temp }}/kokumin-official-review/official-aggregates.patch
          if-no-files-found: error
          retention-days: 3

      - name: Summarize protected review handoff
        if: steps.review.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "公式集計の差分をartifactに保存しました。基点は $GITHUB_SHA です。反映には通常のプルリクエストで差分をレビューし、mainの必須チェックを通してください。" >> "$GITHUB_STEP_SUMMARY"
