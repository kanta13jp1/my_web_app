name: Kokumin Election Intelligence Update

# Refreshes the party's official local-election endorsement PDF into a
# deterministic repository asset.  The local-election snapshot workflow reads
# that asset, validates official goal sources, and records meaningful diffs.
on:
  schedule:
    # Every six hours at :17. The source is one small PDF and unchanged runs do
    # not commit, so new endorsements can reach the dashboard without churn.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: Allow a reviewed cycle reset lowering the total by over 25%
        required: false
        type: boolean
        default: false

concurrency:
  group: kokumin-election-intelligence-update
  cancel-in-progress: false

permissions: {}

jobs:
  refresh-official-endorsements:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GH_PAT || secrets.BYPASS_RULES || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-election-intelligence.txt

      - name: Install PDF parser
        run: pip install -r scripts/requirements-election-intelligence.txt

      - name: Test parser safety gates
        run: python test/scripts/update_kokumin_local_endorsements_test.py

      - name: Refresh official snapshot
        shell: bash
        env:
          ALLOW_LARGE_DROP_INPUT: ${{ inputs.allow_large_drop || false }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$ALLOW_LARGE_DROP_INPUT" == "true" ]]; then
            args+=(--allow-large-drop)
          fi
          python scripts/update_kokumin_local_endorsements.py "${args[@]}"

      - name: Commit and push meaningful changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/data/kokumin_local_endorsements.json \
            lib/data/dpj_official_endorsements.dart
          if git diff --staged --quiet; then
            echo "No official endorsement change."
            exit 0
          fi
          as_of="$(jq -r '.sourceAsOf' assets/data/kokumin_local_endorsements.json)"
          git commit -m "chore: update Kokumin local endorsements (${as_of})"
          git push origin HEAD:main
