    - name: Install hashed source report and fixture guards in scratch only
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        cat > "$PAYSLIP_ROOT/guards/source_guard.py" <<'PAYSLIP_SOURCE_GUARD_PY'
        import hashlib, os, pathlib, subprocess, sys
        if len(sys.argv)!=3:raise SystemExit('expected root phase')
        root=pathlib.Path(sys.argv[1]); phase=sys.argv[2]
        allowed={'before_bootstrap','after_version','after_precache','after_pub_get','after_npm','before_salary','after_salary','before_full','after_full','before_app_build','after_app_build','before_fixture','after_fixture','before_browser','after_browser','final'}
        if phase not in allowed:raise SystemExit('unknown phase')
        if root.is_symlink() or not root.is_dir() or not root.name.startswith('payslip-same-lock.'):raise SystemExit('unsafe private root')
        root=root.resolve(strict=True); source=root/'source'
        if source.is_symlink() or source.resolve(strict=True).parent!=root:raise SystemExit('unsafe source')
        def git(*args):return subprocess.check_output(['/usr/bin/git',*args],cwd=source,timeout=20)
        if git('rev-parse','HEAD').decode().strip()!='bc9c20980220b4de5be1478ea2a3ecf4dc038df9':raise SystemExit('wrong source HEAD')
        if git('rev-parse','HEAD^{tree}').decode().strip()!='2c54531ea6f196049fbdeefce8284ca57013ce08':raise SystemExit('wrong source tree')
        original=git('show','HEAD:analysis_options.yaml')
        if hashlib.sha256(original).hexdigest()!='e0397953863fd25e9eb4938ece5a358dfe9369bdd2240a6a1ad37a2e2a79f342':raise SystemExit('wrong baseline config')
        anchor=b'    - ".dart_tool/**"\n'
        addition=b'    - android/**\n    - ios/**\n    - web/**\n    - windows/**\n    - macos/**\n    - linux/**\n'
        if original.count(anchor)!=1:raise SystemExit('wrong migration anchor')
        expected=original.replace(anchor,anchor+addition,1)
        if hashlib.sha256(expected).hexdigest()!='1900f9a58dfe11a5f9c9ce0988ffc9d7e64f8ec23f3a7d7757f2024a23d27083':raise SystemExit('wrong migration proof')
        p=source/'analysis_options.yaml'
        if p.is_symlink():raise SystemExit('unsafe config')
        actual=p.read_bytes()
        if actual==expected:
         print('guard exact_six_line_migration_restore phase='+phase,flush=True);p.write_bytes(original)
        elif actual!=original:raise SystemExit('unexpected config bytes; no restore')
        PINS={'lib/pages/asset_management_page.dart': {'blob': 'db372edfeb9023ea5b822dc9a9a49d1652b254f1', 'sha256': '4bca4d20e03317dfaa6253e84416c2c1c2fb4cf5b6c045d2a2c502e50d8b2469', 'bytes': 1340904}, 'lib/widgets/asset_calendar_shortfall_details.dart': {'blob': 'b302e160dbf18faefc5e79c42d949e3250b7dcec', 'sha256': '2fdf4ffb89a920eeeb6fd216b09059e303f77891d2be1f32bfd82c78a6983205', 'bytes': 6142}, 'lib/widgets/expense_classification_review.dart': {'blob': 'a8dca53e5d9d403b376f38ea3e375c5e60b15412', 'sha256': '25384b33cfbcbb4e7671d864841fa0248c6af3cc1c0746f35917ad2336ba46f3', 'bytes': 10153}, 'lib/widgets/feature_strategy_monitor_panel.dart': {'blob': '3de60c8b064090f7bd8512a5b895de9a99405c94', 'sha256': '1bad7ae9b66c7d9a58fc9e3e0ed5f20ae937114f10a4d72f8a07c2a991368ba0', 'bytes': 69590}, 'lib/widgets/kgi_csf_kpi_panel.dart': {'blob': '4d4dd7681d06dd4f27837f354f732ffb6917c935', 'sha256': 'e7982acba31ce5dc6771ae48ac7bdef2a37f88a48192f0fb4a5ee8cb754d4933', 'bytes': 6289}, 'analysis_options.yaml': {'sha256': 'e0397953863fd25e9eb4938ece5a358dfe9369bdd2240a6a1ad37a2e2a79f342', 'blob': '8d30beed4897a1e1909640f03a8cb2cd9f61636f', 'bytes': 3887}, '.github/workflows/cloud-development.yml': {'sha256': '5c7e69cf2b742d88b328c56ebed48772400b71264a2a00a27dc5487898ac9064', 'blob': '61fb911df00b34be1e1f69eb853fd6d0647834f8', 'bytes': 18840}, 'package.json': {'sha256': '1a1b756478c3e2dc173eccc939ad4d5b0b6835933db10e443ce124fa781b52b2', 'blob': '6b8022f766f1bd8d601439611d608577e5cca389', 'bytes': 1199}, 'package-lock.json': {'sha256': '5f0e66e2e1c75260278c0a17b5149f910983813e8a9f1ff02c6037c95cf81cee', 'blob': '7157da7b681e4c441386c182a62fc018dc37e00d', 'bytes': 8183}, 'pubspec.yaml': {'sha256': '219e1bd8160fb2c8dbb7648670f377e75e464d99a2b9b8b1a5f73f1b6e801800', 'blob': 'd4af874ac1845ff9fc61366b0fa5f783e6ee4975', 'bytes': 4057}, 'pubspec.lock': {'sha256': 'da19d974be0d4d49bcf7f8280d92429dd646c8a71009d33b90a15e8d050be5e5', 'blob': '8b12da8539a17ba14d389789c7b453ac693a910d', 'bytes': 55136}}
        if len(PINS)!=11:raise SystemExit('expected11 protected pins')
        for relative,item in PINS.items():
         p=source/relative
         if p.is_symlink() or not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=item['sha256']:raise SystemExit('protected source bytes changed: '+relative)
        if git('status','--porcelain','--untracked-files=all').strip():raise SystemExit('source index/worktree/untracked diff')
        print('guard_ok phase='+phase+' source=bc9c20980220b4de5be1478ea2a3ecf4dc038df9 lock=da19d974',flush=True)
        PAYSLIP_SOURCE_GUARD_PY
        chmod 0400 "$PAYSLIP_ROOT/guards/source_guard.py"
        printf '%s  %s\n' cf289c27b2f584d7db71bbdd0e53152da5ccda69d424e95acd3f5b5a6c5b62fb "$PAYSLIP_ROOT/guards/source_guard.py" | sha256sum -c -
        cat > "$PAYSLIP_ROOT/guards/report.py" <<'PAYSLIP_REPORT_PY'
        import json,pathlib,sys
        root=pathlib.Path(sys.argv[1]).resolve(strict=True); mode=sys.argv[2]; path=pathlib.Path(sys.argv[3])
        if mode=='asset-format-diagnostic':
         """Five fixed formatting diagnostics; data validation only, never evaluate formatted code."""
         import hashlib
         import json

         FORMAT_CASES = [
             {'id': 'asset-management', 'path': 'lib/pages/asset_management_page.dart', 'sha256': '4bca4d20e03317dfaa6253e84416c2c1c2fb4cf5b6c045d2a2c502e50d8b2469', 'source_max': 2097152},
             {'id': 'calendar-shortfall', 'path': 'lib/widgets/asset_calendar_shortfall_details.dart', 'sha256': '2fdf4ffb89a920eeeb6fd216b09059e303f77891d2be1f32bfd82c78a6983205', 'source_max': 131072},
             {'id': 'expense-review', 'path': 'lib/widgets/expense_classification_review.dart', 'sha256': '25384b33cfbcbb4e7671d864841fa0248c6af3cc1c0746f35917ad2336ba46f3', 'source_max': 131072},
             {'id': 'feature-strategy', 'path': 'lib/widgets/feature_strategy_monitor_panel.dart', 'sha256': '1bad7ae9b66c7d9a58fc9e3e0ed5f20ae937114f10a4d72f8a07c2a991368ba0', 'source_max': 131072},
             {'id': 'kgi-csf-kpi', 'path': 'lib/widgets/kgi_csf_kpi_panel.dart', 'sha256': 'e7982acba31ce5dc6771ae48ac7bdef2a37f88a48192f0fb4a5ee8cb754d4933', 'source_max': 131072},
         ]
         FORMAT_INDEX = 'asset-format-index.json'
         FORMAT_STDOUT_MAX = 8 * 1024 * 1024
         FORMAT_STDERR_MAX = 16 * 1024
         FORMAT_SECONDS_MAX = 30
         FORMAT_ENVELOPE_MAX = 2 * FORMAT_STDOUT_MAX + 128 * 1024


         def format_require(value, code):
             if not value:
                 raise SystemExit('asset format diagnostic rejected: ' + code)


         def format_sha(raw):
             return hashlib.sha256(raw).hexdigest()


         def format_pairs(items):
             result = {}
             for key, value in items:
                 format_require(key not in result, 'duplicate JSON key')
                 result[key] = value
             return result


         def format_arguments(case):
             return ['format', '--output=json', '--summary=none', '--show=none', '--set-exit-if-changed', case['path']]


         def format_native(stdout, case):
             format_require(0 < len(stdout) <= FORMAT_STDOUT_MAX, 'stdout size')
             native = json.loads(stdout.decode('utf-8'), object_pairs_hook=format_pairs)
             format_require(type(native) is dict and set(native) == {'path', 'source', 'selection'}, 'native schema')
             format_require(native['path'] == case['path'], 'native path')
             format_require(type(native['source']) is str and 0 < len(native['source'].encode('utf-8')) <= case['source_max'], 'formatted source size/type')
             selection = native['selection']
             format_require(type(selection) is dict and set(selection) == {'offset', 'length'} and
                            all(type(selection[key]) is int and selection[key] == -1 for key in selection), 'native selection')
             return native


         def format_validate(raw, case):
             format_require(0 < len(raw) <= FORMAT_ENVELOPE_MAX, 'artifact size')
             record = json.loads(raw.decode('utf-8'), object_pairs_hook=format_pairs)
             keys = {'schema_version', 'kind', 'source_path', 'source_sha256_before', 'source_sha256_after',
                     'source_mode_before', 'source_mode_readonly', 'source_mode_after', 'runtime_uid',
