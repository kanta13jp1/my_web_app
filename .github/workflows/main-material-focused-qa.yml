        test "$(git ls-tree HEAD -- lib/pages/asset_management_page.dart)" = "$(printf '100644 blob db372edfeb9023ea5b822dc9a9a49d1652b254f1\tlib/pages/asset_management_page.dart')"
        printf '%s  %s\n' 4bca4d20e03317dfaa6253e84416c2c1c2fb4cf5b6c045d2a2c502e50d8b2469 lib/pages/asset_management_page.dart | sha256sum -c -
        test "$(git ls-tree HEAD -- lib/widgets/asset_calendar_shortfall_details.dart)" = "$(printf '100644 blob b302e160dbf18faefc5e79c42d949e3250b7dcec\tlib/widgets/asset_calendar_shortfall_details.dart')"
        printf '%s  %s\n' 2fdf4ffb89a920eeeb6fd216b09059e303f77891d2be1f32bfd82c78a6983205 lib/widgets/asset_calendar_shortfall_details.dart | sha256sum -c -
