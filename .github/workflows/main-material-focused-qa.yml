      run: |
        set -euo pipefail
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/ /bin/bash --noprofile --norc "$PAYSLIP_ROOT/guards/offline.sh" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" final 120
    - name: Publish a bounded no-follow snapshot only after every namespace has stopped
      id: publish
      if: ${{ always() && env.PAYSLIP_BOUNDARY_READY == 'true' }}
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        sudo -n env -i PATH=/usr/bin:/bin HOME=/ /usr/bin/python3 -I "$PAYSLIP_ROOT/guards/publish.py" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" "$(id -u)"
        printf 'validated=true\n' >> "$GITHUB_OUTPUT"
    - name: Preserve the whole validated focused QA snapshot including raw failures
      if: ${{ always() && steps.publish.outputs.validated == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: main-material-focused-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.PAYSLIP_ROOT }}/publish/
        retention-days: 1
        if-no-files-found: error
