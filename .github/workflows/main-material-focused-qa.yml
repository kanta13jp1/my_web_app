        """Fixed Linux host publisher: stopped-runtime, descriptor-relative, bounded byte copy."""
        import os
        import stat
        import sys

        MAX_FILES = 512
        MAX_DIRS = 512
        MAX_DEPTH = 12
        MAX_FILE_BYTES = 64 * 1024 * 1024
        MAX_TOTAL_BYTES = 256 * 1024 * 1024


        def require(condition, message):
            if not condition:
                raise SystemExit(message)


        def safe_name(name):
            require(isinstance(name, str) and name not in {'', '.', '..'} and
                    '/' not in name and '\\' not in name and name.isprintable() and
                    len(name.encode('utf-8')) <= 255, 'unsafe entry name')


        def root_parts(path):
            require(isinstance(path, str) and path.startswith('/') and not path.endswith('/'), 'absolute physical root required')
            parts = path.split('/')[1:]
            for part in parts:
                safe_name(part)
            require(parts[-1].startswith('payslip-same-lock.'), 'wrong scratch root name')
            return parts


        def checked(st, owner, group=None, directory=False):
            require((stat.S_ISDIR(st.st_mode) if directory else stat.S_ISREG(st.st_mode)), 'nonregular entry or wrong directory type')
            require(st.st_uid in owner and (group is None or st.st_gid == group), 'unexpected owner/group')
            require(not st.st_mode & 0o7022, 'unsafe write/setid/sticky permissions')
            if not directory:
                require(st.st_nlink == 1, 'regular file link count must be one')
                require(0 <= st.st_size <= MAX_FILE_BYTES, 'per-file byte limit')
            return st


        def identity(st):
            return (st.st_dev, st.st_ino, st.st_mode, st.st_uid, st.st_gid,
                    st.st_nlink, st.st_size, st.st_mtime_ns, st.st_ctime_ns)


        class Budget:
            def __init__(self):
                self.files = self.dirs = self.bytes = 0

            def add(self, st, depth):
                require(1 <= depth <= MAX_DEPTH, 'depth limit')
                if stat.S_ISDIR(st.st_mode):
                    self.dirs += 1
                    require(self.dirs <= MAX_DIRS, 'directory count limit')
                else:
                    self.files += 1
                    self.bytes += st.st_size
                    require(self.files <= MAX_FILES, 'file count limit')
                    require(self.bytes <= MAX_TOTAL_BYTES, 'total byte limit')


        DIR_FLAGS = getattr(os, 'O_RDONLY', 0) | getattr(os, 'O_DIRECTORY', 0) | getattr(os, 'O_NOFOLLOW', 0) | getattr(os, 'O_CLOEXEC', 0)
        FILE_FLAGS = getattr(os, 'O_RDONLY', 0) | getattr(os, 'O_NOFOLLOW', 0) | getattr(os, 'O_NONBLOCK', 0) | getattr(os, 'O_CLOEXEC', 0)


        def child_dir(parent, name, owner, group=None):
            safe_name(name)
            before = checked(os.stat(name, dir_fd=parent, follow_symlinks=False), owner, group, True)
            fd = os.open(name, DIR_FLAGS, dir_fd=parent)
            try:
                require(identity(checked(os.fstat(fd), owner, group, True)) == identity(before), 'directory identity changed')
            except BaseException:
                os.close(fd)
                raise
            return fd


        def runtime_absent(uid):
            for entry in os.scandir('/proc'):
                if not entry.name.isdigit():
                    continue
                try:
                    with open('/proc/' + entry.name + '/status', encoding='ascii') as stream:
                        for line in stream:
                            if line.startswith('Uid:'):
                                require(uid not in [int(value) for value in line.split()[1:]], 'runtime process still exists')
                                break
                        else:
                            raise SystemExit('process UID unavailable')
                except (FileNotFoundError, ProcessLookupError):
                    pass


        def scan(fd, uid, gid, budget, depth=0):
            items = []
            with os.scandir(fd) as entries:
                for entry in entries:
                    name = entry.name
                    safe_name(name)
                    st = os.stat(name, dir_fd=fd, follow_symlinks=False)
                    directory = stat.S_ISDIR(st.st_mode)
                    checked(st, {uid}, gid, directory)
                    budget.add(st, depth + 1)
                    children = None
                    if directory:
                        child = child_dir(fd, name, {uid}, gid)
                        try:
                            children = scan(child, uid, gid, budget, depth + 1)
                        finally:
                            os.close(child)
                    items.append((name, identity(st), children))
            return items


        def copy_tree(source, target, items, uid, gid, copied):
            for name, expected, children in items:
                st = os.stat(name, dir_fd=source, follow_symlinks=False)
                checked(st, {uid}, gid, children is not None)
                require(identity(st) == expected, 'scanned entry changed')
                if children is not None:
                    source_child = child_dir(source, name, {uid}, gid)
                    os.mkdir(name, 0o755, dir_fd=target)
                    target_child = child_dir(target, name, {0}, 0)
                    try:
                        copy_tree(source_child, target_child, children, uid, gid, copied)
                    finally:
                        os.close(source_child)
                        os.close(target_child)
                    continue
                incoming = os.open(name, FILE_FLAGS, dir_fd=source)
                outgoing = None
                try:
                    require(identity(checked(os.fstat(incoming), {uid}, gid)) == expected, 'opened file changed')
                    outgoing = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600, dir_fd=target)
                    read_bytes = 0
                    while True:
                        chunk = os.read(incoming, min(1024 * 1024, expected[6] - read_bytes + 1))
                        if not chunk:
                            break
                        read_bytes += len(chunk)
                        copied[0] += len(chunk)
                        require(read_bytes <= expected[6] and read_bytes <= MAX_FILE_BYTES and copied[0] <= MAX_TOTAL_BYTES,
                                'copy byte limit or extra bytes')
                        view = memoryview(chunk)
                        while view:
                            written = os.write(outgoing, view)
                            require(written > 0, 'short output write')
                            view = view[written:]
                    require(read_bytes == expected[6], 'short input read')
                    require(identity(checked(os.fstat(incoming), {uid}, gid)) == expected, 'file changed during copy')
                    os.fchmod(outgoing, 0o444)
                    checked(os.fstat(outgoing), {0}, 0)
                finally:
                    os.close(incoming)
                    if outgoing is not None:
                        os.close(outgoing)


        def main(args):
            require(len(args) == 5 and os.geteuid() == 0, 'root host publisher arguments required')
            root, uid, gid, host_uid = args[1], int(args[2]), int(args[3]), int(args[4])
            require(uid > 0 and gid > 0 and host_uid > 0 and uid != host_uid, 'dedicated identity required')
            require(all(hasattr(os, name) and getattr(os, name) for name in ['O_NOFOLLOW', 'O_DIRECTORY', 'O_NONBLOCK']),
                    'Linux no-follow descriptor support required')
            os.umask(0o022)
            root_fd = os.open('/', DIR_FLAGS)
            try:
                checked(os.fstat(root_fd), {0}, directory=True)
                parts = root_parts(root)
                for index, part in enumerate(parts):
                    next_fd = child_dir(root_fd, part, {0} if index == len(parts) - 1 else {0, host_uid})
                    os.close(root_fd)
                    root_fd = next_fd
                control = child_dir(root_fd, 'control', {0}, 0)
                try:
                    stopped = os.stat('final-stopped', dir_fd=control, follow_symlinks=False)
                    checked(stopped, {0}, 0)
                    require(stopped.st_size <= 128, 'invalid final-stopped marker')
                    # This shared, root-only atomic lease excludes every future namespace launcher.
                    # An interrupted launcher leaves its lease and blocks publication.
                    os.mkdir('lease', 0o700, dir_fd=control)
                    runtime_absent(uid)
                    source = child_dir(root_fd, 'results', {uid}, gid)
                    try:
                        budget = Budget()
                        items = scan(source, uid, gid, budget)
                        require(budget.files > 0, 'empty report snapshot')
                        os.mkdir('publish', 0o755, dir_fd=root_fd)
                        target = child_dir(root_fd, 'publish', {0}, 0)
                        try:
                            copied = [0]
                            copy_tree(source, target, items, uid, gid, copied)
                            require(copied[0] == budget.bytes, 'snapshot byte mismatch')
                            runtime_absent(uid)
                        finally:
                            os.close(target)
                    finally:
                        os.close(source)
                finally:
                    os.close(control)
            finally:
                os.close(root_fd)
            print('PUBLISH_VALIDATED files=' + str(budget.files) + ' bytes=' + str(budget.bytes))


        if __name__ == '__main__':
            main(sys.argv)
        PAYSLIP_PUBLISH_PY
        chmod 0400 "$PAYSLIP_ROOT/guards/publish.py"
        printf '%s  %s\n' d9e320db366d82f79f630bcefaab2213aed1f4e87ac8f84ae68bb955dba8cc2d "$PAYSLIP_ROOT/guards/publish.py" | sha256sum -c -
