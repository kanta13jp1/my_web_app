# PREPARED ONLY: independent body review, root acceptance and fresh all-event audit required before one push.
name: Main Material focused QA 20261112
'on':
  push:
    branches:
    - codex/main-material-focused-qa-20261112
permissions: {}
concurrency:
  group: main-material-focused-qa-20261112
  cancel-in-progress: false
jobs:
  same-lock-only:
    if: ${{ github.event_name == 'push' && github.repository == 'kanta13jp1/my_web_app' && github.ref == 'refs/heads/codex/main-material-focused-qa-20261112'
      && github.event.created == true && github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {}
    steps:
    - name: Require unbound inputs to STOP and allocate private scratch
      shell: bash
      run: |
        set -euo pipefail
        # Unbound design MUST stop before scratch allocation, Git, downloads, or SDK bootstrap.
        for bound_value in 'bc9c20980220b4de5be1478ea2a3ecf4dc038df9' '2c54531ea6f196049fbdeefce8284ca57013ce08' 'e2502d35779c5a38acd036075d9bc3be58fd6e03' 'db372edfeb9023ea5b822dc9a9a49d1652b254f1' 'b302e160dbf18faefc5e79c42d949e3250b7dcec' 'a8dca53e5d9d403b376f38ea3e375c5e60b15412' '3de60c8b064090f7bd8512a5b895de9a99405c94' '4d4dd7681d06dd4f27837f354f732ffb6917c935' '8d30beed4897a1e1909640f03a8cb2cd9f61636f' '61fb911df00b34be1e1f69eb853fd6d0647834f8' '6b8022f766f1bd8d601439611d608577e5cca389' '7157da7b681e4c441386c182a62fc018dc37e00d' 'd4af874ac1845ff9fc61366b0fa5f783e6ee4975' '8b12da8539a17ba14d389789c7b453ac693a910d'; do
         [[ "$bound_value" =~ ^[0-9a-f]{40}$ ]] || { echo 'STOP: unbound source/tree/parent/blob'; exit 1; }
        done
        for bound_value in 'b571d57d830c7c407187fe9c1eadb91b22931cab3e60f45fe9f7abe20c8fb50f' '4bca4d20e03317dfaa6253e84416c2c1c2fb4cf5b6c045d2a2c502e50d8b2469' '2fdf4ffb89a920eeeb6fd216b09059e303f77891d2be1f32bfd82c78a6983205' '25384b33cfbcbb4e7671d864841fa0248c6af3cc1c0746f35917ad2336ba46f3' '1bad7ae9b66c7d9a58fc9e3e0ed5f20ae937114f10a4d72f8a07c2a991368ba0' 'e7982acba31ce5dc6771ae48ac7bdef2a37f88a48192f0fb4a5ee8cb754d4933' 'e0397953863fd25e9eb4938ece5a358dfe9369bdd2240a6a1ad37a2e2a79f342' '5c7e69cf2b742d88b328c56ebed48772400b71264a2a00a27dc5487898ac9064' '1a1b756478c3e2dc173eccc939ad4d5b0b6835933db10e443ce124fa781b52b2' '5f0e66e2e1c75260278c0a17b5149f910983813e8a9f1ff02c6037c95cf81cee' '219e1bd8160fb2c8dbb7648670f377e75e464d99a2b9b8b1a5f73f1b6e801800' 'da19d974be0d4d49bcf7f8280d92429dd646c8a71009d33b90a15e8d050be5e5'; do
         [[ "$bound_value" =~ ^[0-9a-f]{64}$ ]] || { echo 'STOP: unbound contract/pin sha256'; exit 1; }
        done
        for bound_value in '1340904' '6142' '10153' '69590' '6289' '3887' '18840' '1199' '8183' '4057' '55136'; do
         [[ "$bound_value" =~ ^[1-9][0-9]*$ ]] || { echo 'STOP: unbound pin bytes'; exit 1; }
        done
        allocation_phase=entry
        trap 'rc=$?; printf "SCRATCH_ALLOCATION_ERROR phase=%s line=%s rc=%s\n" "$allocation_phase" "$LINENO" "$rc" >&2; exit "$rc"' ERR
        allocation_mark() { allocation_phase=$1; printf 'SCRATCH_ALLOCATION_PHASE=%s\n' "$allocation_phase"; }
        allocation_base() { allocation_mark "$1"; printf 'SCRATCH_BASE uid=%s gid=%s mode=%s\n' "$base_uid" "$base_gid" "$base_mode"; }
        allocation_mark node_version_pin
        [[ 'v22.21.1' =~ ^v22[.][0-9]+[.][0-9]+$ ]] || { echo 'STOP: bind official Node22 patch'; exit 1; }
        allocation_mark node_archive_pin
        [[ '680d3f30b24a7ff24b98db5e96f294c0070f8f9078df658da1bce1b9c9873c88' =~ ^[0-9a-f]{64}$ ]] || { echo 'STOP: bind official Node archive hash'; exit 1; }
        base=/
        allocation_mark read_base_metadata
        base_uid="$(stat -c %u -- "$base")"
        base_gid="$(stat -c %g -- "$base")"
        base_mode="$(stat -c %a -- "$base")"
        allocation_base base_physical
        [[ -d "$base" && ! -L "$base" && "$(realpath -e -- "$base")" == "$base" ]]
        allocation_base base_root_owner
        [[ "$base_uid" == 0 ]]
        allocation_base base_mode_numeric
        [[ "$base_mode" =~ ^[0-7]{3,4}$ ]]
        allocation_base base_mode_access
        (( (8#$base_mode & 07022) == 0 && (8#$base_mode & 0001) == 1 ))
        umask 077
        allocation_mark create_root_direct_leaf
        root="$(sudo -n mktemp -d -- "${base%/}/payslip-same-lock.XXXXXXXX")"
        allocation_base verify_created_leaf
        [[ "$(dirname -- "$root")" == "$base" && ! -L "$root" && "$(stat -c %u -- "$root")" == 0 && "$(stat -c %a -- "$root")" == 700 ]]
        allocation_mark handoff_leaf_to_runner
        sudo -n chown "$(id -u):$(id -g)" "$root"
        allocation_base verify_runner_leaf
        [[ "$(stat -c %u -- "$root")" == "$(id -u)" && "$(stat -c %a -- "$root")" == 700 ]]
        allocation_mark create_scratch_directories
        mkdir "$root/home" "$root/tmp" "$root/sdk" "$root/node" "$root/source" "$root/candidate" "$root/config" "$root/cache" "$root/pub-cache" "$root/npm-cache" "$root/browsers" "$root/results" "$root/guards" "$root/control"
        allocation_mark publish_scratch_env
        printf 'PAYSLIP_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
    - name: Fetch and verify exact source and one-workflow W child
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_REF" == refs/heads/codex/main-material-focused-qa-20261112 ]]
        clean_env=(env -i PATH=/usr/bin:/bin HOME="$PAYSLIP_ROOT/home" TMPDIR="$PAYSLIP_ROOT/tmp" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1)
        for pair in "candidate:$GITHUB_SHA" "source:bc9c20980220b4de5be1478ea2a3ecf4dc038df9"; do
         dir=${pair%%:*}; ref=${pair#*:}
         "${clean_env[@]}" git -C "$PAYSLIP_ROOT/$dir" init --quiet
         depth=2; [[ "$dir" != source ]] || depth=3
        "${clean_env[@]}" git -C "$PAYSLIP_ROOT/$dir" -c credential.helper= fetch --no-tags --depth="$depth" https://github.com/kanta13jp1/my_web_app.git "$ref"
         "${clean_env[@]}" git -C "$PAYSLIP_ROOT/$dir" checkout --quiet --detach FETCH_HEAD
