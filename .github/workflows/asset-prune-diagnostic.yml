              if not stat.S_ISREG(p.lstat().st_mode) or p.is_symlink() or hashlib.sha256(p.read_bytes()).hexdigest() != LOCK:
                  raise ValueError('lock file changed')
          
          def evidence(before, after):
              """Log only sizes, hashes and bounded edit structure, never file lines."""
              print('options evidence:', 'old_bytes=', len(before), 'new_bytes=', len(after),
                    'old_lines=', len(before.splitlines()), 'new_lines=', len(after.splitlines()),
                    'old_sha256=', hashlib.sha256(before).hexdigest(),
