                  return
              edits = [v for v in difflib.SequenceMatcher(a=old, b=new, autojunk=False).get_opcodes() if v[0] != 'equal']
              print('options edit groups:', len(edits), flush=True)
              for tag, i1, i2, j1, j2 in edits[:30]:
                  print('edit', tag, 'old_lines', i2-i1, 'new_lines', j2-j1,
