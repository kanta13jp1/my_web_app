name: Issue2625 documentation baseline diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install codespell==2.4.3 markdown-it-py==4.0.0
      - run: python scripts/documentation_links_test.py
      - run: python scripts/issue2625_doc_baseline.py
      - name: Diagnose local Markdown targets
        run: |
          set +e
          python scripts/documentation_links.py > doc-quality-evidence/local-links.json
          code=$?
          test "$code" -le 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue2625-documentation-baseline
          path: doc-quality-evidence/
          retention-days: 7
