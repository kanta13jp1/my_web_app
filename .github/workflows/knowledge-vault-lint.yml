name: Documentation anchor diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install codespell==2.4.3 markdown-it-py==4.0.0
      - run: python scripts/documentation_links_test.py
      - run: python scripts/documentation_quality_gate_test.py
      - run: |
          git fetch --depth=1 --no-tags origin cd0fbbcee074a6100fe2a20806ebf9f46c9c5ec2
          python scripts/documentation_quality_gate.py --base cd0fbbcee074a6100fe2a20806ebf9f46c9c5ec2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: documentation-anchor-evidence
          path: doc-quality-evidence/
