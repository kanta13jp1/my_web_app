name: Feature Review

on:
  schedule:
    - cron: "0 */4 * * *"  # 毎4時間 (ci-cost-audit 2026-06-08: 毎時→毎4時間、18 runs/日削減)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Issue creation disabled when true"
        required: false
        default: "false"
        type: string
      target_features:
        description: "Comma-separated feature slugs. Overrides hourly rotation."
        required: false
        default: ""
        type: string
      force_full_scan:
        description: "Review all configured features immediately."
        required: false
        default: "false"
        type: string

permissions: {}

concurrency:
  group: feature-review
  cancel-in-progress: true  # 2026-06-23 ci-audit: 4h cron ANTHROPIC_API_KEY 重複コスト防止

jobs:
  review:
    environment:
      name: ai-operations-production
      deployment: false
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_MODEL: ${{ vars.FEATURE_REVIEW_ANTHROPIC_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      TARGET_FEATURES: ${{ inputs.target_features || '' }}
      FORCE_FULL_SCAN: ${{ inputs.force_full_scan || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 100

      - name: Resolve paid Claude/Codex policy
        id: paid_ai_policy
        uses: ./.github/actions/paid-ai-policy
        with:
          requested: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED || 'false' }}

      - name: Record owner-requested feature-review suspension
        if: steps.paid_ai_policy.outputs.enabled != 'true'
        run: echo "Paid Claude feature review is disabled by owner policy." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Cache pip
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-feature-review-${{ hashFiles('**/requirements*.txt') }}-anthropic-playwright-requests
          restore-keys: |
            ${{ runner.os }}-pip-feature-review-

      - name: Setup Deno
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install anthropic playwright requests
          python -m playwright install --with-deps chromium

      - name: Run feature review
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED == 'true' && steps.paid_ai_policy.outputs.enabled == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          ARGS="--config scripts/feature_review_config.json"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$TARGET_FEATURES" ]; then ARGS="$ARGS --targets $TARGET_FEATURES"; fi
          if [ "$FORCE_FULL_SCAN" = "true" ]; then ARGS="$ARGS --force-full-scan"; fi
          PYTHONUTF8=1 python scripts/feature_review.py $ARGS

      - name: Upload review artifacts
        if: always() && steps.paid_ai_policy.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-review-${{ github.run_id }}
          path: |
            /tmp/feature-review.log
            /tmp/feature-review-summary.json
            /tmp/feature-review-screenshots/
          if-no-files-found: ignore

      - name: Slack notify
        if: always() && steps.paid_ai_policy.outputs.enabled == 'true'
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_WEBHOOK_URL not set"
            exit 0
          fi
          if [ ! -f /tmp/feature-review-summary.json ]; then
            echo "::warning::feature review summary missing"
            exit 0
          fi
          NEW_COUNT=$(python -c "import json; data=json.load(open('/tmp/feature-review-summary.json', encoding='utf-8')); print(data.get('new_count', 0))")
          if [ "$NEW_COUNT" = "0" ]; then
            echo "::notice::No new issues; Slack notification skipped"
            exit 0
          fi
          SUMMARY=$(python -c "import json; data=json.load(open('/tmp/feature-review-summary.json', encoding='utf-8')); print(f\"feature-review run complete: {data.get('new_count', 0)} new issues, {data.get('skipped_count', 0)} skipped, {data.get('error_count', 0)} errors\")")
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"🔍 ${SUMMARY}\"}" \
            "$SLACK_WEBHOOK_URL"
