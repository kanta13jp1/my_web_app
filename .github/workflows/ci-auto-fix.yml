name: CI Auto-Fix (manual)

# Automatic mutation after every CI failure created a second check suite and
# unreviewed bot commits. Keep formatting recovery available, but require an
# operator to select the affected PR explicitly.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to format
        required: true
        type: string
      human_review_acknowledged:
        description: I accept responsibility for reviewing the resulting bot commit before merge
        required: true
        type: boolean

concurrency:
  group: ci-auto-fix-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions: {}

jobs:
  auto-fix:
    permissions:
      contents: write
      pull-requests: write
    name: Format changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if ('${{ inputs.human_review_acknowledged }}' !== 'true') {
              core.setFailed('A human operator must acknowledge review responsibility.');
              return;
            }
            if (context.actor.endsWith('[bot]')) {
              core.setFailed('Bot actors cannot acknowledge human review responsibility.');
              return;
            }
            const number = Number('${{ inputs.pr_number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pr.state !== 'open') {
              core.setFailed(`PR #${number} is not open.`);
              return;
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork pull requests cannot be mutated by this workflow.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              per_page: 100,
            });
            core.setOutput('branch', pr.head.ref);
            core.setOutput('number', String(number));
            core.setOutput(
              'has_dart',
              files.some((file) => file.filename.endsWith('.dart')) ? 'true' : 'false',
            );
            core.setOutput(
              'has_deno',
              files.some((file) =>
                file.filename.startsWith('supabase/functions/') &&
                (file.filename.endsWith('.ts') || file.filename.endsWith('.tsx'))
              ) ? 'true' : 'false',
            );

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - name: Collect changed files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number('${{ steps.pr.outputs.number }}'),
              per_page: 100,
            });
            const fs = require('fs');
            fs.mkdirSync('.ci-logs', { recursive: true });
            fs.writeFileSync(
              '.ci-logs/changed-files.txt',
              files.map((file) => file.filename).join('\n') + '\n',
            );

      - name: Setup Flutter
        if: steps.pr.outputs.has_dart == 'true'
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      # dart format reads package language versions from .dart_tool/package_config.json.
      - name: Resolve Flutter dependencies for formatter language version
        if: steps.pr.outputs.has_dart == 'true'
        run: flutter pub get

      - name: Format changed Dart files
        if: steps.pr.outputs.has_dart == 'true'
        shell: bash
        run: |
          mapfile -t files < <(
            { grep -E '\.dart$' .ci-logs/changed-files.txt || true; } \
              | while IFS= read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done
          )
          if [ "${#files[@]}" -gt 0 ]; then
            dart format "${files[@]}"
          fi

      - name: Setup Deno
        if: steps.pr.outputs.has_deno == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.1

      - name: Format changed Edge Function files
        if: steps.pr.outputs.has_deno == 'true'
        shell: bash
        run: |
          mapfile -t files < <(
            { grep -E '^supabase/functions/.*\.tsx?$' .ci-logs/changed-files.txt || true; } \
              | while IFS= read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done
          )
          if [ "${#files[@]}" -gt 0 ]; then
            deno fmt "${files[@]}"
          fi

      - name: Commit formatting changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          git commit -m "fix: format changed CI files"
          git push origin "${{ steps.pr.outputs.branch }}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Report result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const committed = '${{ steps.commit.outputs.committed }}' === 'true';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: committed
                ? `Manual CI Auto-Fix formatted only the changed Dart/Deno files. @${context.actor} acknowledged responsibility for reviewing the bot commit before merge.`
                : `Manual CI Auto-Fix found no formatting changes. @${context.actor} completed the required human-review acknowledgement.`,
            });
