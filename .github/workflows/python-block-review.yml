name: Python block review evidence
on:
  pull_request:
    paths:
      - 'lib/services/python_block_review.dart'
      - 'lib/widgets/python_block_review_card.dart'
      - 'lib/pages/ai_dev_principles_page.dart'
      - 'test/services/python_block_review_test.dart'
      - 'test/e2e/python_block_review_scenarios_test.dart'
      - '.github/workflows/python-block-review.yml'
permissions: {}
concurrency:
  group: python-block-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.x'
          cache: true
      - run: flutter pub get
      - name: Format the scoped files for review
        run: dart format lib/services/python_block_review.dart lib/widgets/python_block_review_card.dart lib/pages/ai_dev_principles_page.dart test/services/python_block_review_test.dart test/e2e/python_block_review_scenarios_test.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-block-formatted
          path: |
            lib/services/python_block_review.dart
            lib/widgets/python_block_review_card.dart
            lib/pages/ai_dev_principles_page.dart
            test/services/python_block_review_test.dart
            test/e2e/python_block_review_scenarios_test.dart
      - name: Test service in Chrome
        run: flutter test --platform chrome test/services/python_block_review_test.dart
      - name: Test user operations in Chrome
        run: flutter test --platform chrome test/e2e/python_block_review_scenarios_test.dart
