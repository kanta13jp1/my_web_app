name: Notion Mirror Sync (hourly)

# Multi-AI resilience / Win#132 part 7 (Backlog N5 消化)
#
# Supabase wbs_tasks / ROADMAP / memory index → Notion mirror に 1h 毎同期。
# Anthropic / Claude Code outage 時もユーザーが Notion mirror で WBS 閲覧可能。
#
# 事前条件 (Win#132 part 5 で登録済):
#   - Supabase Secrets: NOTION_API_TOKEN / NOTION_WBS_DATABASE_ID or DATA_SOURCE_ID
#   - Supabase Secrets: NOTION_ROADMAP_PAGE_ID / NOTION_MEMORY_DATABASE_ID or DATA_SOURCE_ID
#   - EF schedule-hub notion.sync_{wbs,roadmap,memory_index}

on:
  schedule:
    - cron: "10 */4 * * *" # 4時間ごと10分 (2026-06-10 ci-audit: 毎時→2時間 / 2026-07-21 ci-audit: 2時間→4時間, 180runs/月削減)
  workflow_dispatch:
    inputs:
      offset:
        description: "Start offset (0=first 30, 50=next 50, ...)"
        required: false
        default: "0"
      limit:
        description: "Max tasks per run (max 50)"
        required: false
        default: "50"
      roadmap_max_chars:
        description: "Max ROADMAP markdown chars sent to Notion"
        required: false
        default: "24000"
      memory_limit:
        description: "Max memory index rows per run"
        required: false
        default: "50"

concurrency:
  group: notion-sync
  cancel-in-progress: false # 前回を待って逐次実行 (Notion rate limit 3 req/sec / 350ms sleep)

permissions: {}

jobs:
  sync-notion:
    environment:
      name: wbs-automation-production
      deployment: false
    permissions:
      contents: read
    name: Sync project mirrors → Notion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Call schedule-hub:notion.sync_wbs
        id: sync
        env:
          LIMIT_INPUT: ${{ github.event.inputs.limit || '30' }}
          OFFSET_INPUT: ${{ github.event.inputs.offset || '0' }}
        run: |
          PAYLOAD=$(jq -n \
            --arg limit "$LIMIT_INPUT" \
            --arg offset "$OFFSET_INPUT" \
            '{action: "notion.sync_wbs", limit: ($limit | tonumber), offset: ($offset | tonumber)}')
          RESP=$(curl -sS -X POST \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 600)

          echo "Response: $RESP"
          echo "response=$RESP" >> "$GITHUB_OUTPUT"

          # success 判定
          SUCCESS=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success',False))" 2>/dev/null || echo "false")
          TOTAL=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total',0))" 2>/dev/null || echo "0")
          CREATED=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('created',0))" 2>/dev/null || echo "0")
          UPDATED=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('updated',0))" 2>/dev/null || echo "0")
          FAILED=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('failed',0))" 2>/dev/null || echo "0")

          echo "✅ success=$SUCCESS total=$TOTAL created=$CREATED updated=$UPDATED failed=$FAILED"

          # failed 件数が total の 10% 超えたら警告 (fail-fast しない・次回 cron でリトライ)
          if [ "$TOTAL" != "0" ] && [ "$FAILED" != "0" ]; then
            FAIL_PCT=$(python3 -c "print(round($FAILED / $TOTAL * 100, 1))")
            echo "::warning::Notion sync had $FAILED/$TOTAL failed (${FAIL_PCT}%)"
          fi

          # EF 側が deny-by-default (503 notion_not_configured) 返した場合は即 fail
          if [ "$SUCCESS" = "False" ]; then
            ERROR=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error','unknown'))" 2>/dev/null || echo "unknown")
            echo "::error::Notion sync returned success=false / error=$ERROR"
            # notion_not_configured = 環境セットアップ未完了 → soft-fail
            if echo "$ERROR" | grep -q "notion_not_configured"; then
              echo "::warning::NOTION_* secrets not configured yet — skip (set in Supabase dashboard)"
              exit 0
            fi
            # Explicit preflight result from schedule-hub:notion.sync_wbs.
            if echo "$ERROR" | grep -q "notion_schema_mismatch"; then
              MISSING=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(', '.join([f'{p.get(\"name\")}:{p.get(\"type\")}' for p in d.get('missing_properties', [])] + [f'{p.get(\"name\")}:{p.get(\"actual\")}->{p.get(\"type\")}' for p in d.get('mismatched_properties', [])]))" 2>/dev/null || echo "")
              echo "::warning::Notion WBS DB schema mismatch - add/repair required properties: ${MISSING:-id:title, task_title:rich_text, instance:select, status:select, progress:number, deadline:date, updated_at:date}"
              exit 0
            fi
            # Notion DB property schema mismatch (e.g. task_title not created yet) → soft-fail
            if echo "$RESP" | grep -q "is not a property that exists"; then
              echo "::warning::Notion DB schema mismatch — add required properties to Notion WBS DB (task_title rich_text / instance select / status select / progress number / deadline date / updated_at date)"
              exit 0
            fi
            # Supabase EF idle timeout (141 tasks × Notion rate limit > 150s) → soft-fail
            if echo "$RESP" | grep -q "IDLE_TIMEOUT"; then
              echo "::warning::Notion sync EF idle timeout — batch too large for Supabase 150s limit (will retry next hour)"
              exit 0
            fi
            # EF 内 retry が尽きた 429 は fail させ、resilience watch が再実行・通知する。
            if echo "$RESP" | grep -q "rate_limited\|\"429\""; then
              echo "::error::Notion API rate limit retries exhausted (HTTP 429)"
              exit 1
            fi
            # Notion DB-level inaccessible (share with Integration / DB deleted) → always soft-fail
            if echo "$RESP" | grep -q "Could not find database"; then
              echo "::warning::Notion sync: 1+ database ID(s) inaccessible — share with Notion Integration or remove references (DB-level config issue, not page orphan)"
              exit 0
            fi
            # Notion object_not_found (deleted/moved page) → soft-fail if < 10% fail rate
            if echo "$RESP" | grep -q "object_not_found"; then
              FAIL_PCT_VAL=$(python3 -c "print(round($FAILED / max($TOTAL,1) * 100, 1))" 2>/dev/null || echo "100")
              if python3 -c "exit(0 if float('$FAIL_PCT_VAL') < 10 else 1)" 2>/dev/null; then
                echo "::warning::Notion sync: $FAILED orphan page(s) not found (${FAIL_PCT_VAL}% < 10%) — will auto-skip on next sync"
                exit 0
              fi
            fi
            exit 1
          fi

      - name: Call schedule-hub:notion.sync_roadmap
        env:
          SUPABASE_AUTH_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROADMAP_MAX_CHARS: ${{ github.event.inputs.roadmap_max_chars || '24000' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          endpoint = "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub"
          roadmap_files = sorted(Path("docs/roadmap").glob("*.md"))
          source = roadmap_files[-1] if roadmap_files else Path("docs/GROWTH_STRATEGY_ROADMAP.md")
          content = source.read_text(encoding="utf-8", errors="replace")
          payload = {
              "action": "notion.sync_roadmap",
              "title": "ROADMAP mirror (auto)",
              "source_path": source.as_posix(),
              "content": content,
              "mode": "tail",
              "max_chars": int(os.environ.get("ROADMAP_MAX_CHARS", "24000")),
          }
          headers = {"Content-Type": "application/json"}
          token = os.environ.get("SUPABASE_AUTH_TOKEN", "")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=600) as res:
                  text = res.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              text = exc.read().decode("utf-8", errors="replace")
              print(text)
              if "notion_not_configured" in text:
                  print("::warning::NOTION_* secrets not configured — skip roadmap sync")
                  sys.exit(0)
              sys.exit(1)
          print(f"Response: {text}")
          data = json.loads(text)
          if data.get("success"):
              print(
                  "✅ roadmap synced "
                  f"source={data.get('source_path')} chars={data.get('synced_chars')}"
              )
              sys.exit(0)
          error = str(data.get("error", "unknown"))
          if "notion_not_configured" in error:
              print("::warning::NOTION_ROADMAP_PAGE_ID not configured yet — skip")
              sys.exit(0)
          print(f"::error::notion.sync_roadmap failed: {error}")
          sys.exit(1)
          PY

      - name: Call schedule-hub:notion.sync_memory_index
        env:
          SUPABASE_AUTH_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEMORY_LIMIT: ${{ github.event.inputs.memory_limit || '50' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          def title_for(path: Path, text: str) -> str:
              for line in text.splitlines():
                  if line.startswith("#"):
                      return line.lstrip("#").strip()[:180]
              return path.stem.replace("_", " ")[:180]

          def snippet_for(text: str) -> str:
              return re.sub(r"\s+", " ", text).strip()[:500]

          endpoint = "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub"
          limit = int(os.environ.get("MEMORY_LIMIT", "50"))
          files = sorted(
              Path("memory").glob("*.md"),
              key=lambda p: (p.stat().st_mtime, p.name),
              reverse=True,
          )[:limit]
          rows = []
          for path in files:
              text = path.read_text(encoding="utf-8", errors="replace")
              rows.append(
                  {
                      "file_path": path.as_posix(),
                      "title": title_for(path, text),
                      "snippet": snippet_for(text),
                      "source": "memory",
                  }
              )
          payload = {
              "action": "notion.sync_memory_index",
              "rows": rows,
              "limit": limit,
          }
          headers = {"Content-Type": "application/json"}
          token = os.environ.get("SUPABASE_AUTH_TOKEN", "")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=600) as res:
                  text = res.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              text = exc.read().decode("utf-8", errors="replace")
              print(text)
              if "notion_not_configured" in text:
                  print("::warning::NOTION_* secrets not configured — skip memory sync")
                  sys.exit(0)
              sys.exit(1)
          print(f"Response: {text}")
          data = json.loads(text)
          if data.get("success"):
              print(
                  "✅ memory index synced "
                  f"total={data.get('total')} created={data.get('created')} updated={data.get('updated')}"
              )
              sys.exit(0)
          error = str(data.get("error", "unknown"))
          if "notion_not_configured" in error:
              print("::warning::Notion memory database/data-source ID not configured yet — skip")
              sys.exit(0)
          print(f"::error::notion.sync_memory_index failed: {error}")
          sys.exit(1)
          PY
