name: CI

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
  push:
    branches:
      - staging   # main は deploy-prod.yml が workflow_call で CI を呼ぶため除外 (二重起動防止)
      - develop
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '*.md'
      - '**/*.md'
      - '.github/*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # PR 以外 (push / workflow_call) では cancel 無効化
  # → deploy-prod.yml (cancel-in-progress: false) から呼ばれた CI が cascade cancel される事故を防ぐ
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ref="refs/pull/${{ github.event.pull_request.number }}/merge"
            if ! git fetch --depth=1 origin "+${ref}:refs/remotes/origin/checkout"; then
              echo "::warning::PR merge ref ${ref} is unavailable; falling back to PR head SHA."
              git fetch --depth=1 \
                "https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" \
                "${{ github.event.pull_request.head.sha }}"
              git checkout --force FETCH_HEAD
              exit 0
            fi
          else
            ref="${GITHUB_REF}"
            git fetch --depth=1 origin "+${ref}:refs/remotes/origin/checkout"
          fi
          git checkout --force refs/remotes/origin/checkout

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x' # 指定のバージョンに戻しました

      - name: Get Flutter version
        run: flutter --version

      - name: Cache Flutter pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub get --dry-run

      - name: Analyze code
        run: flutter analyze
        # プロジェクトルール「flutter analyze 常に0エラー」をCIで強制 (continue-on-error 削除)

      - name: Setup Deno
        shell: bash
        run: |
          set -euo pipefail
          # deno.land は一時的な 5xx を返すことがあり、素の curl|sh だと main の
          # deploy-prod ごと fail する (2026-06-10 run 27293741687 = 503 → exit 22 /
          # Issue #3215)。deploy-prod.yml の deploy_function と同じ retry+backoff
          # idiom で吸収する。一時ファイル経由にする理由: stdout パイプ直結だと
          # curl --retry が rewind できず、切断時に途中までのスクリプトが sh に
          # 流れる危険があるため。installer 内部の DL 失敗は外側 loop が拾う。
          # 持続障害 (3 回 fail) は rerun に委ねる。
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                 -o "$installer" https://deno.land/install.sh \
               && sh "$installer"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Deno install failed after ${attempt} attempts (deno.land transient error)"
              exit 1
            fi
            echo "::warning::Deno install attempt ${attempt} failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version

      - name: Check Edge Function imports
        run: python scripts/check_edge_function_imports.py

      - name: Check CI/CD docs-only path filters
        run: python scripts/check_cicd_path_filters.py

      - name: Impossible task safe degradation gate
        run: python scripts/impossible_task_degradation_check.py --artifact .ci-logs/impossible-task-degradation.json

      - name: Upload impossible task degradation report
        if: always() && hashFiles('.ci-logs/impossible-task-degradation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: impossible-task-degradation-report
          path: .ci-logs/impossible-task-degradation.json
          if-no-files-found: ignore

      - name: Deno lint (Edge Functions)
        id: deno_lint
        run: |
          mkdir -p .ci-logs
          set +e
          deno lint --config supabase/functions/deno.json supabase/functions/ 2>&1 | tee .ci-logs/deno-lint.log
          status=${PIPESTATUS[0]}
          python scripts/ci_failure_digest.py summarize-log .ci-logs/deno-lint.log \
            --kind deno-lint \
            --summary "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
        # プロジェクトルール「deno lint 常に0エラー」をCIで強制

      - name: Upload Deno lint log
        if: always() && hashFiles('.ci-logs/deno-lint.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: deno-lint-log
          path: .ci-logs/deno-lint.log
          if-no-files-found: ignore

      - name: Deno test (Edge Functions)
        id: deno_test
        run: |
          TEST_FILES=$(find supabase/functions -name "*.test.ts" 2>/dev/null | head -1)
          if [ -n "$TEST_FILES" ]; then
            deno test --allow-all --no-check --config supabase/functions/deno.json supabase/functions/
          else
            echo "⚠️ deno test: *.test.ts が見つかりません — スキップ"
          fi
        # 74テスト安定稼働中 (2026-04-12 PR#317) — continue-on-error 廃止

      - name: Check Edge Function deploy count (ハードキャップ50本以下)
        run: |
          # deploy-prod.yml のデプロイリストを抽出 (macro-hub体制 — Tier1/Tier2廃止)
          DEPLOYED=$(python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(
              r'^\s*(?:supabase\s+functions\s+deploy|deploy_function)\s+([A-Za-z0-9_-]+)\b'
          )
          deployed = []
          for line in Path('.github/workflows/deploy-prod.yml').read_text(encoding='utf-8').splitlines():
              match = pattern.search(line)
              if match:
                  deployed.append(match.group(1))
          print('\n'.join(sorted(set(deployed))))
          PY
          )
          DEPLOY_COUNT=$(echo "$DEPLOYED" | grep -c . || true)
          # supabase/functions/ の実EFディレクトリ数 (_shared除く)
          EXISTING=$(find supabase/functions -maxdepth 1 -mindepth 1 -type d \
            | xargs -I{} basename {} | grep -v "^_" | sort)
          EXISTING_COUNT=$(echo "$EXISTING" | grep -c . || true)
          # hub に吸収済みEF = ソースあり・デプロイなし (正常)
          HUB_ABSORBED=$(comm -23 <(echo "$EXISTING") <(echo "$DEPLOYED") || true)
          HUB_ABSORBED_COUNT=$(echo "$HUB_ABSORBED" | grep -c . || true)
          echo "=== EF カウント ==="
          echo "デプロイ中: ${DEPLOY_COUNT}本 (ハードキャップ: 50本以下)"
          echo "ソースあり: ${EXISTING_COUNT}本"
          echo "hub吸収済み(ソースのみ): ${HUB_ABSORBED_COUNT}本"
          echo ""
          echo "=== デプロイ中EF一覧 ==="
          echo "$DEPLOYED"
          # ハードキャップ超過チェック
          if [ "$DEPLOY_COUNT" -gt 50 ]; then
            echo "❌ EFハードキャップ超過: ${DEPLOY_COUNT}本 > 50本"
            exit 1
          else
            echo "✅ EFハードキャップ内: ${DEPLOY_COUNT}本 <= 50本"
          fi
        continue-on-error: false  # 50本超過はCIブロック

      - name: Check SQL migration shell quoting artifacts
        run: |
          # bash quoting pattern '"'"' が SQL ファイルに混入すると SQLSTATE 42601 で deploy-prod が失敗する
          FOUND=$(grep -rl "'\"\\'\"'" supabase/migrations/ 2>/dev/null || true)
          # シングルクォートのアーティファクトパターン: ' + " + ' + " + '
          FOUND2=$(python3 <<'PY' 2>&1
          import os
          import sys

          found = []
          mig_dir = "supabase/migrations"
          if os.path.isdir(mig_dir):
              for filename in os.listdir(mig_dir):
                  if filename.endswith(".sql"):
                      path = os.path.join(mig_dir, filename)
                      content = open(path, encoding="utf-8", errors="replace").read()
                      if "'\"'\"'" in content:
                          found.append(path)

          if found:
              print("FOUND: " + ", ".join(found))
              sys.exit(1)

          print("OK: no shell quoting artifacts in migrations")
          PY
          )
          echo "$FOUND2"
          if echo "$FOUND2" | grep -q "^FOUND:"; then
            echo "❌ bash quoting artifact '\"'\"' detected in SQL migration files"
            echo "   Fix: replace with '' (SQL escape for single quote)"
            exit 1
          fi
        continue-on-error: false  # migration 構文エラーはCIブロック

      - name: Check GitHub Actions Node runtime floor
        run: python scripts/check_github_actions_node_runtime.py
        continue-on-error: false

      - name: Check GitHub Actions inline Python safety
        run: python scripts/check_github_actions_python_inline.py
        continue-on-error: false

      - name: Check duplicate dispose statements
        # part 280 実例 (二重 dispose → dispose 中断 → defunct setState) の再発防止。
        # part 286: timeout でハング検知 + --max-seconds で線形時間 (正規表現の
        # 破滅的バックトラック回帰) を CI でアサート。通常 ~2.5s なので 60s 上限。
        run: timeout 120 python scripts/check_duplicate_dispose.py --max-seconds 60
        continue-on-error: false

      - name: Verify git hooks stay healthy
        # part 291: pre-commit hook の腐敗防止。part 292: .githooks/* 全体へ一般化
        # (将来 hook を追加しても自動で対象 / *.md は除外)。構文 + 実行ビットを検証。
        run: |
          shopt -s nullglob
          found=0
          for hook in .githooks/*; do
            case "$hook" in
              *.md) continue ;;
            esac
            found=$((found + 1))
            echo "checking $hook"
            bash -n "$hook"
            test -x "$hook" || {
              echo "$hook must be executable (chmod +x)" >&2
              exit 1
            }
          done
          if [ "$found" -eq 0 ]; then
            echo "no hooks found under .githooks/" >&2
            exit 1
          fi
        continue-on-error: false

      - name: Check formatting
        # #1372: treat Dart formatting as a required static-analysis gate.
        run: dart format --output=none --set-exit-if-changed .

      - name: Run VM tests
        id: flutter_test
        run: flutter test --coverage
        continue-on-error: false  # VSCode S21: 9 test files @TestOn('browser') 追加で VM contamination 完全解消

      - name: Run web import smoke tests
        id: flutter_web_test
        run: flutter test --platform chrome test/web_import_smoke_test.dart
        continue-on-error: false

      # workflow_call (deploy-prod) 経由の場合はビルドをスキップ — deploy-prod が再ビルドするため重複回避
      - name: Build web (production)
        if: github.event_name != 'workflow_call'
        run: >
          flutter build web --release --pwa-strategy=none
          --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=true
        env:
          FLUTTER_WEB: true

      - name: Check build output
        if: github.event_name != 'workflow_call'
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      - name: Job Summary
        if: always()
        run: |
          BUILD_OK=$([ -d "build/web" ] && echo "✅" || echo "— (skipped: workflow_call)")
          FLUTTER_TEST="${{ steps.flutter_test.outcome }}"
          FLUTTER_WEB_TEST="${{ steps.flutter_web_test.outcome }}"
          DENO_TEST="${{ steps.deno_test.outcome }}"
          FT_ICON=$([ "$FLUTTER_TEST" = "success" ] && echo "✅" || [ "$FLUTTER_TEST" = "skipped" ] && echo "—" || echo "⚠️")
          DT_ICON=$([ "$DENO_TEST" = "success" ] && echo "✅" || [ "$DENO_TEST" = "skipped" ] && echo "—" || echo "⚠️")
          {
            echo "## CI Results — \`${{ github.ref_name }}\` @ \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| チェック | 結果 |"
            echo "|---------|------|"
            echo "| \`flutter analyze\` | ✅ 0エラー (強制) |"
            echo "| \`deno lint\` | ✅ 0エラー (強制) |"
            echo "| \`dart format --set-exit-if-changed\` | ✅ 差分なし (強制) |"
            echo "| \`flutter test --coverage\` | $FT_ICON $FLUTTER_TEST |"
            echo "| \`flutter test --platform chrome\` | $FLUTTER_WEB_TEST |"
            echo "| \`deno test\` | $DT_ICON $DENO_TEST (continue-on-error) |"
            echo "| \`flutter build web --release\` | $BUILD_OK |"
            echo ""
            echo "**Actor**: ${{ github.actor }} | **Trigger**: ${{ github.event_name }}"
          } >> $GITHUB_STEP_SUMMARY

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ref="refs/pull/${{ github.event.pull_request.number }}/merge"
            if ! git fetch --depth=1 origin "+${ref}:refs/remotes/origin/checkout"; then
              echo "::warning::PR merge ref ${ref} is unavailable; falling back to PR head SHA."
              git fetch --depth=1 \
                "https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" \
                "${{ github.event.pull_request.head.sha }}"
              git checkout --force FETCH_HEAD
              exit 0
            fi
          else
            ref="${GITHUB_REF}"
            git fetch --depth=1 origin "+${ref}:refs/remotes/origin/checkout"
          fi
          git checkout --force refs/remotes/origin/checkout

      - name: Run security audit
        run: |
          # Check for sensitive files
          echo "Checking for sensitive files..."
          if git ls-files | grep -E '\.(env|key|pem|p12)$' | grep -v '\.env\.example'; then
            echo "Error: Sensitive files found in repository"
            exit 1
          fi
          # Flutter/Firebase specific credential files
          if git ls-files | grep -E 'google-services\.json|GoogleService-Info\.plist|serviceAccountKey\.json'; then
            echo "Error: Firebase/Google credential files found in repository"
            exit 1
          fi
          echo "✅ No sensitive files found"

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          # This is a basic check - consider using tools like gitleaks or trufflehog
          FOUND=0
          # Dart files
          if grep -r -E '(password|secret|api_key|private_key)\s*=\s*["\047][^"\047]+["\047]' lib/ --include="*.dart" | grep -v 'your_'; then
            echo "Warning: Potential hardcoded secrets found in Dart files"
            FOUND=1
          fi
          # TypeScript files (Edge Functions)
          if grep -r -E '(password|secret|api_key|private_key)\s*=\s*["\047][^"\047]+["\047]' supabase/functions/ --include="*.ts" | grep -v 'your_\|example\|test\|placeholder'; then
            echo "Warning: Potential hardcoded secrets found in TypeScript files"
            FOUND=1
          fi
          [ "$FOUND" -eq 0 ] && echo "✅ No hardcoded secrets found"
          echo "Security check completed"

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-check]
    if: github.event_name == 'pull_request' && success()
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI全チェック通過！\n\n**必須ゲート (強制)**\n- `flutter analyze` 0エラー ✅\n- `deno lint` 0エラー ✅\n- `dart format` 差分なし ✅\n- `flutter build web --release` 成功 ✅\n\nコードレビュー準備完了です。'
            })
