name: CI

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
  push:
    branches:
      - main
      - staging
      - develop
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x' # 指定のバージョンに戻しました
          channel: 'stable'
          cache: true

      - name: Get Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub get --dry-run

      - name: Analyze code
        run: flutter analyze
        # プロジェクトルール「flutter analyze 常に0エラー」をCIで強制 (continue-on-error 削除)

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno lint (Edge Functions)
        run: deno lint --config supabase/functions/deno.json supabase/functions/
        # プロジェクトルール「deno lint 常に0エラー」をCIで強制

      - name: Check new Edge Functions not in deploy list
        run: |
          # deploy-prod.yml のデプロイリストを抽出
          DEPLOYED=$(grep "supabase functions deploy" .github/workflows/deploy-prod.yml \
            | grep -v "^#\|#" | awk '{print $4}' | sort)
          # supabase/functions/ の実EFディレクトリのみ抽出 (_shared・設定ファイル除く)
          EXISTING=$(find supabase/functions -maxdepth 1 -mindepth 1 -type d \
            | xargs -I{} basename {} | grep -v "^_" | sort)
          # deploy-prod.yml の Tier2コメントから全EF名を抽出 (カンマ区切りも対応)
          TIER2=$(sed -n '/Tier 2 (code-only/,/^\s*env:/p' \
            .github/workflows/deploy-prod.yml \
            | grep -E '^\s+#\s+[a-z]' \
            | sed 's/.*#\s*//' | tr ',' '\n' | tr -d ' ' \
            | grep -E '^[a-z][a-z0-9-]+$' | sort -u || true)
          # Tier1にもTier2にも記載がない「未分類EF」を検出
          UNCATEGORIZED=$(comm -23 <(echo "$EXISTING") \
            <(echo -e "$DEPLOYED\n$TIER2" | sort -u) || true)
          if [ -n "$UNCATEGORIZED" ]; then
            echo "⚠️ 以下のEFがTier1/Tier2いずれにも未登録です:"
            echo "$UNCATEGORIZED"
            echo "deploy-prod.yml のTier1またはTier2コメントへの追記を検討してください。"
          else
            echo "✅ 全EFがTier1/Tier2に分類済み"
          fi
        continue-on-error: true  # 未分類でもCIはブロックしない (警告のみ)

      - name: Check formatting
        run: dart format --set-exit-if-changed .
        continue-on-error: true # エラーでも続行

      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true # エラーでも続行

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v5
        if: success()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      #  修正: --no-tree-shake-icons を追加
      - name: Build web (production)
        run: >
          flutter build web --release --no-tree-shake-icons
          --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=true
        env:
          FLUTTER_WEB: true

      - name: Check build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      - name: Build web (wasm) — regression check
        run: flutter build web --wasm --no-tree-shake-icons
        continue-on-error: true
        env:
          FLUTTER_WEB: true

      - name: Job Summary
        if: always()
        run: |
          BUILD_OK=$([ -d "build/web" ] && echo "✅" || echo "❌")
          {
            echo "## CI Results — \`${{ github.ref_name }}\` @ \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| チェック | 結果 |"
            echo "|---------|------|"
            echo "| \`flutter analyze\` | ✅ 0エラー (強制) |"
            echo "| \`deno lint\` | ✅ 0エラー (強制) |"
            echo "| \`flutter build web --release\` | $BUILD_OK |"
            echo ""
            echo "**Actor**: ${{ github.actor }} | **Trigger**: ${{ github.event_name }}"
          } >> $GITHUB_STEP_SUMMARY

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          # Check for sensitive files
          echo "Checking for sensitive files..."
          if git ls-files | grep -E '\.(env|key|pem|p12)$' | grep -v '.env.example'; then
            echo "Error: Sensitive files found in repository"
            exit 1
          fi
          echo "No sensitive files found"

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          # This is a basic check - consider using tools like gitleaks or trufflehog
          if grep -r -E '(password|secret|api_key|private_key)\s*=\s*["\047][^"\047]+["\047]' lib/ --include="*.dart" | grep -v 'your_'; then
            echo "Warning: Potential hardcoded secrets found"
            # Don't fail the build, just warn
          fi
          echo "Security check completed"

  build-matrix:
    name: Build Matrix Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      matrix:
        flutter-version: ['3.38.x'] # 指定のバージョンに戻しました
        # Add more versions if needed for compatibility testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ matrix.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      #  修正: --no-tree-shake-icons を追加
      - name: Build test
        run: >
          flutter build web --release --no-tree-shake-icons
          --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=true

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-check, build-matrix]
    if: github.event_name == 'pull_request' && success()
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI全チェック通過！\n\n**必須ゲート (強制)**\n- `flutter analyze` 0エラー ✅\n- `deno lint` 0エラー ✅\n- `flutter build web --release` 成功 ✅\n\nコードレビュー準備完了です。'
            })
