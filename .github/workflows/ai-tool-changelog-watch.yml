name: AI Tool Monthly Changelog Watch

on:
  schedule:
    - cron: "0 0 1 * *" # monthly, 09:00 JST
  workflow_dispatch:
    inputs:
      tool_filter:
        description: "Claude/Codex filter: claude, codex, or both. Cursor/Replit are always fetched."
        required: false
        default: "both"

concurrency:
  group: ai-tool-changelog-watch
  cancel-in-progress: false

permissions: {}

jobs:
  fetch-and-summarize:
    environment:
      name: ai-operations-production
      deployment: false
    permissions:
      contents: write
      issues: write
    name: Fetch, summarize, issue, and draft
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ secrets.BYPASS_RULES || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 5
          token: ${{ secrets.BYPASS_RULES || github.token }}

      - name: Resolve paid Claude/Codex policy
        id: paid_ai_policy
        uses: ./.github/actions/paid-ai-policy
        with:
          requested: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED || 'false' }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      - name: Compute month tag
        id: tag
        run: |
          month=$(TZ=UTC date +'%Y-%m')
          echo "month=$month" >> "$GITHUB_OUTPUT"

      - name: Fetch Claude Code release notes
        if: ${{ github.event.inputs.tool_filter != 'codex' }}
        run: |
          mkdir -p .ci-logs
          gh api repos/anthropics/claude-code/releases?per_page=20 \
            > .ci-logs/claude-code-releases-${{ steps.tag.outputs.month }}.json \
            || echo "WARN: Claude Code release fetch failed (non-fatal)"

      - name: Fetch Codex CLI release notes
        if: ${{ github.event.inputs.tool_filter != 'claude' }}
        run: |
          mkdir -p .ci-logs
          gh api repos/openai/codex/releases?per_page=10 \
            > .ci-logs/codex-cli-releases-${{ steps.tag.outputs.month }}.json \
            || echo "WARN: Codex release fetch failed (non-fatal)"

      - name: Fetch Cursor changelog
        run: |
          mkdir -p .ci-logs
          curl -fsSL --retry 3 --retry-delay 2 "https://cursor.com/changelog" \
            > .ci-logs/cursor-changelog-${{ steps.tag.outputs.month }}.html \
            || echo "WARN: Cursor changelog fetch failed (non-fatal)"

      - name: Fetch Replit Agent update sources
        run: |
          mkdir -p .ci-logs
          curl -fsSL --retry 3 --retry-delay 2 "https://replit.com/blog/introducing-agent-4-built-for-creativity" \
            > .ci-logs/replit-agent4-${{ steps.tag.outputs.month }}.html \
            || echo "WARN: Replit Agent 4 blog fetch failed (non-fatal)"
          curl -fsSL --retry 3 --retry-delay 2 "https://docs.replit.com/updates/2026/03/13/changelog" \
            > .ci-logs/replit-updates-${{ steps.tag.outputs.month }}.html \
            || echo "WARN: Replit updates changelog fetch failed (non-fatal)"

      - name: Summarize changelogs
        env:
          ANTHROPIC_API_KEY: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED == 'true' && steps.paid_ai_policy.outputs.enabled == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          python scripts/ai_tool_changelog_summarize.py \
            --month "${{ steps.tag.outputs.month }}" \
            --output "docs/ai-tool-changelog/${{ steps.tag.outputs.month }}.md"

      - name: Create GitHub issues and cross-instance drafts for high-priority items
        run: |
          python scripts/ai_tool_changelog_to_issues.py \
            --input "docs/ai-tool-changelog/${{ steps.tag.outputs.month }}.md" \
            --label ai-tool-update \
            --repo "${{ github.repository }}" \
            --draft-dir "docs/cross-instance-prs/drafts/ai-tool-update"
        continue-on-error: true

      - name: Commit summary
        run: |
          git config user.name "ai-tool-changelog-watch[bot]"
          git config user.email "ai-tool-changelog-watch@users.noreply.github.com"
          git add docs/ai-tool-changelog/ docs/cross-instance-prs/drafts/ai-tool-update/ .ci-logs/ || true
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "docs(ai-tool): monthly changelog watch ${{ steps.tag.outputs.month }}"
            git push origin HEAD:main || git push --force-with-lease origin HEAD:main
          fi
