name: Compressed Prompt Sync & CI Analyze Contract

on:
  pull_request:
    paths:
      - ".github/COMPRESSED_PROMPT_V3.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/compressed-prompt-sync.yml"
      - ".githooks/pre-push"
      - "COMPRESSED_PROMPT.md"
      - "analysis_options.yaml"
      - "scripts/quality_gate.py"
      - "scripts/sync_compressed_prompt.py"
      - "test/scripts/test_sync_compressed_prompt.py"
  workflow_dispatch:

concurrency:
  group: compressed-prompt-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify COMPRESSED_PROMPT sync and CI analyze contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run unit tests, self-test, and sync check
        run: |
          python3 -B test/scripts/test_sync_compressed_prompt.py -v
          python3 -B scripts/sync_compressed_prompt.py --self-test
          python3 -B scripts/sync_compressed_prompt.py --check
