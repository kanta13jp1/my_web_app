name: Claude Design Theme Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "config/claude_design_tokens.json"
      - "lib/theme/claude_design_generated_theme.dart"
      - "lib/theme/design_tokens.dart"
      - "lib/dev/claude_design/**"
      - "scripts/fix_design_tokens_generic.py"
      - "scripts/claude_design_to_theme_data.py"
      - "test/dev/claude_design/**"
      - "test/scripts/test_claude_design_to_theme_data.py"
      - ".github/workflows/claude-design-theme-pipeline.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: claude-design-theme-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Convert tokens and verify Flutter ThemeData
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run token converter unit tests and drift check
        run: |
          set -euo pipefail
          python3 -B test/scripts/test_claude_design_to_theme_data.py -v
          python3 -B scripts/fix_design_tokens_generic.py --self-test
          python3 -B scripts/claude_design_to_theme_data.py --self-test
          python3 -B scripts/claude_design_to_theme_data.py \
            --input config/claude_design_tokens.json \
            --out lib/theme/claude_design_generated_theme.dart \
            --check

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format and analyze generated ThemeData Dart code
        run: |
          set -euo pipefail
          python3 -B scripts/claude_design_to_theme_data.py \
            --input config/claude_design_tokens.json \
            --out /tmp/claude_design_generated_theme.dart
          diff -u lib/theme/claude_design_generated_theme.dart /tmp/claude_design_generated_theme.dart
          dart format --output=none --set-exit-if-changed \
            lib/theme/claude_design_generated_theme.dart \
            lib/dev/claude_design/flutter_codegen.dart \
            test/dev/claude_design/flutter_codegen_test.dart
          flutter analyze \
            lib/theme/claude_design_generated_theme.dart \
            lib/dev/claude_design/flutter_codegen.dart \
            test/dev/claude_design/flutter_codegen_test.dart
          flutter test test/dev/claude_design/
