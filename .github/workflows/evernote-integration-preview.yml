name: Evernote integration baseline
on:
  push:
    branches: ['codex/evernote-main-reconcile-20260912']
    paths: ['.github/workflows/evernote-integration-preview.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ce23b63347064d19721edf6c04558cd58109656
          persist-credentials: false
      - name: Verify immutable pre-integration baseline
        run: test "$(git rev-parse HEAD)" = "0ce23b63347064d19721edf6c04558cd58109656"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve dependencies on runner
        run: flutter pub get
      - name: Check whether the asset-priority failure exists before integration
        run: >-
          flutter test test/widgets/asset_management_page_smoke_test.dart
          --plain-name 'living expense priority toggle immediately reorders actions'
