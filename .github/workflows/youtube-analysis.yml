name: YouTube Analysis (Real Value競合分析)

# 毎日 11:00 JST (UTC 02:00) + 手動実行
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: youtube-analysis
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  youtube-analysis:
    name: YouTube Channel Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "yt-dlp>=2024.1.0"

      # ── Step 1: チャンネル動画データ取得 ────────────────────────────────────
      - name: Step 1 - fetch_yt.py (yt_results.json 生成)
        id: fetch
        run: |
          python fetch_yt.py
          VIDEOS=$(python3 -c "import json; d=json.load(open('yt_results.json')); print(d.get('videos_fetched', len(d.get('videos', []))))")
          ERRORS=$(python3 -c "import json; d=json.load(open('yt_results.json')); print(len(d.get('errors', [])))")
          SUBS=$(python3 -c "import json; d=json.load(open('yt_results.json')); print(d.get('channel', {}).get('subscribers', ''))")
          echo "videos_fetched=$VIDEOS" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS"         >> $GITHUB_OUTPUT
          echo "subscribers=$SUBS"      >> $GITHUB_OUTPUT
          echo "📺 取得動画: ${VIDEOS}件 / エラー: ${ERRORS}件 / 登録者: ${SUBS}"

      # ── Step 2: TSV スナップショット更新 ────────────────────────────────────
      - name: Step 2 - update_tsv.py (updated_table.tsv 更新)
        id: update_tsv
        run: |
          python update_tsv.py
          echo "tsv_updated=true" >> $GITHUB_OUTPUT
          echo "📊 updated_table.tsv 更新完了"

      # ── Step 3: コミット → PR作成・マージ ──────────────────────────────────
      - name: Step 3 - コミット & PR作成・マージ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          RUN_ID="${{ github.run_id }}"
          BRANCH="youtube-analysis-${DATE}-${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -b "$BRANCH" origin/main

          # TSVのみコミット (yt_results.json はランタイム一時ファイル)
          git add updated_table.tsv
          if git diff --cached --quiet; then
            echo "📝 変更なし — スキップ"
            exit 0
          fi

          VIDEOS="${{ steps.fetch.outputs.videos_fetched }}"
          git commit -m "自動: YouTube分析スナップショット ${DATE} (${VIDEOS}件)"
          git push origin "$BRANCH"

          set +e
          PR_URL=$(gh pr create \
            --title "自動: YouTube分析 ${DATE}" \
            --body "YouTube チャンネル分析スナップショット (GitHub Actions run #${RUN_ID})" \
            --base main \
            --head "$BRANCH")
          if [ -n "$PR_URL" ]; then
            gh pr merge "$PR_URL" --squash --delete-branch --yes 2>&1 && \
              echo "✅ マージ完了" || echo "⚠️ 手動マージが必要: $PR_URL"
          fi
          set -e

      # ── Step 4: schedule_task_runs 記録 ────────────────────────────────────
      - name: Step 4 - schedule_task_runs 記録
        if: always()
        run: |
          VIDEOS="${{ steps.fetch.outputs.videos_fetched }}"
          ERRORS="${{ steps.fetch.outputs.errors }}"
          STATUS="success"
          [ "${{ job.status }}" != "success" ] && STATUS="error"
          SUMMARY="YouTube Analysis: videos_fetched=${VIDEOS}, errors=${ERRORS}"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"youtube-analysis\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Job Summary
        if: always()
        run: |
          VIDEOS="${{ steps.fetch.outputs.videos_fetched }}"
          ERRORS="${{ steps.fetch.outputs.errors }}"
          SUBS="${{ steps.fetch.outputs.subscribers }}"
          STATUS="${{ job.status }}"
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          {
            echo "## YouTube Analysis $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|-----|------|"
            echo "| 取得動画数 | ${VIDEOS}件 |"
            echo "| エラー数 | ${ERRORS}件 |"
            echo "| チャンネル登録者 | ${SUBS} |"
            echo "| updated_table.tsv | $ICON 更新済み |"
          } >> $GITHUB_STEP_SUMMARY
