name: KINETIC FORGE verified production recording
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Verified production revision
        required: true
        type: string
permissions: {}
concurrency:
  group: kinetic-recording-${{ github.ref }}
  cancel-in-progress: false
jobs:
  record:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --check scripts/kinetic-record.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Validate production interaction then record public app
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.production_sha }}
        run: node scripts/kinetic-record.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kinetic-production-recording
          path: kinetic-recording/
          retention-days: 14
