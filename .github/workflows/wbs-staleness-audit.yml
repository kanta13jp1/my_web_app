name: WBS Staleness Audit

# Win版#131 part 12 / Option C
# 全インスタンスの WBS 更新有無を毎日 audit。
# 過去 N 日間 wbs_tasks.updated_at が更新されていないインスタンスを検出 →
# docs/cross-instance-prs/<YYYYMMDD>_wbs_<instance>_overdue.md を自動作成 → PR

on:
  schedule:
    # 毎日 06:00 JST = 21:00 UTC (前日)
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: wbs-staleness-audit-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  STALE_DAYS: 3 # この日数以上更新が無いインスタンスを overdue 扱い
  INSTANCES: 'claude codex user automation'

jobs:
  audit:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Audit per instance
        id: audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          mkdir -p audit
          OVERDUE_LIST=""

          for INSTANCE in $INSTANCES; do
            # 過去 STALE_DAYS 日間の wbs_tasks.updated_at が当該インスタンスにあるか
            RESPONSE=$(curl -s -X POST "${SUPABASE_URL}/functions/v1/tools-hub" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"wbs.list_tasks\",\"instance\":\"${INSTANCE}\"}")
            # Two-instance S21: keep heredoc parsing stable for Python one-liners.
            # 1-line 化して YAML block scalar と Python 両方の indentation 問題を解消
            RECENT_COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; from datetime import datetime,timezone,timedelta; d=json.load(sys.stdin); c=datetime.now(timezone.utc)-timedelta(days=${STALE_DAYS}); print(sum(1 for t in d.get('tasks',[]) if t.get('updated_at') and datetime.fromisoformat(t['updated_at'].replace('Z','+00:00'))>c))" || echo "0")

            if [ "$RECENT_COUNT" = "0" ]; then
              OVERDUE_LIST="$OVERDUE_LIST $INSTANCE"
              echo "⚠ $INSTANCE: 過去 $STALE_DAYS 日 WBS 更新なし"
            else
              echo "✅ $INSTANCE: $RECENT_COUNT 件更新済み"
            fi
          done

          echo "overdue_list=$OVERDUE_LIST" >> "$GITHUB_OUTPUT"

      - name: Create cross-instance-pr for overdue instances
        if: steps.audit.outputs.overdue_list != ''
        env:
          OVERDUE: ${{ steps.audit.outputs.overdue_list }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d)
          mkdir -p docs/cross-instance-prs
          # Two-instance S21: add run_id suffix to avoid same-day branch collisions.
          BRANCH="wbs-staleness/${DATE}-${{ github.run_id }}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"

          for INSTANCE in $OVERDUE; do
            FILE="docs/cross-instance-prs/${DATE}_wbs_${INSTANCE}_overdue.md"
            cat > "$FILE" <<EOF
          # WBS 更新が ${STALE_DAYS} 日以上滞っています — ${INSTANCE} 宛

          - **検出日**: $(date -u +%Y-%m-%d)
          - **検出元**: \`.github/workflows/wbs-staleness-audit.yml\` (Win版#131 part 12 / Option C)
          - **対象**: \`${INSTANCE}\`
          - **状況**: 過去 \`${STALE_DAYS}\` 日間 \`wbs_tasks.updated_at\` の更新ゼロ

          ## 必須対応 (次セッション開始時)

          1. \`tools-hub:wbs.priority_for_instance\` で TOP 5 取得
          2. 着手タスクを \`wbs.update_progress\` で \`in_progress\` 化
          3. 完了タスクを \`wbs.update_progress\` で \`completed\` 化
          4. 遅延タスクは \`recovery_plan\` 必須記入
          5. 新規発生は \`wbs.add_task\` で追加

          ## WBS 表示

          https://my-web-app-b67f4.web.app/project-gantt

          ## 関連 rule

          - \`[WBS-SYNC]\` (inject-rules.txt 毎ターン注入)
          - wrap-up skill Step 5.5 (Win版#131 part 12 で追加)
          EOF
            git add "$FILE"
          done

          git commit -m "audit: WBS staleness — ${OVERDUE} overdue (>${STALE_DAYS} days)"
          git push origin "$BRANCH"

          gh pr create \
            --title "audit: WBS staleness ${DATE} — overdue:${OVERDUE}" \
            --body "Automated WBS staleness audit. ${STALE_DAYS}+ 日 WBS 更新が無いインスタンスを cross-instance-pr 化しました。" \
            --label "wbs-audit,automated" \
            --base main \
            --head "$BRANCH" || true

      # Win版#131 part 21 updated 2026-05-05: Codex #1 fallback - unassigned bug 4h+ audit.
      - name: Detect unassigned bugs (4h+)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d)
          # 4h 以上前から open + 未 assign + label=bug を抽出
          CUTOFF=$(date -u -d "-4 hours" +%Y-%m-%dT%H:%M:%SZ)
          OUT=$(gh issue list --repo "${{ github.repository }}" \
            --state open --label bug --limit 50 \
            --json number,title,createdAt,assignees,url \
            --jq '[.[] | select(.assignees | length == 0) | select(.createdAt < "'"$CUTOFF"'")] | .[] | "\(.number)|\(.title)|\(.url)"')

          if [ -z "$OUT" ]; then
            echo "✅ unassigned bug 4h+ なし"
            exit 0
          fi

          mkdir -p docs/cross-instance-prs
          BRANCH="wbs-bug-escalate/${DATE}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"

          FILE="docs/cross-instance-prs/${DATE}_unassigned_bugs_escalate_claude.md"
          cat > "$FILE" <<EOF
          # 🚨 Codex #1 fallback → Claude Code #1 escalate: unassigned bug 4h+ 蓄積

          - **検出日時**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - **検出元**: \`.github/workflows/wbs-staleness-audit.yml\` (Win版#131 part 21)

          ## 対象 Issue (Codex #1 が 4h 以内に reach できなかった bug)

          $(echo "$OUT" | while IFS='|' read -r num title url; do echo "- [#$num] $title — $url"; done)

          ## Claude Code #1 アクション (Rule17 health check の流れで)

          1. 各 Issue を確認
          2. severity 判定 (critical/high/normal)
          3. Codex #1 にメンション (もし Codex #1 まだ起動していれば)
          4. 重い修正 → /cross-instance-pr to=win/vscode で再 escalate
          5. 軽量 → Claude Code #1 で即修正

          ## SLA

          - critical: **2h 以内** に Claude Code #1 直接修正
          - high: 4h 以内 cross-instance-pr or PR
          - normal: 翌日まで

          ## 関連 rule

          - \`[INSTANCE-ROLES]\` SLA section (inject-rules.txt)
          - \`issue-to-wbs.yml\` (Issue → WBS auto-add)
          EOF

          git add "$FILE"
          git commit -m "audit: unassigned bug 4h+ escalate to Claude Code #1 (${DATE})" || exit 0
          git push origin "$BRANCH" || exit 0

          gh pr create \
            --title "audit: Codex #1 fallback -> Claude Code #1 escalate (${DATE})" \
            --body "Codex #1 が 4h 以内に reach できなかった unassigned bug を Claude Code #1 にエスカレートします。" \
            --label "wbs-audit,bug-escalate,automated" \
            --base main \
            --head "$BRANCH" || true
