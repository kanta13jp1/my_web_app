name: Payroll snapshot transport isolation
on:
  pull_request:
    paths:
      - docs/proposals/payroll_snapshot/http_transport.py
      - .github/workflows/payroll-snapshot-transport.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: payroll-snapshot-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-http-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-contract-only
          POSTGRES_DB: payroll_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-contract-only
      PGDATABASE: payroll_contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify proposal matches migration
        run: cmp docs/proposals/payroll_snapshot/DRAFT_PAYROLL_SCHEMA.sql supabase/migrations/20261015235500_payroll_confirmed_balance_observations.sql
      - name: Initialize isolated synthetic contract
        working-directory: docs/proposals/payroll_snapshot
        run: psql -X -v ON_ERROR_STOP=1 -f contract.sql
      - name: Disconnect actual loopback HTTP transport
        working-directory: docs/proposals/payroll_snapshot
        run: python http_transport.py
