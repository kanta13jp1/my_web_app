name: Blog Draft (AI自動生成・毎日)

# 毎朝 07:00 JST に直近24hのgit log→Claude APIでブログドラフトを自動生成
# 生成したドラフトを docs/blog-drafts/ にコミット→同日21:00 JSTのblog-publish.ymlで投稿される
# 手動実行も可 (workflow_dispatch)

on:
  workflow_dispatch:
    inputs:
      days:
        description: '何日分のgit logを使うか (default 1)'
        required: false
        default: '1'
      target_date:
        description: 'ドラフト日付 (YYYY-MM-DD・空でtoday)'
        required: false
        default: ''
      dry_run:
        description: 'true=生成のみ・false=コミット'
        required: false
        default: 'false'
  schedule:
    # 07:00 JST = 22:00 UTC (前日)
    - cron: '0 22 * * *'

concurrency:
  group: blog-draft-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate Blog Draft via Claude API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Quota Guard — Anthropic circuit breaker check
        id: quota_check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_circuit_breaker?provider=eq.anthropic&select=state,expires_at" \
            --max-time 5 2>/dev/null || echo "[]")
          STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "closed"' 2>/dev/null || echo "closed")
          EXPIRES=$(echo "$RESPONSE" | jq -r '.[0].expires_at // ""' 2>/dev/null || echo "")
          if [ "$STATE" = "open" ] && [ -n "$EXPIRES" ]; then
            NOW=$(date -u +%s)
            EXP=$(date -u -d "$EXPIRES" +%s 2>/dev/null || echo "9999999999")
            [ "$EXP" -lt "$NOW" ] && STATE="closed" && echo "⏰ CB expired → closed"
          fi
          if [ "$STATE" = "open" ]; then
            echo "⚠️ Anthropic quota exceeded — AI steps skipped"
            echo "anthropic_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Anthropic available"
            echo "anthropic_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine target date and period
        id: period
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi
          DAYS="${{ github.event.inputs.days || '1' }}"
          SINCE=$(date -d "$TARGET_DATE -$DAYS days" +%Y-%m-%d 2>/dev/null || date -v-${DAYS}d -j -f %Y-%m-%d "$TARGET_DATE" +%Y-%m-%d 2>/dev/null || echo "$TARGET_DATE")
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "since=$SINCE" >> $GITHUB_OUTPUT
          # -daily 接尾辞: blog-publish.yml の YYYY-MM-DD.md スキップ正規表現を回避
          echo "draft_ja=docs/blog-drafts/${TARGET_DATE}-daily.md" >> $GITHUB_OUTPUT
          echo "draft_en=docs/blog-drafts/${TARGET_DATE}-daily-en.md" >> $GITHUB_OUTPUT

      - name: Skip if draft already exists or buffer is sufficient
        id: skip_check
        run: |
          DRAFT_JA="${{ steps.period.outputs.draft_ja }}"
          # 既に今日のドラフトが存在する場合はスキップ
          if [ -f "$DRAFT_JA" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Draft $DRAFT_JA already exists — skipping"
            exit 0
          fi
          # 未投稿ドラフトが7本以上あれば生成不要 (1週間分のバッファ)
          UNPUBLISHED=$(find docs/blog-drafts/ -name "*.md" -type f | while read f; do
            if ! echo "$f" | grep -qE '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$'; then
              if ! grep -q "^published: true" "$f" 2>/dev/null; then
                # title: frontmatter または # 見出しがあれば投稿可能ドラフトとしてカウント
                if grep -q "^title:" "$f" 2>/dev/null || grep -q "^# " "$f" 2>/dev/null; then
                  echo "$f"
                fi
              fi
            fi
          done | wc -l)
          echo "Unpublished titled drafts: $UNPUBLISHED"
          if [ "$UNPUBLISHED" -ge 7 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Buffer sufficient ($UNPUBLISHED unpublished) — skipping generation"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect recent git log
        if: steps.skip_check.outputs.skip == 'false'
        id: gitlog
        run: |
          SINCE="${{ steps.period.outputs.since }}"
          # 直近のコミットログを取得 (merge commitは除外・自動commitも除外)
          LOG=$(git log --since="$SINCE" --pretty=format:"- %s" --no-merges \
            | grep -iv "^- 自動:" \
            | grep -iv "^- auto:" \
            | grep -iv "^- merge " \
            | head -30)
          if [ -z "$LOG" ]; then
            echo "ℹ️ No commits in last period — skipping draft generation"
            echo "has_log=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_log=true" >> $GITHUB_OUTPUT
          # base64 でエンコードして安全に渡す
          echo "$LOG" | base64 -w0 > /tmp/gitlog.b64
          echo "gitlog_b64=$(cat /tmp/gitlog.b64)" >> $GITHUB_OUTPUT

      - name: Generate draft (Claude → Gemini → template fallback)
        if: steps.skip_check.outputs.skip == 'false' && steps.gitlog.outputs.has_log == 'true' && steps.quota_check.outputs.anthropic_available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ steps.period.outputs.target_date }}
          GITLOG_B64: ${{ steps.gitlog.outputs.gitlog_b64 }}
          DRAFT_JA: ${{ steps.period.outputs.draft_ja }}
          DRAFT_EN: ${{ steps.period.outputs.draft_en }}
        run: |
          python3 scripts/generate_blog_draft.py

      - name: Quality gate - generated drafts
        if: |
          steps.skip_check.outputs.skip == 'false' &&
          steps.gitlog.outputs.has_log == 'true' &&
          steps.quota_check.outputs.anthropic_available == 'true' &&
          github.event.inputs.dry_run != 'true'
        env:
          TRACE_ID: blog-draft-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p tmp/blog-quality
          python3 scripts/validate_blog_draft.py \
            --draft "${{ steps.period.outputs.draft_ja }}" \
            --language ja \
            --min-chars 800 \
            --min-headings 2 \
            --required-heading "##" \
            --trace-id "$TRACE_ID" \
            --source-ref "$GITHUB_SHA" \
            --report "tmp/blog-quality/${TRACE_ID}-ja.json"
          python3 scripts/validate_blog_draft.py \
            --draft "${{ steps.period.outputs.draft_en }}" \
            --language en \
            --min-chars 1200 \
            --min-headings 2 \
            --required-heading "##" \
            --trace-id "$TRACE_ID" \
            --source-ref "$GITHUB_SHA" \
            --report "tmp/blog-quality/${TRACE_ID}-en.json"

      - name: Commit drafts
        if: |
          steps.skip_check.outputs.skip == 'false' &&
          steps.gitlog.outputs.has_log == 'true' &&
          github.event.inputs.dry_run != 'true'
        env:
          BYPASS_TOKEN: ${{ secrets.BYPASS_RULES }}
        run: |
          DRAFT_JA="${{ steps.period.outputs.draft_ja }}"
          DRAFT_EN="${{ steps.period.outputs.draft_en }}"
          TARGET_DATE="${{ steps.period.outputs.target_date }}"
          git config user.name "kanta13jp1"
          git config user.email "kanta13jp1@users.noreply.github.com"
          git add "$DRAFT_JA" "$DRAFT_EN" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "自動: ブログドラフト $TARGET_DATE (日本語+英語)"
            git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${BYPASS_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:main
          fi

      - name: Summary
        if: always()
        run: |
          DRAFT_JA="${{ steps.period.outputs.draft_ja }}"
          SKIP="${{ steps.skip_check.outputs.skip }}"
          HAS_LOG="${{ steps.gitlog.outputs.has_log }}"
          echo "## Blog Draft Generation $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ドラフトパス | \`$DRAFT_JA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| スキップ | $SKIP |" >> $GITHUB_STEP_SUMMARY
          echo "| git log あり | $HAS_LOG |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ 投稿は毎日 21:00 JST の blog-publish.yml スケジュール実行が自動処理します。" >> $GITHUB_STEP_SUMMARY
