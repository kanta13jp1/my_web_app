name: Testcontainers Integration Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/testcontainers-integration.yml"
      - "scripts/testcontainers_supabase_smoke.py"
      - "test/fixtures/testcontainers/**"
      - "test/scripts/test_testcontainers_supabase_smoke.py"
      - "docs/testing/testcontainers_supabase_smoke.md"
      - "supabase/functions/**"
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: testcontainers-integration-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  smoke:
    permissions:
      contents: read
    name: DB + Edge smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Deno
        shell: bash
        env:
          DENO_VERSION: v2.9.1
        run: bash scripts/ci/install_deno_from_github.sh

      - name: Show Docker version
        run: docker version

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "testcontainers[postgres]>=4.8,<5" "psycopg[binary]>=3.2,<4"

      - name: Unit-test smoke helpers
        run: python test/scripts/test_testcontainers_supabase_smoke.py

      - name: Print smoke plan
        run: python scripts/testcontainers_supabase_smoke.py --plan

      - name: Run Testcontainers smoke
        run: python scripts/testcontainers_supabase_smoke.py --artifacts-dir .testcontainers-logs

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testcontainers-smoke-logs
          path: .testcontainers-logs/
          if-no-files-found: ignore
          include-hidden-files: true
