name: Migration Time-Relative CHECK Detector

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_migration_time_relative_check.py'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: migration-time-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Detect time-relative CHECK violations (PS#5 S78 regression guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set base SHA for PR mode
        if: github.event_name == 'pull_request'
        run: echo "GITHUB_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV

      - name: Detect time-relative drift risk
        run: python3 scripts/check_migration_time_relative_check.py
