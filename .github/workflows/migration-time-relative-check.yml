name: Migration Time-Relative CHECK Detector

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_migration_time_relative_check.py'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions: {}

concurrency:
  group: migration-time-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    permissions:
      contents: read
    name: Detect time-relative CHECK violations (PS#5 S78 regression guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set base SHA (PR = base commit / push = before SHA)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "GITHUB_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
          else
            echo "GITHUB_BASE_SHA=${{ github.event.before }}" >> $GITHUB_ENV
          fi

      - name: Detect time-relative drift risk
        run: python3 scripts/check_migration_time_relative_check.py
