name: Voice Governance Regression
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Check and test synthetic voice governance
        run: |
          deno check supabase/functions/ai-hub/voice_ai.ts
          deno test --allow-env supabase/functions/ai-hub/voice_ai_test.ts
