name: GitHub Issues WBS Sync

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue list \
            --repo "$REPO" \
            --state all \
            --limit 1000 \
            --json number,title,url,state,labels,author,createdAt,updatedAt \
            > /tmp/issues.json

      - name: Close duplicate GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY' > /tmp/duplicate-issues.tsv
          import json
          import re
          from collections import defaultdict

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)

          groups = defaultdict(list)
          for issue in issues:
              if str(issue.get("state", "")).upper() != "OPEN":
                  continue
              title = re.sub(r"^\s*\[Issue #\d+\]\s*", "", issue.get("title", ""))
              key = re.sub(r"\s+", " ", title).strip().lower()
              if key:
                  groups[key].append(issue)

          for items in groups.values():
              if len(items) < 2:
                  continue
              items.sort(key=lambda item: int(item["number"]))
              keep = items[0]
              for duplicate in items[1:]:
                  print(f"{duplicate['number']}\t{keep['number']}\t{duplicate['title']}")
          PY

          while IFS=$'\t' read -r duplicate keep title; do
            [ -n "$duplicate" ] || continue
            gh issue close "$duplicate" \
              --repo "$REPO" \
              --comment "Duplicate issue. Keeping #$keep as the canonical task; scheduled WBS sync closed this duplicate." \
              || true
          done < /tmp/duplicate-issues.tsv

      - name: Refetch GitHub issues after dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue list \
            --repo "$REPO" \
            --state all \
            --limit 1000 \
            --json number,title,url,state,labels,author,createdAt,updatedAt \
            > /tmp/issues.json

      - name: Sync issues to WBS
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured"
            exit 1
          fi

          python3 <<'PY' > /tmp/wbs-sync-response.json
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)

          repo = os.environ["REPO"]
          endpoint = f"{os.environ['SUPABASE_URL']}/functions/v1/tools-hub"
          service_role_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          chunk_size = int(os.environ.get("WBS_SYNC_CHUNK_SIZE", "75"))
          combined = {
              "success": True,
              "repo": repo,
              "issue_count": len(issues),
              "created": 0,
              "updated": 0,
              "completed_from_closed_issues": 0,
              "duplicate_wbs_closed": 0,
              "skipped": 0,
              "issues_to_close": [],
              "duplicate_wbs_tasks": [],
              "chunks": [],
          }

          for index in range(0, len(issues), chunk_size):
              chunk = issues[index:index + chunk_size]
              payload = json.dumps({
                  "action": "wbs.sync_github_issues",
                  "repo": repo,
                  "issues": chunk,
              }, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {service_role_key}",
                      "apikey": service_role_key,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=140) as resp:
                      response_text = resp.read().decode("utf-8")
                      response = json.loads(response_text)
              except urllib.error.HTTPError as exc:
                  response_text = exc.read().decode("utf-8", errors="replace")
                  combined["success"] = False
                  combined["chunks"].append({
                      "offset": index,
                      "count": len(chunk),
                      "http_code": exc.code,
                      "error": response_text[:500],
                  })
                  print(
                      f"::warning::wbs.sync_github_issues chunk offset={index} "
                      f"returned HTTP {exc.code}: {response_text[:500]}",
                      file=sys.stderr,
                  )
                  continue

              for key in [
                  "created",
                  "updated",
                  "completed_from_closed_issues",
                  "duplicate_wbs_closed",
                  "skipped",
              ]:
                  combined[key] += int(response.get(key, 0) or 0)
              combined["issues_to_close"].extend(response.get("issues_to_close", []) or [])
              combined["duplicate_wbs_tasks"].extend(response.get("duplicate_wbs_tasks", []) or [])
              combined["chunks"].append({
                  "offset": index,
                  "count": len(chunk),
                  "success": bool(response.get("success")),
              })

          print(json.dumps(combined, ensure_ascii=False))
          if not combined["success"]:
              sys.exit(1)
          PY

          cat /tmp/wbs-sync-response.json

      - name: Close GitHub issues completed in WBS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Safety guard: only auto-close bot-created issues or issues labeled wbs-auto-close.
          # User-created feature requests (追加要望/enhancement/feature) must never be auto-closed.
          python3 <<'PY' > /tmp/issues-to-close.tsv
          import json

          with open("/tmp/wbs-sync-response.json", encoding="utf-8") as fh:
              response = json.load(fh)

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)

          issue_map = {str(i.get("number", "")): i for i in issues}

          # Labels that block auto-close (user-created content)
          BLOCK_LABELS = {"追加要望", "enhancement", "feature", "feature-request"}
          # Labels that allow auto-close even for non-bot issues
          ALLOW_LABELS = {"wbs-auto-close"}
          # Authors whose issues can be auto-closed
          ALLOW_AUTHORS = {"github-actions[bot]", "github-actions"}

          seen = set()
          for item in response.get("issues_to_close", []):
              number = str(item.get("number", "")).strip()
              if not number or number in seen:
                  continue
              issue = issue_map.get(number, {})
              labels = {lbl.get("name", "") if isinstance(lbl, dict) else str(lbl)
                        for lbl in issue.get("labels", [])}
              author = issue.get("author", {})
              author_login = author.get("login", "") if isinstance(author, dict) else ""

              # Allow if explicitly opted-in
              if labels & ALLOW_LABELS:
                  pass
              # Allow if bot-created (CI failure issues etc.)
              elif author_login in ALLOW_AUTHORS:
                  pass
              # Block if user feature request
              elif labels & BLOCK_LABELS:
                  print(f"# SKIP #{number}: blocked by labels {labels & BLOCK_LABELS}", flush=True)
                  continue
              else:
                  # Unknown: skip to be safe (require explicit opt-in)
                  print(f"# SKIP #{number}: no allow-label, author={author_login!r}", flush=True)
                  continue

              seen.add(number)
              task_id = str(item.get("task_id", "")).strip()
              reason = str(item.get("reason", "")).replace("\t", " ").strip()
              print(f"{number}\t{task_id}\t{reason}")
          PY

          grep -v '^#' /tmp/issues-to-close.tsv | while IFS=$'\t' read -r number task_id reason; do
            [ -n "$number" ] || continue
            gh issue close "$number" \
              --repo "$REPO" \
              --comment "WBS task $task_id is completed, so scheduled WBS sync closed this issue. Reason: $reason" \
              || true
          done

      - name: Sync Notion WBS mirror
        run: |
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/schedule-hub" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"action":"notion.sync_wbs","limit":100,"offset":0}' \
            || true
