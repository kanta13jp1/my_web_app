name: GitHub Issues WBS Sync

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "25 */6 * * *"  # 6h safety net; issue events handle real-time sync (2026-07-03 ci-audit: 4h→6h, 690min/月削減)
  workflow_dispatch:
    inputs:
      recent_only:
        description: "Sync only recently updated GitHub issues"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: wbs-sync
  cancel-in-progress: true

permissions: {}

env:
  SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  sync:
    environment:
      name: wbs-automation-production
      deployment: false
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install REST issue fetcher
        run: |
          cat > /tmp/fetch-github-issues.py <<'PY'
          import json
          import os
          import sys
          import time
          from datetime import datetime, timedelta, timezone
          import urllib.error
          import urllib.parse
          import urllib.request

          output_path = sys.argv[1]
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          base_url = f"https://api.github.com/repos/{repo}/issues"
          fields = {
              "state": "all",
              "per_page": "100",
              "sort": "updated",
              "direction": "desc",
          }
          recent_only = os.environ.get("WBS_SYNC_RECENT_ONLY", "false").strip().lower() in {
              "1",
              "true",
              "yes",
              "on",
          }
          recent_hours = max(1, int(os.environ.get("WBS_SYNC_RECENT_HOURS", "12")))
          max_recent_pages = max(1, int(os.environ.get("WBS_SYNC_RECENT_MAX_PAGES", "5")))
          if recent_only:
              since = (
                  datetime.now(timezone.utc) - timedelta(hours=recent_hours)
              ).isoformat(timespec="seconds").replace("+00:00", "Z")
              fields["since"] = since
              print(
                  f"Recent-only GitHub issue fetch enabled: since={since}, "
                  f"max_pages={max_recent_pages}",
                  flush=True,
              )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "my-web-app-wbs-sync",
          }

          def fetch_page(page):
              query = urllib.parse.urlencode({**fields, "page": str(page)})
              request = urllib.request.Request(f"{base_url}?{query}", headers=headers)
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {502, 503, 504} or attempt == 3:
                          raise
                      print(
                          f"::warning::GitHub REST issues page {page} returned HTTP {exc.code}; retrying",
                          flush=True,
                      )
                  except urllib.error.URLError as exc:
                      if attempt == 3:
                          raise
                      print(
                          f"::warning::GitHub REST issues page {page} failed: {exc}; retrying",
                          flush=True,
                      )
                  time.sleep(2 * attempt)

          issues = []
          page = 1
          while True:
              items = fetch_page(page)
              issue_items = [item for item in items if "pull_request" not in item]
              for item in issue_items:
                  issues.append(
                      {
                          "number": item["number"],
                          "title": item.get("title") or "",
                          "url": item.get("html_url") or item.get("url") or "",
                          "state": str(item.get("state") or "").upper(),
                          "labels": [{"name": label.get("name", "")} for label in item.get("labels", [])],
                          "author": {"login": (item.get("user") or {}).get("login", "")},
                          "createdAt": item.get("created_at") or "",
                          "updatedAt": item.get("updated_at") or "",
                      }
                  )
              print(
                  f"Fetched GitHub issues page {page}: {len(issue_items)} issues "
                  f"({len(items) - len(issue_items)} PRs skipped)",
                  flush=True,
              )
              if len(items) < 100:
                  break
              if recent_only and page >= max_recent_pages:
                  print(
                      f"::warning::Recent-only GitHub issue fetch stopped at "
                      f"page {page}; increase WBS_SYNC_RECENT_MAX_PAGES if needed",
                      flush=True,
                  )
                  break
              page += 1

          with open(output_path, "w", encoding="utf-8") as fh:
              json.dump(issues, fh, ensure_ascii=False)
          print(f"Wrote {len(issues)} GitHub issues to {output_path}")
          PY

      - name: Fetch GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WBS_SYNC_RECENT_ONLY: ${{ github.event_name == 'issues' || github.event.inputs.recent_only == 'true' }}
          WBS_SYNC_RECENT_HOURS: "12"
          WBS_SYNC_RECENT_MAX_PAGES: "5"
        run: |
          python3 /tmp/fetch-github-issues.py /tmp/issues.json

          python3 - <<'PY'
          import json

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)
          print(f"Fetched {len(issues)} GitHub issues for WBS sync")
          PY

      - name: Close duplicate GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY' > /tmp/duplicate-issues.tsv
          import json
          import re
          from collections import defaultdict

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)

          groups = defaultdict(list)
          by_number = defaultdict(list)
          for issue in issues:
              number = issue.get("number")
              if type(number) is not int or number <= 0:
                  continue
              by_number[number].append(issue)

          for copies in by_number.values():
              # Pagination can repeat records. Conflicting snapshots are unsafe
              # to close automatically, so leave that Issue untouched.
              signatures = {(item.get("state"), item.get("title")) for item in copies}
              if len(signatures) != 1:
                  continue
              issue = copies[0]
              if str(issue.get("state", "")).upper() != "OPEN":
                  continue
              title = re.sub(r"^\s*\[Issue #\d+\]\s*", "", issue.get("title", ""))
              key = re.sub(r"\s+", " ", title).strip().lower()
              if key:
                  groups[key].append(issue)

          for items in groups.values():
              if len(items) < 2:
                  continue
              items.sort(key=lambda item: int(item["number"]))
              keep = items[0]
              for duplicate in items[1:]:
                  if duplicate["number"] == keep["number"]:
                      continue
                  print(f"{duplicate['number']}\t{keep['number']}\t{duplicate['title']}")
          PY

          while IFS=$'\t' read -r duplicate keep title; do
            [ -n "$duplicate" ] || continue
            [[ "$duplicate" =~ ^[1-9][0-9]*$ && "$keep" =~ ^[1-9][0-9]*$ ]] || continue
            [ "$duplicate" != "$keep" ] || continue
            gh issue close "$duplicate" \
              --repo "$REPO" \
              --comment "Duplicate issue. Keeping #$keep as the canonical task; scheduled WBS sync closed this duplicate." \
              || true
          done < /tmp/duplicate-issues.tsv

      - name: Refetch GitHub issues after dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WBS_SYNC_RECENT_ONLY: ${{ github.event_name == 'issues' || github.event.inputs.recent_only == 'true' }}
          WBS_SYNC_RECENT_HOURS: "12"
          WBS_SYNC_RECENT_MAX_PAGES: "5"
        run: |
          python3 /tmp/fetch-github-issues.py /tmp/issues.json

          python3 - <<'PY'
          import json

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)
          print(f"Refetched {len(issues)} GitHub issues after dedupe")
          PY

      - name: Sync issues to WBS
        env:
          REPO: ${{ github.repository }}
          WBS_SYNC_BATCH_SIZE: "50"
          WBS_SYNC_CURL_MAX_TIME: "120"
          WBS_SYNC_GLOBAL_REPAIRS: "false"
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured"
            exit 1
          fi

          python3 <<'PY' > /tmp/wbs-sync-batches.txt
          import json
          import os

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)

          batch_size = max(1, int(os.environ.get("WBS_SYNC_BATCH_SIZE", "200")))
          global_repairs = os.environ.get("WBS_SYNC_GLOBAL_REPAIRS", "false").strip().lower() in {
              "1",
              "true",
              "yes",
              "on",
          }
          for index in range(0, len(issues), batch_size):
              batch = issues[index:index + batch_size]
              payload = {
                  "action": "wbs.sync_github_issues",
                  "repo": os.environ["REPO"],
                  "issues": batch,
                  "global_repairs": global_repairs,
              }
              path = f"/tmp/wbs-sync-payload-{index // batch_size:03d}.json"
              with open(path, "w", encoding="utf-8") as out:
                  json.dump(payload, out, ensure_ascii=False)
              print(path)
          PY

          : > /tmp/wbs-sync-responses.jsonl
          : > /tmp/wbs-sync-failures.tsv
          total_batches=$(wc -l < /tmp/wbs-sync-batches.txt | tr -d ' ')
          batch_number=0
          while IFS= read -r payload_path; do
            [ -n "$payload_path" ] || continue
            batch_number=$((batch_number + 1))
            echo "Syncing WBS batch ${batch_number}/${total_batches}: ${payload_path}"
            attempt=1
            while true; do
              set +e
              HTTP_CODE=$(curl -sS -o /tmp/wbs-sync-batch-response.json -w "%{http_code}" \
                -X POST "$SUPABASE_URL/functions/v1/tools-hub" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                --connect-timeout 10 \
                --max-time "$WBS_SYNC_CURL_MAX_TIME" \
                --data-binary @"$payload_path")
              CURL_EXIT=$?
              set -e
              if [ "$CURL_EXIT" -ne 0 ]; then
                HTTP_CODE=599
                printf '{"success":false,"error":"curl exited with %s"}\n' "$CURL_EXIT" > /tmp/wbs-sync-batch-response.json
              fi

              if [ "$HTTP_CODE" -lt 500 ] || [ "$attempt" -ge 2 ]; then
                break
              fi
              echo "::warning::tools-hub wbs.sync_github_issues batch ${batch_number}/${total_batches} returned HTTP $HTTP_CODE on attempt $attempt; retrying"
              cat /tmp/wbs-sync-batch-response.json || true
              echo ""
              sleep 5
              attempt=$((attempt + 1))
            done

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::warning::tools-hub wbs.sync_github_issues batch ${batch_number}/${total_batches} returned HTTP $HTTP_CODE"
              printf "%s\t%s\n" "$batch_number" "$HTTP_CODE" >> /tmp/wbs-sync-failures.tsv
              cat /tmp/wbs-sync-batch-response.json || true
              echo ""
              continue
            fi
            cat /tmp/wbs-sync-batch-response.json
            echo ""
            cat /tmp/wbs-sync-batch-response.json >> /tmp/wbs-sync-responses.jsonl
            echo "" >> /tmp/wbs-sync-responses.jsonl
          done < /tmp/wbs-sync-batches.txt

          python3 - \
            --responses /tmp/wbs-sync-responses.jsonl \
            --failures /tmp/wbs-sync-failures.tsv \
            --output /tmp/wbs-sync-response.json \
            <<'AGGREGATE_PY'
          import argparse, json
          from pathlib import Path
          SUM_FIELDS = ("issue_count","created","updated","completed_from_closed_issues","duplicate_wbs_closed","stale_wbs_repaired","wbs_task_scan_count","skipped")
          LIST_FIELDS = ("issues_to_close","duplicate_wbs_tasks","repaired_wbs_tasks")
          def as_int(v): return 0 if v is None or v == "" else int(v)
          def item_key(i): return json.dumps(i,ensure_ascii=False,sort_keys=True,separators=(",",":"))
          def extend_unique(t,seen,items):
              if not isinstance(items,list): return
              for item in items:
                  k=item_key(item)
                  if k in seen: continue
                  t.append(item); seen.add(k)
          def iter_lines(p):
              if not Path(p).exists(): return []
              return [json.loads(l) for l in Path(p).read_text(encoding="utf-8").splitlines() if l.strip()]
          def read_failures(p):
              if not Path(p).exists(): return []
              return [{"batch":int(l.split("\t",1)[0]),"http_code":l.split("\t",1)[1]} for l in Path(p).read_text(encoding="utf-8").splitlines() if l.strip()]
          def aggregate(responses,failures=None):
              agg={"success":True,"issues_to_close":[],"duplicate_wbs_tasks":[],"repaired_wbs_tasks":[],"batch_failures":[]}
              for f in SUM_FIELDS: agg[f]=0
              seen={f:set() for f in LIST_FIELDS}
              for r in responses:
                  agg["success"]=agg["success"] and bool(r.get("success",False))
                  for f in SUM_FIELDS: agg[f]+=as_int(r.get(f))
                  for f in LIST_FIELDS: extend_unique(agg[f],seen[f],r.get(f))
              if failures: agg["success"]=False; agg["batch_failures"].extend(failures)
              return agg
          p=argparse.ArgumentParser(); p.add_argument("--responses"); p.add_argument("--failures"); p.add_argument("--output")
          a=p.parse_args()
          out=json.dumps(aggregate(iter_lines(a.responses),read_failures(a.failures)),ensure_ascii=False)
          if a.output: Path(a.output).write_text(out+"\n",encoding="utf-8")
          else: print(out)
          AGGREGATE_PY

          cat /tmp/wbs-sync-response.json

          python3 <<'PY'
          import json
          import sys

          with open("/tmp/wbs-sync-response.json", encoding="utf-8") as fh:
              response = json.load(fh)

          if not response.get("success", False):
              print(f"::error::WBS sync finished with failed batches: {response.get('batch_failures', [])}")
              sys.exit(1)
          PY

      - name: Close GitHub issues completed in WBS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Safety guard: only auto-close bot-created issues or issues labeled wbs-auto-close.
          # User-created feature requests (追加要望/enhancement/feature) must never be auto-closed.
          python3 <<'PY' > /tmp/issues-to-close.tsv
          import json

          with open("/tmp/wbs-sync-response.json", encoding="utf-8") as fh:
              response = json.load(fh)

          with open("/tmp/issues.json", encoding="utf-8") as fh:
              issues = json.load(fh)

          issue_map = {str(i.get("number", "")): i for i in issues}

          # Labels that block auto-close (user-created content)
          BLOCK_LABELS = {"追加要望", "enhancement", "feature", "feature-request"}
          # Labels that allow auto-close even for non-bot issues
          ALLOW_LABELS = {"wbs-auto-close"}
          # Authors whose issues can be auto-closed
          ALLOW_AUTHORS = {"github-actions[bot]", "github-actions"}

          seen = set()
          for item in response.get("issues_to_close", []):
              number = str(item.get("number", "")).strip()
              if not number or number in seen:
                  continue
              issue = issue_map.get(number, {})
              labels = {lbl.get("name", "") if isinstance(lbl, dict) else str(lbl)
                        for lbl in issue.get("labels", [])}
              author = issue.get("author", {})
              author_login = author.get("login", "") if isinstance(author, dict) else ""

              # Allow if explicitly opted-in
              if labels & ALLOW_LABELS:
                  pass
              # Allow if bot-created (CI failure issues etc.)
              elif author_login in ALLOW_AUTHORS:
                  pass
              # Block if user feature request
              elif labels & BLOCK_LABELS:
                  print(f"# SKIP #{number}: blocked by labels {labels & BLOCK_LABELS}", flush=True)
                  continue
              else:
                  # Unknown: skip to be safe (require explicit opt-in)
                  print(f"# SKIP #{number}: no allow-label, author={author_login!r}", flush=True)
                  continue

              seen.add(number)
              task_id = str(item.get("task_id", "")).strip()
              reason = str(item.get("reason", "")).replace("\t", " ").strip()
              print(f"{number}\t{task_id}\t{reason}")
          PY

          grep -v '^#' /tmp/issues-to-close.tsv | while IFS=$'\t' read -r number task_id reason; do
            [ -n "$number" ] || continue
            gh issue close "$number" \
              --repo "$REPO" \
              --comment "WBS task $task_id is completed, so scheduled WBS sync closed this issue. Reason: $reason" \
              || true
          done

      - name: Sync Notion WBS mirror
        run: |
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/schedule-hub" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d '{"action":"notion.sync_wbs","limit":100,"offset":0}' \
            || true
