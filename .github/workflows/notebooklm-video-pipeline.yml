name: NotebookLM Video Pipeline

# Win版#132 part 29 (2026-04-26) — Master Brain Task 3
# NotebookLM URL → 8-step automated video pipeline → YouTube upload + philosophy_page.dart embed
#
# 使い方:
#   gh workflow run notebooklm-video-pipeline.yml \
#     -f notebook_id=579bd686 \
#     -f artifact_id=3ce9cab3 \
#     -f title="動画タイトル" \
#     -f series_number=2
#
# 8-step (memory feedback_success_20260418_video_editing_workflow.md 完全踏襲):
#   1. notebooklm download video
#   2. ElevenLabs Scribe transcribe
#   3. videos/build_srt.py で SRT 分割 (句読点+18字+4秒+28字 cap)
#   4. videos/make_cards.py で intro/outro PNG 生成 (PIL + Noto Sans JP)
#   5. ffmpeg で intro/outro mp4 (1280x720@24 / silent / 3-4s)
#   6. ffmpeg concat+grade+afade → no_subs → cd+subs (2-step)
#   7. scripts/upload_youtube.py upload --privacy unlisted
#   8. lib/pages/philosophy_page.dart _videos に追加 + commit

on:
  workflow_dispatch:
    inputs:
      notebook_id:
        description: NotebookLM notebook ID prefix (8 chars OK)
        required: true
        type: string
      artifact_id:
        description: Video artifact ID prefix (8 chars OK)
        required: true
        type: string
      title:
        description: Video title for YouTube + intro card
        required: true
        type: string
      series_number:
        description: AI大学 series number (e.g. 2 for #2)
        required: true
        type: number
      asr_corrections_json:
        description: 'Optional ASR corrections (JSON dict of {wrong: correct})'
        required: false
        default: '{}'
        type: string
      slug:
        description: 'Output filename slug (e.g. gemini-organizing-tips)'
        required: true
        type: string
      generate_shorts_package:
        description: 'Also build 9:16 Shorts package metadata after transcription'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: notebooklm-video-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTEBOOKLM_STORAGE_STATE: ${{ secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      HAS_GITHUB_PAT: ${{ secrets.GITHUB_PAT != '' }}
      HAS_NOTEBOOKLM_STORAGE_STATE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_STATE_JSON != '' }}
      HAS_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY != '' }}
      HAS_YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON != '' }}
      HAS_YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON != '' }}
      PIPELINE_NOTEBOOK_ID: ${{ inputs.notebook_id }}
      PIPELINE_ARTIFACT_ID: ${{ inputs.artifact_id }}
      PIPELINE_TITLE: ${{ inputs.title }}
      PIPELINE_SERIES_NUMBER: ${{ inputs.series_number }}
      PIPELINE_SLUG: ${{ inputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_PAT || github.token }}
          fetch-depth: 100  # Step 0 dedup needs ≥1h of history (default depth=1 hides past bot commits)

      - name: Check required video pipeline secrets
        run: |
          mkdir -p tmp/video-pipeline-secret-readiness
          python scripts/check_video_pipeline_secret_readiness.py \
            --require-secrets \
            --report tmp/video-pipeline-secret-readiness/report.json

      - name: Upload video pipeline secret readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: video-pipeline-secret-readiness-report
          path: tmp/video-pipeline-secret-readiness/report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ffmpeg + Noto Sans JP
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          mkdir -p videos

      - name: Install Python deps
        run: |
          pip install pillow notebooklm-py google-api-python-client \
            google-auth-oauthlib google-auth-httplib2 requests

      - name: Restore NotebookLM auth
        run: |
          mkdir -p ~/.notebooklm
          echo "$NOTEBOOKLM_STORAGE_STATE" > ~/.notebooklm/storage_state.json
          chmod 600 ~/.notebooklm/storage_state.json

      - name: Restore YouTube auth
        run: |
          mkdir -p ~/.youtube
          echo "$YOUTUBE_CLIENT_SECRET" > ~/.youtube/client_secret.json
          echo "$YOUTUBE_TOKEN" > ~/.youtube/token.json
          chmod 600 ~/.youtube/*.json

      - name: Step 0 — Pre-flight (YouTube quota + slug dedup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          # ───────── (a) YouTube quota pre-flight ─────────
          # Quota: 10000 units/day, 1 upload = 1600 units → max 6 uploads / rolling 24h.
          LIMIT_PER_DAY=6
          DAY_AGO_ISO=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          # gh CLI returns ISO8601 timestamps; jq compares strings lexically (correct for ISO).
          count=$(gh run list \
            --workflow=notebooklm-video-pipeline.yml \
            --status=success \
            --limit 20 \
            --json createdAt 2>/dev/null \
            | jq --arg cutoff "$DAY_AGO_ISO" '[.[] | select(.createdAt >= $cutoff)] | length' \
            || echo 0)

          echo "successful_runs_last_24h=$count"
          echo "youtube_quota_estimate=$((count * 1600))/10000 units"

          if [ "$count" -ge "$LIMIT_PER_DAY" ]; then
            echo "::error::YouTube quota cap reached ($count/$LIMIT_PER_DAY uploads in last 24h). Aborting before download/upload."
            exit 1
          fi
          if [ "$count" -ge $((LIMIT_PER_DAY - 1)) ]; then
            echo "::warning::Approaching YouTube quota cap ($count/$LIMIT_PER_DAY). This will be the last upload of the day."
          fi

          # ───────── (b) Slug dedup window (1h) ─────────
          # Step 8 commits include "TITLE=<inputs.title>" in the body. If the same
          # title was pushed in the last hour, refuse to re-run — the bot would just
          # hit Step 8's dup-guard later anyway, but this aborts before quota burn.
          DEDUP_WINDOW_HOURS=1
          dup_sha=$(git log --since="${DEDUP_WINDOW_HOURS} hour ago" \
            --fixed-strings --grep="TITLE=$INPUT_TITLE" \
            --author='notebooklm-video-pipeline\[bot\]' \
            --all --format=%H -1 2>/dev/null || true)

          if [ -n "$dup_sha" ]; then
            echo "::error::Duplicate dispatch — title \"$INPUT_TITLE\" already pushed within last ${DEDUP_WINDOW_HOURS}h (commit $dup_sha). Aborting."
            exit 1
          fi
          echo "dedup_check=ok (no matching bot commit in last ${DEDUP_WINDOW_HOURS}h)"

      - name: Step 1 — Download video from NotebookLM
        run: |
          notebooklm use "$PIPELINE_NOTEBOOK_ID"
          notebooklm download video -a "$PIPELINE_ARTIFACT_ID" \
            "videos/$PIPELINE_SLUG.mp4"
          ls -lh "videos/$PIPELINE_SLUG.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 \
            "videos/$PIPELINE_SLUG.mp4" | tee /tmp/duration.txt

      - name: Step 2 — Transcribe via ElevenLabs Scribe
        run: |
          python scripts/video/transcribe.py \
            "videos/$PIPELINE_SLUG.mp4"

      - name: Step 3 — Build SRT (custom splitter)
        env:
          ASR_CORRECTIONS: ${{ inputs.asr_corrections_json }}
        run: |
          python scripts/video/build_srt.py \
            "videos/edit/transcripts/$PIPELINE_SLUG.json" \
            videos/master.srt

      - name: Step 3b - Build Shorts package manifest (optional)
        if: ${{ inputs.generate_shorts_package }}
        run: |
          python scripts/video/build_shorts_package.py \
            "videos/edit/transcripts/$PIPELINE_SLUG.json" \
            --source-video "videos/$PIPELINE_SLUG.mp4" \
            --source-url "notebooklm://$PIPELINE_NOTEBOOK_ID/$PIPELINE_ARTIFACT_ID" \
            --title "$PIPELINE_TITLE" \
            --output-dir videos/shorts \
            --count 3

      - name: Step 4 — Generate intro/outro cards
        env:
          CARD_TITLE: ${{ inputs.title }}
          CARD_SERIES: '#${{ inputs.series_number }}'
        run: |
          python scripts/video/make_cards.py --output-dir videos
          ls -lh videos/intro.png videos/outro.png

      - name: Step 5 — Encode intro/outro mp4 (1280x720@24)
        run: |
          for asset in intro outro; do
            duration=$([ "$asset" = "intro" ] && echo 3 || echo 4)
            ffmpeg -y -loop 1 -i videos/${asset}.png \
              -f lavfi -i anullsrc=r=44100:cl=stereo -t ${duration} \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=0x0F111E" \
              -r 24 -pix_fmt yuv420p -c:v libx264 -preset fast -crf 22 \
              -c:a aac -b:a 128k -ar 44100 -shortest \
              videos/${asset}.mp4
          done

      - name: Step 6a — Concat + grade + afade (no subs)
        run: |
          MAIN_DUR=$(cat /tmp/duration.txt)
          FADE_OUT=$(python -c "print(round(${MAIN_DUR} - 0.05, 2))")
          ffmpeg -y \
            -i videos/intro.mp4 \
            -i "videos/$PIPELINE_SLUG.mp4" \
            -i videos/outro.mp4 \
            -filter_complex "[1:a]aresample=44100,afade=t=in:st=0:d=0.05,afade=t=out:st=${FADE_OUT}:d=0.05[a1];[0:v:0][0:a:0][1:v:0][a1][2:v:0][2:a:0]concat=n=3:v=1:a=1[v][a];[v]eq=saturation=1.15:contrast=1.05:gamma=0.95[vout]" \
            -map "[vout]" -map "[a]" -c:v libx264 -preset fast -crf 22 \
            -c:a aac -b:a 128k -ar 44100 \
            videos/output_D_no_subs.mp4

      - name: Step 6b — Burn subtitles (cd to videos for relative path)
        run: |
          cd videos
          ffmpeg -y -i output_D_no_subs.mp4 \
            -vf "subtitles=master.srt:force_style='FontName=Noto Sans CJK JP,FontSize=18,Outline=2,Shadow=1,Alignment=2,MarginV=40'" \
            -c:v libx264 -preset fast -crf 22 -c:a copy output_D.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output_D.mp4

      - name: Step 6c — Add provenance (watermark + metadata) [AI_VIDEO #5]
        run: |
          # AI_VIDEO_PRINCIPLES.md 原則 #5 Ethical Provenance & Transparency
          # 可視ウォーターマーク + メタデータ (title/comment/creation_time/artist) を埋め込み.
          # source SHA-256 は master.srt (= 字幕として焼き込まれた発話内容) のハッシュ.
          python scripts/video/add_provenance.py \
            --input videos/output_D.mp4 \
            --output videos/output_D_provenanced.mp4 \
            --title "$PIPELINE_TITLE" \
            --series-number "$PIPELINE_SERIES_NUMBER" \
            --source-file videos/master.srt \
            --model "NotebookLM Deep Research + Claude Code Win版"

      - name: Step 7 — Upload to YouTube (unlisted)
        id: upload
        run: |
          OUT=$(python scripts/upload_youtube.py upload \
            --file videos/output_D_provenanced.mp4 \
            --title "$PIPELINE_TITLE — 自分株式会社 AI大学解説 #$PIPELINE_SERIES_NUMBER" \
            --description "NotebookLM Deep Research + 自分株式会社 AI大学 編集スタジオで生成。詳細は https://my-web-app-b67f4.web.app/ai-university" \
            --privacy unlisted)
          echo "$OUT"
          VIDEO_ID=$(echo "$OUT" | grep -oE 'https://youtu.be/[A-Za-z0-9_-]+' | head -1 | sed 's|.*/||')
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          # Round duration up to whole second, format M:SS for embed step.
          DUR_SEC=$(printf '%.0f' "$(cat /tmp/duration.txt)")
          DUR_FMT=$(printf '%d:%02d' $((DUR_SEC / 60)) $((DUR_SEC % 60)))
          echo "duration=$DUR_FMT" >> $GITHUB_OUTPUT

      - name: Step 8 — Embed in philosophy_page.dart + commit
        env:
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          VIDEO_DURATION: ${{ steps.upload.outputs.duration }}
        run: |
          if [ -z "$VIDEO_ID" ]; then
            echo "::error::Step 7 produced empty video_id — aborting embed"
            exit 1
          fi

          LABEL="番外: $PIPELINE_TITLE (D variant)"
          DESCRIPTION="NotebookLM Deep Research + intro/outro + カラーグレード + 字幕焼き込み。AI大学シリーズ #$PIPELINE_SERIES_NUMBER。"

          python scripts/embed_video_in_philosophy.py \
            --video-id "$VIDEO_ID" \
            --label "$LABEL" \
            --duration "$VIDEO_DURATION" \
            --description "$DESCRIPTION"

          git config user.name 'notebooklm-video-pipeline[bot]'
          git config user.email 'notebooklm-video-pipeline[bot]@users.noreply.github.com'
          git add lib/pages/philosophy_page.dart
          git commit \
            -m "feat(philosophy): embed video #$PIPELINE_SERIES_NUMBER (NotebookLM auto pipeline)" \
            -m "VIDEO_ID=$VIDEO_ID  DURATION=$VIDEO_DURATION  TITLE=$PIPELINE_TITLE"
          git push origin HEAD:main

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          VIDEO_DURATION: ${{ steps.upload.outputs.duration }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set — skipping Slack notify"
            exit 0
          fi
          jq -n \
            --arg title "$PIPELINE_TITLE" \
            --arg series "$PIPELINE_SERIES_NUMBER" \
            --arg duration "$VIDEO_DURATION" \
            --arg video_id "$VIDEO_ID" \
            --arg run_url "$RUN_URL" \
            '{
              text: ("🎬 NotebookLM video pipeline complete: " + $title),
              blocks: [
                {type: "header", text: {type: "plain_text", text: ("🎬 動画パイプライン完了 #" + $series), emoji: true}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: ("*Title:*\n" + $title)},
                  {type: "mrkdwn", text: ("*Duration:*\n" + $duration)},
                  {type: "mrkdwn", text: ("*Video:*\nhttps://youtu.be/" + $video_id)},
                  {type: "mrkdwn", text: ("*Series:*\n#" + $series)}
                ]},
                {type: "context", elements: [
                  {type: "mrkdwn", text: ("🤖 Auto-pipeline run: <" + $run_url + "|view logs>  /  Step 8 embedded into philosophy_page.dart on main")}
                ]}
              ]
            }' > payload.json
          curl -X POST -H 'Content-type: application/json' --data @payload.json "$SLACK_WEBHOOK_URL" --max-time 10 || true

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set — skipping Slack notify"
            exit 0
          fi
          jq -n \
            --arg title "$PIPELINE_TITLE" \
            --arg series "$PIPELINE_SERIES_NUMBER" \
            --arg slug "$PIPELINE_SLUG" \
            --arg notebook_id "$PIPELINE_NOTEBOOK_ID" \
            --arg artifact_id "$PIPELINE_ARTIFACT_ID" \
            --arg run_url "$RUN_URL" \
            '{
              text: ("❌ NotebookLM video pipeline FAILED: " + $title),
              blocks: [
                {type: "header", text: {type: "plain_text", text: ("❌ 動画パイプライン失敗 #" + $series), emoji: true}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: ("*Title:*\n" + $title)},
                  {type: "mrkdwn", text: ("*Slug:*\n" + $slug)},
                  {type: "mrkdwn", text: ("*Notebook:*\n" + $notebook_id)},
                  {type: "mrkdwn", text: ("*Artifact:*\n" + $artifact_id)}
                ]},
                {type: "actions", elements: [
                  {type: "button", text: {type: "plain_text", text: "View failed run"}, url: $run_url, style: "danger"}
                ]}
              ]
            }' > payload.json
          curl -X POST -H 'Content-type: application/json' --data @payload.json "$SLACK_WEBHOOK_URL" --max-time 10 || true

# 残スコープ (Win版#132 part 38+ / cross-instance-pr 検討):
# - workflow E2E smoke test (実 dispatch / video #1 重複 ID で Step 8 dup-guard 発火確認)
#   ※ scripts/video の単体は part 37 で video-pipeline-test.yml に分離済
#
# 完了済 (Win版#132 part 30):
# - Step 8 自動 embed → scripts/embed_video_in_philosophy.py (regex insert + dup-guard)
#
# 完了済 (Win版#132 part 31):
# - Step 2 transcribe.py vendor → scripts/video/transcribe.py (ElevenLabs Scribe / requests dep 追加)
#
# 完了済 (Win版#132 part 32):
# - Step 3 build_srt.py 新規 → scripts/video/build_srt.py
#   (Scribe JSON → SRT / 句読点+18字+4秒+28字 cap / ASR_CORRECTIONS env / unit test 6 cue)
#
# 完了済 (Win版#132 part 33):
# - Step 4 make_cards.py 新規 → scripts/video/make_cards.py
#   (PIL + Noto Sans CJK JP / 1280x720 PNG / Orange+Indigo dark theme / CARD_TITLE+CARD_SERIES env
#   / 自動 wrap / fonts-noto-cjk apt 自動検出 / Windows local NotoSansJP-VF.ttf fallback)
#
# 完了済 (Win版#132 part 34):
# - Slack 通知 (success / failure 2 step / SLACK_WEBHOOK_URL env / fail も continue + warn for missing secret)
#   成功時: video URL + duration + run URL を blocks payload で post
#   失敗時: title + slug + notebook + artifact + 失敗 run へのアクションボタン
#
# 完了済 (Win版#132 part 35):
# - Step 0 YouTube quota pre-flight (gh run list で 24h 以内の successful run を集計)
#   6/day cap 到達で download 前に exit 1 / 5/day で warning
#   Supabase 不要・GITHUB_TOKEN のみ・jq + bash date 24h ago lexical compare
#
# 完了済 (Win版#132 part 36):
# - Step 0 (b) slug dedup window (1h)
#   git log --grep="TITLE=$INPUT_TITLE" --author=bot --since="1 hour ago" で
#   直近 1h の bot commit を検索 → match で abort (Step 8 で dup-guard 発火させる前に止める)
#   Checkout fetch-depth=100 に変更 (default=1 では history が無くて grep がスキップされる)
#
# 完了済 (Win版#132 part 37):
# - scripts/video smoke test (build_srt + make_cards + embed_video の単体検証 / synthetic fixture)
#   .github/workflows/video-pipeline-test.yml で PR / push 時自動走行
#   scripts/video/_smoke_test.py 単体ファイル / pytest 不要 / PIL+ffmpeg 以外の依存ゼロ
