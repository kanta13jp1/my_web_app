name: Asset AI browser integration

on:
  pull_request:
    paths:
      - lib/pages/asset_management_page.dart
      - lib/models/asset_calendar_reflection.dart
      - lib/widgets/asset_calendar_reflection_panel.dart
      - lib/services/asset_calendar_reflection_repository.dart
      - lib/services/asset_calendar_reflection_import_parser.dart
      - lib/services/asset_management_ai_*.dart
      - lib/services/asset_management_insight_service.dart
      - test/widgets/asset_management_ai_current_input_test.dart
      - test/widgets/asset_triage_withdrawal_test.dart
      - integration_test/asset_triage_withdrawal_test.dart
      - integration_test/asset_triage_withdrawal_scenarios.dart
      - lib/services/asset_triage_guide_service.dart
      - integration_test/asset_management_ai_current_input_test.dart
      - integration_test/asset_ai_current_input_scenarios.dart
      - test_driver/asset_ai_integration.dart
      - integration_test/asset_dining_synthetic_integration_test.dart
      - test/fixtures/dining_page_stub.py
      - test/fixtures/test_dining_page_stub.py
      - test/fixtures/run_dining_integration.sh
      - test_driver/asset_triage_visual.dart
      - .github/workflows/asset-ai-browser-integration.yml

permissions: {}

concurrency:
  group: asset-ai-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve test dependencies
        run: flutter pub get
      - name: Run triage withdrawal VM regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          flutter test test/widgets/asset_triage_withdrawal_test.dart --reporter expanded 2>&1 | tee .ci-logs/asset-ai-triage-vm.log
      - name: Verify runner browser tools
        run: |
          google-chrome --version
          chromedriver --version
      - name: Run synthetic page flows in Chrome
        shell: bash
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/asset-ai-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          set -o pipefail
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_management_ai_current_input_test.dart \
            -d web-server --browser-name=chrome --headless \
            2>&1 | tee .ci-logs/asset-ai-browser.log
      - name: Run triage withdrawal flows in Chrome
        shell: bash
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/asset-ai-triage-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          set -o pipefail
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then
              dimensions=390x851@2.75
              mobile=true
            fi
            flutter drive --verbose \
              --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/asset_triage_withdrawal_test.dart \
              --dart-define="TRIAGE_MOBILE=$mobile" \
              --browser-dimension="$dimensions" \
              -d web-server --browser-name=chrome --headless \
              2>&1 | tee ".ci-logs/asset-ai-triage-$viewport-browser.log"
          done
      - name: Inspect borrowing selection history and calendar without saving
        shell: bash
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/asset-ai-borrowing-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          set -o pipefail
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then
              dimensions=390x851@2.75
              mobile=true
            fi
            flutter drive --verbose \
              --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/asset_borrowing_unsaved_test.dart \
              --dart-define="TRIAGE_MOBILE=$mobile" \
              --browser-dimension="$dimensions" \
              -d web-server --browser-name=chrome --headless \
              2>&1 | tee ".ci-logs/asset-ai-borrowing-$viewport-browser.log"
          done
      - name: Check synthetic dining fixture
        run: python3 -B -m unittest discover -s test/fixtures -p 'test_dining_page_stub.py' -v
      - name: Prepare offline web resources
        run: flutter precache --web
      - name: Inspect synthetic dining candidate without saving
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "${1}" -- env -i PATH="${2}" HOME="${3}" CI=true TZ=UTC bash test/fixtures/run_dining_integration.sh
          ' _ "$(id -un)" "$PATH" "$HOME"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-ai-browser-${{ github.run_id }}
          path: |
            .ci-logs/asset-ai-*.log
            .ci-logs/asset-triage-visual/**
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
