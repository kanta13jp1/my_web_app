name: Sea Shelter prototype checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['test/e2e/sea_shelter_arena_host.spec.ts', 'scripts/build_sea_shelter_arena.mjs', 'package.json', 'package-lock.json', 'test/e2e/sea_shelter_arena.spec.ts', 'test/e2e/sea_shelter_arena_component.spec.ts', 'web/labs/sea-shelter/**', 'test/e2e/sea_shelter.spec.ts', 'test/e2e/sea_shelter_farm.spec.ts', 'test/e2e/sea_shelter_viewport.spec.ts', 'test/e2e/sea_shelter_storage.spec.ts', 'test/fixtures/sea_shelter_v2269/**', '.github/workflows/sea-shelter-checks.yml', 'lib/pages/sea_shelter_page.dart', 'lib/ui/features/sea_shelter/**', 'test/e2e/sea_shelter_route.spec.ts', 'lib/data/home_tool_catalog.dart', 'lib/main.dart', 'test/widgets/sea_shelter_page_test.dart', 'test/fixtures/sea_shelter_lifecycle_app.dart', 'test/e2e/sea_shelter_lifecycle.spec.ts']
permissions: {}
concurrency:
  group: sea-shelter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test web/labs/sea-shelter/model.test.mjs web/labs/sea-shelter/farm.test.mjs web/labs/sea-shelter/storage.test.mjs web/labs/sea-shelter/arena/model.test.mjs
      - run: node --check web/labs/sea-shelter/app.mjs
      - run: npm ci --ignore-scripts
      - run: node scripts/build_sea_shelter_arena.mjs
      - run: node --test scripts/sea_shelter_arena_build.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser checks against candidate only
        shell: bash
        run: |
          python3 web/labs/sea-shelter/serve.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/labs/sea-shelter/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:8765 npx playwright test test/e2e/sea_shelter.spec.ts test/e2e/sea_shelter_farm.spec.ts test/e2e/sea_shelter_viewport.spec.ts test/e2e/sea_shelter_storage.spec.ts test/e2e/sea_shelter_residents.spec.ts test/e2e/sea_shelter_residents_component.spec.ts test/e2e/sea_shelter_arena.spec.ts test/e2e/sea_shelter_arena_component.spec.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sea-shelter-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7


  integrated:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/pages/sea_shelter_page.dart lib/ui/features/sea_shelter test/widgets/sea_shelter_page_test.dart test/fixtures/sea_shelter_lifecycle_app.dart
          flutter analyze lib/pages/sea_shelter_page.dart lib/ui/features/sea_shelter
          flutter test test/widgets/sea_shelter_page_test.dart
          flutter build web --release --pwa-strategy=none --dart-define=ENVIRONMENT=visual-test --dart-define=SUPABASE_URL=http://127.0.0.1:54321 --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - uses: ./.github/actions/prepare-sea-shelter-arena
        with:
          web-root: build/web
      - name: Validate browser test syntax
        run: npx playwright test test/e2e/sea_shelter_route.spec.ts test/e2e/sea_shelter_lifecycle.spec.ts test/e2e/sea_shelter_arena_host.spec.ts --list
      - name: Integrated desktop and mobile route checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/flutter_spa_server.py --directory build/web --port 7357 > sea-shelter-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7357/sea-shelter > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7357 npx playwright test test/e2e/sea_shelter_route.spec.ts --workers=1 --retries=0
      - name: Build real surface lifecycle fixture
        run: flutter build web --release --pwa-strategy=none --target=test/fixtures/sea_shelter_lifecycle_app.dart --output=build/sea-shelter-lifecycle
      - uses: ./.github/actions/prepare-sea-shelter-arena
        with:
          web-root: build/sea-shelter-lifecycle
      - name: Verify covering route, return and disposal
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/flutter_spa_server.py --directory build/sea-shelter-lifecycle --port 7358 > sea-shelter-lifecycle-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 PLAYWRIGHT_TEST_OUTPUT_DIR=lifecycle-results PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-report/lifecycle-results.json npx playwright test test/e2e/sea_shelter_lifecycle.spec.ts test/e2e/sea_shelter_arena_host.spec.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sea-shelter-integrated-evidence
          path: |
            test-results/
            playwright-report/
            sea-shelter-server.log
            sea-shelter-lifecycle-server.log
            lifecycle-results/
          retention-days: 7
