name: Skill JSON Check

on:
  pull_request:
    paths:
      - 'web/labs/skill-json-check/**'
      - 'test/skill_json_check/**'
      - 'test/e2e/skill_json_check.spec.ts'
      - 'playwright.skill-json-check.config.ts'
      - '.github/workflows/skill-json-check.yml'
  workflow_dispatch:
    inputs:
      production:
        description: Verify the deployed production tool
        type: boolean
        default: false

permissions: {}

concurrency:
  group: skill-json-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: node --test test/skill_json_check/model.test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify desktop and mobile interaction
        env:
          E2E_BASE_URL: ${{ inputs.production && 'https://my-web-app-b67f4.web.app' || '' }}
        run: npx playwright test --config=playwright.skill-json-check.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: skill-json-check-evidence
          path: |
            skill-json-check-report/
            test-results/
          retention-days: 7
