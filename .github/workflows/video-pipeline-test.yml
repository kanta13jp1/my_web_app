name: Private Workflow Lesson Render
on:
  workflow_dispatch:
permissions: {}
jobs:
  render:
    if: github.ref == 'refs/heads/codex/private-workflow-lesson-20260927-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.84.2
      - name: Cloud dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet Pillow==11.3.0
      - name: Private inputs and hash checks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
        run: |
          mkdir -p /tmp/private-media-job
          cd /tmp/private-media-job
          supabase init
          supabase link --project-ref "$PROJECT_REF"
          for name in input.wav narration.txt render.py; do
            supabase storage cp ss:///attachments/private-video-pipeline/workflow-lesson-20260927-v1/$name $name --linked --experimental
          done
          echo 'ca5a9665dcd0e572e86e63301191ac37b93201184bd2c8f8558a4f7c66016bed  render.py' | sha256sum --check
          echo '599fdc2138d2835950b37a92cf0976dd49eba8106a306f179cfe10f125063111  input.wav' | sha256sum --check
          echo '7082ffe6234f1d5cdc52e70f0e3ef528453233f6a136573a5a453bb63cf4f799  narration.txt' | sha256sum --check
      - name: Render and validate
        run: |
          cd /tmp/private-media-job
          python render.py > private.log 2>&1 || { echo 'Render failed; private diagnostic log retained.'; exit 1; }
      - name: Preserve private outputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd /tmp/private-media-job
          for name in render.zip render/manifest.json render/contact-sheet.jpg; do
            supabase storage cp $name ss:///attachments/private-video-pipeline/workflow-lesson-20260927-v1/$(basename $name) --linked --experimental --cache-control no-store
          done
      - name: Private diagnostic preservation
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd /tmp/private-media-job
          if test -f private.log; then
            supabase storage cp private.log ss:///attachments/private-video-pipeline/workflow-lesson-20260927-v1/log-${{ github.run_id }}.txt --linked --experimental --cache-control no-store
          fi