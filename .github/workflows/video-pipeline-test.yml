name: Private Subagents Lesson Render
on:
  workflow_dispatch:
permissions: {}
jobs:
  render:
    if: github.ref == 'refs/heads/codex/private-subagents-lesson-20261001-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.84.2
      - name: Cloud dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet Pillow==11.3.0
      - name: Private inputs and hash checks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
        run: |
          mkdir -p /tmp/private-media-job
          cd /tmp/private-media-job
          supabase init
          supabase link --project-ref "$PROJECT_REF"
          for name in input.wav narration.txt render.py; do
            supabase storage cp ss:///attachments/private-video-pipeline/subagents-lesson-20261001-v1/$name $name --linked --experimental
          done
          echo 'eb671a9c30d73228d0c69e4ec5685554ac0736e9cce74a4417bbb02c3a9e7eea  render.py' | sha256sum --check
          echo '10a1ec0ea7f0ec52fafcaec1555f288758f94581de598b87daac8672bc65d786  input.wav' | sha256sum --check
          echo 'f44bb1abaa4a0f515c6fc002ea418e44135a05a27b65268059e915a2cff09550  narration.txt' | sha256sum --check
      - name: Render and validate
        run: |
          cd /tmp/private-media-job
          python render.py > private.log 2>&1 || { echo 'Render failed; private diagnostic log retained.'; exit 1; }
      - name: Preserve private outputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd /tmp/private-media-job
          for name in render.zip render/manifest.json render/contact-sheet.jpg; do
            supabase storage cp $name ss:///attachments/private-video-pipeline/subagents-lesson-20261001-v1/$(basename $name) --linked --experimental --cache-control no-store
          done
      - name: Private diagnostic preservation
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd /tmp/private-media-job
          if test -f private.log; then
            supabase storage cp private.log ss:///attachments/private-video-pipeline/subagents-lesson-20261001-v1/log-${{ github.run_id }}.txt --linked --experimental --cache-control no-store
          fi