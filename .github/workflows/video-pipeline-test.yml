name: Video Pipeline Smoke Test

# Win版#132 part 37 — exercises scripts/video/build_srt.py +
# scripts/video/make_cards.py + scripts/embed_video_in_philosophy.py
# end-to-end without burning YouTube quota.
#
# Runs on PRs that touch the video-pipeline source so a regression there
# is caught before the heavyweight notebooklm-video-pipeline.yml is
# dispatched manually.

on:
  pull_request:
    paths:
      - 'scripts/video/**'
      - 'scripts/check_video_pipeline_secret_readiness.py'
      - 'scripts/embed_video_in_philosophy.py'
      - '.github/workflows/notebooklm-video-pipeline.yml'
      - '.github/workflows/video-pipeline-secret-readiness.yml'
      - '.github/workflows/video-pipeline-test.yml'
      - 'test/scripts/test_video_pipeline_secret_readiness.py'
  push:
    branches:
      - staging
      - develop
    paths:
      - 'scripts/video/**'
      - 'scripts/check_video_pipeline_secret_readiness.py'
      - 'scripts/embed_video_in_philosophy.py'
      - '.github/workflows/notebooklm-video-pipeline.yml'
      - '.github/workflows/video-pipeline-secret-readiness.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: video-pipeline-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch'
    name: scripts/video smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install fonts-noto-cjk + pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow

      - name: Run scripts/video smoke tests
        env:
          PYTHONUTF8: '1'
        run: python scripts/video/_smoke_test.py

      - name: Run video pipeline secret readiness tests
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s test/scripts -p "test_video_pipeline_secret_readiness.py"

  private-render:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/private-video-installing-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.84.2
      - name: Install cloud rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet Pillow==11.3.0
      - name: Fetch approved private inputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
        run: |
          mkdir -p /tmp/private-media-job
          cd /tmp/private-media-job
          supabase init
          supabase link --project-ref "$PROJECT_REF"
          supabase storage cp ss:///attachments/private-video-pipeline/installing-20260906-v1/input.m4a input.m4a --linked --experimental
          supabase storage cp ss:///attachments/private-video-pipeline/installing-20260921-v1/render_lesson.py render_lesson.py --linked --experimental
          supabase storage cp ss:///attachments/private-video-pipeline/installing-20260921-v1/narration.txt narration.txt --linked --experimental
          echo 'e535e020e075584c45ac7f2d1445efbb83cbda393eade514030f95458d61f64c  render_lesson.py' | sha256sum --check
          echo '1bfbdec0a37a6c3a6e339a498ae2e6a2f46c9d7b04b0ab2c474a4171530a6a8f  narration.txt' | sha256sum --check
      - name: Render and validate without publishing media
        run: |
          cd /tmp/private-media-job
          python render_lesson.py > render-runtime.log 2>&1 || { echo 'Private render failed; details kept in private log.'; exit 1; }
      - name: Preserve all results in private storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd /tmp/private-media-job
          supabase storage cp render-v1.zip ss:///attachments/private-video-pipeline/installing-20260921-v1/render-v1.zip --linked --experimental --content-type application/zip --cache-control no-store
          supabase storage cp render-v1/manifest.json ss:///attachments/private-video-pipeline/installing-20260921-v1/manifest.json --linked --experimental --content-type application/json --cache-control no-store
          echo 'Private render preserved. No public artifacts or YouTube operations.'
      - name: Preserve private diagnostic log
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd /tmp/private-media-job
          if test -f render-runtime.log; then
            supabase storage cp render-runtime.log ss:///attachments/private-video-pipeline/installing-20260921-v1/render-runtime-${{ github.run_id }}.log --linked --experimental --content-type text/plain --cache-control no-store
          fi
