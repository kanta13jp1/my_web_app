name: Roadmap Append-only Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/GROWTH_STRATEGY_ROADMAP.md"
      - "scripts/check_roadmap_append_only.py"
      - "test/scripts/test_check_roadmap_append_only.py"
      - ".github/workflows/roadmap-append-only-guard.yml"
  push:
    branches:
      - main
    paths:
      - "docs/GROWTH_STRATEGY_ROADMAP.md"
      - "scripts/check_roadmap_append_only.py"
      - "test/scripts/test_check_roadmap_append_only.py"
      - ".github/workflows/roadmap-append-only-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-append-only-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check ROADMAP destructive rewrite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve comparison refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${GITHUB_SHA}"
            if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
              base="${head}^"
            fi
          fi
          git fetch --no-tags origin "$base" "$head" || true
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Run guard
        run: |
          python scripts/check_roadmap_append_only.py \
            --base-ref "${{ steps.refs.outputs.base }}" \
            --head-ref "${{ steps.refs.outputs.head }}"

      - name: Run unit tests
        run: python -m unittest discover -s test/scripts -p "test_check_roadmap_append_only.py"
