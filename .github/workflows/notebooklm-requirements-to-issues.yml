name: NotebookLM Requirements to Issues

on:
  schedule:
    - cron: "15 22 * * *" # daily 07:15 JST
  workflow_dispatch:
    inputs:
      start_index:
        description: "1-based notebook list index to start from"
        required: false
        default: "1"
        type: string
      limit:
        description: "Max notebooks to process; 0 means all"
        required: false
        default: "0"
        type: string
      create_issues:
        description: "Create GitHub Issues instead of report-only dry run"
        required: false
        default: true
        type: boolean
      max_created_issues:
        description: "Safety cap for new Issues in this run; 0 means no cap"
        required: false
        default: "9"
        type: string
      requirements_per_notebook:
        description: "Additional request count to extract from each NotebookLM notebook"
        required: false
        default: "3"
        type: string

permissions: {}

concurrency:
  group: notebooklm-requirements-to-issues
  cancel-in-progress: false

jobs:
  extract-and-issue:
    permissions:
      contents: write
      issues: write
    name: Extract NotebookLM requirements and open Issues
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GH_TOKEN: ${{ secrets.BYPASS_RULES || github.token }}
      NOTEBOOKLM_STORAGE_STATE: ${{ secrets.NOTEBOOKLM_STORAGE_STATE_JSON }}
      HAS_NOTEBOOKLM_STORAGE_STATE: ${{ secrets.NOTEBOOKLM_STORAGE_STATE_JSON != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 20
          token: ${{ secrets.BYPASS_RULES || github.token }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Select weekly pip cache key
        id: pip_cache_period
        shell: bash
        run: echo "period=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache pip (notebooklm-py)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-notebooklm-py-${{ steps.pip_cache_period.outputs.period }}
          restore-keys: |
            ${{ runner.os }}-pip-notebooklm-py-

      - name: Restore NotebookLM auth
        id: restore_auth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.notebooklm
          if [ -z "${NOTEBOOKLM_STORAGE_STATE}" ]; then
            echo "auth_ready=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::NOTEBOOKLM_STORAGE_STATE_JSON secret is missing; skipping NotebookLM extraction and updating #2967."
            {
              echo "## NotebookLM auth not ready"
              echo ""
              echo "\`NOTEBOOKLM_STORAGE_STATE_JSON\` is missing or empty."
              echo "Extraction was skipped, and Issue #2967 will be updated with the recovery action."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          printf '%s' "${NOTEBOOKLM_STORAGE_STATE}" > ~/.notebooklm/storage_state.json
          chmod 600 ~/.notebooklm/storage_state.json
          echo "auth_ready=true" >> "${GITHUB_OUTPUT}"

      - name: Install NotebookLM CLI
        if: steps.restore_auth.outputs.auth_ready == 'true'
        run: pip install --quiet notebooklm-py

      - name: Capture NotebookLM list
        id: capture_notebooklm_list
        if: steps.restore_auth.outputs.auth_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/notebooklm-requirements
          tmp_list="$(mktemp)"
          if notebooklm list --json > "${tmp_list}"; then
            mv "${tmp_list}" docs/notebooklm-requirements/notebooklm-list.json
            echo "list_ready=true" >> "${GITHUB_OUTPUT}"
          else
            status="$?"
            rm -f "${tmp_list}"
            echo "list_ready=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::notebooklm list failed with exit status ${status}; treating this as an auth refresh blocker and updating #2967."
            {
              echo "## NotebookLM list unavailable"
              echo ""
              echo "The stored NotebookLM auth could not list notebooks."
              echo "Extraction was skipped, and Issue #2967 will be updated with the recovery action."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

      - name: Extract requirements and create Issues
        if: steps.restore_auth.outputs.auth_ready == 'true' && steps.capture_notebooklm_list.outputs.list_ready == 'true'
        shell: bash
        env:
          START_INDEX_INPUT: ${{ inputs.start_index || '1' }}
          LIMIT_INPUT: ${{ inputs.limit || '0' }}
          MAX_CREATED_ISSUES_INPUT: ${{ inputs.max_created_issues || '9' }}
          REQUIREMENTS_PER_NOTEBOOK_INPUT: ${{ inputs.requirements_per_notebook || '3' }}
          CREATE_ISSUES_INPUT: ${{ inputs.create_issues }}
        run: |
          set -euo pipefail
          CREATE_ISSUES="true"
          START_INDEX="$START_INDEX_INPUT"
          LIMIT="$LIMIT_INPUT"
          MAX_CREATED_ISSUES="$MAX_CREATED_ISSUES_INPUT"
          REQUIREMENTS_PER_NOTEBOOK="$REQUIREMENTS_PER_NOTEBOOK_INPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CREATE_ISSUES="$CREATE_ISSUES_INPUT"
          fi
          CREATE_ARGS=()
          if [ "${CREATE_ISSUES}" = "true" ]; then
            CREATE_ARGS+=(--create-issues)
          fi
          PYTHONUTF8=1 python scripts/notebooklm_requirements_to_issues.py \
            --input-json docs/notebooklm-requirements/notebooklm-list.json \
            --repo "${{ github.repository }}" \
            --start-index "${START_INDEX}" \
            --limit "${LIMIT}" \
            --requirements-per-notebook "${REQUIREMENTS_PER_NOTEBOOK}" \
            --max-created-issues "${MAX_CREATED_ISSUES}" \
            --sleep-seconds 0.2 \
            "${CREATE_ARGS[@]}"

      - name: Commit requirement report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/notebooklm-requirements; then
            echo "No NotebookLM requirement report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/notebooklm-requirements
          git commit -m "chore: update NotebookLM requirement issue report"
          git push

      - name: Upload requirement reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notebooklm-requirements-report
          path: docs/notebooklm-requirements
          if-no-files-found: ignore

      - name: Notify auth or extraction failure
        if: failure() || steps.restore_auth.outputs.auth_ready == 'false' || steps.capture_notebooklm_list.outputs.list_ready == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONUTF8=1 python scripts/notebooklm_requirements_failure_notice.py \
            --repo "${{ github.repository }}" \
            --issue 2967 \
            --workflow "NotebookLM Requirements to Issues" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event "${{ github.event_name }}" \
            --head-sha "${{ github.sha }}" \
            --secret-present "${HAS_NOTEBOOKLM_STORAGE_STATE}"
