name: Supabase Secrets Validation

on:
  pull_request:
    paths:
      - 'supabase/required_secrets.json'
      - 'scripts/validate_supabase_secrets.py'
      - 'test/scripts/test_validate_supabase_secrets.py'
      - '.github/workflows/supabase-secrets-validation.yml'
      - 'supabase/functions/**'
  schedule:
    # 毎日 12:23 JST (03:23 UTC) に Supabase Secrets 不足検知を定期実行
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      require_secrets:
        type: boolean
        description: 'Fail workflow if required Supabase keys are missing'
        required: true
        default: false
      dry_run:
        description: 'Dry run without sending external webhook alerts (true/false)'
        required: false
        default: 'true'

permissions: {}

concurrency:
  group: supabase-secrets-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-supabase-secrets:
    name: Validate Supabase Edge Function Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run Supabase secrets validator unit tests
        run: python3 -B test/scripts/test_validate_supabase_secrets.py -v

      - name: Run Supabase secrets validator self-test
        run: python3 -B scripts/validate_supabase_secrets.py --self-test

      - name: Check required Supabase secrets and Edge Function manifest
        id: secrets_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_SECRETS_INPUT: ${{ github.event.inputs.require_secrets || 'false' }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'true' }}
          ALERT_WEBHOOK_URL: ${{ secrets.SUPABASE_SECRETS_WEBHOOK_URL || vars.SUPABASE_SECRETS_WEBHOOK_URL || '' }}
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' || vars.SUPABASE_URL != '' }}
          HAS_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' || vars.SUPABASE_ANON_KEY != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY_CONFIGURED || 'false' }}
          HAS_SERVICE_ROLE_KEY: ${{ vars.SERVICE_ROLE_KEY_CONFIGURED || 'false' }}
          HAS_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY != '' }}
          HAS_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET != '' }}
          HAS_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY != '' }}
          HAS_NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY != '' }}
          HAS_DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY != '' }}
          HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY_CONFIGURED || 'false' }}
          HAS_NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY != '' }}
          HAS_ANTHROPIC_API_KEY: ${{ vars.ANTHROPIC_API_KEY_CONFIGURED || 'false' }}
          HAS_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN != '' }}
          HAS_LIQUID_API_KEY: ${{ secrets.LIQUID_API_KEY != '' }}
          HAS_COZE_API_KEY: ${{ secrets.COZE_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REQUIRE_SECRETS_INPUT}" = "true" ] && [ "${DRY_RUN_INPUT}" = "false" ] && [ -n "${ALERT_WEBHOOK_URL}" ]; then
            python3 -B scripts/validate_supabase_secrets.py \
              --require-secrets \
              --live \
              --webhook-url "${ALERT_WEBHOOK_URL}" \
              --json-out "supabase_secrets_report.json" \
              --markdown-out "supabase_secrets_report.md" \
              --github-output "${GITHUB_OUTPUT}"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REQUIRE_SECRETS_INPUT}" = "true" ]; then
            python3 -B scripts/validate_supabase_secrets.py \
              --require-secrets \
              --dry-run \
              --json-out "supabase_secrets_report.json" \
              --markdown-out "supabase_secrets_report.md" \
              --github-output "${GITHUB_OUTPUT}"
          else
            python3 -B scripts/validate_supabase_secrets.py \
              --dry-run \
              --json-out "supabase_secrets_report.json" \
              --markdown-out "supabase_secrets_report.md" \
              --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Upload Supabase secrets validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supabase-secrets-validation-report
          path: |
            supabase_secrets_report.json
            supabase_secrets_report.md
          retention-days: 14
          if-no-files-found: warn

      - name: Append workflow summary
        env:
          CHECK_STATUS: ${{ steps.secrets_check.outputs.status }}
          PRESENT_COUNT: ${{ steps.secrets_check.outputs.present_count }}
          TOTAL_KEYS: ${{ steps.secrets_check.outputs.total_manifest_items }}
          MISSING_REQ_COUNT: ${{ steps.secrets_check.outputs.missing_required_count }}
          MISSING_REC_COUNT: ${{ steps.secrets_check.outputs.missing_recommended_count }}
        run: |
          {
            echo "## Supabase Secrets Validation (#2669)"
            echo "- Status: \`${CHECK_STATUS}\`"
            echo "- Present Keys: \`${PRESENT_COUNT}/${TOTAL_KEYS}\`"
            echo "- Missing Required: \`${MISSING_REQ_COUNT}\`"
            echo "- Missing Recommended: \`${MISSING_REC_COUNT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
