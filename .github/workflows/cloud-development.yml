name: Synthetic owner atomic RPC (disposable Postgres only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated experiment commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: owner_sync_lab
          POSTGRES_PASSWORD: synthetic-only
        options: >-
          --health-cmd "pg_isready -U postgres -d owner_sync_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact experiment head and blobs
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:test/synthetic_owner_atomic/fixture.sql)" = "33c17a297d614f05fbe3c71b8fb2cb227be6153d"
          test "$(git rev-parse HEAD:test/synthetic_owner_atomic/sequential.sql)" = "34d015a436fc60a98aa8b62fb562ecf59d843af5"
          test "$(git rev-parse HEAD:test/synthetic_owner_atomic/concurrency.sh)" = "bb325a2cd8f901c7f5de044070432bdb5a1430cb"
          test "$(git rev-parse HEAD:test/synthetic_owner_atomic/mixed_snapshot.sh)" = "0e96eec53632fece358f5a20db1e957f96890be7"
      - name: Create disposable synthetic fixture
        id: fixture
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user, version();'
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 < test/synthetic_owner_atomic/fixture.sql
      - name: Sequential rollback and idempotency
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 < test/synthetic_owner_atomic/sequential.sql
      - name: Two connections same owner and revision
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        run: bash test/synthetic_owner_atomic/concurrency.sh
      - name: Separate reads may mix committed revisions
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        run: bash test/synthetic_owner_atomic/mixed_snapshot.sh
