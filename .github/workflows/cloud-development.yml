name: Owner IndexedDB CAS diagnostic (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Fixed diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify fixed fixture
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:test/synthetic/payment_owner_indexeddb_probe.cjs)" = "2d639197043daa122c483d7675dbf435d4f065da"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated synthetic two-tab IndexedDB diagnostic
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          google-chrome --version
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              timeout 90s node test/synthetic/payment_owner_indexeddb_probe.cjs
          ' _ "$(id -un)" "$PATH" "$HOME"
