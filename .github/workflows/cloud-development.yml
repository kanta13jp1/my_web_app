# DRAFT ONLY: unexecuted, synthetic fake only; not a release or IDB validation.
# Exactly ten named cases must complete, without skipped/error events.
name: Unknown gate 10-case synthetic diagnostic (draft)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IMAGE: docker.io/library/ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
    steps:
      - name: Initialize disposable paths in a step context
        shell: bash
        run: |
          set -euo pipefail
          printf 'PUB_CACHE=%s\n' "$RUNNER_TEMP/unknown-probe-pub" >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/unknown-probe-docker" >> "$GITHUB_ENV"
      - name: Checkout diagnostic inputs without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic-inputs
          persist-credentials: false
      - name: Stage only fixed synthetic Git blobs and relative import
        shell: bash
        run: |
          set -euo pipefail
          test ! -e base
          mkdir -p base/test/unknown_probe
          stage_blob() {
            local name="$1" expected="$2" target="base/test/unknown_probe/$1"
            git -C diagnostic-inputs show "HEAD:diagnostics/ordered_patch_work/$name" > "$target"
            echo "$expected  $target" | sha256sum -c -
          }
          stage_blob debt_idb_unknown_gate_DRAFT.dart 2072f55399c63cc7f276fbf17143f6370ae88707e21b2e708f0420cdc8e01cc3
          stage_blob debt_idb_unknown_gate_DRAFT_test.dart d3f6a453e10e797eab1f0bd06af215b145f68e6f2858ce481f2b3ddfd93df062
          cat > base/pubspec.yaml <<'PUBSPEC'
          name: synthetic_unknown_gate
          publish_to: none
          environment:
            sdk: '>=3.8.0 <4.0.0'
          dev_dependencies:
            flutter_test:
              sdk: flutter
          PUBSPEC
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('base/test/unknown_probe').resolve(strict=True)
          for file in root.glob('*.dart'):
              for name in re.findall(r"^import\s+['\"]([^'\"]+)['\"]", file.read_text(encoding='utf-8'), re.M):
                  if name.startswith(('dart:', 'package:')): continue
                  target = (file.parent / name).resolve(strict=True)
                  if target.parent != root or not target.is_file(): raise SystemExit('unsafe or missing relative import')
          PY
      - name: Provision pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.10'
          cache: false
      - name: Prepare public dependencies on disposable runner
        shell: bash
        working-directory: base
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
          test ! -e "$PUB_CACHE"
          mkdir -p "$PUB_CACHE" "$RUNNER_TEMP/unknown-probe-xdg"
          # Match the successful same-path workflow: do not redefine HOME.
          for args in '--version' 'precache --linux' 'pub get'; do
            env -i PATH="$PATH" FLUTTER_ROOT="$FLUTTER_ROOT" PUB_CACHE="$PUB_CACHE" \
              XDG_CACHE_HOME="$RUNNER_TEMP/unknown-probe-xdg" CI=true \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              flutter $args
          done
          # A fresh synthetic lock is evidence, not a pinned dependency guarantee.
          test -f pubspec.lock
          sha256sum pubspec.lock
          if git -C "$FLUTTER_ROOT" config --local --get-regexp '(^http\..*\.extraheader$|^credential\.|^url\..*\.insteadof$)' >/dev/null; then exit 1; fi
          if git -C "$FLUTTER_ROOT" config --local --get-regexp '^remote\..*\.url$' | grep -Eq 'https?://[^/]*@'; then exit 1; fi
          if find "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" -type s -print -quit | grep -q .; then
            echo 'Unexpected mounted socket'; exit 1
          fi
          # Reject special files and symlinks escaping each isolated mount.
          python3 - "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" <<'PY'
          import os, pathlib, stat, sys
          for raw in sys.argv[1:]:
              root = pathlib.Path(raw).resolve(strict=True)
              for directory, dirs, files in os.walk(root, followlinks=False):
                  for name in dirs + files:
                      path = pathlib.Path(directory) / name
                      mode = path.lstat().st_mode
                      if stat.S_ISSOCK(mode) or stat.S_ISFIFO(mode):
                          raise SystemExit('special file in isolated mount')
                      if path.is_symlink():
                          target = path.resolve(strict=True)
                          if target != root and root not in target.parents:
                              raise SystemExit('symlink escapes isolated mount')
                      if name.lower() in {'.netrc', '.npmrc', '.pypirc', 'credentials', 'id_rsa', 'id_ed25519'} or name.lower().startswith('.env'):
                          raise SystemExit('credential-like filename in isolated mount')
          PY
          # Flutter wants a freshness stamp; this does not assert latest version.
          printf '{"lastTimeVersionWasChecked":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$FLUTTER_ROOT/bin/cache/flutter_version_check.stamp"
          python3 - "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" <<'PY'
          import json, pathlib, sys, urllib.parse
          roots = [pathlib.Path(x) for x in sys.argv[1:]]
          if any(not r.is_absolute() or r.resolve() != r for r in roots):
              raise SystemExit('Non-canonical mount root')
          cfg = roots[0] / '.dart_tool/package_config.json'
          for p in json.loads(cfg.read_text(encoding='utf-8'))['packages']:
              u = urllib.parse.urlparse(urllib.parse.urljoin(cfg.as_uri(), p['rootUri']))
              if u.scheme != 'file' or u.netloc not in ('', 'localhost'):
                  raise SystemExit('Unexpected package URI')
              path = pathlib.Path(urllib.parse.unquote(u.path)).resolve()
              if not any(path == r or r in path.parents for r in roots):
                  raise SystemExit('Package outside isolated mounts')
          PY
      - name: Stage verified base image and minimal Git runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG/config.json"
          docker pull --platform=linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          docker image inspect "$IMAGE" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; assert any(x.endswith("@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc") for x in (d.get("RepoDigests") or []))'
          root="$GITHUB_WORKSPACE/base/.isolation-tools"
          mkdir -p "$root/bin/.git-runtime" "$root/lib"
          gitbin="$(command -v git)"
          cp -L "$gitbin" "$root/bin/.git-runtime/git"
          cat > "$root/bin/git" <<'WRAPPER'
          #!/bin/sh
          toolroot=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          export LD_LIBRARY_PATH="$toolroot/lib"
          exec "$toolroot/bin/.git-runtime/git" "$@"
          WRAPPER
          chmod 0755 "$root/bin/git"
          ldd "$gitbin" > "$RUNNER_TEMP/unknown-git-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/unknown-git-ldd.txt"; then exit 1; fi
          awk '/=> \/[^ ]+/ {print $3}' "$RUNNER_TEMP/unknown-git-ldd.txt" | while IFS= read -r lib; do
            test -f "$lib"
            case "$(basename "$lib")" in
              libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|librt.so.1|libresolv.so.2) continue;;
            esac
            cp -L "$lib" "$root/lib/$(basename "$lib")"
          done
      - name: Run all synthetic tests offline and preserve the failing exit
        shell: bash
        run: |
          set -euo pipefail
          host_netns="$(readlink /proc/self/ns/net)"
          user_id="$(id -u):$(id -g)"
          test "$(id -u)" -ne 0
          cid="$(docker create --pull=never --network=none --platform=linux/amd64 \
            --user "$user_id" --cap-drop=ALL --security-opt=no-new-privileges:true \
            --read-only --pids-limit=512 --memory=4g --tmpfs /tmp:rw,nosuid,nodev,size=1g --tmpfs /.dart-tool:rw,nosuid,nodev,size=64m,mode=1777 \
            --env XDG_CACHE_HOME=/tmp/cache --env XDG_CONFIG_HOME=/tmp/config --env PUB_CACHE="$PUB_CACHE" --env FLUTTER_ROOT="$FLUTTER_ROOT" \
            --env PATH="$GITHUB_WORKSPACE/base/.isolation-tools/bin:$FLUTTER_ROOT/bin:/usr/bin:/bin" \
            --env HOST_NETNS="$host_netns" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/base,dst=$GITHUB_WORKSPACE/base" \
            --mount "type=bind,src=$FLUTTER_ROOT,dst=$FLUTTER_ROOT" \
            --mount "type=bind,src=$PUB_CACHE,dst=$PUB_CACHE,readonly" \
            --workdir "$GITHUB_WORKSPACE/base" "$IMAGE" /bin/bash -ec '
              test "$(id -u)" -ne 0
              test "$(awk "/^NoNewPrivs:/ {print \$2}" /proc/self/status)" = 1
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = 0000000000000000
              test "$(readlink /proc/self/ns/net)" != "$HOST_NETNS"
              test "$(ls -1 /sys/class/net)" = lo
              awk "NR > 1 && \$1 != \"lo\" {exit 1}" /proc/net/route
              awk "\$NF != \"lo\" {exit 1}" /proc/net/ipv6_route
              test ! -e /var/run/docker.sock
              socket_path=$(find "$PWD" "$FLUTTER_ROOT" "$PUB_CACHE" -type s -print -quit)
              test -z "$socket_path"
              mkdir -p "$XDG_CACHE_HOME" probe-reports
              git --version
              "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" --version
              echo "2072f55399c63cc7f276fbf17143f6370ae88707e21b2e708f0420cdc8e01cc3  $PWD/test/unknown_probe/debt_idb_unknown_gate_DRAFT.dart" | sha256sum -c -
              echo "d3f6a453e10e797eab1f0bd06af215b145f68e6f2858ce481f2b3ddfd93df062  $PWD/test/unknown_probe/debt_idb_unknown_gate_DRAFT_test.dart" | sha256sum -c -
              timeout 360s "$FLUTTER_ROOT/bin/flutter" test --no-pub --reporter silent \
                --file-reporter="json:$PWD/probe-reports/results.jsonl" \
                test/unknown_probe/debt_idb_unknown_gate_DRAFT_test.dart \
                > probe-reports/stdout.txt 2> probe-reports/stderr.txt
            ')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" = none
          test "$(docker inspect --format '{{.HostConfig.Privileged}}' "$cid")" = false
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = true
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "$user_id"
          test "$(docker inspect --format '{{.HostConfig.PublishAllPorts}}' "$cid")" = false
          docker inspect "$cid" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; h=d["HostConfig"]; assert "ALL" in h["CapDrop"]; assert any("no-new-privileges" in x for x in h["SecurityOpt"]); assert not h.get("PortBindings"); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "bind"} == set(sys.argv[1:]); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "tmpfs"}.issubset({"/tmp", "/.dart-tool"}); assert all(m["Type"] in ("bind", "tmpfs") for m in d["Mounts"]); assert set((h.get("Tmpfs") or {}).keys()) == {"/tmp", "/.dart-tool"}' "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE"
          set +e
          docker start -a "$cid"
          rc=$?
          set -e
          printf 'Container exit status: %s\n' "$rc"
          oom="$(docker inspect --format '{{.State.OOMKilled}}' "$cid")"
          final_rc="$(docker inspect --format '{{.State.ExitCode}}' "$cid")"
          printf 'Container exit=%s oom=%s\n' "$final_rc" "$oom"
          if test "$oom" != false || test "$final_rc" != 0; then rc=1; fi
          if test -s "$GITHUB_WORKSPACE/base/probe-reports/stdout.txt"; then
            echo 'Synthetic test stdout (first 80 lines):'
            sed -n '1,80p' "$GITHUB_WORKSPACE/base/probe-reports/stdout.txt"
          fi
          if test -s "$GITHUB_WORKSPACE/base/probe-reports/stderr.txt"; then
            echo 'Test stderr (first 80 lines):'
            sed -n '1,80p' "$GITHUB_WORKSPACE/base/probe-reports/stderr.txt"
          fi
          # Print bounded synthetic errors without matching stack line syntax.
          set +e
          python3 - "$GITHUB_WORKSPACE/base/probe-reports/results.jsonl" <<'PY'
          import collections, json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              print('ENVIRONMENT/STARTUP FAILURE: no test report')
              raise SystemExit(1)
          tests, done, errors = {}, {}, collections.defaultdict(list)
          duplicate_events = []
          invalid_test_events = 0
          bad_lines = 0
          suite_done = []
          for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
              try: event = json.loads(line)
              except ValueError:
                  bad_lines += 1
                  continue
              if not isinstance(event, dict):
                  bad_lines += 1
                  continue
              if event.get('type') not in {'start', 'allSuites', 'suite', 'group', 'testStart', 'testDone', 'error', 'print', 'done', 'debug'}:
                  bad_lines += 1
                  continue
              if event.get('type') == 'testStart':
                  test = event.get('test')
                  if not isinstance(test, dict) or test.get('id') is None or not isinstance(test.get('name'), str):
                      invalid_test_events += 1
                      continue
                  if test['id'] in tests: duplicate_events.append(('start', test['id']))
                  tests[test['id']] = test['name']
              elif event.get('type') == 'testDone':
                  ident = event.get('testID')
                  if ident is None:
                      invalid_test_events += 1
                      continue
                  if ident in done: duplicate_events.append(('done', ident))
                  done[ident] = event
              elif event.get('type') == 'error': errors[event.get('testID')].append(event)
              elif event.get('type') == 'done': suite_done.append(event)
          def show(value, limit=900):
              text = str(value)
              return json.dumps(text[:limit], ensure_ascii=True) + (' [truncated]' if len(text) > limit else '')
          def detail(ident):
              print('  testID=', show(ident, 80), 'done=', show(done.get(ident), 500),
                    'errorEvents=', len(errors.get(ident, [])))
              for e in errors.get(ident, [])[:4]:
                  print('  error keys=', sorted(map(str, e.keys())), 'isFailure=', show(e.get('isFailure'), 30))
                  print('  error=', show(e.get('error', '<missing>')))
                  stack = str(e.get('stackTrace', '<missing>')).splitlines()
                  selected = stack[:5] + [line for line in stack[5:] if 'debt_idb_unknown_gate_DRAFT_test.dart' in line][:4]
                  for frame in selected: print('  frame=', show(frame, 350))
          failures = False
          if invalid_test_events:
              print('ENVIRONMENT: invalid test events:', invalid_test_events)
              failures = True
          if duplicate_events:
              print('ENVIRONMENT: duplicate test events:', show(duplicate_events, 500))
              failures = True
          if bad_lines:
              print('ENVIRONMENT: malformed/non-JSON lines:', bad_lines)
              failures = True
          if len(suite_done) != 1 or suite_done[0].get('success') is not True:
              print('ENVIRONMENT OR SUITE FAILURE: missing, duplicate or unsuccessful done event')
              failures = True
          manifest = ['commit response unknown blocks A through recreation until reconciliation', 'prepared response unknown survives recreation without retry', 'late prepare is fenced and absence without genesis proof stays blocked', 'ack response unknown is reconciled only after fenced exact observation', 'same ID with changed payload cannot reconcile or unblock', 'owner B cannot acknowledge A and can proceed in its own fresh scope', 'operation ID is not reusable after acknowledgement', 'late commit after new fake fence is rejected; prepared remains', 'failed new fence inspection cannot use earlier view to acknowledge', 'fresh proof on nonempty scope does not enable writes']
          actual_names = [name for ident, name in tests.items() if not name.startswith('loading ')]
          actual_counts = collections.Counter(actual_names)
          expected_counts = collections.Counter(manifest)
          print('Expected case count: 10; observed case count:', len(actual_names))
          for name, count in (expected_counts - actual_counts).items():
              print('MISSING CASE:', show(name, 250), 'count=', count)
              failures = True
          for name, count in (actual_counts - expected_counts).items():
              print('UNEXPECTED OR DUPLICATE CASE:', show(name, 250), 'count=', count)
              failures = True
          completed_cases = [name for ident, name in tests.items() if ident in done and not name.startswith('loading ')]
          print('Completed case count (expected 10, excluding load events):', len(completed_cases))
          if len(completed_cases) != 10:
              print('UNEXPECTED CASE COUNT: inspect missing or extra cases')
              failures = True
          for ident, name in tests.items():
              if ident not in done:
                  print('ENVIRONMENT/TIMEOUT/UNFINISHED:', show(name, 250))
                  failures = True
          for ident, event in done.items():
              name = tests.get(ident, '<unknown test>')
              if ident not in tests or event.get('result') != 'success' or event.get('skipped') is not False or errors.get(ident):
                  print('FAILURE/SKIP/UNKNOWN:', show(name, 250), show(event.get('result'), 50))
                  detail(ident)
                  failures = True
          for ident in errors:
              if ident not in tests:
                  print('ENVIRONMENT/LOAD ERROR: no matching test id:', show(ident, 80))
                  detail(ident)
                  failures = True
          if not done:
              print('ENVIRONMENT/LOAD FAILURE: no completed tests')
              failures = True
          if failures: raise SystemExit(1)
          PY
          report_rc=$?
          set -e
          # Preserve a failing test/container exit; even rc=0 fails when report
          # validation detects missing/skipped/failed cases or malformed events.
          if test "$rc" -ne 0; then exit "$rc"; fi
          exit "$report_rc"