# DRAFT: not registered, dispatched, validated or executed.
# Public synthetic source only. No browser, tests, database, deployment, or secrets.
name: IndexedDB synthetic static diagnostic (draft)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE: docker.io/library/ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
    steps:
      - name: Initialize isolated paths
        shell: bash
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/idb-static-docker" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/idb-static-pub" >> "$GITHUB_ENV"
      - name: Checkout immutable diagnostic inputs without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: inputs
          persist-credentials: false
      - name: Checkout public base without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          ref: 237d9290183c3bb3df73388ec9cf4563bb0186ef
          persist-credentials: false
      - name: Verify and stage exact synthetic sources
        shell: bash
        run: |
          set -euo pipefail
          d=inputs/diagnostics/ordered_patch_work
          echo '8464f9522f87acd0985e77d4f4e8b3cc6fac15068c66d8a78e758621695a8f60  '"$d/debt_owner_atomic_journal_DRAFT.dart" | sha256sum -c -
          echo 'fe0d4210f8dccaa73942fe6f5e346dc975edd86c68dd7ce338d3715db93b0677  '"$d/debt_owner_durable_journal_DRAFT.dart" | sha256sum -c -
          echo '9c039e8cbe224abdae5bce6b67594a498d22058be88d3fd7fb1c6c1302660cba  '"$d/debt_owner_indexeddb_adapter_DRAFT.dart" | sha256sum -c -
          echo '199b1205846e1908934273126ddd6c4b69ec5bdba549e620530bb3a66b2682b6  '"$d/debt_owner_indexeddb_adapter_DRAFT_test.dart" | sha256sum -c -
          test "$(git -C base rev-parse HEAD)" = 237d9290183c3bb3df73388ec9cf4563bb0186ef
          test "$(git -C base rev-parse HEAD:lib/pages/asset_management_page.dart)" = 35749bb77a1e93fcb8b4bf9a2c0c715baa892193
          test "$(git -C base rev-parse HEAD:lib/services/asset_sync_dirty_keys_store.dart)" = 3a6501a032f6623374ec222474bcc4408327233c
          test ! -e base/test/idb_static_probe
          mkdir base/test/idb_static_probe
          cp "$d/debt_owner_atomic_journal_DRAFT.dart" "$d/debt_owner_durable_journal_DRAFT.dart" \
             "$d/debt_owner_indexeddb_adapter_DRAFT.dart" "$d/debt_owner_indexeddb_adapter_DRAFT_test.dart" base/test/idb_static_probe/
          # Deliberately avoid inheriting project analyzer plugins/lints. This is
          # a type/static check only, not the project's full lint gate.
          printf 'analyzer:\n  errors: {}\n' > base/test/idb_static_probe/analysis_options.yaml
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.10'
          cache: false
      - name: Provision public packages on disposable runner
        shell: bash
        working-directory: base
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
          test ! -e "$PUB_CACHE"
          mkdir -p "$PUB_CACHE" "$RUNNER_TEMP/idb-static-xdg"
          # Provisioning downloads public dependencies; the analyzer step below
          # runs without network and with no secrets or browser.
          env -i PATH="$PATH" FLUTTER_ROOT="$FLUTTER_ROOT" PUB_CACHE="$PUB_CACHE" \
            XDG_CACHE_HOME="$RUNNER_TEMP/idb-static-xdg" CI=true \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            flutter pub get
          git diff --stat -- pubspec.lock
          python3 - <<'PY'
          import pathlib, re
          s = pathlib.Path('pubspec.lock').read_text(encoding='utf-8')
          section = re.search(r'^  web:\s*\n(.*?)(?=^  [A-Za-z0-9_]+:\s*$|\Z)', s, re.M | re.S)
          m = re.search(r'^    version: "?([^"\n]+)"?\s*$', section.group(1), re.M) if section else None
          if not m or m.group(1) != '1.1.1':
              raise SystemExit('Locked web version is not 1.1.1')
          PY
          # Block known local Git credentials and mounted sockets before isolation.
          for tree in "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT"; do
            if git -C "$tree" config --local --get-regexp '(^http\..*\.extraheader$|^credential\.|^url\..*\.insteadof$)' >/dev/null; then
              echo 'Unexpected local Git credential configuration'; exit 1
            fi
            if git -C "$tree" config --local --get-regexp '^remote\..*\.url$' | grep -Eq 'https?://[^/]*@'; then
              echo 'Unexpected credentials in local remote URL'; exit 1
            fi
          done
          if find "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" -type s -print -quit | grep -q .; then
            echo 'Unexpected mounted socket'; exit 1
          fi
          # package_config roots must all be under mounts; package paths are not printed.
          python3 - "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" <<'PY'
          import json, pathlib, sys, urllib.parse
          roots = [pathlib.Path(x) for x in sys.argv[1:]]
          if any(not x.is_absolute() or x.resolve() != x for x in roots):
              raise SystemExit('Non-canonical mount root')
          cfg = roots[0] / '.dart_tool/package_config.json'
          for p in json.loads(cfg.read_text(encoding='utf-8'))['packages']:
              u = urllib.parse.urlparse(urllib.parse.urljoin(cfg.as_uri(), p['rootUri']))
              if u.scheme != 'file' or u.netloc not in ('', 'localhost'):
                  raise SystemExit('Unexpected package URI')
              path = pathlib.Path(urllib.parse.unquote(u.path)).resolve()
              if not any(path == r or r in path.parents for r in roots):
                  raise SystemExit('Package outside isolated mounts')
          PY
      - name: Pull pinned isolated environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG/config.json"
          docker pull --platform=linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
      - name: Analyze the four files offline without running them
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          cid="$(docker create --pull=never --network=none --platform=linux/amd64 \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges:true \
            --read-only --pids-limit=256 --memory=3g --tmpfs /tmp:rw,nosuid,nodev,size=1g --tmpfs /.dart-tool:rw,nosuid,nodev,size=64m,mode=1777 --tmpfs /.dartServer:rw,nosuid,nodev,size=64m,mode=1777 \
            --env XDG_CONFIG_HOME=/tmp/config --env XDG_CACHE_HOME=/tmp/cache --env PUB_CACHE="$PUB_CACHE" --env PATH=/usr/bin:/bin \
            --mount "type=bind,src=$GITHUB_WORKSPACE/base,dst=$GITHUB_WORKSPACE/base" \
            --mount "type=bind,src=$FLUTTER_ROOT,dst=$FLUTTER_ROOT,readonly" \
            --mount "type=bind,src=$PUB_CACHE,dst=$PUB_CACHE,readonly" \
            --workdir "$GITHUB_WORKSPACE/base" "$IMAGE" /bin/bash -ec '
              test "$(id -u)" -ne 0
              test "$(awk "/^NoNewPrivs:/ {print \$2}" /proc/self/status)" = 1
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = 0000000000000000
              test "$(ls -1 /sys/class/net)" = lo
              test ! -e /var/run/docker.sock
              mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
              "$1/bin/cache/dart-sdk/bin/dart" --version
              "$1/bin/cache/dart-sdk/bin/dart" analyze --fatal-infos test/idb_static_probe
            ' _ "$FLUTTER_ROOT")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" = none
          test "$(docker inspect --format '{{.HostConfig.Privileged}}' "$cid")" = false
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = true
          docker inspect "$cid" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; h=d["HostConfig"]; assert "ALL" in h["CapDrop"]; assert any("no-new-privileges" in x for x in h["SecurityOpt"]); assert not h.get("PortBindings"); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "bind"} == set(sys.argv[1:]); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "tmpfs"}.issubset({"/tmp", "/.dart-tool", "/.dartServer"}); assert all(m["Type"] in ("bind", "tmpfs") for m in d["Mounts"]); assert set((h.get("Tmpfs") or {}).keys()) == {"/tmp", "/.dart-tool", "/.dartServer"}' "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE"
          docker start -a "$cid"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" -eq 0