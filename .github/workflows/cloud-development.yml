name: Debt owner warning diagnostic (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify fixed head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Prepare dependencies
        run: flutter pub get
      - name: Analyze affected production and test files
        run: >-
          flutter analyze --no-pub
          lib/pages/asset_management_page.dart
          lib/services/asset_liability_planning_service.dart
          lib/services/asset_debt_payment_day_override.dart
          lib/widgets/asset_debt_owner_warning.dart
          test/services/asset_debt_payment_day_override_test.dart
          test/widgets/asset_debt_owner_warning_test.dart
      - name: Run synthetic resolver and warning tests
        timeout-minutes: 6
        run: >-
          flutter test --no-pub
          test/services/asset_debt_payment_day_override_test.dart
          test/widgets/asset_debt_owner_warning_test.dart
