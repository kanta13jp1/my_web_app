          npx playwright install --with-deps chromium

      - name: Run note search pending E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > search-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
