name: Closing save diagnostic only
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert diagnostic source
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Run closing failure probe
        run: flutter test test/widgets/closing_save_failure_probe_test.dart --reporter expanded