name: Isolated owner writer fence candidate
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact disposable candidate commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  fence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: owner_sync_lab
          POSTGRES_PASSWORD: synthetic-only
        options: >-
          --health-cmd "pg_isready -U postgres -d owner_sync_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact head and files
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:test/synthetic_owner_fence/fixture.sql)" = "19073d7c3e008a45dd939987703798fbc75ddb97"
          test "$(git rev-parse HEAD:test/synthetic_owner_fence/candidate.sql)" = "840f56620cd4892163df9d565a9a48ef734c741d"
          test "$(git rev-parse HEAD:test/synthetic_owner_fence/inflight.sh)" = "4b4cecc21bd327be994113a532d18228e9c7a15d"
          test "$(git rev-parse HEAD:test/synthetic_owner_fence/tests.sql)" = "bc837f9242ec442a7711bbf703fb8d4e383ee89b"
      - name: Synthetic fixture
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user, version();'
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 < test/synthetic_owner_fence/fixture.sql
      - name: Preflight and inflight legacy writer
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        run: bash test/synthetic_owner_fence/inflight.sh
      - name: Restricted writes and unrelated CRUD
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 < test/synthetic_owner_fence/tests.sql
