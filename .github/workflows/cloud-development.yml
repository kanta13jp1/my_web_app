name: Cloud Development Checks
on:
  push:
    branches: [codex/typing-auth-validation-20261105]
permissions:
  contents: read
jobs:
  real-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.10'
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.115.0
      - run: flutter pub get
      - name: Format and analyze the real auth test
        run: |
          dart format test/integration/typing_records_supabase_test.dart
          git diff -- test/integration/typing_records_supabase_test.dart > typing-auth-format.patch
          flutter analyze test/integration/typing_records_supabase_test.dart
      - name: Start disposable local auth stack
        shell: bash
        run: |
          set -euo pipefail
          supabase init --workdir /tmp/typing-records-supabase
          supabase start --workdir /tmp/typing-records-supabase --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase status --workdir /tmp/typing-records-supabase --output json > "$RUNNER_TEMP/typing-stack.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'typing-stack.json').read_text())
          values={'TYPING_TEST_URL':d['API_URL'],'TYPING_TEST_ANON_KEY':d['ANON_KEY'],'TYPING_TEST_DB_URL':d['DB_URL']}
          for value in values.values(): print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in values.items(): f.write(k+'='+v+'\n')
          PY
      - name: Apply only typing draft to disposable database
        run: |
          psql "$TYPING_TEST_DB_URL" -v ON_ERROR_STOP=1 -f docs/typing-game/records-schema.draft.sql
          psql "$TYPING_TEST_DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
      - name: Real Auth and PostgREST integration
        run: flutter test test/integration/typing_records_supabase_test.dart --concurrency=1 --reporter=expanded
      - name: Require clean auth test formatting
        run: test ! -s typing-auth-format.patch
      - name: Stop disposable stack
        if: always()
        run: |
          if test -f /tmp/typing-records-supabase/supabase/config.toml; then
            supabase stop --workdir /tmp/typing-records-supabase --no-backup
          else
            echo 'No disposable stack was initialized; nothing to stop.'
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: typing-auth-validation
          path: typing-auth-format.patch
          retention-days: 7
