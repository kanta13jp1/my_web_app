name: Synthetic inherited truncate (disposable Postgres only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated SQL experiment commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  sql-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: owner_sync_lab
          POSTGRES_PASSWORD: synthetic-only
        options: >-
          --health-cmd "pg_isready -U postgres -d owner_sync_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact experiment files and head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:test/synthetic_owner_rls/fixture.sql)" = "78732354d07d2cc178db409a34d6d3f41fb2e2a6"
          test "$(git rev-parse HEAD:test/synthetic_owner_rls/inherited_expected_red.sql)" = "5c3ecaf18de0a8f4474055875e6660fc25df2b73"
          test "$(git rev-parse HEAD:test/synthetic_owner_rls/inherited_green.sql)" = "c7b53c12741f361b2202631c9612a2d4cb2a4453"
          test "$(git rev-parse HEAD:test/synthetic_owner_rls/inherited_setup.sql)" = "5bb3f6a6b7966a9935f90aeb1a05a2fad616c959"
      - name: Create synthetic fixture
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            -c 'SELECT current_database(), current_user, version();'
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            < test/synthetic_owner_rls/fixture.sql
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            < test/synthetic_owner_rls/inherited_setup.sql
      - name: Expected red inherited and PUBLIC grants remain
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            < test/synthetic_owner_rls/inherited_expected_red.sql
      - name: Revoke synthetic inherited and PUBLIC grants
        env:
          SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            < test/synthetic_owner_rls/inherited_green.sql
