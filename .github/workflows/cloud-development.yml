name: Dart owner IndexedDB diagnostic (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify immutable synthetic files
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate.dart)" = "49679fdf5fd7976ac3973687867bcc73f2eb999c"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate_types.dart)" = "fd28ed0361134f84ebc3a076f92a9757c5d548d0"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate_stub.dart)" = "6b5eb387b735c175e95ae89721f162b5ac264f07"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate_web.dart)" = "833667eebfb30929979a44f638e2f5b9bb0fc3dd"
          test "$(git rev-parse HEAD:web/payment_owner_candidate_probe.dart)" = "5acc97eabebd21f10d0bb6a53d067ac1d4403e10"
          test "$(git rev-parse HEAD:test/payment_owner_candidate_stub_test.dart)" = "19a6a0f8228cf8e7bf7364c4c9e314bfa24ed5dc"
          test "$(git rev-parse HEAD:test/synthetic/payment_owner_dart_idb_probe.cjs)" = "dd133cc82da72e19f2ed408092ff9e488755ad29"
          test "$(git rev-parse HEAD:test/synthetic/run_payment_owner_dart_probe.sh)" = "fa36f274fc32dd81a606cb45496d6d19048550c7"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Prepare locked dependencies
        run: |
          set -euo pipefail
          flutter pub get
          npm ci --ignore-scripts
      - name: Check targeted formatter and analyzer
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib/services/payment_owner_local_candidate.dart lib/services/payment_owner_local_candidate_types.dart lib/services/payment_owner_local_candidate_stub.dart lib/services/payment_owner_local_candidate_web.dart web/payment_owner_candidate_probe.dart test/payment_owner_candidate_stub_test.dart
          flutter analyze --no-pub lib/services/payment_owner_local_candidate.dart lib/services/payment_owner_local_candidate_types.dart lib/services/payment_owner_local_candidate_stub.dart lib/services/payment_owner_local_candidate_web.dart web/payment_owner_candidate_probe.dart test/payment_owner_candidate_stub_test.dart
      - name: Test detached Dart and two-tab Chrome on loopback only
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true SYNTHETIC_DART_JS="$4" bash test/synthetic/run_payment_owner_dart_probe.sh
          ' _ "$(id -un)" "$PATH" "$HOME" "$RUNNER_TEMP/synthetic-owner-candidate.js"
