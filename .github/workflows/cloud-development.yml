# DRAFT ONLY. Not registered, dispatched, executed, or verified.
# Two intentionally failing KNOWN RED cases remain enabled; no result is made green.
name: Owner workspace synthetic JSON diagnostic (draft)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IMAGE: docker.io/library/ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
    steps:
      - name: Initialize disposable paths in a step context
        shell: bash
        run: |
          set -euo pipefail
          printf 'PUB_CACHE=%s\n' "$RUNNER_TEMP/owner-probe-pub" >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/owner-probe-docker" >> "$GITHUB_ENV"
      - name: Checkout diagnostic inputs without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic-inputs
          persist-credentials: false
      - name: Checkout immutable public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          ref: 237d9290183c3bb3df73388ec9cf4563bb0186ef
          persist-credentials: false
      - name: Check public base, raw Git blobs and preserve relative imports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = 237d9290183c3bb3df73388ec9cf4563bb0186ef
          test "$(git -C base rev-parse HEAD:lib/pages/asset_management_page.dart)" = 35749bb77a1e93fcb8b4bf9a2c0c715baa892193
          test "$(git -C base rev-parse HEAD:lib/services/asset_sync_dirty_keys_store.dart)" = 3a6501a032f6623374ec222474bcc4408327233c
          test ! -e base/test/owner_workspace_probe
          mkdir base/test/owner_workspace_probe
          stage_blob() {
            local name="$1" expected="$2" actual
            # Read the exact committed bytes, not a platform-normalized working tree.
            git -C diagnostic-inputs show "HEAD:diagnostics/ordered_patch_work/$name" > "base/test/owner_workspace_probe/$name"
            actual="$(sha256sum "base/test/owner_workspace_probe/$name" | cut -d' ' -f1)"
            test "$actual" = "$expected" || { echo "Input hash mismatch: $name"; exit 1; }
            # Report exact endings without changing or exposing source content.
            python3 - "base/test/owner_workspace_probe/$name" <<'PY'
          import pathlib, sys
          b = pathlib.Path(sys.argv[1]).read_bytes()
          crlf = b.count(b'\r\n')
          print(pathlib.Path(sys.argv[1]).name, 'CRLF=', crlf,
                'bare-LF=', b.count(b'\n') - crlf, 'bare-CR=', b.count(b'\r') - crlf)
          PY
          }
          stage_blob debt_workspace_controller_DRAFT.dart c3d7d4ba193bfdc225a7e7d7b1d0afaf36be827908ce4e26b93bd5e4c0ef16c3
          stage_blob debt_workspace_controller_DRAFT_test.dart 7d8f5f05c1097d861f0fa04e8a4c87895af16f229156580c55d2f40e56f1db0c
          stage_blob debt_legacy_review_widget_DRAFT.dart ba46fb290c09121de6b7bd4f8b8d13b0796f7ca188bf9d80762af4df11341279
          stage_blob debt_legacy_guard_DRAFT.dart 20f97ed29ec58578245ce8117672164661d724e5923904e19dd5564bee749753
          stage_blob debt_legacy_guard_DRAFT_test.dart b071012a0ed025692fdcffbef02220486e750558754e9149e4f18faa6277357e
          # Preflight every relative Dart import; no implicit network or parent path.
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('base/test/owner_workspace_probe')
          for file in root.glob('*.dart'):
              for name in re.findall(r"^import\s+['\"]([^'\"]+)['\"]", file.read_text(encoding='utf-8'), re.M):
                  if name.startswith(('dart:', 'package:')): continue
                  target = (file.parent / name).resolve()
                  if target.parent != root.resolve() or not target.is_file():
                      raise SystemExit('Missing or unsafe relative import')
          PY
      - name: Provision pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.10'
          cache: false
      - name: Prepare public dependencies on disposable runner
        shell: bash
        working-directory: base
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
          test ! -e "$PUB_CACHE"
          mkdir -p "$PUB_CACHE" "$RUNNER_TEMP/owner-probe-xdg"
          # Match the successful same-path workflow: do not redefine HOME.
          for args in '--version' 'precache --linux' 'pub get'; do
            env -i PATH="$PATH" FLUTTER_ROOT="$FLUTTER_ROOT" PUB_CACHE="$PUB_CACHE" \
              XDG_CACHE_HOME="$RUNNER_TEMP/owner-probe-xdg" CI=true \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              flutter $args
          done
          # The reference run recorded 21 dependency changes. Show the actual
          # diff; do not call it an error. The web version itself stays pinned.
          git diff --stat -- pubspec.lock
          git diff -- pubspec.lock
          python3 - <<'PY'
          import pathlib, re
          s = pathlib.Path('pubspec.lock').read_text(encoding='utf-8')
          section = re.search(r'^  web:\s*\n(.*?)(?=^  [A-Za-z0-9_]+:\s*$|\Z)', s, re.M | re.S)
          m = re.search(r'^    version: "?([^"\n]+)"?\s*$', section.group(1), re.M) if section else None
          if not m or m.group(1) != '1.1.1':
              raise SystemExit('ENVIRONMENT: resolved web is not 1.1.1')
          print('resolved web: 1.1.1')
          PY
          for tree in "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT"; do
            if git -C "$tree" config --local --get-regexp '(^http\..*\.extraheader$|^credential\.|^url\..*\.insteadof$)' >/dev/null; then
              echo 'Unexpected local Git credential configuration'; exit 1
            fi
            if git -C "$tree" config --local --get-regexp '^remote\..*\.url$' | grep -Eq 'https?://[^/]*@'; then
              echo 'Unexpected credential in local remote URL'; exit 1
            fi
          done
          if find "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" -type s -print -quit | grep -q .; then
            echo 'Unexpected mounted socket'; exit 1
          fi
          # Flutter wants a freshness stamp; this does not assert latest version.
          printf '{"lastTimeVersionWasChecked":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$FLUTTER_ROOT/bin/cache/flutter_version_check.stamp"
          python3 - "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" <<'PY'
          import json, pathlib, sys, urllib.parse
          roots = [pathlib.Path(x) for x in sys.argv[1:]]
          if any(not r.is_absolute() or r.resolve() != r for r in roots):
              raise SystemExit('Non-canonical mount root')
          cfg = roots[0] / '.dart_tool/package_config.json'
          for p in json.loads(cfg.read_text(encoding='utf-8'))['packages']:
              u = urllib.parse.urlparse(urllib.parse.urljoin(cfg.as_uri(), p['rootUri']))
              if u.scheme != 'file' or u.netloc not in ('', 'localhost'):
                  raise SystemExit('Unexpected package URI')
              path = pathlib.Path(urllib.parse.unquote(u.path)).resolve()
              if not any(path == r or r in path.parents for r in roots):
                  raise SystemExit('Package outside isolated mounts')
          PY
      - name: Stage verified base image and minimal Git runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG/config.json"
          docker pull --platform=linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          docker image inspect "$IMAGE" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; assert any(x.endswith("@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc") for x in (d.get("RepoDigests") or []))'
          root="$GITHUB_WORKSPACE/base/.isolation-tools"
          mkdir -p "$root/bin/.git-runtime" "$root/lib"
          gitbin="$(command -v git)"
          cp -L "$gitbin" "$root/bin/.git-runtime/git"
          cat > "$root/bin/git" <<'WRAPPER'
          #!/bin/sh
          toolroot=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          export LD_LIBRARY_PATH="$toolroot/lib"
          exec "$toolroot/bin/.git-runtime/git" "$@"
          WRAPPER
          chmod 0755 "$root/bin/git"
          ldd "$gitbin" > "$RUNNER_TEMP/owner-git-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/owner-git-ldd.txt"; then exit 1; fi
          awk '/=> \/[^ ]+/ {print $3}' "$RUNNER_TEMP/owner-git-ldd.txt" | while IFS= read -r lib; do
            test -f "$lib"
            case "$(basename "$lib")" in
              libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|librt.so.1|libresolv.so.2) continue;;
            esac
            cp -L "$lib" "$root/lib/$(basename "$lib")"
          done
      - name: Run all synthetic tests offline and preserve the failing exit
        shell: bash
        run: |
          set -euo pipefail
          host_netns="$(readlink /proc/self/ns/net)"
          user_id="$(id -u):$(id -g)"
          test "$(id -u)" -ne 0
          cid="$(docker create --pull=never --network=none --platform=linux/amd64 \
            --user "$user_id" --cap-drop=ALL --security-opt=no-new-privileges:true \
            --read-only --pids-limit=512 --memory=4g --tmpfs /tmp:rw,nosuid,nodev,size=1g --tmpfs /.dart-tool:rw,nosuid,nodev,size=64m,mode=1777 \
            --env XDG_CACHE_HOME=/tmp/cache --env XDG_CONFIG_HOME=/tmp/config --env PUB_CACHE="$PUB_CACHE" --env FLUTTER_ROOT="$FLUTTER_ROOT" \
            --env PATH="$GITHUB_WORKSPACE/base/.isolation-tools/bin:$FLUTTER_ROOT/bin:/usr/bin:/bin" \
            --env HOST_NETNS="$host_netns" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/base,dst=$GITHUB_WORKSPACE/base" \
            --mount "type=bind,src=$FLUTTER_ROOT,dst=$FLUTTER_ROOT" \
            --mount "type=bind,src=$PUB_CACHE,dst=$PUB_CACHE,readonly" \
            --workdir "$GITHUB_WORKSPACE/base" "$IMAGE" /bin/bash -ec '
              test "$(id -u)" -ne 0
              test "$(awk "/^NoNewPrivs:/ {print \$2}" /proc/self/status)" = 1
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = 0000000000000000
              test "$(readlink /proc/self/ns/net)" != "$HOST_NETNS"
              test "$(ls -1 /sys/class/net)" = lo
              awk "NR > 1 && \$1 != \"lo\" {exit 1}" /proc/net/route
              awk "\$NF != \"lo\" {exit 1}" /proc/net/ipv6_route
              test ! -e /var/run/docker.sock
              socket_path=$(find "$PWD" "$FLUTTER_ROOT" "$PUB_CACHE" -type s -print -quit)
              test -z "$socket_path"
              mkdir -p "$XDG_CACHE_HOME" probe-reports
              git --version
              "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" --version
              # Report JSON to a disposable file. Do not exclude KNOWN RED.
              timeout 360s "$FLUTTER_ROOT/bin/flutter" test --no-pub --reporter json \
                test/owner_workspace_probe/debt_workspace_controller_DRAFT_test.dart \
                test/owner_workspace_probe/debt_legacy_guard_DRAFT_test.dart \
                > probe-reports/results.jsonl 2> probe-reports/stderr.txt
            ')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" = none
          test "$(docker inspect --format '{{.HostConfig.Privileged}}' "$cid")" = false
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = true
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "$user_id"
          test "$(docker inspect --format '{{.HostConfig.PublishAllPorts}}' "$cid")" = false
          docker inspect "$cid" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; h=d["HostConfig"]; assert "ALL" in h["CapDrop"]; assert any("no-new-privileges" in x for x in h["SecurityOpt"]); assert not h.get("PortBindings"); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "bind"} == set(sys.argv[1:]); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "tmpfs"}.issubset({"/tmp", "/.dart-tool"}); assert all(m["Type"] in ("bind", "tmpfs") for m in d["Mounts"]); assert set((h.get("Tmpfs") or {}).keys()) == {"/tmp", "/.dart-tool"}' "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE"
          # Detect any formatter/edit between verified staging and the test.
          echo '7d8f5f05c1097d861f0fa04e8a4c87895af16f229156580c55d2f40e56f1db0c  '"$GITHUB_WORKSPACE/base/test/owner_workspace_probe/debt_workspace_controller_DRAFT_test.dart" | sha256sum -c -
          set +e
          docker start -a "$cid"
          rc=$?
          set -e
          printf 'Container exit status: %s\n' "$rc"
          if test -s "$GITHUB_WORKSPACE/base/probe-reports/stderr.txt"; then
            echo 'Test stderr (first 80 lines):'
            sed -n '1,80p' "$GITHUB_WORKSPACE/base/probe-reports/stderr.txt"
          fi
          # Classification is diagnostic only; an assertion failure remains red.
          python3 - "$GITHUB_WORKSPACE/base/probe-reports/results.jsonl" "$GITHUB_WORKSPACE/base/test/owner_workspace_probe/debt_workspace_controller_DRAFT_test.dart" <<'PY'
          import collections, json, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              print('ENVIRONMENT/STARTUP FAILURE: no test report')
              raise SystemExit(0)
          tests, done, errors = {}, {}, collections.defaultdict(list)
          bad_lines = 0
          for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
              try: ev = json.loads(line)
              except ValueError:
                  bad_lines += 1
                  continue
              if not isinstance(ev, dict):
                  bad_lines += 1
                  continue
              if ev.get('type') == 'testStart':
                  test = ev.get('test') or {}
                  if 'id' in test: tests[test['id']] = test.get('name', '<no-name>')
              elif ev.get('type') == 'testDone': done[ev.get('testID')] = ev
              elif ev.get('type') == 'error': errors[ev.get('testID')].append(ev)
          fixture = pathlib.Path(sys.argv[2]).read_text(encoding='utf-8').splitlines()
          markers = {
              'KNOWN RED: notification should stop old merge before fence commits': 'expect(afterOldMerge, isEmpty)',
              'KNOWN RED: owner notification should revoke an old in-flight write': 'expect(afterOldWrite, isEmpty)',
          }
          expected = {}
          for name, marker in markers.items():
              positions = [i for i, source in enumerate(fixture, 1) if marker in source]
              expected[name] = f':{positions[0]}:' if len(positions) == 1 else None
          def show(value, limit=900):
              # Both test files are verified synthetic fixtures; bound output and
              # escape controls so the diagnostic logs remain human-readable.
              text = str(value)
              return json.dumps(text[:limit], ensure_ascii=True) + (' [truncated]' if len(text) > limit else '')
          def detail(ident):
              event = done.get(ident, {})
              print('  testID=', show(ident, 80), 'done=', show(event, 500),
                    'errorEvents=', len(errors.get(ident, [])))
              for e in errors.get(ident, [])[:4]:
                  print('  error keys=', sorted(map(str, e.keys())),
                        'isFailure=', show(e.get('isFailure'), 30))
                  print('  error=', show(e.get('error', '<missing>')))
                  # Flutter package/test versions differ in stack structure;
                  # bounded stack prefix and matching source lines aid review.
                  stack = str(e.get('stackTrace', '<missing>')).splitlines()
                  selected = stack[:5] + [line for line in stack[5:] if 'debt_workspace_controller_DRAFT_test.dart' in line][:4]
                  for frame in selected:
                      print('  frame=', show(frame, 350))
          print('Report malformed/non-JSON lines:', bad_lines)
          print('KNOWN RED testStart names and IDs:')
          for ident, name in tests.items():
              if 'KNOWN RED' in name:
                  print(' ', show(name, 250), 'id=', show(ident, 80))
                  if name not in expected: detail(ident)
          for name, line in expected.items():
              ids = [i for i, n in tests.items() if n == name]
              ok = len(ids) == 1 and ids[0] in done and not done[ids[0]].get('skipped', False)
              if ok: ok = done[ids[0]].get('result') in ('error', 'failure')
              evidence = errors.get(ids[0], []) if len(ids) == 1 else []
              ok = ok and line is not None and bool(evidence) and all(
                  e.get('isFailure') is True and
                  'Expected: empty' in str(e.get('error', '')) and
                  'synthetic-debt' in str(e.get('error', '')) and
                  re.search(r'\b10\b', str(e.get('error', ''))) is not None and
                  'debt_workspace_controller_DRAFT_test.dart' in str(e.get('stackTrace', '')) and
                  line in str(e.get('stackTrace', '')) for e in evidence)
              print(('EXPECTED RED CANDIDATE' if ok else 'UNEXPECTED/MISSING/SKIPPED'), show(name, 250),
                    'markerLine=', show(line, 30), 'exactNameIDs=', len(ids))
              for ident in ids: detail(ident)
          for ident, name in tests.items():
              if ident not in done: print('ENVIRONMENT/TIMEOUT/UNFINISHED:', show(name, 250))
          completed_cases = [name for ident, name in tests.items() if ident in done and not name.startswith('loading ')]
          print('Completed case count (expected 37, excluding load events):', len(completed_cases))
          if len(completed_cases) != 37: print('UNEXPECTED CASE COUNT: inspect missing or extra cases')
          for ident, event in done.items():
              name = tests.get(ident, '<unknown test>')
              if name not in expected and (event.get('result') != 'success' or event.get('skipped', False)):
                  print('OTHER FAILURE OR SKIP:', show(name, 250), show(event.get('result'), 50))
                  detail(ident)
          for ident in errors:
              if ident not in tests:
                  print('ENVIRONMENT/LOAD ERROR: no matching test id:', show(ident, 80))
                  detail(ident)
          if not done: print('ENVIRONMENT/LOAD FAILURE: no completed tests')
          PY
          # Exit nonzero for every failing run; no `continue-on-error` and no
          # expected-failure-to-success conversion. Missing report is also red.
          test -s "$GITHUB_WORKSPACE/base/probe-reports/results.jsonl" || exit 1
          test "$rc" -ne 0 || { echo 'Unexpected green: inspect whether expected reds ran'; exit 1; }
          exit "$rc"