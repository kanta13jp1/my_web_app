# Diagnostic-only proposal. Not installed, dispatched, or approved for deployment.
# Run only as a dedicated GitHub-hosted job on a diagnostic branch.
name: Salary identity fixture (diagnostic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit SHA
        required: true
        type: string
      profile:
        description: Diagnostic profile
        required: true
        type: choice
        options: [test]
permissions: {}
jobs:
  synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    container:
      image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
      volumes:
        - salary-identity-${{ github.run_id }}-${{ github.run_attempt }}:/var/run/postgresql
    services:
      postgres:
        image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_DB: salary_identity_isolated
          POSTGRES_PASSWORD: test-only
        volumes:
          - salary-identity-${{ github.run_id }}-${{ github.run_attempt }}:/var/run/postgresql
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact diagnostic inputs
        shell: sh
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf '%s\n' '027fa48beaead2981abb6e2dfadff268eb95851faaeba692b7c76281e6dff9ec  diagnostics/salary_identity/01_expand_identity_DRAFT.sql' | sha256sum -c -
          printf '%s\n' '632461a6232c80176deaef150d93c2a59ff3a8dad8e38a8eeb2621009af1f743  diagnostics/salary_identity/02_isolated_identity_test.sql' | sha256sum -c -
      - name: Execute guarded synthetic fixture using Unix socket
        shell: sh
        env:
          PGHOST: /var/run/postgresql
          PGDATABASE: salary_identity_isolated
          PGUSER: postgres
          PGPASSWORD: test-only
          PGOPTIONS: '-c salary_test.isolated=disposable-pg17-only'
        run: |
          unset PGHOSTADDR PGSERVICE PGSERVICEFILE PGPASSFILE
          psql -X -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d salary_identity_isolated -f diagnostics/salary_identity/02_isolated_identity_test.sql
