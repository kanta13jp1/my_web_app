name: Cloud Development Checks

on:
  pull_request:
    paths:
      - .agents/skills/site-trust-improvement-loop/**
      - lib/models/savings_life_plan.dart
      - lib/services/savings_life_plan_service.dart
      - lib/services/savings_life_plan_store.dart
      - lib/services/savings_plan_proposal_service.dart
      - test/services/savings_plan_proposal_service_test.dart
      - lib/widgets/savings_life_plan_card.dart
      - test/services/savings_life_plan_service_test.dart
      - test/services/savings_life_plan_store_test.dart
      - test/widgets/savings_life_plan_card_test.dart
      - test/fixtures/savings_life_plan_app.dart
      - test/e2e/savings_life_plan.spec.ts
      - lib/models/asset_balance_observation.dart
      - lib/widgets/asset_balance_history_control.dart
      - test/models/asset_balance_observation_test.dart
      - test/widgets/asset_balance_history_control_test.dart
      - test/fixtures/asset_balance_history_app.dart
      - test/e2e/asset_balance_history.spec.ts
      - .devcontainer/**
      - .github/workflows/cloud-development.yml
      - lib/widgets/slide_number_check_card.dart
      - lib/services/slide_number_check.dart
      - test/fixtures/slide_number_check_app.dart
      - test/e2e/slide_number_check.spec.ts
      - lib/pages/ai_search_page.dart
      - test/pages/ai_search_page_test.dart
      - test/fixtures/ai_search_app.dart
      - test/e2e/ai_search_pending.spec.ts
      - lib/models/platform_release_checklist.dart
      - lib/pages/platform_release_checklist_page.dart
      - test/e2e/platform_release_checklist.spec.ts
      - scripts/cloud_ci_handoff.py
      - scripts/cloud_ci_handoff_test.py
      - scripts/cloud_first_route.py
      - scripts/cloud_first_route_test.py
      - scripts/serve_spa.py
      - docs/CLOUD_FIRST_DEVELOPMENT.md
      - docs/CLOUD_FIRST_DEVELOPMENT_WORKFLOW.md
      - docs/CLAUDE_CODE_SETUP_RUNBOOK.md
      - AGENTS.md
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-character pushed HEAD that this run must validate
        required: true
        type: string
      profile:
        description: Cloud validation profile
        required: true
        default: full
        type: choice
        options:
          - workspace
          - format
          - analyze
          - test
          - web-build
          - full
  workflow_call:
    inputs:
      expected_head_sha:
        description: Optional exact HEAD assertion for reusable callers
        required: false
        default: ''
        type: string
      profile:
        description: Cloud validation profile
        required: false
        default: full
        type: string

permissions: {}

concurrency:
  group: cloud-development-${{ github.ref }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ inputs.profile || 'full' }} on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLOUD_PROFILE: ${{ inputs.profile || 'full' }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}

    steps:
      - name: Checkout shallow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'test' && 2 || 1 }}
          persist-credentials: ${{ github.event_name != 'workflow_dispatch' || inputs.profile != 'test' }}

      - name: Verify exact cloud handoff SHA
        if: env.EXPECTED_HEAD_SHA != ''
        shell: bash
        run: |
          set -euo pipefail
          actual_head_sha="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_head_sha must be a lowercase 40-character Git SHA."
            exit 1
          fi
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Cloud handoff mismatch: expected $EXPECTED_HEAD_SHA, checked out $actual_head_sha."
            exit 1
          fi
          echo "Verified exact cloud handoff SHA: $actual_head_sha"

      - name: Verify salary diagnostic tree and source hashes
        if: github.event_name == 'workflow_dispatch' && env.CLOUD_PROFILE == 'test'
        shell: bash
        run: |
          set -euo pipefail
          parent=b2087377928d4cd2f0b703ea9e3684fc8499681b
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-list --parents -n 1 HEAD)" == "$EXPECTED_HEAD_SHA $parent" ]]
          changed_file="$RUNNER_TEMP/salary-5707-changed-names"
          [[ ! -e "$changed_file" ]]
          git diff --name-only -z --no-renames "$parent" HEAD > "$changed_file"
          mapfile -d '' -t changed < "$changed_file"
          expected=(
            .github/workflows/cloud-development.yml
            lib/pages/asset_management_page.dart
            lib/services/asset_salary_deposit_detector.dart
            test/services/asset_salary_deposit_detector_test.dart
            test/widgets/asset_salary_confirmation_guard_test.dart
          )
          [[ "${#changed[@]}" -eq "${#expected[@]}" ]]
          for i in "${!expected[@]}"; do [[ "${changed[$i]}" == "${expected[$i]}" ]]; done
          for file in "${expected[@]}"; do [[ -f "$file" && ! -L "$file" ]]; done
          sha256sum -c <<'SHA256'
          d72eb6b4c500d4774f5aa26dbaecc4a3bebb180fd9ec98a11fa39fc31ac2f0b2  lib/pages/asset_management_page.dart
          faa21e71a224ec0fb2caa752d9688ee301960e6ca4be68faafc96d89ccf3f3f8  lib/services/asset_salary_deposit_detector.dart
          a8b947d9a28573a57e2fbd069f8fd18a5ffd005a220e63e561b40f6c71581d72  test/services/asset_salary_deposit_detector_test.dart
          1fd318f2de080e0c809da3b6a234d0a1fc1f4c1061d0ed74c92e3814e99925d2  test/widgets/asset_salary_confirmation_guard_test.dart
          SHA256

      - name: Validate cloud workspace descriptors
        shell: bash
        run: |
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          python -m json.tool .devcontainer/flutter-local/devcontainer.json > /dev/null

      - name: Set up repository-pinned Flutter SDK
        if: env.CLOUD_PROFILE != 'workspace' && !(github.event_name == 'workflow_dispatch' && env.CLOUD_PROFILE == 'test')
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Set up exact Flutter commit for salary diagnostic
        if: github.event_name == 'workflow_dispatch' && env.CLOUD_PROFILE == 'test'
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/salary-flutter-3.38.10"
          [[ ! -e "$flutter_root" ]]
          git clone --depth 1 --branch 3.38.10 https://github.com/flutter/flutter.git "$flutter_root"
          [[ "$(git -C "$flutter_root" rev-parse HEAD)" == c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80 ]]
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          "$flutter_root/bin/flutter" config --no-analytics
          "$flutter_root/bin/flutter" --version
          "$flutter_root/bin/flutter" precache --linux

      - name: Resolve dependencies in cloud
        if: env.CLOUD_PROFILE != 'workspace' && !(github.event_name == 'workflow_dispatch' && env.CLOUD_PROFILE == 'test')
        run: flutter pub get

      - name: Resolve and record salary diagnostic dependencies
        id: salary_dependencies
        if: github.event_name == 'workflow_dispatch' && env.CLOUD_PROFILE == 'test'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/salary-5707-dependencies"
          [[ ! -e "$artifact" && -f pubspec.lock && ! -L pubspec.lock ]]
          echo 'da19d974be0d4d49bcf7f8280d92429dd646c8a71009d33b90a15e8d050be5e5  pubspec.lock' | sha256sum -c
          mkdir -p "$artifact"
          cp -- pubspec.lock "$artifact/pubspec.original.lock"
          echo 'capture_started=true' >> "$GITHUB_OUTPUT"
          flutter pub get
          [[ -f pubspec.lock && ! -L pubspec.lock ]]
          git diff --quiet -- . ':(exclude)pubspec.lock'
          python3 - <<'PY'
          import pathlib
          data = pathlib.Path('pubspec.lock').read_text(encoding='utf8')
          for line in data.splitlines():
              line = line.strip()
              if line.startswith('source:') and line not in ('source: hosted', 'source: sdk'):
                  raise SystemExit('unexpected lockfile source')
              if line.startswith('url:') and line != 'url: "https://pub.dev"':
                  raise SystemExit('unexpected lockfile URL')
          PY
          cp -- pubspec.lock "$artifact/pubspec.resolved.lock"
          git diff --binary -- pubspec.lock > "$artifact/pubspec.lock.patch"
          sha256sum "$artifact/pubspec.original.lock" "$artifact/pubspec.resolved.lock" > "$artifact/lock-sha256.txt"
          flutter --version --machine > "$artifact/flutter-version.json"
          python3 - "$artifact/flutter-version.json" <<'PY'
          import json, pathlib, sys
          obj=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf8'))
          if obj.get('frameworkRevision') != 'c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80':
              raise SystemExit('unexpected Flutter revision')
          PY
          echo 'resolved=true' >> "$GITHUB_OUTPUT"

      - name: Format changed Dart files in cloud
        id: format
        if: env.CLOUD_PROFILE == 'format'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "${DEFAULT_BRANCH}"
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "origin/${DEFAULT_BRANCH}" HEAD -- '*.dart' \
              | while IFS= read -r file; do
                  [ -f "$file" ] && printf '%s\n' "$file"
                done
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed Dart files were found."
            exit 0
          fi

          dart format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The changed Dart files already match the pinned formatter."
            exit 0
          fi

          mkdir -p cloud-format-output/files
          git diff --binary -- "${files[@]}" > cloud-format-output/cloud-format.patch
          printf '%s\n' "${files[@]}" > cloud-format-output/manifest.txt
          for file in "${files[@]}"; do
            mkdir -p "cloud-format-output/files/$(dirname "$file")"
            cp "$file" "cloud-format-output/files/$file"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Preserve formatter output briefly
        if: steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-format-${{ github.run_id }}
          path: cloud-format-output
          if-no-files-found: error
          retention-days: 1

      - name: Analyze in cloud
        if: env.CLOUD_PROFILE == 'analyze' || env.CLOUD_PROFILE == 'full'
        run: flutter analyze

      - name: Format and preserve salary diagnostic test source
        id: salary_format
        if: github.event_name == 'workflow_dispatch' && env.CLOUD_PROFILE == 'test'
        shell: bash
        run: |
          set -euo pipefail
          test_file=test/widgets/asset_salary_confirmation_guard_test.dart
          artifact="$RUNNER_TEMP/salary-5707-formatted"
          [[ ! -e "$artifact" ]]
          mkdir -p "$artifact"
          echo '1fd318f2de080e0c809da3b6a234d0a1fc1f4c1061d0ed74c92e3814e99925d2  test/widgets/asset_salary_confirmation_guard_test.dart' | sha256sum -c
          dart format "$test_file"
          cp -- "$test_file" "$artifact/asset_salary_confirmation_guard_test.dart"
          git diff --binary -- "$test_file" > "$artifact/format.patch"
          sha256sum "$test_file" > "$artifact/test-sha256.txt"
          git diff --quiet -- lib/pages/asset_management_page.dart lib/services/asset_salary_deposit_detector.dart test/services/asset_salary_deposit_detector_test.dart
          echo 'prepared=true' >> "$GITHUB_OUTPUT"

      - name: Run salary diagnostic with isolated networking
        if: github.event_name == 'workflow_dispatch' && env.CLOUD_PROFILE == 'test'
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          [[ "$(id -u)" -ne 0 ]]
          runner_home="$HOME"
          [[ -d "$runner_home" ]]
          host_net="$(readlink /proc/self/ns/net)"
          [[ "$host_net" =~ ^net:\[[0-9]+\]$ ]]
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          [[ -d "$pub_cache" ]]
          resolved_lock="$RUNNER_TEMP/salary-5707-dependencies/pubspec.resolved.lock"
          cmp -- pubspec.lock "$resolved_lock"
          resolved_lock_sha="$(sha256sum pubspec.lock | cut -d ' ' -f 1)"
          [[ "$resolved_lock_sha" =~ ^[0-9a-f]{64}$ ]]
          cmp -- test/widgets/asset_salary_confirmation_guard_test.dart "$RUNNER_TEMP/salary-5707-formatted/asset_salary_confirmation_guard_test.dart"
          sudo -n unshare --net --fork -- bash -euo pipefail -c '
            isolated_net="$(readlink /proc/self/ns/net)"
            [[ "$isolated_net" =~ ^net:\[[0-9]+\]$ && "$isolated_net" != "$5" ]]
            ip link set lo up
            ip -j link show | python3 -c '"'"'import json,sys; x=json.load(sys.stdin); assert len(x)==1 and x[0]["ifname"]=="lo"'"'"'
            ipv4_routes="$(ip -4 route show)"
            ipv6_routes="$(ip -6 route show)"
            tcp_listeners="$(ss -lntH)"
            [[ -z "$ipv4_routes" && -z "$ipv6_routes" && -z "$tcp_listeners" ]]
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" PUB_CACHE="$4" CI=true FLUTTER_SUPPRESS_ANALYTICS=true bash -euo pipefail -c '"'"'
              [[ "$(id -u)" -ne 0 ]]
              before="$(sha256sum pubspec.lock | cut -d " " -f 1)"
              [[ "$before" == "$1" ]]
              timeout 180s flutter pub get --offline --enforce-lockfile
              after="$(sha256sum pubspec.lock | cut -d " " -f 1)"
              [[ "$after" == "$1" ]]
              timeout 600s flutter test --no-pub --concurrency=1 --timeout 90s --reporter expanded test/widgets/asset_salary_confirmation_guard_test.dart test/services/asset_salary_deposit_detector_test.dart
              final="$(sha256sum pubspec.lock | cut -d " " -f 1)"
              [[ "$final" == "$1" ]]
            '"'"' _ "$6"
          ' _ "$runner_user" "$PATH" "$runner_home" "$pub_cache" "$host_net" "$resolved_lock_sha"
          cmp -- pubspec.lock "$resolved_lock"
          cmp -- test/widgets/asset_salary_confirmation_guard_test.dart "$RUNNER_TEMP/salary-5707-formatted/asset_salary_confirmation_guard_test.dart"

      - name: Preserve resolved dependency evidence
        if: always() && steps.salary_dependencies.outputs.capture_started == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: salary-5707-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/salary-5707-dependencies/
          if-no-files-found: error
          retention-days: 1

      - name: Preserve formatted synthetic salary test and diff
        if: always() && steps.salary_format.outputs.prepared == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: salary-5707-formatted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/salary-5707-formatted/
          if-no-files-found: error
          retention-days: 1

      - name: Test in cloud
        if: env.CLOUD_PROFILE == 'full' || (env.CLOUD_PROFILE == 'test' && github.event_name != 'workflow_dispatch')
        run: flutter test --concurrency=2

      - name: Build Flutter Web in cloud
        id: web_build
        if: env.CLOUD_PROFILE == 'web-build' || env.CLOUD_PROFILE == 'full'
        run: flutter build web --release --pwa-strategy=none

      - name: Package verified Sea Shelter 3D assets
        if: env.CLOUD_PROFILE == 'web-build' || env.CLOUD_PROFILE == 'full'
        uses: ./.github/actions/prepare-sea-shelter-arena
        with:
          web-root: build/web

      - name: Preserve web build briefly
        if: steps.web_build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-web-build-${{ github.run_id }}
          path: build/web
          if-no-files-found: error
          retention-days: 1

      - name: Cloud execution summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Cloud Development Checks'
            echo ''
            echo '| Item | Value |'
            echo '| --- | --- |'
            echo "| profile | \`${CLOUD_PROFILE}\` |"
            echo "| ref | \`${GITHUB_REF}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| expected commit | \`${EXPECTED_HEAD_SHA:-event SHA}\` |"
            echo '| local Flutter/Dart work | none |'
            echo '| artifact retention | 1 day when a web build or formatter output runs |'
          } >> "$GITHUB_STEP_SUMMARY"

  platform-release-checklist-e2e:
    name: Platform release checklist E2E
    if: github.event_name == 'pull_request' || inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository-pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Resolve dependencies and build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none \
            --dart-define=ENVIRONMENT=visual-test \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run platform release checklist E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > checklist-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/platform_release_checklist.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0

      - name: Upload checklist E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: platform-release-checklist-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            checklist-server.log
          if-no-files-found: ignore

  ai-search-pending-e2e:
    name: Note search pending E2E
    if: github.event_name == 'pull_request' || inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository-pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Resolve dependencies and build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none --target=test/fixtures/ai_search_app.dart \
            --dart-define=ENVIRONMENT=visual-test \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run note search pending E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > search-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/ai_search_pending.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0

      - name: Upload note search E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-search-pending-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            search-server.log
          if-no-files-found: ignore

  slide-number-check-e2e:
    name: Slide number check E2E
    if: github.event_name == 'pull_request' || inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository-pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Resolve dependencies and build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none --target=test/fixtures/slide_number_check_app.dart \
            --dart-define=ENVIRONMENT=visual-test \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run note search pending E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > search-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/slide_number_check.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0

      - name: Upload note search E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slide-number-check-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            search-server.log
          if-no-files-found: ignore

  asset-balance-history-e2e:
    name: Balance timestamp and history E2E
    if: github.event_name == 'pull_request' || inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository-pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Resolve dependencies and build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none --target=test/fixtures/asset_balance_history_app.dart \
            --dart-define=ENVIRONMENT=visual-test \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run balance history pending E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > history-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/asset_balance_history.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0

      - name: Upload balance history E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-balance-history-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            history-server.log
          if-no-files-found: ignore

