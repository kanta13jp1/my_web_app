name: English formatting probe only (isolated)
on:
  push:
    branches: [codex/typing-english-public-validation-20261104]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.10'
      - run: flutter pub get
      - name: Format task files and emit exact source for synchronization
        run: |
          dart format lib/pages/typing_game_page.dart test/pages/typing_game_page_test.dart
          python - <<'PY'
          import json
          from pathlib import Path
          print("FORMATTED_PAGE_JSON="+json.dumps(Path("lib/pages/typing_game_page.dart").read_text()))
          print("FORMATTED_TEST_JSON="+json.dumps(Path("test/pages/typing_game_page_test.dart").read_text()))
          PY
