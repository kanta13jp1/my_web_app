# DRAFT ONLY. Not registered, dispatched, executed, or browser-tested.
# Fix proposal for run 40590751096: collect host sha256sum ELF dependencies.
# 156.0.8078.47 digest came from run 40580833335; it is a byte fingerprint,
# not an independently published Google checksum/signature.
# Draft adds synthetic-only Flutter/IndexedDB after the separate Chrome preflight.
# Conditional validation remains fail-closed; no unconditional stop. Not yet run.
name: Isolated Chrome fence journal v2 eleven case - draft
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: docker.io/library/ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
    steps:

      - name: Create disposable synthetic staging paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(lsb_release -rs)" = 24.04
          test "$(id -u)" -ne 0
          root="$(mktemp -d "$RUNNER_TEMP/cft-startup.XXXXXXXX")"
          mkdir -m 700 "$root/docker-config" "$root/runtime" "$root/runtime/page" "$root/lib"
          printf '%s\n' '<!doctype html><html><head><title>synthetic-cft-preflight</title></head><body>synthetic-only</body></html>' > "$root/runtime/page/index.html"
          echo "PROBE_ROOT=$root/runtime" >> "$GITHUB_ENV"
          echo "PROBE_TMP=$root" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$root/docker-config" >> "$GITHUB_ENV"
      - name: Fetch and verify fixed Chrome archive before any extraction
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          task_tmp="$(mktemp -d "$RUNNER_TEMP/cft-pinned.XXXXXXXX")"
          trap 'rm -rf -- "$task_tmp"' EXIT
          url='https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-linux64.zip'
          if ! env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/curl --disable --noproxy '*' \
            --silent --fail --proto '=https' --max-redirs 0 --connect-timeout 20 \
            --max-time 240 --max-filesize 200206486 --dump-header "$task_tmp/headers" \
            --output "$task_tmp/archive.zip" --write-out '%{http_code}\n%{url_effective}\n%{redirect_url}\n' \
            "$url" > "$task_tmp/response" 2>/dev/null; then
            echo 'Chrome archive fetch failed' >&2; exit 1
          fi
          env -i PATH=/usr/bin:/bin LC_ALL=C ARCHIVE="$task_tmp/archive.zip" \
            HEADERS="$task_tmp/headers" RESPONSE="$task_tmp/response" EXPECTED_URL="$url" \
            DEST="$PROBE_ROOT/chrome" /usr/bin/python3 - <<'PY'
          import hashlib, os, pathlib, shutil, stat, sys, zipfile
          def reject():
              raise SystemExit('Chrome archive verification failed')
          archive = pathlib.Path(os.environ['ARCHIVE'])
          response = pathlib.Path(os.environ['RESPONSE']).read_text('ascii').splitlines()
          if response != ['200', os.environ['EXPECTED_URL'], '']:
              reject()
          headers = pathlib.Path(os.environ['HEADERS']).read_bytes().decode('iso-8859-1').splitlines()
          lengths = [x.split(':', 1)[1].strip() for x in headers if x.lower().startswith('content-length:')]
          if any(x.lower().startswith('location:') for x in headers) or lengths != ['200206486']:
              reject()
          if archive.stat().st_size != 200206486:
              reject()
          digest = hashlib.sha256()
          with archive.open('rb') as src:
              for block in iter(lambda: src.read(1024 * 1024), b''):
                  digest.update(block)
          if digest.hexdigest() != 'e6c94490f0b6b337225aeb2d2a5034858516b7017356980ba94f5176d8774a50':
              reject()
          destination = pathlib.Path(os.environ['DEST'])
          if destination.exists() or destination.is_symlink():
              reject()
          with zipfile.ZipFile(archive) as z:
              members = z.infolist()
              if len(members) > 10000 or sum(m.file_size for m in members) > 1_500_000_000:
                  reject()
              seen = set()
              for member in members:
                  name = member.filename
                  p = pathlib.PurePosixPath(name)
                  mode = member.external_attr >> 16
                  kind = stat.S_IFMT(mode)
                  if ('\\' in name or p.is_absolute() or '..' in p.parts or not p.parts or
                      p.parts[0] != 'chrome-linux64' or name in seen or
                      kind not in (0, stat.S_IFREG, stat.S_IFDIR) or
                      (member.is_dir() and kind == stat.S_IFREG) or
                      (not member.is_dir() and kind == stat.S_IFDIR)):
                      reject()
                  seen.add(name)
              if 'chrome-linux64/chrome' not in seen or 'chrome-linux64/deb.deps' not in seen:
                  reject()
              destination.mkdir(parents=True, mode=0o700)
              for member in members:
                  parts = pathlib.PurePosixPath(member.filename).parts[1:]
                  if not parts:
                      continue
                  target = destination.joinpath(*parts)
                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(member) as src, target.open('xb') as dst:
                          shutil.copyfileobj(src, dst, 1024 * 1024)
                      target.chmod(0o755 if (member.external_attr >> 16) & 0o111 else 0o644)
          PY
          test -x "$PROBE_ROOT/chrome/chrome"
          test -f "$PROBE_ROOT/chrome/deb.deps"
          # deb.deps is declarative input, never shell code. The runner package
          # provenance and copied library closure still require review.
      - name: Check out only for reading fingerprinted synthetic inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic-inputs
          persist-credentials: false
      - name: Prepare pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.10'
          cache: false
      - name: Prepare fresh synthetic project and public package cache
        shell: bash
        run: |
          set -euo pipefail
          d="$GITHUB_WORKSPACE/diagnostic-inputs/diagnostics/ordered_patch_work"
          echo '51f49401da45d495d0d1570a45a0de2e94efb6641932a5c86c0573a31befa57a  '"$d/debt_idb_fence_journal_v2_DRAFT.dart" | sha256sum -c -
          echo '29a8fa0e2538abe411c5475203ba8a660f910fa88009512af0d07458fe095214  '"$d/debt_idb_fence_journal_v2_DRAFT_test.dart" | sha256sum -c -
          project="$PROBE_TMP/synthetic-project"
          sdk="$PROBE_TMP/flutter-sdk"
          cache="$PROBE_TMP/pub-cache"
          test ! -e "$project" && test ! -e "$sdk" && test ! -e "$cache"
          mkdir -p "$project/test/idb_synthetic" "$project/.tools/git-runtime" "$cache" "$PROBE_TMP/xdg"
          cp -a -- "$FLUTTER_ROOT" "$sdk"
          cp -- "$d/debt_idb_fence_journal_v2_DRAFT.dart" \
            "$d/debt_idb_fence_journal_v2_DRAFT_test.dart" "$project/test/idb_synthetic/"
          echo '51f49401da45d495d0d1570a45a0de2e94efb6641932a5c86c0573a31befa57a  '"$project/test/idb_synthetic/debt_idb_fence_journal_v2_DRAFT.dart" | sha256sum -c -
          echo '29a8fa0e2538abe411c5475203ba8a660f910fa88009512af0d07458fe095214  '"$project/test/idb_synthetic/debt_idb_fence_journal_v2_DRAFT_test.dart" | sha256sum -c -
          cat > "$project/pubspec.yaml" <<'PUBSPEC'
          name: isolated_idb_synthetic_probe
          publish_to: none
          environment:
            sdk: '>=3.8.0 <4.0.0'
          dependencies:
            web: 1.1.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
          PUBSPEC
          # The checkout itself and its .git credentials are never mounted.
          # No default Flutter action cache or real application project is used.
          test "$(git -C "$sdk" rev-parse HEAD)" = c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
          if git -C "$sdk" config --local --get-regexp '(^http\..*\.extraheader$|^credential\.|^url\..*\.insteadof$)' >/dev/null; then exit 1; fi
          if git -C "$sdk" config --local --get-regexp '^remote\..*\.url$' | grep -Eq 'https?://[^/]*@'; then exit 1; fi
          cp -L -- "$(command -v git)" "$project/.tools/git-runtime/git"
          cat > "$project/.tools/git" <<'WRAPPER'
          #!/bin/sh
          exec "$WORKSPACE_BASE/.tools/git-runtime/git" "$@"
          WRAPPER
          chmod 0755 "$project/.tools/git"
          cat > "$project/.tools/chrome-synthetic" <<'WRAPPER'
          #!/bin/sh
          set -eu
          chrome=/probe/chrome/chrome
          if [ "$#" -eq 1 ] && [ "$1" = '--version' ]; then exec "$chrome" "$@"; fi
          count=0
          sandbox=0
          targets=0
          profile=
          target=
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*) count=$((count+1)); profile=${arg#--user-data-dir=};;
              --no-sandbox) sandbox=$((sandbox+1));;
              http://*|https://*) targets=$((targets+1)); target=$arg;;
            esac
          done
          [ "$count" -eq 1 ] && [ "$sandbox" -eq 1 ] && [ "$targets" -eq 1 ]
          printf '%s\n' "$target" | grep -Eq '^http://(localhost|127[.]0[.]0[.]1):[0-9]{1,5}/static/index[.]html[?][A-Za-z0-9_=&.%~-]+$' || exit 1
          profile=$(realpath -e "$profile")
          case "$profile" in "$TMPDIR"/flutter_tools_chrome_device.*|"$TMPDIR"/*/flutter_tools_chrome_device.*) ;; *) exit 1;; esac
          [ -d "$profile" ] && [ -O "$profile" ]
          [ -z "$(find "$profile" -mindepth 1 -maxdepth 1 -print -quit)" ]
          exec "$chrome" "$@"
          WRAPPER
          chmod 0755 "$project/.tools/chrome-synthetic"
          # Only public SDK and synthetic packages are fetched during setup.
          # The browser and test phase below has no network. This fresh lock is
          # evidence of this run, not an independently reviewed fixed lockfile.
          env -i PATH="/usr/bin:/bin:$sdk/bin" FLUTTER_ROOT="$sdk" PUB_CACHE="$cache" \
            XDG_CACHE_HOME="$PROBE_TMP/xdg" CI=true GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$sdk/bin/flutter" precache --web
          cd "$project"
          env -i PATH="/usr/bin:/bin:$sdk/bin" FLUTTER_ROOT="$sdk" PUB_CACHE="$cache" \
            XDG_CACHE_HOME="$PROBE_TMP/xdg" CI=true GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$sdk/bin/flutter" pub get
          test -f pubspec.lock
          sha256sum pubspec.lock | awk '{print "synthetic_pubspec_lock_sha256=" $1}'
          # Verify resolved package roots are exactly within isolated sources.
          env -i PATH=/usr/bin:/bin /usr/bin/python3 - "$project" "$sdk" "$cache" <<'PY'
          import json, pathlib, sys, urllib.parse
          roots = [pathlib.Path(x).resolve(strict=True) for x in sys.argv[1:]]
          config = roots[0] / '.dart_tool/package_config.json'
          packages = json.loads(config.read_text(encoding='utf-8'))['packages']
          found_web = False
          for package in packages:
              uri = urllib.parse.urljoin(config.as_uri(), package['rootUri'])
              parsed = urllib.parse.urlparse(uri)
              if parsed.scheme != 'file' or parsed.netloc not in ('', 'localhost'):
                  raise SystemExit('Unexpected package URI')
              path = pathlib.Path(urllib.parse.unquote(parsed.path)).resolve(strict=True)
              if not any(path == root or root in path.parents for root in roots):
                  raise SystemExit('Package root outside isolated mounts')
              if package['name'] == 'web':
                  found_web = path == roots[2] / 'hosted/pub.dev/web-1.1.1'
          if not found_web:
              raise SystemExit('Unexpected web package version or source')
          PY
          # Bounded scan: no sockets, FIFOs, escaping links or obvious secret
          # filenames in mounted trees. This cannot prove arbitrary contents clean.
          env -i PATH=/usr/bin:/bin /usr/bin/python3 - "$project" "$sdk" "$cache" <<'PY'
          import os, pathlib, stat, sys
          for raw in sys.argv[1:]:
              root = pathlib.Path(raw).resolve(strict=True)
              for directory, dirs, files in os.walk(root, followlinks=False):
                  for name in dirs + files:
                      path = pathlib.Path(directory) / name
                      mode = path.lstat().st_mode
                      if stat.S_ISSOCK(mode) or stat.S_ISFIFO(mode):
                          raise SystemExit('Special file in mounted tree')
                      if path.is_symlink():
                          resolved = path.resolve(strict=True)
                          if root != resolved and root not in resolved.parents:
                              raise SystemExit('Symlink escapes mounted tree')
                      lowered = name.lower()
                      if lowered in {'.netrc', '.npmrc', '.pypirc', 'credentials', 'id_rsa', 'id_ed25519'} or lowered.startswith('.env'):
                          raise SystemExit('Credential-like filename in mounted tree')
          PY
          # Avoid Flutter's version freshness network check in the isolated phase.
          printf '{"lastTimeVersionWasChecked":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$sdk/bin/cache/flutter_version_check.stamp"
          echo "WORKSPACE_BASE=$project" >> "$GITHUB_ENV"
          echo "FLUTTER_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$cache" >> "$GITHUB_ENV"
      - name: Check package requirements and stage only system shared libraries
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-checkbuilddeps >/dev/null
          command -v readelf >/dev/null
          deps="$PROBE_ROOT/chrome/deb.deps"
          # This normalized list is an observation from the same archive fetch,
          # not independent authentication of the package or this archive.
          env -i PATH=/usr/bin:/bin /usr/bin/python3 - "$deps" <<'PY'
          import hashlib, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='ascii')
          canonical = '\n'.join(text.splitlines()).encode('ascii')
          if hashlib.sha256(canonical).hexdigest() != '68e3435b6ea4e9b6be1a042734194b19f15571e7bd58ae7e23c1b1e39b1c7a09':
              raise SystemExit('Observed deb.deps contents differ')
          PY
          # dpkg interprets alternatives and version constraints; no eval or apt.
          # A mismatch, including unsupported virtual/t64 alternatives, is fatal.
          dep_expr=$(paste -sd, "$deps")
          printf 'Source: synthetic-chrome-preflight\nBuild-Depends: %s\n' "$dep_expr" > "$PROBE_TMP/debian-control"
          # Only the implicit distro build toolchain is irrelevant to running a
          # prebuilt browser. Explicit Build-Depends below are all still checked.
          # Clear build-profile/architecture overrides from the runner environment.
          env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/dpkg-checkbuilddeps -I "$PROBE_TMP/debian-control"
          # Enumerate ELF DT_NEEDED without starting Chrome or its loader.
          # Resolve only runner multiarch system libs, recursively; copy bytes
          # by exact SONAME into a new directory, no host home/config/socket.
          # dlopen modules are not inferred and missing runtime deps fail closed.
          env -i PATH=/usr/bin:/bin FLUTTER_ROOT="$FLUTTER_ROOT" /usr/bin/python3 - "$PROBE_ROOT/chrome/chrome" "$PROBE_TMP/lib" <<'PY'
          import os, pathlib, re, shutil, subprocess, sys
          chrome = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          root = pathlib.Path('/usr/lib/x86_64-linux-gnu').resolve(strict=True)
          cache = subprocess.run(['/usr/sbin/ldconfig', '-p'], check=True, capture_output=True, text=True).stdout
          index = {}
          for line in cache.splitlines():
              match = re.match(r'\s*(\S+)\s+\(.*x86-64.*\)\s+=>\s+(\S+)\s*$', line)
              if not match:
                  continue
              try:
                  real = pathlib.Path(match.group(2)).resolve(strict=True)
              except OSError:
                  continue
              if root in real.parents and real.is_file():
                  index.setdefault(match.group(1), set()).add(real)
          # Container tools used by preflight also need their ELF libraries.
          programs = ['/bin/bash', '/usr/bin/awk', '/usr/bin/grep', '/usr/bin/readlink',
                      '/usr/bin/ls', '/usr/bin/find', '/usr/bin/id', '/usr/bin/mkdir',
                      '/usr/bin/timeout', '/usr/bin/git', '/usr/bin/realpath', '/usr/bin/cat', '/usr/bin/date', '/usr/bin/rm', '/usr/bin/chmod', '/usr/bin/sha256sum', os.environ['FLUTTER_ROOT'] + '/bin/cache/dart-sdk/bin/dart']
          queue = [chrome] + [pathlib.Path(p).resolve(strict=True) for p in programs]
          queue.append(root / 'ld-linux-x86-64.so.2')
          examined = set()
          copied = set()
          while queue:
              item = queue.pop()
              real = item.resolve(strict=True)
              if real in examined:
                  continue
              examined.add(real)
              result = subprocess.run(['/usr/bin/readelf', '-d', str(real)],
                                      check=True, capture_output=True, text=True)
              needed = re.findall(r'\(NEEDED\).*?\[([^\]]+)\]', result.stdout)
              for name in needed:
                  if '/' in name or name in copied:
                      if '/' in name:
                          raise SystemExit('Unsafe SONAME')
                      continue
                  options = index.get(name, set())
                  if len(options) != 1:
                      safe = name if re.fullmatch(r'[A-Za-z0-9_.+-]{1,128}', name) else '<invalid-soname>'
                      raise SystemExit(f'Unresolved or ambiguous system library: {safe}; candidates={len(options)}')
                  source = next(iter(options))
                  shutil.copyfile(source, output / name)
                  (output / name).chmod(0o555)
                  copied.add(name)
                  queue.append(source)
          loader = root / 'ld-linux-x86-64.so.2'
          loader_target = output / loader.name
          if loader_target.exists():
              if loader_target.read_bytes() != loader.read_bytes():
                  raise SystemExit('Ambiguous ELF loader')
          else:
              shutil.copyfile(loader, loader_target)
              loader_target.chmod(0o555)
          PY
          env -i PATH=/usr/bin:/bin /usr/bin/python3 - "$PROBE_TMP/lib" "$PROBE_ROOT" <<'PY'
          import os, pathlib, stat, sys
          for raw in sys.argv[1:]:
              root = pathlib.Path(raw).resolve(strict=True)
              for directory, dirs, files in os.walk(root, followlinks=False):
                  for name in dirs + files:
                      p = pathlib.Path(directory) / name
                      mode = p.lstat().st_mode
                      if stat.S_ISSOCK(mode) or stat.S_ISFIFO(mode) or stat.S_ISCHR(mode) or stat.S_ISBLK(mode):
                          raise SystemExit('Unexpected special file in staging')
                      if p.is_symlink():
                          target = p.resolve(strict=True)
                          if target != root and root not in target.parents:
                              raise SystemExit('Symlink escapes staging')
          PY
      - name: Pull pinned public base without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DOCKER_CONFIG/config.json"
          docker pull --platform=linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          docker image inspect "$IMAGE" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; assert any(x.endswith("@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc") for x in (d.get("RepoDigests") or []))'
      - name: Start Chrome only in non-root, no-network, disposable profile
        shell: bash
        run: |
          set -euo pipefail
          host_netns="$(readlink /proc/self/ns/net)"
          uidgid="$(id -u):$(id -g)"
          cid="$(docker create --pull=never --network=none --platform=linux/amd64 \
            --user "$uidgid" --cap-drop=ALL --security-opt=no-new-privileges:true \
            --read-only --pids-limit=256 --memory=2g --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1024m,mode=1777 --tmpfs /.dart-tool:rw,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,src=$PROBE_ROOT,dst=/probe,readonly" \
            --mount "type=bind,src=$PROBE_TMP/lib,dst=/usr/lib/x86_64-linux-gnu,readonly" \
            --mount "type=bind,src=$WORKSPACE_BASE,dst=$WORKSPACE_BASE" \
            --mount "type=bind,src=$FLUTTER_ROOT,dst=$FLUTTER_ROOT" \
            --mount "type=bind,src=$PUB_CACHE,dst=$PUB_CACHE,readonly" \
            --workdir "$WORKSPACE_BASE" \
            --env WORKSPACE_BASE="$WORKSPACE_BASE" --env FLUTTER_ROOT="$FLUTTER_ROOT" --env PUB_CACHE="$PUB_CACHE" \
            --env CHROME_EXECUTABLE="$WORKSPACE_BASE/.tools/chrome-synthetic" \
            --env CI=true --env GIT_CONFIG_NOSYSTEM=1 --env GIT_CONFIG_GLOBAL=/dev/null --env GIT_TERMINAL_PROMPT=0 \
            --env PATH="$WORKSPACE_BASE/.tools:$FLUTTER_ROOT/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env HOST_NETNS="$host_netns" --env XDG_CACHE_HOME=/tmp/cache \
            --env XDG_CONFIG_HOME=/tmp/config --env TMPDIR=/tmp/idb-browser \
            "$IMAGE" /bin/bash -ec '
              test "$(id -u)" -ne 0
              test "$(awk "/^NoNewPrivs:/ {print \$2}" /proc/self/status)" = 1
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = 0000000000000000
              test "$(readlink /proc/self/ns/net)" != "$HOST_NETNS"
              test "$(ls -1 /sys/class/net)" = lo
              awk "NR > 1 && \$1 != \"lo\" {exit 1}" /proc/net/route
              awk "\$NF != \"lo\" {exit 1}" /proc/net/ipv6_route
              test ! -e /var/run/docker.sock
              test ! -e /dev/dri
              test -x /probe/chrome/chrome
              test -f /probe/page/index.html
              # Check dynamic dependencies in isolation; dlopen resources are not
              # proven by ldd. A missing library ends the job immediately.
              if ldd /probe/chrome/chrome > /tmp/chrome-ldd 2>/tmp/ldd-stderr; then ldd_rc=0; else ldd_rc=$?; fi
              # Print only bounded safe SONAME tokens, not host paths or stderr.
              awk "\$2 == \"=>\" && \$3 == \"not\" && \$4 == \"found\" && \$1 ~ /^[A-Za-z0-9_.+-]+$/ && length(\$1) <= 128 {print \"Missing ELF library: \" \$1}" /tmp/chrome-ldd
              if [ "$ldd_rc" -ne 0 ] || grep -q "not found" /tmp/chrome-ldd; then echo "Chrome ELF dependency check failed (ldd exit $ldd_rc)" >&2; exit 1; fi
              mkdir -m 0700 /tmp/profile /tmp/cache /tmp/config "$TMPDIR"
              test -O /tmp/profile
              test -z "$(find /tmp/profile -mindepth 1 -maxdepth 1 -print -quit)"
              # First browser process is version, second is one local synthetic
              # file. There is no Flutter, test runner, IndexedDB or network.
              if timeout 30s /probe/chrome/chrome --version > /tmp/version 2>/tmp/version-stderr; then version_rc=0; else version_rc=$?; fi
              if [ "$version_rc" -ne 0 ]; then
                if [ "$version_rc" -eq 124 ]; then echo "Chrome version timed out" >&2; else echo "Chrome version failed (exit $version_rc; stderr withheld)" >&2; fi
                exit 1
              fi
              grep -Eq "156[.]0[.]8078[.]47([[:space:]]|$)" /tmp/version
              if timeout 60s /probe/chrome/chrome --headless=new --no-sandbox \
                --disable-gpu --disable-dev-shm-usage --disable-background-networking \
                --disable-breakpad --disable-crash-reporter --no-first-run \
                --no-default-browser-check --user-data-dir=/tmp/profile \
                --dump-dom file:///probe/page/index.html > /tmp/dom 2>/tmp/chrome-stderr; then browser_rc=0; else browser_rc=$?; fi
              if [ "$browser_rc" -ne 0 ]; then
                if [ "$browser_rc" -eq 124 ]; then echo "Chrome headless startup timed out" >&2; else echo "Chrome headless startup failed (exit $browser_rc; stderr withheld)" >&2; fi
                if grep -q "error while loading shared libraries" /tmp/chrome-stderr; then
                  echo "Chrome dynamic loader reported a library error" >&2
                  awk -F ": " "\$2 == \"error while loading shared libraries\" && \$3 ~ /^[A-Za-z0-9_.+-]+$/ && length(\$3) <= 128 {print \"Loader library: \" \$3}" /tmp/chrome-stderr
                fi
                exit 1
              fi
