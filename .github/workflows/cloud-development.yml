          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "$uidgid"
          docker inspect "$cid" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; h=d["HostConfig"]; m=d["Mounts"]; assert "ALL" in h["CapDrop"]; assert any("no-new-privileges" in x for x in h["SecurityOpt"]); assert not h.get("PortBindings"); assert {x["Destination"] for x in m if x["Type"]=="bind"} == {"/probe", "/usr/lib/x86_64-linux-gnu", sys.argv[1], sys.argv[2], sys.argv[3]}; assert all(not x["RW"] for x in m if x["Type"]=="bind" and x["Destination"] in {"/probe", "/usr/lib/x86_64-linux-gnu", sys.argv[3]}); assert all(x["Type"] in ("bind", "tmpfs") for x in m); assert set((h.get("Tmpfs") or {}).keys()) == {"/tmp", "/.dart-tool"}' "$WORKSPACE_BASE" "$FLUTTER_ROOT" "$PUB_CACHE"
          # Inspect names only; do not print inherited values. Unknown image
          # environment variables stop the run rather than enter the container.
          docker inspect "$cid" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; names={x.split("=",1)[0] for x in (d["Config"].get("Env") or [])}; allowed={"PATH","HOST_NETNS","XDG_CACHE_HOME","XDG_CONFIG_HOME","TMPDIR","WORKSPACE_BASE","FLUTTER_ROOT","PUB_CACHE","CHROME_EXECUTABLE","CI","GIT_CONFIG_NOSYSTEM","GIT_CONFIG_GLOBAL","GIT_TERMINAL_PROMPT"}; assert names <= allowed'
