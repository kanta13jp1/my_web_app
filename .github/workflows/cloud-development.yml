name: Cloud Development Checks
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
      profile:
        required: true
        default: full
        type: string
permissions:
  contents: read
jobs:
  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: flutter pub get
      - name: Format candidate and preserve patch
        run: |
          dart format lib/models/typing_game.dart lib/pages/typing_game_page.dart test/models/typing_game_test.dart test/pages/typing_game_page_test.dart test/fixtures/typing_game_app.dart
          git diff > typing-format.patch
      - name: Analyze typing implementation
        run: flutter analyze lib/models/typing_game.dart lib/pages/typing_game_page.dart test/models/typing_game_test.dart test/pages/typing_game_page_test.dart test/fixtures/typing_game_app.dart
      - name: Typing model and widget tests
        run: flutter test test/models/typing_game_test.dart test/pages/typing_game_page_test.dart --concurrency=1
      - name: Build standalone game
        run: flutter build web --release --pwa-strategy=none --target=test/fixtures/typing_game_app.dart
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Desktop and emulated mobile browser input
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > typing-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/typing_game.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0
      - name: Build integrated app
        run: flutter build web --release --pwa-strategy=none --dart-define=ENVIRONMENT=visual-test --dart-define=SUPABASE_URL=http://127.0.0.1:54321 --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typing-validation
          path: |
            typing-format.patch
            test-results/
            playwright-report/
            typing-server.log
          retention-days: 7
