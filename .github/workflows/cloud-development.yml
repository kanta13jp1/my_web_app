name: Cloud Development Checks
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
      profile:
        required: true
        default: workspace
        type: string
permissions: {}
jobs:
  flow-input-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_head_sha }}
      - name: Verify exact head
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Dependencies and focused analysis
        run: |
          set -euo pipefail
          mkdir -p .ci-logs/flow-input
          flutter pub get
          dart format test/widgets/asset_flow_input_retention_probe_test.dart test/probes/flow_input_probe_main.dart
          cp test/widgets/asset_flow_input_retention_probe_test.dart .ci-logs/flow-input/
          cp test/probes/flow_input_probe_main.dart .ci-logs/flow-input/
          flutter analyze --no-pub test/widgets/asset_flow_input_retention_probe_test.dart test/probes/flow_input_probe_main.dart
      - name: Actual page controller regression
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/widgets/asset_flow_input_retention_probe_test.dart 2>&1 | tee .ci-logs/flow-input/widget.log
      - name: Compile isolated synthetic page
        if: ${{ !cancelled() }}
        run: flutter build web --release --no-pub --pwa-strategy=none --no-web-resources-cdn --target test/probes/flow_input_probe_main.dart
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ !cancelled() }}
        with:
          node-version: '22'
          cache: npm
      - name: Browser input event probe
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          npm ci
          python3 -m http.server 8080 --directory build/web > .ci-logs/flow-input/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node test/probes/flow_input_probe.mjs 2>&1 | tee .ci-logs/flow-input/browser.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: flow-input-${{ github.run_id }}
          path: .ci-logs/flow-input
          include-hidden-files: true
          retention-days: 7
