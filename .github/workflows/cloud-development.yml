# SYNTHETIC DIAGNOSTIC ONLY. Independent review required before dispatch.
name: Salary CLI lock contention fixture (diagnostic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit
        required: true
        type: string
      profile:
        description: Diagnostic profile
        required: true
        type: choice
        options: [test, analyze]
permissions: {}
jobs:
  synthetic-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_DB: salary_identity_isolated
          POSTGRES_PASSWORD: test-only
        options: >-
          --health-cmd "pg_isready -h /var/run/postgresql -U postgres -d salary_identity_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify inputs and exact job-owned service
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          [[ "$SERVICE_ID" =~ ^[0-9a-f]{64}$ ]]
          image="$(docker inspect --format '{{.Config.Image}}' "$SERVICE_ID")"
          test "$image" = 'postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1'
          cd diagnostics/salary_cli
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = '9'
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = '9'
          printf '%s\n' '0dd0d961b9426bfeb2e03876df8f601dd8f5758aede580909510e47c1f0b1272  08_candidate.sql' 'a30f9b2c16b64f960d188031dd61f897c4e6a7309d74ca850596663583ddf56f  04_fixture.sql' '2bb9875224dac72e1f590385c03ded4919c4e7e9209fb8ce33f85d1d9a6597b2  05_guard.sql' '2734d6ff2081d03a972f432da464423c8da2c26e8730b6eef02960415a94fe76  06_observe.sql' 'fe235a81a279e03833d309d41c660b6e7b0c9bf2bbf9c48c10bbdfc2ff88eda0  09_audit.sql' '7c1dbb949a0462b397eda91795f24fcfe6d62c7aac5bcf3d3b0923ce19eac212  10_control.sql' '69d21042db2d1ec6f92b12a6b4ee580fdb2984eaf3e48fa144d22fa0008a7826  11_audit_observe.sql' 'cff4a114078d2661f5a4bbf6c8796c7f202ef96afd4d720743f581dec4d9d99c  12_delay.sql' 'b88ba0252280b8b5d920b414728cb0b3663eaec3942d6b5acbe1bd4a7fc558c8  13_lock_observe.sql' | sha256sum -c -
      - name: Obtain and verify fixed official CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL 'https://github.com/supabase/cli/releases/download/v2.84.2/supabase_linux_amd64.tar.gz' -o "$RUNNER_TEMP/salary-cli.tar.gz"
          printf '%s\n' '620a5f6ea7b60f9b4fe112a5d72464ea0e53d04022035641674a2e6d121e0eb5  '"$RUNNER_TEMP"'/salary-cli.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/salary-cli"
          tar -xzf "$RUNNER_TEMP/salary-cli.tar.gz" -C "$RUNNER_TEMP/salary-cli" supabase
          test -f "$RUNNER_TEMP/salary-cli/supabase"
      - name: Run isolated guarded lock contention and observe
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
          CASE_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[0-9a-f]{64}$ ]]
          case "$CASE_PROFILE" in test|analyze) ;; *) exit 1 ;; esac
          test "$(docker inspect --format '{{.Config.Image}}' "$SERVICE_ID")" = 'postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1'
          docker exec -u postgres "$SERVICE_ID" mkdir /tmp/salary-cli-lab
          docker exec -u postgres "$SERVICE_ID" mkdir -p /tmp/salary-cli-lab/home /tmp/salary-cli-lab/files /tmp/salary-cli-lab/bin
          docker cp "$RUNNER_TEMP/salary-cli/supabase" "$SERVICE_ID:/tmp/salary-cli-lab/bin/supabase"
          docker cp diagnostics/salary_cli/. "$SERVICE_ID:/tmp/salary-cli-lab/files/"
          source_hash="$(sha256sum "$RUNNER_TEMP/salary-cli/supabase" | cut -d ' ' -f1)"
          copied_hash="$(docker exec -u postgres "$SERVICE_ID" sha256sum /tmp/salary-cli-lab/bin/supabase | cut -d ' ' -f1)"
          test "$source_hash" = "$copied_hash"
          docker exec -u postgres "$SERVICE_ID" sh -c 'cd /tmp/salary-cli-lab/files && printf "%s\n" "0dd0d961b9426bfeb2e03876df8f601dd8f5758aede580909510e47c1f0b1272  08_candidate.sql" "a30f9b2c16b64f960d188031dd61f897c4e6a7309d74ca850596663583ddf56f  04_fixture.sql" "2bb9875224dac72e1f590385c03ded4919c4e7e9209fb8ce33f85d1d9a6597b2  05_guard.sql" "2734d6ff2081d03a972f432da464423c8da2c26e8730b6eef02960415a94fe76  06_observe.sql" "fe235a81a279e03833d309d41c660b6e7b0c9bf2bbf9c48c10bbdfc2ff88eda0  09_audit.sql" "7c1dbb949a0462b397eda91795f24fcfe6d62c7aac5bcf3d3b0923ce19eac212  10_control.sql" "69d21042db2d1ec6f92b12a6b4ee580fdb2984eaf3e48fa144d22fa0008a7826  11_audit_observe.sql" "cff4a114078d2661f5a4bbf6c8796c7f202ef96afd4d720743f581dec4d9d99c  12_delay.sql" "b88ba0252280b8b5d920b414728cb0b3663eaec3942d6b5acbe1bd4a7fc558c8  13_lock_observe.sql" | sha256sum -c -'
          docker exec -u postgres "$SERVICE_ID" /usr/bin/env -i HOME=/tmp/salary-cli-lab/home PATH=/usr/local/bin:/usr/bin:/bin /tmp/salary-cli-lab/bin/supabase --version | grep -Fx '2.84.2'
          docker exec -u postgres "$SERVICE_ID" /usr/bin/env -i HOME=/tmp/salary-cli-lab/home PATH=/usr/local/bin:/usr/bin:/bin /tmp/salary-cli-lab/bin/supabase init --yes --workdir /tmp/salary-cli-lab
          docker exec -u postgres "$SERVICE_ID" mkdir -p /tmp/salary-cli-lab/supabase/migrations
          docker exec -u postgres "$SERVICE_ID" cp /tmp/salary-cli-lab/files/08_candidate.sql /tmp/salary-cli-lab/supabase/migrations/20261104000001_identity.sql
          docker exec -u postgres "$SERVICE_ID" sh -c 'printf "%s\n" "0dd0d961b9426bfeb2e03876df8f601dd8f5758aede580909510e47c1f0b1272  /tmp/salary-cli-lab/supabase/migrations/20261104000001_identity.sql" | sha256sum -c -'
          docker exec -u postgres -e PGOPTIONS='-c salary_test.isolated=disposable-pg17-only' "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/04_fixture.sql
          docker exec -u postgres -e PGOPTIONS='-c salary_test.isolated=disposable-pg17-only' -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/05_guard.sql
          docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/09_audit.sql
          docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/10_control.sql
          if [ "$CASE_PROFILE" = analyze ]; then
            docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/12_delay.sql
            hold_seconds=45
          else
            hold_seconds=12
          fi
          query() { docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -qAt -h 127.0.0.1 -U postgres -d salary_identity_isolated -c "$1"; }
          holder_shell_pid=''
          cli_shell_pid=''
          child_wait_exhausted=0
          cleanup_owned_children() {
            if [ "$child_wait_exhausted" -eq 0 ]; then
              for ((cleanup_attempt=0; cleanup_attempt<116; cleanup_attempt++)); do
                jobs -pr > "$RUNNER_TEMP/salary-live-jobs"
                active=0
                for child in "$holder_shell_pid" "$cli_shell_pid"; do
                  if [ -n "$child" ] && grep -Fxq "$child" "$RUNNER_TEMP/salary-live-jobs"; then active=1; fi
                done
                [ "$active" -eq 0 ] && break
                sleep 0.5
              done
            fi
            jobs -pr > "$RUNNER_TEMP/salary-live-jobs"
            for child in "$holder_shell_pid" "$cli_shell_pid"; do
              [ -z "$child" ] && continue
              if grep -Fxq "$child" "$RUNNER_TEMP/salary-live-jobs"; then
                echo "owned synthetic child $child still active; post-job cleanup unconfirmed" >&2
              else
                wait "$child" || true
              fi
            done
          }
          trap cleanup_owned_children EXIT
          docker exec -u postgres -e PGAPPNAME=salary_fixture_holder -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -c "BEGIN; SET LOCAL statement_timeout='55s'; LOCK TABLE public.cfo_assets IN ACCESS SHARE MODE; SELECT pg_sleep($hold_seconds); COMMIT;" > "$RUNNER_TEMP/salary-holder.log" 2>&1 &
          holder_shell_pid=$!
          holder_signature=''
          for ((attempt=0; attempt<20; attempt++)); do
            holder_signature="$(query "SELECT a.pid || '|' || (extract(epoch FROM a.backend_start)*1000000)::bigint FROM pg_catalog.pg_stat_activity a JOIN pg_catalog.pg_locks l ON l.pid=a.pid WHERE a.datname=current_database() AND a.application_name='salary_fixture_holder' AND a.state='active' AND a.wait_event='PgSleep' AND clock_timestamp()-a.query_start < interval '5 seconds' AND l.relation=to_regclass('public.cfo_assets') AND l.mode='AccessShareLock' AND l.granted")"
            [[ "$holder_signature" =~ ^[0-9]+\|[0-9]+$ ]] && break
            sleep 0.2
          done
          [[ "$holder_signature" =~ ^[0-9]+\|[0-9]+$ ]] || { echo 'synthetic holder not established: inconclusive'; exit 1; }
          holder_pid="${holder_signature%%|*}"
          holder_start="${holder_signature#*|}"
          echo "synthetic holder pid,start=$holder_signature profile=$CASE_PROFILE"
          docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/13_lock_observe.sql
          set +e
          docker exec -u postgres "$SERVICE_ID" /usr/bin/env -i HOME=/tmp/salary-cli-lab/home PATH=/usr/local/bin:/usr/bin:/bin PGSSLMODE=disable PGAPPNAME=salary_fixture_cli /tmp/salary-cli-lab/bin/supabase db push --yes --workdir /tmp/salary-cli-lab --db-url 'postgresql://postgres:test-only@127.0.0.1:5432/salary_identity_isolated?sslmode=disable' > "$RUNNER_TEMP/salary-cli-result.log" 2>&1 &
          cli_shell_pid=$!
          set -e
          waiter=''
          for ((attempt=0; attempt<150; attempt++)); do
            waiter="$(query "SELECT a.pid || '|' || (extract(epoch FROM a.backend_start)*1000000)::bigint || '|' || l.mode || '|' || coalesce(l.waitstart::text,'') || '|' || coalesce(a.query_start::text,'') FROM pg_catalog.pg_stat_activity a JOIN pg_catalog.pg_locks l ON l.pid=a.pid JOIN pg_catalog.pg_stat_activity h ON h.pid=$holder_pid AND h.application_name='salary_fixture_holder' AND (extract(epoch FROM h.backend_start)*1000000)::bigint=$holder_start WHERE a.datname=current_database() AND a.application_name='salary_fixture_cli' AND a.wait_event_type='Lock' AND l.relation=to_regclass('public.cfo_assets') AND l.mode='AccessExclusiveLock' AND NOT l.granted AND h.pid=ANY(pg_catalog.pg_blocking_pids(a.pid))")"
            [[ "$waiter" =~ ^[0-9]+\| ]] && break
            if grep -q 'ERROR:' "$RUNNER_TEMP/salary-cli-result.log"; then break; fi
            sleep 0.25
          done
          echo "synthetic waiter=$waiter holder=$holder_pid"
          if [[ "$waiter" =~ ^[0-9]+\| ]]; then
            docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/13_lock_observe.sql
          fi
          both_finished=0
          for ((finish_attempt=0; finish_attempt<116; finish_attempt++)); do
            jobs -pr > "$RUNNER_TEMP/salary-live-jobs"
            if ! grep -Fxq "$cli_shell_pid" "$RUNNER_TEMP/salary-live-jobs" && ! grep -Fxq "$holder_shell_pid" "$RUNNER_TEMP/salary-live-jobs"; then both_finished=1; break; fi
            sleep 0.5
          done
          if [ "$both_finished" -ne 1 ]; then
            child_wait_exhausted=1
            echo 'owned synthetic children did not finish within bound: inconclusive' >&2
            exit 1
          fi
          set +e
          wait "$cli_shell_pid"; cli_status=$?
          wait "$holder_shell_pid"; holder_status=$?
          set -e
          cat "$RUNNER_TEMP/salary-cli-result.log"
          cat "$RUNNER_TEMP/salary-holder.log"
          docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/06_observe.sql
          docker exec -u postgres -e PGPASSWORD=test-only -e PGSSLMODE=disable "$SERVICE_ID" psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d salary_identity_isolated -f /tmp/salary-cli-lab/files/11_audit_observe.sql
          state="$(query "SELECT (to_regclass('public.asset_balance_accounts') IS NOT NULL)::int || ',' || (EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='20261104000001'))::int")"
          echo "synthetic table,history=$state"
          test "$holder_status" -eq 0
          test "$(query "SELECT count(*) FROM pg_catalog.pg_stat_activity WHERE pid=$holder_pid AND application_name='salary_fixture_holder' AND (extract(epoch FROM backend_start)*1000000)::bigint=$holder_start")" = '0'
          [[ "$waiter" =~ ^[0-9]+\| ]] || { echo 'synthetic lock waiter not observed: inconclusive'; exit 1; }
          test "$cli_status" -ne 0
          test "$state" = '0,0'
          grep -F 'ALTER TABLE public.cfo_assets' "$RUNNER_TEMP/salary-cli-result.log"
          if [ "$CASE_PROFILE" = test ]; then
            grep -F 'SQLSTATE 55P03' "$RUNNER_TEMP/salary-cli-result.log"
            grep -F 'lock timeout' "$RUNNER_TEMP/salary-cli-result.log"
          else
            grep -F 'SQLSTATE 57014' "$RUNNER_TEMP/salary-cli-result.log"
            grep -F 'statement timeout' "$RUNNER_TEMP/salary-cli-result.log"
            cli_database_pid="${waiter%%|*}"
            docker logs "$SERVICE_ID" > "$RUNNER_TEMP/salary-service.log" 2>&1
            grep -F "synthetic_delay_finished pid=$cli_database_pid" "$RUNNER_TEMP/salary-service.log"
          fi
