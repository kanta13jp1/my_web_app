name: Synthetic owner IndexedDB feasibility
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact synthetic-only diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  indexeddb-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout synthetic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact commit
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install locked dependencies and Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/synthetic-idb-browsers
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run actual IndexedDB probe in isolated network
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bash scripts/synthetic_owner_indexeddb/run-isolated.sh \
            "$GITHUB_WORKSPACE/node_modules/playwright" \
            "$RUNNER_TEMP/synthetic-idb-browsers"
