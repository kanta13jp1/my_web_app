# DRAFT ONLY: not registered, dispatched, pulled or executed.
# Manifest source: https://hub.docker.com/layers/library/ubuntu/24.04/?tab=layers
# linux/amd64, noble-20260930.1; this immutable digest is not claimed latest.
# Network semantics: https://docs.docker.com/engine/network/drivers/none/
# The test reports the actual Flutter result; it does not convert red to green.
name: Debt override V2 same-path isolated widget diagnostic (draft)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-widget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: docker.io/library/ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
    steps:
      - name: Initialize isolated paths
        shell: bash
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/debt-probe-empty-docker-config" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/debt-probe-pub-cache" >> "$GITHUB_ENV"
      - name: Check out diagnostic inputs without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic-inputs
          persist-credentials: false
      - name: Check out immutable public base without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          ref: 237d9290183c3bb3df73388ec9cf4563bb0186ef
          persist-credentials: false
      - name: Verify all inputs before applying temporary patches
        shell: bash
        run: |
          set -euo pipefail
          d=diagnostic-inputs/diagnostics/ordered_patch_work
          echo 'a06e16281ccff741e34eadf000de9ad9e2f51601ee414505191c50cc18bdb1b4  '"$d/debt_override_ordered_page_V2_DRAFT.patch" | sha256sum -c -
          echo 'd047f2740976035886a071385351ce8cb1aaf1499c07659dead127c2503cc8be  '"$d/debt_override_ordered_page_V2_DIAGNOSTIC.patch" | sha256sum -c -
          echo 'd5b837da27f8fcb98d22b87677fda6782afef09720cf1dd813e5c091ad814e85  '"$d/debt_override_ordered_page_V2_widget_DRAFT_test.dart" | sha256sum -c -
          test "$(git -C base rev-parse HEAD)" = 237d9290183c3bb3df73388ec9cf4563bb0186ef
          test "$(git -C base rev-parse HEAD:lib/pages/asset_management_page.dart)" = 35749bb77a1e93fcb8b4bf9a2c0c715baa892193
          test "$(git -C base hash-object lib/pages/asset_management_page.dart)" = 35749bb77a1e93fcb8b4bf9a2c0c715baa892193
          test "$(git -C base rev-parse HEAD:lib/services/asset_sync_dirty_keys_store.dart)" = 3a6501a032f6623374ec222474bcc4408327233c
          test "$(git -C base hash-object lib/services/asset_sync_dirty_keys_store.dart)" = 3a6501a032f6623374ec222474bcc4408327233c
          test ! -e base/test/widgets/debt_override_v2_isolated_probe_test.dart
          git -C base apply --check ../"$d/debt_override_ordered_page_V2_DRAFT.patch"
          git -C base apply ../"$d/debt_override_ordered_page_V2_DRAFT.patch"
          git -C base apply --check ../"$d/debt_override_ordered_page_V2_DIAGNOSTIC.patch"
          git -C base apply ../"$d/debt_override_ordered_page_V2_DIAGNOSTIC.patch"
          cp "$d/debt_override_ordered_page_V2_widget_DRAFT_test.dart" base/test/widgets/debt_override_v2_isolated_probe_test.dart
      - name: Prepare pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.10'
          cache: false
      - name: Prepare SDK and dependencies on disposable runner
        working-directory: base
        run: |
          set -euo pipefail
          # Fail closed on known local credential config. This is a limited
          # static check, not proof that arbitrary files contain no secrets.
          for tree in "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT"; do
            git -C "$tree" rev-parse --is-inside-work-tree >/dev/null
            if git -C "$tree" config --local --get-regexp '(^http\..*\.extraheader$|^credential\.|^url\..*\.insteadof$)' >/dev/null; then
              echo 'Unexpected local Git credential configuration'; exit 1
            fi
            if git -C "$tree" config --local --get-regexp '^remote\..*\.url$' | grep -Eq 'https?://[^/]*@'; then
              echo 'Unexpected credentials in local Git remote URL'; exit 1
            fi
          done
          test ! -e "$PUB_CACHE"
          mkdir -p "$PUB_CACHE" "$RUNNER_TEMP/debt-probe-xdg"
          # Do not redefine HOME; omit inherited credentials and runner env.
          for args in '--version' 'precache --linux' 'pub get'; do
            env -i PATH="$PATH" FLUTTER_ROOT="$FLUTTER_ROOT" PUB_CACHE="$PUB_CACHE" \
              XDG_CACHE_HOME="$RUNNER_TEMP/debt-probe-xdg" CI=true \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              flutter $args
          done
          git diff --stat -- pubspec.lock
          # Pinned SDK identity, independently from the synthetic freshness stamp.
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
          # Prevent a pointless online version freshness check inside network=none.
          # This is not evidence that the SDK is the latest version.
          printf '{"lastTimeVersionWasChecked":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$FLUTTER_ROOT/bin/cache/flutter_version_check.stamp"
          # Verify all resolved package roots are contained in the exact three
          # mounted directories. Do not print any untrusted path or config value.
          python3 - "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE" <<'PY'
          import json, pathlib, sys, urllib.parse
          roots = [pathlib.Path(x) for x in sys.argv[1:]]
          for root in roots:
              if not root.is_absolute() or root.resolve() != root:
                  raise SystemExit('Non-canonical mounted directory')
          config = roots[0] / '.dart_tool/package_config.json'
          data = json.loads(config.read_text(encoding='utf-8'))
          for item in data['packages']:
              uri = urllib.parse.urljoin(config.as_uri(), item['rootUri'])
              parsed = urllib.parse.urlparse(uri)
              if parsed.scheme != 'file' or parsed.netloc not in ('', 'localhost'):
                  raise SystemExit('Unexpected package URI')
              path = pathlib.Path(urllib.parse.unquote(parsed.path)).resolve()
              if not any(path == root or root in path.parents for root in roots):
                  raise SystemExit('Package root outside isolated mounts')
          PY
      - name: Pre-pull public official Ubuntu by immutable amd64 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG/config.json"
          docker pull --platform=linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          docker image inspect "$IMAGE" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; assert any(x.endswith("@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc") for x in (d.get("RepoDigests") or []))'
      - name: Stage the minimum host Git runtime for Flutter
        shell: bash
        run: |
          set -euo pipefail
          # Official Ubuntu is minimal. Flutter requires Git; copy only the host
          # executable and its ldd-resolved libraries inside the disposable checkout.
          root="$GITHUB_WORKSPACE/base/.isolation-tools"
          mkdir -p "$root/bin/.git-runtime" "$root/lib"
          gitbin="$(command -v git)"
          cp -L "$gitbin" "$root/bin/.git-runtime/git"
          cat > "$root/bin/git" <<'WRAPPER'
          #!/bin/sh
          toolroot=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          export LD_LIBRARY_PATH="$toolroot/lib"
          exec "$toolroot/bin/.git-runtime/git" "$@"
          WRAPPER
          chmod 0755 "$root/bin/git"
          ldd "$gitbin" > "$RUNNER_TEMP/debt-probe-git-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/debt-probe-git-ldd.txt"; then exit 1; fi
          awk '/=> \/[^ ]+/ {print $3}' "$RUNNER_TEMP/debt-probe-git-ldd.txt" | while IFS= read -r lib; do
            test -f "$lib"
            case "$(basename "$lib")" in
              libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|librt.so.1|libresolv.so.2) continue;;
            esac
            cp -L "$lib" "$root/lib/$(basename "$lib")"
          done
      - name: Inspect and run non-root, no-network synthetic widget tests
        shell: bash
        run: |
          set -euo pipefail
          host_netns="$(readlink /proc/self/ns/net)"
          user_id="$(id -u):$(id -g)"
          test "$(id -u)" -ne 0
          cid="$(docker create --pull=never --network=none --platform=linux/amd64 \
            --user "$user_id" --cap-drop=ALL --security-opt=no-new-privileges:true \
            --read-only --pids-limit=512 --memory=4g \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g --tmpfs /.dart-tool:rw,nosuid,nodev,size=64m,mode=1777 \
            --env XDG_CACHE_HOME=/tmp/cache --env XDG_CONFIG_HOME=/tmp/config --env PUB_CACHE="$PUB_CACHE" --env FLUTTER_ROOT="$FLUTTER_ROOT" \
            --env PATH="$GITHUB_WORKSPACE/base/.isolation-tools/bin:$FLUTTER_ROOT/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env WORKSPACE_BASE="$GITHUB_WORKSPACE/base" --env HOST_NETNS="$host_netns" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/base,dst=$GITHUB_WORKSPACE/base" \
            --mount "type=bind,src=$FLUTTER_ROOT,dst=$FLUTTER_ROOT" \
            --mount "type=bind,src=$PUB_CACHE,dst=$PUB_CACHE,readonly" \
            --workdir "$GITHUB_WORKSPACE/base" "$IMAGE" /bin/bash -ec '
              test "$(id -u)" -ne 0
              test "$(awk "/^NoNewPrivs:/ {print \$2}" /proc/self/status)" = 1
              test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = 0000000000000000
              test "$(readlink /proc/self/ns/net)" != "$HOST_NETNS"
              test "$(ls -1 /sys/class/net)" = lo
              awk "NR > 1 && \$1 != \"lo\" {exit 1}" /proc/net/route
              awk "\$NF != \"lo\" {exit 1}" /proc/net/ipv6_route
              test ! -e /var/run/docker.sock
              socket_path=$(find "$WORKSPACE_BASE" "$FLUTTER_ROOT" "$PUB_CACHE" -type s -print -quit)
              test -z "$socket_path"
              git --version
              "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" --version
              mkdir -p "$XDG_CACHE_HOME"
              "$FLUTTER_ROOT/bin/flutter" test --no-pub --reporter expanded test/widgets/debt_override_v2_isolated_probe_test.dart
            ')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$cid")" = none
          test "$(docker inspect --format '{{.HostConfig.Privileged}}' "$cid")" = false
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = true
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "$user_id"
          test "$(docker inspect --format '{{.HostConfig.PublishAllPorts}}' "$cid")" = false
          docker inspect "$cid" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; h=d["HostConfig"]; assert "ALL" in h["CapDrop"]; assert any("no-new-privileges" in x for x in h["SecurityOpt"]); assert not h.get("PortBindings"); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "bind"} == set(sys.argv[1:]); assert {m["Destination"] for m in d["Mounts"] if m["Type"] == "tmpfs"}.issubset({"/tmp", "/.dart-tool"}); assert all(m["Type"] in ("bind", "tmpfs") for m in d["Mounts"]); assert set((h.get("Tmpfs") or {}).keys()) == {"/tmp", "/.dart-tool"}' "$GITHUB_WORKSPACE/base" "$FLUTTER_ROOT" "$PUB_CACHE"
          # stdout/stderr are synthetic only. Any preflight or test failure fails
          # the job; no expected failure is transformed into success.
          docker start -a "$cid"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$cid")" -eq 0