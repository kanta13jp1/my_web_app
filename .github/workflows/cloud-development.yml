name: Echo Pump preload production verification
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: Exact verified production commit
        required: true
        type: string
permissions: {}
concurrency:
  group: echo-public-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node --check scripts/echo-pump-preload-public-check.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify the public game and native audio playback
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.production_sha }}
        run: node scripts/echo-pump-preload-public-check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: echo-pump-public-evidence
          path: echo-public-evidence/
          retention-days: 14
