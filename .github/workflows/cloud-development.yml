name: Workshop Focused Browser Verification
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify exact validation source
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none --target=test/fixtures/echo_pump_app.dart
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify visible workshop and ready door audio
        run: |
          python3 scripts/serve_spa.py build/web --port 7358 > echo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/echo_pump_audio.spec.ts test/e2e/echo_pump_room_stage.spec.ts --grep 'workshop artwork|door sounds' --project=chromium --project=mobile-chrome --workers=1 --retries=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: workshop-focused-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            echo-server.log
          retention-days: 7
