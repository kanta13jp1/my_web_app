name: Unconfirmed full memo diagnostic only
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact source
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - run: flutter analyze test/services/salary_category_source_probe_test.dart
      - run: flutter test test/services/salary_category_source_probe_test.dart test/services/salary_spending_breakdown_service_test.dart --reporter expanded
