name: PR 5125 Offline Preview Only
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact preview branch commit
        required: true
        type: string
permissions: {}
concurrency:
  group: pr5125-offline-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/codex/pr5125-offline-preview-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce exact revision and isolated entrypoint
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$GITHUB_REF_NAME" = codex/pr5125-offline-preview-20261017
          ! grep -E 'firebase|main.dart' lib/preview/pr5125_main.dart | grep '^import'
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Install dependencies on cloud runner only
        run: flutter pub get
      - name: Analyze and test the isolated adapter
        run: |
          dart format lib/preview test/preview
          dart fix --apply --code=require_trailing_commas lib/preview
          dart fix --apply --code=require_trailing_commas test/preview
          dart format lib/preview test/preview
          flutter analyze lib/preview test/preview
          flutter analyze lib/pages/import_page.dart lib/pages/note_editor_page.dart lib/pages/note_list_page.dart lib/pages/note_collections_page.dart lib/pages/note_navigation_page.dart lib/pages/space_sharing_page.dart lib/widgets/evernote_cloud_migration_controls.dart lib/widgets/note_editor/ai_assistant_menu.dart lib/services/import_service.dart lib/services/note_collection_service.dart lib/services/evernote_migration_commit_service.dart
          flutter test test/preview
          python scripts/check_pr5125_japanese.py
      - name: Capture mechanical formatting patch
        if: always()
        run: |
          mkdir -p preview-evidence
          git diff -- lib/preview test/preview > preview-evidence/source-format.patch
      - name: Build without DB configuration or external runtime resources
        run: |
          flutter build web --release --target lib/preview/pr5125_main.dart --no-web-resources-cdn --pwa-strategy=none --dart-define=PR5125_OFFLINE_PREVIEW=true
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('build/web/preview-version.json').write_text(json.dumps({'source_pr':5125,'source_head':'0de740ae4223390dc9da7c9185947206834d61a7','preview_head':os.environ['GITHUB_SHA'],'database':'none','mode':'synthetic-read-only','language':'ja'}))
          PY
      - name: Install cloud browser tooling from repository lock
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check PC and mobile screens before preview publication
        run: |
          python -m http.server 8080 --directory build/web > /tmp/pr5125-http.log 2>&1 &
          node scripts/pr5125_preview_check.cjs
      - name: Save screen evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr5125-offline-screen-evidence
          path: preview-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - name: Deploy only the expiring offline preview channel
        env:
          STAGING_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SA"
          test -n "$PROJECT_ID"
          credentials="$RUNNER_TEMP/pr5125-firebase.json"
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$STAGING_SA" > "$credentials"
          chmod 600 "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          npm install --prefix "$RUNNER_TEMP/pr5125-firebase-tools" --ignore-scripts firebase-tools@14.12.0
          "$RUNNER_TEMP/pr5125-firebase-tools/node_modules/.bin/firebase" hosting:channel:deploy pr-5125-offline --project "$PROJECT_ID" --config firebase.preview-5125.json --expires 7d --json > "$RUNNER_TEMP/pr5125-deployment.json"
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          result=json.loads(Path(os.environ['RUNNER_TEMP']+'/pr5125-deployment.json').read_text())
          urls=[v['url'] for v in result.get('result',{}).values() if isinstance(v,dict) and 'url' in v]
          assert len(urls)==1, 'Expected exactly one dedicated preview URL'
          url=urls[0]
          assert 'pr-5125-offline' in url and url.endswith('.web.app'), 'Not the dedicated preview host'
          version=json.load(urllib.request.urlopen(url+'/preview-version.json'))
          assert version['preview_head']==os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Synthetic read-only PR #5125 preview\n'+url+'\n\n'+json.dumps(version)+'\n\nExpires in seven days. No database or production deployment.\n')
          print('PREVIEW_URL='+url)
          PY
