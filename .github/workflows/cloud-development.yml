name: Typing input formatter preflight
on:
  push:
    branches: [codex/typing-input-public-validation-20261104]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.10'
      - run: flutter pub get
      - name: Format task files and preserve exact output
        run: |
          dart format lib/pages/typing_game_page.dart test/pages/typing_game_page_test.dart
          git diff > typing-input-format.patch
          python - <<'PY'
          import json
          from pathlib import Path
          print('FORMATTED_PAGE_JSON='+json.dumps(Path('lib/pages/typing_game_page.dart').read_text()))
          print('FORMATTED_TEST_JSON='+json.dumps(Path('test/pages/typing_game_page_test.dart').read_text()))
          PY
      - run: flutter analyze lib/pages/typing_game_page.dart test/pages/typing_game_page_test.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: typing-input-format
          path: typing-input-format.patch
          retention-days: 7
