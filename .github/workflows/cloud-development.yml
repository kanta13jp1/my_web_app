name: Flow owner diagnostic only
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact source
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - run: dart format test/widgets/fixed_cost_save_probe_test.dart
      - run: dart fix --apply --code=require_trailing_commas test/widgets/fixed_cost_save_probe_test.dart
      - run: dart format test/widgets/fixed_cost_save_probe_test.dart
      - run: dart format lib/pages/asset_management_page.dart
      - run: flutter analyze lib/pages/asset_management_page.dart test/widgets/fixed_cost_save_probe_test.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: flow-owner-formatted
          path: |
            test/widgets/fixed_cost_save_probe_test.dart
            lib/pages/asset_management_page.dart
      - run: flutter test test/widgets/fixed_cost_save_probe_test.dart --reporter expanded
