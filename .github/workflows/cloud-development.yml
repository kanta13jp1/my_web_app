name: Asset AI Chrome version diagnostic (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check fixed diagnostic head and product-only difference
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          PRODUCT_HEAD: 36dc9a6d4321f87ef4d093ac024b47e98e788a18
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" = 2
          test "$(git diff --name-only "$PRODUCT_HEAD" HEAD)" = '.github/workflows/cloud-development.yml'
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve test dependencies
        run: flutter pub get
      - name: Run original synthetic VM preflight
        run: flutter test test/widgets/asset_triage_withdrawal_test.dart --reporter expanded
      - name: Install matching Chrome and driver for diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cft" .ci-logs
          curl --fail --silent --show-error --location --max-time 180 \
            -o "$RUNNER_TEMP/cft/chrome.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-linux64.zip
          curl --fail --silent --show-error --location --max-time 180 \
            -o "$RUNNER_TEMP/cft/driver.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chromedriver-linux64.zip
          unzip -q "$RUNNER_TEMP/cft/chrome.zip" -d "$RUNNER_TEMP/cft"
          unzip -q "$RUNNER_TEMP/cft/driver.zip" -d "$RUNNER_TEMP/cft"
          "$RUNNER_TEMP/cft/chrome-linux64/chrome" --version | tee .ci-logs/binary-versions.log
          "$RUNNER_TEMP/cft/chromedriver-linux64/chromedriver" --version | tee -a .ci-logs/binary-versions.log
          test "$(grep -Fc '156.0.8078.47' .ci-logs/binary-versions.log)" = 2
          sha256sum "$RUNNER_TEMP/cft/chrome-linux64/chrome" "$RUNNER_TEMP/cft/chromedriver-linux64/chromedriver" | tee -a .ci-logs/binary-versions.log
      - name: Run original synthetic Chrome flow with matching binaries
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cft/chromedriver-linux64/chromedriver" --port=4444 > .ci-logs/chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_management_ai_current_input_test.dart \
            -d web-server --browser-name=chrome --headless \
            --chrome-binary "$RUNNER_TEMP/cft/chrome-linux64/chrome" \
            2>&1 | tee .ci-logs/asset-ai-browser.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: asset-ai-version-diagnostic-${{ github.run_id }}
          path: .ci-logs/*.log
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
