name: Approved PR5861 Source Provenance
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  preserve-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install isolated Hosting API client
        run: |
          python -m venv "$RUNNER_TEMP/hosting-metadata"
          "$RUNNER_TEMP/hosting-metadata/bin/pip" -q install google-auth==2.40.3 requests==2.32.4
          "$RUNNER_TEMP/hosting-metadata/bin/python" scripts/hosting-transfer/test-index-release.py
      - name: Preserve approved HTML source reference and verify immutable asset map
        env:
          FIREBASE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: '"$RUNNER_TEMP/hosting-metadata/bin/python" scripts/hosting-transfer/source-provenance.py'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-transfer-metadata
          path: production-transfer/metadata-release.json
          retention-days: 7
