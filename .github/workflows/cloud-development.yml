name: Typing web composition preflight
on:
  push:
    branches: [codex/typing-input-public-validation-20261104]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.10'
      - run: flutter pub get
      - name: Format task files
        run: |
          dart format lib/pages/typing_game_page.dart lib/services/typing_composition_bridge_stub.dart lib/services/typing_composition_bridge_web.dart test/pages/typing_game_page_test.dart
          git diff > typing-input-format.patch
      - run: flutter analyze lib/pages/typing_game_page.dart lib/services/typing_composition_bridge_stub.dart lib/services/typing_composition_bridge_web.dart test/pages/typing_game_page_test.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: typing-input-format
          path: typing-input-format.patch
          retention-days: 7
