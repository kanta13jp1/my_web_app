name: Isolated synthetic Chrome loopback diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact synthetic diagnostic branch commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Navigate a synthetic local page without external IP connectivity
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          chromedriver --version
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true python3 test/fixtures/chrome_loopback_diagnostic.py
          ' _ "$(id -un)" "$PATH" "$HOME"
