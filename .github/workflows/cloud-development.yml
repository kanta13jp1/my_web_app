name: Synthetic debt page formatter

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated formatting branch head
        required: true
        type: string

permissions: {}

concurrency:
  group: synthetic-debt-page-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact isolated head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Format detached candidate
        run: |
          set -euo pipefail
          dart format tool/ci/debt_asset_page_for_format.dart
          dart format --output=none --set-exit-if-changed tool/ci/debt_asset_page_for_format.dart
          sha256sum tool/ci/debt_asset_page_for_format.dart
      - name: Preserve formatted candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: formatted-debt-asset-page
          path: tool/ci/debt_asset_page_for_format.dart
          if-no-files-found: error
          retention-days: 3
