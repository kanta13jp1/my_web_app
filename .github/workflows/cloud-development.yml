name: Checklist input diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-release-checklist-e2e:
    name: Platform release checklist E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository-pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Resolve dependencies and build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none \
            --dart-define=ENVIRONMENT=visual-test \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Use verified Flutter note keyboard input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/e2e/platform_release_checklist.spec.ts')
          s=p.read_text()
          old="  await note.fill('Chrome で確認');"
          new="  await note.press('Tab');\n  await expect(note).not.toBeFocused();\n  await page.evaluate(() => new Promise<void>(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve()))));\n  await note.click();\n  await expect(note).toBeFocused();\n  await page.evaluate(() => new Promise<void>(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve()))));\n  await note.pressSequentially('Chrome で確認', { delay: 75 });\n  await note.press('Tab');\n  await note.focus();\n  await expect(note).toHaveValue('Chrome で確認');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY

      - name: Run platform release checklist E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > checklist-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/platform_release_checklist.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0

      - name: Upload checklist E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-release-checklist-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            checklist-server.log
          if-no-files-found: ignore

