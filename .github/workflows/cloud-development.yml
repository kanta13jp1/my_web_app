name: Synthetic owner RLS semantics (disposable Postgres only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated SQL experiment commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  sql-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: owner_sync_lab
          POSTGRES_PASSWORD: synthetic-only
        options: >-
          --health-cmd "pg_isready -U postgres -d owner_sync_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNTHETIC_DB_CONTAINER: ${{ job.services.db.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact experiment files and head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:test/synthetic_owner_rls/fixture.sql)" = "78732354d07d2cc178db409a34d6d3f41fb2e2a6"
          test "$(git rev-parse HEAD:test/synthetic_owner_rls/permissive_expected_red.sql)" = "de6e30ead4c7b345be9bc4caaad7a28758c0f534"
          test "$(git rev-parse HEAD:test/synthetic_owner_rls/restrictive_green.sql)" = "b3186d05e0aef7d9350af658a7a57c7801044a4f"
      - name: Create synthetic fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            -c 'SELECT current_database(), current_user, version();'
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            < test/synthetic_owner_rls/fixture.sql
      - name: Expected red permissive policy is not restrictive
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            < test/synthetic_owner_rls/permissive_expected_red.sql
      - name: Restricted policy and truncate scope
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=synthetic-only "$SYNTHETIC_DB_CONTAINER" \
            psql -U postgres -d owner_sync_lab -v ON_ERROR_STOP=1 \
            < test/synthetic_owner_rls/restrictive_green.sql
