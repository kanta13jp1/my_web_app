name: Borrowing HTTP marker diagnostic only
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact source
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Format scoped draft
        run: dart format lib/services/asset_flow_request.dart test/services/asset_flow_request_test.dart
      - name: Analyze scoped draft
        run: flutter analyze lib/services/asset_flow_request.dart test/services/asset_flow_request_test.dart
      - name: Verify SDK HTTP serialization with mock transport
        run: flutter test test/services/asset_flow_request_test.dart --reporter expanded
      - name: Preserve formatted sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: borrowing-http-marker-sources
          path: |
            lib/services/asset_flow_request.dart
            test/services/asset_flow_request_test.dart
