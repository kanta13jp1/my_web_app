name: Payment-day targeted prune hold (candidate only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated candidate commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact head and sources
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:lib/pages/asset_management_page.dart)" = "beed24eb38de1300d2a3d956ee3817a668c27644"
          test "$(git rev-parse HEAD:test/widgets/asset_management_page_smoke_test.dart)" = "012316bb12003e8fb6e5760d5ec305f11d0c5219"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve dependencies
        id: prepare
        run: flutter pub get
      - name: Format candidate checkout
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: dart format lib/pages/asset_management_page.dart test/widgets/asset_management_page_smoke_test.dart
      - name: Analyze candidate page
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: flutter analyze --no-pub lib/pages/asset_management_page.dart
      - name: Analyze modified test file
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: flutter analyze --no-pub test/widgets/asset_management_page_smoke_test.dart
      - name: Manual prune raw retention and positive control
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              flutter test --no-pub test/widgets/asset_management_page_smoke_test.dart --plain-name "manual prune button cleans expired tombstones" --reporter expanded
          ' _ "$(id -un)" "$PATH" "$HOME"
      - name: Existing boot prune positive control
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              flutter test --no-pub test/widgets/asset_management_page_smoke_test.dart --plain-name "boot auto-prune physically drops expired tombstones" --reporter expanded
          ' _ "$(id -un)" "$PATH" "$HOME"
