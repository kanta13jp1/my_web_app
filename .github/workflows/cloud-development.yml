# SYNTHETIC DIAGNOSTIC ONLY. Fresh GitHub-hosted service, no production input.
name: Salary cascade deletion and RLS fixture (diagnostic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit
        required: true
        type: string
      profile:
        description: Synthetic profile
        required: true
        type: choice
        options: [test]
permissions: {}
jobs:
  synthetic-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    container:
      image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
      volumes:
        - salary-deletion-${{ github.run_id }}-${{ github.run_attempt }}:/var/run/postgresql
    services:
      postgres:
        image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_DB: salary_identity_isolated
          POSTGRES_PASSWORD: test-only
        volumes:
          - salary-deletion-${{ github.run_id }}-${{ github.run_attempt }}:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -h /var/run/postgresql -U postgres -d salary_identity_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact diagnostic inputs
        shell: sh
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          printf '%s\n' '8ce9ba94c65f903e628a4ed72f1ecdf03b393ab33cb21d2f0f3080d4a0bb3878  supabase/migrations/20260829095836_account_retention_and_deletion.sql' | sha256sum -c -
          cd diagnostics/salary_cascade
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = '6'
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = '6'
          printf '%s\n' '65f220b0dfc3f0d83b244ec62cd5ea04c23859b8de00c902b460d8d28cae87e3  00_setup.sql' '576438097e2fb3779d1f2ac7ba98417c32c44712e3d481e32937d106683d3fe3  01_main_inventory.sql' '72d49adc6668cfdf880c826df596b480087ede010bba00cc882a363e83281536  02_main_delete.sql' '5f667dd873fe5789c6ed5155ece6c3b0f1b2a879c1e18ab640e24e570c440b18  04_rls.sql' '37265f0a5090a2eefc0a1b8e64645648822863f59656c8bf7467df357be24581  05_contract.sql' '9e23a5864b5d4c989f7e43114f614a257302566f0ce962623c269187e81d1134  14_expand_identity_auth_cascade_DRAFT.sql' | sha256sum -c -
      - name: Run guarded synthetic contract
        shell: sh
        env:
          PGHOST: /var/run/postgresql
          PGDATABASE: salary_identity_isolated
          PGUSER: postgres
          PGPASSWORD: test-only
          PGOPTIONS: '-c salary_test.isolated=disposable-pg17-only'
        run: |
          set -eu
          unset PGHOSTADDR PGSERVICE PGSERVICEFILE PGPASSFILE
          psql -X -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d salary_identity_isolated -f diagnostics/salary_cascade/00_setup.sql
          psql -X -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d salary_identity_isolated -f diagnostics/salary_cascade/05_contract.sql
