name: Closing save diagnostic only
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert diagnostic source
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Format and analyze closing fix
        run: |
          dart fix --apply --code=require_trailing_commas test/widgets/closing_save_failure_probe_test.dart
          dart format lib/pages/asset_management_page.dart test/widgets/closing_save_failure_probe_test.dart
          flutter analyze lib/pages/asset_management_page.dart test/widgets/closing_save_failure_probe_test.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: closing-formatted
          path: |
            lib/pages/asset_management_page.dart
            test/widgets/closing_save_failure_probe_test.dart
      - name: Run closing failure probe
        run: flutter test test/widgets/closing_save_failure_probe_test.dart test/widgets/asset_management_fixed_cost_action_regression_test.dart --reporter expanded