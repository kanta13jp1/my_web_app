name: Workbook month-gap reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gap-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - run: dart format test/services/workbook_calendar_gap_probe_test.dart
      - run: flutter analyze test/services/workbook_calendar_gap_probe_test.dart
      - name: Reproduce calendar gap against public implementation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          flutter test test/services/workbook_calendar_gap_probe_test.dart --reporter expanded 2>&1 | tee .ci-logs/month-gap-probe.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: workbook-gap-${{ github.run_id }}
          path: |
            .ci-logs/month-gap-probe.log
            test/services/workbook_calendar_gap_probe_test.dart
          include-hidden-files: true
          retention-days: 7
