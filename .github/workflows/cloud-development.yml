name: Echo Pump Approved Public Verification
on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: node --check scripts/echo_pump_release/public_improvements.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify public game without deployment
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
        run: node scripts/echo_pump_release/public_improvements.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: echo-improvements-public-${{ github.run_id }}
          path: echo-improvements-public/
          retention-days: 14
