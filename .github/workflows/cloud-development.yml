name: Synthetic Flutter minimal HTML diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact synthetic diagnostic branch commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  fixture-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - run: flutter precache --web
      - name: Run synthetic fixture using minimal web HTML
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true bash test/fixtures/dining_browser_diagnostic_runner.sh
          ' _ "$(id -un)" "$PATH" "$HOME"
