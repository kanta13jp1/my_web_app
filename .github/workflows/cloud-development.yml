name: Echo Pump PR5859 public verification
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
      profile:
        required: true
        type: choice
        options: [workspace]
      production_sha:
        required: true
        type: string
permissions: {}
concurrency:
  group: echo-fuse-public-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify exact QA source
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: node --check scripts/echo-pump-fuse-public-check.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify actual public game on desktop and mobile
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.production_sha }}
        run: node scripts/echo-pump-fuse-public-check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: echo-pump-fuse-public-${{ github.run_id }}
          path: echo-fuse-public/
          retention-days: 14
