name: Cloud Development Checks
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
      profile:
        required: true
        default: workspace
        type: string
permissions: {}
jobs:
  recurring-income-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact head
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Focused income cadence regression
        run: |
          set -euo pipefail
          mkdir -p .ci-logs/recurring-income
          flutter pub get
          dart format lib/widgets/recurring_fixed_cost_editor_dialog.dart lib/pages/asset_management_page.dart test/widgets/asset_management_page_smoke_test.dart
          dart format test/widgets/recurring_fixed_cost_save_test.dart
          dart fix --apply --code=require_trailing_commas
          mkdir -p .ci-logs/recurring-income/source/lib/widgets .ci-logs/recurring-income/source/lib/pages
          cp lib/widgets/recurring_fixed_cost_editor_dialog.dart .ci-logs/recurring-income/source/lib/widgets/
          cp lib/pages/asset_management_page.dart .ci-logs/recurring-income/source/lib/pages/
          mkdir -p .ci-logs/recurring-income/source/test/widgets
          cp test/widgets/recurring_fixed_cost_save_test.dart .ci-logs/recurring-income/source/test/widgets/
          flutter analyze --no-pub test/widgets/recurring_fixed_cost_save_test.dart lib/widgets/recurring_fixed_cost_editor_dialog.dart lib/pages/asset_management_page.dart test/widgets/asset_management_page_smoke_test.dart
          flutter test --no-pub --reporter expanded test/widgets/asset_management_page_smoke_test.dart --plain-name 'fixed cost persistence failure retains' | tee .ci-logs/recurring-income/tests.log
          flutter test --no-pub --reporter expanded test/widgets/recurring_fixed_cost_editor_dialog_test.dart test/widgets/recurring_fixed_cost_save_test.dart | tee .ci-logs/recurring-income/editor-tests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recurring-income-${{ github.run_id }}
          path: .ci-logs/recurring-income
