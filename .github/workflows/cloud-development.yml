name: Payment owner recovery model v2 (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated model commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check model files and exact head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:lib/services/asset_payment_day_owner_store_candidate.dart)" = "23fd0e3ce5c7b88062b1b5e81eab88cee89e6742"
          test "$(git rev-parse HEAD:test/services/asset_payment_day_owner_store_candidate_test.dart)" = "3f6f2375186dc819074cb6b19f7ce31de9742eb3"
          test "$(git rev-parse HEAD:test/services/asset_payment_day_recovery_v2_test.dart)" = "bfee3fb642399665514362c167f113150d5086ae"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve synthetic dependencies
        id: prepare
        run: flutter pub get
      - name: Run existing detached model tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              flutter test --no-pub test/services/asset_payment_day_owner_store_candidate_test.dart --reporter expanded
          ' _ "$(id -un)" "$PATH" "$HOME"
      - name: Verify pending snapshot recovery
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              flutter test --no-pub test/services/asset_payment_day_recovery_v2_test.dart --reporter expanded
          ' _ "$(id -un)" "$PATH" "$HOME"
