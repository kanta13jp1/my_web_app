name: Cloud Development Checks

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact synthetic-only test branch commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  synthetic-payment-day-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout synthetic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Install dependencies
        run: flutter pub get
      - name: Characterize payment-day acknowledgement with synthetic data
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          # Dependency installation has completed. Run the test in an isolated
          # network namespace with only loopback, as the unprivileged runner.
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            ip link show lo > /dev/null
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              flutter test test/widgets/payment_day_page_repro_test.dart test/models/asset_calendar_reflection_test.dart test/widgets/asset_calendar_reflection_panel_test.dart --reporter expanded
          ' _ "$(id -un)" "$PATH" "$HOME"

      - name: Exercise synthetic candidate in a browser
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true bash test/fixtures/dining_review_browser_runner.sh
          ' _ "$(id -un)" "$PATH" "$HOME"
