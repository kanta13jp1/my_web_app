        def verify_copy_read_limit():
            positive = [(0, 0, 1), (1, 0, 2), (1, 1, 1),
                        (1024 * 1024, 0, 1024 * 1024),
                        (1024 * 1024 + 1, 0, 1024 * 1024),
                        (1024 * 1024 + 1, 1024 * 1024, 2)]
