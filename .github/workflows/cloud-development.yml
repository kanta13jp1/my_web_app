name: Synthetic old-owner-guard reproduction (expected failure)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact synthetic-only old-page diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  owner-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout synthetic test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact handoff
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Hydrate dependencies
        run: flutter pub get
      - name: Run four owner-bound scenarios in isolation
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" RUNNER_TEMP="$4" CI=true \
              bash -c '\''set -euo pipefail
                logdir=$(mktemp -d "$RUNNER_TEMP/tombstone-owner.XXXXXXXX")
                set +e
                flutter test --no-pub test/widgets/payment_day_tombstone_owner_synthetic_test.dart \
                  --name "deleted read from A|switch during tombstone|same owner applies deleted|switch while local override" \
                  --reporter expanded | tee "$logdir/result.log"
                statuses=("${PIPESTATUS[@]}")
                test_status=${statuses[0]}
                tee_status=${statuses[1]}
                set -e
                printf "Diagnostic Flutter exit=%s; tee exit=%s; inspect named failures and infrastructure separately.\n" "$test_status" "$tee_status"
                exit 1
              '\''
          ' _ "$(id -un)" "$PATH" "$HOME" "$RUNNER_TEMP"
