name: Monthly report provenance diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csv-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - run: dart format test/services/monthly_report_provenance_probe_test.dart
      - run: flutter analyze test/services/monthly_report_provenance_probe_test.dart
      - name: Existing monthly report controls
        run: flutter test test/services/asset_liability_monthly_report_service_test.dart --reporter expanded
      - name: Check consistent source for net worth and delta
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          flutter test test/services/monthly_report_provenance_probe_test.dart --reporter expanded 2>&1 | tee .ci-logs/monthly-provenance-probe.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: monthly-provenance-${{ github.run_id }}
          path: |
            .ci-logs/monthly-provenance-probe.log
            test/services/monthly_report_provenance_probe_test.dart
          include-hidden-files: true
          retention-days: 7
