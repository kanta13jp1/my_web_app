name: Isolated synthetic membership before REVOKE observation
# Unknown message hashes can be guessable: only the fixed network-none synthetic DB is permitted.
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated diagnostic head
        required: true
        type: string
permissions: {}
jobs:
  cli-execbatch-isolated:
    if: ${{ github.repository == 'kanta13jp1/my_web_app' && github.ref == 'refs/heads/codex/asset-pref-cli-execbatch-terminal-20261106' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable diagnostic inputs
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-list --parents -n 1 HEAD)" = "$EXPECTED_HEAD 293f834c181489a309b9711bf92e2d60c7e9aa7e"
          git diff --no-renames --name-only HEAD^ HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          LC_ALL=C sort > "$RUNNER_TEMP/expected-files" <<'FIXED_FILES'
          .github/workflows/cloud-development.yml
          scripts/asset_pref_truncate_fixture/cli_execbatch/membership_before.py
          scripts/asset_pref_truncate_fixture/cli_execbatch/membership_before_entry.py
          scripts/asset_pref_truncate_fixture/cli_execbatch/test_membership_before_offline.py
          scripts/asset_pref_truncate_fixture/cli_execbatch/test_membership_before_entry_offline.py
          FIXED_FILES
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          sha256sum -c <<'FIXED_HASHES'
          e522e693c83dbc517ba26345546fdd06f0c02bb032ead12c124444227bf60a79  scripts/asset_pref_truncate_fixture/cli_execbatch/candidate_lock_rc_cli_batch_review_stopped.sql.txt
          0c6f44d00885dc939355e22bd4860339662a31eb7e51ca1f6ef981ab81e51621  scripts/asset_pref_truncate_fixture/cli_execbatch/candidate_lock_rc_guard_review_stopped.sql.txt
          3372910f839d556a35d81dfd6ababe8c73438e52636d7fe8c491835528f1dfb6  scripts/asset_pref_truncate_fixture/cli_execbatch/revoke_truncate_candidate_review_stopped.sql.txt
          1baae5293834c0b7afd524947512013e8ac339aca5195b3f7528dae26ff9f36f  scripts/asset_pref_truncate_fixture/cli_execbatch/candidate_pr_do_without_boundaries_review_stopped.sql.txt
          ee18141eb1390ce6446ffe3696f677495f809606e144ff9164faf62d03db5f19  scripts/asset_pref_truncate_fixture/cli_execbatch/candidate_single_do_lock_review_stopped.sql.txt
          234ed22dcc5b753ed4c32bf769dcf0739dc321f8d8e153218d3797f8b8183251  scripts/asset_pref_truncate_fixture/cli_execbatch/runner.py
          c76bd19a46f755604c172b5418fcb2727e485604aa02f1a3ade35ea8db0e52cf  scripts/asset_pref_truncate_fixture/cli_execbatch/test_offline.py
          4d0d8487057ef223c888f706c7b09fad1be623c54e989466c95ab6f016842346  scripts/asset_pref_truncate_fixture/cli_execbatch/phase2.py
          199c3301e01124b9e9eac5c291d07d7c44eccdc34fc0a498075a2da69640c8c7  scripts/asset_pref_truncate_fixture/cli_execbatch/phase2_entry.py
          863c173a62ea634f24db62f7eda50393a83dc29fad22149fe50020dc9b18f593  scripts/asset_pref_truncate_fixture/cli_execbatch/test_phase2_offline.py
          44b6f5d0e8fad7ce77e2fd1a7125ecb0fbd295bd3eb18c5080d3affd29380a10  scripts/asset_pref_truncate_fixture/cli_execbatch/event_preflight.py
          1781b4d3565163aa784e7d8c27f13ef6ffd506116563504acedce7923ba380c4  scripts/asset_pref_truncate_fixture/cli_execbatch/event_preflight_entry.py
          343bc4c77bf752b70884df9e6f195806f977f9e7118a64a800aa376ff72dd303  scripts/asset_pref_truncate_fixture/cli_execbatch/test_event_preflight_offline.py
          05d6b17ae5129e805e565c5c5cd06a9530a8c54f0e3e289eb9cdefe7b5079104  scripts/asset_pref_truncate_fixture/cli_execbatch/test_event_entry_offline.py
          d94a40d01de858131cca42f17119bcf3c36a6b3ccf4811cc495aa750080922a6  scripts/asset_pref_truncate_fixture/cli_execbatch/table_grant.py
          a3b213688743f9e4ff47c77cd1fd4f826bb6d886f791bb40059eef23861a0904  scripts/asset_pref_truncate_fixture/cli_execbatch/table_grant_entry.py
          98ecc3a84f21d4d27403f01ae3e65e3d5a6f9475d2ef60eaf211108255adad3b  scripts/asset_pref_truncate_fixture/cli_execbatch/test_table_grant_offline.py
          b31f77716c29563fd69633d1b0fce0b2e517d32b43eb32b5cbf0099f49e361fc  scripts/asset_pref_truncate_fixture/cli_execbatch/test_table_grant_entry_offline.py
          24e38d3b06d1aeb5d5fd6bfea2bec64c303d4fdad9a45b51f0af980a48cf9db8  supabase/migrations/20261103063701_restrict_asset_pref_mirror_truncate.sql
          1baae5293834c0b7afd524947512013e8ac339aca5195b3f7528dae26ff9f36f  scripts/asset_pref_truncate_fixture/revoke_truncate_candidate_review_stopped.sql.txt
          eac606b07e1fd08ebccab88186ca72dc6c9a0ce59a520cec34c4ce7dcd85c294  scripts/asset_pref_truncate_fixture/cli_execbatch/membership_before.py
          1216f622b301ee29a677bf4b304abbfb51d42f2b9b859a614dd18f90338773fd  scripts/asset_pref_truncate_fixture/cli_execbatch/membership_before_entry.py
          36225d81889eaecb543b9d93ec5287a1660487d412eca726dcf412dc6d2290b0  scripts/asset_pref_truncate_fixture/cli_execbatch/test_membership_before_offline.py
          09b4c1676df2759c35b0e475f620fa71cff0b6caba1721bf64b4ea06066d2c7e  scripts/asset_pref_truncate_fixture/cli_execbatch/test_membership_before_entry_offline.py
          FIXED_HASHES
          pr=$(gh api repos/kanta13jp1/my_web_app/pulls/5980 --jq '[.state,.head.sha,.base.sha,.head.repo.full_name] | @tsv' 2>/dev/null)
          test "$pr" = $'open\t85394a8e938a7c4bda08e32dd4cfff9ede623e57\tf420ca99541125452407e974958e7704f1d5b429\tkanta13jp1/my_web_app'
          gh api 'repos/kanta13jp1/my_web_app/contents/supabase/migrations/20261103063701_restrict_asset_pref_mirror_truncate.sql?ref=85394a8e938a7c4bda08e32dd4cfff9ede623e57' --jq .content | base64 -d | cmp -s - supabase/migrations/20261103063701_restrict_asset_pref_mirror_truncate.sql
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_offline.py
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_phase2_offline.py
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_event_preflight_offline.py
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_event_entry_offline.py
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_table_grant_offline.py
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_table_grant_entry_offline.py
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_membership_before_offline.py
          python3 -B scripts/asset_pref_truncate_fixture/cli_execbatch/test_membership_before_entry_offline.py
      - name: Obtain verified public binaries
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 \
            'https://github.com/supabase/cli/releases/download/v2.84.2/supabase_linux_amd64.tar.gz' \
            --output scripts/asset_pref_truncate_fixture/cli_execbatch/supabase_linux_amd64.tar.gz
          printf '%s  %s\n' '620a5f6ea7b60f9b4fe112a5d72464ea0e53d04022035641674a2e6d121e0eb5' \
            'scripts/asset_pref_truncate_fixture/cli_execbatch/supabase_linux_amd64.tar.gz' | sha256sum -c -
          docker pull 'postgres@sha256:0b81cec82228160abfa753aeaad0609b709eb26eeb950f2e404ad2326e1cc370'
      - name: Run only in owned network-none synthetic containers
        id: synthetic_observation
        env:
          SYNTHETIC_EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api repos/kanta13jp1/my_web_app/pulls/5980 --jq '[.state,.head.sha,.base.sha,.head.repo.full_name] | @tsv' 2>/dev/null)
          test "$pr" = $'open\t85394a8e938a7c4bda08e32dd4cfff9ede623e57\tf420ca99541125452407e974958e7704f1d5b429\tkanta13jp1/my_web_app'
          python3 -B -c 'import importlib.util,sys; p="scripts/asset_pref_truncate_fixture/cli_execbatch/membership_before_entry.py"; s=importlib.util.spec_from_file_location("isolated_membership_before_entry",p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); sys.exit(m.run_and_exit_code())'
      - name: Recheck PR after isolated evidence
        id: pr_recheck
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api repos/kanta13jp1/my_web_app/pulls/5980 --jq '[.state,.head.sha,.base.sha,.head.repo.full_name] | @tsv' 2>/dev/null)
          test "$pr" = $'open\t85394a8e938a7c4bda08e32dd4cfff9ede623e57\tf420ca99541125452407e974958e7704f1d5b429\tkanta13jp1/my_web_app'
      - name: Confirm synthetic evidence end
        if: ${{ always() }}
        env:
          OBSERVATION_OUTCOME: ${{ steps.synthetic_observation.outcome }}
          RECHECK_OUTCOME: ${{ steps.pr_recheck.outcome }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OBSERVATION_OUTCOME" =~ ^(success|failure|cancelled|skipped)$ && "$RECHECK_OUTCOME" =~ ^(success|failure|cancelled|skipped)$ ]]
          prefix='SYNTHETIC_EVIDENCE_'
          printf '%s%s {"run_id":"%s-%s","head_sha":"%s","observation_outcome":"%s","recheck_outcome":"%s"}\n' "$prefix" 'END' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$OBSERVATION_OUTCOME" "$RECHECK_OUTCOME"
