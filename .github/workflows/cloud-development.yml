name: Cloud Development Checks

on:
  pull_request:
    paths:
      - .agents/skills/site-trust-improvement-loop/**
      - lib/models/savings_life_plan.dart
      - lib/services/savings_life_plan_service.dart
      - lib/services/savings_life_plan_store.dart
      - lib/services/savings_plan_proposal_service.dart
      - test/services/savings_plan_proposal_service_test.dart
      - lib/widgets/savings_life_plan_card.dart
      - test/services/savings_life_plan_service_test.dart
      - test/services/savings_life_plan_store_test.dart
      - test/widgets/savings_life_plan_card_test.dart
      - test/fixtures/savings_life_plan_app.dart
      - test/e2e/savings_life_plan.spec.ts
      - lib/models/asset_balance_observation.dart
      - lib/widgets/asset_balance_history_control.dart
      - test/models/asset_balance_observation_test.dart
      - test/widgets/asset_balance_history_control_test.dart
      - test/fixtures/asset_balance_history_app.dart
      - test/e2e/asset_balance_history.spec.ts
      - .devcontainer/**
      - .github/workflows/cloud-development.yml
      - lib/widgets/slide_number_check_card.dart
      - lib/services/slide_number_check.dart
      - test/fixtures/slide_number_check_app.dart
      - test/e2e/slide_number_check.spec.ts
      - lib/pages/ai_search_page.dart
      - test/pages/ai_search_page_test.dart
      - test/fixtures/ai_search_app.dart
      - test/e2e/ai_search_pending.spec.ts
      - lib/models/platform_release_checklist.dart
      - lib/pages/platform_release_checklist_page.dart
      - test/e2e/platform_release_checklist.spec.ts
      - scripts/cloud_ci_handoff.py
      - scripts/cloud_ci_handoff_test.py
      - scripts/cloud_first_route.py
      - scripts/cloud_first_route_test.py
      - scripts/serve_spa.py
      - docs/CLOUD_FIRST_DEVELOPMENT.md
      - docs/CLOUD_FIRST_DEVELOPMENT_WORKFLOW.md
      - docs/CLAUDE_CODE_SETUP_RUNBOOK.md
      - AGENTS.md
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-character pushed HEAD that this run must validate
        required: true
        type: string
      expected_qa_ref:
        description: Exact QA branch ref; required only for payslip-fixed-lock
        required: false
        default: ''
        type: string
      qa_source_sha:
        description: Exact reviewed source SHA; fixed source tree and file pins are also enforced
        required: false
        default: ''
        type: string
      qa_scope:
        description: Diagnostic scope only; partial runs never prove the full test suite
        required: false
        default: all
        type: choice
        options:
          - all
          - web-build-only
          - browser-only
      profile:
        description: Cloud validation profile
        required: true
        default: full
        type: choice
        options:
          - workspace
          - format
          - analyze
          - test
          - web-build
          - full
          - payslip-fixed-lock
  workflow_call:
    inputs:
      expected_head_sha:
        description: Optional exact HEAD assertion for reusable callers
        required: false
        default: ''
        type: string
      profile:
        description: Cloud validation profile
        required: false
        default: full
        type: string

permissions: {}

concurrency:
  group: cloud-development-${{ github.ref }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  validate:
    if: inputs.profile != 'payslip-fixed-lock'
    name: ${{ inputs.profile || 'full' }} on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLOUD_PROFILE: ${{ inputs.profile || 'full' }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}

    steps:
      - name: Checkout shallow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Verify exact cloud handoff SHA
        if: env.EXPECTED_HEAD_SHA != ''
        shell: bash
        run: |
          set -euo pipefail
          actual_head_sha="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_head_sha must be a lowercase 40-character Git SHA."
            exit 1
          fi
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Cloud handoff mismatch: expected $EXPECTED_HEAD_SHA, checked out $actual_head_sha."
            exit 1
          fi
          echo "Verified exact cloud handoff SHA: $actual_head_sha"

      - name: Validate cloud workspace descriptors
        shell: bash
        run: |
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          python -m json.tool .devcontainer/flutter-local/devcontainer.json > /dev/null

      - name: Set up repository-pinned Flutter SDK
        if: env.CLOUD_PROFILE != 'workspace'
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Resolve dependencies in cloud
        if: env.CLOUD_PROFILE != 'workspace'
        run: flutter pub get

      - name: Format changed Dart files in cloud
        id: format
        if: env.CLOUD_PROFILE == 'format'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "${DEFAULT_BRANCH}"
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "origin/${DEFAULT_BRANCH}" HEAD -- '*.dart' \
              | while IFS= read -r file; do
                  [ -f "$file" ] && printf '%s\n' "$file"
                done
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed Dart files were found."
            exit 0
          fi

          dart format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The changed Dart files already match the pinned formatter."
            exit 0
          fi

          mkdir -p cloud-format-output/files
          git diff --binary -- "${files[@]}" > cloud-format-output/cloud-format.patch
          printf '%s\n' "${files[@]}" > cloud-format-output/manifest.txt
          for file in "${files[@]}"; do
            mkdir -p "cloud-format-output/files/$(dirname "$file")"
            cp "$file" "cloud-format-output/files/$file"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Preserve formatter output briefly
        if: steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-format-${{ github.run_id }}
          path: cloud-format-output
          if-no-files-found: error
          retention-days: 1

      - name: Analyze in cloud
        if: env.CLOUD_PROFILE == 'analyze' || env.CLOUD_PROFILE == 'full'
        run: flutter analyze

      - name: Test in cloud
        if: env.CLOUD_PROFILE == 'test' || env.CLOUD_PROFILE == 'full'
        run: flutter test --concurrency=2

      - name: Build Flutter Web in cloud
        id: web_build
        if: env.CLOUD_PROFILE == 'web-build' || env.CLOUD_PROFILE == 'full'
        run: flutter build web --release --pwa-strategy=none

      - name: Package verified Sea Shelter 3D assets
        if: env.CLOUD_PROFILE == 'web-build' || env.CLOUD_PROFILE == 'full'
        uses: ./.github/actions/prepare-sea-shelter-arena
        with:
          web-root: build/web

      - name: Preserve web build briefly
        if: steps.web_build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloud-web-build-${{ github.run_id }}
          path: build/web
          if-no-files-found: error
          retention-days: 1

      - name: Cloud execution summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Cloud Development Checks'
            echo ''
            echo '| Item | Value |'
            echo '| --- | --- |'
            echo "| profile | \`${CLOUD_PROFILE}\` |"
            echo "| ref | \`${GITHUB_REF}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| expected commit | \`${EXPECTED_HEAD_SHA:-event SHA}\` |"
            echo '| local Flutter/Dart work | none |'
            echo '| artifact retention | 1 day when a web build or formatter output runs |'
          } >> "$GITHUB_STEP_SUMMARY"

  platform-release-checklist-e2e:
    name: Platform release checklist E2E
    if: github.event_name == 'pull_request' || inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository-pinned Flutter SDK
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Resolve dependencies and build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none \
            --dart-define=ENVIRONMENT=visual-test \
            --dart-define=SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_visual_regression_fixture

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run platform release checklist E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > checklist-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/platform_release_checklist.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0

      - name: Upload checklist E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: platform-release-checklist-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            checklist-server.log
          if-no-files-found: ignore

