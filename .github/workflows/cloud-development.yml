          d340e3789865fb78a08d27f8e20c27d42578d42d9d4ccfc2a4c10e7874e7c24c  runner_stopped_truncate_draft.py
          d0635f7b249e26e93b3f2c2775b249e332653681e00698780f72a742affbb92d  review_stopped/fixture_setup.sql.txt
          11a616066db4fa5784252a20ffd8c63942b3b26a7044c7f8b21c3faab11d3355  review_stopped/fixture_v5_preseed.sql.txt
          c036cec12bc4d2c371fe5af28d9125805c6630b8d714bf143846cce207eec5a7  review_stopped/candidate_v2_unreviewed.sql.txt
          e8f13a55397ffabd5422af6a3113eca39b967e61bc74b4883f24d9524c12af24  review_stopped/write_v5_unreviewed.sql.txt
          bf68f7193983058ad6bdde2d5a07bcfd132747cd1e3c29caee43dc021054234b  review_stopped/fixture_guard_v5.sql.txt
          5f3ef980c776c7978c3817c4844b5c752fa3a8823fc63838482450b2125783db  review_stopped/fixture_v5_assertions.sql.txt
          b31137fdcda140a212f1ca9472d847ab7f69af414ede9f5d516e7e807a452265  review_stopped/fixture_v5_rollback.sql.txt
          4e02ff550e587621fdf38ade70dca5bfca6692356d6b5c93830305fba9765b6b  review_stopped/fixture_session_a.sql.txt
          64d43984a84203dcc7b197994bf5a630461bd7af13590af7ff07bdff73ddb2b5  review_stopped/fixture_session_b.sql.txt
          96d8259d5cf828a5f8846e56080d33058a9706b7757c7e601263d5ebad6d6503  review_stopped/fixture_verify_wait.sql.txt
          618cc9d6e996d98e8fc9335f03e479cceba3e2ed1dda2ac359ae7b190448da6f  review_stopped/fixture_verify_concurrency.sql.txt
          b8b5361a3241ee9d94bdff39757f1062001391ac637c03613fe4999ef40af473  same_request_runner_review_stopped/session_a.sql.txt
          eb0b65c74e0c51857505b39416f92778e0ede031791081d1e067d2e7088035f4  same_request_runner_review_stopped/session_b.sql.txt
          3aeb93706dd54724c46fd719bfed20b86ab425e95dcceb326725755c2662b74e  same_request_runner_review_stopped/session_c.sql.txt
          cdc4a48d00a8fe5d14cf21a3bcef4fe52016f86b4c7447810786a33dca9b282d  same_request_runner_review_stopped/verify_final.sql.txt
          420d22925d78c2e679a623202095a3ff018994d6c163b784770719a4c63521b4  same_request_runner_review_stopped/verify_wait.sql.txt
          c4a1c47a65684da4d8637d03ee613f36e7dff016071392700529e6dacd4d0132  truncate_fixture_review_stopped.sql.txt
          FIXED_HASHES
      - name: Run pure safety tests
        working-directory: docs/proposals/debt_day_cas
        run: python3 -B runner_stopped_truncate_draft.py --self-test
      - name: Run synthetic sequential and concurrent fixtures
        working-directory: docs/proposals/debt_day_cas
        env:
