name: Dining namespace diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
concurrency:
  group: dining-page-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare namespace views
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          ACTUAL_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$ACTUAL_HEAD"
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            python3 -c '\''import json, os, subprocess; links = json.loads(subprocess.check_output(["ip", "-j", "link", "show"], timeout=5)); assert isinstance(links, list); names = [x["ifname"] for x in links]; print("current_namespace_only_lo=" + str(names == ["lo"]).lower()); print("sysfs_only_lo=" + str(set(os.listdir("/sys/class/net")) == {"lo"}).lower()); assert names == ["lo"]'\''
          '
