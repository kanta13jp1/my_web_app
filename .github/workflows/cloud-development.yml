name: Asset AI system Chrome matched driver diagnostic (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check fixed diagnostic head and product-only difference
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          PRODUCT_HEAD: 36dc9a6d4321f87ef4d093ac024b47e98e788a18
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" = 2
          test "$(git diff --name-only "$PRODUCT_HEAD" HEAD)" = '.github/workflows/cloud-development.yml'
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve test dependencies
        run: flutter pub get
      - name: Run original synthetic VM preflight
        run: flutter test test/widgets/asset_triage_withdrawal_test.dart --reporter expanded
      - name: Install driver matching system Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matched-driver" .ci-logs
          browser_path="$(command -v google-chrome)"
          browser_version="$("$browser_path" --version | awk '{print $NF}')"
          [[ "$browser_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'browser path: %s\nbrowser version: %s\n' "$browser_path" "$browser_version" | tee .ci-logs/binary-versions.log
          printf 'browser resolved launcher: %s\n' "$(readlink -f "$browser_path")" | tee -a .ci-logs/binary-versions.log
          sha256sum "$(readlink -f "$browser_path")" | tee -a .ci-logs/binary-versions.log
          curl --fail --silent --show-error --location --max-time 180 \
            -o "$RUNNER_TEMP/matched-driver/driver.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$browser_version/linux64/chromedriver-linux64.zip"
          unzip -q "$RUNNER_TEMP/matched-driver/driver.zip" -d "$RUNNER_TEMP/matched-driver"
          driver="$RUNNER_TEMP/matched-driver/chromedriver-linux64/chromedriver"
          driver_version="$("$driver" --version | awk '{print $2}')"
          test "$driver_version" = "$browser_version"
          printf 'driver path: %s\ndriver version: %s\n' "$driver" "$driver_version" | tee -a .ci-logs/binary-versions.log
          sha256sum "$driver" | tee -a .ci-logs/binary-versions.log
      - name: Run original synthetic Chrome flow with system browser
        shell: bash
        run: |
          set -euo pipefail
          driver_port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          "$RUNNER_TEMP/matched-driver/chromedriver-linux64/chromedriver" --port="$driver_port" > .ci-logs/chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$driver_pid" 2>/dev/null; then cat .ci-logs/chromedriver.log; exit 1; fi
            if curl --fail --silent "http://127.0.0.1:$driver_port/status" > /dev/null; then break; fi
            sleep 1
          done
          kill -0 "$driver_pid"
          ss -ltnp "sport = :$driver_port" | grep -F "pid=$driver_pid,"
          curl --fail --silent "http://127.0.0.1:$driver_port/status"
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_management_ai_current_input_test.dart \
            -d web-server --browser-name=chrome --headless \
            --driver-port "$driver_port" \
            --chrome-binary "$(command -v google-chrome)" \
            2>&1 | tee .ci-logs/asset-ai-browser.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: asset-ai-system-driver-diagnostic-${{ github.run_id }}
          path: .ci-logs/*.log
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
