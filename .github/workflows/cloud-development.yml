name: Synthetic asset payment-day browser candidate
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the reviewed dispatch branch
        required: true
        type: string

permissions: {}
concurrency:
  group: synthetic-asset-day-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed commit and create scratch
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
          SCRATCH: ${{ runner.temp }}/debt-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$EVENT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_SHA" ]]
          mkdir -m 700 "$SCRATCH"
          git archive --format=tar "$EVENT_SHA" | tar -x -C "$SCRATCH"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Warm dependencies before network isolation
        shell: bash
        env:
          SCRATCH: ${{ runner.temp }}/debt-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          flutter precache --web
          cd "$SCRATCH"
          flutter pub get
          chromedriver --version
          google-chrome --version
      - name: Run synthetic browser in loopback-only namespace
        id: browser
        shell: bash
        env:
          SCRATCH: ${{ runner.temp }}/debt-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          [[ "$pub_cache" == /* ]]
          chrome="$(command -v google-chrome)"
          [[ "$chrome" == /* ]]
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            ip link show lo >/dev/null
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" \
              RUNNER_TEMP="$4" GITHUB_WORKSPACE="$5" PUB_CACHE="$6" \
              SCRATCH="$7" CHROME_EXECUTABLE="$8" \
              NO_PROXY=127.0.0.1,localhost CI=true \
              bash "$7/scripts/run_browser_in_namespace.sh"
          ' _ "$(id -un)" "$PATH" "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$pub_cache" "$SCRATCH" "$chrome"
      - name: Record fixed status only
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.browser.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/debt-browser-status"
          if [[ "$OUTCOME" == success ]]; then
            printf 'synthetic-browser-passed\n' > "$RUNNER_TEMP/debt-browser-status/status.txt"
          else
            printf 'synthetic-browser-failed-or-not-run\n' > "$RUNNER_TEMP/debt-browser-status/status.txt"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: synthetic-asset-day-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debt-browser-status/status.txt
          retention-days: 3
