# Isolated compatibility diagnostic. Not a production workflow or release gate.
name: ACL version compatibility diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic head
        required: true
        type: string
permissions: {}
jobs:
  debt-cas-isolated:
    if: ${{ github.repository == 'kanta13jp1/my_web_app' && github.ref == 'refs/heads/codex/asset-pref-acl-idempotent-diagnostic-v2-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - major: '15'
            image: postgres@sha256:7da5d534f1ffcdb2f69efa6e466a7a29ff89eefd611c7b50c4d69aa77fd4a822
          - major: '16'
            image: postgres@sha256:b95b87e93ceb7594715d5c71fb6e09f6fc878851ab537735d617325eb9ba8b1b
          - major: '17'
            image: postgres@sha256:0b81cec82228160abfa753aeaad0609b709eb26eeb950f2e404ad2326e1cc370
    services:
      sequential:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: synthetic-debt-only
          POSTGRES_DB: debt_contract
        options: >-
          --label debt.cas.run=${{ github.run_id }}-${{ github.run_attempt }}
          --label debt.cas.lane=sequential
          --tmpfs /var/lib/postgresql/data:rw,nosuid,size=256m
          --ipc private
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable diagnostic inputs
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          SYNTHETIC_PG_MAJOR: ${{ matrix.major }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-list --parents -n 1 HEAD)" = "$EXPECTED_HEAD 6dcd68d8694cea574117724f728c9c8287367657"
          git diff --no-renames --name-only HEAD^ HEAD | LC_ALL=C sort > "$RUNNER_TEMP/acl-actual-files"
          LC_ALL=C sort > "$RUNNER_TEMP/acl-expected-files" <<'FIXED_FILES'
          .github/workflows/cloud-development.yml
          scripts/asset_pref_truncate_fixture/revoke_fixture_negative_v3_review_stopped.sql.txt
          scripts/asset_pref_truncate_fixture/revoke_fixture_positive_v3_review_stopped.sql.txt
          scripts/asset_pref_truncate_fixture/revoke_fixture_setup_v5_review_stopped.sql.txt
          scripts/asset_pref_truncate_fixture/revoke_truncate_candidate_review_stopped.sql.txt
          scripts/asset_pref_truncate_fixture/runner.py
          supabase/migrations/20261103063701_restrict_asset_pref_mirror_truncate.sql
          FIXED_FILES
          diff -u "$RUNNER_TEMP/acl-expected-files" "$RUNNER_TEMP/acl-actual-files"
          sha256sum -c <<'FIXED_HASHES'
          fb995082e9fd685e1d058839e7c0d64ba3ff66f589d0c084ba96eae06d7b0f5f  scripts/asset_pref_truncate_fixture/runner.py
          d0635f7b249e26e93b3f2c2775b249e332653681e00698780f72a742affbb92d  scripts/asset_pref_truncate_fixture/fixture_setup.sql.txt
          bb00057978b59a73230faced9df06e5894fa1c2a51b9acd910f9f47bd8a63e0f  scripts/asset_pref_truncate_fixture/revoke_fixture_setup_v5_review_stopped.sql.txt
          9f52ac20a5751644c895518e195c05af8433df721ccaf7b15876695a04951c86  scripts/asset_pref_truncate_fixture/revoke_fixture_negative_v3_review_stopped.sql.txt
          690600999315da035a81675736d054760bad73ef880c2c3f08b8e9b581328c81  scripts/asset_pref_truncate_fixture/revoke_fixture_positive_v3_review_stopped.sql.txt
          3372910f839d556a35d81dfd6ababe8c73438e52636d7fe8c491835528f1dfb6  scripts/asset_pref_truncate_fixture/revoke_truncate_candidate_review_stopped.sql.txt
          4907ee4aeead6af86ead8756c2841092c55b4436842ad4ad1629cc63478856d8  supabase/migrations/20261103063701_restrict_asset_pref_mirror_truncate.sql
          FIXED_HASHES
          python3 -B scripts/asset_pref_truncate_fixture/runner.py --self-test
      - name: Test only the verified disposable Postgres service
        env:
          SYNTHETIC_PG_MAJOR: ${{ matrix.major }}
          FIXTURE_SEQUENTIAL_ID: ${{ job.services.sequential.id }}
          FIXTURE_NETWORK_NAME: ${{ job.services.sequential.network }}
        run: python3 -B scripts/asset_pref_truncate_fixture/runner.py
