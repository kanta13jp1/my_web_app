# DRAFT ONLY. Do not register or dispatch without separate coordination.
# The diagnostic ref must contain only this workflow plus the two immutable
# diagnostics/ files named below. The product commit is checked out separately.
name: Debt dirty store conditional acknowledgement diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic-inputs
          persist-credentials: false
      - name: Checkout immutable published base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 237d9290183c3bb3df73388ec9cf4563bb0186ef
          path: base
          persist-credentials: false
      - name: Verify exact inputs and apply store-only patch
        shell: bash
        run: |
          set -euo pipefail
          patch=diagnostic-inputs/diagnostics/debt_override_conditional_ack_store_only_DRAFT.patch
          testfile=diagnostic-inputs/diagnostics/debt_override_conditional_ack_store_test_DRAFT.dart
          echo '0715d4ea0822a8e1b47880db74adc1a66fb391fdcc8701222b988d19b6f69660  '"$patch" | sha256sum -c -
          echo '3eb854b2fde562e9ac88e92bf9b86cec73fa10b09340fbaa2705cd29026a52ed  '"$testfile" | sha256sum -c -
          test "$(git -C base rev-parse HEAD)" = 237d9290183c3bb3df73388ec9cf4563bb0186ef
          test "$(git -C base rev-parse HEAD:lib/services/asset_sync_dirty_keys_store.dart)" = 3a6501a032f6623374ec222474bcc4408327233c
          test "$(git -C base hash-object lib/services/asset_sync_dirty_keys_store.dart)" = 3a6501a032f6623374ec222474bcc4408327233c
          test ! -e base/test/services/asset_sync_dirty_keys_conditional_clear_test.dart
          git -C base apply --check ../"$patch"
          git -C base apply ../"$patch"
          cp "$testfile" base/test/services/asset_sync_dirty_keys_conditional_clear_test.dart
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.10'
          cache: false
      - name: Resolve dependencies with existing cloud SDK
        working-directory: base
        run: |
          set -euo pipefail
          flutter pub get
          git diff --stat -- pubspec.lock
      - name: Format only the store and diagnostic test
        working-directory: base
        run: dart format lib/services/asset_sync_dirty_keys_store.dart test/services/asset_sync_dirty_keys_conditional_clear_test.dart
      - name: Analyze only the store and diagnostic test
        working-directory: base
        run: flutter analyze lib/services/asset_sync_dirty_keys_store.dart test/services/asset_sync_dirty_keys_conditional_clear_test.dart
      - name: Run only the conditional-acknowledgement store tests
        working-directory: base
        run: flutter test test/services/asset_sync_dirty_keys_conditional_clear_test.dart --reporter expanded
