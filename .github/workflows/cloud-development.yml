name: Payment owner boundary (detached synthetic)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated presentation component commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact head and sources
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:lib/services/payment_day_boundary_candidate.dart)" = "63daa99f98996ed0b1786bdd7eb42dd1bc8965a6"
          test "$(git rev-parse HEAD:test/services/payment_day_boundary_candidate_test.dart)" = "748ab8ff8fbe2e0c184a87f6bef3568a255b763d"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve dependencies
        id: prepare
        run: flutter pub get
      - name: Format detached candidates
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: dart format lib/services/payment_day_boundary_candidate.dart test/services/payment_day_boundary_candidate_test.dart
      - name: Analyze detached boundary
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: flutter analyze --no-pub lib/services/payment_day_boundary_candidate.dart
      - name: Analyze synthetic test
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: flutter analyze --no-pub test/services/payment_day_boundary_candidate_test.dart
      - name: Run isolated boundary tests with loopback only
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              flutter test --no-pub test/services/payment_day_boundary_candidate_test.dart --reporter expanded
          ' _ "$(id -un)" "$PATH" "$HOME"
