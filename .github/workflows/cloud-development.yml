name: Cloud Development Checks
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
      profile:
        required: true
        default: workspace
        type: string
permissions: {}
jobs:
  recurring-income-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact head
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Focused income cadence regression
        run: |
          set -euo pipefail
          mkdir -p .ci-logs/recurring-income
          flutter pub get
          dart format lib/services/asset_category_budget_store.dart test/services/asset_category_budget_clear_test.dart
          flutter analyze --no-pub lib/services/asset_category_budget_store.dart test/services/asset_category_budget_clear_test.dart
          flutter test --no-pub --reporter expanded test/services/asset_category_budget_clear_test.dart | tee .ci-logs/recurring-income/tests.log
      - name: Preserve sources
        if: always()
        run: |
          mkdir -p .ci-logs/recurring-income/source
          cp --parents lib/services/asset_category_budget_store.dart test/services/asset_category_budget_clear_test.dart .ci-logs/recurring-income/source/
          git diff -- lib/services/asset_category_budget_store.dart test/services/asset_category_budget_clear_test.dart > .ci-logs/recurring-income/mechanical.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recurring-income-${{ github.run_id }}
          path: .ci-logs/recurring-income
