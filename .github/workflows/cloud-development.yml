name: Echo incident source formatting
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact source
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Format only feature Dart files
        run: |
          dart format lib/pages/echo_pump_game_page.dart lib/widgets/echo_pump_incident.dart test/widgets/echo_pump_incident_test.dart test/pages/echo_pump_incident_flow_test.dart
          mkdir -p formatted
          cp --parents lib/pages/echo_pump_game_page.dart lib/widgets/echo_pump_incident.dart test/widgets/echo_pump_incident_test.dart test/pages/echo_pump_incident_flow_test.dart formatted/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-source
          path: formatted/
          retention-days: 3
