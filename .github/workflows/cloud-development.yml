name: Debt identity collision diagnostic (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify fixed head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Prepare dependencies
        run: flutter pub get
      - name: Analyze affected files
        run: >-
          flutter analyze --no-pub
          lib/pages/asset_management_page.dart
          lib/services/asset_debt_id_conflict.dart
          test/services/asset_debt_id_conflict_test.dart
          test/widgets/asset_debt_owner_page_test.dart
      - name: Run synthetic identity cases
        run: flutter test --no-pub test/services/asset_debt_id_conflict_test.dart
      - name: Run actual page tests with isolated network
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true flutter test --no-pub test/widgets/asset_debt_owner_page_test.dart
          ' _ "$(id -un)" "$PATH" "$HOME"
