          # worker APIは用途を分けた専用tokenで認証する。
          deploy_function video-generation-hub --no-verify-jwt
          deploy_function video-worker-hub --no-verify-jwt
          # 承認済みの exact artifact/review だけを、非公開配信・Stripe固定価格・
          # /shop 検証・rollback の順に公開する。service role定期実行も関数内で再認証。
          deploy_function video-commerce-hub --no-verify-jwt
          # 退会申請は user JWT、期限到来後の破壊的 worker は service_role を
          # 関数内で再検証する。scheduled workflow は owner/legal 承認後に
          # ACCOUNT_DELETION_AUTOMATION_ENABLED=true で有効化する。
          deploy_function account-lifecycle --no-verify-jwt

          # --- Mega-Hub (5本: 旧Tier2全統合) ---
          deploy_function tools-hub --no-verify-jwt
