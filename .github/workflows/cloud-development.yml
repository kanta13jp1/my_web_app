# Draft only: do not register or run without the separately authorized diagnostic step.
# Source: official CfT manifest observed 2026-10-27, Stable 156.0.8078.47, revision 1706539.
# https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json
# SHA-256 here fingerprints received bytes; it is NOT an independently published
# Google checksum, a signature, or evidence of authenticity. Compare it with a
# later fetch and separately verify the official version and source URL.
# The size interval below is a conservative local policy, NOT an official size.
# A matching interval does not establish the expected exact size.
name: Draft - fetch pinned Chrome for Testing archive metadata only
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect archive without executing browser
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          task_tmp="$(mktemp -d "$RUNNER_TEMP/cft-fetch.XXXXXXXX")"
          trap 'rm -rf -- "$task_tmp"' EXIT
          pinned_version='156.0.8078.47'
          pinned_url='https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-linux64.zip'
          # No checkout, artifacts, credentials, browser profile, or secrets are used.
          # curl does not follow redirects; the Python checks below reject any
          # redirect response or Location header, missing size, or changed URL.
          if ! env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/curl --disable \
            --noproxy '*' --silent --fail --proto '=https' --max-redirs 0 \
            --connect-timeout 20 --max-time 240 --max-filesize 400000000 \
            --dump-header "$task_tmp/headers" --output "$task_tmp/archive.zip" \
            --write-out '%{http_code}\n%{url_effective}\n%{redirect_url}\n' \
            "$pinned_url" > "$task_tmp/response" 2>/dev/null; then
            printf '%s\n' 'Archive transfer failed; no metadata accepted.' >&2
            exit 1
          fi
          env -i PATH=/usr/bin:/bin LC_ALL=C \
            ZIP_FILE="$task_tmp/archive.zip" HEADER_FILE="$task_tmp/headers" \
            RESPONSE_FILE="$task_tmp/response" EXPECTED_URL="$pinned_url" \
            PINNED_VERSION="$pinned_version" /usr/bin/python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import stat
          import sys
          import zipfile

          def fail():
              print('Archive validation failed; no metadata accepted.', file=sys.stderr)
              raise SystemExit(1)

          try:
              response = pathlib.Path(os.environ['RESPONSE_FILE']).read_text('ascii').splitlines()
              if len(response) != 3 or response[0] != '200' or response[1] != os.environ['EXPECTED_URL'] or response[2] != '':
                  fail()
              headers = pathlib.Path(os.environ['HEADER_FILE']).read_bytes().decode('iso-8859-1').splitlines()
              if any(line.lower().startswith('location:') for line in headers):
                  fail()
              lengths = [line.split(':', 1)[1].strip() for line in headers if line.lower().startswith('content-length:')]
              if len(lengths) != 1 or re.fullmatch(r'[0-9]+', lengths[0]) is None:
                  fail()
              archive = pathlib.Path(os.environ['ZIP_FILE'])
              size = archive.stat().st_size
              if not (50_000_000 <= size <= 400_000_000) or size != int(lengths[0]):
                  fail()
              digest = hashlib.sha256()
              with archive.open('rb') as src:
                  for chunk in iter(lambda: src.read(1024 * 1024), b''):
                      digest.update(chunk)
              with zipfile.ZipFile(archive) as z:
                  members = z.infolist()
                  matches = [m for m in members if m.filename == 'chrome-linux64/deb.deps']
                  if len(members) > 10000 or len(matches) != 1:
                      fail()
                  entry = matches[0]
                  mode = entry.external_attr >> 16
                  if entry.is_dir() or (stat.S_IFMT(mode) not in (0, stat.S_IFREG)) or not (1 <= entry.file_size <= 65536):
                      fail()
                  # Reading the one exact member verifies its ZIP CRC; no file is extracted.
                  deps = z.read(entry).decode('ascii')
                  if any(ord(ch) < 32 and ch not in '\r\n\t' or ord(ch) == 127 for ch in deps):
                      fail()
              print('manifest_version=' + os.environ['PINNED_VERSION'])
              print('archive_bytes=' + str(size))
              print('archive_sha256=' + digest.hexdigest())
              print('deb.deps:')
              print(deps, end='' if deps.endswith('\n') else '\n')
          except (OSError, ValueError, UnicodeError, zipfile.BadZipFile, RuntimeError, KeyError):
              fail()
          PY