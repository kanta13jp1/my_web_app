name: Borrowing UI no-save probe
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    if: github.sha == inputs.expected_head_sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Format and analyze synthetic fixture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          flutter pub get
          dart format integration_test/asset_borrowing_unsaved_test.dart
          flutter analyze integration_test/asset_borrowing_unsaved_test.dart 2>&1 | tee .ci-logs/borrowing-analyze.log
      - name: Inspect without saving in both viewports
        shell: bash
        run: |
          set -o pipefail
          chromedriver --port=4444 > .ci-logs/borrowing-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then dimensions=390x851@2.75; mobile=true; fi
            flutter drive --verbose \
              --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/asset_borrowing_unsaved_test.dart \
              --dart-define="TRIAGE_MOBILE=$mobile" \
              --browser-dimension="$dimensions" \
              -d web-server --browser-name=chrome --headless \
              2>&1 | tee ".ci-logs/borrowing-$viewport.log"
          done
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: borrowing-ui-${{ github.run_id }}
          path: |
            .ci-logs/borrowing-*.log
            .ci-logs/asset-triage-visual/**
            integration_test/asset_borrowing_unsaved_test.dart
          include-hidden-files: true
          retention-days: 3
