name: Jev JSON candidate 3.38 dependency snapshot exploration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-json-candidate-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PUB_HOSTED_URL: https://pub.dev
      PUB_CACHE: ${{ runner.temp }}/jev-pub-cache
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 58ef471d2eacc6456c18725cd26510b0aee3f37b
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 58ef471d2eacc6456c18725cd26510b0aee3f37b
          test "$(git rev-parse HEAD:pubspec.yaml)" = 45a75645971f7e25b9d49b547c86870947ef1c73
          test "$(git rev-parse HEAD:pubspec.lock)" = 4a7a1e15d0ef9812f6de82eed12a00bc6d9632c1
          git clone --depth 1 --branch 3.38.10 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Capture resolved dependencies and verify lock
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git diff --exit-code -- pubspec.yaml
          cp pubspec.lock "$RUNNER_TEMP/jev-resolved.lock"
          ruby -ryaml -rjson -rdigest - "$RUNNER_TEMP/jev-resolved.lock" <<'RUBY'
          def check_nodes(node)
            abort 'unexpected alias' if node.is_a?(Psych::Nodes::Alias)
            if node.is_a?(Psych::Nodes::Mapping)
              keys = node.children.each_slice(2).map do |key, _|
                abort 'unexpected non-scalar key' unless key.is_a?(Psych::Nodes::Scalar)
                key.value
              end
              abort 'duplicate mapping key' unless keys.uniq.length == keys.length
            end
            node.children&.each { |child| check_nodes(child) } if node.respond_to?(:children)
          end
          raw_lock = File.read(ARGV.fetch(0))
          stream = Psych.parse_stream(raw_lock)
          abort 'unexpected document count' unless stream.children.length == 1
          check_nodes(stream)
          lock = YAML.safe_load(raw_lock)
          abort 'unexpected lock structure' unless lock.is_a?(Hash) && lock.keys.sort == %w[packages sdks]
          packages = lock.fetch('packages')
          sdks = lock.fetch('sdks')
          abort 'unexpected lock structure' unless packages.is_a?(Hash) && sdks.is_a?(Hash) && sdks.keys.sort == %w[dart flutter]
          abort 'unexpected sdk constraint' unless sdks.values.all? { |v| v.is_a?(String) && v.match?(/\A[0-9A-Za-z<>=.^+ -]+\z/) }
          packages.each do |name, entry|
            abort 'unexpected package' unless name.is_a?(String) && name.match?(/\A[a-z_][a-z0-9_]*\z/) && entry.is_a?(Hash)
            abort 'unexpected package fields' unless entry.keys.sort == %w[dependency description source version]
            abort 'unexpected dependency' unless ['direct main', 'direct dev', 'transitive'].include?(entry['dependency'])
            abort 'unexpected version' unless entry['version'].is_a?(String) && entry['version'].match?(/\A\d+\.\d+\.\d+(?:[-+][a-zA-Z0-9.-]+)*\z/)
            if entry['source'] == 'sdk'
              abort 'unexpected sdk' unless entry['description'] == 'flutter'
            elsif entry['source'] == 'hosted'
              d = entry['description']
              abort 'unexpected hosted fields' unless d.is_a?(Hash) && d.keys.sort == %w[name sha256 url]
              abort 'unexpected hosted package' unless d['name'] == name && d['url'] == 'https://pub.dev' && d['sha256'].is_a?(String) && d['sha256'].match?(/\A[0-9a-f]{64}\z/)
            else
              abort 'unexpected source'
            end
          end
          normalized = JSON.pretty_generate(lock) + "\n"
          puts 'BEGIN_JEV_RESOLVED_LOCK_JSON'
          print normalized
          puts 'END_JEV_RESOLVED_LOCK_JSON'
          puts "JEV_NORMALIZED_JSON_SHA256=#{Digest::SHA256.hexdigest(normalized)}"
          RUBY
          sha256sum "$RUNNER_TEMP/jev-resolved.lock"
          flutter pub get --enforce-lockfile
          cmp pubspec.lock "$RUNNER_TEMP/jev-resolved.lock"
          flutter test --no-pub test/widgets/json_contract_checker_test.dart
      - name: Run synthetic browser tests at two viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          chromedriver --port=4444 > /tmp/jev-json-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          for viewport in desktop mobile; do
            dimensions=1440x900@1
            mobile=false
            if [ "$viewport" = mobile ]; then dimensions=393x851@2.75; mobile=true; fi
            flutter drive --no-pub --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/edge_llm_json_contract_test.dart \
              --browser-dimension="$dimensions" \
              --dart-define="JSON_QA_MOBILE=$mobile" \
              -d web-server --browser-name=chrome --headless
          done
          git diff --exit-code -- pubspec.yaml
          cmp pubspec.lock "$RUNNER_TEMP/jev-resolved.lock"
