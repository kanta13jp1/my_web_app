name: Workbook conditional estimate visual probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Format isolated fixture and analyze it
        run: |
          dart format integration_test/workbook_estimate_label_test.dart
          flutter analyze integration_test/workbook_estimate_label_test.dart
      - name: Verify conditional rows at both widths without saves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then dimensions=390x844@1; mobile=true; fi
            flutter drive --verbose --driver=test_driver/asset_triage_visual.dart               --target=integration_test/workbook_estimate_label_test.dart               --dart-define="LABEL_MOBILE=$mobile" --browser-dimension="$dimensions"               -d web-server --browser-name=chrome --headless               2>&1 | tee ".ci-logs/conditional-$viewport.log"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: workbook-conditional-${{ github.run_id }}
          path: |
            .ci-logs/**
          include-hidden-files: true
          retention-days: 7
