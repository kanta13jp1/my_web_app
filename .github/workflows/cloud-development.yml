        [[ "$PAYSLIP_BOUNDARY_READY" == true ]]
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/ /bin/bash --noprofile --norc "$PAYSLIP_ROOT/guards/offline.sh" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" app_build 900 "$QA_SOURCE_SHA"
    - name: Build and validate only the synthetic preview resources
      if: ${{ env.QA_SCOPE == 'all' || env.QA_SCOPE == 'browser-only' }}
      shell: bash
      timeout-minutes: 16
      run: |
        set -euo pipefail
        [[ "$PAYSLIP_BOUNDARY_READY" == true ]]
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/ /bin/bash --noprofile --norc "$PAYSLIP_ROOT/guards/offline.sh" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" fixture 900 "$QA_SOURCE_SHA"
    - name: Run the exact four synthetic browser cases with the same lock
      if: ${{ env.QA_SCOPE == 'all' || env.QA_SCOPE == 'browser-only' }}
      shell: bash
      timeout-minutes: 11
      run: |
        set -euo pipefail
        [[ "$PAYSLIP_BOUNDARY_READY" == true ]]
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/ /bin/bash --noprofile --norc "$PAYSLIP_ROOT/guards/offline.sh" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" browser 600 "$QA_SOURCE_SHA"
    - name: Always restore and verify source under the same offline runtime identity
      if: ${{ always() && env.PAYSLIP_BOUNDARY_READY == 'true' }}
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/ /bin/bash --noprofile --norc "$PAYSLIP_ROOT/guards/offline.sh" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" final 120 "$QA_SOURCE_SHA"
    - name: Publish a bounded no-follow snapshot only after every namespace has stopped
      id: publish
      if: ${{ always() && env.PAYSLIP_BOUNDARY_READY == 'true' }}
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        sudo -n env -i PATH=/usr/bin:/bin HOME=/ /usr/bin/python3 -I "$PAYSLIP_ROOT/guards/publish.py" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" "$(id -u)"
        printf 'validated=true\n' >> "$GITHUB_OUTPUT"
    - name: Preserve only the host-owned validated synthetic snapshot
      if: ${{ always() && steps.publish.outputs.validated == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: payslip-flutter-only-same-lock-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.PAYSLIP_ROOT }}/publish/
        retention-days: 1
        if-no-files-found: error
