            os.umask(0o022)
            root_fd = os.open('/', DIR_FLAGS)
            try:
                checked(os.fstat(root_fd), {0}, directory=True)
                parts = root_parts(root)
                for index, part in enumerate(parts):
                    # Matches seal_host_paths: chown 0:0 for the scratch root itself.
                    next_fd = child_dir(root_fd, part, {0}, 0)
                    os.close(root_fd)
                    root_fd = next_fd
                control = child_dir(root_fd, 'control', {0}, 0)
                try:
                    stopped = os.stat('final-stopped', dir_fd=control, follow_symlinks=False)
                    checked(stopped, {0}, 0)
                    require(stopped.st_size <= 128, 'invalid final-stopped marker')
                    # This shared, root-only atomic lease excludes every future namespace launcher.
                    # An interrupted launcher leaves its lease and blocks publication.
                    os.mkdir('lease', 0o700, dir_fd=control)
                    runtime_absent(uid)
                    source = child_dir(root_fd, 'results', {uid}, gid)
                    try:
                        budget = Budget()
                        items = scan(source, uid, gid, budget)
                        require(budget.files > 0, 'empty report snapshot')
                        os.mkdir('publish', 0o755, dir_fd=root_fd)
                        target = child_dir(root_fd, 'publish', {0}, 0)
                        try:
                            copied = [0]
                            copy_tree(source, target, items, uid, gid, copied)
                            require(copied[0] == budget.bytes, 'snapshot byte mismatch')
                            runtime_absent(uid)
                        finally:
                            os.close(target)
                    finally:
                        os.close(source)
                finally:
                    os.close(control)
            finally:
                os.close(root_fd)
            print('PUBLISH_VALIDATED files=' + str(budget.files) + ' bytes=' + str(budget.bytes))
        
        
        if __name__ == '__main__':
            if sys.argv[1:] == ['--verify-owner-contract']:
                verify_owner_contract()
            elif sys.argv[1:] == ['--verify-copy-boundary']:
                verify_copy_read_limit()
            else:
                main(sys.argv)
        PAYSLIP_PUBLISH_PY
        chmod 0400 "$PAYSLIP_ROOT/guards/publish.py"
        printf '%s  %s\n' be1d185d363726170d4919ebe13444a905332822af3fb95d0b20e1781d914e38 "$PAYSLIP_ROOT/guards/publish.py" | sha256sum -c -
        python3 -I "$PAYSLIP_ROOT/guards/publish.py" --verify-owner-contract
        python3 -I "$PAYSLIP_ROOT/guards/publish.py" --verify-copy-boundary
        python3 "$PAYSLIP_ROOT/guards/source_guard.py" "$PAYSLIP_ROOT" before_bootstrap
    - name: Bootstrap fixed tools and enforce the exact existing lock
      shell: bash
      timeout-minutes: 20
      run: |
        set -euo pipefail
        printf '{"scope":"%s","execution":"planned_not_yet_run","full_suite_acceptance":false,"production_ui_verified":false}\n' "$QA_SCOPE" > "$PAYSLIP_ROOT/results/QA_SCOPE.json"
        env -i PATH=/usr/bin:/bin HOME="$PAYSLIP_ROOT/home" curl --fail --location --connect-timeout 15 --max-time 240 --retry 0 --output "$PAYSLIP_ROOT/sdk/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz
        printf '%s  %s\n' 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a "$PAYSLIP_ROOT/sdk/flutter.tar.xz" | sha256sum -c -
        tar -xJf "$PAYSLIP_ROOT/sdk/flutter.tar.xz" -C "$PAYSLIP_ROOT/sdk"
        env -i PATH=/usr/bin:/bin HOME="$PAYSLIP_ROOT/home" curl --fail --location --connect-timeout 15 --max-time 240 --retry 0 --output "$PAYSLIP_ROOT/node/node.tar.xz" https://nodejs.org/dist/v22.21.1/node-v22.21.1-linux-x64.tar.xz
        printf '%s  %s\n' 680d3f30b24a7ff24b98db5e96f294c0070f8f9078df658da1bce1b9c9873c88 "$PAYSLIP_ROOT/node/node.tar.xz" | sha256sum -c -
        tar -xJf "$PAYSLIP_ROOT/node/node.tar.xz" --strip-components=1 -C "$PAYSLIP_ROOT/node"
        cd "$PAYSLIP_ROOT/source"
        clean_env=(env -i PATH="$PAYSLIP_ROOT/sdk/flutter/bin:$PAYSLIP_ROOT/node/bin:/usr/bin:/bin" HOME="$PAYSLIP_ROOT/home" PUB_CACHE="$PAYSLIP_ROOT/pub-cache" TMPDIR="$PAYSLIP_ROOT/tmp" XDG_CONFIG_HOME="$PAYSLIP_ROOT/config" XDG_CACHE_HOME="$PAYSLIP_ROOT/cache" PLAYWRIGHT_BROWSERS_PATH="$PAYSLIP_ROOT/browsers" npm_config_cache="$PAYSLIP_ROOT/npm-cache" CI=true FLUTTER_SUPPRESS_ANALYTICS=true DART_SUPPRESS_ANALYTICS=true GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1)
        "${clean_env[@]}" flutter --version --machine > "$PAYSLIP_ROOT/results/flutter-version.json"
        python3 "$PAYSLIP_ROOT/guards/source_guard.py" "$PAYSLIP_ROOT" after_version
        python3 - "$PAYSLIP_ROOT/results/flutter-version.json" <<'VERSION'
        import json,sys
        x=json.load(open(sys.argv[1],encoding='utf-8'))
        if x.get('frameworkVersion')!='3.47.9' or not x.get('dartSdkVersion','').startswith('3.13.7'):raise SystemExit('wrong SDK')
        VERSION
        "${clean_env[@]}" dart --version 2>&1 | grep -Eq '^Dart SDK version: 3[.]13[.]7([[:space:]]|$)'
        "${clean_env[@]}" node --version | grep -Fx 'v22.21.1'
        "${clean_env[@]}" flutter precache --web --linux
        python3 "$PAYSLIP_ROOT/guards/source_guard.py" "$PAYSLIP_ROOT" after_precache
        "${clean_env[@]}" flutter pub get --enforce-lockfile
        python3 "$PAYSLIP_ROOT/guards/source_guard.py" "$PAYSLIP_ROOT" after_pub_get
        "${clean_env[@]}" npm ci --ignore-scripts --no-audit --no-fund
        "${clean_env[@]}" node -e 'if(require("./node_modules/@playwright/test/package.json").version!=="1.64.1")process.exit(1)'
        "${clean_env[@]}" node node_modules/@playwright/test/cli.js install --with-deps chromium
        python3 "$PAYSLIP_ROOT/guards/source_guard.py" "$PAYSLIP_ROOT" after_npm
    - name: Create a dedicated runtime identity and seal host helpers
      shell: bash
      run: |
        set -euo pipefail
        identity_phase=create_identity
        trap 'rc=$?; printf "IDENTITY_SEAL_ERROR phase=%s line=%s rc=%s\n" "$identity_phase" "$LINENO" "$rc" >&2; exit "$rc"' ERR
        identity_mark() { identity_phase=${1}; printf 'IDENTITY_SEAL_PHASE=%s\n' "$identity_phase"; }
        identity_mark create_identity
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
        runtime_user="psqa_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        [[ "${#runtime_user}" -le 32 && "$(id -u)" -gt 0 ]]
        ! getent passwd "$runtime_user" >/dev/null
        ! getent group "$runtime_user" >/dev/null
        sudo -n /usr/sbin/groupadd --system "$runtime_user"
        sudo -n /usr/sbin/useradd --system --no-create-home --no-user-group --gid "$runtime_user" --home-dir "$PAYSLIP_ROOT/home" --shell /usr/sbin/nologin "$runtime_user"
        sudo -n /usr/sbin/usermod --lock "$runtime_user"
        uid="$(id -u "$runtime_user")"; gid="$(id -g "$runtime_user")"
        [[ "$uid" -gt 0 && "$gid" -gt 0 && "$uid" != "$(id -u)" && "$(id -G "$runtime_user")" == "$gid" ]]
        identity_mark "deny_runtime_sudo"
        if sudo -n -u "$runtime_user" -- /usr/bin/sudo -n true; then echo 'STOP: runtime has passwordless sudo'; exit 1; fi
        identity_mark "handoff_runtime_paths"
        sudo -n install -d -o "$uid" -g "$gid" -m 0700 "$PAYSLIP_ROOT/app-web"
        sudo -n chown -hR "$uid:$gid" "$PAYSLIP_ROOT/source" "$PAYSLIP_ROOT/sdk/flutter" "$PAYSLIP_ROOT/home" "$PAYSLIP_ROOT/tmp" "$PAYSLIP_ROOT/config" "$PAYSLIP_ROOT/cache" "$PAYSLIP_ROOT/pub-cache" "$PAYSLIP_ROOT/npm-cache" "$PAYSLIP_ROOT/browsers" "$PAYSLIP_ROOT/results" "$PAYSLIP_ROOT/app-web"
        sudo -n chmod -R u+rwX,go-rwx "$PAYSLIP_ROOT/source" "$PAYSLIP_ROOT/sdk/flutter" "$PAYSLIP_ROOT/home" "$PAYSLIP_ROOT/tmp" "$PAYSLIP_ROOT/config" "$PAYSLIP_ROOT/cache" "$PAYSLIP_ROOT/pub-cache" "$PAYSLIP_ROOT/npm-cache" "$PAYSLIP_ROOT/browsers" "$PAYSLIP_ROOT/results" "$PAYSLIP_ROOT/app-web"
        identity_mark "seal_host_paths"
        sudo -n chown -hR 0:0 "$PAYSLIP_ROOT/guards" "$PAYSLIP_ROOT/node" "$PAYSLIP_ROOT/candidate"
        sudo -n chmod -R go-w "$PAYSLIP_ROOT/node" "$PAYSLIP_ROOT/candidate"
        sudo -n chown 0:0 "$PAYSLIP_ROOT" "$PAYSLIP_ROOT/sdk" "$PAYSLIP_ROOT/control"
        sudo -n chmod 0755 "$PAYSLIP_ROOT" "$PAYSLIP_ROOT/sdk" "$PAYSLIP_ROOT/node"
        sudo -n chmod 0700 "$PAYSLIP_ROOT/control" "$PAYSLIP_ROOT/candidate"
        sudo -n chmod 0555 "$PAYSLIP_ROOT/guards"
        for file in source_guard.py report.py font_guard.py runtime.sh offline.sh publish.py; do
         identity_mark "verify_helper_$file"
         [[ -f "$PAYSLIP_ROOT/guards/$file" && ! -L "$PAYSLIP_ROOT/guards/$file" ]]
         sudo -n chmod 0444 "$PAYSLIP_ROOT/guards/$file"
         [[ "$(stat -c %u "$PAYSLIP_ROOT/guards/$file")" == 0 && "$(stat -c %h "$PAYSLIP_ROOT/guards/$file")" == 1 ]]
         if sudo -n -u "$runtime_user" -- /usr/bin/test -w "$PAYSLIP_ROOT/guards/$file"; then exit 1; fi
        done
        identity_mark "verify_helper_ancestors"
        ancestor="$PAYSLIP_ROOT/guards"
        while :; do
         if sudo -n -u "$runtime_user" -- /usr/bin/test -w "$ancestor"; then echo 'STOP: writable helper ancestor'; exit 1; fi
         [[ "$ancestor" == / ]] && break
         ancestor="$(dirname -- "$ancestor")"
        done
        identity_mark "runtime_source_search"
        sudo -n -u "$runtime_user" -- /usr/bin/test -x "$PAYSLIP_ROOT/source"
        identity_mark "runtime_guard_read"
        sudo -n -u "$runtime_user" -- /usr/bin/test -r "$PAYSLIP_ROOT/guards/runtime.sh"
        identity_mark "publish_boundary_env"
        printf 'PAYSLIP_RUNTIME_UID=%s\nPAYSLIP_RUNTIME_GID=%s\nPAYSLIP_BOUNDARY_READY=true\n' "$uid" "$gid" >> "$GITHUB_ENV"
    - name: Format analyze and run the exact 13 salary cases
      if: ${{ env.QA_SCOPE == 'all' }}
      shell: bash
      timeout-minutes: 11
      run: |
        set -euo pipefail
        [[ "$PAYSLIP_BOUNDARY_READY" == true ]]
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/ /bin/bash --noprofile --norc "$PAYSLIP_ROOT/guards/offline.sh" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" salary 600 "$QA_SOURCE_SHA"
    - name: Run all Flutter tests and preserve the exact known skip
      if: ${{ env.QA_SCOPE == 'all' }}
      shell: bash
      timeout-minutes: 21
      run: |
        set -euo pipefail
        [[ "$PAYSLIP_BOUNDARY_READY" == true ]]
        sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/ /bin/bash --noprofile --norc "$PAYSLIP_ROOT/guards/offline.sh" "$PAYSLIP_ROOT" "$PAYSLIP_RUNTIME_UID" "$PAYSLIP_RUNTIME_GID" full 1200 "$QA_SOURCE_SHA"
