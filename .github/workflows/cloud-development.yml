name: Published pump verification only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Install pinned MCP
        run: |
          python3 -m pip install mcp==1.26.0
          npm install --prefix /tmp/echo-mcp --save-exact @playwright/mcp@0.0.83
          /tmp/echo-mcp/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify public keyboard with focus settling
        env:
          MCP_EXPECT_KEYBOARD: '1'
          EXPECTED_PRODUCTION_SHA: 04385c74ed3dd0b5a937fec596503f4e59b03664
        run: python3 scripts/echo_pump_playwright_mcp/probe.py
      - name: Verify public game both widths
        env:
          EXPECTED_PRODUCTION_SHA: 04385c74ed3dd0b5a937fec596503f4e59b03664
        run: node scripts/echo_pump_release/public_pump.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pump-focus-postcheck-${{ github.run_id }}
          path: |
            echo-pump-public/
            mcp-browser-evidence/
          retention-days: 14
