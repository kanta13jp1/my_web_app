name: Dart owner IndexedDB diagnostic (synthetic only)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify immutable synthetic files
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate.dart)" = "bc12ead78b33835b2e83aebb20ff7ea0c876d7da"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate_types.dart)" = "6e995e73766fcb9d06400089a18ea490531b902b"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate_stub.dart)" = "7a98d28f44f4e2bf6d40272a524a534920674345"
          test "$(git rev-parse HEAD:lib/services/payment_owner_local_candidate_web.dart)" = "d9b94f73c91dd716cadef5d550c1a0d468536a8c"
          test "$(git rev-parse HEAD:web/payment_owner_candidate_probe.dart)" = "db1337d35b3b45324b986eaeeb4c0087055972d6"
          test "$(git rev-parse HEAD:test/payment_owner_candidate_stub_test.dart)" = "a2fbd734bfe45022394273a00f379092c6f0ec9f"
          test "$(git rev-parse HEAD:test/synthetic/payment_owner_dart_idb_probe.cjs)" = "d6e883df467cc03919889e1cebf85bcf7a82104f"
          test "$(git rev-parse HEAD:test/synthetic/run_payment_owner_dart_probe.sh)" = "ab1e6a47b18a5930a6b44cf1445983dc6b4517d0"
          test "$(git rev-parse HEAD:test/synthetic/payment_owner_prefix_loss_probe.cjs)" = "925ab881cea1cc946fdcabd395087c585170774e"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Prepare locked dependencies
        run: |
          set -euo pipefail
          flutter pub get
          npm ci --ignore-scripts
      - name: Check targeted formatter and analyzer
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib/services/payment_owner_local_candidate.dart lib/services/payment_owner_local_candidate_types.dart lib/services/payment_owner_local_candidate_stub.dart lib/services/payment_owner_local_candidate_web.dart web/payment_owner_candidate_probe.dart test/payment_owner_candidate_stub_test.dart
          flutter analyze --no-pub lib/services/payment_owner_local_candidate.dart lib/services/payment_owner_local_candidate_types.dart lib/services/payment_owner_local_candidate_stub.dart lib/services/payment_owner_local_candidate_web.dart web/payment_owner_candidate_probe.dart test/payment_owner_candidate_stub_test.dart
      - name: Test detached Dart and two-tab Chrome on loopback only
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true SYNTHETIC_DART_JS="$4" bash test/synthetic/run_payment_owner_dart_probe.sh
          ' _ "$(id -un)" "$PATH" "$HOME" "$RUNNER_TEMP/synthetic-owner-candidate.js"
