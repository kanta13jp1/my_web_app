name: Debt override race diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Apply diagnostic hooks to the exact public page
        run: |
          test "$(git rev-parse HEAD:lib/pages/asset_management_page.dart)" = 35749bb77a1e93fcb8b4bf9a2c0c715baa892193
          git apply --check diagnostics/debt_override_page_probe_guarded.patch
          git apply diagnostics/debt_override_page_probe_guarded.patch
      - run: dart format test/widgets/debt_override_page_race_probe_test.dart
      - run: flutter analyze lib/pages/asset_management_page.dart test/widgets/debt_override_page_race_probe_test.dart
      - name: Verify old acknowledgement cannot clear a later edit
        run: flutter test test/widgets/debt_override_page_race_probe_test.dart --reporter expanded
