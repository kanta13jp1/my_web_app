name: Borrowing client route diagnostic only
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact source
        env:
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Format scoped draft
        run: dart format lib/pages/asset_management_page.dart lib/pages/behavior_review_page.dart lib/pages/home_page.dart lib/services/asset_flow_request.dart test/services/asset_flow_request_test.dart
      - name: Analyze scoped draft
        run: flutter analyze lib/pages/asset_management_page.dart lib/pages/behavior_review_page.dart lib/pages/home_page.dart lib/services/asset_flow_request.dart test/services/asset_flow_request_test.dart
      - name: Verify SDK HTTP serialization
        run: flutter test test/services/asset_flow_request_test.dart --reporter expanded
      - name: Inspect without saving in both viewports
        shell: bash
        run: |
          set -o pipefail
          chromedriver --port=4444 > .ci-logs/borrowing-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then dimensions=390x851@2.75; mobile=true; fi
            flutter drive --verbose \
              --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/asset_borrowing_unsaved_test.dart \
              --dart-define="TRIAGE_MOBILE=$mobile" \
              --browser-dimension="$dimensions" \
              -d web-server --browser-name=chrome --headless \
              2>&1 | tee ".ci-logs/borrowing-$viewport.log"
          done
      - name: Preserve formatted sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: borrowing-route-evidence
          path: |
            .ci-logs/**
            lib/pages/asset_management_page.dart
            lib/pages/behavior_review_page.dart
            lib/pages/home_page.dart
            lib/services/asset_flow_request.dart
            test/services/asset_flow_request_test.dart
