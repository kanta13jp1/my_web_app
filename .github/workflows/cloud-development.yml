name: Approved Blender Lab Static Release
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact release-branch SHA
        required: true
        type: string
      profile:
        description: workspace reads live only; full publishes the approved lab
        required: true
        default: workspace
        type: choice
        options: [workspace, full]
permissions: {}
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and approved assets
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
          BASE_SOURCE: 326650d0d84ecc53967378a01a269fa69b84f036
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --exit-code "$BASE_SOURCE" -- web/labs/blender-valve
          python3 scripts/blender_release/test_deploy_lab.py
      - name: Require merged source before publishing
        if: inputs.profile == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh pr view 5857 --repo kanta13jp1/my_web_app --json state --jq .state)" = MERGED
      - name: Prepare cloud deployment libraries
        run: |
          python3 -m venv /tmp/blender-release-venv
          /tmp/blender-release-venv/bin/pip install google-auth==2.43.0 requests==2.32.5
      - name: Read live and add only approved static files
        env:
          FIREBASE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$PROFILE" = full ]; then
            /tmp/blender-release-venv/bin/python scripts/blender_release/deploy_lab.py --publish
          else
            /tmp/blender-release-venv/bin/python scripts/blender_release/deploy_lab.py
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: inputs.profile == 'full'
        with:
          node-version: '22'
      - name: Verify public experience on desktop and mobile
        if: inputs.profile == 'full'
        env:
          LAB_BASE_URL: https://my-web-app-b67f4.web.app/labs/blender-valve/index.html
        run: |
          mkdir -p /tmp/blender-public-browser
          cd /tmp/blender-public-browser
          npm init -y
          npm install --save-exact @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/blender-public-browser/node_modules node scripts/blender_lab/browser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: blender-static-release-${{ github.run_id }}
          path: |
            blender-release.json
            blender-browser/
          if-no-files-found: warn
          retention-days: 14
