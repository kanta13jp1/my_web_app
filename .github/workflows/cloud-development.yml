name: Borrowing browser baseline comparison

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        required: true
        type: string

permissions: {}

concurrency:
  group: asset-ai-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.sha == inputs.expected_head_sha
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: baseline
            ref: 1b704dfa950d1bc9d67102f24b45b9cadab65f99
          - label: borrowing
            ref: 11ffdede352fb6ddb68b19852ff9a980d3e17ab4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve test dependencies
        run: flutter pub get
      - name: Run triage withdrawal VM regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          flutter test test/widgets/asset_triage_withdrawal_test.dart --reporter expanded 2>&1 | tee .ci-logs/asset-ai-triage-vm.log
      - name: Verify runner browser tools
        run: |
          google-chrome --version
          chromedriver --version
      - name: Run synthetic page flows in Chrome
        shell: bash
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/asset-ai-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          set -o pipefail
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_management_ai_current_input_test.dart \
            -d web-server --browser-name=chrome --headless \
            2>&1 | tee .ci-logs/asset-ai-browser.log
      - name: Run triage withdrawal flows in Chrome
        shell: bash
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/asset-ai-triage-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          set -o pipefail
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then
              dimensions=393x851@2.75
              mobile=true
            fi
            flutter drive --verbose \
              --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/asset_triage_withdrawal_test.dart \
              --dart-define="TRIAGE_MOBILE=$mobile" \
              --browser-dimension="$dimensions" \
              -d web-server --browser-name=chrome --headless \
              2>&1 | tee ".ci-logs/asset-ai-triage-$viewport-browser.log"
          done
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asset-ai-browser-${{ matrix.label }}-${{ github.run_id }}
          path: |
            .ci-logs/asset-ai-*.log
            .ci-logs/asset-triage-visual/**
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
