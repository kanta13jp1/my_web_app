name: Owner resume decision diagnostic (detached)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify fixed files
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD:lib/services/payment_day_resume_decision_candidate.dart)" = "d5b69635a8932c452f06ffc1e6335a8f538055d9"
          test "$(git rev-parse HEAD:test/services/payment_day_resume_decision_candidate_test.dart)" = "a110bfa626a886aa11a2883e6ce054b070e225f3"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Check formatter
        run: dart format --output=none --set-exit-if-changed lib/services/payment_day_resume_decision_candidate.dart test/services/payment_day_resume_decision_candidate_test.dart
      - name: Analyze detached model and synthetic tests
        run: flutter analyze --no-pub lib/services/payment_day_resume_decision_candidate.dart test/services/payment_day_resume_decision_candidate_test.dart
      - name: Run synthetic tests with loopback only
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env -i PATH="$2" HOME="$3" CI=true \
              flutter test --no-pub test/services/payment_day_resume_decision_candidate_test.dart --reporter expanded
          ' _ "$(id -un)" "$PATH" "$HOME"
