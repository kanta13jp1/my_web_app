name: Forecast repeated selection diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated diagnostic commit
        required: true
        type: string

permissions: {}
concurrency:
  group: forecast-repeat-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check exact diagnostic head and test
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD:integration_test/asset_cashflow_forecast_conditional_test.dart)" = "8480cc4cc974f4343d8fc081ae1dfd0a21d0c0e6"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve synthetic dependencies
        id: prepare
        run: flutter pub get
      - name: Test default viewport
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          chromedriver --port=4444 > /tmp/forecast-phase-default-driver.log 2>&1 &
          driver_pid=$!
          trap 'status=$?; kill "$driver_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -n 20 /tmp/forecast-phase-default-driver.log; fi; exit "$status"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            --dart-define=FORECAST_VIEWPORT=default \
            -d web-server --browser-name=chrome --headless
      - name: Test desktop viewport
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          chromedriver --port=4444 > /tmp/forecast-phase-desktop-driver.log 2>&1 &
          driver_pid=$!
          trap 'status=$?; kill "$driver_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -n 20 /tmp/forecast-phase-desktop-driver.log; fi; exit "$status"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            --dart-define=FORECAST_VIEWPORT=desktop \
            --browser-dimension=1440x1000@1 \
            -d web-server --browser-name=chrome --headless
      - name: Test mobile viewport
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          chromedriver --port=4444 > /tmp/forecast-phase-mobile-driver.log 2>&1 &
          driver_pid=$!
          trap 'status=$?; kill "$driver_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -n 20 /tmp/forecast-phase-mobile-driver.log; fi; exit "$status"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            --dart-define=FORECAST_VIEWPORT=mobile \
            --browser-dimension=390x851@2.75 \
            -d web-server --browser-name=chrome --headless
