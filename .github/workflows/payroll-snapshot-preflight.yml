name: Forecast keyed label diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated diagnostic commit
        required: true
        type: string

permissions: {}
concurrency:
  group: forecast-label-key-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact diagnostic head and inputs
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD:integration_test/asset_cashflow_forecast_conditional_test.dart)" = "a42f70b17cffbf4a77679d3d737068e258aff2ad"
          test "$(git rev-parse HEAD:web/index.html)" = "adf13dcb0249651e376959c2b9da951d3c8985db"
          test "$(git rev-parse HEAD:lib/widgets/asset_cashflow_forecast_card.dart)" = "c09b32ded48f22c59f13e4e9c0a4ec629f1369d7"
          test "$(git rev-parse HEAD:.codex-diagnostic/forecast-card-baseline.dart)" = "58667c02e75a3a37fd1d9e7fc08c549bf2fdbe91"
          test "$(git rev-parse HEAD:.codex-diagnostic/forecast-card-fixed.dart)" = "c09b32ded48f22c59f13e4e9c0a4ec629f1369d7"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve synthetic dependencies
        id: prepare
        run: flutter pub get
      - name: Comparison default-control-1
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          cp .codex-diagnostic/forecast-card-baseline.dart lib/widgets/asset_cashflow_forecast_card.dart
          test "$(git hash-object lib/widgets/asset_cashflow_forecast_card.dart)" = "58667c02e75a3a37fd1d9e7fc08c549bf2fdbe91"
          chromedriver --port=4444 > /tmp/forecast-comparison-default-control-1.log 2>&1 &
          driver_pid=$!
          trap 'status=$?; kill "$driver_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -n 20 /tmp/forecast-comparison-default-control-1.log; fi; exit "$status"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            --dart-define=FORECAST_VIEWPORT=default \
            --dart-define=FORECAST_LAUNCH=default-control-1 \
            -d web-server --browser-name=chrome --headless
      - name: Comparison default-fixed-1
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          cp .codex-diagnostic/forecast-card-fixed.dart lib/widgets/asset_cashflow_forecast_card.dart
          test "$(git hash-object lib/widgets/asset_cashflow_forecast_card.dart)" = "c09b32ded48f22c59f13e4e9c0a4ec629f1369d7"
          chromedriver --port=4444 > /tmp/forecast-comparison-default-fixed-1.log 2>&1 &
          driver_pid=$!
          trap 'status=$?; kill "$driver_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -n 20 /tmp/forecast-comparison-default-fixed-1.log; fi; exit "$status"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            --dart-define=FORECAST_VIEWPORT=default \
