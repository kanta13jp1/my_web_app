name: Borrowing history fixture diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated diagnostic commit
        required: true
        type: string

permissions: {}

concurrency:
  group: forecast-fixture-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check exact diagnostic head
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD:integration_test/asset_borrowing_unsaved_test.dart)" = "6ca188eb3e5980a2df36f1be4b92f4eec7b488cc"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run only synthetic borrowing history browser test
        shell: bash
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/forecast-diagnostic-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          set -o pipefail
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then
              dimensions=390x851@2.75
              mobile=true
            fi
            flutter drive \
              --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/asset_borrowing_unsaved_test.dart \
              --dart-define="TRIAGE_MOBILE=$mobile" \
              --browser-dimension="$dimensions" \
              -d web-server --browser-name=chrome --headless \
              2>&1 | tee ".ci-logs/forecast-diagnostic-$viewport.log"
          done
