name: Forecast startup font diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated diagnostic commit
        required: true
        type: string

permissions: {}
concurrency:
  group: forecast-font-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact diagnostic head and inputs
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD:integration_test/asset_cashflow_forecast_conditional_test.dart)" = "8d8b446fcf2cc036d56ff2f0b10f25349ac32671"
          test "$(git rev-parse HEAD:web/index.html)" = "adf13dcb0249651e376959c2b9da951d3c8985db"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve synthetic dependencies
        id: prepare
        run: flutter pub get
      - name: Independent browser default-1
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          chromedriver --port=4444 > /tmp/forecast-font-default-1.log 2>&1 &
          driver_pid=$!
          trap 'status=$?; kill "$driver_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -n 20 /tmp/forecast-font-default-1.log; fi; exit "$status"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            --dart-define=FORECAST_VIEWPORT=default \
            --dart-define=FORECAST_LAUNCH=default-1 \
            -d web-server --browser-name=chrome --headless
      - name: Independent browser default-2
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          chromedriver --port=4444 > /tmp/forecast-font-default-2.log 2>&1 &
          driver_pid=$!
          trap 'status=$?; kill "$driver_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then tail -n 20 /tmp/forecast-font-default-2.log; fi; exit "$status"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            --dart-define=FORECAST_VIEWPORT=default \
            --dart-define=FORECAST_LAUNCH=default-2 \
            -d web-server --browser-name=chrome --headless
      - name: Independent browser default-3
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          chromedriver --port=4444 > /tmp/forecast-font-default-3.log 2>&1 &
