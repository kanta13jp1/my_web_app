name: Forecast synthetic exception diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated diagnostic commit
        required: true
        type: string

permissions: {}
concurrency:
  group: forecast-exception-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check exact diagnostic head and test
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD:integration_test/asset_cashflow_forecast_conditional_test.dart)" = "0fe8a49f8d32d1d8d0be5d533747dd966de45c64"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Capture synthetic conditional test exceptions in Chrome
        shell: bash
        run: |
          chromedriver --port=4444 > /tmp/forecast-exception-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status > /dev/null
          flutter drive --verbose \
            --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/asset_cashflow_forecast_conditional_test.dart \
            -d web-server --browser-name=chrome --headless
