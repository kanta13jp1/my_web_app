name: Forecast keyed label formatting diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact isolated diagnostic commit
        required: true
        type: string

permissions: {}
concurrency:
  group: forecast-key-format-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check exact diagnostic head and test
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD:integration_test/asset_cashflow_forecast_conditional_test.dart)" = "d2de915c552d218b655d20162b299f16c1351c0c"
          test "$(git rev-parse HEAD:lib/widgets/asset_cashflow_forecast_card.dart)" = "c09b32ded48f22c59f13e4e9c0a4ec629f1369d7"
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve synthetic dependencies
        id: prepare
        run: flutter pub get
      - name: Check Flutter 3.38 formatting
        id: format
        run: dart format --output=none --set-exit-if-changed lib/widgets/asset_cashflow_forecast_card.dart integration_test/asset_cashflow_forecast_conditional_test.dart
      - name: Show diagnostic formatting diff
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          dart format lib/widgets/asset_cashflow_forecast_card.dart integration_test/asset_cashflow_forecast_conditional_test.dart
          git diff -- lib/widgets/asset_cashflow_forecast_card.dart integration_test/asset_cashflow_forecast_conditional_test.dart
      - name: Targeted Flutter analyzer
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: flutter analyze lib/widgets/asset_cashflow_forecast_card.dart integration_test/asset_cashflow_forecast_conditional_test.dart
