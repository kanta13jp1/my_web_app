name: Tiger Status Publish

on:
  push:
    branches:
      - main
    paths:
      - 'assets/data/tiger_*'
  workflow_dispatch:

concurrency:
  group: tiger-status-publish
  cancel-in-progress: false

permissions: {}

jobs:
  validate-and-verify:
    name: Validate and Verify Tiger Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate JSON syntax and structure
        shell: bash
        run: |
          python3 <<'PY'
          import json, glob, sys
          files = glob.glob('assets/data/tiger_*.json')
          if not files:
              print('No tiger status files found', file=sys.stderr)
              sys.exit(1)
          for f in files:
              with open(f, 'r', encoding='utf-8') as fp:
                  data = json.load(fp)
                  print(f'Validated {f}: {len(data) if isinstance(data, (list, dict)) else 1} entries')
          print('All Tiger status JSON files are valid; artifact packaging follows (no site deployment).')
          PY

      - name: Package immutable status artifact
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, shutil
          from datetime import datetime, timezone
          output = pathlib.Path('tiger-status-artifact')
          output.mkdir()
          entries = []
          for source in sorted(pathlib.Path('assets/data').glob('tiger_*.json')):
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f'Unexpected status path: {source}')
              raw = source.read_bytes()
              json.loads(raw)
              shutil.copyfile(source, output / source.name)
              entries.append({'path': str(source), 'size': len(raw),
                              'sha256': hashlib.sha256(raw).hexdigest()})
          if not entries:
              raise SystemExit('No status files to publish')
          manifest = {'schemaVersion': 1, 'commit': os.environ['GITHUB_SHA'],
                      'runId': os.environ['GITHUB_RUN_ID'],
                      'packagedAt': datetime.now(timezone.utc).isoformat(),
                      'publication': 'github_actions_artifact',
                      'productionDeploymentVerified': False, 'files': entries}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Publish status artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tiger-status-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tiger-status-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Describe publication boundary
        shell: bash
        run: |
          echo '## Tiger status artifact' >> "$GITHUB_STEP_SUMMARY"
          echo 'JSON and a per-file SHA256 manifest were published as a run artifact. No Flutter build, Firebase deployment, release tag or production notification was performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact timestamp is packaging time, not source-data freshness or proof of live site delivery. Keep the previous successful artifact for recovery; this workflow does not modify the live site.' >> "$GITHUB_STEP_SUMMARY"
