name: Secret Auto Rotation

on:
  pull_request:
    paths:
      - '.github/workflows/secret-auto-rotation.yml'
      - 'config/secret_rotation_policy.json'
      - 'scripts/secret_auto_rotation.py'
      - 'test/scripts/test_secret_auto_rotation.py'
      - 'supabase/required_secrets.json'
  schedule:
    # Weekly Sunday 14:17 JST (05:17 UTC) secret rotation SLA & grace-window audit
    - cron: '17 5 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run rotation audit in dry-run mode without mutating credentials'
        required: true
        type: boolean
        default: true
      confirm_rotate:
        description: 'Explicit second confirmation required for non-dry-run rotation'
        required: true
        type: boolean
        default: false
      target_entries:
        description: 'Optional comma-separated credential names to restrict scope'
        required: false
        type: string
        default: ''
      require_oidc:
        description: 'Fail closed if GitHub Actions OIDC runtime or exchange fails'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: secret-auto-rotation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-rotation-policy:
    name: Verify Secret Rotation Policy and Offline Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run secret rotation unit tests
        run: python3 -B test/scripts/test_secret_auto_rotation.py -v

      - name: Run secret rotation self-test
        run: python3 -B scripts/secret_auto_rotation.py --self-test

      - name: Run dry-run rotation SLA audit
        run: |
          mkdir -p tmp/secret-rotation
          python3 -B scripts/secret_auto_rotation.py \
            --dry-run \
            --json-out tmp/secret-rotation/policy_audit.json \
            --audit-log-out tmp/secret-rotation/policy_audit_log.json \
            --markdown-out tmp/secret-rotation/policy_audit.md

  rotation-orchestrator:
    name: Scheduled and Dispatch Secret Rotation Orchestrator
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Collect secret rotation metadata timestamps
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p tmp/secret-rotation
          if gh api "repos/${REPO_SLUG}/actions/secrets?per_page=100" --jq '[.secrets[] | {name: .name, updated_at: .updated_at, store: "github_actions_secret"}]' > tmp/secret-rotation/metadata.json; then
            echo "Collected GitHub Actions secret metadata timestamps."
          else
            echo '[]' > tmp/secret-rotation/metadata.json
            echo "::warning::Could not read Actions secret metadata timestamps; continuing with empty metadata snapshot."
          fi

      - name: Execute secret auto-rotation cycle
        id: rotate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          INPUT_CONFIRM_ROTATE: ${{ github.event.inputs.confirm_rotate || 'false' }}
          INPUT_TARGET_CREDENTIAL: ${{ github.event.inputs.target_entries || '' }}
          INPUT_REQUIRE_OIDC: ${{ github.event.inputs.require_oidc || 'false' }}
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
          GH_SECRETS_ADMIN_CREDENTIAL: ${{ secrets.GH_SECRETS_ADMIN_TOKEN || '' }}
          SUPABASE_MANAGEMENT_CREDENTIAL: ${{ secrets.SUPABASE_ACCESS_TOKEN || '' }}
          SUPABASE_PROJECT_REF_ID: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || '' }}
          OIDC_EXCHANGE_ENDPOINT: ${{ vars.ROTATION_OIDC_EXCHANGE_URL || secrets.ROTATION_OIDC_EXCHANGE_URL || '' }}
          ROTATION_ALERT_WEBHOOK: ${{ secrets.ROTATION_ALERT_WEBHOOK_URL || vars.ROTATION_ALERT_WEBHOOK_URL || '' }}
        run: |
          set -euo pipefail
          args=(
            --metadata-file tmp/secret-rotation/metadata.json
            --json-out tmp/secret-rotation/report.json
            --audit-log-out tmp/secret-rotation/audit_log.json
            --markdown-out tmp/secret-rotation/summary.md
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ -n "${INPUT_TARGET_CREDENTIAL}" ]; then
            IFS=',' read -ra targets <<< "${INPUT_TARGET_CREDENTIAL}"
            for item in "${targets[@]}"; do
              trimmed="$(printf '%s' "$item" | xargs)"
              if [ -n "${trimmed}" ]; then
                args+=(--target "${trimmed}")
              fi
            done
          fi
          if [ "${INPUT_REQUIRE_OIDC}" = "true" ]; then
            args+=(--require-oidc)
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN}" = "false" ] && [ "${INPUT_CONFIRM_ROTATE}" = "true" ]; then
            args+=(--live --confirm-rotate)
          else
            args+=(--dry-run)
          fi
          python3 -B scripts/secret_auto_rotation.py "${args[@]}"

      - name: Upload rotation audit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: secret-auto-rotation-audit
          path: |
            tmp/secret-rotation/report.json
            tmp/secret-rotation/audit_log.json
            tmp/secret-rotation/summary.md
          retention-days: 30
          if-no-files-found: warn

      - name: Publish workflow step summary
        if: always()
        run: |
          if [ -f tmp/secret-rotation/summary.md ]; then
            cat tmp/secret-rotation/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
