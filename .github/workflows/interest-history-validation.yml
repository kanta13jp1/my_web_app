name: Interest History Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/interest-history-validation.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Format feature source
        run: |
          dart format lib/models/asset_interest_history.dart lib/services/asset_interest_repository.dart lib/widgets/asset_interest_history_card.dart test/services/asset_interest_history_test.dart test/services/asset_interest_repository_test.dart test/widgets/asset_interest_history_card_test.dart
          dart fix --apply --code=require_trailing_commas,curly_braces_in_flow_control_structures,unnecessary_non_null_assertion,prefer_const_constructors
          dart format lib/models/asset_interest_history.dart lib/services/asset_interest_repository.dart lib/widgets/asset_interest_history_card.dart test/services/asset_interest_history_test.dart test/services/asset_interest_repository_test.dart test/widgets/asset_interest_history_card_test.dart
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/models/asset_interest_history.dart lib/services/asset_interest_repository.dart lib/widgets/asset_interest_history_card.dart test/services/asset_interest_history_test.dart test/services/asset_interest_repository_test.dart test/widgets/asset_interest_history_card_test.dart lib/pages/asset_management_page.dart
            git commit -m 'style: format monthly interest feature'
            git push origin HEAD
          fi
      - run: flutter analyze lib/models/asset_interest_history.dart lib/services/asset_interest_repository.dart lib/widgets/asset_interest_history_card.dart test/services/asset_interest_history_test.dart test/services/asset_interest_repository_test.dart test/widgets/asset_interest_history_card_test.dart
      - run: flutter test --concurrency=2 test/services/asset_interest_history_test.dart test/services/asset_interest_repository_test.dart test/widgets/asset_interest_history_card_test.dart
