name: Post X with OGP Image

on:
  schedule:
    # Every Monday 09:00 UTC (= 18:00 JST)
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual post)"
        type: boolean
        default: true
      text:
        description: "Tweet text (leave empty for auto-generated)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: post-x-with-media
  cancel-in-progress: false

jobs:
  post:
    environment:
      name: content-automation-production
      deployment: false
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build tweet text
        id: tweet
        env:
          CUSTOM_TEXT_INPUT: ${{ github.event.inputs.text || '' }}
        run: |
          CUSTOM_TEXT="$CUSTOM_TEXT_INPUT"
          if [ -n "$CUSTOM_TEXT" ]; then
            TEXT="$CUSTOM_TEXT"
          else
            WEEK=$(date +"%Y年%-m月%-d日週")
            # printf '%b' converts \n to actual LF
            TEXT=$(printf '🤖 自分株式会社 週次アップデート (%s)\n\nAI統合ライフマネジメントアプリ — Notion/MoneyForward/Slack など21競合の機能を1つに。\n\nhttps://my-web-app-b67f4.web.app/ #AI #Flutter #個人開発' "$WEEK")
          fi
          # Truncate to 280 chars if needed
          TEXT="${TEXT:0:280}"
          # GitHub Actions multi-line output requires heredoc
          {
            echo "text<<__EOT__"
            echo "$TEXT"
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"

      - name: Post to X with OGP image
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          DRY_RUN="$DRY_RUN_INPUT"
          # Default to false for scheduled runs
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="false"
          fi

          PAYLOAD=$(jq -n \
            --arg action "x.post_with_media" \
            --arg text "${{ steps.tweet.outputs.text }}" \
            --arg mediaUrl "https://my-web-app-b67f4.web.app/ogp-image-gen2-20260428.png" \
            --arg mediaType "image/png" \
            --arg mediaCategory "tweet_image" \
            --arg source "post-x-with-media.yml" \
            --argjson dryRun "$DRY_RUN" \
            '{action: $action, text: $text, mediaUrl: $mediaUrl, mediaType: $mediaType, mediaCategory: $mediaCategory, source: $source, dryRun: $dryRun}')

          HTTP_CODE=$(curl -s -o /tmp/xpost_resp.json -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL_PROD }}/functions/v1/schedule-hub" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -d "$PAYLOAD")
          RESPONSE=$(cat /tmp/xpost_resp.json)
          echo "HTTP $HTTP_CODE — $RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::schedule-hub returned HTTP $HTTP_CODE — skipping"
          else
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
            if [ "$SUCCESS" != "true" ]; then
              echo "::warning::X post failed: $RESPONSE"
            else
              POSTED=$(echo "$RESPONSE" | jq -r '.posted')
              TWEET_ID=$(echo "$RESPONSE" | jq -r '.tweetId // "N/A"')
              echo "Posted: $POSTED | Tweet ID: $TWEET_ID"
            fi
          fi
