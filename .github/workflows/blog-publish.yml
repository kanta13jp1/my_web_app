name: Blog Publish (技術記事投稿)

# 手動 or 自動スケジュール で docs/blog-drafts/ の記事を Qiita / dev.to に投稿する
# 必要な Supabase シークレット: QIITA_ACCESS_TOKEN, DEVTO_API_KEY (Supabase側に設定)
on:
  workflow_dispatch:
    inputs:
      draft_path:
        description: '日本語ドラフトのパス → Qiita に投稿'
        required: false
        default: ''
      draft_path_en:
        description: '英語ドラフトのパス → dev.to に投稿 (省略時は dev.to をスキップ)'
        required: false
        default: ''
      platforms:
        # ⚠️ 2026-07-12: Qiita アカウント利用停止につき既定から qiita を除外。
        # 停止解除まで qiita を指定しないこと。
        description: '投稿先プラットフォーム (通常は devto のみ / qiita は停止中)'
        required: false
        default: 'devto'
      dry_run:
        description: 'ドライラン (true=投稿しない, false=実投稿)'
        required: false
        default: 'false'
  schedule:
    # UTC 時刻。JST = UTC+9 なので、12:00 UTC = 21:00 JST (毎日夜9時)
    - cron: '0 12 * * *'  # 毎日 12:00 UTC = 21:00 JST

concurrency:
  group: blog-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      contents: write
      pull-requests: write
    name: Publish Blog Draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # AI_DEV Principle 3 (Observability): trace_id for all steps
      TRACE_ID: blog-publish-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # ── Step 1: コード取得 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── Step 1.5: 自動スケジュール実行時 — 未投稿ドラフト自動選択 ──────
      - name: Resolve publish draft
        id: auto_select
        env:
          DRAFT_PATH_INPUT: ${{ github.event.inputs.draft_path }}
        run: |
          # docs/blog-drafts/ から未投稿ドラフトを日付順(古い順)で探す
          # YYYY-MM-DD.md 形式の日次自動レポートはスキップ
          # frontmatter なし (# 見出しのみ) のファイルも対象
          REQUESTED_DRAFT=""
          if [ "${{ github.event_name }}" != "schedule" ]; then
            REQUESTED_DRAFT="$DRAFT_PATH_INPUT"
          fi

          if [ -n "$REQUESTED_DRAFT" ] && [ -f "$REQUESTED_DRAFT" ]; then
            echo "has_draft=true" >> $GITHUB_OUTPUT
            echo "draft_path=$REQUESTED_DRAFT" >> $GITHUB_OUTPUT
            echo "Using requested draft: $REQUESTED_DRAFT"
            exit 0
          fi

          if [ -n "$REQUESTED_DRAFT" ]; then
            echo "::warning::Requested draft not found: $REQUESTED_DRAFT; falling back to the next unpublished draft."
          fi

          DRAFT=$(find docs/blog-drafts/ -name "*.md" -type f | sort | while read f; do
            # YYYY-MM-DD.md 形式の日次レポートはスキップ
            if echo "$f" | grep -qE '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$'; then
              continue
            fi
            # published: true はスキップ
            if grep -q "^published: true" "$f" 2>/dev/null; then
              continue
            fi
            # スラグ日付が翌日より未来ならスキップ (T-1 date-gate: 時間固定記事の早期投稿防止)
            SLUG_DATE=$(echo "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            if [ -n "$SLUG_DATE" ]; then
              TOMORROW=$(date -u -d '+1 day' +%Y-%m-%d 2>/dev/null || date -u -v+1d +%Y-%m-%d)
              if [[ "$SLUG_DATE" > "$TOMORROW" ]]; then
                continue
              fi
            fi
            # title: または # 見出しがあれば投稿可能
            if grep -q "^title:" "$f" 2>/dev/null || grep -q "^# " "$f" 2>/dev/null; then
              echo "$f"
              break
            fi
          done)

          if [ -z "$DRAFT" ]; then
            echo "ℹ️ No unpublished drafts found — skipping blog publish"
            echo "has_draft=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_draft=true" >> $GITHUB_OUTPUT
          echo "draft_path=$DRAFT" >> $GITHUB_OUTPUT
          echo "✅ Auto-selected: $DRAFT"

      # ── Step 1.7: DB status='ready' 記事の自動公開 ───────────────────────
      # admin UI で「公開準備完了」に設定した記事を blog.publish_post EF で自動公開する
      - name: Step 1.7 - Auto-publish DB ready posts
        if: github.event_name == 'schedule' || github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "[trace=$TRACE_ID] Step 1.7: querying blog_posts WHERE status='ready'"
          RESP=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/blog_posts?select=id,title&status=eq.ready&order=created_at.asc&limit=5" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null || echo "[]")
          COUNT=$(echo "$RESP" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          echo "[trace=$TRACE_ID] Ready posts found: $COUNT"
          if [ "$COUNT" -eq "0" ]; then
            echo "ℹ️ No ready posts — skipping DB auto-publish"
            exit 0
          fi
          RESP_JSON="$RESP" python3 - <<'PY'
          import json
          import os

          posts = json.loads(os.environ["RESP_JSON"])
          for p in posts:
              print(f"  - [{p['id']}] {p['title']}")
          PY
          RESP_JSON="$RESP" python3 - <<'PY' 2>&1 || echo "[trace=$TRACE_ID] DB auto-publish step completed (errors above are non-blocking)"
          import json
          import os
          import urllib.request

          posts = json.loads(os.environ["RESP_JSON"])
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_KEY"]
          trace = os.environ.get("TRACE_ID", "")

          for p in posts:
              pid = p["id"]
              title = p["title"]
              print(f"[trace={trace}] Publishing DB post: {pid} — {title}")
              # Scheduled ready-post publishing is dev.to-only while Qiita is suspended.
              # schedule-hub intersects this allowlist with the stored targets.
              payload = json.dumps({
                  "action": "blog.publish_post",
                  "id": pid,
                  "platforms": ["devto"],
              }).encode()
              req = urllib.request.Request(
                  f"{url}/functions/v1/schedule-hub",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode()
                      print(f"  ✅ HTTP {r.status}: {body[:200]}")
              except Exception as e:
                  print(f"  ⚠️ Failed: {e}")
          PY

      # ── Step 2: ドラフトを読み込んでメタデータ抽出 ──────────────────────
      - name: Step 2 - Extract metadata from draft
        if: steps.auto_select.outputs.has_draft == 'true'
        id: meta
        run: |
          # Scheduled実行の場合は自動選択ドラフトを使用、手動実行の場合は入力値を使用
          DRAFT_PATH="${{ steps.auto_select.outputs.draft_path }}"
          
          if [ ! -f "$DRAFT_PATH" ]; then
            echo "Error: $DRAFT_PATH not found"
            exit 1
          fi

          # frontmatter から title と tags を抽出
          # tr -d '\r' で CRLF 対応, ['\"] で引用符なし・シングル・ダブル全対応
          # tags: (Qiita形式) と topics: (Zenn形式) 両方に対応
          TITLE=$(grep '^title:' "$DRAFT_PATH" | head -1 | tr -d '\r' | sed "s/^title: *//;s/^['\"]//;s/['\"]$//")
          # frontmatter に title がない場合は最初の # 見出しから抽出
          if [ -z "$TITLE" ]; then
            TITLE=$(grep '^# ' "$DRAFT_PATH" | head -1 | tr -d '\r' | sed 's/^# //')
          fi
          TAGS=$(grep -E '^(tags|topics):' "$DRAFT_PATH" | head -1 | tr -d '\r' | \
            sed 's/^tags: *//;s/^topics: *//' | \
            tr -d '[]"'"'" | tr ',' '\n' | \
            sed 's/^ *//;s/ *$//' | grep -v '^$' | \
            tr '\n' ',' | sed 's/,$//')
          # タグが空の場合はデフォルト値を設定 (Qiita は空タグを 403 で拒否するため)
          [ -z "$TAGS" ] && TAGS="Flutter,Supabase,buildinpublic"
          PUBLISHED=$(grep '^published:' "$DRAFT_PATH" | head -1 | awk '{print $2}')

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "already_published=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "draft_path=$DRAFT_PATH" >> $GITHUB_OUTPUT
          echo "📄 タイトル: $TITLE"
          echo "🏷️ タグ: $TAGS"
          echo "✅ 既投稿: $PUBLISHED"

      - name: Check already published (Zenn status)
        if: steps.meta.outputs.already_published == 'true'
        run: |
          echo "ℹ️ このドラフトは Zenn で published: true です。"
          echo "Zenn はすでに公開済みですが、Qiita / dev.to への投稿は続行します。"

      # ── Step 2.5: Circuit Breaker — Qiita 日次 4本上限 (AI_DEV Principle 4) ─
      - name: Circuit breaker — daily post limit
        if: steps.auto_select.outputs.has_draft == 'true' && github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "[trace=$TRACE_ID] Circuit breaker: checking daily Qiita post count for $TODAY"
          RESP=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/blog_posts?select=id,platform&status=eq.posted&created_at=gte.${TODAY}T00:00:00Z" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null || echo "[]")
          COUNT=$(echo "$RESP" | python3 -c "import sys,json; data=json.load(sys.stdin); print(sum(1 for p in data if 'qiita' in (p.get('platform') or '').lower()))" 2>/dev/null || echo "0")
          echo "[trace=$TRACE_ID] Today's Qiita post count: $COUNT"
          if [ "$COUNT" -ge "4" ]; then
            echo "::error::[trace=$TRACE_ID] Circuit breaker triggered: $COUNT Qiita posts already today (daily limit=4)"
            exit 1
          fi
          echo "[trace=$TRACE_ID] ✅ Circuit breaker passed ($COUNT/4)"

      # ── Step 2.6: Quality Gate — Sentinel + Warden (AI_DEV Principle 7) ──
      - name: Quality gate — Sentinel + Warden
        if: steps.auto_select.outputs.has_draft == 'true'
        env:
          DRAFT_PATH_VAR: ${{ steps.meta.outputs.draft_path }}
          DRAFT_PATH_EN: ${{ github.event.inputs.draft_path_en }}
        run: |
          mkdir -p tmp/blog-quality
          echo "[trace=$TRACE_ID] Quality gate: $DRAFT_PATH_VAR"
          python3 scripts/validate_blog_draft.py \
            --draft "$DRAFT_PATH_VAR" \
            --language ja \
            --min-chars 800 \
            --min-headings 2 \
            --required-heading "##" \
            --trace-id "$TRACE_ID" \
            --source-ref "$GITHUB_SHA" \
            --report "tmp/blog-quality/${TRACE_ID}-ja.json"

          if [ -n "$DRAFT_PATH_EN" ] && [ -f "$DRAFT_PATH_EN" ]; then
            echo "[trace=$TRACE_ID] Quality gate: $DRAFT_PATH_EN"
            python3 scripts/validate_blog_draft.py \
              --draft "$DRAFT_PATH_EN" \
              --language en \
              --min-chars 1200 \
              --min-headings 2 \
              --required-heading "##" \
              --trace-id "$TRACE_ID" \
              --source-ref "$GITHUB_SHA" \
              --report "tmp/blog-quality/${TRACE_ID}-en.json"
          fi

      # ── Step 3: メタデータ記録 (schedule-hub blog.create) ────────────────
      - name: Step 3 - Register in blog_posts table
        if: steps.auto_select.outputs.has_draft == 'true'
        id: register
        env:
          ARTICLE_TITLE: ${{ steps.meta.outputs.title }}
          DRAFT_PATH_VAR: ${{ steps.meta.outputs.draft_path }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          PLATFORMS_INPUT: ${{ github.event.inputs.platforms }}
        run: |
          DRAFT_PATH="$DRAFT_PATH_VAR"
          TITLE="$ARTICLE_TITLE"
          # Scheduled実行の場合は自動投稿 (dry_run=false), 手動実行の場合は入力値を使用
          # 2026-07-12: Qiita アカウント利用停止につき schedule は devto のみ
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN="false"
            PLATFORMS="devto"
          else
            DRY_RUN="$DRY_RUN_INPUT"
            PLATFORMS="$PLATFORMS_INPUT"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 [DRY RUN] 登録をスキップ"
            echo "post_id=dry-run-id" >> $GITHUB_OUTPUT
            exit 0
          fi

          # schedule-hub blog.create でメタデータを記録
          PAYLOAD=$(jq -n \
            --arg action "blog.create" \
            --arg title "$TITLE" \
            --arg platform "$PLATFORMS" \
            '{action: $action, title: $title, platform: $platform}')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub" \
            --max-time 15)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP: $HTTP_CODE"
          echo "$BODY" | jq . || echo "$BODY"

          POST_ID=$(echo "$BODY" | jq -r '.item.id // ""')
          echo "post_id=$POST_ID" >> $GITHUB_OUTPUT
          echo "✅ blog record ID: $POST_ID"

      # ── Step 4: schedule-hub blog.auto_publish で実投稿 ─────────────────
      # Qiita: 日本語ドラフト (draft_path) を投稿
      # dev.to: 英語ドラフト (draft_path_en) を投稿 — 省略時はスキップ
      - name: Step 4 - Publish to platforms
        if: steps.auto_select.outputs.has_draft == 'true'
        id: publish
        env:
          ARTICLE_TITLE: ${{ steps.meta.outputs.title }}
          DRAFT_PATH_VAR: ${{ steps.meta.outputs.draft_path }}
          TAGS_VAR: ${{ steps.meta.outputs.tags }}
          DRAFT_PATH_EN: ${{ github.event.inputs.draft_path_en }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          PLATFORMS_INPUT: ${{ github.event.inputs.platforms }}
        run: |
          DRAFT_PATH="$DRAFT_PATH_VAR"
          TITLE="$ARTICLE_TITLE"
          TAGS="$TAGS_VAR"
          
          # 2026-07-12: Qiita アカウント利用停止につき schedule は devto のみ
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN="false"
            PLATFORMS="devto"
          else
            DRY_RUN="$DRY_RUN_INPUT"
            PLATFORMS="$PLATFORMS_INPUT"
          fi
          
          CONTENT_JP=$(cat "$DRAFT_PATH")
          TAGS_JSON=$(echo "$TAGS" | tr ',' '\n' | jq -R . | jq -s .)

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 [DRY RUN] 投稿をスキップ"
            echo "results={}" >> $GITHUB_OUTPUT
            exit 0
          fi

          QIITA_URL=""
          DEVTO_URL=""
          PUBLISH_ATTEMPTED="false"

          # Qiita: 日本語コンテンツ
          if echo "$PLATFORMS" | grep -q "qiita"; then
            PUBLISH_ATTEMPTED="true"
            echo "📤 Qiita に日本語記事を投稿..."
            POST_ID="${{ steps.register.outputs.post_id }}"
            PAYLOAD=$(jq -n \
              --arg action "blog.auto_publish" \
              --arg title "$TITLE" \
              --arg content "$CONTENT_JP" \
              --arg platforms "qiita" \
              --arg id "$POST_ID" \
              --argjson tags "$TAGS_JSON" \
              '{action: $action, title: $title, content: $content, platforms: $platforms, tags: $tags, id: $id}')
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub" \
              --max-time 30)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "Qiita HTTP: $HTTP_CODE"
            echo "$BODY" | jq . || echo "$BODY"
            QIITA_URL=$(echo "$BODY" | jq -r '.results.qiita.url // ""')
          fi

          # dev.to: 英語コンテンツ (draft_path_en が指定されている場合のみ)
          if echo "$PLATFORMS" | grep -q "devto"; then
            if [ -n "$DRAFT_PATH_EN" ] && [ -f "$DRAFT_PATH_EN" ]; then
              PUBLISH_ATTEMPTED="true"
              echo "📤 dev.to に英語記事を投稿..."
              CONTENT_EN=$(cat "$DRAFT_PATH_EN")
              # 英語ドラフトのタイトルを抽出
              TITLE_EN=$(grep '^title:' "$DRAFT_PATH_EN" | head -1 | tr -d '\r' | sed "s/^title: *//;s/^['\"]//;s/['\"]$//")
              [ -z "$TITLE_EN" ] && TITLE_EN="$TITLE"
              # 英語タグを抽出 (tags: 形式)
              TAGS_EN=$(grep -E '^(tags|topics):' "$DRAFT_PATH_EN" | head -1 | tr -d '\r' | \
                sed 's/^tags: *//;s/^topics: *//' | \
                tr -d '[]' | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | \
                tr '\n' ',' | sed 's/,$//')
              [ -z "$TAGS_EN" ] && TAGS_EN="$TAGS"
              TAGS_EN_JSON=$(echo "$TAGS_EN" | tr ',' '\n' | jq -R . | jq -s .)
              POST_ID="${{ steps.register.outputs.post_id }}"
              PAYLOAD_EN=$(jq -n \
                --arg action "blog.auto_publish" \
                --arg title "$TITLE_EN" \
                --arg content "$CONTENT_EN" \
                --arg platforms "devto" \
                --arg id "$POST_ID" \
                --argjson tags "$TAGS_EN_JSON" \
                '{action: $action, title: $title, content: $content, platforms: $platforms, tags: $tags, id: $id}')
              RESPONSE_EN=$(curl -s -w "\n%{http_code}" -X POST \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD_EN" \
                "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/schedule-hub" \
                --max-time 30)
              HTTP_EN=$(echo "$RESPONSE_EN" | tail -1)
              BODY_EN=$(echo "$RESPONSE_EN" | head -n -1)
              echo "dev.to HTTP: $HTTP_EN"
              echo "$BODY_EN" | jq . || echo "$BODY_EN"
              DEVTO_URL=$(echo "$BODY_EN" | jq -r '.results.devto.url // ""')
            else
              echo "ℹ️ draft_path_en が未指定 — dev.to への投稿をスキップ"
            fi
          fi

          echo "qiita_url=$QIITA_URL" >> $GITHUB_OUTPUT
          echo "devto_url=$DEVTO_URL" >> $GITHUB_OUTPUT

          # Fail closed: only when a publish was actually attempted (not skipped)
          # and no platform URL was produced. Skipping (e.g. no English draft for
          # scheduled devto-only runs) exits 0 to avoid spurious workflow-failure issues.
          if [ "$PUBLISH_ATTEMPTED" = "true" ] && [ -z "$QIITA_URL" ] && [ -z "$DEVTO_URL" ]; then
            echo "::error::No platform publish succeeded; leaving the draft unpublished"
            exit 1
          fi

      # ── Step 4.5: blog_posts.status を 'posted' に更新 (UI反映) ────────
      - name: Step 4.5 - Update blog_posts status
        if: >-
          steps.auto_select.outputs.has_draft == 'true' &&
          github.event.inputs.dry_run != 'true' &&
          (steps.publish.outputs.qiita_url != '' || steps.publish.outputs.devto_url != '')
        continue-on-error: true
        env:
          SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRAFT_PATH_VAR: ${{ steps.meta.outputs.draft_path }}
          QIITA_URL: ${{ steps.publish.outputs.qiita_url }}
          DEVTO_URL: ${{ steps.publish.outputs.devto_url }}
        run: |
          DRAFT_PATH="$DRAFT_PATH_VAR"
          URL="${QIITA_URL:-$DEVTO_URL}"
          PATCH=$(python3 -c "from datetime import datetime; import json, os; print(json.dumps({'status': 'posted', 'posted_at': datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'), 'url': os.environ.get('URL', '') or None}))")
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/blog_posts?draft_path=eq.${DRAFT_PATH}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PATCH" \
            --max-time 10 || echo "000")
          echo "[trace=$TRACE_ID] blog_posts status update: HTTP $HTTP"

      # ── Step 5: frontmatter を published: true に更新 ───────────────────
      # Branch-protection safe: always push a status branch, then auto-merge when BLOG_PAT can.
      # If auto-merge fails, the branch/PR remains as the manual fallback.
      - name: Step 5 - Mark draft as published
        if: >-
          steps.auto_select.outputs.has_draft == 'true' &&
          github.event.inputs.dry_run != 'true' &&
          (steps.publish.outputs.qiita_url != '' || steps.publish.outputs.devto_url != '')
        env:
          GH_TOKEN: ${{ secrets.BLOG_PAT || secrets.GH_PAT_BLOG_MERGE || secrets.BYPASS_RULES || github.token }}
          BLOG_PAT: ${{ secrets.BLOG_PAT }}
          GH_PAT_BLOG_MERGE: ${{ secrets.GH_PAT_BLOG_MERGE }}
          BYPASS_RULES: ${{ secrets.BYPASS_RULES }}
          GITHUB_TOKEN: ${{ github.token }}
          DRAFT_PATH: ${{ steps.meta.outputs.draft_path }}
          DRAFT_PATH_EN: ${{ github.event.inputs.draft_path_en }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/blog_mark_published_status.sh

      # ── Step 6: schedule_task_runs 記録 ─────────────────────────────────
      - name: Step 6 - schedule_task_runs 記録
        if: always()
        env:
          ARTICLE_TITLE: ${{ steps.meta.outputs.title }}
          QIITA_URL: ${{ steps.publish.outputs.qiita_url }}
          DEVTO_URL: ${{ steps.publish.outputs.devto_url }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          DRY_RUN="$DRY_RUN_INPUT"
          STATUS="success"
          if [ "${{ steps.auto_select.outputs.has_draft }}" = "true" ] && \
             [ "$DRY_RUN" != "true" ] && \
             [ -z "$QIITA_URL" ] && [ -z "$DEVTO_URL" ]; then
            STATUS="failure"
          fi
          SUMMARY="blog-publish: $ARTICLE_TITLE | dry_run=$DRY_RUN | qiita=$QIITA_URL | devto=$DEVTO_URL"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"blog-publish\",\"status\":\"$STATUS\",\"summary\":$(echo "$SUMMARY" | jq -R .)}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Job Summary
        if: always()
        env:
          ARTICLE_TITLE: ${{ steps.meta.outputs.title }}
          DRAFT_PATH_OUT: ${{ steps.meta.outputs.draft_path }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          QIITA_URL: ${{ steps.publish.outputs.qiita_url }}
          DEVTO_URL: ${{ steps.publish.outputs.devto_url }}
        run: |
          DRY_RUN="$DRY_RUN_INPUT"
          QIITA="$QIITA_URL"
          DEVTO="$DEVTO_URL"
          {
            echo "## Blog Publish $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| trace_id | \`$TRACE_ID\` |"
            echo "| ドラフト | \`$DRAFT_PATH_OUT\` |"
            echo "| タイトル | $ARTICLE_TITLE |"
            echo "| ドライラン | $DRY_RUN |"
            if [ -n "$QIITA" ]; then
              echo "| Qiita | [投稿済み]($QIITA) |"
            else
              echo "| Qiita | スキップ (トークン未設定または失敗) |"
            fi
            if [ -n "$DEVTO" ]; then
              echo "| dev.to | [投稿済み]($DEVTO) |"
            else
              echo "| dev.to | スキップ (APIキー未設定または失敗) |"
            fi
          } >> $GITHUB_STEP_SUMMARY

      # ── Step 8: DLQ — 失敗時の incident-report (AI_DEV Principle 6) ──────
      - name: DLQ — record failure to incident-reports
        if: failure()
        env:
          DRAFT_PATH_OUT: ${{ steps.meta.outputs.draft_path }}
          ARTICLE_TITLE: ${{ steps.meta.outputs.title }}
          GH_TOKEN: ${{ secrets.BYPASS_RULES || secrets.GITHUB_TOKEN }}
          BYPASS_TOKEN: ${{ secrets.BYPASS_RULES }}
          PLATFORMS_INPUT: ${{ github.event.inputs.platforms }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p docs/incident-reports
          FILE="docs/incident-reports/${TODAY}-blog-publish.md"
          if [ ! -f "$FILE" ]; then
            printf -- "# blog-publish 失敗レポート %s\n\n" "$TODAY" > "$FILE"
          fi
          {
            printf "\n## 失敗 %s\n\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf -- "- **trace_id**: \`%s\`\n" "$TRACE_ID"
            printf -- "- **run_id**: [%s](%s/%s/actions/runs/%s)\n" \
              "${{ github.run_id }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"
            printf -- "- **draft**: \`%s\`\n" "${DRAFT_PATH_OUT:-unknown}"
            printf -- "- **title**: %s\n" "${ARTICLE_TITLE:-unknown}"
            printf -- "- **platforms**: %s\n" "$PLATFORMS_INPUT"
            printf -- "- **event**: %s\n" "$EVENT_NAME"
            printf -- "- **actor**: %s\n" "$TRIGGERING_ACTOR"
          } >> "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git checkout main 2>/dev/null || git checkout -b main origin/main
          git pull origin main --ff-only || true
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "[trace=$TRACE_ID] No incident changes to record"
            exit 0
          fi
          git commit -m "自動: blog-publish DLQ $TODAY (trace=$TRACE_ID)"
          if [ -n "$BYPASS_TOKEN" ]; then
            git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${BYPASS_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git push origin HEAD:main || echo "[trace=$TRACE_ID] DLQ push failed (non-blocking)"
