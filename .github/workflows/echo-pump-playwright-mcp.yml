name: Echo Pump Playwright MCP
on:
  push:
    branches: [codex/echo-pump-playwright-mcp]
    paths: ['scripts/echo_pump_playwright_mcp/**', '.github/workflows/echo-pump-playwright-mcp.yml']
  workflow_dispatch:
    inputs:
      expect_keyboard:
        description: Verify the released keyboard feature
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated fixed MCP runtime
        run: |
          python -m pip install mcp==1.26.0
          mkdir -p /tmp/echo-mcp
          npm install --prefix /tmp/echo-mcp --save-exact @playwright/mcp@0.0.83
          /tmp/echo-mcp/node_modules/.bin/playwright install --with-deps chromium
          cp /tmp/echo-mcp/package-lock.json mcp-package-lock.json
      - name: Probe actual public game through MCP
        env:
          MCP_EXPECT_KEYBOARD: ${{ inputs.expect_keyboard && '1' || '0' }}
        run: python scripts/echo_pump_playwright_mcp/probe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: echo-pump-playwright-mcp-${{ github.run_id }}
          path: |
            mcp-browser-evidence/
            mcp-package-lock.json
          retention-days: 7
