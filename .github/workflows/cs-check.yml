name: CS Check (自動サポート対応)

# 毎時実行 + 手動実行対応
on:
  schedule:
    - cron: "7 * * * *"  # 毎時7分に実行
  workflow_dispatch:       # 手動実行

concurrency:
  group: cs-check
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cs-check:
    name: CS Auto-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Step 1 - 未返信サポートチケット取得
        id: tickets
        run: |
          # get-support-tickets は admin-hub に統合済み (support.list action)
          HTTP_CODE=$(curl -s -o /tmp/tickets.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"support.list"}' \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/admin-hub" \
            --max-time 15)

          if [ "$HTTP_CODE" = "200" ]; then
            BODY=$(cat /tmp/tickets.json)
            TICKET_COUNT=$(echo "$BODY" | jq '.tickets | length' 2>/dev/null || echo "0")
          else
            BODY='{"tickets":[]}'
            TICKET_COUNT=0
          fi

          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "ticket_count=$TICKET_COUNT" >> $GITHUB_OUTPUT
          # レスポンスをファイルに保存（GitHub Output の行数制限回避）
          echo "$BODY" > /tmp/tickets_body.json
          echo "📋 チケット数: $TICKET_COUNT (HTTP: $HTTP_CODE)"

          # WEB版フォールバック用キャッシュ書き出し
          FETCHED_AT=$(TZ=Asia/Tokyo date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg http_code "$HTTP_CODE" \
            --arg ticket_count "$TICKET_COUNT" \
            --arg fetched_at "$FETCHED_AT" \
            --argjson body "$BODY" \
            '{http_code: $http_code, ticket_count: $ticket_count, fetched_at: $fetched_at, data: $body}' \
            > /tmp/ticket-cache.json
          mkdir -p docs
          cp /tmp/ticket-cache.json docs/ticket-cache.json

      - name: Quota Guard — Anthropic circuit breaker check
        id: quota_check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_circuit_breaker?provider=eq.anthropic&select=state,expires_at" \
            --max-time 5 2>/dev/null || echo "[]")
          STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "closed"' 2>/dev/null || echo "closed")
          EXPIRES=$(echo "$RESPONSE" | jq -r '.[0].expires_at // ""' 2>/dev/null || echo "")
          # テーブル未存在 or 取得失敗 → closed 扱いでスキップしない
          if [ "$STATE" = "open" ] && [ -n "$EXPIRES" ]; then
            NOW=$(date -u +%s)
            EXP=$(date -u -d "$EXPIRES" +%s 2>/dev/null || echo "9999999999")
            [ "$EXP" -lt "$NOW" ] && STATE="closed" && echo "⏰ CB expired → closed"
          fi
          if [ "$STATE" = "open" ]; then
            echo "⚠️ Anthropic quota exceeded (circuit open) — AI steps will be skipped"
            echo "anthropic_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Anthropic available"
            echo "anthropic_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Step 2 - FAQ自動返信
        if: steps.tickets.outputs.ticket_count != '0' && steps.quota_check.outputs.anthropic_available == 'true'
        run: |
          # admin-hub レスポンス: tickets[].metadata.title (旧: tickets[].title)
          cat /tmp/tickets_body.json | jq -r '.tickets[]? | .id' | while read -r ID; do
            TITLE=$(cat /tmp/tickets_body.json | jq -r --arg id "$ID" '.tickets[] | select(.id == $id) | .metadata.title // .title // "(no title)"')
            echo "🎫 処理中: $TITLE (ID: $ID)"

            REPLY="お問い合わせありがとうございます。確認いたしますので少々お待ちください。"

            # reply-support-request は admin-hub に統合済み (support.reply action)
            REPLY_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"support.reply\",\"id\":\"$ID\",\"reply\":\"$REPLY\",\"new_status\":\"open\"}" \
              "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/admin-hub" \
              --max-time 15)

            if [ "$REPLY_CODE" = "200" ]; then
              echo "  ✅ 返信送信 (HTTP $REPLY_CODE)"
            else
              echo "  ⚠️ 返信失敗 (HTTP $REPLY_CODE)"
            fi
          done

      - name: Step 4 - GitHub PR レビュー
        id: pr_review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRS=$(gh pr list --state open --json number,title,additions,deletions 2>/dev/null || echo "[]")
          PR_COUNT=$(echo "$PRS" | jq 'length')
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "📝 オープンPR: $PR_COUNT 件"

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "$PRS" | jq -r '.[] | "\(.number) \(.title) +\(.additions)/-\(.deletions)"'
          fi

      - name: Step 5 - インフラヘルスチェック
        id: health
        run: |
          INFRA_ERRORS=""

          # Supabase チェック (POST で呼ぶ)
          SUPABASE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/development-achievements" \
            --max-time 10)
          echo "🔍 Supabase development-achievements: HTTP $SUPABASE_CODE"

          # 403 = Network Restrictions によるブロック → インフラ異常として検知
          if [ "$SUPABASE_CODE" -ge 500 ] 2>/dev/null || [ "$SUPABASE_CODE" = "000" ] || [ "$SUPABASE_CODE" = "403" ]; then
            INFRA_ERRORS="${INFRA_ERRORS}- Supabase development-achievements: HTTP ${SUPABASE_CODE}\n"
          fi

          # Firebase チェック
          FIREBASE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://my-web-app-b67f4.web.app/" \
            --max-time 10)
          echo "🔍 Firebase Hosting: HTTP $FIREBASE_CODE"

          if [ "$FIREBASE_CODE" != "200" ]; then
            INFRA_ERRORS="${INFRA_ERRORS}- Firebase Hosting: HTTP ${FIREBASE_CODE}\n"
          fi

          # get-competitor-features チェック
          COMP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/get-competitor-features" \
            --max-time 10)
          echo "🔍 Supabase get-competitor-features: HTTP $COMP_CODE"

          if [ "$COMP_CODE" -ge 500 ] 2>/dev/null || [ "$COMP_CODE" = "000" ]; then
            INFRA_ERRORS="${INFRA_ERRORS}- Supabase get-competitor-features: HTTP ${COMP_CODE}\n"
          fi

          if [ -z "$INFRA_ERRORS" ]; then
            echo "✅ 全エンドポイント正常"
            echo "healthy=true" >> $GITHUB_OUTPUT
            echo "errors=" >> $GITHUB_OUTPUT
          else
            echo "⚠️ 異常検知"
            echo "healthy=false" >> $GITHUB_OUTPUT
            # ファイルに保存
            echo -e "$INFRA_ERRORS" > /tmp/infra_errors.txt
            echo "errors<<ERREOF" >> $GITHUB_OUTPUT
            cat /tmp/infra_errors.txt >> $GITHUB_OUTPUT
            echo "ERREOF" >> $GITHUB_OUTPUT
          fi

      - name: Step 3/6 - CS ノート記録 & main直接push
        run: |
          TICKET_COUNT="${{ steps.tickets.outputs.ticket_count }}"
          HEALTHY="${{ steps.health.outputs.healthy }}"
          HTTP_CODE="${{ steps.tickets.outputs.http_code }}"

          DATETIME=$(TZ=Asia/Tokyo date +%Y-%m-%d-%H)
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Tokyo date +%H)
          FILEPATH="docs/cs-notes/${DATETIME}.md"

          mkdir -p docs/cs-notes

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # ticket-cache.json は常に更新（WEB版フォールバック用）
          cp /tmp/ticket-cache.json docs/ticket-cache.json

          # チケット0件かつインフラ正常なら CSノート記録のみスキップ
          if [ "$TICKET_COUNT" = "0" ] && [ "$HEALTHY" = "true" ] && [ "$HTTP_CODE" != "403" ]; then
            echo "📝 チケットなし・インフラ正常 — CSノート記録スキップ（キャッシュのみ更新）"
          else
            # CSノート作成 (要対応あり or インフラ異常 or 403エラー時)
            {
              echo "# CS チェック ${DATE} ${HOUR}:00 (GitHub Actions)"
              echo ""
              echo "## サポートチケット"
              echo "- 取得チケット数: ${TICKET_COUNT}件"
              echo "- API応答: HTTP ${HTTP_CODE}"
              if [ "$HTTP_CODE" = "403" ]; then
                echo "- ⚠️ 403 Forbidden: Supabase Network Restrictions によりブロック — ダッシュボードでIP許可リスト確認を"
              fi
              echo ""
              echo "## GitHub PR レビュー"
              echo "- オープンPR: ${{ steps.pr_review.outputs.pr_count }}件"
              echo ""
              echo "## インフラヘルスチェック"
              if [ "$HEALTHY" = "true" ]; then
                echo "- ✅ 全エンドポイント正常"
              else
                echo ""
                echo "### ⚠️ インフラ異常"
                echo "${{ steps.health.outputs.errors }}"
              fi
              echo ""
              echo "---"
              echo "*実行環境: GitHub Actions (cs-check.yml)*"
            } > "$FILEPATH"
            git add docs/cs-notes/
          fi

          git add docs/ticket-cache.json
          if git diff --cached --quiet; then
            echo "📝 変更なし — スキップ"
            exit 0
          fi

          git commit -m "自動: CS チェック ${DATETIME}:00 (GitHub Actions)"
          # GH_PAT (deploy-prod と同じ bypass PAT) → BYPASS_RULES → GITHUB_TOKEN の順で試行
          PUSH_TOKEN="${{ secrets.GH_PAT || secrets.BYPASS_RULES || secrets.GITHUB_TOKEN }}"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/kanta13jp1/my_web_app.git"
          git push origin main && echo "✅ CS ノート記録 & キャッシュ更新完了" || {
            echo "⚠️ push失敗: GH_PAT または BYPASS_RULES secret (bypass権限付きPAT) を設定してください"
            echo "  または Repository Settings > Branches > Branch protection rules > Allow GitHub Actions to bypass"
          }

      - name: Record to schedule_task_runs
        if: always()
        run: |
          TICKET_COUNT="${{ steps.tickets.outputs.ticket_count }}"
          HEALTHY="${{ steps.health.outputs.healthy }}"
          STATUS="success"
          [ "$HEALTHY" != "true" ] && STATUS="partial"
          SUMMARY="CS Check: tickets=${TICKET_COUNT}, infra_healthy=${HEALTHY}"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"cs-check\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Job Summary
        if: always()
        run: |
          TICKETS="${{ steps.tickets.outputs.ticket_count }}"
          HTTP="${{ steps.tickets.outputs.http_code }}"
          PR_COUNT="${{ steps.pr_review.outputs.pr_count }}"
          HEALTHY="${{ steps.health.outputs.healthy }}"
          HEALTH_ICON=$([ "$HEALTHY" = "true" ] && echo "✅" || echo "⚠️")
          {
            echo "## CS Check $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|-----|------|"
            echo "| サポートチケット | ${TICKETS}件 (HTTP ${HTTP}) |"
            echo "| オープンPR | ${PR_COUNT}件 |"
            echo "| インフラ | ${HEALTH_ICON} healthy=${HEALTHY} |"
          } >> $GITHUB_STEP_SUMMARY
