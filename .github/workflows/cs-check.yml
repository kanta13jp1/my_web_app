name: CS Check (自動サポート対応)

# 毎時実行 + 手動実行対応
on:
  schedule:
    - cron: "7 */2 * * *"  # 2時間ごと7分 (2026-06-10 ci-audit: 毎時→2時間, 360runs/月削減)
  workflow_dispatch:       # 手動実行

concurrency:
  group: cs-check
  cancel-in-progress: true  # 2026-06-24 ci-audit: 2h cron キュー積み防止

permissions: {}

jobs:
  cs-check:
    environment:
      name: customer-operations-production
      deployment: false
    permissions:
      contents: write
      pull-requests: write
    name: CS Auto-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Step 1 - 未返信サポートチケット取得
        id: tickets
        run: |
          # admin-hub に統合済み (support.list action)
          HTTP_CODE=$(curl -s -o /tmp/tickets.json -w "%{http_code}" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"support.list"}' \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/admin-hub" \
            --max-time 15)

          if [ "$HTTP_CODE" = "200" ]; then
            BODY=$(cat /tmp/tickets.json)
            TICKET_COUNT=$(echo "$BODY" | jq '.tickets | length' 2>/dev/null || echo "0")
            NOTE=""
          else
            BODY='{"tickets":[]}'
            TICKET_COUNT=0
            NOTE="Supabase Network Restrictions によりブロック中 — Dashboard > Settings > Network > Network Restrictions で IP 許可リストを設定してください"
          fi

          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "ticket_count=$TICKET_COUNT" >> $GITHUB_OUTPUT
          echo "$BODY" > /tmp/tickets_body.json
          echo "📋 チケット数: $TICKET_COUNT (HTTP: $HTTP_CODE)"

          # ticket-cache.json 生成
          FETCHED_AT=$(TZ=Asia/Tokyo date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg http_code "$HTTP_CODE" \
            --arg ticket_count "$TICKET_COUNT" \
            --arg fetched_at "$FETCHED_AT" \
            --arg note "$NOTE" \
            --argjson body "$BODY" \
            '{http_code: $http_code, ticket_count: $ticket_count, fetched_at: $fetched_at, note: $note, data: $body}' \
            > /tmp/ticket-cache.json

      - name: Quota Guard — Anthropic circuit breaker check
        id: quota_check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_circuit_breaker?provider=eq.anthropic&select=state,expires_at" \
            --max-time 5 2>/dev/null || echo "[]")
          STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "closed"' 2>/dev/null || echo "closed")
          EXPIRES=$(echo "$RESPONSE" | jq -r '.[0].expires_at // ""' 2>/dev/null || echo "")
          if [ "$STATE" = "open" ] && [ -n "$EXPIRES" ]; then
            NOW=$(date -u +%s)
            EXP=$(date -u -d "$EXPIRES" +%s 2>/dev/null || echo "9999999999")
            [ "$EXP" -lt "$NOW" ] && STATE="closed" && echo "⏰ CB expired → closed"
          fi
          if [ "$STATE" = "open" ]; then
            echo "⚠️ Anthropic quota exceeded (circuit open) — AI steps will be skipped"
            echo "anthropic_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Anthropic available"
            echo "anthropic_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Step 2 - FAQ自動返信
        if: steps.tickets.outputs.ticket_count != '0' && steps.quota_check.outputs.anthropic_available == 'true'
        run: |
          cat /tmp/tickets_body.json | jq -r '.tickets[]? | .id' | while read -r ID; do
            TITLE=$(cat /tmp/tickets_body.json | jq -r --arg id "$ID" '.tickets[] | select(.id == $id) | .metadata.title // .title // "(no title)"')
            echo "🎫 処理中: $TITLE (ID: $ID)"
            REPLY="お問い合わせありがとうございます。確認いたしますので少々お待ちください。"
            REPLY_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"support.reply\",\"id\":\"$ID\",\"reply\":\"$REPLY\",\"new_status\":\"open\"}" \
              "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/admin-hub" \
              --max-time 15)
            echo "  返信: HTTP $REPLY_CODE"
          done

      - name: Step 4 - GitHub PR レビュー
        id: pr_review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRS=$(gh pr list --state open --json number,title,additions,deletions 2>/dev/null || echo "[]")
          PR_COUNT=$(echo "$PRS" | jq 'length')
          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "📝 オープンPR: $PR_COUNT 件"

      - name: Step 5 - インフラヘルスチェック
        id: health
        run: |
          INFRA_ERRORS=""

          # 旧実装は削除済み EF development-achievements を叩いており、返る 404 は
          # >=500/000/403 のいずれにも当たらないため DB が全断でも常に緑だった。
          # 生存 probe は health-check (public / --no-verify-jwt) を使う。
          # ただし health-check は unhealthy でも HTTP 200 を返す設計なので、
          # status コードだけでなく body の status まで見ないと再び dead-green になる。
          SUPABASE_CODE=$(curl -s -o /tmp/supabase-health.json -w "%{http_code}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/health-check" \
            --max-time 10)
          SUPABASE_STATUS=$(jq -r '.status // "unparseable"' /tmp/supabase-health.json 2>/dev/null || echo "unparseable")
          echo "🔍 Supabase: HTTP $SUPABASE_CODE / status=$SUPABASE_STATUS"
          if [ "$SUPABASE_CODE" != "200" ]; then
            INFRA_ERRORS="${INFRA_ERRORS}- Supabase: HTTP ${SUPABASE_CODE}\n"
          elif [ "$SUPABASE_STATUS" != "healthy" ]; then
            FAILED_CHECKS=$(jq -r '[.checks // {} | to_entries[] | select(.value.ok != true) | .key] | join(",")' /tmp/supabase-health.json 2>/dev/null || echo "")
            INFRA_ERRORS="${INFRA_ERRORS}- Supabase: ${SUPABASE_STATUS} (failed: ${FAILED_CHECKS:-unknown})\n"
          fi

          FIREBASE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://my-web-app-b67f4.web.app/" --max-time 10)
          echo "🔍 Firebase: HTTP $FIREBASE_CODE"
          if [ "$FIREBASE_CODE" != "200" ]; then
            INFRA_ERRORS="${INFRA_ERRORS}- Firebase: HTTP ${FIREBASE_CODE}\n"
          fi

          WBS_OVERVIEW_CODE=$(curl -s -o /tmp/wbs-overview-health.json -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/wbs_project_overview_view?select=total_tasks,overdue_tasks,by_instance&limit=1" \
            --max-time 10)
          echo "WBS overview view: HTTP $WBS_OVERVIEW_CODE"
          if [ "$WBS_OVERVIEW_CODE" != "200" ]; then
            WBS_OVERVIEW_BODY=$(cat /tmp/wbs-overview-health.json 2>/dev/null | tr '\n' ' ' | cut -c 1-180)
            INFRA_ERRORS="${INFRA_ERRORS}- WBS overview view: HTTP ${WBS_OVERVIEW_CODE} ${WBS_OVERVIEW_BODY}\n"
          fi

          if [ -z "$INFRA_ERRORS" ]; then
            echo "healthy=true" >> $GITHUB_OUTPUT
            echo "errors=" >> $GITHUB_OUTPUT
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo -e "$INFRA_ERRORS" > /tmp/infra_errors.txt
            echo "errors<<ERREOF" >> $GITHUB_OUTPUT
            cat /tmp/infra_errors.txt >> $GITHUB_OUTPUT
            echo "ERREOF" >> $GITHUB_OUTPUT
          fi

      - name: Write flutter-analyze-cache.json
        id: analyze_cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh run list \
            --workflow=ci.yml --branch=main --limit=1 \
            --json conclusion,updatedAt,headSha,status \
            2>/dev/null || echo "[]")
          CONCLUSION=$(echo "$LATEST" | jq -r '.[0].conclusion // "unknown"')
          STATUS=$(echo "$LATEST" | jq -r '.[0].status // "unknown"')
          UPDATED_AT=$(echo "$LATEST" | jq -r '.[0].updatedAt // ""')
          HEAD_SHA=$(echo "$LATEST" | jq -r '.[0].headSha // ""')
          ANALYZE_OK=$([ "$CONCLUSION" = "success" ] && echo "true" || echo "false")
          jq -n \
            --arg conclusion "$CONCLUSION" \
            --arg status "$STATUS" \
            --argjson analyze_ok "$ANALYZE_OK" \
            --arg updated_at "$UPDATED_AT" \
            --arg head_sha "$HEAD_SHA" \
            '{
              analyze_ok: $analyze_ok,
              conclusion: $conclusion,
              status: $status,
              updated_at: $updated_at,
              head_sha: $head_sha,
              note: "ci.yml (Lint, Format, and Test) の最新 main ブランチ実行結果。cs-check.yml が毎時更新。"
            }' > /tmp/flutter-analyze-cache.json
          echo "✅ flutter-analyze-cache: conclusion=$CONCLUSION"

      - name: Step 5.5 - daily-report freshness guard
        id: daily_report
        run: |
          git fetch origin main --quiet
          set +e
          python scripts/check_daily_report_freshness.py \
            --ref origin/main \
            --json \
            --github-output "$GITHUB_OUTPUT" \
            > /tmp/daily-report-freshness.json
          CHECK_EXIT=$?
          set -e
          cat /tmp/daily-report-freshness.json
          if [ "$CHECK_EXIT" -eq 0 ]; then
            echo "✅ daily-report freshness confirmed"
          else
            echo "⚠️ daily-report freshness check failed"
          fi
          exit 0

      - name: Step 3/6 - Update cache files via GitHub API (branch protection bypass)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TICKET_COUNT="${{ steps.tickets.outputs.ticket_count }}"
          HEALTHY="${{ steps.health.outputs.healthy }}"
          HTTP_CODE="${{ steps.tickets.outputs.http_code }}"
          DATETIME=$(TZ=Asia/Tokyo date +%Y-%m-%d-%H)
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Tokyo date +%H)
          REPO="kanta13jp1/my_web_app"

          update_file() {
            local path="$1"
            local content_b64="$2"
            local message="$3"
            # 現在のSHAを取得
            local sha
            sha=$(gh api "repos/${REPO}/contents/${path}" --jq '.sha' 2>/dev/null || echo "")
            local body
            if [ -n "$sha" ]; then
              body="{\"message\":\"${message}\",\"content\":\"${content_b64}\",\"sha\":\"${sha}\"}"
            else
              body="{\"message\":\"${message}\",\"content\":\"${content_b64}\"}"
            fi
            gh api -X PUT "repos/${REPO}/contents/${path}" \
              --input - <<< "$body" --silent && \
              echo "✅ $path 更新完了" || echo "⚠️ $path 更新失敗"
          }

          # ticket-cache.json を更新
          TICKET_B64=$(base64 -w0 /tmp/ticket-cache.json)
          update_file "docs/ticket-cache.json" "$TICKET_B64" "自動: ticket-cache 更新 ${DATETIME}:00 (cs-check)"

          # flutter-analyze-cache.json を更新
          ANALYZE_B64=$(base64 -w0 /tmp/flutter-analyze-cache.json)
          update_file "docs/flutter-analyze-cache.json" "$ANALYZE_B64" "自動: flutter-analyze-cache 更新 ${DATETIME}:00 (cs-check)"

          # CSノート (チケットあり or 異常あり or 403エラー時のみ)
          if [ "$TICKET_COUNT" != "0" ] || [ "$HEALTHY" != "true" ] || [ "$HTTP_CODE" = "403" ]; then
            FILEPATH="docs/cs-notes/${DATETIME}.md"
            {
              echo "# CS チェック ${DATE} ${HOUR}:00 (GitHub Actions)"
              echo ""
              echo "## サポートチケット"
              echo "- 取得チケット数: ${TICKET_COUNT}件"
              echo "- API応答: HTTP ${HTTP_CODE}"
              if [ "$HTTP_CODE" = "403" ]; then
                echo "- ⚠️ 403 Forbidden: Supabase Network Restrictions — \`docs/.supabase-network-allow\` コミットで自動修復"
              fi
              echo ""
              echo "## GitHub PR"
              echo "- オープンPR: ${{ steps.pr_review.outputs.pr_count }}件"
              echo ""
              echo "## インフラヘルスチェック"
              if [ "$HEALTHY" = "true" ]; then
                echo "- ✅ 全エンドポイント正常"
              else
                echo "- ⚠️ 異常検知"
                echo "${{ steps.health.outputs.errors }}"
              fi
              echo ""
              echo "*実行: GitHub Actions cs-check.yml*"
            } > /tmp/cs-note.md
            CS_B64=$(base64 -w0 /tmp/cs-note.md)
            update_file "$FILEPATH" "$CS_B64" "自動: CS チェック ${DATETIME}:00 (GitHub Actions)"
          fi

          echo "✅ GitHub API ファイル更新完了"

      - name: Record to schedule_task_runs
        if: always()
        run: |
          TICKET_COUNT="${{ steps.tickets.outputs.ticket_count }}"
          HEALTHY="${{ steps.health.outputs.healthy }}"
          DAILY_REPORT="${{ steps.daily_report.outputs.fresh }}"
          STATUS="success"
          [ "$HEALTHY" != "true" ] && STATUS="partial"
          [ "$DAILY_REPORT" != "true" ] && STATUS="partial"
          SUMMARY="CS Check: tickets=${TICKET_COUNT}, infra_healthy=${HEALTHY}, daily_report_fresh=${DAILY_REPORT}"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"cs-check\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Job Summary
        if: always()
        run: |
          TICKETS="${{ steps.tickets.outputs.ticket_count }}"
          HTTP="${{ steps.tickets.outputs.http_code }}"
          PR_COUNT="${{ steps.pr_review.outputs.pr_count }}"
          HEALTHY="${{ steps.health.outputs.healthy }}"
          DAILY_REPORT="${{ steps.daily_report.outputs.fresh }}"
          HEALTH_ICON=$([ "$HEALTHY" = "true" ] && echo "✅" || echo "⚠️")
          DAILY_ICON=$([ "$DAILY_REPORT" = "true" ] && echo "✅" || echo "⚠️")
          {
            echo "## CS Check $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|-----|------|"
            echo "| サポートチケット | ${TICKETS}件 (HTTP ${HTTP}) |"
            echo "| オープンPR | ${PR_COUNT}件 |"
            echo "| インフラ | ${HEALTH_ICON} healthy=${HEALTHY} |"
            echo "| daily-report | ${DAILY_ICON} fresh=${DAILY_REPORT} |"
            echo "| キャッシュ更新 | GitHub API 方式 |"
          } >> $GITHUB_STEP_SUMMARY
