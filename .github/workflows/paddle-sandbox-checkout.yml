name: Paddle Sandbox Checkout Cloud Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/paddle-sandbox-checkout.yml'
      - 'docs/PADDLE_SANDBOX_CHECKOUT_VERIFICATION.md'
      - 'lib/pages/subscription_billing_page.dart'
      - 'lib/services/paddle_checkout.dart'
      - 'lib/services/paddle_js_checkout_gateway.dart'
      - 'lib/services/paddle_js_checkout_gateway_stub.dart'
      - 'lib/services/paddle_js_checkout_gateway_web.dart'
      - 'lib/ui/features/billing/**'
      - 'test/pages/subscription_billing_page_test.dart'
      - 'test/services/paddle_checkout_test.dart'
      - 'test/services/paddle_sandbox_web_entrypoint_test.dart'
      - 'test/ui/features/billing/**'
      - 'web/index.html'
      - 'web/paddle_sandbox_bridge.js'

permissions: {}

concurrency:
  group: paddle-sandbox-checkout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, browser-test, and build in cloud
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'

      - name: Cache Flutter pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install and verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter pub get --dry-run

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p .ci-logs

      - name: Validate bridge syntax
        shell: bash
        run: node --check web/paddle_sandbox_bridge.js

      - name: Verify Paddle Dart formatting
        shell: bash
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/pages/subscription_billing_page.dart
          lib/services/paddle_checkout.dart
          lib/services/paddle_js_checkout_gateway.dart
          lib/services/paddle_js_checkout_gateway_stub.dart
          lib/services/paddle_js_checkout_gateway_web.dart
          lib/ui/features/billing/view_models/paddle_sandbox_checkout_controller.dart
          lib/ui/features/billing/views/paddle_sandbox_checkout_card.dart
          test/pages/subscription_billing_page_test.dart
          test/services/paddle_checkout_test.dart
          test/services/paddle_sandbox_web_entrypoint_test.dart
          test/ui/features/billing/paddle_sandbox_checkout_card_test.dart

      - name: Analyze project
        shell: bash
        run: >-
          python scripts/quality_gate.py
          --analyze-only
          --analyzer-artifact-dir .ci-logs/analyzer

      - name: Run focused VM tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --concurrency=1 \
            test/services/paddle_checkout_test.dart \
            test/services/paddle_sandbox_web_entrypoint_test.dart \
            test/ui/features/billing/paddle_sandbox_checkout_card_test.dart \
            test/pages/subscription_billing_page_test.dart \
            2>&1 | tee .ci-logs/paddle-vm-tests.log

      - name: Run focused Chrome tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --platform chrome --concurrency=1 \
            test/ui/features/billing/paddle_sandbox_checkout_card_test.dart \
            test/pages/subscription_billing_page_test.dart \
            2>&1 | tee .ci-logs/paddle-chrome-tests.log

      - name: Compile sandbox-enabled debug Web build
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --debug --pwa-strategy=none \
            --dart-define=PADDLE_SANDBOX_ENABLED=true \
            --dart-define=PADDLE_SANDBOX_CLIENT_TOKEN=test_ci_compile_only \
            --dart-define=PADDLE_SANDBOX_PRICE_ID=pri_ci_compile_only \
            2>&1 | tee .ci-logs/paddle-debug-web-build.log
          test -s build/web/main.dart.js
          test -s build/web/paddle_sandbox_bridge.js

      - name: Compile release guard Web build
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release --pwa-strategy=none \
            --dart-define=PADDLE_SANDBOX_ENABLED=true \
            --dart-define=PADDLE_SANDBOX_CLIENT_TOKEN=test_ci_compile_only \
            --dart-define=PADDLE_SANDBOX_PRICE_ID=pri_ci_compile_only \
            2>&1 | tee .ci-logs/paddle-release-web-build.log
          test -s build/web/main.dart.js
          test -s build/web/paddle_sandbox_bridge.js

      - name: Write cloud validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Paddle sandbox checkout cloud validation'
            echo
            echo '- Static analysis, VM tests, Chrome tests, and Web builds run on the GitHub-hosted runner.'
            echo '- Build flags use non-secret compile-only placeholders and do not contact Paddle.'
            echo '- A real Paddle overlay and payment result still require the dated manual sandbox matrix.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence and release build
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paddle-sandbox-cloud-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-logs
            build/web
          if-no-files-found: warn
          retention-days: 7
