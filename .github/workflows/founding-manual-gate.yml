name: Founding Manual Gate

on:
  pull_request:
    paths:
      - ".github/workflows/founding-manual-gate.yml"
      - "docs/business/FOUNDING_MANUAL_GATE.md"
      - "scripts/check_founding_manual_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founding-manual-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-gate:
    name: Founding Manual Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check founding manual gate
        run: python scripts/check_founding_manual_gate.py
