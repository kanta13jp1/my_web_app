name: AI Quota Monitor

on:
  schedule:
    - cron: '11 0 * * *'  # 毎日 09:11 JST (2026-07-17 ci-audit: 00:00 UTC 8本集中を分散)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (Supabase に書き込まない)'
        required: false
        default: 'false'

concurrency:
  group: quota-monitor
  cancel-in-progress: false

permissions: {}

jobs:
  check-quotas:
    environment:
      name: observability-production
      deployment: false
    permissions:
      contents: read
    name: Check AI Tool Quotas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve paid Claude/Codex policy
        id: paid_ai_policy
        uses: ./.github/actions/paid-ai-policy
        with:
          requested: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED || 'false' }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Check Anthropic Claude Usage
        id: anthropic
        env:
          ANTHROPIC_API_KEY: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED == 'true' && steps.paid_ai_policy.outputs.enabled == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          python3 - << 'EOF'
          import os, requests, json
          from datetime import date, timedelta

          api_key = os.environ.get('ANTHROPIC_API_KEY', '')
          if not api_key:
              print('ANTHROPIC_API_KEY not set — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=skipped\nusage_json={}\n')
              exit(0)

          today = date.today()
          start = (today.replace(day=1)).isoformat()
          end = today.isoformat()

          try:
              # Cost 取得は Admin API (要 sk-ant-admin... キー)。旧実装の
              # https://api.anthropic.com/v1/usage は実在せず、失敗時に
              # cost=0 を status=ok として保存していた (捏造値 / H6)。
              resp = requests.get(
                  'https://api.anthropic.com/v1/organizations/cost_report',
                  headers={
                      'x-api-key': api_key,
                      'anthropic-version': '2023-06-01',
                  },
                  params={'starting_at': f'{start}T00:00:00Z', 'limit': 31},
                  timeout=10
              )
              if resp.ok:
                  data = resp.json()
                  total_cost = 0.0
                  for bucket in data.get('data', []):
                      for r in bucket.get('results', []):
                          try:
                              # amount は最小通貨単位 (USD ならセント) の
                              # decimal 文字列。"123.45" = $1.2345。
                              total_cost += float(r.get('amount', 0) or 0) / 100.0
                          except (TypeError, ValueError):
                              pass
                  print(f'Anthropic cost: ${total_cost:.4f} this month')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('status=ok\n')
                      f.write(f'cost={total_cost:.4f}\n')
                      f.write(f'usage_json={json.dumps({"tool":"anthropic","cost_usd":round(total_cost,4),"period":f"{start}/{end}","alert":total_cost>50})}\n')
              else:
                  # 通常 API キーは 401 になる。行を書かず UI は「未計測」を
                  # 表示する (偽の「正常 $0」より誠実)。
                  print(f'Anthropic cost_report error: {resp.status_code} — Admin API key (sk-ant-admin...) required')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('status=api_error\nusage_json={}\n')
          except Exception as e:
              print(f'Error: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=error\nusage_json={}\n')
          EOF

      - name: Check OpenAI (CODEX) Usage
        id: openai
        env:
          # Admin API キー (sk-admin-...) が必要。通常キーでは 401。
          OPENAI_API_KEY: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED == 'true' && steps.paid_ai_policy.outputs.enabled == 'true' && secrets.OPENAI_API_KEY || '' }}
        run: |
          python3 - << 'EOF'
          import os, requests, json
          from datetime import date, datetime, timezone

          api_key = os.environ.get('OPENAI_API_KEY', '')
          if not api_key:
              print('OPENAI_API_KEY not set — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=skipped\nusage_json={}\n')
              exit(0)

          try:
              # 旧 /v1/usage は廃止系で通常キーでも 401 → 常に api_error だった
              # (H6)。Costs API (Admin キー) で当月コストを取得する。
              today = date.today()
              start_epoch = int(
                  datetime(
                      today.year, today.month, 1, tzinfo=timezone.utc
                  ).timestamp()
              )
              resp = requests.get(
                  'https://api.openai.com/v1/organization/costs',
                  headers={'Authorization': f'Bearer {api_key}'},
                  params={'start_time': start_epoch, 'limit': 31},
                  timeout=10
              )
              if resp.ok:
                  data = resp.json()
                  total_cost = 0.0
                  for bucket in data.get('data', []):
                      for r in bucket.get('results', []):
                          amount = r.get('amount') or {}
                          try:
                              total_cost += float(amount.get('value', 0) or 0)
                          except (TypeError, ValueError):
                              pass
                  print(f'OpenAI cost this month: ${total_cost:.4f}')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('status=ok\n')
                      f.write(f'usage_json={json.dumps({"tool":"openai","cost_usd":round(total_cost,4),"alert":total_cost>20})}\n')
              else:
                  print(f'OpenAI costs API error: {resp.status_code} — Admin API key (sk-admin-...) required')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('status=api_error\nusage_json={}\n')
          except Exception as e:
              print(f'Error: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=error\nusage_json={}\n')
          EOF

      - name: Check GitHub Copilot Usage
        id: copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, requests, json
          from datetime import date

          token = os.environ.get('GITHUB_TOKEN', '')
          if not token:
              print('GITHUB_TOKEN not set — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=skipped\nusage_json={}\n')
              exit(0)

          try:
              # ユーザーレベルの Copilot 課金情報
              resp = requests.get(
                  'https://api.github.com/user/copilot_billing',
                  headers={
                      'Authorization': f'token {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'
                  },
                  timeout=10
              )
              if resp.ok:
                  data = resp.json()
                  plan = data.get('plan_type', 'unknown')
                  print(f'GitHub Copilot plan: {plan}')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'status=ok\n')
                      f.write(f'usage_json={json.dumps({"tool":"github_copilot","plan":plan,"alert":False})}\n')
              else:
                  # 403 = Copilot 未加入 or パーミッション不足
                  print(f'Copilot billing API: {resp.status_code} (plan may not include API access)')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'status=limited\nusage_json={json.dumps({"tool":"github_copilot","status":resp.status_code,"alert":False})}\n')
          except Exception as e:
              print(f'Error: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=error\nusage_json={}\n')
          EOF

      - name: Check GitHub Actions Minutes (Copilot Code Review budget)
        id: actions_minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, json
          from datetime import date

          token = os.environ.get('GITHUB_TOKEN', '')
          if not token:
              print('GITHUB_TOKEN not set — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('usage_json={}\n')
              exit(0)

          try:
              # User-level Actions billing (includes Copilot Code Review minutes from 2026-06-01)
              resp = requests.get(
                  'https://api.github.com/users/kanta13jp1/settings/billing/actions',
                  headers={
                      'Authorization': f'token {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'
                  },
                  timeout=10
              )
              if resp.ok:
                  data = resp.json()
                  included = data.get('included_minutes', 0)
                  total_paid = data.get('total_paid_minutes_used', 0)
                  total_used = data.get('total_minutes_used', 0)
                  pct = round(total_used / max(included, 1) * 100, 1) if included else 0
                  alert = pct >= 80
                  note = '⚠️ Copilot Code Review がActions minutes消費開始(2026-06-01〜)' if date.today() >= date(2026, 6, 1) else 'Copilot Code Review billing starts 2026-06-01'
                  print(f'Actions minutes: {total_used}/{included} ({pct}%) paid={total_paid}')
                  print(note)
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'usage_json={json.dumps({"tool":"actions_minutes","used":total_used,"included":included,"pct":pct,"paid":total_paid,"alert":alert,"note":note})}\n')
              else:
                  print(f'Actions billing API: {resp.status_code}')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'usage_json={json.dumps({"tool":"actions_minutes","status":resp.status_code,"alert":False})}\n')
          except Exception as e:
              print(f'Error: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('usage_json={}\n')
          PYEOF

      - name: Check Gemini Code Assist Quota
        id: gemini
        env:
          # repo secrets の登録名は GEMINI_API_KEY (GOOGLE_AI_API_KEY は未登録)。
          # 参照名 mismatch で毎日 skip されていた (H6)。
          GOOGLE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, requests, json
          from datetime import date

          api_key = os.environ.get('GOOGLE_AI_API_KEY', '')
          if not api_key:
              print('GOOGLE_AI_API_KEY not set — skipping (Gemini Code Assist quota is checked via Google Cloud Console)')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=skipped\nusage_json={}\n')
              exit(0)

          try:
              # Gemini API 疎通確認 (使用量はCloud Consoleで管理)
              resp = requests.get(
                  f'https://generativelanguage.googleapis.com/v1beta/models?key={api_key}',
                  timeout=10
              )
              if resp.ok:
                  models = resp.json().get('models', [])
                  print(f'Gemini API reachable: {len(models)} models available')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'status=ok\n')
                      f.write(f'usage_json={json.dumps({"tool":"gemini","models_count":len(models),"alert":False,"note":"quota details at console.cloud.google.com"})}\n')
              else:
                  print(f'Gemini API error: {resp.status_code}')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'status=api_error\nusage_json={json.dumps({"tool":"gemini","error":resp.status_code})}\n')
          except Exception as e:
              print(f'Error: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=error\nusage_json={}\n')
          EOF

      - name: Check Hedra API Credits
        id: hedra
        env:
          HEDRA_API_KEY: ${{ secrets.HEDRA_API_KEY }}
          HEDRA_CREDIT_WARNING_THRESHOLD: ${{ vars.HEDRA_CREDIT_WARNING_THRESHOLD || '50' }}
          HEDRA_CREDIT_CRITICAL_THRESHOLD: ${{ vars.HEDRA_CREDIT_CRITICAL_THRESHOLD || '20' }}
          HEDRA_CREDIT_STOP_THRESHOLD: ${{ vars.HEDRA_CREDIT_STOP_THRESHOLD || '5' }}
        run: |
          python3 - << 'EOF'
          import os, requests, json

          api_key = os.environ.get('HEDRA_API_KEY', '')
          warning = int(os.environ.get('HEDRA_CREDIT_WARNING_THRESHOLD', '50') or 50)
          critical = int(os.environ.get('HEDRA_CREDIT_CRITICAL_THRESHOLD', '20') or 20)
          stop = int(os.environ.get('HEDRA_CREDIT_STOP_THRESHOLD', '5') or 5)

          if not api_key:
              print('HEDRA_API_KEY not set — skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=skipped\nusage_json={}\n')
              exit(0)

          try:
              resp = requests.get(
                  'https://api.hedra.com/web-app/public/billing/credits',
                  headers={'X-API-Key': api_key},
                  timeout=10,
              )
              if resp.ok:
                  data = resp.json()
                  remaining = int(data.get('remaining', 0) or 0)
                  expiring = int(data.get('expiring', 0) or 0)
                  used = int(data.get('used', 0) or 0)
                  severity = 'ok'
                  threshold = warning
                  if remaining <= stop:
                      severity = 'stop'
                      threshold = stop
                  elif remaining <= critical:
                      severity = 'critical'
                      threshold = critical
                  elif remaining <= warning:
                      severity = 'warning'
                      threshold = warning
                  alert = severity != 'ok'
                  print(f'Hedra credits: remaining={remaining} used={used} expiring={expiring} severity={severity}')
                  payload = {
                      'tool': 'hedra',
                      'remaining': remaining,
                      'used': used,
                      'expiring': expiring,
                      'workspace_credits': data.get('workspace_credits', {}),
                      'alert': alert,
                      'severity': severity,
                      'threshold': threshold,
                      'warning_threshold': warning,
                      'critical_threshold': critical,
                      'stop_threshold': stop,
                      'source': 'hedra.get_credits',
                  }
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('status=ok\n')
                      f.write(f'usage_json={json.dumps(payload, separators=(",", ":"))}\n')
              else:
                  print(f'Hedra credits API error: {resp.status_code}')
                  payload = {
                      'tool': 'hedra',
                      'status': resp.status_code,
                      'error': resp.text[:200],
                      'alert': True,
                      'severity': 'unknown',
                      'source': 'hedra.get_credits',
                  }
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('status=api_error\n')
                      f.write(f'usage_json={json.dumps(payload, separators=(",", ":"))}\n')
          except Exception as e:
              print(f'Error: {e}')
              payload = {
                  'tool': 'hedra',
                  'error': str(e),
                  'alert': True,
                  'severity': 'unknown',
                  'source': 'hedra.get_credits',
              }
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=error\n')
                  f.write(f'usage_json={json.dumps(payload, separators=(",", ":"))}\n')
          EOF

      - name: Save quota data to Supabase
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_USAGE: ${{ steps.anthropic.outputs.usage_json }}
          OPENAI_USAGE: ${{ steps.openai.outputs.usage_json }}
          COPILOT_USAGE: ${{ steps.copilot.outputs.usage_json }}
          ACTIONS_MINUTES: ${{ steps.actions_minutes.outputs.usage_json }}
          GEMINI_USAGE: ${{ steps.gemini.outputs.usage_json }}
          HEDRA_USAGE: ${{ steps.hedra.outputs.usage_json }}
          QUOTA_ALERT_WEBHOOK_URL: ${{ secrets.QUOTA_ALERT_WEBHOOK_URL }}
        run: |
          python3 - << 'EOF'
          import os, requests, json
          from datetime import date

          service_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          rest_base_url = 'https://smmkxxavexumewbfaqpy.supabase.co/rest/v1'
          quota_url = f'{rest_base_url}/ai_quota_usage'
          notification_url = f'{rest_base_url}/app_notifications'
          headers = {
              'apikey': service_key,
              'Authorization': f'Bearer {service_key}',
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates'
          }
          today = date.today().isoformat()

          tools = ['ANTHROPIC_USAGE', 'OPENAI_USAGE', 'COPILOT_USAGE', 'ACTIONS_MINUTES', 'GEMINI_USAGE', 'HEDRA_USAGE']
          for env_key in tools:
              raw = os.environ.get(env_key, '{}')
              if not raw or raw == '{}':
                  continue
              try:
                  data = json.loads(raw)
                  if not data.get('tool'):
                      continue
                  row = {
                      'tool': data['tool'],
                      'checked_at': today,
                      'usage_json': data,
                      'alert': data.get('alert', False)
                  }
                  resp = requests.post(quota_url, headers=headers, json=row, timeout=10)
                  if resp.ok:
                      print(f"Saved {data['tool']} quota data")
                  else:
                      print(f"Failed to save {data['tool']}: {resp.status_code} {resp.text[:100]}")
                  if data.get('tool') == 'hedra' and data.get('alert'):
                      remaining = data.get('remaining', 'unknown')
                      severity = data.get('severity', 'warning')
                      message = (
                          f"Hedra API credits are low: remaining={remaining}, "
                          f"severity={severity}, threshold={data.get('threshold', 'n/a')}."
                      )
                      notification = {
                          'user_id': None,
                          'title': 'Hedra API credits alert',
                          'message': message,
                          'type': 'system',
                          'link': '/quota-dashboard',
                          'is_read': False,
                      }
                      nresp = requests.post(notification_url, headers=headers, json=notification, timeout=10)
                      print(f"Hedra notification status: {nresp.status_code}")
                      webhook = os.environ.get('QUOTA_ALERT_WEBHOOK_URL', '')
                      if webhook:
                          wresp = requests.post(webhook, json={'text': message}, timeout=10)
                          print(f"Hedra webhook status: {wresp.status_code}")
              except Exception as e:
                  print(f'Error saving {env_key}: {e}')
          EOF

      - name: Build quota summary report
        id: summary
        env:
          ANTHROPIC_USAGE: ${{ steps.anthropic.outputs.usage_json }}
          OPENAI_USAGE: ${{ steps.openai.outputs.usage_json }}
          COPILOT_USAGE: ${{ steps.copilot.outputs.usage_json }}
          ACTIONS_MINUTES: ${{ steps.actions_minutes.outputs.usage_json }}
          GEMINI_USAGE: ${{ steps.gemini.outputs.usage_json }}
          HEDRA_USAGE: ${{ steps.hedra.outputs.usage_json }}
          ANTHROPIC_STATUS: ${{ steps.anthropic.outputs.status }}
          OPENAI_STATUS: ${{ steps.openai.outputs.status }}
          COPILOT_STATUS: ${{ steps.copilot.outputs.status }}
          GEMINI_STATUS: ${{ steps.gemini.outputs.status }}
          HEDRA_STATUS: ${{ steps.hedra.outputs.status }}
        run: |
          python3 - << 'EOF'
          import os, json
          from datetime import date

          today = date.today().isoformat()
          lines = [f'## AI クォータ監視レポート {today}\n']
          alerts = []

          for env_key, label in [
              ('ANTHROPIC_USAGE', 'Claude (Anthropic)'),
              ('OPENAI_USAGE', 'OpenAI (CODEX)'),
              ('COPILOT_USAGE', 'GitHub Copilot'),
              ('ACTIONS_MINUTES', 'GitHub Actions minutes'),
              ('GEMINI_USAGE', 'Gemini Code Assist'),
              ('HEDRA_USAGE', 'Hedra API credits'),
          ]:
              raw = os.environ.get(env_key, '{}')
              if not raw or raw == '{}':
                  # キー未設定 (skipped) と API 失敗 (api_error/error) を
                  # 混同しない — 原因が違えば是正手順も違う。
                  status = os.environ.get(
                      env_key.replace('_USAGE', '_STATUS'), ''
                  )
                  if status in ('api_error', 'error'):
                      lines.append(
                          f'- **{label}**: ⚠️ API エラー'
                          ' (キーの権限/Admin キー要否を確認)'
                      )
                      alerts.append(label)
                  else:
                      lines.append(f'- **{label}**: スキップ (APIキー未設定)')
                  continue
              try:
                  d = json.loads(raw)
                  if d.get('alert'):
                      alerts.append(label)
                      lines.append(f'- **{label}**: ⚠️ アラート — {d}')
                  else:
                      lines.append(f'- **{label}**: ✅ 正常 — {d}')
              except Exception:
                  lines.append(f'- **{label}**: エラー')

          if alerts:
              lines.append(f'\n⚠️ アラート発生: {", ".join(alerts)}')
          else:
              lines.append('\n✅ 全ツール正常範囲内')

          report = '\n'.join(lines)
          print(report)

          # GitHub Step Summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as f:
              f.write(report)
          EOF
