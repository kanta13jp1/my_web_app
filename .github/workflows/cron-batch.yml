name: Scheduled Analysis Batch

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

concurrency:
    group: cron-batch
    cancel-in-progress: false

jobs:
    run-batch:
        name: Run Python Analysis Batch
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  pip install supabase google-genai

            - name: Run Batch Script
              run: python batch_analysis.py
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
                  SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

            - name: Record to schedule_task_runs
              if: always()
              run: |
                JOB_STATUS="${{ job.status }}"
                STATUS="success"
                [ "$JOB_STATUS" != "success" ] && STATUS="error"
                SUMMARY="Python batch analysis: status=${JOB_STATUS}"
                curl -s -o /dev/null \
                  -X POST \
                  -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                  -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                  -H "Content-Type: application/json" \
                  -H "Prefer: return=minimal" \
                  -d "{\"task_id\":\"cron-batch\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
                  "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
                  --max-time 10 || true

            - name: Notify Slack on Failure
              if: failure()
              run: |
                  cat <<EOF > payload.json
                  {
                    "text": "❌ Scheduled Batch Analysis Failed!",
                    "blocks": [
                      {
                        "type": "header",
                        "text": { "type": "plain_text", "text": "❌ Scheduled Batch Analysis Failed!" }
                      },
                      {
                        "type": "section",
                        "text": { "type": "mrkdwn", "text": "The scheduled Python batch process failed. Please check the logs." }
                      },
                      {
                        "type": "actions",
                        "elements": [
                          {
                            "type": "button",
                            "text": { "type": "plain_text", "text": "View Logs" },
                            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                            "style": "danger"
                          }
                        ]
                      }
                    ]
                  }
                  EOF
                  curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }}
