name: Scheduled Analysis Batch
# DISABLED: batch_analysis.py が毎回エラー (SUPABASE_SERVICE_ROLE_KEY / GEMINI_API_KEY 未設定疑い)
# 復活させる場合はシークレット設定後に on: の schedule を戻すこと

on:
    workflow_dispatch:  # 手動実行のみ残す (schedule は無効化)

concurrency:
    group: cron-batch
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    run-batch:
        name: Run Python Analysis Batch
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        if: false  # 常にスキップ — 有効化するには if: true に変更

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run Batch Script
              run: python batch_analysis.py
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
                  SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

            - name: Record to schedule_task_runs
              if: always()
              run: |
                JOB_STATUS="${{ job.status }}"
                STATUS="success"
                [ "$JOB_STATUS" != "success" ] && STATUS="error"
                SUMMARY="Python batch analysis: status=${JOB_STATUS}"
                curl -s -o /dev/null \
                  -X POST \
                  -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                  -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                  -H "Content-Type: application/json" \
                  -H "Prefer: return=minimal" \
                  -d "{\"task_id\":\"cron-batch\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
                  "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
                  --max-time 10 || true

            - name: Job Summary
              if: always()
              run: |
                STATUS="${{ job.status }}"
                ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
                {
                  echo "## Python Analysis Batch $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
                  echo ""
                  echo "| 項目 | 状態 |"
                  echo "|-----|------|"
                  echo "| batch_analysis.py | $ICON $STATUS |"
                  echo ""
                  echo "**Actor**: ${{ github.actor }} | **Trigger**: ${{ github.event_name }}"
                } >> $GITHUB_STEP_SUMMARY

            - name: Notify Slack on Failure
              if: failure()
              run: |
                  cat <<EOF > payload.json
                  {
                    "text": "❌ Scheduled Batch Analysis Failed!",
                    "blocks": [
                      {
                        "type": "header",
                        "text": { "type": "plain_text", "text": "❌ Scheduled Batch Analysis Failed!" }
                      },
                      {
                        "type": "section",
                        "text": { "type": "mrkdwn", "text": "The scheduled Python batch process failed. Please check the logs." }
                      },
                      {
                        "type": "actions",
                        "elements": [
                          {
                            "type": "button",
                            "text": { "type": "plain_text", "text": "View Logs" },
                            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                            "style": "danger"
                          }
                        ]
                      }
                    ]
                  }
                  EOF
                  curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }} --max-time 10 || true
