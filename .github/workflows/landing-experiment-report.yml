name: Landing Experiment Report

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: landing-experiment-report
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    environment:
      name: analytics-production
      deployment: false
    permissions:
      contents: read
    name: Build aggregate LP experiment report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD || 'https://smmkxxavexumewbfaqpy.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require report credentials
        shell: bash
        run: |
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is required."
            exit 1
          }

      - name: Build decision report
        shell: bash
        run: |
          mkdir -p tmp/landing-experiment-report
          python3 scripts/landing_experiment_report.py \
            --supabase-url "$SUPABASE_URL" \
            --json-report tmp/landing-experiment-report/report.json \
            --markdown-report tmp/landing-experiment-report/report.md \
            --synthetic-view-offset h01:control:1 \
            --synthetic-view-offset h10:treatment:1

      - name: Publish job summary
        if: always() && hashFiles('tmp/landing-experiment-report/report.md') != ''
        shell: bash
        run: cat tmp/landing-experiment-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: landing-experiment-report
          path: tmp/landing-experiment-report/
          if-no-files-found: error
          retention-days: 30
