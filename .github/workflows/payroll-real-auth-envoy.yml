name: Payroll synthetic Auth and Envoy
on:
  pull_request:
    paths:
      - docs/proposals/payroll_real_auth/**
      - supabase/migrations/20261015235500_payroll_confirmed_balance_observations.sql
      - .github/workflows/payroll-real-auth-envoy.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: payroll-real-auth-envoy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-auth-envoy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: payroll_auth_fixture
        options: >-
          --label payroll.auth.run=${{ github.run_id }}-${{ github.run_attempt }}
          --tmpfs /var/lib/postgresql/data:rw,nosuid,size=256m
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify fixed migration
        run: cmp docs/proposals/payroll_real_auth/migration.sql supabase/migrations/20261015235500_payroll_confirmed_balance_observations.sql
      - name: Check offline guards
        working-directory: docs/proposals/payroll_real_auth
        run: python3 -B -m unittest -v test_stack_guard.py test_auth_gateway_client.py test_stack_runner.py
      - name: Run isolated synthetic Auth and gateway test
        working-directory: docs/proposals/payroll_real_auth
        env:
          FIXTURE_DB_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python3 -B stack_runner.py
