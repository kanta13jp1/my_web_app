name: Schedule watch diagnostics tests
on:
  pull_request:
    paths:
      - scripts/schedule_resilience_watch.py
      - scripts/schedule_resilience_watch_test.py
      - .github/workflows/schedule-watch-diagnostics-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/schedule_resilience_watch_test.py
