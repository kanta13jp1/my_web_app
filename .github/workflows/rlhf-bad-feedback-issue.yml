name: RLHF Bad Feedback Issue Automation

on:
  schedule:
    # 6時間おき毎時37分 UTC に dry-run 評価（00:00 UTC 帯の集中を回避）
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Evaluate RLHF bad-feedback queue without creating GitHub issues (true/false)'
        required: false
        default: 'true'

concurrency:
  group: rlhf-bad-feedback-issue-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  dispatch-rlhf-issues:
    name: Evaluate and dispatch RLHF bad-feedback issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch pending RLHF bad-feedback records
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_URL}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            curl --fail --silent --show-error \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL%/}/rest/v1/ai_rlhf_feedback?dispatch_status=eq.pending&github_issue_number=is.null&select=*&limit=50" \
              -o rlhf_pending_records.json
          else
            printf '[]\n' > rlhf_pending_records.json
          fi

      - name: Run RLHF issue dispatcher tests and queue evaluation
        id: dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'true' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B test/scripts/test_dispatch_rlhf_github_issue.py -v
          python3 -B scripts/dispatch_rlhf_github_issue.py --self-test
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN_INPUT}" = "false" ]; then
            python3 -B scripts/dispatch_rlhf_github_issue.py \
              --input "rlhf_pending_records.json" \
              --repo "${GITHUB_REPOSITORY}" \
              --json-out "rlhf_feedback_dispatch_report.json" \
              --markdown-out "rlhf_feedback_dispatch_report.md" \
              --github-output "${GITHUB_OUTPUT}" \
              --live
          else
            python3 -B scripts/dispatch_rlhf_github_issue.py \
              --input "rlhf_pending_records.json" \
              --repo "${GITHUB_REPOSITORY}" \
              --json-out "rlhf_feedback_dispatch_report.json" \
              --markdown-out "rlhf_feedback_dispatch_report.md" \
              --github-output "${GITHUB_OUTPUT}" \
              --dry-run
          fi

      - name: Upload RLHF feedback dispatch report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rlhf-bad-feedback-dispatch-report
          path: |
            rlhf_feedback_dispatch_report.json
            rlhf_feedback_dispatch_report.md
          retention-days: 14
          if-no-files-found: warn

      - name: Append step summary
        if: always()
        env:
          DISPATCH_MODE: ${{ steps.dispatch.outputs.mode }}
          ELIGIBLE_COUNT: ${{ steps.dispatch.outputs.eligible_count }}
          CREATED_COUNT: ${{ steps.dispatch.outputs.created_count }}
        run: |
          {
            echo "## RLHF Bad Feedback Issue Automation"
            echo "- Mode: \`${DISPATCH_MODE}\`"
            echo "- Eligible items: \`${ELIGIBLE_COUNT}\`"
            echo "- Created issues: \`${CREATED_COUNT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
