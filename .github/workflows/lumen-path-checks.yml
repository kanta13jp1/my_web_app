name: KINETIC FORGE isolated prototype checks
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: kinetic-forge-prototype-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prototype:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --check web/labs/kinetic-forge/app.mjs
      - run: node --test web/labs/kinetic-forge/model.test.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Test the exact candidate on desktop and mobile
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/labs/kinetic-forge/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:8765 npx playwright test test/e2e/kinetic_forge.spec.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kinetic-forge-prototype-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
