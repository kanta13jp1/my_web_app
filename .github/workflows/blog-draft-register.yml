name: Blog Draft Register (blog_posts テーブル自動登録)

# docs/blog-drafts/ に新しいドラフトが push されたとき、
# blog_posts テーブルに draft レコードを自動登録する。
# WEB版インスタンスは Supabase に直接 POST できないため、
# GHA ランナー経由で schedule-hub blog.create を呼ぶ。

on:
  push:
    paths:
      - 'docs/blog-drafts/**.md'
    branches:
      - main

concurrency:
  group: blog-draft-register-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  register:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      contents: read
    name: Register new drafts in blog_posts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Detect new/modified draft files
        id: detect
        run: |
          # 直前のコミットで追加・変更された blog-drafts/*.md を列挙
          CHANGED=$(git diff --name-only --diff-filter=AC HEAD~1 HEAD -- 'docs/blog-drafts/*.md' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ No new/modified draft files — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "📝 New/modified drafts: $CHANGED"
          fi

      - name: Register each draft in blog_posts via schedule-hub
        if: steps.detect.outputs.skip == 'false'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
        run: |
          echo "${{ steps.detect.outputs.files }}" | while read DRAFT_PATH; do
            [ -z "$DRAFT_PATH" ] && continue
            [ ! -f "$DRAFT_PATH" ] && continue

            # タイトル抽出 (frontmatter title: または # 見出し)
            TITLE=$(grep '^title:' "$DRAFT_PATH" | head -1 | \
              sed "s/^title: *//;s/^['\"]//;s/['\"]$//" | tr -d '\r')
            if [ -z "$TITLE" ]; then
              TITLE=$(grep '^# ' "$DRAFT_PATH" | head -1 | \
                sed 's/^# //' | tr -d '\r')
            fi
            [ -z "$TITLE" ] && TITLE="$(basename "$DRAFT_PATH" .md)"

            echo "📤 Registering: $TITLE ($DRAFT_PATH)"

            # 既に同一 draft_path が登録済みなら content だけ更新して skip (冪等性)
            EXISTING=$(curl -sf \
              "${SUPABASE_URL}/rest/v1/blog_posts?draft_path=eq.${DRAFT_PATH}&select=id" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null || echo "[]")
            COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
            if [ "$COUNT" -gt "0" ]; then
              echo "ℹ️ Already registered: $DRAFT_PATH — updating content only"
              # content を最新ファイルで更新 (UI から公開できるよう常に最新化)
              CONTENT=$(python3 -c "import sys; print(open(sys.argv[1], encoding='utf-8', errors='replace').read()[:60000])" "$DRAFT_PATH" 2>/dev/null || head -c 60000 "$DRAFT_PATH")
              UPDATE_PAYLOAD=$(CONTENT="$CONTENT" python3 -c 'import json,os; print(json.dumps({"content": os.environ["CONTENT"]}))')
              curl -s -o /dev/null -w "  Content update HTTP: %{http_code}\n" \
                -X PATCH \
                "${SUPABASE_URL}/rest/v1/blog_posts?draft_path=eq.${DRAFT_PATH}" \
                -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=minimal" \
                -d "$UPDATE_PAYLOAD" \
                --max-time 10 || true
              continue
            fi

            # コンテンツ読み込み (最大60000文字 — Qiita/dev.to API 上限考慮)
            CONTENT=$(python3 -c "import sys; print(open(sys.argv[1], encoding='utf-8', errors='replace').read()[:60000])" "$DRAFT_PATH" 2>/dev/null || head -c 60000 "$DRAFT_PATH")

            # blog_posts テーブルに直接 INSERT (content付き)
            ISO_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # 2026-07-12: Qiita アカウント利用停止につき、新規登録は dev.to のみ。
            INSERT_PAYLOAD=$(TITLE="$TITLE" DRAFT_PATH="$DRAFT_PATH" ISO_NOW="$ISO_NOW" CONTENT="$CONTENT" python3 -c 'import json, os; print(json.dumps({"title": os.environ["TITLE"], "draft_path": os.environ["DRAFT_PATH"], "content": os.environ["CONTENT"], "status": "draft", "target_platforms": ["devto"], "created_at": os.environ["ISO_NOW"]}))')

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              "${SUPABASE_URL}/rest/v1/blog_posts" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "$INSERT_PAYLOAD" \
              --max-time 15)
            echo "  HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  ✅ Registered with content: $TITLE"
            else
              echo "  ⚠️ Registration failed (HTTP $HTTP_CODE)"
            fi
          done

      - name: Job Summary
        if: always()
        run: |
          echo "## Blog Draft Register $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.detect.outputs.skip }}" = "true" ]; then
            echo "ℹ️ 新規ドラフトなし — スキップ" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 登録対象ファイル" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.detect.outputs.files }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
