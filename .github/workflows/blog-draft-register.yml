name: Blog Draft Register (blog_posts テーブル自動登録)

# docs/blog-drafts/ に新しいドラフトが push されたとき、
# blog_posts テーブルに draft レコードを自動登録する。
# WEB版インスタンスは Supabase に直接 POST できないため、
# GHA ランナー経由で schedule-hub blog.create を呼ぶ。

on:
  push:
    paths:
      - 'docs/blog-drafts/**.md'
    branches:
      - main

concurrency:
  group: blog-draft-register-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  register:
    name: Register new drafts in blog_posts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect new/modified draft files
        id: detect
        run: |
          # 直前のコミットで追加・変更された blog-drafts/*.md を列挙
          CHANGED=$(git diff --name-only --diff-filter=AC HEAD~1 HEAD -- 'docs/blog-drafts/*.md' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ No new/modified draft files — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "📝 New/modified drafts: $CHANGED"
          fi

      - name: Register each draft in blog_posts via schedule-hub
        if: steps.detect.outputs.skip == 'false'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://smmkxxavexumewbfaqpy.supabase.co
        run: |
          echo "${{ steps.detect.outputs.files }}" | while read DRAFT_PATH; do
            [ -z "$DRAFT_PATH" ] && continue
            [ ! -f "$DRAFT_PATH" ] && continue

            # タイトル抽出 (frontmatter title: または # 見出し)
            TITLE=$(grep '^title:' "$DRAFT_PATH" | head -1 | \
              sed "s/^title: *//;s/^['\"]//;s/['\"]$//" | tr -d '\r')
            if [ -z "$TITLE" ]; then
              TITLE=$(grep '^# ' "$DRAFT_PATH" | head -1 | \
                sed 's/^# //' | tr -d '\r')
            fi
            [ -z "$TITLE" ] && TITLE="$(basename "$DRAFT_PATH" .md)"

            echo "📤 Registering: $TITLE ($DRAFT_PATH)"

            # 既に同一 draft_path が登録済みなら skip (冪等性)
            EXISTING=$(curl -sf \
              "${SUPABASE_URL}/rest/v1/blog_posts?draft_path=eq.${DRAFT_PATH}&select=id" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" 2>/dev/null || echo "[]")
            COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
            if [ "$COUNT" -gt "0" ]; then
              echo "ℹ️ Already registered: $DRAFT_PATH — skipping"
              continue
            fi

            # schedule-hub blog.create で登録
            PAYLOAD=$(python3 -c "
import json, sys
print(json.dumps({
  'action': 'blog.create',
  'title': sys.argv[1],
  'platform': 'zenn,qiita,note,hatena,medium,devto,hashnode,substack,github-pages,notion,x-article',
  'draft_path': sys.argv[2],
}))
" "$TITLE" "$DRAFT_PATH")

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "${SUPABASE_URL}/functions/v1/schedule-hub" \
              --max-time 15)

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "  HTTP: $HTTP_CODE"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  ✅ Registered: $TITLE"
            else
              echo "  ⚠️ Registration failed (HTTP $HTTP_CODE) — falling back to REST API direct insert"
              # Fallback: REST API 直接 INSERT
              ISO_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              FALLBACK_PAYLOAD=$(python3 -c "
import json, sys
print(json.dumps({
  'title': sys.argv[1],
  'draft_path': sys.argv[2],
  'status': 'draft',
  'target_platforms': ['zenn','qiita','note','hatena','medium','devto','hashnode','substack','github-pages','notion','x-article'],
  'created_at': sys.argv[3],
}))
" "$TITLE" "$DRAFT_PATH" "$ISO_NOW")

              curl -s -o /dev/null -w "Fallback HTTP: %{http_code}\n" \
                -X POST \
                "${SUPABASE_URL}/rest/v1/blog_posts" \
                -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=minimal" \
                -d "$FALLBACK_PAYLOAD" \
                --max-time 10 || echo "  ⚠️ Fallback also failed (non-blocking)"
            fi
          done

      - name: Job Summary
        if: always()
        run: |
          echo "## Blog Draft Register $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.detect.outputs.skip }}" = "true" ]; then
            echo "ℹ️ 新規ドラフトなし — スキップ" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 登録対象ファイル" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.detect.outputs.files }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
