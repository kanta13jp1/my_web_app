name: Documentation Quality Gate

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/documentation_links*.py'
      - 'scripts/documentation_quality_gate*.py'
      - '.github/workflows/documentation-quality.yml'
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: documentation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned documentation checkers
        run: python -m pip install codespell==2.4.3 markdown-it-py==4.0.0
      - name: Verify positive and negative fixtures
        run: |
          python scripts/documentation_links_test.py
          python scripts/documentation_quality_gate_test.py
      - name: Validate Markdown and preserve all findings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python scripts/documentation_quality_gate.py --base "$BASE_SHA"
          else
            python scripts/documentation_quality_gate.py
          fi
      - name: Publish findings and repair guidance
        if: always()
        run: |
          if [ -f doc-quality-evidence/summary.md ]; then
            cat doc-quality-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Documentation checker did not finish. Inspect the failed step before retrying.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: documentation-quality-evidence
          path: doc-quality-evidence/
          retention-days: 14
