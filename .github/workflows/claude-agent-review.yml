name: AI Agent PR Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - staging
      - develop
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
      - '**/*.md'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
  workflow_dispatch:
    inputs:
      ultrareview:
        description: 'Run claude ultrareview (multi-agent, billed) — set true to enable'
        required: false
        default: 'false'
        type: string
      pr_number:
        description: 'PR number to review from a trusted main dispatch'
        required: true
        default: ''
        type: string

concurrency:
  group: claude-agent-review-${{ github.event_name == 'pull_request' && 'contract' || 'gate' }}-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

# AI Review Gate is a separate check on the immutable PR head, emitted only
# after a real structured review. See docs/automation/solo-ai-review-gate.md.
# Existing optional ultrareview and high-risk contracts remain independent.

permissions: {}

jobs:
  review:
    name: Run trusted AI review
    if: >-
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'workflow_dispatch' && inputs.ultrareview != 'true')) &&
      (github.ref == 'refs/heads/main' || github.sha == vars.AI_REVIEW_BOOTSTRAP_SHA)
    environment:
      name: ai-review-production
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEW_DIR: /tmp/ai-review
    steps:
      - name: Checkout trusted workflow source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the fail-closed contract without credentials
        run: python -B scripts/ai_review_gate_test.py
      - name: Open head-bound check and prepare redacted review data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ai_review_gate.py prepare
      - name: Review immutable data with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'gemini-3.8-flash' }}
        run: python -B scripts/ai_review_gate.py review
      - name: Publish fail-closed check on the reviewed PR head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ai_review_gate.py publish
      - name: Preserve machine-readable review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ai-review/evidence.json
          if-no-files-found: error
          retention-days: 30

  high-risk-ultrareview-gate:
    name: High-risk ultrareview gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect changed files
        run: |
          mkdir -p .ci-logs
          # Three-dot (base...head) diffs from the MERGE BASE, i.e. only what this
          # PR changed. Two separate args (base head) is a two-dot diff against the
          # base *tip*, so every file that landed on main after the branch point
          # gets attributed to this PR. #4248 measured 1 real file reported as 97,
          # which dragged unrelated PRs into the high-risk path patterns.
          # fetch-depth: 0 above guarantees the merge base is present.
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > .ci-logs/high-risk-changed-files.txt

      - name: Check high-risk ultrareview contract
        run: |
          set +e
          python scripts/check_high_risk_ultrareview_gate.py \
            --event "$GITHUB_EVENT_PATH" \
            --changed-files .ci-logs/high-risk-changed-files.txt \
            > .ci-logs/high-risk-ultrareview-gate.txt 2>&1
          status=$?
          cat .ci-logs/high-risk-ultrareview-gate.txt
          cat .ci-logs/high-risk-ultrareview-gate.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: high-risk-ultrareview-gate
          path: .ci-logs/high-risk-*.txt
          if-no-files-found: ignore

  # --- bc58b50b #1765/#1779: claude ultrareview (opt-in, workflow_dispatch only) ---
  # Runs comprehensive multi-agent review via Claude Code CLI.
  # Triggered manually; never blocks PRs; billed separately.
  ultrareview:
    environment:
      name: ai-review-production
      deployment: false
    name: Claude ultrareview (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.ultrareview == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: read
      pull-requests: write

    steps:
      # workflow_dispatch carries no pull_request context, so the PR number must
      # come from an explicit input. Reading github.event.pull_request.number
      # alone made this job unable to review any PR (see #1779 follow-up).
      - name: Resolve PR number
        id: pr
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_NUM="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          PR_NUM=$(printf '%s' "$PR_NUM" | tr -d '[:space:]#')
          if [ -z "$PR_NUM" ]; then
            echo "::error::ultrareview needs a PR number. Re-run with -f pr_number=<PR#>."
            exit 1
          fi
          case "$PR_NUM" in
            *[!0-9]*)
              echo "::error::pr_number must be numeric (got '${PR_NUM}')."
              exit 1
              ;;
          esac
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #${PR_NUM}"

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          persist-credentials: false

      - name: Resolve paid Claude/Codex policy
        id: paid_ai_policy
        uses: ./.github/actions/paid-ai-policy
        with:
          requested: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED || 'false' }}

      - name: Record owner-requested ultrareview suspension
        if: steps.paid_ai_policy.outputs.enabled != 'true'
        run: echo "Claude ultrareview is disabled by owner policy." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest 2>&1 | tail -3

      - name: Run ultrareview
        id: ultrareview
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED == 'true' && steps.paid_ai_policy.outputs.enabled == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED == 'true' && steps.paid_ai_policy.outputs.enabled == 'true' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          # ultrareview is a cloud-hosted session, so it depends on what the
          # credential is entitled to rather than on raw model access. Prefer a
          # subscription token when one is configured, and drop the API key in
          # that case so the precedence is unambiguous.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            unset ANTHROPIC_API_KEY
            AUTH="CLAUDE_CODE_OAUTH_TOKEN (subscription)"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            AUTH="ANTHROPIC_API_KEY (API key)"
          else
            echo "::error::No Claude credential configured — set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN."
            exit 1
          fi
          echo "Auth: ${AUTH}"

          # Pre-flight: prove the credential itself reaches the API before
          # blaming ultrareview. "Ultrareview is currently unavailable." does not
          # distinguish a bad credential from a genuinely unavailable feature,
          # and `claude auth status` is useless here — it reports
          # "loggedIn": true even for a completely invalid token.
          #
          # This probe is only meaningful in CI: on a developer machine the CLI
          # silently falls back to the keychain session when the configured
          # token is bad, so the call succeeds and proves nothing. A runner has
          # no such fallback, so a failure here means the configured credential
          # is bad.
          if claude -p "Reply with exactly: OK" > auth_probe.txt 2>&1; then
            echo "Credential check: OK ($(head -c 100 auth_probe.txt | tr -d '\n'))"
          else
            echo "::error::The configured Claude credential (${AUTH}) failed a minimal API call, so it cannot be used for ultrareview either. Re-issue it with \`claude setup-token\` and update the repo secret."
            head -20 auth_probe.txt
            exit 1
          fi

          # `claude ultrareview <PR#>` is the real subcommand; there is no
          # --non-interactive flag (the CLI rejects it as an unknown option),
          # which is why the previous invocation could never have succeeded.
          status=0
          claude ultrareview "$PR_NUM" --timeout 15 > ultrareview.txt 2>&1 || status=$?
          cat ultrareview.txt

          if [ "$status" -ne 0 ]; then
            if grep -qi "currently unavailable" ultrareview.txt; then
              # Observed on every dispatch so far with API-key auth (3 runs
              # across ~17h). Say what to check instead of just "exited 1".
              echo "::error::ultrareview could not launch using ${AUTH}. It is a cloud-hosted session whose availability depends on the credential's entitlement. If only an API key is configured, add a CLAUDE_CODE_OAUTH_TOKEN repo secret from \`claude setup-token\` (requires a Claude subscription). If a subscription token is already in use, the service is likely temporarily unavailable — retry later."
            else
              echo "::error::claude ultrareview exited ${status} for PR #${PR_NUM} (auth: ${AUTH})."
            fi
            exit "$status"
          fi
          if [ ! -s ultrareview.txt ]; then
            echo "::error::claude ultrareview produced no output for PR #${PR_NUM}."
            exit 1
          fi

          # Never substitute a placeholder string for a review that did not run:
          # it would be posted as if it were ultrareview findings.
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Post ultrareview comment
        if: steps.ultrareview.outputs.ran == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // Read findings from disk rather than a step output: no heredoc
            // delimiter collisions and no 1MB GITHUB_OUTPUT ceiling. Resolve
            // against the workspace so this never depends on the step's cwd.
            const raw = fs
              .readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'ultrareview.txt'), 'utf8')
              .trim();
            if (!raw) {
              core.setFailed('ultrareview produced no findings to post.');
              return;
            }
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const LIMIT = 60000;
            const body = raw.length > LIMIT
              ? `${raw.slice(0, LIMIT)}\n\n_…truncated; see the workflow run log for the full findings._`
              : raw;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## 🔬 Claude ultrareview (multi-agent)\n\n${body}\n\n---\n*Claude Code ultrareview — [bc58b50b #1779](https://github.com/kanta13jp1/my_web_app/issues/1779)*`
            });
            core.info(`Posted ultrareview comment to PR #${prNumber}`);
