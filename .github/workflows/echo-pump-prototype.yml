name: Echo Pump Prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - lib/models/echo_pump_room_walk.dart
      - lib/widgets/echo_pump_room_stage.dart
      - test/models/echo_pump_room_walk_test.dart
      - test/widgets/echo_pump_room_stage_test.dart
      - test/e2e/echo_pump_room_stage.spec.ts
      - lib/models/echo_pump_game.dart
      - lib/pages/echo_pump_game_page.dart
      - lib/services/echo_pump_audio.dart
      - lib/widgets/echo_pump_audio_controls.dart
      - lib/widgets/echo_pump_cast.dart
      - test/widgets/echo_pump_cast_test.dart
      - lib/widgets/echo_pump_guidance.dart
      - test/widgets/echo_pump_guidance_test.dart
      - test/services/echo_pump_audio_test.dart
      - test/widgets/echo_pump_audio_controls_test.dart
      - test/e2e/echo_pump_audio.spec.ts
      - scripts/generate_echo_pump_audio.py
      - lib/widgets/echo_pump_title_screen.dart
      - lib/widgets/echo_pump_intro.dart
      - test/widgets/echo_pump_intro_test.dart
      - lib/widgets/echo_pump_visuals.dart
      - test/widgets/echo_pump_visuals_test.dart
      - test/widgets/echo_pump_title_screen_test.dart
      - assets/echo_pump/**
      - pubspec.yaml
      - test/models/echo_pump_game_test.dart
      - test/pages/echo_pump_game_page_test.dart
      - test/fixtures/echo_pump_app.dart
      - test/e2e/echo_pump.spec.ts
      - .github/workflows/echo-pump-prototype.yml

permissions: {}

concurrency:
  group: echo-pump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Analyze and test the prototype
        run: |
          dart format --output=none --set-exit-if-changed lib/models/echo_pump_room_walk.dart lib/widgets/echo_pump_room_stage.dart test/models/echo_pump_room_walk_test.dart test/widgets/echo_pump_room_stage_test.dart lib/pages/echo_pump_game_page.dart lib/widgets/echo_pump_visuals.dart
          dart analyze lib/models/echo_pump_room_walk.dart lib/widgets/echo_pump_room_stage.dart test/models/echo_pump_room_walk_test.dart test/widgets/echo_pump_room_stage_test.dart
          flutter test test/models/echo_pump_room_walk_test.dart test/widgets/echo_pump_room_stage_test.dart
          dart format --output=none --set-exit-if-changed lib/widgets/echo_pump_cast.dart test/widgets/echo_pump_cast_test.dart
          dart analyze lib/widgets/echo_pump_cast.dart test/widgets/echo_pump_cast_test.dart
          flutter test test/widgets/echo_pump_cast_test.dart
          python3 scripts/generate_echo_pump_audio.py --check
          dart format --output=none --set-exit-if-changed lib/widgets/echo_pump_guidance.dart test/widgets/echo_pump_guidance_test.dart
          dart analyze lib/widgets/echo_pump_guidance.dart test/widgets/echo_pump_guidance_test.dart
          flutter test test/widgets/echo_pump_guidance_test.dart
          dart format --output=none --set-exit-if-changed lib/services/echo_pump_audio.dart lib/widgets/echo_pump_audio_controls.dart test/services/echo_pump_audio_test.dart test/widgets/echo_pump_audio_controls_test.dart test/fixtures/echo_pump_app.dart
          dart analyze lib/services/echo_pump_audio.dart lib/widgets/echo_pump_audio_controls.dart test/services/echo_pump_audio_test.dart test/widgets/echo_pump_audio_controls_test.dart
          flutter test test/services/echo_pump_audio_test.dart test/widgets/echo_pump_audio_controls_test.dart
          dart format --output=none --set-exit-if-changed lib/widgets/echo_pump_intro.dart lib/pages/echo_pump_game_page.dart test/widgets/echo_pump_intro_test.dart test/pages/echo_pump_game_page_test.dart
          dart analyze lib/widgets/echo_pump_intro.dart test/widgets/echo_pump_intro_test.dart lib/widgets/echo_pump_visuals.dart test/widgets/echo_pump_visuals_test.dart lib/widgets/echo_pump_title_screen.dart test/widgets/echo_pump_title_screen_test.dart lib/models/echo_pump_game.dart lib/pages/echo_pump_game_page.dart test/models/echo_pump_game_test.dart test/pages/echo_pump_game_page_test.dart test/fixtures/echo_pump_app.dart
          flutter test test/widgets/echo_pump_intro_test.dart test/widgets/echo_pump_visuals_test.dart test/widgets/echo_pump_title_screen_test.dart test/models/echo_pump_game_test.dart test/pages/echo_pump_game_page_test.dart
      - name: Build isolated browser fixture
        run: flutter build web --release --pwa-strategy=none --target=test/fixtures/echo_pump_app.dart
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install browser testing tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Play on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/serve_spa.py build/web --port 7358 > echo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:7358/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:7358 npx playwright test test/e2e/echo_pump.spec.ts test/e2e/echo_pump_audio.spec.ts test/e2e/echo_pump_room_stage.spec.ts --project=chromium --project=mobile-chrome --workers=1 --retries=0
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: echo-pump-evidence-${{ github.run_id }}
          path: |
            lib/models/echo_pump_room_walk.dart
            lib/widgets/echo_pump_room_stage.dart
            test/models/echo_pump_room_walk_test.dart
            test/widgets/echo_pump_room_stage_test.dart
            lib/widgets/echo_pump_visuals.dart
            lib/widgets/echo_pump_cast.dart
            test/widgets/echo_pump_cast_test.dart
            test-results/**/*.png
            test-results/**/error-context.md
            echo-server.log
            lib/widgets/echo_pump_intro.dart
            lib/pages/echo_pump_game_page.dart
            test/widgets/echo_pump_intro_test.dart
            test/pages/echo_pump_game_page_test.dart
          if-no-files-found: ignore
          retention-days: 3
