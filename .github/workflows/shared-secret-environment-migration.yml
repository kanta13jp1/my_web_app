name: Shared secret environment migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Migration phase to execute
        required: true
        type: choice
        options:
          - provision
          - validate
          - delete-anthropic
          - delete-supabase
          - post-delete-audit
      confirmation:
        description: Exact confirmation phrase documented in the runbook
        required: true
        type: string

permissions: {}

concurrency:
  group: shared-secret-environment-migration
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - name: Require owner dispatch from main with exact confirmation
        id: guard
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Migration must run from refs/heads/main."
            exit 1
          }
          test "$GITHUB_ACTOR" = "$REPOSITORY_OWNER" || {
            echo "::error::Only the repository owner may dispatch this migration."
            exit 1
          }
          case "$MODE:$CONFIRMATION" in
            "provision:PROVISION ENVIRONMENT SECRETS"|\
            "validate:VALIDATE ENVIRONMENT SECRETS"|\
            "delete-anthropic:DELETE REPOSITORY ANTHROPIC_API_KEY"|\
            "delete-supabase:DELETE REPOSITORY SUPABASE_SERVICE_ROLE_KEY"|\
            "post-delete-audit:AUDIT DELETED REPOSITORY SECRETS") ;;
            *)
              echo "::error::Confirmation phrase does not match mode."
              exit 1
              ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  provision:
    needs: guard
    if: needs.guard.outputs.mode == 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    environment:
      name: high-risk-security-review
      deployment: false
    env:
      GH_TOKEN: ${{ secrets.BYPASS_RULES }}
      SOURCE_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SOURCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Re-encrypt source Environment secrets into target Environments
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "::error::BYPASS_RULES is required for Environment secret administration."
            exit 1
          }
          test -n "${SOURCE_ANTHROPIC_API_KEY:-}" || {
            echo "::error::high-risk-security-review ANTHROPIC_API_KEY is missing."
            exit 1
          }
          test -n "${SOURCE_SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "::error::high-risk-security-review SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          }

          anthropic_targets=(
            ai-review-production
            ai-operations-production
            content-automation-production
            observability-production
          )
          supabase_targets=(
            content-automation-production
            analytics-production
            customer-operations-production
            platform-security-production
            observability-production
            wbs-automation-production
          )

          for target in "${anthropic_targets[@]}"; do
            printf '%s' "$SOURCE_ANTHROPIC_API_KEY" |
              gh secret set ANTHROPIC_API_KEY --env "$target" --repo "$GITHUB_REPOSITORY"
          done
          for target in "${supabase_targets[@]}"; do
            printf '%s' "$SOURCE_SUPABASE_SERVICE_ROLE_KEY" |
              gh secret set SUPABASE_SERVICE_ROLE_KEY --env "$target" --repo "$GITHUB_REPOSITORY"
          done

          for target in high-risk-security-review "${anthropic_targets[@]}"; do
            gh secret list --env "$target" --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' |
              grep -Fxq ANTHROPIC_API_KEY || {
                echo "::error::$target is missing ANTHROPIC_API_KEY metadata."
                exit 1
              }
          done
          for target in high-risk-security-review "${supabase_targets[@]}"; do
            gh secret list --env "$target" --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' |
              grep -Fxq SUPABASE_SERVICE_ROLE_KEY || {
                echo "::error::$target is missing SUPABASE_SERVICE_ROLE_KEY metadata."
                exit 1
              }
          done
          echo "Environment secret provisioning metadata verified."

  validate-high-risk:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: high-risk-security-review
      deployment: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment high-risk-security-review
          --expect-anthropic --expect-supabase

  validate-ai-review:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: ai-review-production
      deployment: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment ai-review-production --expect-anthropic

  validate-ai-operations:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: ai-operations-production
      deployment: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment ai-operations-production --expect-anthropic

  validate-content-automation:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: content-automation-production
      deployment: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment content-automation-production
          --expect-anthropic --expect-supabase --expect-public-reads

  validate-analytics:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: analytics-production
      deployment: false
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment analytics-production --expect-supabase

  validate-customer-operations:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: customer-operations-production
      deployment: false
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment customer-operations-production --expect-supabase

  validate-platform-security:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: platform-security-production
      deployment: false
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment platform-security-production --expect-supabase

  validate-observability:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: observability-production
      deployment: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment observability-production
          --expect-anthropic --expect-supabase

  validate-wbs-automation:
    needs: guard
    if: needs.guard.outputs.mode != 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: wbs-automation-production
      deployment: false
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          python scripts/validate_shared_secret_environment.py
          --environment wbs-automation-production --expect-supabase

  delete-anthropic:
    needs:
      - guard
      - validate-high-risk
      - validate-ai-review
      - validate-ai-operations
      - validate-content-automation
      - validate-analytics
      - validate-customer-operations
      - validate-platform-security
      - validate-observability
      - validate-wbs-automation
    if: needs.guard.outputs.mode == 'delete-anthropic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: high-risk-security-review
      deployment: false
    env:
      GH_TOKEN: ${{ secrets.BYPASS_RULES }}
    steps:
      - name: Delete repository-level ANTHROPIC_API_KEY after Environment validation
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 1
          targets=(
            high-risk-security-review
            ai-review-production
            ai-operations-production
            content-automation-production
            observability-production
          )
          for target in "${targets[@]}"; do
            gh secret list --env "$target" --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' |
              grep -Fxq ANTHROPIC_API_KEY
          done
          gh secret delete ANTHROPIC_API_KEY --repo "$GITHUB_REPOSITORY"
          if gh secret list --repo "$GITHUB_REPOSITORY" --app actions --json name --jq '.[].name' |
            grep -Fxq ANTHROPIC_API_KEY; then
            echo "::error::Repository ANTHROPIC_API_KEY still exists."
            exit 1
          fi
          echo "Repository ANTHROPIC_API_KEY deletion verified."

  delete-supabase:
    needs:
      - guard
      - validate-high-risk
      - validate-ai-review
      - validate-ai-operations
      - validate-content-automation
      - validate-analytics
      - validate-customer-operations
      - validate-platform-security
      - validate-observability
      - validate-wbs-automation
    if: needs.guard.outputs.mode == 'delete-supabase'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: high-risk-security-review
      deployment: false
    env:
      GH_TOKEN: ${{ secrets.BYPASS_RULES }}
    steps:
      - name: Delete repository-level SUPABASE_SERVICE_ROLE_KEY after Environment validation
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || exit 1
          targets=(
            high-risk-security-review
            content-automation-production
            analytics-production
            customer-operations-production
            platform-security-production
            observability-production
            wbs-automation-production
          )
          for target in "${targets[@]}"; do
            gh secret list --env "$target" --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' |
              grep -Fxq SUPABASE_SERVICE_ROLE_KEY
          done
          gh secret delete SUPABASE_SERVICE_ROLE_KEY --repo "$GITHUB_REPOSITORY"
          if gh secret list --repo "$GITHUB_REPOSITORY" --app actions --json name --jq '.[].name' |
            grep -Fxq SUPABASE_SERVICE_ROLE_KEY; then
            echo "::error::Repository SUPABASE_SERVICE_ROLE_KEY still exists."
            exit 1
          fi
          echo "Repository SUPABASE_SERVICE_ROLE_KEY deletion verified."

  post-delete-audit:
    needs:
      - guard
      - validate-high-risk
      - validate-ai-review
      - validate-ai-operations
      - validate-content-automation
      - validate-analytics
      - validate-customer-operations
      - validate-platform-security
      - validate-observability
      - validate-wbs-automation
    if: needs.guard.outputs.mode == 'post-delete-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: high-risk-security-review
      deployment: false
    env:
      GH_TOKEN: ${{ secrets.BYPASS_RULES }}
    steps:
      - name: Confirm repository copies remain absent
        run: |
          set -euo pipefail
          names=$(gh secret list --repo "$GITHUB_REPOSITORY" --app actions --json name --jq '.[].name')
          for secret in ANTHROPIC_API_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if grep -Fxq "$secret" <<< "$names"; then
              echo "::error::Repository secret $secret still exists."
              exit 1
            fi
          done
          echo "Both tracked repository secret names are absent."
