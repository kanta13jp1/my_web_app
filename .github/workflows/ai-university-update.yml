name: AI大学コンテンツ更新 (4時間毎)

# 登録済みAIプロバイダーの最新ニュースを RSS 取得し ai_university_content テーブルを更新する
# Active providers: scripts/ai_university_providers.json (single execution/report source)
# 4時間毎に自動実行。深いリサーチは Claude Code Schedule (ai-university-update タスク) が NotebookLM で担当
on:
  schedule:
    - cron: "0 */4 * * *"  # 4時間毎 (UTC) — 2026-06-22 ci-audit: 2h→4h, 180runs/月削減
  workflow_dispatch:

concurrency:
  group: ai-university-update
  cancel-in-progress: false  # 前回実行をキャンセルせず完了させる (エラー隠蔽防止)

permissions: {}

jobs:
  source-audit:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      actions: read
      contents: read
    name: AI University Official Source Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download previous official-source audit baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/ai-university-source-audit/baseline
          PREVIOUS_RUN_ID=$(gh run list \
            --workflow ai-university-update.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            gh run download "$PREVIOUS_RUN_ID" \
              --name ai-university-source-audit \
              --dir .artifacts/ai-university-source-audit/baseline || true
          fi

      - name: Audit active AI University official sources (read-only)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p .artifacts/ai-university-source-audit/current
          CATALOG=.artifacts/ai-university-source-audit/catalog.json
          BASE_URL="https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_university_content"
          COMMON_ARGS=(
            -fsS
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
            --max-time 30
          )
          curl "${COMMON_ARGS[@]}" \
            "$BASE_URL?select=id,provider,title,source_url,is_active,target_audience,observable_learning_outcome,assessment_verification_method,evidence_source_url,evidence_verified_at&is_active=eq.true&source_url=not.is.null" \
            -o "$CATALOG"

          python3 scripts/ai_university_export_contract.py "$CATALOG" \
            --output-json .artifacts/ai-university-source-audit/current/export-contract.json \
            --output-md .artifacts/ai-university-source-audit/current/export-contract.md
          cat .artifacts/ai-university-source-audit/current/export-contract.md \
            >> "$GITHUB_STEP_SUMMARY"

          BASELINE=.artifacts/ai-university-source-audit/baseline/source-audit.json
          BASELINE_ARGS=()
          if [ -f "$BASELINE" ]; then
            BASELINE_ARGS=(--baseline "$BASELINE")
          fi
          python3 scripts/ai_university_source_audit.py \
            --catalog-json "$CATALOG" \
            "${BASELINE_ARGS[@]}" \
            --timeout 8 \
            --max-workers 8 \
            --output-json .artifacts/ai-university-source-audit/current/source-audit.json \
            --output-md .artifacts/ai-university-source-audit/current/source-audit.md
          cat .artifacts/ai-university-source-audit/current/source-audit.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish official-source audit evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-university-source-audit
          path: .artifacts/ai-university-source-audit/current/
          if-no-files-found: warn
          retention-days: 30

      - name: Aggregate anonymous reliability events (read-only)
        if: always()
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p .artifacts/ai-university-reliability
          EVENTS=.artifacts/ai-university-reliability/events.json
          HEADERS=.artifacts/ai-university-reliability/headers.txt
          UNTIL=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          SINCE=$(date -u -d '30 days ago' +'%Y-%m-%dT%H:%M:%SZ')
          BASE_URL="https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_university_content_events"
          curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Prefer: count=exact" \
            -H "Range-Unit: items" \
            -H "Range: 0-9999" \
            --max-time 30 \
            -D "$HEADERS" \
            "$BASE_URL?select=event_name,surface,occurred_at&occurred_at=gte.$SINCE&occurred_at=lt.$UNTIL&order=occurred_at.asc" \
            -o "$EVENTS"
          python3 scripts/ai_university_reliability_metrics.py "$EVENTS" \
            --headers "$HEADERS" \
            --window-start "$SINCE" \
            --window-end "$UNTIL" \
            --output-json .artifacts/ai-university-reliability/metrics.json \
            --output-md .artifacts/ai-university-reliability/metrics.md
          cat .artifacts/ai-university-reliability/metrics.md \
            >> "$GITHUB_STEP_SUMMARY"
          rm "$EVENTS" "$HEADERS"

      - name: Publish reliability metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-university-reliability-metrics
          path: .artifacts/ai-university-reliability/metrics.*
          if-no-files-found: warn
          retention-days: 30

  update:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      contents: write
    name: AI University Content Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Step 1: コード取得 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.BYPASS_RULES || github.token }}

      - name: Quota Guard — Anthropic circuit breaker check
        id: quota_check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_circuit_breaker?provider=eq.anthropic&select=state,expires_at" \
            --max-time 5 2>/dev/null || echo "[]")
          STATE=$(echo "$RESPONSE" | jq -r '.[0].state // "closed"' 2>/dev/null || echo "closed")
          EXPIRES=$(echo "$RESPONSE" | jq -r '.[0].expires_at // ""' 2>/dev/null || echo "")
          if [ "$STATE" = "open" ] && [ -n "$EXPIRES" ]; then
            NOW=$(date -u +%s)
            EXP=$(date -u -d "$EXPIRES" +%s 2>/dev/null || echo "9999999999")
            [ "$EXP" -lt "$NOW" ] && STATE="closed" && echo "⏰ CB expired → closed"
          fi
          if [ "$STATE" = "open" ]; then
            echo "⚠️ Anthropic quota exceeded — AI steps skipped"
            echo "anthropic_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Anthropic available"
            echo "anthropic_available=true" >> $GITHUB_OUTPUT
          fi

      # ── Step 2: 各プロバイダーの RSS から最新ニュースを取得・UPSERT ──────
      - name: Step 2 - Fetch and upsert AI provider news
        id: update
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d')
          cp scripts/ai_university_update_report.py "$RUNNER_TEMP/provider-report.py"
          cp scripts/ai_university_providers.json "$RUNNER_TEMP/providers.json"
          python3 "$RUNNER_TEMP/provider-report.py" list --manifest "$RUNNER_TEMP/providers.json" > "$RUNNER_TEMP/providers.tsv"
          : > "$RUNNER_TEMP/provider-outcomes.tsv"

          upsert_provider() {
            local provider="$1"
            local rss_url="$2"
            local provider_name="$3"

            # scripts/parse_rss.py で RSS を解析してリッチなコンテンツを生成
            local CONTENT
            if ! CONTENT=$(python3 scripts/parse_rss.py "$rss_url" "$provider_name" "$TODAY"); then
              echo "skip ${provider_name}: RSS fetch failed"
              printf "%s\tfailed\n" "$provider" >> "$RUNNER_TEMP/provider-outcomes.tsv"
              return 0
            fi

            local HTTP_CODE
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_university_content?on_conflict=provider,category" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              -d "{
                \"provider\": $(printf '%s' "$provider" | jq -R .),
                \"category\": \"news\",
                \"title\": $(printf '%s 最新ニュース (%s)' "$provider_name" "$TODAY" | jq -R .),
                \"content\": $(printf '%s' "$CONTENT" | jq -R -s .),
                \"published_at\": $(printf '%s' "$TODAY" | jq -R .),
                \"sort_order\": 1,
                \"is_active\": true
              }" \
              --max-time 15) || HTTP_CODE=000

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ ${provider_name}: 更新完了 (${HTTP_CODE})"
              printf "%s\tsucceeded\n" "$provider" >> "$RUNNER_TEMP/provider-outcomes.tsv"
            else
              echo "⚠️ ${provider_name}: 更新失敗 (HTTP ${HTTP_CODE})"
              printf "%s\tfailed\n" "$provider" >> "$RUNNER_TEMP/provider-outcomes.tsv"
            fi
          }

          while IFS=$'\t' read -r provider rss_url provider_name; do
            if [ "${{ steps.quota_check.outputs.anthropic_available }}" != "true" ]; then
              printf "%s\tskipped\n" "$provider" >> "$RUNNER_TEMP/provider-outcomes.tsv"
            else
              upsert_provider "$provider" "$rss_url" "$provider_name"
            fi
          done < "$RUNNER_TEMP/providers.tsv"
          python3 "$RUNNER_TEMP/provider-report.py" validate \
            --manifest "$RUNNER_TEMP/providers.json" \
            --journal "$RUNNER_TEMP/provider-outcomes.tsv" \
            --evidence "$RUNNER_TEMP/provider-evidence.json"

      # ── Step 3: 日次レポートへ追記 + PR 経由コミット ─────────────────────
      - name: Step 3 - Validate and upsert run-keyed daily report
        env:
          GH_TOKEN: ${{ secrets.BYPASS_RULES }}
          BYPASS_TOKEN: ${{ secrets.BYPASS_RULES }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          REPORT="docs/daily-reports/${TODAY}.md"
          python3 "$RUNNER_TEMP/provider-report.py" report \
            --manifest "$RUNNER_TEMP/providers.json" \
            --journal "$RUNNER_TEMP/provider-outcomes.tsv" \
            --report "$REPORT"

          git add "$REPORT"
          if git diff --cached --quiet; then
            echo "📝 変更なし — スキップ"
            exit 0
          fi

          git commit -m "自動: AI大学コンテンツ更新 ${TODAY}"
          git remote set-url origin "https://x-access-token:${BYPASS_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin main
          echo "✅ main直接push完了"

      # ── Step 4: schedule_task_runs 記録 ─────────────────────────────────
      - name: Step 4 - Record to schedule_task_runs
        if: always()
        run: |
          STATUS="${{ steps.update.outputs.status }}"
          SUMMARY="${{ steps.update.outputs.summary }}"
          if [ -z "$SUMMARY" ]; then
            STATUS="failed"
            SUMMARY="ai-university-update: accounting incomplete; no valid provider total"
          fi
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"ai-university-update\",\"status\":\"$STATUS\",\"summary\":$(echo "$SUMMARY" | jq -R .)}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Publish provider accounting evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-university-provider-accounting
          path: |
            ${{ runner.temp }}/providers.json
            ${{ runner.temp }}/provider-outcomes.tsv
            ${{ runner.temp }}/provider-evidence.json*
          if-no-files-found: error
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/provider-evidence.json.md" ]; then
            cat "$RUNNER_TEMP/provider-evidence.json.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Provider accounting incomplete; success ratio unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
