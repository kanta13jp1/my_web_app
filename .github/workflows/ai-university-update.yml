name: AI大学コンテンツ更新 (2時間毎)

# 登録済みAIプロバイダーの最新ニュースを RSS 取得し ai_university_content テーブルを更新する
# プロバイダーは固定せず随時追加可能 (現在54社: google/openai/anthropic/microsoft/meta/x/deepseek/mistral/perplexity/groq/cohere/amazon/stability/huggingface/nvidia/ibm/sakana/baidu/oracle/reka/aleph_alpha/together_ai/fireworks_ai/replicate/writer/ai21/voyage/elevenlabs/openrouter/ollama/runway/suno/ideogram/udio/luma/kling/pika/assemblyai/twelve_labs/qwen/moonshot/midjourney/hailuo/adobe_firefly/01ai/coze/apple/databricks/samsung/zhipu/character_ai/inflection_ai/allen_ai/naver)
# 2時間毎に自動実行。深いリサーチは Claude Code Schedule (ai-university-update タスク) が NotebookLM で担当
on:
  schedule:
    - cron: "0 */2 * * *"  # 2時間毎 (UTC)
  workflow_dispatch:

concurrency:
  group: ai-university-update
  cancel-in-progress: false  # 前回実行をキャンセルせず完了させる (エラー隠蔽防止)

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: AI University Content Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Step 1: コード取得 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.BYPASS_RULES || github.token }}

      # ── Step 2: 各プロバイダーの RSS から最新ニュースを取得・UPSERT ──────
      - name: Step 2 - Fetch and upsert AI provider news
        id: update
        run: |
          TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d')
          SUCCESS_COUNT=0
          FAILED_PROVIDERS=""

          upsert_provider() {
            local provider="$1"
            local rss_url="$2"
            local provider_name="$3"

            # scripts/parse_rss.py で RSS を解析してリッチなコンテンツを生成
            local CONTENT
            CONTENT=$(python3 scripts/parse_rss.py "$rss_url" "$provider_name" "$TODAY")

            local HTTP_CODE
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/ai_university_content?on_conflict=provider,category" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              -d "{
                \"provider\": $(printf '%s' "$provider" | jq -R .),
                \"category\": \"news\",
                \"title\": $(printf '%s 最新ニュース (%s)' "$provider_name" "$TODAY" | jq -R .),
                \"content\": $(printf '%s' "$CONTENT" | jq -R -s .),
                \"published_at\": $(printf '%s' "$TODAY" | jq -R .),
                \"sort_order\": 1,
                \"is_active\": true
              }" \
              --max-time 15)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ ${provider_name}: 更新完了 (${HTTP_CODE})"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "⚠️ ${provider_name}: 更新失敗 (HTTP ${HTTP_CODE})"
              FAILED_PROVIDERS="${FAILED_PROVIDERS} ${provider}"
            fi
          }

          # RSS有効プロバイダーのみ更新 (無効URLは静的seedコンテンツを維持)
          upsert_provider "google"      "https://blog.google/technology/ai/rss/"              "Google AI"
          upsert_provider "openai"      "https://openai.com/news/rss.xml"                     "OpenAI"
          upsert_provider "microsoft"   "https://blogs.microsoft.com/ai/feed/"                "Microsoft AI"
          upsert_provider "amazon"      "https://aws.amazon.com/blogs/machine-learning/feed/" "Amazon Bedrock"
          upsert_provider "huggingface" "https://huggingface.co/blog/feed.xml"                "Hugging Face"
          upsert_provider "nvidia"      "https://blogs.nvidia.com/feed/"                      "NVIDIA"
          upsert_provider "lightricks"  "https://www.lightricks.com/blog/feed"                "Lightricks LTX-2"
          upsert_provider "arcee_ai"    "https://www.arcee.ai/blog/rss.xml"                   "Arcee AI Trinity"
          upsert_provider "minimax"     "https://www.minimax.io/blog/rss.xml"                 "MiniMax Hailuo"
          upsert_provider "moondream"   "https://moondream.ai/blog/rss.xml"                   "Moondream VLM"
          upsert_provider "rakuten_ai"  "https://global.rakuten.com/corp/news/press.rss"      "Rakuten AI 3.0"
          upsert_provider "pfn"         "https://www.preferred.jp/en/feed/"                   "Preferred Networks (PLaMo)"
          upsert_provider "siliconflow" "https://siliconflow.cn/blog/rss.xml"                 "SiliconFlow"
          upsert_provider "novita_ai"   "https://novita.ai/blog/rss.xml"                      "Novita AI"
          upsert_provider "deepinfra"   "https://deepinfra.com/blog/rss.xml"                  "DeepInfra"
          upsert_provider "nebius"      "https://nebius.com/blog/rss.xml"                     "Nebius AI Studio"
          upsert_provider "fal_ai"      "https://blog.fal.ai/rss/"                            "fal.ai"
          upsert_provider "fish_audio"  "https://fish.audio/blog/rss.xml"                     "Fish Audio"
          upsert_provider "atlas_cloud" "https://www.atlascloud.ai/blog/rss"                  "Atlas Cloud"
          upsert_provider "mira_network" "https://docs.mira.network/blog/rss.xml"             "Mira Network"
          upsert_provider "gmi_cloud"   "https://www.gmicloud.ai/blog/rss.xml"                "GMI Cloud"
          upsert_provider "inworld"     "https://inworld.ai/blog/rss.xml"                     "Inworld AI"
          upsert_provider "coreweave"   "https://www.coreweave.com/blog/rss.xml"              "CoreWeave"
          upsert_provider "lambda_labs" "https://lambda.ai/blog/rss.xml"                      "Lambda Labs"
          upsert_provider "hyperbolic"  "https://hyperbolic.ai/blog/rss.xml"                  "Hyperbolic Labs"
          upsert_provider "anyscale"    "https://www.anyscale.com/blog/rss.xml"               "Anyscale"
          upsert_provider "cerebrium"   "https://www.cerebrium.ai/blog/rss.xml"               "Cerebrium"
          upsert_provider "magic_ai"    "https://magic.dev/blog/rss.xml"                      "Magic AI"
          upsert_provider "nous_research" "https://nousresearch.com/feed/"                    "Nous Research (Hermes 4 / Psyche)"
          # RSS廃止/URL無効 (静的seedコンテンツを維持):
          # anthropic, meta, x, deepseek, mistral, perplexity, groq, cohere, ibm, sakana, baidu, stability, core, cerebras, prover
          # black_forest_labs, liquid_ai, recraft, krea, tencent, bytedance, inception_labs, world_labs, runware, sambanova
          # decart, goodfire, prime_intellect, exa, pleias, imbue, thinking_machines, kyutai (seed only — RSS なし)
          # 新規追加時は upsert_provider 行を追加する

          echo "success_count=${SUCCESS_COUNT}" >> $GITHUB_OUTPUT
          echo "failed_providers=${FAILED_PROVIDERS}" >> $GITHUB_OUTPUT
          echo "updated_at=${TODAY}" >> $GITHUB_OUTPUT
          TOTAL_PROVIDERS=8  # RSS有効プロバイダー数
          echo "📊 更新結果: ${SUCCESS_COUNT}/${TOTAL_PROVIDERS} 成功"
          echo "total_providers=${TOTAL_PROVIDERS}" >> $GITHUB_OUTPUT

      # ── Step 3: 日次レポートへ追記 + PR 経由コミット ─────────────────────
      - name: Step 3 - Append to daily report and commit to main
        env:
          GH_TOKEN: ${{ secrets.BYPASS_RULES }}
          BYPASS_TOKEN: ${{ secrets.BYPASS_RULES }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d')
          SUCCESS_COUNT="${{ steps.update.outputs.success_count }}"
          FAILED="${{ steps.update.outputs.failed_providers }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # 日次レポートが存在しない場合は作成
          REPORT="docs/daily-reports/${TODAY}.md"
          if [ ! -f "$REPORT" ]; then
            echo "# 自分株式会社 日次レポート ${TODAY}" > "$REPORT"
          fi

          {
            echo ""
            echo "## AI大学コンテンツ更新 (ai-university-update)"
            echo ""
            echo "- Google AI: RSS 取得・UPSERT"
            echo "- OpenAI: RSS 取得・UPSERT"
            echo "- Anthropic: RSS 取得・UPSERT"
            echo "- Microsoft AI: RSS 取得・UPSERT"
            echo "- Meta AI: RSS 取得・UPSERT"
            echo "- X/xAI: RSS 取得・UPSERT"
            echo "- DeepSeek: RSS 取得・UPSERT"
            echo "- Mistral AI: RSS 取得・UPSERT"
            echo "- Perplexity AI: RSS 取得・UPSERT"
            echo "- 更新成功: ${SUCCESS_COUNT}/9"
            if [ -n "$FAILED" ]; then
              echo "- 失敗プロバイダー:${FAILED}"
            fi
          } >> "$REPORT"

          git add "$REPORT"
          if git diff --cached --quiet; then
            echo "📝 変更なし — スキップ"
            exit 0
          fi

          git commit -m "自動: AI大学コンテンツ更新 ${TODAY}"
          git remote set-url origin "https://x-access-token:${BYPASS_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin main
          echo "✅ main直接push完了"

      # ── Step 4: schedule_task_runs 記録 ─────────────────────────────────
      - name: Step 4 - Record to schedule_task_runs
        if: always()
        run: |
          SUCCESS_COUNT="${{ steps.update.outputs.success_count }}"
          FAILED="${{ steps.update.outputs.failed_providers }}"
          STATUS="success"
          [ "$SUCCESS_COUNT" -lt 7 ] 2>/dev/null && STATUS="partial"
          SUMMARY="ai-university-update: ${SUCCESS_COUNT}/9 プロバイダー更新完了 failed=${FAILED}"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"ai-university-update\",\"status\":\"$STATUS\",\"summary\":$(echo "$SUMMARY" | jq -R .)}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Job Summary
        if: always()
        run: |
          TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')
          SUCCESS_COUNT="${{ steps.update.outputs.success_count }}"
          FAILED="${{ steps.update.outputs.failed_providers }}"
          {
            echo "## AI大学コンテンツ更新 ${TODAY}"
            echo ""
            echo "| プロバイダー | ステータス |"
            echo "| --- | --- |"
            echo "| Google AI | RSS取得・UPSERT |"
            echo "| OpenAI | RSS取得・UPSERT |"
            echo "| Anthropic | RSS取得・UPSERT |"
            echo "| Microsoft AI | RSS取得・UPSERT |"
            echo "| Meta AI | RSS取得・UPSERT |"
            echo "| X/xAI | RSS取得・UPSERT |"
            echo "| DeepSeek | RSS取得・UPSERT |"
            echo "| Mistral AI | RSS取得・UPSERT |"
            echo "| Perplexity AI | RSS取得・UPSERT |"
            echo "| Groq | RSS取得・UPSERT |"
            echo "| Cohere | RSS取得・UPSERT |"
            echo "| Amazon Bedrock | RSS取得・UPSERT |"
            echo "| Stability AI | RSS取得・UPSERT |"
            echo "| Hugging Face | RSS取得・UPSERT |"
            echo "| NVIDIA | RSS取得・UPSERT |"
            echo "| IBM watsonx | RSS取得・UPSERT |"
            echo "| Sakana AI | RSS取得・UPSERT |"
            echo "| Baidu ERNIE | RSS取得・UPSERT |"
            echo ""
            TOTAL="${{ steps.update.outputs.total_providers }}"
          echo "**更新成功**: ${SUCCESS_COUNT}/${TOTAL}"
            if [ -n "$FAILED" ]; then
              echo "**失敗**:${FAILED}"
            fi
          } >> $GITHUB_STEP_SUMMARY
