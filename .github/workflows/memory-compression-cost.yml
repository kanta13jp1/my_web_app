name: Memory Compression LLM Cost Verification

on:
  pull_request:
    paths:
      - 'config/memory_compression_llm.json'
      - 'scripts/memory_compression_optimizer.py'
      - 'test/scripts/test_memory_compression_optimizer.py'
      - 'supabase/functions/_shared/memory_compression_router.ts'
      - 'supabase/functions/_shared/memory_compression_router_test.ts'
      - '.github/workflows/memory-compression-cost.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Optional compression profile override'
        required: false
        default: 'gemini_flash_low_cost'

concurrency:
  group: memory-compression-cost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify-memory-compression:
    name: Verify memory compression LLM routing and cost telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run memory compression optimizer unit tests and self-test
        run: |
          set -euo pipefail
          python3 -B test/scripts/test_memory_compression_optimizer.py -v
          python3 -B scripts/memory_compression_optimizer.py --self-test

      - name: Run dry-run compression cost and quality telemetry report
        id: optimizer
        env:
          AGENT_MEMORY_COMPRESSION_PROFILE: ${{ github.event.inputs.profile || 'gemini_flash_low_cost' }}
        run: |
          set -euo pipefail
          python3 -B scripts/memory_compression_optimizer.py \
            --validate-config \
            --dry-run \
            --json-out memory_compression_report.json \
            --markdown-out memory_compression_report.md \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload memory compression report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: memory-compression-report
          path: |
            memory_compression_report.json
            memory_compression_report.md
          retention-days: 14
          if-no-files-found: warn

      - name: Append step summary
        if: always()
        env:
          ACTIVE_PROVIDER: ${{ steps.optimizer.outputs.active_provider }}
          ACTIVE_MODEL: ${{ steps.optimizer.outputs.active_model }}
          SAVINGS_PCT: ${{ steps.optimizer.outputs.savings_pct }}
          QUALITY_PASSED: ${{ steps.optimizer.outputs.quality_passed }}
        run: |
          {
            echo "### Memory Compression LLM Cost Report (#2708)"
            echo "- Provider: \`${ACTIVE_PROVIDER:-unknown}\`"
            echo "- Model: \`${ACTIVE_MODEL:-unknown}\`"
            echo "- Savings vs baseline: \`${SAVINGS_PCT:-0}%\`"
            echo "- Restoration quality passed: \`${QUALITY_PASSED:-false}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
