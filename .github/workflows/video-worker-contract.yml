name: Video Worker Contract

on:
  pull_request:
    paths:
      - 'services/video-inference-worker/**'
      - '.github/workflows/video-worker-contract.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: video-worker-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install worker control-plane dependency
        run: python -m pip install requests==2.32.5
      - name: Verify worker contracts and diagnostic privacy
        working-directory: services/video-inference-worker
        run: python -m unittest -v test_worker.py
