name: User Feedback Resolved

on:
  issues:
    types: [closed]

concurrency:
  group: feedback-issue-resolved-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    environment:
      name: customer-operations-production
      deployment: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    name: Send Resolution Email
    if: contains(github.event.issue.labels.*.name, 'user-feedback')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Extract feedback metadata
        id: meta
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issue = context.payload.issue;
            const issueBody = issue.body || '';

            function extractComment(name) {
              const match = issueBody.match(new RegExp(`<!--\\s*${name}:([^\\n]+?)\\s*-->`, 'i'));
              return match ? match[1].trim() : '';
            }

            function extractLegacy(name) {
              const match = issueBody.match(new RegExp(`\\*\\*${name}\\*\\*:\\s*(.+)$`, 'im'));
              return match ? match[1].trim() : '';
            }

            const featureRequestId = extractComment('feature_request_id');
            const appFeedbackId = extractComment('app_feedback_id') || extractLegacy('feedback_id');

            let releaseTitle = '';
            let releaseUrl = '';

            try {
              const timeline = await github.rest.issues.listEventsForTimeline({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });

              for (const event of timeline.data) {
                if (event.event !== 'cross-referenced') continue;
                const sourceIssue = event.source?.issue;
                if (!sourceIssue?.pull_request) continue;
                releaseTitle = sourceIssue.title || '';
                releaseUrl = sourceIssue.html_url || '';
                break;
              }
            } catch (error) {
              core.info(`timeline lookup skipped: ${error.message}`);
            }

            const resolutionParts = [
              `GitHub Issue #${issue.number} was closed by @${context.payload.sender?.login || 'unknown'}.`,
            ];
            if (releaseTitle) {
              resolutionParts.push(`Release: ${releaseTitle}`);
            }
            if (releaseUrl) {
              resolutionParts.push(`Details: ${releaseUrl}`);
            }

            core.setOutput('feature_request_id', featureRequestId);
            core.setOutput('app_feedback_id', appFeedbackId);
            core.setOutput('issue_number', String(issue.number));
            core.setOutput('issue_title', issue.title || '');
            core.setOutput('issue_url', issue.html_url || '');
            core.setOutput('release_title', releaseTitle);
            core.setOutput('release_url', releaseUrl);
            core.setOutput('resolution_summary', resolutionParts.join('\n'));

      - name: Notify submitter via Supabase
        id: notify
        env:
          FEATURE_REQUEST_ID: ${{ steps.meta.outputs.feature_request_id }}
          APP_FEEDBACK_ID: ${{ steps.meta.outputs.app_feedback_id }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.meta.outputs.issue_title }}
          ISSUE_URL: ${{ steps.meta.outputs.issue_url }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
          RELEASE_URL: ${{ steps.meta.outputs.release_url }}
          RESOLUTION_SUMMARY: ${{ steps.meta.outputs.resolution_summary }}
        run: |
          PAYLOAD=$(jq -cn \
            --arg id "$FEATURE_REQUEST_ID" \
            --arg app_feedback_id "$APP_FEEDBACK_ID" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg issue_title "$ISSUE_TITLE" \
            --arg issue_url "$ISSUE_URL" \
            --arg release_title "$RELEASE_TITLE" \
            --arg release_url "$RELEASE_URL" \
            --arg resolution_summary "$RESOLUTION_SUMMARY" \
            '{
              action: "notify.feature_request",
              id: ($id | if . == "" then null else . end),
              appFeedbackId: ($app_feedback_id | if . == "" then null else (tonumber) end),
              issueNumber: $issue_number,
              issueTitle: $issue_title,
              issueUrl: $issue_url,
              releaseTitle: $release_title,
              releaseUrl: $release_url,
              resolutionSummary: $resolution_summary,
              status: "done",
              markAsResolved: true
            }')

          HTTP_CODE=$(curl -s -o /tmp/notify_result.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/core-hub" \
            --max-time 20 || echo "000")

          echo "code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          cat /tmp/notify_result.json 2>/dev/null || true

      - name: Record issue fix history
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          RESOLUTION_SUMMARY: ${{ steps.meta.outputs.resolution_summary }}
        run: |
          # 旧 issue-auto-resolver EF は admin-hub へ統合済み (単体では 404)。
          # status は action 名が含意し files_changed は常に空だったため、
          # issue.resolve が受ける issue_id / resolution へ写して呼ぶ。
          PAYLOAD=$(jq -cn \
            --argjson issue_id "$ISSUE_NUMBER" \
            --arg resolution "$RESOLUTION_SUMMARY" \
            '{
              action: "issue.resolve",
              issue_id: $issue_id,
              resolution: $resolution
            }')

          curl -s -o /tmp/issue_fix_result.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/admin-hub" \
            --max-time 20 >/tmp/issue_fix_http_code.txt || true

      - name: Job Summary
        if: always()
        env:
          CODE: ${{ steps.notify.outputs.code }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.meta.outputs.issue_title }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
        run: |
          if [ "$CODE" = "200" ]; then
            ICON="OK"
          else
            ICON="WARN"
          fi

          {
            echo "## User Feedback Resolved $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Issue | #${ISSUE_NUMBER} |"
            echo "| Title | ${ISSUE_TITLE} |"
            echo "| Release | ${RELEASE_TITLE:-N/A} |"
            echo "| Notify EF | ${ICON} HTTP ${CODE:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"
