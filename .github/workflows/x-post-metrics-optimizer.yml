name: X Post Metrics Optimizer

on:
  schedule:
    - cron: "17 */6 * * *"  # 2026-07-06 ci-audit: 3h→6h, 8→4runs/日削減, ~240 ubuntu-min/月削減
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of recent X post logs to collect"
        required: false
        default: "100"

concurrency:
  group: x-post-metrics-optimizer
  cancel-in-progress: true  # 2026-07-03 ci-audit: 3h cron × 8x/日のキュー積み防止

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secrets
        shell: bash
        run: |
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || {
            echo "SUPABASE_SERVICE_ROLE_KEY is required."
            exit 1
          }
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Collect X post metrics
        shell: bash
        run: |
          limit="${INPUT_LIMIT:-100}"
          response=$(curl --fail-with-body --show-error --silent \
            --request POST \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"action\":\"x.metrics_collect\",\"limit\":${limit}}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/growth-hub")
          echo "${response}"
          # X API クレジット枯渇時は edge が HTTP 200 + skipped:true を返す
          # (次の請求サイクルまで自然復旧しないため cron を赤く落とさない)。
          # operator への信号は warning annotation で残す。
          if echo "${response}" | grep -q '"code":"x_billing_blocked"'; then
            echo "::warning::X API billing blocked — metrics collection skipped. console.x.com でクレジット追加/上限引き上げが必要です。"
          fi
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
