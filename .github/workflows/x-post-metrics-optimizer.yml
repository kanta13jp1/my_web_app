name: X Post Metrics Optimizer

on:
  schedule:
    # fresh tier: 直近投稿の初速シグナル用 (limit=25 / 3h毎)。
    - cron: "17 */3 * * *"
    # daily backfill: 未計測レスキュー+窓内全量 (limit=100 / 04:17 JST)。
    # */3 グリッド外の 19 時 UTC を選び、fresh 便との衝突と
    # cancel-in-progress レースを回避する。
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of recent X post logs to collect"
        required: false
        default: "100"

concurrency:
  group: x-post-metrics-optimizer
  cancel-in-progress: true  # 2026-07-03 ci-audit: 3h cron × 8x/日のキュー積み防止

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secrets
        shell: bash
        run: |
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || {
            echo "SUPABASE_SERVICE_ROLE_KEY is required."
            exit 1
          }
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Collect X post metrics
        shell: bash
        run: |
          # 手動 dispatch は入力値、daily backfill 便(19:17 UTC)は 100、
          # fresh 便(3h毎)は 25 に絞って X API 読取を節約する。
          # 25 の根拠: x_post_log には dry_run/rejected_duplicate 等の
          # tweet-id なし行が混在するため(APIコストはゼロ)、実投稿が
          # 押し出されない余裕を持たせる。edge 側の 7 日鮮度窓と併用。
          if [ -n "${INPUT_LIMIT}" ]; then
            limit="${INPUT_LIMIT}"
          elif [ "${EVENT_SCHEDULE}" = "17 19 * * *" ]; then
            limit=100
          else
            limit=25
          fi
          response=$(curl --fail-with-body --show-error --silent \
            --request POST \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"action\":\"x.metrics_collect\",\"limit\":${limit}}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/growth-hub")
          echo "${response}"
          # X API クレジット枯渇時は edge が HTTP 200 + skipped:true を返す
          # (次の請求サイクルまで自然復旧しないため cron を赤く落とさない)。
          # operator への信号は warning annotation で残す。
          if echo "${response}" | grep -q '"code":"x_billing_blocked"'; then
            echo "::warning::X API billing blocked — metrics collection skipped. console.x.com でクレジット追加/上限引き上げが必要です。"
          fi
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
