name: Session State Hooks

on:
  pull_request:
    paths:
      - ".claude/hooks/pre-compact-backup.ps1"
      - ".claude/hooks/pretooluse-compression-budget.ps1"
      - ".claude/hooks/session-end-auto-compress.ps1"
      - ".claude/hooks/session-start-hard-gate.ps1"
      - ".claude/hooks/session-start-state-check.ps1"
      - ".claude/hooks/smartcleanup-monthlydeep-guard.ps1"
      - ".claude/hooks/statusline.ps1"
      - ".claude/hooks/userprompt-idle-gap-fire.ps1"
      - ".claude/hooks/userprompt-kpi-banner.ps1"
      - ".claude/settings.json"
      - ".github/workflows/session-state-hooks.yml"
      - ".github/workflows/claude-session-hygiene-cron.yml"
      - "docs/CLAUDE_CODE_SETUP_RUNBOOK.md"
      - "memory/transcripts/**"
      - "scripts/check_session_state_hooks.py"
      - "scripts/codex_session_check.py"
      - "scripts/install_claude_hygiene_tasks.ps1"
      - "scripts/install_claude_hygiene_tasks_test.py"
      - "scripts/session_compression_guard.py"
      - "scripts/session_compression_guard_test.py"
      - "scripts/session_hygiene_check.py"
      - "scripts/session_hygiene_check_test.py"
      - "scripts/smartcleanup_task_guard.py"
      - "scripts/smartcleanup_task_guard_test.py"
  workflow_dispatch:

concurrency:
  group: session-state-hooks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    name: Validate hooks and transcript secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repo-managed session hooks
        run: python scripts/check_session_state_hooks.py --scan-transcripts

      - name: Session compression guard unit tests
        run: python scripts/session_compression_guard_test.py

      - name: Session hygiene check unit tests
        run: python scripts/session_hygiene_check_test.py

      - name: SmartCleanup task guard unit tests
        run: python scripts/smartcleanup_task_guard_test.py

      - name: Claude hygiene task installer static tests
        run: python scripts/install_claude_hygiene_tasks_test.py

      - name: Codex session check JSON smoke
        run: python scripts/codex_session_check.py --json > /tmp/codex-session-check.json
