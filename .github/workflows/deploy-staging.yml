name: Deploy to Staging

on:
  push:
    # stagingブランチへのプッシュで実行
    branches:
      - staging
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '*.md'
      - '**/*.md'
      - '.github/*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  # Win版#109: 5 インスタンス並行 push の cancel 連鎖回避のため false に。
  # 同 group で順次実行・全 commit が必ず deploy される。
  cancel-in-progress: false

# 🚨 修正: ワークフロー全体に必要な権限をトップレベルで設定
permissions:
  contents: read # 全体で必要 (子ワークフローを含む)
  pull-requests: write # 🚨 追加：CIの子ジョブの権限要求を全体で許可するため

env:
  ENVIRONMENT: staging
  FLUTTER_VERSION: '3.38.x'

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    
    # 🚨 修正: 子ワークフローの権限要求を明示的に付与
    permissions:
      contents: read
      pull-requests: write 

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    environment:
      name: staging
      # 修正: environment.url は固定URLで問題ありません
      url: https://my-web-app-b67f4--staging.web.app
    
    outputs:
      deploy_suffix: ${{ steps.firebase_cli_deploy.outputs.suffix }}

    permissions:
      contents: read # コードチェックアウトのために必要

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Supabase Migration (Staging)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Run Supabase migrations
        run: |
          echo "Running Supabase migrations for staging..."
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
          # Repair any already-applied migrations to avoid duplicate key errors
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" | grep -oP '^\d+')
            supabase migration repair --status applied "$version" 2>/dev/null || true
          done
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
        continue-on-error: true

      # Build Flutter Web
      - name: Build Flutter Web (Staging)
        run: >
          flutter build web --release --pwa-strategy=none
          --dart-define=ENVIRONMENT=staging
          --dart-define=ASSET_LIABILITY_SUPABASE_SYNC_ENABLED=true
          --dart-define=ASSET_LIABILITY_SUPABASE_PRODUCTION_WRITES_ENABLED=true
          --dart-define=ASSET_MANAGEMENT_AI_SUMMARY_ENABLED=true
          --dart-define=ASSET_MANAGEMENT_AI_PROVIDER_ROUTING_ENABLED=true
        env:
          # 修正: シークレット名を _STAGING に変更
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      - name: Setup Node for Firebase CLI
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      # Deploy to Firebase Hosting (CLI) - サフィックスを抽出するロジックに統一
      - name: Deploy to Firebase Hosting (CLI)
        id: firebase_cli_deploy
        run: |
          npm install -g firebase-tools
          # 修正: FIREBASE_SERVICE_ACCOUNT_STAGING に変更
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa_key.json"

          echo "Deploying to 'staging' channel..."
          # 🚨 修正: secrets.FIREBASE_PROJECT_ID に変更
          firebase hosting:channel:deploy staging --project ${{ secrets.FIREBASE_PROJECT_ID }} --expires 30d --json > deploy_output.json 2> /dev/null
          
          # JSONからURLを抽出
          SITE_URL=$(jq -r '.result | to_entries[] | .value.url' deploy_output.json | head -n 1)
          
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            echo "--- URL extraction failed. Fatal error. ---"
            exit 1
          fi

          echo "✅ Extracted URL: $SITE_URL"
          
          # URLからランダムなサフィックス部分を抽出
          # URL形式: https://{PROJECT_ID}--staging-{SUFFIX}.web.app
          SUFFIX=$(echo "$SITE_URL" | sed -E 's/.*-([a-zA-Z0-9]+)\.web\.app/\1/')
          
          if [ "$SUFFIX" == "$SITE_URL" ] || [ -z "$SUFFIX" ]; then
              echo "::warning::Suffix extraction failed. Using 'unknown' as fallback."
              SUFFIX="unknown"
          fi
          
          echo "Final SUFFIX: $SUFFIX"
          
          # GitHub Actionsの出力変数にセット
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          
          rm sa_key.json deploy_output.json
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Job Summary
        if: always()
        run: |
          BUILD_OK=$([ -d "build/web" ] && echo "✅" || echo "❌")
          {
            echo "## Deploy to Staging — \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| 項目 | 状態 |"
            echo "|-----|------|"
            echo "| Flutter build web | $BUILD_OK |"
            echo "| Firebase channel | staging |"
            echo "| URL | https://my-web-app-b67f4--staging.web.app |"
            echo ""
            echo "**Actor**: ${{ github.actor }} | **Branch**: \`${{ github.ref_name }}\`"
          } >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    permissions:
      contents: read

    steps:
      - name: Prepare URL
        id: prepare_url
        if: needs.deploy.result == 'success'
        run: |
          # 🚨 修正: secrets.FIREBASE_PROJECT_ID に変更
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          DEPLOY_SUFFIX="${{ needs.deploy.outputs.deploy_suffix }}"
          
          # 完全なURLを再構築: https://{project-id}--staging-{suffix}.web.app
          RECONSTRUCTED_URL="https://$PROJECT_ID--staging-$DEPLOY_SUFFIX.web.app"
          
          # 最終環境変数にセット
          echo "DECODED_URL=$RECONSTRUCTED_URL" >> $GITHUB_ENV
          echo "Reconstructed URL is set for notification."

      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Successful* ✅\n\n*Environment:* Staging\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*URL:* ${{ env.DECODED_URL }}\n\n⚠️ Please conduct thorough testing before promoting to production."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          payload: |
            {
              "text": "❌ Staging deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Failed* ❌\n\n*Environment:* Staging\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n\nPlease check the workflow logs for details."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on commit
        if: needs.deploy.result == 'success'
        continue-on-error: true  # contents: read では失敗する場合があるため
        uses: actions/github-script@v9
        with:
          script: |
            const deployUrl = process.env.DECODED_URL;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 Successfully deployed to **Staging** environment!\n\n📍 URL: ${deployUrl}\n\n⚠️ Please conduct thorough testing before promoting to production.`
            })
