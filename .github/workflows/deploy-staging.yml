name: Deploy to Staging

on:
  push:
    # stagingブランチへのプッシュで実行
    branches:
      - staging
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '*.md'
      - '**/*.md'
      - '.github/*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'assets/data/tiger_*'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  # Win版#109: 5 インスタンス並行 push の cancel 連鎖回避のため false に。
  # 同 group で順次実行・全 commit が必ず deploy される。
  cancel-in-progress: false

# 🚨 修正: ワークフロー全体に必要な権限をトップレベルで設定
permissions: {}

env:
  ENVIRONMENT: staging
  FLUTTER_VERSION: '3.38.x'

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    
    # 🚨 修正: 子ワークフローの権限要求を明示的に付与
    permissions:
      contents: read
      pull-requests: write 

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    environment:
      name: staging
      # 修正: environment.url は固定URLで問題ありません
      url: https://my-web-app-b67f4--staging.web.app
    
    outputs:
      deploy_suffix: ${{ steps.firebase_cli_deploy.outputs.suffix }}

    permissions:
      contents: read # コードチェックアウトのために必要

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # Supabase Migration (Staging)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.84.2

      - name: Verify staging Supabase isolation
        run: |
          if [ -z "$STAGING_PROJECT_ID" ] || [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$PRODUCTION_PROJECT_ID" ] || [ -z "$PRODUCTION_SUPABASE_URL" ]; then
            echo "Staging and production Supabase isolation inputs are required."
            exit 1
          fi
          if [ "$STAGING_PROJECT_ID" = "$PRODUCTION_PROJECT_ID" ] || [ "$STAGING_SUPABASE_URL" = "$PRODUCTION_SUPABASE_URL" ]; then
            echo "Staging Supabase must be isolated from production."
            exit 1
          fi
        env:
          STAGING_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
          STAGING_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}

      - name: Run Supabase migrations
        run: |
          echo "Running Supabase migrations for staging..."
          STAGING_WORKDIR="$RUNNER_TEMP/musubi-staging"
          mkdir -p "$STAGING_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$STAGING_WORKDIR/supabase/config.toml"
          cp supabase/staging/20260810080000_musubi_staging_prerequisites.sql \
            "$STAGING_WORKDIR/supabase/migrations/"
          cp supabase/migrations/*musubi*.sql \
            "$STAGING_WORKDIR/supabase/migrations/"

          supabase link \
            --workdir "$STAGING_WORKDIR" \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID_STAGING }}"
          supabase db push --workdir "$STAGING_WORKDIR" --include-all
          supabase db lint \
            --workdir "$STAGING_WORKDIR" \
            --linked \
            --schema public \
            --level warning \
            --fail-on warning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
        continue-on-error: false

      # Build Flutter Web
      - name: Validate Flutter Supabase configuration
        run: python scripts/validate_flutter_supabase_env.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_STAGING || secrets.SUPABASE_ANON_KEY_STAGING }}

      - name: Build Flutter Web (Staging)
        run: >
          flutter build web --release --pwa-strategy=none
          --dart-define=ENVIRONMENT=staging
          --dart-define="SUPABASE_URL=$SUPABASE_URL"
          --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
          --dart-define="SUPABASE_PRODUCTION_PROJECT_REF=$SUPABASE_PRODUCTION_PROJECT_REF"
          --dart-define=ASSET_LIABILITY_SUPABASE_SYNC_ENABLED=true
          --dart-define=ASSET_LIABILITY_SUPABASE_PRODUCTION_WRITES_ENABLED=true
          --dart-define=ASSET_MANAGEMENT_AI_SUMMARY_ENABLED=true
          --dart-define=ASSET_MANAGEMENT_AI_PROVIDER_ROUTING_ENABLED=true
        env:
          # 修正: シークレット名を _STAGING に変更
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_STAGING || secrets.SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}

      - name: Render public Supabase URL into web shell
        run: python scripts/render_web_supabase_config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      - name: Setup Node for Firebase CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      # Deploy to Firebase Hosting (CLI) - サフィックスを抽出するロジックに統一
      - name: Deploy to Firebase Hosting (CLI)
        id: firebase_cli_deploy
        run: |
          npm install -g firebase-tools
          # 修正: FIREBASE_SERVICE_ACCOUNT_STAGING に変更
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa_key.json"

          echo "Deploying to 'staging' channel..."
          # 🚨 修正: secrets.FIREBASE_PROJECT_ID に変更
          firebase hosting:channel:deploy staging --project ${{ secrets.FIREBASE_PROJECT_ID }} --expires 30d --json > deploy_output.json 2> /dev/null
          
          # JSONからURLを抽出
          SITE_URL=$(jq -r '.result | to_entries[] | .value.url' deploy_output.json | head -n 1)
          
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            echo "--- URL extraction failed. Fatal error. ---"
            exit 1
          fi

          echo "✅ Extracted URL: $SITE_URL"
          
          # URLからランダムなサフィックス部分を抽出
          # URL形式: https://{PROJECT_ID}--staging-{SUFFIX}.web.app
          SUFFIX=$(echo "$SITE_URL" | sed -E 's/.*-([a-zA-Z0-9]+)\.web\.app/\1/')
          
          if [ "$SUFFIX" == "$SITE_URL" ] || [ -z "$SUFFIX" ]; then
              echo "::warning::Suffix extraction failed. Using 'unknown' as fallback."
              SUFFIX="unknown"
          fi
          
          echo "Final SUFFIX: $SUFFIX"
          
          # GitHub Actionsの出力変数にセット
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          
          rm sa_key.json deploy_output.json
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Job Summary
        if: always()
        run: |
          BUILD_OK=$([ -d "build/web" ] && echo "✅" || echo "❌")
          {
            echo "## Deploy to Staging — \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| 項目 | 状態 |"
            echo "|-----|------|"
            echo "| Flutter build web | $BUILD_OK |"
            echo "| Firebase channel | staging |"
            echo "| URL | https://my-web-app-b67f4--staging.web.app |"
            echo ""
            echo "**Actor**: $GITHUB_ACTOR | **Branch**: \`$GITHUB_REF_NAME\`"
          } >> $GITHUB_STEP_SUMMARY

  notify:
    timeout-minutes: 5
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    permissions:
      contents: read

    steps:
      - name: Prepare URL
        id: prepare_url
        if: needs.deploy.result == 'success'
        run: |
          # 🚨 修正: secrets.FIREBASE_PROJECT_ID に変更
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          DEPLOY_SUFFIX="${{ needs.deploy.outputs.deploy_suffix }}"
          
          # 完全なURLを再構築: https://{project-id}--staging-{suffix}.web.app
          RECONSTRUCTED_URL="https://$PROJECT_ID--staging-$DEPLOY_SUFFIX.web.app"
          
          # 最終環境変数にセット
          echo "DECODED_URL=$RECONSTRUCTED_URL" >> $GITHUB_ENV
          echo "Reconstructed URL is set for notification."

      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Staging deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Successful* ✅\n\n*Environment:* Staging\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*URL:* ${{ env.DECODED_URL }}\n\n⚠️ Please conduct thorough testing before promoting to production."
                  }
                }
              ]
            }
      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Staging deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Failed* ❌\n\n*Environment:* Staging\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n\nPlease check the workflow logs for details."
                  }
                }
              ]
            }
      - name: Comment on commit
        if: needs.deploy.result == 'success'
        continue-on-error: true  # contents: read では失敗する場合があるため
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deployUrl = process.env.DECODED_URL;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 Successfully deployed to **Staging** environment!\n\n📍 URL: ${deployUrl}\n\n⚠️ Please conduct thorough testing before promoting to production.`
            })
