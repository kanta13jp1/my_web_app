name: Deploy to Staging

on:
  push:
    # 修正: mainブランチではなく、stagingブランチへのプッシュで実行
    branches:
      - staging
  workflow_dispatch:

env:
  ENVIRONMENT: staging
  FLUTTER_VERSION: '3.27.x'

jobs:
  ci:
    name: Run CI Checks
    # 外部ワークフローを呼び出す際、通常はsecretsを渡さない限りpermissionsは不要だが、
    # ci.yml内で認証が必要な場合は設定が必要。ここでは標準的なreadパーミッションを設定する。
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read # CIがコードを読み込むために必要

  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: staging
      # 修正: environment.urlも動的URLを反映させるため、outputsを参照
      url: https://${{ secrets.FIREBASE_PROJECT_ID_STG }}--staging-${{ needs.deploy.outputs.deploy_suffix }}.web.app
    
    outputs:
      # 修正: ランダムなサフィックス部分のみを出力
      deploy_suffix: ${{ steps.firebase_cli_deploy.outputs.suffix }}

    permissions:
      contents: read # コードチェックアウトのために必要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Supabase Migration (Staging)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        run: |
          echo "Running Supabase migrations for staging..."
          # 🚨 secrets.SUPABASE_PROJECT_ID_STG を使用（命名規則をsecrets.ymlに合わせて確認してください）
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_STG }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STG }}
        continue-on-error: true

      # Build Flutter Web
      - name: Build Flutter Web (Staging)
        run: flutter build web --release --dart-define=ENVIRONMENT=staging
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STG }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STG }}

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      # Deploy to Firebase Hosting (CLI) - サフィックスを抽出するロジックに統一
      - name: Deploy to Firebase Hosting (CLI)
        id: firebase_cli_deploy
        run: |
          npm install -g firebase-tools
          # Service AccountはStaging環境で使うFirebase Project IDに紐づくものを設定
          # 🚨 secrets.FIREBASE_SERVICE_ACCOUNT_STG を使用
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STG }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa_key.json"

          echo "Deploying to 'staging' channel..."
          # 🚨 Project IDをStaging用に変更
          firebase hosting:channel:deploy staging --project ${{ secrets.FIREBASE_PROJECT_ID_STG }} --expires 30d --json > deploy_output.json 2> /dev/null
          
          # JSONからURLを抽出
          SITE_URL=$(jq -r '.result | to_entries[] | .value.url' deploy_output.json | head -n 1)
          
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            echo "--- URL extraction failed. Fatal error. ---"
            exit 1
          fi

          echo "✅ Extracted URL: $SITE_URL"
          
          # URLからランダムなサフィックス部分を抽出
          # URL形式: https://{PROJECT_ID}--staging-{SUFFIX}.web.app
          SUFFIX=$(echo "$SITE_URL" | sed -E 's/.*-([a-zA-Z0-9]+)\.web\.app/\1/')
          
          if [ "$SUFFIX" == "$SITE_URL" ] || [ -z "$SUFFIX" ]; then
              echo "::warning::Suffix extraction failed. Using 'unknown' as fallback."
              SUFFIX="unknown"
          fi
          
          echo "Final SUFFIX: $SUFFIX"
          
          # GitHub Actionsの出力変数にセット
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          
          rm sa_key.json deploy_output.json
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    permissions:
      contents: write # コミットコメントのために必要

    steps:
      - name: Prepare URL
        id: prepare_url
        if: needs.deploy.result == 'success'
        run: |
          # 🚨 Staging用のPROJECT_IDシークレットを使用
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID_STG }}"
          DEPLOY_SUFFIX="${{ needs.deploy.outputs.deploy_suffix }}"
          
          # 完全なURLを再構築: https://{project-id}--staging-{suffix}.web.app
          RECONSTRUCTED_URL="https://$PROJECT_ID--staging-$DEPLOY_SUFFIX.web.app"
          
          # 最終環境変数にセット
          echo "DECODED_URL=$RECONSTRUCTED_URL" >> $GITHUB_ENV
          echo "Reconstructed URL is set for notification."

      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Successful* ✅\n\n*Environment:* Staging\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*URL:* ${{ env.DECODED_URL }}\n\n⚠️ Please conduct thorough testing before promoting to production."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Failed* ❌\n\n*Environment:* Staging\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n\nPlease check the workflow logs for details."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on commit
        if: needs.deploy.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = process.env.DECODED_URL;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 Successfully deployed to **Staging** environment!\n\n📍 URL: ${deployUrl}\n\n⚠️ Please conduct thorough testing before promoting to production.`
            })
              