name: Workflow Failure Handler

on:
  workflow_run:
    workflows:
      # NOTE: workflow_run は workflow `name:` の完全一致が必要。
      # 名前を変更したらここも更新すること。
      - "CI"
      - "Deploy to Production"
      - "Deploy to Staging"
      - "Deploy to Development"
      - "Edge Function UI Audit (UI導線チェック)"
      - "CS Check (自動サポート対応)"
      - "Daily Report (日次レポート + X投稿 + 競合モニタリング)"
      - "Scheduled Analysis Batch"
      - "Dependency Audit (依存パッケージ脆弱性チェック)"
      - "Infra Health Check (インフラ監視)"
      - "YouTube Analysis (Real Value競合分析)"
      - "Horse Racing Auto Update"
      # 追加: スケジュール系ワークフロー
      - "AI Agent PR Review"
      - "AI大学コンテンツ更新 (2時間毎)"
      - "AI大学 学習リマインダー (毎日09:00 JST)"
      - "Blog Draft (AI自動生成・毎日)"
      - "Blog Publish (技術記事投稿)"
      - "Blog Engagement (毎日・コメント返信/フォロー/重複削除)"
      - "Blog Verify (過去記事の事実確認)"
      - "CI Auto-Fix (CI失敗自動修復)"
      - "Competitor Discovery (週次自動候補発掘)"
      - "Competitor Monitoring (競合インテリジェンスレポート)"
      - "NotebookLM Video Pipeline"
      - "Notion Mirror Sync (hourly)"
      - "OGP Image Refresh (週次)"
      - "Self Devin Schedule"
      - "User Feedback Resolved"
      - "WBS Staleness Audit"
      - "WBS User Tasks Notify (毎朝 + manual)"
      - "Weekly SNS Draft (毎週月曜)"
    types: [completed]

concurrency:
  group: workflow-failure-handler-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    name: Create Failure Issue
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check for duplicate issue
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'workflow-failure',
              state: 'open',
              per_page: 50,
            });
            const exists = issues.some(i => i.body && i.body.includes(`run_id: ${runId}`));
            core.setOutput('exists', exists ? 'true' : 'false');
            if (exists) core.info('Duplicate — skipping issue creation.');

      - name: Create GitHub Issue
        id: create
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const jst = new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });

            const body = [
              `## ワークフロー失敗: ${run.name}`,
              '',
              '| 項目 | 値 |',
              '| --- | --- |',
              `| ワークフロー | \`${run.name}\` |`,
              `| 実行 ID | \`${run.id}\` |`,
              `| ブランチ | \`${run.head_branch}\` |`,
              `| コミット | \`${run.head_sha.substring(0, 7)}\` |`,
              `| 失敗日時 (JST) | ${jst} |`,
              `| ログ | [GitHub Actions ログを確認](${run.html_url}) |`,
              '',
              '## 自動対応チェックリスト',
              '',
              '- [ ] ログURLでエラー内容を特定',
              '- [ ] 修正コードをプッシュ (flutter analyze / deno lint 0エラー確認)',
              '- [ ] このIssueをクローズ',
              '',
              '> このIssueは `workflow-failure-handler.yml` により自動生成されました。',
              '> `cs-check` スケジュールタスクが自動修復を試みます。',
              '',
              `<!-- run_id: ${run.id} -->`,
              `<!-- workflow_name: ${run.name} -->`,
              `<!-- head_branch: ${run.head_branch} -->`,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI失敗] ${run.name} (${run.head_branch})`,
              body,
              labels: ['workflow-failure', 'bug'],
            });

            core.setOutput('issue_number', String(issue.number));
            core.setOutput('issue_url', issue.html_url);
            core.info(`Created issue #${issue.number}`);

      - name: Notify Slack on Failure
        if: steps.check.outputs.exists == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
          ISSUE_URL: ${{ steps.create.outputs.issue_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⚠️ SLACK_WEBHOOK_URL が未設定のためスキップ"
            exit 0
          fi

          JST=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')
          SHORT_SHA="${HEAD_SHA:0:7}"

          # Issue リンクブロックの有無
          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_BLOCK="{\"type\":\"button\",\"text\":{\"type\":\"plain_text\",\"text\":\"Issue #${ISSUE_NUMBER}\"},\"url\":\"${ISSUE_URL}\",\"style\":\"danger\"}"
          else
            ISSUE_BLOCK="{\"type\":\"button\",\"text\":{\"type\":\"plain_text\",\"text\":\"Workflow Logs\"},\"url\":\"${WORKFLOW_URL}\",\"style\":\"danger\"}"
          fi

          cat <<PAYLOAD > /tmp/slack_payload.json
          {
            "text": "❌ スケジュールタスク失敗: ${WORKFLOW_NAME}",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "❌ スケジュールタスク失敗" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*ワークフロー:*\n\`${WORKFLOW_NAME}\`" },
                  { "type": "mrkdwn", "text": "*ブランチ:*\n\`${HEAD_BRANCH}\`" },
                  { "type": "mrkdwn", "text": "*コミット:*\n\`${SHORT_SHA}\`" },
                  { "type": "mrkdwn", "text": "*失敗日時:*\n${JST}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "Workflow Logs" },
                    "url": "${WORKFLOW_URL}"
                  },
                  ${ISSUE_BLOCK}
                ]
              }
            ]
          }
          PAYLOAD

          curl -s -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack_payload.json \
            "$SLACK_WEBHOOK_URL" \
            --max-time 10 || true
          echo "✅ Slack通知送信"

      - name: Job Summary
        if: always()
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
          ISSUE_URL: ${{ steps.create.outputs.issue_url }}
          ALREADY_EXISTS: ${{ steps.check.outputs.exists }}
        run: |
          {
            echo "## Workflow Failure Handler $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 対象ワークフロー | \`${WORKFLOW_NAME}\` |"
            echo "| 結論 | \`${CONCLUSION}\` |"
            if [ "${ALREADY_EXISTS}" = "true" ]; then
              echo "| Issue | スキップ (同一 run_id のIssue既存) |"
            elif [ -n "${ISSUE_NUMBER}" ]; then
              echo "| Issue | [#${ISSUE_NUMBER}](${ISSUE_URL}) 作成 |"
            else
              echo "| Issue | 作成対象なし |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
