name: Payroll deductions checks
on:
  pull_request:
    paths:
      - lib/services/asset_payroll_deductions*.dart
      - lib/widgets/asset_payroll_deductions*.dart
      - test/services/asset_payroll_deductions_test.dart
      - test/widgets/asset_payroll_deductions*.dart
      - integration_test/payroll_deductions_test.dart
      - .github/workflows/payroll-deductions-checks.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: payroll-deductions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  payroll-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify payroll projections and signed-out regression
        run: flutter test test/services/asset_payroll_deductions_test.dart test/widgets/asset_payroll_deductions_card_test.dart test/widgets/asset_payroll_deductions_section_test.dart --reporter expanded
      - name: Capture synthetic payroll flows on desktop and narrow mobile
        shell: bash
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/payroll-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4444/status
          set -o pipefail
          for viewport in desktop mobile; do
            dimensions=1440x1000@1
            mobile=false
            if [ "$viewport" = mobile ]; then dimensions=320x900@1; mobile=true; fi
            flutter drive --driver=test_driver/asset_triage_visual.dart \
              --target=integration_test/payroll_deductions_test.dart \
              --dart-define="PAYROLL_MOBILE=$mobile" \
              --browser-dimension="$dimensions" \
              -d web-server --browser-name=chrome --headless \
              2>&1 | tee ".ci-logs/payroll-$viewport.log"
          done
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: payroll-deductions-${{ github.run_id }}
          path: |
            .ci-logs/payroll-*.log
            .ci-logs/asset-triage-visual/payroll-*
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
