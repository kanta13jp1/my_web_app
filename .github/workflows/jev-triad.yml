name: Jev triad assisted experiment
on:
  pull_request:
    paths:
      - 'scripts/jev_triad/**'
      - '.github/workflows/jev-triad.yml'
  workflow_dispatch:
    inputs:
      api_lane:
        description: API lanes to run (cloud Jev requires temporary secret)
        type: choice
        options: [both, localjev]
        default: both
      live_only:
        description: Skip step-locked API trials; run wall-clock trials only
        type: boolean
        default: false
permissions: {}
concurrency:
  group: jev-triad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: [cloud_jev, localjev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Materialize frozen simulation
        run: |
          mkdir -p out/lightgbm/frozen
          git show d224c892c1f16895f24978358717717f96bad657:web/labs/jev-mario/world11.mjs > out/lightgbm/frozen/world11.mjs
          git show d224c892c1f16895f24978358717717f96bad657:web/labs/jev-mario/reaction.mjs > out/lightgbm/frozen/reaction.mjs
      - name: Start actual LocalJev and CPU backend
        if: matrix.lane == 'localjev'
        run: bash scripts/jev_triad/local-setup.sh
      - name: Evaluate actual API decisions
        env:
          LANE: ${{ matrix.lane }}
          JEV_MARIO_EXPERIMENT_KEY: ${{ matrix.lane == 'cloud_jev' && secrets.JEV_MARIO_EXPERIMENT_KEY || '' }}
        if: (matrix.lane != 'cloud_jev' || inputs.api_lane == 'both') && !inputs.live_only
        run: node scripts/jev_triad/api-run.mjs
      - name: Evaluate wall-clock API control
        if: matrix.lane != 'cloud_jev' || inputs.api_lane == 'both'
        env:
          LANE: ${{ matrix.lane }}
          JEV_MARIO_EXPERIMENT_KEY: ${{ matrix.lane == 'cloud_jev' && secrets.JEV_MARIO_EXPERIMENT_KEY || '' }}
        run: node scripts/jev_triad/live.mjs
      - name: Preserve backend provenance
        if: always() && matrix.lane == 'localjev'
        run: |
          mkdir -p out/triad
          cp /tmp/jev-backend/model.sha256 out/triad/ || true
          cp /tmp/jev-backend/localjev.log out/triad/ || true
          cp /tmp/jev-backend/llama.log out/triad/ || true
      - name: Preserve results
        if: always() && (matrix.lane != 'cloud_jev' || inputs.api_lane == 'both')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triad-${{ matrix.lane }}-${{ github.run_id }}
          path: out/triad/
          retention-days: 14
          if-no-files-found: error
  assisted:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        lane: [planner, lightgbm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Materialize frozen simulation
        run: |
          mkdir -p out/lightgbm/frozen
          git show d224c892c1f16895f24978358717717f96bad657:web/labs/jev-mario/world11.mjs > out/lightgbm/frozen/world11.mjs
          git show d224c892c1f16895f24978358717717f96bad657:web/labs/jev-mario/reaction.mjs > out/lightgbm/frozen/reaction.mjs
      - name: Reproduce Jev-only student
        if: matrix.lane == 'lightgbm'
        run: |
          node scripts/jev_distillation/collect.mjs
          python -m pip install lightgbm==4.6.0 numpy==2.2.6 scipy==1.15.3
          python scripts/jev_distillation/train.py
      - name: Evaluate closed loop with disclosed search assistance
        env:
          LANE: ${{ matrix.lane }}
        run: |
          node --test scripts/jev_triad/planner.test.mjs
          node scripts/jev_triad/run.mjs
          node scripts/jev_triad/replay.mjs
          node scripts/jev_triad/live.mjs
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triad-${{ matrix.lane }}-${{ github.run_id }}
          path: out/triad/
          retention-days: 14
          if-no-files-found: error
