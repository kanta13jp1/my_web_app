name: Hotfix Stripe Return URL Typo (#3644)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-stripe-url.yml'

jobs:
  hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check and fix Stripe return URL typo
        run: |
          FILE=supabase/functions/schedule-hub/index.ts
          if grep -q 'my-web-app-b6f7f4' "$FILE"; then
            sed -i 's/my-web-app-b6f7f4/my-web-app-b67f4/g' "$FILE"
            echo "FIX APPLIED:"
            grep -n 'b67f4' "$FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b hotfix/stripe-url-b67f4
            git add "$FILE"
            git commit -m "fix: Stripe 返却URL タイポ b6f7f4→b67f4 (schedule-hub/index.ts) [#3644]"
            git push origin hotfix/stripe-url-b67f4
            gh pr create \
              --title "fix: Stripe 返却URL タイポ b6f7f4→b67f4 [#3644]" \
              --body "## P0バグ修正\n\nschedule-hub/index.ts の billingReturnUrl() 関数で URL タイポ (b6f7f4 → b67f4) を修正。\nPUBLIC_SITE_URL 未設定時に Stripe 決済後 404 へリダイレクトされる問題を解消。\n\n- 修正行: line 258\n- Closes #3644" \
              --base main \
              --head hotfix/stripe-url-b67f4
          else
            echo "NO FIX NEEDED - URL already correct"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
