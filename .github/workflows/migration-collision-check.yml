name: Migration Timestamp Collision Check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_migration_timestamps.py'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions: {}

concurrency:
  group: migration-collision-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    permissions:
      contents: read
    name: Check migration timestamp collisions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Detect timestamp collisions
        run: python3 scripts/check_migration_timestamps.py
