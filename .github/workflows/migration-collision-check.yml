name: Migration Timestamp Collision Check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_migration_timestamps.py'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: migration-collision-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check migration timestamp collisions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Detect timestamp collisions
        run: python3 scripts/check_migration_timestamps.py
