name: Blog Verify (過去記事の事実確認)

# 過去のQiita/dev.to投稿に事実誤認・古い情報がないかAIでチェック
# 検出した訂正案は docs/blog-corrections/ + blog_corrections テーブルに保存
# 自動では訂正しない (admin手動承認後のみ反映)

on:
  schedule:
    # 毎週月曜 03:00 UTC = 12:00 JST (週1回・コスト抑制)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      max_articles:
        description: '各プラットフォームでチェックする記事数 (default 5)'
        required: false
        default: '5'
      dry_run:
        description: 'true=確認のみ・false=訂正案を保存'
        required: false
        default: 'true'

concurrency:
  group: blog-verify
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    environment:
      name: content-automation-production
      deployment: false
    permissions:
      contents: write
      issues: read
    name: Verify past posts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve paid Claude/Codex policy
        id: paid_ai_policy
        uses: ./.github/actions/paid-ai-policy
        with:
          requested: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED || 'false' }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Verify past posts
        if: steps.paid_ai_policy.outputs.enabled == 'true'
        env:
          # QIITA_ACCESS_TOKEN は渡さない (2026-07-12 アカウント利用停止 →
          # script 側の「not set → skipping Qiita」ガードで接触ゼロにする)
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ vars.PAID_AI_CLAUDE_CODEX_ENABLED == 'true' && steps.paid_ai_policy.outputs.enabled == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || '5' }}
        run: python3 scripts/verify_past_posts.py

      - name: Record owner-requested verification suspension
        if: steps.paid_ai_policy.outputs.enabled != 'true'
        run: echo "Claude-backed article verification is disabled by owner policy." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit correction proposals
        if: github.event.inputs.dry_run != 'true'
        env:
          BYPASS_TOKEN: ${{ secrets.BYPASS_RULES }}
        run: |
          git config user.name "kanta13jp1"
          git config user.email "kanta13jp1@users.noreply.github.com"
          git add docs/blog-corrections/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ℹ️ No correction proposals generated"
          else
            git commit -m "自動: 過去記事の訂正案を生成 (admin承認待ち)"
            git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${BYPASS_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:main
          fi
