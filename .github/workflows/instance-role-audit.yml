name: Instance Role Audit (12 fleet 担当分担 monthly review)

# Win版#132 part 99 直接実装
# AI_FLEET_SYNERGY 原則 #1 (Strict Instance Routing) dogfood
# 過去 30 日の commit を instance 別に集計 / CLAUDE.md routing matrix 想定との乖離検出

# Current canonical routing: Claude Code #1 (Windows app) + Codex #1
# (Windows app). Old 12-fleet / PS#1-6 references in historical reports
# are legacy-only and must not be used for new WBS ownership.

on:
  schedule:
    - cron: "0 1 1 * *"  # monthly / 1 日 01:00 UTC (= 10:00 JST)
  workflow_dispatch: {}

concurrency:
  group: instance-role-audit
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    permissions:
      contents: write
    name: Generate audit report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history for git log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BYPASS_RULES || github.token }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compute month tag
        id: tag
        run: |
          MONTH=$(TZ=UTC date +'%Y-%m')
          echo "month=$MONTH" >> $GITHUB_OUTPUT

      - name: Run audit
        run: |
          python scripts/instance_role_audit.py \
            --month "${{ steps.tag.outputs.month }}" \
            --output "docs/instance-role-audit/${{ steps.tag.outputs.month }}.md"

      - name: Commit report
        run: |
          git config user.name  "instance-role-audit[bot]"
          git config user.email "instance-role-audit@users.noreply.github.com"
          git add docs/instance-role-audit/ || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "docs(audit): instance role audit ${{ steps.tag.outputs.month }}"
            git push origin HEAD:main || git push --force-with-lease origin HEAD:main
          fi
