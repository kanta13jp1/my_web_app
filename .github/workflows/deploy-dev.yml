name: Deploy to Development

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '*.md'
      - '**/*.md'
      - '.github/*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'assets/data/tiger_*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-dev
  # Win版#109: 5 インスタンス並行 push の cancel 連鎖回避のため false に。
  # 同 group で順次実行・全 commit が必ず deploy される。
  cancel-in-progress: false

env:
  ENVIRONMENT: development
  FLUTTER_VERSION: '3.38.x'
  LANDING_GOOGLE_LOGIN_ENABLED: 'true'

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    # 🚨 修正: 子ワークフローの権限要求を明示的に付与
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    environment:
      name: development
      # 修正: environment.urlも後続ステップのsuffixで構築するため、一時的に固定値を設定
      url: https://my-web-app-b67f4--dev.web.app
    
    outputs:
      # 🚨 修正: URL全体ではなく、サフィックス（ランダムな部分）のみを出力する
      deploy_suffix: ${{ steps.firebase_cli_deploy.outputs.suffix }}

    permissions:
      contents: read 

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Flutter pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # Supabase Migration (Development)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.84.2

      - name: Run Supabase migrations
        run: |
          echo "Running Supabase migrations for development..."
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
          # Repair any already-applied migrations to avoid duplicate key errors
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" | grep -oP '^\d+')
            supabase migration repair --status applied "$version" 2>/dev/null || true
          done
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
        continue-on-error: false  # Database migrations must ALWAYS succeed (hard fail)

      # Build Flutter Web
      - name: Validate Flutter Supabase configuration
        run: python scripts/validate_flutter_supabase_env.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_DEV || secrets.SUPABASE_ANON_KEY_DEV }}

      - name: Build Flutter Web (Development)
        run: >
          flutter build web --release
          --pwa-strategy=none
          --dart-define=ENVIRONMENT=development
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=${{ env.LANDING_GOOGLE_LOGIN_ENABLED }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_DEV || secrets.SUPABASE_ANON_KEY_DEV }}

      - name: Render public Supabase URL into web shell
        run: python scripts/render_web_supabase_config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      - name: Setup Node for Firebase CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      # Deploy to Firebase Hosting (CLI) - サフィックスを抽出
      - name: Deploy to Firebase Hosting (CLI)
        id: firebase_cli_deploy
        run: |
          npm install -g firebase-tools
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa_key.json"

          echo "Deploying to 'dev' channel..."
          firebase hosting:channel:deploy dev --project ${{ secrets.FIREBASE_PROJECT_ID }} --expires 30d --json > deploy_output.json 2> /dev/null
          
          # JSONからURLを抽出
          SITE_URL=$(jq -r '.result | to_entries[] | .value.url' deploy_output.json | head -n 1)
          
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            echo "--- URL extraction failed. Fatal error. ---"
            exit 1
          fi

          echo "✅ Extracted URL: $SITE_URL"
          
          # 🚨 修正: URLからランダムなサフィックス部分（例: ydnyem6n）を抽出する
          # URL形式: https://{PROJECT_ID}--{CHANNEL_ID}-{SUFFIX}.web.app
          # SUFFIXを取得するためのsed/awk/grep処理を記述
          # 例: https://my-web-app-b67f4--dev-ydnyem6n.web.app
          #    |_______| |______| |_______|
          #     ID       Channel   Suffix
          
          # sedを使ってURLからサフィックス部分だけを抽出
          # $PROJECT_ID--dev-の後の文字列(.web.appの前の文字列)を取得
          SUFFIX=$(echo "$SITE_URL" | sed -E 's/.*-([a-zA-Z0-9]+)\.web\.app/\1/')
          
          if [ "$SUFFIX" == "$SITE_URL" ] || [ -z "$SUFFIX" ]; then
              echo "::warning::Suffix extraction failed. Using 'unknown' as fallback."
              SUFFIX="unknown"
          fi
          
          echo "Final SUFFIX: $SUFFIX"
          
          # GitHub Actionsの出力変数にセット (サフィックスを使用)
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          
          rm sa_key.json deploy_output.json
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Job Summary
        if: always()
        run: |
          BUILD_OK=$([ -d "build/web" ] && echo "✅" || echo "❌")
          {
            echo "## Deploy to Development — \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "| 項目 | 状態 |"
            echo "|-----|------|"
            echo "| Flutter build web | $BUILD_OK |"
            echo "| Firebase channel | dev |"
            echo "| URL | https://my-web-app-b67f4--dev.web.app |"
            echo ""
            echo "**Actor**: $GITHUB_ACTOR | **Branch**: \`$GITHUB_REF_NAME\`"
          } >> $GITHUB_STEP_SUMMARY

  notify:
    timeout-minutes: 5
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    permissions:
      contents: read

    steps:
      - name: Get commit message
        id: get_commit_message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            const message = commit.data.commit.message;
            core.setOutput('message', message);

      - name: Prepare URL
        id: prepare_url
        if: needs.deploy.result == 'success'
        run: |
          # 🚨 修正: サフィックスとシークレットを使って完全なURLを再構築
          PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
          DEPLOY_SUFFIX="${{ needs.deploy.outputs.deploy_suffix }}"
          
          # 完全なURLを再構築: https://{project-id}--{channel-id}-{suffix}.web.app
          RECONSTRUCTED_URL="https://$PROJECT_ID--dev-$DEPLOY_SUFFIX.web.app"
          
          # 最終環境変数にセット
          echo "DECODED_URL=$RECONSTRUCTED_URL" >> $GITHUB_ENV
          echo "Reconstructed URL is set for notification."

      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Deployment to ${{ env.ENVIRONMENT }} successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":white_check_mark: Deployment to ${{ env.ENVIRONMENT }} Successful"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repository:*\n`${{ github.repository }}`" },
                    { "type": "mrkdwn", "text": "*Environment:*\n`${{ env.ENVIRONMENT }}`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Author:*\n`${{ github.actor }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit Message:*\n```${{ steps.get_commit_message.outputs.message }}```"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*URL:*\n${{ env.DECODED_URL }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Commit" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                    }
                  ]
                }
              ]
            }
      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Deployment to ${{ env.ENVIRONMENT }} failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":x: Deployment to ${{ env.ENVIRONMENT }} Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repository:*\n`${{ github.repository }}`" },
                    { "type": "mrkdwn", "text": "*Environment:*\n`${{ env.ENVIRONMENT }}`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Author:*\n`${{ github.actor }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit Message:*\n```${{ steps.get_commit_message.outputs.message }}```"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }
      - name: Comment on commit
        if: needs.deploy.result == 'success'
        continue-on-error: true  # contents: read では失敗する場合があるため
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deployUrl = process.env.DECODED_URL;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 Successfully deployed to **Development** environment!\n\n📍 URL: ${deployUrl}`
            })
