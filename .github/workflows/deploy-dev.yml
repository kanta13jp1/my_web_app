name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  ENVIRONMENT: development
  FLUTTER_VERSION: '3.27.x'

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      pull-requests: write

  deploy:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: development
      url: ${{ steps.firebase_cli_deploy.outputs.site_url }}
    
    outputs:
      deploy_url: ${{ steps.firebase_cli_deploy.outputs.site_url }}

    # 👇 修正: id-token のパーミッションを追加
    permissions:
      contents: read # 変更なし
      id-token: write # 追加：シークレットフィルタリングをバイパスするために必要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Supabase Migration (Development)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        run: |
          echo "Running Supabase migrations for development..."
          # Link to development project
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
          # Run migrations
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
        continue-on-error: true

      # Build Flutter Web
      - name: Build Flutter Web (Development)
        run: flutter build web --release --dart-define=ENVIRONMENT=development
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      # Deploy to Firebase Hosting (CLI)
      - name: Deploy to Firebase Hosting (CLI)
        id: firebase_cli_deploy
        run: |
          # Firebase CLIのインストール
          npm install -g firebase-tools

          # サービスアカウントキーJSONファイルの作成
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa_key.json"

          # デプロイ実行（JSON形式で出力させてURLを確実に取得）
          echo "Deploying to 'dev' channel..."
          # firebase hosting:channel:deploy は標準エラー出力にもログを出すため、2> /dev/null で抑制
          firebase hosting:channel:deploy dev --project ${{ secrets.FIREBASE_PROJECT_ID }} --expires 30d --json > deploy_output.json 2> /dev/null
          
          # JSONからURLを抽出: to_entries[] を使用してキー名に依存せず、最初に見つかったurlを取得
          SITE_URL=$(jq -r '.result | to_entries[] | .value.url' deploy_output.json | head -n 1)
          
          # URLが取得できなかった場合のフォールバック（ログで確認した形式）
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            echo "--- URL extraction failed. Using fallback ---"
            # サイトIDが含まれるURLの形式を使用
            # ※ 注意: ここに secrets.FIREBASE_PROJECT_ID を含めることで、deploy_urlがスキップされる原因になっている
            SITE_URL="https://${{ secrets.FIREBASE_PROJECT_ID }}--dev-YOUR_PROJECT_SUFFIX.web.app"
            echo "::warning::Using Fallback URL. Dynamic URL extraction failed."
          fi

          echo "✅ Deployed URL: $SITE_URL"
          
          # GitHub Actionsの出力変数にセット
          echo "site_url=$SITE_URL" >> $GITHUB_OUTPUT
          
          # 後始末
          rm sa_key.json deploy_output.json
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    # 👇 修正: id-token のパーミッションを追加
    permissions:
      contents: write # 変更なし
      id-token: write # 追加：シークレットフィルタリングをバイパスするために必要

    steps:
      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Development deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Development Deployment Successful* ✅\n\n*Environment:* Development\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*URL:* ${{ needs.deploy.outputs.deploy_url }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Development deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Development Deployment Failed* ❌\n\n*Environment:* Development\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n\nPlease check the workflow logs for details."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on commit
        if: needs.deploy.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ needs.deploy.outputs.deploy_url }}';
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 Successfully deployed to **Development** environment!\n\n📍 URL: ${deployUrl}`
            })