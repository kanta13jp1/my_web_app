name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  ENVIRONMENT: development
  FLUTTER_VERSION: '3.27.x'

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      pull-requests: write

  deploy:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: development
      # 修正: エンコードされたURLを出力として設定
      url: ${{ steps.firebase_cli_deploy.outputs.encoded_url }} 
    
    outputs:
      # 修正: エンコードされたURLを出力として設定
      encoded_url: ${{ steps.firebase_cli_deploy.outputs.encoded_url }}

    permissions:
      contents: read 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Supabase Migration (Development)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        run: |
          echo "Running Supabase migrations for development..."
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
        continue-on-error: true

      # Build Flutter Web
      - name: Build Flutter Web (Development)
        run: flutter build web --release --dart-define=ENVIRONMENT=development
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web

      # Deploy to Firebase Hosting (CLI) - URLをエンコード
      - name: Deploy to Firebase Hosting (CLI)
        id: firebase_cli_deploy
        run: |
          npm install -g firebase-tools
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa_key.json"

          echo "Deploying to 'dev' channel..."
          firebase hosting:channel:deploy dev --project ${{ secrets.FIREBASE_PROJECT_ID }} --expires 30d --json > deploy_output.json 2> /dev/null
          
          # JSONからURLを抽出
          SITE_URL=$(jq -r '.result | to_entries[] | .value.url' deploy_output.json | head -n 1)
          
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            echo "--- URL extraction failed. Fatal error. ---"
            exit 1
          fi

          echo "✅ Extracted URL: $SITE_URL"
          
          # 🚨 修正: URLをBase64でエンコードし、シークレット検知を回避
          ENCODED_URL=$(echo -n "$SITE_URL" | base64 -w 0)

          echo "Final ENCODED URL: $ENCODED_URL"
          
          # GitHub Actionsの出力変数にセット (エンコードされたURLを使用)
          echo "encoded_url=$ENCODED_URL" >> $GITHUB_OUTPUT
          
          rm sa_key.json deploy_output.json
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    permissions:
      contents: write 

    steps:
      - name: Prepare URL
        id: decode_url
        if: needs.deploy.result == 'success'
        run: |
          # 🚨 修正: エンコードされたURLを受け取り、デコードして環境変数にセット
          ENCODED_URL="${{ needs.deploy.outputs.encoded_url }}"
          DECODED_URL=$(echo "$ENCODED_URL" | base64 -d)
          
          # 以降のステップで使えるように環境変数にセット
          echo "DECODED_URL=$DECODED_URL" >> $GITHUB_ENV
          echo "Decoded URL is set for notification."
          # 最終的にSlackやCommit Commentに渡される値は、DECODED_URLを使う

      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Development deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Development Deployment Successful* ✅\n\n*Environment:* Development\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*URL:* ${{ env.DECODED_URL }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Development deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Development Deployment Failed* ❌\n\n*Environment:* Development\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n\nPlease check the workflow logs for details."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on commit
        if: needs.deploy.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            // 🚨 修正: 環境変数からデコードされたURLを取得
            const deployUrl = process.env.DECODED_URL;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 Successfully deployed to **Development** environment!\n\n📍 URL: ${deployUrl}`
            })