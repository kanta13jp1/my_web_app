name: Minimal E2E Gate

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to smoke test
        required: false
        default: https://my-web-app-b67f4.web.app
      repeat_each:
        description: Number of repeated smoke passes for stability
        required: false
        default: "3"
  workflow_run:
    workflows:
      - Deploy to Production
    types:
      - completed

concurrency:
  group: minimal-e2e-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr-e2e-declaration:
    name: PR minimal E2E declaration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect changed files
        run: |
          mkdir -p .ci-logs
          # Three-dot (base...head) diffs from the MERGE BASE = only this PR's
          # changes. Two separate args is a two-dot diff against the base *tip*,
          # so files that landed on main after the branch point get attributed
          # here, turning docs-only PRs into "application code changed".
          # fetch-depth: 0 above guarantees the merge base is present.
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > .ci-logs/changed-files.txt
          git diff --name-status \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > .ci-logs/changed-files-status.txt

      - name: Skip if docs-only change
        id: docs_check
        run: |
          DOCS_ONLY=true
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              docs/*|memory/*|.claude/*|.codex/*|.agents/*|*.md|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                ;;
              *)
                DOCS_ONLY=false
                break
                ;;
            esac
          done < .ci-logs/changed-files.txt
          if [ "$DOCS_ONLY" = "true" ] && [ -s .ci-logs/changed-files.txt ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "✅ docs-only PR — E2E declaration skipped (no app code changed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check hook bypass markers
        if: steps.docs_check.outputs.docs_only != 'true'
        run: >
          python scripts/check_no_verify_bypass.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Test Dependabot pub policy
        if: steps.docs_check.outputs.docs_only != 'true'
        run: python scripts/check_dependabot_pub_policy_test.py

      - name: Test Design accessibility audit policy
        if: steps.docs_check.outputs.docs_only != 'true'
        run: python scripts/check_design_accessibility_audit_test.py

      - name: Guard Dependabot pub updates
        if: steps.docs_check.outputs.docs_only != 'true' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          git show \
            "${{ github.event.pull_request.base.sha }}:pubspec.yaml" \
            > .ci-logs/pubspec.base.yaml
          git show \
            "${{ github.event.pull_request.head.sha }}:pubspec.yaml" \
            > .ci-logs/pubspec.head.yaml
          python scripts/check_dependabot_pub_policy.py \
            --base-pubspec .ci-logs/pubspec.base.yaml \
            --head-pubspec .ci-logs/pubspec.head.yaml

      - name: Check minimal E2E PR contract
        if: steps.docs_check.outputs.docs_only != 'true'
        run: >
          python scripts/check_minimal_e2e_gate.py
          --event "$GITHUB_EVENT_PATH"
          --changed-files .ci-logs/changed-files.txt

      - name: Check Design accessibility audit contract
        if: steps.docs_check.outputs.docs_only != 'true'
        run: >
          python scripts/check_design_accessibility_audit.py
          --event "$GITHUB_EVENT_PATH"
          --changed-files-status .ci-logs/changed-files-status.txt

  public-e2e-stability:
    permissions:
      contents: read
    name: Public E2E stability smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repeated public smoke tests
        run: >
          npm run e2e:smoke --
          --project=chromium
          --workers=1
          --repeat-each="${REPEAT_EACH}"
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://my-web-app-b67f4.web.app' }}
          REPEAT_EACH: ${{ github.event.inputs.repeat_each || '3' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/public-smoke-results.json

      - name: Run desktop and mobile visual evidence tests
        run: >
          npm run e2e:visual --
          --project=chromium
          --project=mobile-chrome
          --workers=1
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://my-web-app-b67f4.web.app' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/visual-evidence-results.json

      - name: Summarize Playwright evidence
        if: always()
        run: |
          node scripts/summarize_playwright_results.mjs \
            playwright-report/public-smoke-results.json \
            playwright-report/visual-evidence-results.json \
            --out playwright-report/issue-summary.md

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minimal-e2e-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
