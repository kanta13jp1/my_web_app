name: NotebookLM User Tasks Snapshot

# Exports WBS instance=user tasks to docs/user-tasks-snapshot.md so the
# NotebookLM master notebook can ingest and analyze manual task procedures.
# Related edge action: tools-hub:wbs.export_user_tasks_md

on:
  schedule:
    - cron: "30 0 * * *" # 09:30 JST
  workflow_dispatch:
    inputs:
      include_completed:
        description: "Include completed tasks"
        required: false
        default: "false"
      recent_reports:
        description: "Recent reports per task"
        required: false
        default: "3"

concurrency:
  group: notebooklm-user-tasks-sync
  cancel-in-progress: false

permissions: {}

jobs:
  snapshot:
    permissions:
      contents: write
    name: User Tasks Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TOOLS_HUB_URL: ${{ secrets.SUPABASE_TOOLS_HUB_URL }}
      ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      INCLUDE_COMPLETED: ${{ github.event.inputs.include_completed || 'false' }}
      RECENT_REPORTS: ${{ github.event.inputs.recent_reports || '3' }}

    steps:
      - name: Step 1 - Secret presence check
        id: precheck
        run: |
          if [ -z "$TOOLS_HUB_URL" ]; then
            TOOLS_HUB_URL="https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/tools-hub"
            echo "TOOLS_HUB_URL=$TOOLS_HUB_URL" >> "$GITHUB_ENV"
          fi

          if [ -z "$ANON_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY_PROD missing; skip snapshot"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Step 2 - Checkout
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.BYPASS_RULES || secrets.GH_PAT || github.token }}

      - name: Step 3 - Fetch user tasks markdown
        if: steps.precheck.outputs.skip != 'true'
        id: fetch
        run: |
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            "$TOOLS_HUB_URL" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"wbs.export_user_tasks_md\",\"include_completed\":${INCLUDE_COMPLETED},\"recent_reports\":${RECENT_REPORTS}}" \
            --max-time 30)

          echo "HTTP code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            BODY=$(head -c 500 /tmp/resp.json)
            echo "::warning::HTTP ${HTTP_CODE}: ${BODY}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p docs
          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/resp.json").read_text(encoding="utf-8"))
          markdown = data.get("markdown", "")
          Path("docs/user-tasks-snapshot.md").write_text(markdown, encoding="utf-8")
          print(f"task_count={data.get('task_count', 0)}")
          print(f"report_count={data.get('report_count', 0)}")
          PY

          BYTES=$(stat -c %s docs/user-tasks-snapshot.md 2>/dev/null || echo "0")
          echo "snapshot bytes: $BYTES"

          if [ "$BYTES" -lt 50 ]; then
            echo "::warning::Snapshot too small (${BYTES} bytes); skip commit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Step 4 - Commit + push
        if: steps.precheck.outputs.skip != 'true' && steps.fetch.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/user-tasks-snapshot.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit \
            -m "chore(wbs): refresh user tasks snapshot for NotebookLM ($(date -u +%Y-%m-%d))" \
            -m "Auto-generated by tools-hub:wbs.export_user_tasks_md. Trace: ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main || echo "::warning::push failed"

      - name: Step 5 - Skip log
        if: steps.precheck.outputs.skip == 'true' || steps.fetch.outputs.skip == 'true'
        run: |
          echo "Snapshot skipped (secret missing / HTTP error / empty result)"

      - name: Step 6 - NotebookLM instruction
        if: steps.precheck.outputs.skip != 'true' && steps.fetch.outputs.skip != 'true'
        run: |
          echo "## NotebookLM user task snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated: docs/user-tasks-snapshot.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'notebooklm use ea6cff25' >> "$GITHUB_STEP_SUMMARY"
          echo 'notebooklm source add docs/user-tasks-snapshot.md' >> "$GITHUB_STEP_SUMMARY"
          echo 'notebooklm ask "ユーザータスクの最短手順、詰まりポイント、今日やるべき順番を整理して"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
