name: Infra Health Check (インフラ監視)

# 毎時 + 手動実行
on:
  schedule:
    - cron: "37 */2 * * *"  # 2時間ごと３７分
  workflow_dispatch:

concurrency:
  group: infra-health-check
  cancel-in-progress: true  # 2026-06-20 ci-audit: 純粋監視のみ・idempotent。手動+schedule重複時のキュー積み防止

permissions:
  contents: write

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo (required for git commit/push step)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.BYPASS_RULES || secrets.GITHUB_TOKEN }}

      - name: Check Firebase Hosting
        id: firebase
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://my-web-app-b67f4.web.app/" \
            --max-time 10 2>/dev/null || echo "000")
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "🌐 Firebase: HTTP $CODE"

      - name: Check Supabase Edge Functions
        id: supabase
        run: |
          # メイン機能 guitar-recording-studio を含む重要EFを監視
          ENDPOINTS=(
            "schedule-hub:POST"
            "tools-hub:POST"
            "admin-hub:POST"
            "guitar-recording-studio:POST"
            "get-home-dashboard:POST"
            "health-check:GET"
          )

          ALL_OK=true
          RESULTS=""
          for EP in "${ENDPOINTS[@]}"; do
            NAME="${EP%%:*}"
            METHOD="${EP##*:}"

            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X "$METHOD" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" \
              "https://smmkxxavexumewbfaqpy.supabase.co/functions/v1/$NAME" \
              --max-time 10 2>/dev/null || echo "000")

            STATUS_ICON="✅"
            if [ "$CODE" = "000" ] || [ "$CODE" -ge 500 ]; then
              ALL_OK=false
              STATUS_ICON="❌"
            fi
            echo "  $STATUS_ICON $NAME: HTTP $CODE"
            RESULTS="${RESULTS}${NAME}=${CODE} "
          done

          echo "all_ok=$ALL_OK" >> $GITHUB_OUTPUT
          echo "results=$RESULTS" >> $GITHUB_OUTPUT

      - name: Write infra-status cache (WEB版フォールバック用)
        if: always()
        run: |
          FIREBASE_CODE="${{ steps.firebase.outputs.code }}"
          ALL_OK="${{ steps.supabase.outputs.all_ok }}"
          RESULTS="${{ steps.supabase.outputs.results }}"
          FETCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 403 = Network Restrictions ブロック → 異常扱いにしない (既知の制限)
          if echo "$RESULTS" | grep -q "403"; then
            NOTE="Supabase Network Restrictions により一部エンドポイントが 403。fix-supabase-network.yml (allow-all) で解除可能。"
          else
            NOTE=""
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet
          git checkout main --quiet
          git reset --hard origin/main --quiet

          mkdir -p docs
          jq -n \
            --arg firebase "$FIREBASE_CODE" \
            --arg supabase_all_ok "$ALL_OK" \
            --arg results "$RESULTS" \
            --arg fetched_at "$FETCHED_AT" \
            --arg note "$NOTE" \
            '{
              firebase: {code: $firebase, ok: ($firebase == "200")},
              supabase: {all_ok: ($supabase_all_ok == "true"), results: $results},
              fetched_at: $fetched_at,
              note: $note
            }' > docs/infra-status.json

          echo "✅ docs/infra-status.json 更新: Firebase=$FIREBASE_CODE supabase_ok=$ALL_OK"

          git add docs/infra-status.json
          if git diff --cached --quiet; then
            echo "変更なし — スキップ"
          else
            git commit -m "自動: インフラヘルスチェック $(date -u +%Y-%m-%d-%H):00 (GitHub Actions)"
            PUSH_TOKEN="${{ secrets.GH_PAT || secrets.BYPASS_RULES || secrets.GITHUB_TOKEN }}"
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/kanta13jp1/my_web_app.git"
            git push origin main && echo "✅ infra-status.json push 完了" || echo "⚠️ push 失敗 (GH_PAT / BYPASS_RULES を確認)"
          fi

      - name: Record to schedule_task_runs
        if: always()
        run: |
          FIREBASE_CODE="${{ steps.firebase.outputs.code }}"
          ALL_OK="${{ steps.supabase.outputs.all_ok }}"
          STATUS="success"
          if [ "$FIREBASE_CODE" != "200" ] || [ "$ALL_OK" != "true" ]; then
            STATUS="error"
          fi
          SUMMARY="Firebase: HTTP ${FIREBASE_CODE} | EF: all_ok=${ALL_OK} | ${{ steps.supabase.outputs.results }}"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"infra-health-check\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Job Summary
        if: always()
        run: |
          FIREBASE_CODE="${{ steps.firebase.outputs.code }}"
          ALL_OK="${{ steps.supabase.outputs.all_ok }}"
          FB_ICON=$([ "$FIREBASE_CODE" = "200" ] && echo "✅" || echo "❌")
          EF_ICON=$([ "$ALL_OK" = "true" ] && echo "✅" || echo "❌")
          {
            echo "## Infra Health Check $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
            echo ""
            echo "| サービス | ステータス |"
            echo "|---------|----------|"
            echo "| Firebase Hosting | $FB_ICON HTTP $FIREBASE_CODE |"
            echo "| Supabase Edge Functions | $EF_ICON all_ok=$ALL_OK |"
            echo ""
            echo "\`\`\`"
            echo "${{ steps.supabase.outputs.results }}"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Report status
        if: steps.firebase.outputs.code != '200' || steps.supabase.outputs.all_ok != 'true'
        run: |
          echo "⚠️ インフラ異常検知"
          echo "Firebase: HTTP ${{ steps.firebase.outputs.code }}"
          echo "Supabase EFs: all_ok=${{ steps.supabase.outputs.all_ok }}"
          echo "詳細: ${{ steps.supabase.outputs.results }}"
