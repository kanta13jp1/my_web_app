name: AI Model Telemetry Monthly Review

on:
  workflow_dispatch:
  schedule:
    - cron: "23 21 1 * *"

concurrency:
  group: ai-model-telemetry-review-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  telemetry-review:
    permissions:
      contents: read
    name: Build model telemetry summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build telemetry summary
        run: |
          python scripts/ai_model_telemetry_report.py \
            --input docs/ai-bench/results/model_usage_events.sample.jsonl \
            --output-json ai-model-telemetry-summary.json \
            --output-md ai-model-telemetry-summary.md \
            --strict
          cat ai-model-telemetry-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload telemetry artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ai-model-telemetry-summary
          path: |
            ai-model-telemetry-summary.json
            ai-model-telemetry-summary.md
