name: Jev continuous campaign diagnostic
on: workflow_dispatch
permissions: {}
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/jev_mario/course-audit.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jev-course-audit-campaign
          path: test-results/jev-course-audit-campaign.json
          retention-days: 7
