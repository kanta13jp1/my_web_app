name: Jev Mario lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planner-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0298514176db548d23a20b496b09898a615c7846
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = 0298514176db548d23a20b496b09898a615c7846
      - run: node --test test/web/jev_mario_escape.test.mjs
