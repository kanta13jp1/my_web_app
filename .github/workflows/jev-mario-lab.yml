name: Issue5661 published game runtime proof
on: workflow_dispatch
permissions:
  contents: read
jobs:
  public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=test/e2e/jev_mario.production.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue5661-published-runtime-evidence
          path: |
            test-results/
            jev-public-report/
          retention-days: 7
