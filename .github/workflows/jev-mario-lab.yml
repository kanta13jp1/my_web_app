name: Issue5661 ablation no-castle-item worker diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/jev_mario/course-audit.mjs 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue5661-ablation-no-castle-item
          path: test-results/jev-course-audit-8.json
          retention-days: 7
