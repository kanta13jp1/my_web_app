name: Jev Mario lab
on: workflow_dispatch
permissions:
  contents: read
jobs:
  castle-reward-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node --test test/web/jev_mario_live_guard.test.mjs test/web/jev_mario_water_items.test.mjs test/web/jev_mario_escape.test.mjs test/web/jev_mario_student.test.mjs
