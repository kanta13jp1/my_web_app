name: Jev Mario lab
on:
  pull_request:
    paths:
      - 'web/jev-mario-lab/**'
      - 'web/labs/jev-mario/**'
      - 'lib/**/jev_mario*'
      - 'supabase/functions/ai-hub/jev_mario*'
      - 'supabase/functions/ai-hub/index.ts'
      - 'supabase/functions/ai-hub/action_access_policy.ts'
      - 'supabase/migrations/*jev_mario*'
      - 'test/**/jev_mario*'
      - '.github/workflows/jev-mario-lab.yml'
  workflow_dispatch:
  workflow_call:
permissions: {}
concurrency:
  group: jev-mario-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test test/web/jev_mario_course.test.mjs test/web/jev_mario_reaction.test.mjs test/web/jev_mario_recording.test.mjs test/web/jev_mario_audio.test.mjs test/web/jev_mario_core.test.mjs test/web/jev_mario_world11.test.mjs test/web/jev_mario_hosting.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jev-reaction-comparison
          path: |
            test-results/jev-reaction-comparison.json
            test-results/jev-course*.json
          retention-days: 7
      - run: bash scripts/ci/install_deno_from_github.sh
      - run: |
          deno lint supabase/functions/ai-hub/jev_mario.ts supabase/functions/ai-hub/jev_mario_test.ts
          deno test --config supabase/functions/deno.json supabase/functions/ai-hub/jev_mario_test.ts
      - name: Verify isolated atomic quotas and denied direct calls
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role bypassrls;"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260921021418_jev_expense_quota.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260921051931_jev_mario_quota.sql
          python3 test/web/jev_mario_quota.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=test/e2e/jev_mario.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: jev-mario-browser-${{ github.run_id }}
          path: |
            test-results/
            jev-mario-report/
          retention-days: 3
