name: Issue 5661 worker observation
on: workflow_dispatch
permissions: {}
concurrency:
  group: issue5661-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record observed source
        run: git rev-parse HEAD
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Observe reward state without changing acceptance
        run: npx playwright test --config=test/e2e/jev_mario.config.ts --project=desktop --grep '8-4 complete real worker castle' --repeat-each=1 --workers=1 --retries=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue5661-reward-observation-${{ github.sha }}
          path: test-results/**/world84-complete-worker.json
          retention-days: 7
          if-no-files-found: error
