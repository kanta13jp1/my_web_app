name: Jev Mario lab
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  latency-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36927960055 --repo kanta13jp1/my_web_app --name issue5661-reward-observation-b65277933ead1bd3f7be89a8363dfe3f790352c3 --dir test-results/source-observation
      - run: node scripts/jev_mario/latency-replay.mjs
