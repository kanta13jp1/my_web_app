name: Issue5661 latest-head affected castles diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node scripts/jev_mario/course-audit.mjs ${{ matrix.group }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue5661-final-castle-${{ matrix.group }}
          path: test-results/jev-course-audit-*.json
          retention-days: 7
