name: Team Memory Isolation Audit

on:
  pull_request:
    paths:
      - ".github/workflows/team-memory-isolation.yml"
      - "scripts/team_memory_isolation.py"
      - "supabase/functions/_shared/team_memory_isolation.ts"
      - "supabase/functions/_shared/team_memory_isolation_test.ts"
      - "supabase/migrations/20261124003700_create_team_memory_patterns.sql"
      - "test/scripts/test_team_memory_isolation.py"
  workflow_dispatch:

concurrency:
  group: team-memory-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Verify Team Memory isolation and sanitization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Run Python and Deno isolation tests
        run: |
          python3 -B test/scripts/test_team_memory_isolation.py -v
          python3 -B scripts/team_memory_isolation.py --self-test
          python3 -B scripts/team_memory_isolation.py --check-contracts
          deno lint --config supabase/functions/deno.json supabase/functions/_shared/team_memory_isolation.ts supabase/functions/_shared/team_memory_isolation_test.ts
          deno test --config supabase/functions/deno.json --allow-read supabase/functions/_shared/team_memory_isolation_test.ts
