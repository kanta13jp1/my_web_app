name: Dependency Audit (依存パッケージ脆弱性チェック)

# 毎週月曜 08:00 JST (UTC 23:00 日曜) + 手動実行
on:
  schedule:
    - cron: "0 23 * * 0"  # UTC 23:00 日曜 = JST 月曜 08:00
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    environment:
      name: platform-security-production
      deployment: false
    permissions:
      contents: read
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check outdated Flutter packages
        id: flutter_outdated
        run: |
          echo "## Flutter パッケージ更新状況" > /tmp/audit_report.txt
          echo "" >> /tmp/audit_report.txt
          flutter pub outdated --json 2>/dev/null | \
            jq -r '.packages[] | select(.isDirectDependency==true) |
              "| \(.package) | \(.current.version) | \(.upgradable.version) | \(.resolvable.version) |"' \
            >> /tmp/audit_report.txt 2>/dev/null || \
            flutter pub outdated >> /tmp/audit_report.txt 2>/dev/null || true

          OUTDATED_COUNT=$(flutter pub outdated 2>/dev/null | grep -c "^[a-z]" || echo "0")
          echo "outdated_count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT
          echo "📦 Flutter outdated packages: $OUTDATED_COUNT"
          cat /tmp/audit_report.txt

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Check Deno Edge Function imports
        id: deno_imports
        run: |
          echo "" >> /tmp/audit_report.txt
          echo "## Deno Edge Functions import バージョン確認" >> /tmp/audit_report.txt
          echo "" >> /tmp/audit_report.txt

          PINNED_COUNT=0
          UNPINNED_COUNT=0

          # すべてのindex.tsからimport URLを抽出
          while IFS= read -r line; do
            if echo "$line" | grep -qE 'https://deno\.land/|https://esm\.sh/|jsr:'; then
              # バージョン固定チェック (@1.2.3 or @^1.2.3 or @v1.2.3)
              if echo "$line" | grep -qE '@[0-9]+\.[0-9]+\.[0-9]+|@v[0-9]'; then
                PINNED_COUNT=$((PINNED_COUNT + 1))
              else
                UNPINNED_COUNT=$((UNPINNED_COUNT + 1))
                echo "⚠️ バージョン未固定: $line" >> /tmp/audit_report.txt
              fi
            fi
          done < <(grep -rh "^import\|from '" supabase/functions/ --include="*.ts" 2>/dev/null | grep -v "_shared" | head -2000)

          echo "pinned=$PINNED_COUNT" >> $GITHUB_OUTPUT
          echo "unpinned=$UNPINNED_COUNT" >> $GITHUB_OUTPUT
          echo "📦 Deno imports: pinned=$PINNED_COUNT, unpinned=$UNPINNED_COUNT"

      # ── docs分析発見: Deno std古バージョン検出 ─────────────────────────────
      - name: Check Deno std version (古化検出)
        id: deno_std_version
        run: |
          echo "" >> /tmp/audit_report.txt
          echo "## Deno std バージョン古化チェック" >> /tmp/audit_report.txt
          echo "" >> /tmp/audit_report.txt

          # std@0.1xx.0 系 (2023年以前の古バージョン) を検出
          OLD_STD_COUNT=$(grep -r "deno\.land/std@0\.\(1[0-9][0-9]\|[0-9][0-9]\)\." \
            supabase/functions/ --include="*.ts" 2>/dev/null | \
            grep -v "_shared" | wc -l | tr -d ' ')

          CURRENT_STD=$(grep -roh "deno\.land/std@[0-9.]*" \
            supabase/functions/ --include="*.ts" 2>/dev/null | \
            head -1 | grep -oP 'std@\K[0-9.]+' || echo "不明")

          echo "old_std_count=$OLD_STD_COUNT" >> $GITHUB_OUTPUT
          echo "current_std=$CURRENT_STD" >> $GITHUB_OUTPUT

          if [ "$OLD_STD_COUNT" -gt "0" ] 2>/dev/null; then
            echo "⚠️ std@${CURRENT_STD} (古バージョン) を使用: ${OLD_STD_COUNT}件" >> /tmp/audit_report.txt
            echo "   推奨: jsr:@std/* または std@0.220.0+ に更新" >> /tmp/audit_report.txt
          else
            echo "✅ Deno std バージョン問題なし" >> /tmp/audit_report.txt
          fi
          echo "📦 Deno std 古化: ${OLD_STD_COUNT}件 (現在: std@${CURRENT_STD})"

      # ── docs分析発見: pubspec.yaml バージョン未固定依存チェック ────────────
      - name: Check pubspec.yaml unconstrained dependencies
        id: pubspec_unconstrained
        run: |
          echo "" >> /tmp/audit_report.txt
          echo "## pubspec.yaml バージョン制約チェック" >> /tmp/audit_report.txt
          echo "" >> /tmp/audit_report.txt

          UNCONSTRAINED=""
          # dependencies / dev_dependencies セクション内の "any" を検出
          while IFS= read -r line; do
            PKG=$(echo "$line" | grep -E '^\s+[a-z_]+:\s+any\s*$' | \
              grep -oP '^\s+\K[a-z_]+(?=:)' || true)
            if [ -n "$PKG" ]; then
              UNCONSTRAINED="${UNCONSTRAINED} $PKG"
              echo "⚠️ バージョン未固定: $PKG: any" >> /tmp/audit_report.txt
            fi
          done < pubspec.yaml

          UNCONSTRAINED_COUNT=$(echo "$UNCONSTRAINED" | tr -s ' ' '\n' | grep -c '.' 2>/dev/null || echo "0")
          echo "unconstrained_count=$UNCONSTRAINED_COUNT" >> $GITHUB_OUTPUT

          if [ "$UNCONSTRAINED_COUNT" = "0" ]; then
            echo "✅ 全パッケージにバージョン制約あり" >> /tmp/audit_report.txt
          fi
          echo "📦 pubspec.yaml 未固定パッケージ: ${UNCONSTRAINED_COUNT}件 (${UNCONSTRAINED})"

      - name: Check GitHub Actions Node runtime floor
        id: gha_node_runtime
        run: |
          echo "" >> /tmp/audit_report.txt
          echo "## GitHub Actions Node runtime floor" >> /tmp/audit_report.txt
          if python scripts/check_github_actions_node_runtime.py | tee /tmp/gha-node-runtime.txt; then
            echo "OK: Node.js 24 runner transition floor satisfied." >> /tmp/audit_report.txt
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/gha-node-runtime.txt >> /tmp/audit_report.txt
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Record to schedule_task_runs
        if: always()
        run: |
          OUTDATED="${{ steps.flutter_outdated.outputs.outdated_count }}"
          UNPINNED="${{ steps.deno_imports.outputs.unpinned }}"
          OLD_STD="${{ steps.deno_std_version.outputs.old_std_count }}"
          UNCONSTRAINED="${{ steps.pubspec_unconstrained.outputs.unconstrained_count }}"
          STATUS="success"
          SUMMARY="Dependency Audit: flutter_outdated=${OUTDATED}, deno_unpinned=${UNPINNED}, deno_std_old=${OLD_STD:-0}, pubspec_any=${UNCONSTRAINED:-0}"
          curl -s -o /dev/null \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"task_id\":\"dependency-audit\",\"status\":\"$STATUS\",\"summary\":\"$SUMMARY\"}" \
            "https://smmkxxavexumewbfaqpy.supabase.co/rest/v1/schedule_task_runs" \
            --max-time 10 || true

      - name: Summary
        if: always()
        run: |
          OUTDATED="${{ steps.flutter_outdated.outputs.outdated_count }}"
          UNPINNED="${{ steps.deno_imports.outputs.unpinned }}"
          OLD_STD="${{ steps.deno_std_version.outputs.old_std_count }}"
          CURRENT_STD="${{ steps.deno_std_version.outputs.current_std }}"
          UNCONSTRAINED="${{ steps.pubspec_unconstrained.outputs.unconstrained_count }}"
          FLUTTER_ICON=$([ "$OUTDATED" = "0" ] && echo "✅" || echo "⚠️ ${OUTDATED}件")
          DENO_ICON=$([ "$UNPINNED" = "0" ] && echo "✅" || echo "⚠️ ${UNPINNED}件")
          STD_ICON=$([ "${OLD_STD:-0}" = "0" ] && echo "✅" || echo "⚠️ ${OLD_STD}件 (std@${CURRENT_STD})")
          PKG_ICON=$([ "${UNCONSTRAINED:-0}" = "0" ] && echo "✅" || echo "⚠️ ${UNCONSTRAINED}件")
          {
            echo "## Dependency Audit $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            echo ""
            echo "| パッケージ | 状態 |"
            echo "|-----------|------|"
            echo "| Flutter pub outdated | $FLUTTER_ICON |"
            echo "| Deno import (unpinned) | $DENO_ICON |"
            echo "| Deno std 古バージョン | $STD_ICON |"
            echo "| pubspec.yaml 未固定 (`any`) | $PKG_ICON |"
            echo ""
            echo "<details><summary>詳細レポート</summary>"
            echo ""
            echo "\`\`\`"
            cat /tmp/audit_report.txt 2>/dev/null || echo "(レポートなし)"
            echo "\`\`\`"
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
          echo "✅ 依存パッケージ監査完了"
          echo "  Flutter outdated: ${OUTDATED}件"
          echo "  Deno unpinned: ${UNPINNED}件"
          echo "  Deno std 古化: ${OLD_STD:-0}件"
          echo "  pubspec 未固定: ${UNCONSTRAINED:-0}件"
          cat /tmp/audit_report.txt 2>/dev/null || true
