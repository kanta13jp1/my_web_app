name: Internal PR repository secret absence canary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-secret-absence:
    name: Repository secret absence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assert removed repository secrets are unavailable
        shell: bash
        env:
          ANTHROPIC_REPOSITORY_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_REPOSITORY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${ANTHROPIC_REPOSITORY_SECRET:-}" ]]; then
            echo "::error::ANTHROPIC_API_KEY is available to an internal PR job without an Environment."
            exit 1
          fi
          if [[ -n "${SUPABASE_REPOSITORY_SECRET:-}" ]]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is available to an internal PR job without an Environment."
            exit 1
          fi
          echo "Both removed repository secret names are unavailable to this internal PR job."