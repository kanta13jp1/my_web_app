name: Jev expense contract
on:
  pull_request:
    paths:
      - 'supabase/functions/ai-hub/**'
      - 'supabase/migrations/*jev_expense*'
      - 'lib/services/jev*'
      - 'lib/widgets/expense_classification_review.dart'
      - '.github/workflows/jev-expense-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Apply quota migration and verify concurrent reservations
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role bypassrls;"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260921021418_jev_expense_quota.sql
          python3 - <<'PY'
          import subprocess, concurrent.futures, uuid
          def sql(query):
              return subprocess.check_output(['psql','-XAt','-v','ON_ERROR_STOP=1','-c',query],text=True).strip()
          def call(user):
              return sql(f"set role service_role; select public.reserve_jev_expense_call('{user}');").splitlines()[-1]
          user=str(uuid.uuid4())
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              results=list(pool.map(call,[user]*30))
          assert results.count('t') == 3,results
          assert sql("select used from public.jev_expense_quota where scope='global:day'")=='3'
          sql("update public.jev_expense_quota set used=20 where scope like '%:day' and scope<>'global:day'; update public.jev_expense_quota set bucket=bucket-1 where scope like '%:minute'")
          assert call(user)=='f'
          sql("update public.jev_expense_quota set used=200 where scope='global:day'")
          assert call(str(uuid.uuid4()))=='f'
          sql("update public.jev_expense_quota set bucket=bucket-1")
          assert call(user)=='t'
          assert sql("select has_function_privilege('authenticated','public.reserve_jev_expense_call(uuid)','execute')")=='f'
          assert sql("select has_table_privilege('anon','public.jev_expense_quota','select')")=='f'
          assert sql("select relrowsecurity from pg_class where oid='public.jev_expense_quota'::regclass")=='t'
          print('Quota concurrency, daily/global limits, rollover and privileges: passed')
          PY
      - name: Install Deno
        run: bash scripts/ci/install_deno_from_github.sh
      - name: Typecheck and test provider contract
        run: deno test --config supabase/functions/deno.json supabase/functions/ai-hub/jev_expense_test.ts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter-sdk
        with:
          flutter-version: '3.38.x'
      - run: flutter pub get
      - name: Verify explicit cloud suggestions in Chrome
        run: |
          mkdir -p .ci-logs
          chromedriver --port=4444 > .ci-logs/jev-chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4444/status > /dev/null; then break; fi
            sleep 1
          done
          set -o pipefail
          flutter drive --driver=test_driver/asset_ai_integration.dart \
            --target=integration_test/jev_expense_review_test.dart \
            -d web-server --browser-name=chrome --headless 2>&1 | tee .ci-logs/jev-browser.log
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jev-browser-${{ github.run_id }}
          path: .ci-logs/jev-*.log
          retention-days: 3
          include-hidden-files: true
