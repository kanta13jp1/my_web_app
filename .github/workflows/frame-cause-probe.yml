name: Isolated image and constructor cause probe
'on':
  push:
    branches:
    - codex/frame-cause-probe-20261024
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: e53f1bd296072cfde66083d7f77235d649688244
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-flutter-sdk
      with:
        flutter-version: 3.38.10
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-
    - run: flutter pub get
    - name: Run isolated causal probes
      run: |-
        python - <<'PY'
        import json,re,subprocess,hashlib
        from pathlib import Path
        p=Path('.ci-logs');p.mkdir(exist_ok=True)
        widget=Path('lib/widgets/echo_pump_motor_art.dart');test=Path('test/widgets/echo_pump_motor_art_test.dart')
        original_widget=widget.read_bytes();fixed_test=test.read_bytes()
        baseline=subprocess.check_output(['git','show','1b704dfa950d1bc9d67102f24b45b9cadab65f99:test/widgets/echo_pump_motor_art_test.dart'])
        report={}
        def run_test(label):
         r=subprocess.run(['flutter','test','--file-reporter=json:.ci-logs/'+label+'.jsonl',str(test)],check=False)
         events=[json.loads(x) for x in (p/(label+'.jsonl')).read_text().splitlines() if x.strip()]
         names={e['test']['id']:e['test']['name'] for e in events if e.get('type')=='testStart'}
         failed=[names[e['testID']] for e in events if e.get('type')=='testDone' and e['result']!='success']
         return {'exit_code':r.returncode,'failed_tests':failed}
        try:
         source=original_widget.decode();mutated,count=re.subn(r'frameBuilder:.*?errorBuilder:', 'frameBuilder: (context, child, frame, synchronous) => const SizedBox.shrink(),\n      errorBuilder:',source,count=1,flags=re.S)
         assert count==1;widget.write_text(mutated)
         test.write_bytes(baseline);report['baseline_with_hidden_frame']=run_test('baseline-mutant');assert report['baseline_with_hidden_frame']['exit_code']==0
         test.write_bytes(fixed_test);report['fixed_with_hidden_frame']=run_test('fixed-mutant');assert report['fixed_with_hidden_frame']['exit_code']!=0
         assert set(report['fixed_with_hidden_frame']['failed_tests'])=={'pump image follows repaired and powered facts','pending image keeps schematic until its first decoded frame'}
        finally:
         widget.write_bytes(original_widget);test.write_bytes(fixed_test)
        subprocess.run(['git','diff','--exit-code','--',str(widget),str(test)],check=True)
        report['target_files_restored']=True
        report['resolved_lock_sha256']=hashlib.sha256(Path('pubspec.lock').read_bytes()).hexdigest()
        report['input_lock_sha256']=hashlib.sha256(subprocess.check_output(['git','show','HEAD:pubspec.lock'])).hexdigest()
        (p/'cause-probe.json').write_text(json.dumps(report,indent=2))
        # Isolated construction-mode probe: diagnose declaration counters, not product behavior.
        probe=Path('lib/coverage_constructor_probe.dart')
        probe.write_text('class CoverageConstructorProbe {\n  const CoverageConstructorProbe(this.value);\n  final int value;\n  int read() => value;\n}\n')
        for mode in ['const','runtime']:
         f=p/(mode+'_test.dart')
         expression='const CoverageConstructorProbe(7)' if mode=='const' else "CoverageConstructorProbe(int.parse('7'))"
         f.write_text("import 'package:flutter_test/flutter_test.dart';\nimport 'package:my_web_app/coverage_constructor_probe.dart';\nvoid main() { test('construction preserves the value', () { final value = "+expression+"; expect(value.read(), 7); }); }\n")
         subprocess.run(['flutter','test','--coverage',str(f)],check=True)
         sf=False;hits={}
         for line in Path('coverage/lcov.info').read_text().splitlines():
          if line.startswith('SF:'):sf=line.endswith('lib/coverage_constructor_probe.dart')
          elif sf and line.startswith('DA:'):
           n,c,*_=line[3:].split(',');hits[n]=int(c)
         assert hits.get('4',0)>0, ('probe library not measured',mode,hits)
         report[mode+'_constructor_line_hits']=hits
         (p/('probe-'+mode+'.lcov')).write_text(Path('coverage/lcov.info').read_text())
        # Same fixture tests in opposite suite orders, with per-runner concurrency fixed.
        a=p/'order_a_test.dart';b=p/'order_b_test.dart'
        a.write_text("import 'package:flutter_test/flutter_test.dart';\nimport 'package:my_web_app/coverage_constructor_probe.dart';\nvoid main() { test('const value path', () { const value = CoverageConstructorProbe(7); expect(value.read(), 7); }); }\n")
        b.write_text("import 'package:flutter_test/flutter_test.dart';\nimport 'package:my_web_app/coverage_constructor_probe.dart';\nvoid main() { test('type-only path', () { final type = CoverageConstructorProbe; expect(type.toString(), 'CoverageConstructorProbe'); }); }\n")
        for label,files in [('ab',[a,b]),('ba',[b,a])]:
         subprocess.run(['flutter','test','--coverage','--concurrency=1','--file-reporter=json:.ci-logs/order-'+label+'.jsonl',*[str(f) for f in files]],check=True)
         sf=False;hits={}
         for line in Path('coverage/lcov.info').read_text().splitlines():
          if line.startswith('SF:'):sf=line.endswith('lib/coverage_constructor_probe.dart')
          elif sf and line.startswith('DA:'):
           n,c,*_=line[3:].split(',');hits[n]=int(c)
         events=[json.loads(e) for e in (p/('order-'+label+'.jsonl')).read_text().splitlines() if e.strip()]
         names=[e['test']['name'] for e in events if e.get('type')=='testStart' and e['test']['name'] in ['const value path','type-only path']]
         report['order_'+label]={'hits':hits,'executed_order':names}
        probe.unlink()
        (p/'cause-probe.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))

        PY
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: frame-cause-probe
        include-hidden-files: true
        path: |-
          .ci-logs/cause-probe.json
          .ci-logs/*-mutant.jsonl
          .ci-logs/probe-*.lcov
        retention-days: 7
        if-no-files-found: warn
