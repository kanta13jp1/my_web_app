name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  ENVIRONMENT: production
  FLUTTER_VERSION: "3.38.x"
  LANDING_GOOGLE_LOGIN_ENABLED: "true"

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: production

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ github.run_number }}/" pubspec.yaml

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }} --password ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      - name: Deploy Supabase Edge Functions
        run: |
          # All browser-facing functions use --no-verify-jwt so that CORS OPTIONS
          # preflight requests (which carry no Authorization header) are not
          # rejected by Supabase's platform-level JWT check.
          # Auth is enforced inside each function via the Authorization header.
          supabase functions deploy get-public-memo-preview --no-verify-jwt
          supabase functions deploy public-memo-share --no-verify-jwt
          supabase functions deploy memo-reactions --no-verify-jwt
          supabase functions deploy get-ogp --no-verify-jwt
          supabase functions deploy development-achievements --no-verify-jwt
          supabase functions deploy get-growth-roadmap-progress --no-verify-jwt
          supabase functions deploy get-competitor-features --no-verify-jwt
          supabase functions deploy get-home-dashboard --no-verify-jwt
          supabase functions deploy growth-weekly-digest --no-verify-jwt
          supabase functions deploy growth-acquisition-signal --no-verify-jwt
          supabase functions deploy growth-acquisition-report --no-verify-jwt
          supabase functions deploy growth-command-center --no-verify-jwt
          supabase functions deploy growth-referral --no-verify-jwt
          supabase functions deploy growth-share-signal --no-verify-jwt
          supabase functions deploy growth-achievement-summary --no-verify-jwt
          supabase functions deploy daily-judgment --no-verify-jwt
          supabase functions deploy ai-assistant --no-verify-jwt
          supabase functions deploy ai-search --no-verify-jwt
          supabase functions deploy ai-suggest-tags --no-verify-jwt
          supabase functions deploy share-quote --no-verify-jwt
          supabase functions deploy generate-quote-image --no-verify-jwt
          supabase functions deploy generate-daily-challenges --no-verify-jwt
          supabase functions deploy growth-import-preview --no-verify-jwt
          supabase functions deploy growth-import-commit --no-verify-jwt
          supabase functions deploy send-waitlist-notification --no-verify-jwt
          supabase functions deploy get-admin-users --no-verify-jwt
          supabase functions deploy notify-feature-request --no-verify-jwt
          supabase functions deploy schedule-daily-digest --no-verify-jwt
          supabase functions deploy get-support-tickets --no-verify-jwt
          supabase functions deploy reply-support-request --no-verify-jwt
          supabase functions deploy post-x-update --no-verify-jwt
          supabase functions deploy check-competitor-updates --no-verify-jwt
          supabase functions deploy get-competitor-monitoring --no-verify-jwt
          supabase functions deploy health-check --no-verify-jwt
          supabase functions deploy analyze-reality --no-verify-jwt
          supabase functions deploy trigger-analysis --no-verify-jwt
          supabase functions deploy local-election-intelligence --no-verify-jwt
          supabase functions deploy gemini-election-analysis --no-verify-jwt
          supabase functions deploy agent-runtime-cycle --no-verify-jwt
          supabase functions deploy note-comments
          supabase functions deploy get-public-memo-ogp --no-verify-jwt
          supabase functions deploy schedule-task-monitor --no-verify-jwt
          supabase functions deploy blog-post-manager --no-verify-jwt
          supabase functions deploy edge-function-coverage --no-verify-jwt
          supabase functions deploy user-profile-manager --no-verify-jwt
          supabase functions deploy ai-secretary --no-verify-jwt
          supabase functions deploy team-task-manager --no-verify-jwt
          supabase functions deploy schedule-health-check --no-verify-jwt
          supabase functions deploy code-review-issues --no-verify-jwt
          supabase functions deploy development-stats --no-verify-jwt
          supabase functions deploy agent-personality --no-verify-jwt
          supabase functions deploy agent-department-manager --no-verify-jwt
          supabase functions deploy notification-center --no-verify-jwt
          supabase functions deploy onboarding-flow --no-verify-jwt
          supabase functions deploy feature-request-manager --no-verify-jwt
          supabase functions deploy app-analytics-dashboard --no-verify-jwt
          supabase functions deploy user-activity-tracker --no-verify-jwt
          supabase functions deploy competitor-feature-sync --no-verify-jwt
          supabase functions deploy data-export-manager --no-verify-jwt
          supabase functions deploy ab-testing-manager --no-verify-jwt
          supabase functions deploy seo-optimizer --no-verify-jwt
          supabase functions deploy search-analytics --no-verify-jwt
          supabase functions deploy webhook-manager --no-verify-jwt
          supabase functions deploy subscription-management --no-verify-jwt
          supabase functions deploy gamification-engine --no-verify-jwt
          supabase functions deploy agent-task-router --no-verify-jwt
          supabase functions deploy import-from-competitors --no-verify-jwt
          supabase functions deploy department-reporting --no-verify-jwt
          supabase functions deploy agent-performance-monitor --no-verify-jwt
          supabase functions deploy team-collaboration-sync --no-verify-jwt
          supabase functions deploy user-feedback-collector --no-verify-jwt
          supabase functions deploy revenue-forecaster --no-verify-jwt
          supabase functions deploy content-moderation --no-verify-jwt
          supabase functions deploy api-rate-limiter --no-verify-jwt
          supabase functions deploy notification-preferences --no-verify-jwt
          supabase functions deploy file-storage-manager --no-verify-jwt
          supabase functions deploy calendar-events --no-verify-jwt
          supabase functions deploy kanban-board --no-verify-jwt
          supabase functions deploy chat-messaging --no-verify-jwt
          supabase functions deploy automation-workflows --no-verify-jwt
          supabase functions deploy time-tracker --no-verify-jwt
          supabase functions deploy expense-tracker --no-verify-jwt
          supabase functions deploy ai-summarizer --no-verify-jwt
          supabase functions deploy template-library --no-verify-jwt
          supabase functions deploy tag-manager --no-verify-jwt
          supabase functions deploy habit-tracker --no-verify-jwt
          supabase functions deploy bookmark-manager --no-verify-jwt
          supabase functions deploy poll-survey --no-verify-jwt
          supabase functions deploy invoice-generator --no-verify-jwt
          supabase functions deploy contact-manager --no-verify-jwt
          supabase functions deploy goal-tracker --no-verify-jwt
          supabase functions deploy reading-list --no-verify-jwt
          supabase functions deploy password-generator --no-verify-jwt
          supabase functions deploy clipboard-history --no-verify-jwt
          supabase functions deploy quick-note --no-verify-jwt
          supabase functions deploy pomodoro-timer --no-verify-jwt
          supabase functions deploy weather-widget --no-verify-jwt
          supabase functions deploy currency-converter --no-verify-jwt
          supabase functions deploy markdown-renderer --no-verify-jwt
          supabase functions deploy system-status --no-verify-jwt
          supabase functions deploy email-service --no-verify-jwt
          supabase functions deploy social-feed --no-verify-jwt
          supabase functions deploy document-collaboration --no-verify-jwt
          supabase functions deploy leave-management --no-verify-jwt
          supabase functions deploy knowledge-base --no-verify-jwt
          supabase functions deploy payment-processor --no-verify-jwt
          supabase functions deploy marketplace --no-verify-jwt
          supabase functions deploy video-audio-manager --no-verify-jwt
          supabase functions deploy semantic-search --no-verify-jwt
          supabase functions deploy performance-review --no-verify-jwt
          supabase functions deploy wiki-database --no-verify-jwt
          supabase functions deploy api-key-manager --no-verify-jwt
          supabase functions deploy scheduled-notifications --no-verify-jwt
          supabase functions deploy cohort-analysis --no-verify-jwt
          supabase functions deploy integration-connector --no-verify-jwt
          supabase functions deploy push-notification-manager --no-verify-jwt
          supabase functions deploy realtime-presence --no-verify-jwt
          supabase functions deploy voice-memo-transcriber --no-verify-jwt
          supabase functions deploy ocr-document-scanner --no-verify-jwt
          supabase functions deploy oauth-sso-provider --no-verify-jwt
          supabase functions deploy inventory-manager --no-verify-jwt
          supabase functions deploy order-tracker --no-verify-jwt
          supabase functions deploy ci-cd-pipeline --no-verify-jwt
          supabase functions deploy compensation-manager --no-verify-jwt
          supabase functions deploy financial-report --no-verify-jwt
          supabase functions deploy spreadsheet-database --no-verify-jwt
          supabase functions deploy gantt-timeline-manager --no-verify-jwt
          supabase functions deploy whiteboard-canvas --no-verify-jwt
          supabase functions deploy form-builder --no-verify-jwt
          supabase functions deploy meeting-manager --no-verify-jwt
          supabase functions deploy schedule-result-tracker --no-verify-jwt
          supabase functions deploy blog-auto-publisher --no-verify-jwt
          supabase functions deploy virtual-organization --no-verify-jwt
          supabase functions deploy edge-function-ui-checker --no-verify-jwt
          supabase functions deploy issue-auto-resolver --no-verify-jwt
          supabase functions deploy horse-racing-predictor --no-verify-jwt
          supabase functions deploy recruitment-job-board --no-verify-jwt
          supabase functions deploy legal-compliance-manager --no-verify-jwt
          supabase functions deploy elearning-course-manager --no-verify-jwt
          supabase functions deploy crm-sales-pipeline --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build Flutter Web (Production)
        run: |
          flutter build web \
            --release \
            --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENVIRONMENT=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=${{ env.LANDING_GOOGLE_LOGIN_ENABLED }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}"
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Push Release Tag
        id: push_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.version.outputs.tag }}
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "Tag $TAG already exists remotely, skipping tag push."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            - **Environment**: Production
            - **Commit**: ${{ github.sha }}
            - **Deployed Site**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-batch:
    name: Run Python Analysis Batch
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install supabase google-genai

      - name: Run Batch Script
        run: python batch_analysis.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # -----------------------------------------------------------------
  # 通知ジョブ (curlを使用する方式に変更)
  # -----------------------------------------------------------------
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, run-batch]
    if: always()
    environment: production
    permissions:
      contents: write

    steps:
      # 成功時の通知
      - name: Notify Slack on Success
        if: needs.deploy.result == 'success' && needs.run-batch.result == 'success'
        run: |
          cat <<EOF > payload.json
          {
            "text": "✅ Production Deployment & Batch Successful!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "✅ Production Deployment & Batch Successful!" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Environment:*\nProduction" },
                  { "type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`" },
                  { "type": "mrkdwn", "text": "*Commit:*\n\`${{ github.sha }}\`" },
                  { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Workflow" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Deployed Site" },
                    "url": "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }}

      # 失敗時の通知
      - name: Notify Slack on Failure
        if: needs.deploy.result == 'failure' || needs.run-batch.result == 'failure'
        run: |
          cat <<EOF > payload.json
          {
            "text": "❌ Production Deployment or Batch Failed!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "❌ Production Deployment or Batch Failed!" }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*URGENT*: Deployment or Batch has failed. Please investigate!\n\n*Deploy Status:* \`${{ needs.deploy.result }}\`\n*Batch Status:* \`${{ needs.run-batch.result }}\`\n\n*Author:* ${{ github.actor }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Workflow Logs" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "style": "danger"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on commit
        if: needs.deploy.result == 'success' && needs.run-batch.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'Successfully deployed to **Production** and ran analysis batch!\n\n- **Version**: ${{ needs.deploy.outputs.tag }}\n- **URL**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app'
            })
