name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
      - '.claude/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  # Win版#109: cancel-in-progress を true → false に変更 (deploy保証 100%化)。
  # 5 インスタンス (Win/PS/VSCode/WEB/📱スマホ) 並行 push で
  # cancel-in-progress: true だと cancel 連鎖が発生し全コミットが
  # 反映されない問題が頻発していた (Win#101-#107 で確認)。
  # false にすると同 group で順次実行 (1本ずつ・最大 11分 × 並行数 待機)
  # するが、全 commit が必ず deploy される。
  # group が同じため同時並行はゼロ・GitHub Actions リソース消費は変わらない。
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  ENVIRONMENT: production
  FLUTTER_VERSION: "3.38.x"
  LANDING_GOOGLE_LOGIN_ENABLED: "true"

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 45
    environment:
      name: production

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: write
      # Win版#131 part 9: tag push が workflow file 変更を含む commit を指す場合の
      # GitHub App `workflows` permission 拒否を回避
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Win版#131 part 9: GH_PAT で push 認証 (workflow file 変更を含む tag push)
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ github.run_number }}/" pubspec.yaml

      - name: Generate Release Notes data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ github.run_number }}" \
            --commit "${{ github.sha }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --deploy-url "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app" \
            --output web/release-notes.json

      - name: Check migration timestamp collisions
        run: python scripts/check_migration_timestamps.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Run Supabase migrations
