name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  ENVIRONMENT: production
  FLUTTER_VERSION: "3.38.x"
  LANDING_GOOGLE_LOGIN_ENABLED: "true"

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 45
    environment:
      name: production

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ github.run_number }}/" pubspec.yaml

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Run Supabase migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }} --password ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          # Run only unapplied migrations.
          # All migrations use IF NOT EXISTS / ON CONFLICT DO NOTHING so they are
          # safe to run even if the DDL was applied manually before.
          # The old "repair --status applied" loop marked NEW migrations as applied
          # without running their SQL, which caused tables/buckets to be missing.
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      - name: Cleanup demoted Edge Functions (free slots for new Tier 1 functions)
        run: |
          # CRITICAL: Supabase has a ~100 function limit per project.
          # Delete all functions demoted from Tier 1 to Tier 2 to free deployment slots.
          # Using || true so deleting a non-existent function never fails the CI.
          # --- Original Tier 2 demotions ---
          supabase functions delete poll-survey || true
          supabase functions delete reading-list || true
          supabase functions delete password-generator || true
          supabase functions delete clipboard-history || true
          supabase functions delete quick-note || true
          supabase functions delete pomodoro-timer || true
          supabase functions delete weather-widget || true
          supabase functions delete currency-converter || true
          supabase functions delete markdown-renderer || true
          supabase functions delete gemini-election-analysis || true
          supabase functions delete social-proof-generator || true
          supabase functions delete contact-manager || true
          supabase functions delete goal-tracker || true
          supabase functions delete template-library || true
          supabase functions delete tag-manager || true
          supabase functions delete habit-tracker || true
          supabase functions delete bookmark-manager || true
          supabase functions delete invoice-generator || true
          supabase functions delete notification-preferences || true
          supabase functions delete revenue-forecaster || true
          # --- Session 432z demotions (moved to Tier 2 to make room for guitar studio) ---
          supabase functions delete ab-testing-manager || true
          supabase functions delete search-analytics || true
          # --- submit-feedback slot確保 (competitor-feature-sync を Tier 2 に降格) ---
          supabase functions delete competitor-feature-sync || true
          # --- issue-auto-resolver slot確保 (user-growth-analytics を Tier 2 に降格) ---
          supabase functions delete user-growth-analytics || true
          # --- 機能#13: growth-acquisition統合 (signal/report → growth-acquisition に統合) ---
          supabase functions delete growth-acquisition-signal || true
          supabase functions delete growth-acquisition-report || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Supabase Edge Functions
        run: |
          # Supabase project has a max ~100 function limit.
          # Deploy the 99 most critical functions (Tier 1).
          # Remaining 142 functions exist in code but are not deployed.
          # To deploy overflow functions, swap them with lower-priority Tier 1 entries.
          #
          # All browser-facing functions use --no-verify-jwt so that CORS OPTIONS
          # preflight requests (which carry no Authorization header) are not
          # rejected by Supabase's platform-level JWT check.
          # Auth is enforced inside each function via the Authorization header.

          # --- Tier 1A: Core Frontend & Dashboard (15) ---
          supabase functions deploy get-public-memo-preview --no-verify-jwt
          supabase functions deploy public-memo-share --no-verify-jwt
          supabase functions deploy memo-reactions --no-verify-jwt
          supabase functions deploy get-ogp --no-verify-jwt
          supabase functions deploy get-public-memo-ogp --no-verify-jwt
          supabase functions deploy get-home-dashboard --no-verify-jwt
          supabase functions deploy note-comments
          supabase functions deploy notification-center --no-verify-jwt
          supabase functions deploy user-profile-manager --no-verify-jwt
          supabase functions deploy onboarding-flow --no-verify-jwt
          supabase functions deploy feature-request-manager --no-verify-jwt
          supabase functions deploy app-analytics-dashboard --no-verify-jwt
          supabase functions deploy development-achievements --no-verify-jwt
          supabase functions deploy development-stats --no-verify-jwt
          supabase functions deploy system-status --no-verify-jwt

          # --- Tier 1B: Growth & Viral Engine (22) ---
          supabase functions deploy growth-weekly-digest --no-verify-jwt
          supabase functions deploy growth-acquisition --no-verify-jwt
          supabase functions deploy growth-command-center --no-verify-jwt
          supabase functions deploy growth-referral --no-verify-jwt
          supabase functions deploy growth-share-signal --no-verify-jwt
          supabase functions deploy growth-achievement-summary --no-verify-jwt
          supabase functions deploy growth-import-preview --no-verify-jwt
          supabase functions deploy growth-import-commit --no-verify-jwt
          supabase functions deploy get-growth-roadmap-progress --no-verify-jwt
          supabase functions deploy video-ad-generator --no-verify-jwt
          supabase functions deploy viral-share-engine --no-verify-jwt
          supabase functions deploy x-media-post --no-verify-jwt
          supabase functions deploy growth-automation-controller --no-verify-jwt
          supabase functions deploy landing-ab-test --no-verify-jwt
          supabase functions deploy referral-program --no-verify-jwt
          supabase functions deploy share-quote --no-verify-jwt
          supabase functions deploy generate-quote-image --no-verify-jwt
          supabase functions deploy seo-optimizer --no-verify-jwt
          supabase functions deploy send-waitlist-notification --no-verify-jwt
          supabase functions deploy viral-ad-generator --no-verify-jwt
          supabase functions deploy viral-growth-pipeline --no-verify-jwt
          supabase functions deploy viral-growth-engine --no-verify-jwt

          # --- Tier 1C: AI & Agent System (13) ---
          supabase functions deploy daily-judgment --no-verify-jwt
          supabase functions deploy ai-assistant --no-verify-jwt
          supabase functions deploy ai-search --no-verify-jwt
          supabase functions deploy ai-suggest-tags --no-verify-jwt
          supabase functions deploy ai-secretary --no-verify-jwt
          supabase functions deploy ai-summarizer --no-verify-jwt
          supabase functions deploy agent-runtime-cycle --no-verify-jwt
          supabase functions deploy agent-personality --no-verify-jwt
          supabase functions deploy agent-department-manager --no-verify-jwt
          supabase functions deploy agent-task-router --no-verify-jwt
          supabase functions deploy agent-performance-monitor --no-verify-jwt
          supabase functions deploy virtual-organization --no-verify-jwt
          supabase functions deploy my-ai-agent --no-verify-jwt

          # --- Tier 1D: Schedule & Automation (10) ---
          supabase functions deploy schedule-daily-digest --no-verify-jwt
          supabase functions deploy schedule-task-monitor --no-verify-jwt
          supabase functions deploy schedule-health-check --no-verify-jwt
          supabase functions deploy post-x-update --no-verify-jwt
          supabase functions deploy blog-post-manager --no-verify-jwt
          supabase functions deploy blog-auto-publisher --no-verify-jwt
          supabase functions deploy health-check --no-verify-jwt
          supabase functions deploy check-competitor-updates --no-verify-jwt
          supabase functions deploy get-competitor-monitoring --no-verify-jwt
          supabase functions deploy edge-function-coverage --no-verify-jwt

          # --- Tier 1E: Admin & Support (7) ---
          supabase functions deploy get-admin-users --no-verify-jwt
          supabase functions deploy submit-feedback --no-verify-jwt
          supabase functions deploy get-support-tickets --no-verify-jwt
          supabase functions deploy reply-support-request --no-verify-jwt
          supabase functions deploy get-competitor-features --no-verify-jwt
          supabase functions deploy import-from-competitors --no-verify-jwt
          supabase functions deploy notify-feature-request --no-verify-jwt

          # --- Tier 1F: Core App Features (20) ---
          supabase functions deploy subscription-management --no-verify-jwt
          supabase functions deploy subscription-billing --no-verify-jwt
          supabase functions deploy email-service --no-verify-jwt
          supabase functions deploy gamification-engine --no-verify-jwt
          supabase functions deploy calendar-events --no-verify-jwt
          supabase functions deploy kanban-board --no-verify-jwt
          supabase functions deploy chat-messaging --no-verify-jwt
          supabase functions deploy team-task-manager --no-verify-jwt
          supabase functions deploy team-collaboration-sync --no-verify-jwt
          supabase functions deploy file-storage-manager --no-verify-jwt
          supabase functions deploy expense-tracker --no-verify-jwt
          supabase functions deploy time-tracker --no-verify-jwt
          supabase functions deploy automation-workflows --no-verify-jwt
          supabase functions deploy content-moderation --no-verify-jwt
          supabase functions deploy user-activity-tracker --no-verify-jwt
          supabase functions deploy data-export-manager --no-verify-jwt
          supabase functions deploy user-feedback-collector --no-verify-jwt
          supabase functions deploy department-reporting --no-verify-jwt
          supabase functions deploy analyze-reality --no-verify-jwt
          supabase functions deploy trigger-analysis --no-verify-jwt

          # --- Tier 1G: Guitar Studio + Monitoring (12) ---
          supabase functions deploy guitar-recording-studio --no-verify-jwt
          supabase functions deploy music-collaboration --no-verify-jwt
          supabase functions deploy personal-dashboard --no-verify-jwt
          supabase functions deploy webhook-manager --no-verify-jwt
          supabase functions deploy api-rate-limiter --no-verify-jwt
          supabase functions deploy generate-daily-challenges --no-verify-jwt
          supabase functions deploy schedule-result-tracker --no-verify-jwt
          supabase functions deploy schedule-execution-logger --no-verify-jwt
          supabase functions deploy edge-function-test-runner --no-verify-jwt
          supabase functions deploy admin-notification-hub --no-verify-jwt
          supabase functions deploy local-election-intelligence --no-verify-jwt
          supabase functions deploy issue-auto-resolver --no-verify-jwt

          # Total: 99 functions deployed (Supabase project limit: 100)
          # ---
          # Tier 2 (code-only, not deployed due to Supabase 100-function limit):
          # audio-effects-processor (2026-04-11 Tier2降格 → personal-dashboard と入れ替え),
          # growth-acquisition-signal, growth-acquisition-report (機能#13で growth-acquisition に統合),
          # user-growth-analytics, code-review-issues, ab-testing-manager, search-analytics, social-proof-generator,
          # contact-manager, goal-tracker, reading-list, password-generator,
          # clipboard-history, quick-note, pomodoro-timer, weather-widget,
          # currency-converter, markdown-renderer, social-feed, document-collaboration,
          # leave-management, knowledge-base, payment-processor, marketplace,
          # video-audio-manager, semantic-search, performance-review, wiki-database,
          # api-key-manager, scheduled-notifications, cohort-analysis,
          # integration-connector, push-notification-manager, realtime-presence,
          # voice-memo-transcriber, ocr-document-scanner, oauth-sso-provider,
          # inventory-manager, order-tracker, ci-cd-pipeline, compensation-manager,
          # financial-report, spreadsheet-database, gantt-timeline-manager,
          # whiteboard-canvas, form-builder, meeting-manager,
          # competitor-feature-sync, edge-function-ui-checker, horse-racing-predictor,
          # recruitment-job-board, legal-compliance-manager, elearning-course-manager,
          # crm-sales-pipeline, photo-gallery-manager, music-playlist-manager,
          # recipe-meal-planner, fitness-health-tracker, travel-itinerary-planner,
          # event-ticketing, pet-care-manager, language-learning, home-iot-manager,
          # news-rss-aggregator, ai-workflow-automation, document-esignature,
          # social-media-scheduler, smart-inbox-triage, video-meeting-manager,
          # family-sharing-manager, donation-crowdfunding, real-estate-tracker,
          # podcast-manager, mindmap-diagram, parking-reservation,
          # carbon-footprint-tracker, gift-registry, vehicle-fleet-manager,
          # emergency-contacts, auction-marketplace, budget-financial-planner,
          # code-playground, screen-recorder, qr-code-generator,
          # appointment-scheduler, password-vault, habit-gamification,
          # inventory-barcode, customer-feedback, email-template-builder,
          # sitemap-analytics, two-factor-auth, changelog-manager, access-control,
          # data-visualization, api-docs-generator, backup-restore,
          # notification-digest, smart-search, analytics-export, workflow-templates,
          # status-page, address-book, multi-language, data-pipeline, feature-flags,
          # audit-trail, compliance-checker, user-onboarding, rate-limiter-enhanced,
          # content-versioning, custom-dashboard-builder, loyalty-points,
          # live-streaming, geo-checkin, social-stories, encrypted-messaging,
          # cloud-storage-sync, virtual-whiteboard, marketplace-reviews,
          # smart-home-automation, digital-wallet, dns-domain-manager,
          # affiliate-marketing, virtual-pet, ar-navigation, ai-image-generator,
          # ai-writing-assistant, bookmark-sync, focus-timer, note-sharing-enhanced,
          # task-dependency, gemini-election-analysis, poll-survey,
          # viral-video-ad-generator, viral-video-generator,
          # bookmark-manager, habit-tracker, invoice-generator,
          # notification-preferences, revenue-forecaster, tag-manager, template-library,
          # discord-notifications, line-notifications, github-pr-manager
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build Flutter Web (Production)
        run: |
          flutter build web \
            --release \
            --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENVIRONMENT=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=${{ env.LANDING_GOOGLE_LOGIN_ENABLED }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}"
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Push Release Tag
        id: push_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.version.outputs.tag }}
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "Tag $TAG already exists remotely, skipping tag push."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            - **Environment**: Production
            - **Commit**: ${{ github.sha }}
            - **Deployed Site**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${GITHUB_SHA:0:7}"
          {
            echo "## 🚀 Production Deploy — v${VERSION} (${SHA})"
            echo ""
            echo "| 項目 | 値 |"
            echo "|-----|---|"
            echo "| バージョン | \`${TAG}\` |"
            echo "| コミット | \`${SHA}\` |"
            echo "| Actor | ${{ github.actor }} |"
            echo "| 本番URL | https://my-web-app-b67f4.web.app/ |"
            echo "| Edge Functions | Tier 1: 99本デプロイ済み |"
          } >> $GITHUB_STEP_SUMMARY

  run-batch:
    name: Run Python Analysis Batch
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    continue-on-error: true
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Batch Script
        run: python batch_analysis.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # -----------------------------------------------------------------
  # 通知ジョブ (curlを使用する方式に変更)
  # -----------------------------------------------------------------
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, run-batch]
    if: always()
    environment: production
    permissions:
      contents: read

    steps:
      # 成功時の通知
      - name: Notify Slack on Success
        if: needs.deploy.result == 'success' && needs.run-batch.result == 'success'
        run: |
          cat <<EOF > payload.json
          {
            "text": "✅ Production Deployment & Batch Successful!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "✅ Production Deployment & Batch Successful!" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Environment:*\nProduction" },
                  { "type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`" },
                  { "type": "mrkdwn", "text": "*Commit:*\n\`${{ github.sha }}\`" },
                  { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Workflow" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Deployed Site" },
                    "url": "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }} --max-time 10 || true

      # 失敗時の通知
      - name: Notify Slack on Failure
        if: needs.deploy.result == 'failure' || needs.run-batch.result == 'failure'
        run: |
          cat <<EOF > payload.json
          {
            "text": "❌ Production Deployment or Batch Failed!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "❌ Production Deployment or Batch Failed!" }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*URGENT*: Deployment or Batch has failed. Please investigate!\n\n*Deploy Status:* \`${{ needs.deploy.result }}\`\n*Batch Status:* \`${{ needs.run-batch.result }}\`\n\n*Author:* ${{ github.actor }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Workflow Logs" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "style": "danger"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }} --max-time 10 || true

      - name: Comment on commit
        if: needs.deploy.result == 'success' && needs.run-batch.result == 'success'
        continue-on-error: true  # contents: read では失敗する場合があるため
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'Successfully deployed to **Production** and ran analysis batch!\n\n- **Version**: ${{ needs.deploy.outputs.tag }}\n- **URL**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app'
            })
