name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
      - '.claude/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  # Win版#109: cancel-in-progress を true → false に変更 (deploy保証 100%化)。
  # 5 インスタンス (Win/PS/VSCode/WEB/📱スマホ) 並行 push で
  # cancel-in-progress: true だと cancel 連鎖が発生し全コミットが
  # 反映されない問題が頻発していた (Win#101-#107 で確認)。
  # false にすると同 group で順次実行 (1本ずつ・最大 11分 × 並行数 待機)
  # するが、全 commit が必ず deploy される。
  # group が同じため同時並行はゼロ・GitHub Actions リソース消費は変わらない。
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  ENVIRONMENT: production
  FLUTTER_VERSION: "3.38.x"
  LANDING_GOOGLE_LOGIN_ENABLED: "true"

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 45
    environment:
      name: production

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: write
      # Win版#131 part 9: tag push が workflow file 変更を含む commit を指す場合の
      # GitHub App `workflows` permission 拒否を回避
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Win版#131 part 9: GH_PAT で push 認証 (workflow file 変更を含む tag push)
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ github.run_number }}/" pubspec.yaml

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Run Supabase migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }} --password ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          # Run only unapplied migrations.
          # All migrations use IF NOT EXISTS / ON CONFLICT DO NOTHING so they are
          # safe to run even if the DDL was applied manually before.
          # The old "repair --status applied" loop marked NEW migrations as applied
          # without running their SQL, which caused tables/buckets to be missing.
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      - name: Cleanup consolidated Edge Functions
        run: |
          # EFハードキャップ: 50本以下。Tier1/Tier2廃止。
          # 旧スタンドアロンEFを全削除 — 6つのmacro-hubに統合済み。
          # 2026-04-20 PS版#6 S12: dynamic filter — Supabase に実存する EF のみ delete
          # → 429 ThrottlerException 回避 (178 連続 API call → 実存分のみに削減)
          DEAD_LIST=(
            public-memo-share
            api-docs-generator
            api-key-manager
            audit-trail
            backup-restore
            changelog-manager
            ci-cd-pipeline
            cloud-storage-sync
            code-playground
            code-review-issues
            cohort-analysis
            compensation-manager
            compliance-checker
            content-versioning
            crm-sales-pipeline
            custom-dashboard-builder
            data-pipeline
            data-visualization
            document-collaboration
            edge-function-test-runner
            edge-function-ui-checker
            encrypted-messaging
            financial-report
            gantt-timeline-manager
            geo-checkin
            habit-gamification
            horse-racing-predictor
            integration-connector
            inventory-manager
            live-streaming
            marketplace
            marketplace-reviews
            multi-language
            news-rss-aggregator
            note-sharing-enhanced
            oauth-sso-provider
            ocr-document-scanner
            order-tracker
            payment-processor
            push-notification-manager
            rate-limiter-enhanced
            real-estate-tracker
            realtime-presence
            scheduled-notifications
            smart-home-automation
            smart-search
            social-stories
            spreadsheet-database
            status-page
            task-dependency
            user-onboarding
            video-audio-manager
            voice-memo-transcriber
            whiteboard-canvas
            wiki-database
            get-ogp
            get-public-memo-ogp
            note-comments
            notification-center
            user-profile-manager
            onboarding-flow
            feature-request-manager
            app-analytics-dashboard
            system-status
            personal-dashboard
            notify-feature-request
            user-feedback-collector
            growth-command-center
            growth-referral
            growth-share-signal
            growth-achievement-summary
            growth-import-preview
            growth-import-commit
            get-growth-roadmap-progress
            video-ad-generator
            viral-share-engine
            x-media-post
            growth-automation-controller
            referral-program
            share-quote
            generate-quote-image
            seo-optimizer
            send-waitlist-notification
            viral-ad-generator
            viral-growth-engine
            ai-search
            ai-suggest-tags
            ai-secretary
            ai-summarizer
            agent-hub
            virtual-organization
            my-ai-agent
            generate-daily-challenges
            trigger-analysis
            analyze-reality
            get-admin-users
            submit-feedback
            get-support-tickets
            get-competitor-features
            import-from-competitors
            health-check
            get-competitor-monitoring
            edge-function-coverage
            content-moderation
            user-activity-tracker
            department-reporting
            issue-auto-resolver
            subscription-management
            subscription-billing
            email-service
            gamification-engine
            calendar-events
            kanban-board
            chat-messaging
            team-task-manager
            team-collaboration-sync
            file-storage-manager
            expense-tracker
            time-tracker
            automation-workflows
            webhook-manager
            api-rate-limiter
            music-collaboration
            schedule-daily-digest
            schedule-manager
            post-x-update
            blog-post-manager
            blog-auto-publisher
            poll-survey
            reading-list
            password-generator
            clipboard-history
            quick-note
            pomodoro-timer
            weather-widget
            currency-converter
            markdown-renderer
            social-proof-generator
            contact-manager
            goal-tracker
            template-library
            tag-manager
            habit-tracker
            bookmark-manager
            invoice-generator
            notification-preferences
            revenue-forecaster
            ab-testing-manager
            search-analytics
            competitor-feature-sync
            user-growth-analytics
            growth-acquisition-signal
            growth-acquisition-report
            schedule-task-monitor
            schedule-health-check
            schedule-result-tracker
            schedule-execution-logger
            agent-runtime-cycle
            agent-personality
            agent-department-manager
            agent-task-router
            agent-performance-monitor
            reply-support-request
            development-stats
            check-competitor-updates
            viral-growth-pipeline
          )
          EXISTING=$(supabase functions list --output json 2>/dev/null | jq -r '.[] | (.slug // .name // empty)' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            echo "::warning::supabase functions list returned empty — skipping cleanup"
            exit 0
          fi
          DELETED=0
          for fn in "${DEAD_LIST[@]}"; do
            if echo "$EXISTING" | grep -qx "$fn"; then
              echo "deleting $fn"
              supabase functions delete "$fn" || true
              DELETED=$((DELETED+1))
              sleep 0.3
            fi
          done
          echo "::notice::cleanup deleted $DELETED stale EF(s)"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Supabase Edge Functions
        run: |
          # EFハードキャップ: 50本以下 (Tier1/Tier2廃止 — 2026-04-12 VSCode版#61)
          # 全250本を16本のhubにaction分岐統合 (11 hub + 5 standalone)。新規機能は既存hubへのaction追加のみ。
          # 新しいEFを作成する場合は必ず既存hubの数を減らして50本以下を維持すること。
          #
          # All browser-facing functions use --no-verify-jwt so that CORS OPTIONS
          # preflight requests (which carry no Authorization header) are not
          # rejected by Supabase's platform-level JWT check.

          # --- Standalone (5本: 複雑すぎてhub統合困難) ---
          # local-election-intelligence は line 275 にあり (並び順維持のため)
          supabase functions deploy get-home-dashboard --no-verify-jwt
          supabase functions deploy ai-assistant --no-verify-jwt
          supabase functions deploy growth-weekly-digest --no-verify-jwt
          supabase functions deploy guitar-recording-studio --no-verify-jwt

          # --- Macro-Hub (6本: 旧Tier1全統合) ---
          supabase functions deploy core-hub --no-verify-jwt
          supabase functions deploy growth-hub --no-verify-jwt
          supabase functions deploy ai-hub --no-verify-jwt
          supabase functions deploy admin-hub --no-verify-jwt
          supabase functions deploy app-hub --no-verify-jwt
          supabase functions deploy schedule-hub --no-verify-jwt

          # --- Mega-Hub (5本: 旧Tier2全統合) ---
          supabase functions deploy tools-hub --no-verify-jwt
          supabase functions deploy media-hub --no-verify-jwt
          supabase functions deploy enterprise-hub --no-verify-jwt
          supabase functions deploy social-commerce-hub --no-verify-jwt
          supabase functions deploy lifestyle-hub --no-verify-jwt
          supabase functions deploy local-election-intelligence --no-verify-jwt

          # --- Public-facing standalone (2本: server-side OGP + 匿名 IP-based reactions) ---
          # 一度 core-hub に統合したが、IP-based 匿名トラッキング・server-side OGP rendering の
          # 都合で分離維持 (Win版#85, 2026-04-18)
          # get-public-memo-preview: directory deleted — removed from deploy (2026-04-19)
          supabase functions deploy memo-reactions --no-verify-jwt

          # Total: 17 functions deployed (ハードキャップ50本に対し17本 — 余裕33本)
          #
          # Hub対応表:
          # core-hub:         public-memo-share, memo-reactions, get-ogp, get-public-memo-ogp,
          #   note-comments, notification-center, user-profile-manager, onboarding-flow,
          #   feature-request-manager, user-feedback-collector, notify-feature-request,
          #   personal-dashboard, system-status, development-achievements, app-analytics-dashboard
          # growth-hub:       growth-acquisition, growth-command-center, growth-referral,
          #   growth-share-signal, growth-achievement-summary, growth-import-preview,
          #   growth-import-commit, get-growth-roadmap-progress, video-ad-generator,
          #   viral-share-engine, x-media-post, growth-automation-controller, landing-ab-test,
          #   referral-program, share-quote, generate-quote-image, seo-optimizer,
          #   send-waitlist-notification, viral-ad-generator, viral-growth-engine
          # ai-hub:           daily-judgment, ai-search, ai-suggest-tags, ai-secretary,
          #   ai-summarizer, agent-hub, virtual-organization, my-ai-agent, generate-daily-challenges,
          #   trigger-analysis, analyze-reality, local-election-intelligence,
          #   ai-university-content, ai-university-streaks, ai-university-badges
          # admin-hub:        get-admin-users, submit-feedback, get-support-tickets,
          #   get-competitor-features, import-from-competitors, health-check,
          #   get-competitor-monitoring, edge-function-coverage, content-moderation,
          #   user-activity-tracker, department-reporting, admin-notification-hub, issue-auto-resolver
          # app-hub:          subscription-management, subscription-billing, email-service,
          #   gamification-engine, calendar-events, kanban-board, chat-messaging, team-task-manager,
          #   team-collaboration-sync, file-storage-manager, expense-tracker, time-tracker,
          #   automation-workflows, data-export-manager, webhook-manager, api-rate-limiter,
          #   music-collaboration
          # schedule-hub:     schedule-daily-digest, schedule-manager, post-x-update,
          #   blog-post-manager, blog-auto-publisher
          # tools-hub:        30本 (password/qr/weather/bookmark/habit/pomodoro等)
          # media-hub:        18本 (video/audio/whiteboard/esign等) + music-collaboration
          # enterprise-hub:   42本 (HR/analytics/CI/AI-writing/CRM等)
          # social-commerce-hub: 26本 (SNS/EC/payment/loyalty等)
          # lifestyle-hub:    29本 (health/travel/IoT/notification等)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build Flutter Web (Production)
        run: |
          flutter build web \
            --release \
            --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENVIRONMENT=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=${{ env.LANDING_GOOGLE_LOGIN_ENABLED }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true  # 509 Bandwidth Exceeded 発生中 (2026-04-18) — 復旧後に削除
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}"
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Push Release Tag
        id: push_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.version.outputs.tag }}
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "Tag $TAG already exists remotely, skipping tag push."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            - **Environment**: Production
            - **Commit**: ${{ github.sha }}
            - **Deployed Site**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${GITHUB_SHA:0:7}"
          {
            echo "## 🚀 Production Deploy — v${VERSION} (${SHA})"
            echo ""
            echo "| 項目 | 値 |"
            echo "|-----|---|"
            echo "| バージョン | \`${TAG}\` |"
            echo "| コミット | \`${SHA}\` |"
            echo "| Actor | ${{ github.actor }} |"
            echo "| 本番URL | https://my-web-app-b67f4.web.app/ |"
            echo "| Edge Functions | 15本デプロイ済み (ハードキャップ50本以下) |"
          } >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------
  # 通知ジョブ
  # -----------------------------------------------------------------
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    environment: production
    permissions:
      contents: write

    steps:
      - name: Notify Slack on Success
        if: needs.deploy.result == 'success'
        run: |
          cat <<EOF > payload.json
          {
            "text": "✅ Production Deployment Successful!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "✅ Production Deployment Successful!" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Environment:*\nProduction" },
                  { "type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`" },
                  { "type": "mrkdwn", "text": "*Commit:*\n\`${{ github.sha }}\`" },
                  { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Workflow" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Site" },
                    "url": "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }} --max-time 10 || true

      - name: Notify Slack on Failure
        if: needs.deploy.result == 'failure'
        run: |
          cat <<EOF > payload.json
          {
            "text": "❌ Production Deployment Failed!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "❌ Production Deployment Failed!" }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deploy Status:* \`${{ needs.deploy.result }}\`\n*Author:* ${{ github.actor }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Logs" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "style": "danger"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }} --max-time 10 || true

      - name: Comment on commit
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'Successfully deployed to **Production**!\n\n- **Version**: ${{ needs.deploy.outputs.tag }}\n- **URL**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app'
            })
