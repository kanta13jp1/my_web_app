name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  ENVIRONMENT: production
  FLUTTER_VERSION: "3.38.x"
  LANDING_GOOGLE_LOGIN_ENABLED: "true"

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 45
    environment:
      name: production

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ github.run_number }}/" pubspec.yaml

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Run Supabase migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }} --password ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          # Run only unapplied migrations.
          # All migrations use IF NOT EXISTS / ON CONFLICT DO NOTHING so they are
          # safe to run even if the DDL was applied manually before.
          # The old "repair --status applied" loop marked NEW migrations as applied
          # without running their SQL, which caused tables/buckets to be missing.
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      - name: Cleanup consolidated Edge Functions
        run: |
          # EFハードキャップ: 50本以下。Tier1/Tier2廃止。
          # 旧スタンドアロンEFを全削除 — 6つのmacro-hubに統合済み。
          # Using || true so deleting a non-existent function never fails the CI.
          # --- core-hub に統合 ---
          supabase functions delete public-memo-share || true
          supabase functions delete memo-reactions || true
          supabase functions delete get-ogp || true
          supabase functions delete get-public-memo-ogp || true
          supabase functions delete note-comments || true
          supabase functions delete notification-center || true
          supabase functions delete user-profile-manager || true
          supabase functions delete onboarding-flow || true
          supabase functions delete feature-request-manager || true
          supabase functions delete app-analytics-dashboard || true
          supabase functions delete development-achievements || true
          supabase functions delete system-status || true
          supabase functions delete personal-dashboard || true
          supabase functions delete notify-feature-request || true
          supabase functions delete user-feedback-collector || true
          # --- growth-hub に統合 ---
          supabase functions delete growth-acquisition || true
          supabase functions delete growth-command-center || true
          supabase functions delete growth-referral || true
          supabase functions delete growth-share-signal || true
          supabase functions delete growth-achievement-summary || true
          supabase functions delete growth-import-preview || true
          supabase functions delete growth-import-commit || true
          supabase functions delete get-growth-roadmap-progress || true
          supabase functions delete video-ad-generator || true
          supabase functions delete viral-share-engine || true
          supabase functions delete x-media-post || true
          supabase functions delete growth-automation-controller || true
          supabase functions delete landing-ab-test || true
          supabase functions delete referral-program || true
          supabase functions delete share-quote || true
          supabase functions delete generate-quote-image || true
          supabase functions delete seo-optimizer || true
          supabase functions delete send-waitlist-notification || true
          supabase functions delete viral-ad-generator || true
          supabase functions delete viral-growth-engine || true
          # --- ai-hub に統合 ---
          supabase functions delete daily-judgment || true
          supabase functions delete ai-search || true
          supabase functions delete ai-suggest-tags || true
          supabase functions delete ai-secretary || true
          supabase functions delete ai-summarizer || true
          supabase functions delete agent-hub || true
          supabase functions delete virtual-organization || true
          supabase functions delete my-ai-agent || true
          supabase functions delete generate-daily-challenges || true
          supabase functions delete trigger-analysis || true
          supabase functions delete analyze-reality || true
          # local-election-intelligence: standalone (complex scraping logic, kept separate)
          supabase functions delete ai-university-content || true
          supabase functions delete ai-university-streaks || true
          supabase functions delete ai-university-badges || true
          # --- admin-hub に統合 ---
          supabase functions delete get-admin-users || true
          supabase functions delete submit-feedback || true
          supabase functions delete get-support-tickets || true
          supabase functions delete get-competitor-features || true
          supabase functions delete import-from-competitors || true
          supabase functions delete health-check || true
          supabase functions delete get-competitor-monitoring || true
          supabase functions delete edge-function-coverage || true
          supabase functions delete content-moderation || true
          supabase functions delete user-activity-tracker || true
          supabase functions delete department-reporting || true
          supabase functions delete admin-notification-hub || true
          supabase functions delete issue-auto-resolver || true
          # --- app-hub に統合 ---
          supabase functions delete subscription-management || true
          supabase functions delete subscription-billing || true
          supabase functions delete email-service || true
          supabase functions delete gamification-engine || true
          supabase functions delete calendar-events || true
          supabase functions delete kanban-board || true
          supabase functions delete chat-messaging || true
          supabase functions delete team-task-manager || true
          supabase functions delete team-collaboration-sync || true
          supabase functions delete file-storage-manager || true
          supabase functions delete expense-tracker || true
          supabase functions delete time-tracker || true
          supabase functions delete automation-workflows || true
          supabase functions delete data-export-manager || true
          supabase functions delete webhook-manager || true
          supabase functions delete api-rate-limiter || true
          supabase functions delete music-collaboration || true
          # --- schedule-hub に統合 ---
          supabase functions delete schedule-daily-digest || true
          supabase functions delete schedule-manager || true
          supabase functions delete post-x-update || true
          supabase functions delete blog-post-manager || true
          supabase functions delete blog-auto-publisher || true
          # --- 旧Tier2整理 ---
          supabase functions delete poll-survey || true
          supabase functions delete reading-list || true
          supabase functions delete password-generator || true
          supabase functions delete clipboard-history || true
          supabase functions delete quick-note || true
          supabase functions delete pomodoro-timer || true
          supabase functions delete weather-widget || true
          supabase functions delete currency-converter || true
          supabase functions delete markdown-renderer || true
          supabase functions delete gemini-election-analysis || true
          supabase functions delete social-proof-generator || true
          supabase functions delete contact-manager || true
          supabase functions delete goal-tracker || true
          supabase functions delete template-library || true
          supabase functions delete tag-manager || true
          supabase functions delete habit-tracker || true
          supabase functions delete bookmark-manager || true
          supabase functions delete invoice-generator || true
          supabase functions delete notification-preferences || true
          supabase functions delete revenue-forecaster || true
          supabase functions delete ab-testing-manager || true
          supabase functions delete search-analytics || true
          supabase functions delete competitor-feature-sync || true
          supabase functions delete user-growth-analytics || true
          supabase functions delete growth-acquisition-signal || true
          supabase functions delete growth-acquisition-report || true
          supabase functions delete schedule-task-monitor || true
          supabase functions delete schedule-health-check || true
          supabase functions delete schedule-result-tracker || true
          supabase functions delete schedule-execution-logger || true
          supabase functions delete agent-runtime-cycle || true
          supabase functions delete agent-personality || true
          supabase functions delete agent-department-manager || true
          supabase functions delete agent-task-router || true
          supabase functions delete agent-performance-monitor || true
          supabase functions delete reply-support-request || true
          supabase functions delete get-public-memo-preview || true
          supabase functions delete development-stats || true
          supabase functions delete check-competitor-updates || true
          supabase functions delete viral-growth-pipeline || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Supabase Edge Functions
        run: |
          # EFハードキャップ: 50本以下 (Tier1/Tier2廃止 — 2026-04-12 VSCode版#61)
          # 全250本を15のhubにaction分岐統合。新規機能は既存hubへのaction追加のみ。
          # 新しいEFを作成する場合は必ず既存hubの数を減らして50本以下を維持すること。
          #
          # All browser-facing functions use --no-verify-jwt so that CORS OPTIONS
          # preflight requests (which carry no Authorization header) are not
          # rejected by Supabase's platform-level JWT check.

          # --- Standalone (3本: 複雑すぎてhub統合困難) ---
          supabase functions deploy get-home-dashboard --no-verify-jwt
          supabase functions deploy ai-assistant --no-verify-jwt
          supabase functions deploy growth-weekly-digest --no-verify-jwt
          supabase functions deploy guitar-recording-studio --no-verify-jwt

          # --- Macro-Hub (6本: 旧Tier1全統合) ---
          supabase functions deploy core-hub --no-verify-jwt
          supabase functions deploy growth-hub --no-verify-jwt
          supabase functions deploy ai-hub --no-verify-jwt
          supabase functions deploy admin-hub --no-verify-jwt
          supabase functions deploy app-hub --no-verify-jwt
          supabase functions deploy schedule-hub --no-verify-jwt

          # --- Mega-Hub (5本: 旧Tier2全統合) ---
          supabase functions deploy tools-hub --no-verify-jwt
          supabase functions deploy media-hub --no-verify-jwt
          supabase functions deploy enterprise-hub --no-verify-jwt
          supabase functions deploy social-commerce-hub --no-verify-jwt
          supabase functions deploy lifestyle-hub --no-verify-jwt
          supabase functions deploy local-election-intelligence --no-verify-jwt

          # Total: 16 functions deployed (ハードキャップ50本に対し16本 — 余裕34本)
          #
          # Hub対応表:
          # core-hub:         public-memo-share, memo-reactions, get-ogp, get-public-memo-ogp,
          #   note-comments, notification-center, user-profile-manager, onboarding-flow,
          #   feature-request-manager, user-feedback-collector, notify-feature-request,
          #   personal-dashboard, system-status, development-achievements, app-analytics-dashboard
          # growth-hub:       growth-acquisition, growth-command-center, growth-referral,
          #   growth-share-signal, growth-achievement-summary, growth-import-preview,
          #   growth-import-commit, get-growth-roadmap-progress, video-ad-generator,
          #   viral-share-engine, x-media-post, growth-automation-controller, landing-ab-test,
          #   referral-program, share-quote, generate-quote-image, seo-optimizer,
          #   send-waitlist-notification, viral-ad-generator, viral-growth-engine
          # ai-hub:           daily-judgment, ai-search, ai-suggest-tags, ai-secretary,
          #   ai-summarizer, agent-hub, virtual-organization, my-ai-agent, generate-daily-challenges,
          #   trigger-analysis, analyze-reality, local-election-intelligence,
          #   ai-university-content, ai-university-streaks, ai-university-badges
          # admin-hub:        get-admin-users, submit-feedback, get-support-tickets,
          #   get-competitor-features, import-from-competitors, health-check,
          #   get-competitor-monitoring, edge-function-coverage, content-moderation,
          #   user-activity-tracker, department-reporting, admin-notification-hub, issue-auto-resolver
          # app-hub:          subscription-management, subscription-billing, email-service,
          #   gamification-engine, calendar-events, kanban-board, chat-messaging, team-task-manager,
          #   team-collaboration-sync, file-storage-manager, expense-tracker, time-tracker,
          #   automation-workflows, data-export-manager, webhook-manager, api-rate-limiter,
          #   music-collaboration
          # schedule-hub:     schedule-daily-digest, schedule-manager, post-x-update,
          #   blog-post-manager, blog-auto-publisher
          # tools-hub:        30本 (password/qr/weather/bookmark/habit/pomodoro等)
          # media-hub:        18本 (video/audio/whiteboard/esign等) + music-collaboration
          # enterprise-hub:   42本 (HR/analytics/CI/AI-writing/CRM等)
          # social-commerce-hub: 26本 (SNS/EC/payment/loyalty等)
          # lifestyle-hub:    29本 (health/travel/IoT/notification等)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build Flutter Web (Production)
        run: |
          flutter build web \
            --release \
            --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENVIRONMENT=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=LANDING_GOOGLE_LOGIN_ENABLED=${{ env.LANDING_GOOGLE_LOGIN_ENABLED }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}"
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Push Release Tag
        id: push_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.version.outputs.tag }}
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "Tag $TAG already exists remotely, skipping tag push."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            - **Environment**: Production
            - **Commit**: ${{ github.sha }}
            - **Deployed Site**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${GITHUB_SHA:0:7}"
          {
            echo "## 🚀 Production Deploy — v${VERSION} (${SHA})"
            echo ""
            echo "| 項目 | 値 |"
            echo "|-----|---|"
            echo "| バージョン | \`${TAG}\` |"
            echo "| コミット | \`${SHA}\` |"
            echo "| Actor | ${{ github.actor }} |"
            echo "| 本番URL | https://my-web-app-b67f4.web.app/ |"
            echo "| Edge Functions | 15本デプロイ済み (ハードキャップ50本以下) |"
          } >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------
  # 通知ジョブ
  # -----------------------------------------------------------------
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    environment: production
    permissions:
      contents: write

    steps:
      - name: Notify Slack on Success
        if: needs.deploy.result == 'success'
        run: |
          cat <<EOF > payload.json
          {
            "text": "✅ Production Deployment Successful!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "✅ Production Deployment Successful!" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Environment:*\nProduction" },
                  { "type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`" },
                  { "type": "mrkdwn", "text": "*Commit:*\n\`${{ github.sha }}\`" },
                  { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Workflow" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Site" },
                    "url": "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }} --max-time 10 || true

      - name: Notify Slack on Failure
        if: needs.deploy.result == 'failure'
        run: |
          cat <<EOF > payload.json
          {
            "text": "❌ Production Deployment Failed!",
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "❌ Production Deployment Failed!" }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deploy Status:* \`${{ needs.deploy.result }}\`\n*Author:* ${{ github.actor }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Logs" },
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "style": "danger"
                  }
                ]
              }
            ]
          }
          EOF
          curl -X POST -H 'Content-type: application/json' --data @payload.json ${{ secrets.SLACK_WEBHOOK_URL }} --max-time 10 || true

      - name: Comment on commit
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'Successfully deployed to **Production**!\n\n- **Version**: ${{ needs.deploy.outputs.tag }}\n- **URL**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app'
            })
