name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ワークフロー全体に必要な権限
permissions:
  contents: write
  pull-requests: write

env:
  ENVIRONMENT: production
  FLUTTER_VERSION: '3.38.x'

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: production
      url: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
    
    # 次のジョブ(notify)へバージョン情報を渡す設定
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴を取得（タグベースのバージョニングに必須）

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generate version from git tags
      - name: Generate version
        id: version
        run: |
          # タグがない場合は v1.0.0 を開始点とする
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          # 先頭の 'v' を削除
          VERSION=${LATEST_TAG#v}
          # パッチバージョンをインクリメント
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          # Output設定
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          
          echo "Previous version: $VERSION"
          echo "New version: $NEW_VERSION"

      # pubspec.yaml のバージョンを更新
      - name: Update pubspec.yaml version
        run: |
          echo "Updating pubspec.yaml to version ${{ steps.version.outputs.version }}+${{ github.run_number }}"
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}+${{ github.run_number }}/" pubspec.yaml
          cat pubspec.yaml | grep "version:"

      # Supabase Migration (Production)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        run: |
          echo "Running Supabase migrations for production..."
          # プロジェクトリンク（パスワードは非対話式のため環境変数で渡すことを推奨）
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }} --password ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          # 本番環境への適用 (db push は破壊的変更のリスクがあるため注意。安定運用なら migration up 推奨)
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # linkコマンドの引数で渡せない場合のための予備
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      # Build Flutter Web (Production)
      #  修正: --no-tree-shake-icons を追加してアイコン削除エラーを回避
      - name: Build Flutter Web (Production)
        run: |
          flutter build web \
            --release \
            --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=ENVIRONMENT=production \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}

      - name: Verify build output
        run: |
          if [ ! -d "build/web" ]; then
            echo "Build failed: build/web directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la build/web
          du -sh build/web

      # Deploy to Firebase Hosting (Production)
      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # Create Release Tag
      # 注: release作成アクションがタグ作成も兼ねるため、手動プッシュは省略可能です
      # もし手動で確実に打ちたい場合はこのステップを残してください
      - name: Push Release Tag
        id: push_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}

      # Create GitHub Release (推奨アクションへの変更)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ##  Release ${{ steps.version.outputs.version }}
            
            ### Deployment Information
            - **Environment**: Production
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}
            - **Commit**: ${{ github.sha }}
            - **Author**: ${{ github.actor }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### URLs
            - **Production**: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    # 環境変数を読み込むためにenvironmentを指定
    environment: production

    permissions:
      contents: write

    steps:
      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": " Production deployment successful!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": " Production Deployment Successful!"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Environment:* Production\n*Version:* `${{ needs.deploy.outputs.tag }}`\n*Branch:* `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}\n*URL:* https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": " Production deployment failed!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": " Production Deployment Failed!"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Environment:* Production\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n\n *URGENT*: Production deployment has failed. Please investigate immediately!"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on commit
        if: needs.deploy.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: ' Successfully deployed to **Production** environment!\n\n Version: ${{ needs.deploy.outputs.tag }}\n URL: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app'
            })
