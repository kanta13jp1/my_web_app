          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }} --password ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          # Repair known stuck migrations (duplicate key from aborted deploys).
          # All are idempotent (ON CONFLICT DO NOTHING / IF NOT EXISTS / UPDATE).
